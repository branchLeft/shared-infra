# One small hand-written theme, no modules and no network. Relative URLs, so nothing in the
# output names a host. Every embedded third-party service is off.
baseURL = "/"
languageCode = "en"
title = "shared-infra"
relativeURLs = true
canonifyURLs = false
disableKinds = ["RSS", "sitemap", "robotsTXT", "taxonomy", "term"]
enableRobotsTXT = false
disableHugoGeneratorInject = true

[outputs]
  home = ["HTML", "JSON"]

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.twitter]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    disable = true

[services]
  [services.disqus]
    shortname = ""
  [services.googleAnalytics]
    id = ""
