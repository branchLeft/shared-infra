# Stalwart on mx1. Pinned to an exact patch version, not `latest` or the
# floating `v0.16` tag -- an unattended minor bump on a mail server that
# signs and receives production traffic is not a surprise worth having.
# Bump deliberately, re-running 30-deploy-stalwart.sh after editing the tag.
#
# Port 8080 (webadmin + JMAP management API) is published to 127.0.0.1 only
# -- see mail/RUNBOOK-mx1-provision.md for the SSH-tunnel access path. Every
# other published port matches mail/firewall.ts's inbound rule set exactly;
# a port must be added there before it does anything being reachable here.
services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.17
    container_name: stalwart
    restart: unless-stopped
    environment:
      STALWART_HOSTNAME: mx1.branchleft.co.uk
      # Basic-auth secret for the Prometheus exporter, read by Stalwart via
      # the `EnvironmentVariable` secret variant so the plaintext never
      # enters the settings store or this repo. Written once into `.env`
      # beside this file -- see mail/RUNBOOK-mx1-prometheus-metrics.md. No
      # default: an unset value makes Stalwart fail the credential rather
      # than silently serve the endpoint open, which is the failure that
      # matters on a listener bound to [::]:443.
      STALWART_PROMETHEUS_SECRET: ${STALWART_PROMETHEUS_SECRET:?set in .env beside this compose file}
    ports:
      - '127.0.0.1:8080:8080'
      - '25:25'
      - '443:443'
      - '465:465'
      - '587:587'
      - '993:993'
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart

volumes:
  stalwart-etc:
  stalwart-data:
