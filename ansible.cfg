# Where Ansible and ansible-lint find the pinned collections (ANS-4): the
# directory the vendored artifacts are installed into, from ansible/README.md.
# The harness and CI set ANSIBLE_COLLECTIONS_PATH themselves, which wins over
# this file. CODEOWNERS covers it, and ansible/checks/check_pins.py keeps it to
# this one setting.
[defaults]
collections_path = .ansible/collections
