version: 2

updates:
  # Root: lint/format tooling and shared scripts.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  # Hetzner edge provisioning scripts and tooling.
  - package-ecosystem: 'npm'
    directory: '/hetzner'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  # Hetzner host provisioning and deploy helpers.
  - package-ecosystem: 'npm'
    directory: '/hetzner-host'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  # Mail stack tooling and dependencies.
  - package-ecosystem: 'npm'
    directory: '/mail'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  # Watches only hetzner/edge/stack/compose.yml's pinned crowdsec image.
  # A bump here is also what makes crowdsec/config.yaml.local's
  # `cscli.hub_branch: master` pin correct again once upstream ships past
  # the pinned release -- but merging restarts the edge container and
  # briefly interrupts TLS for branchleft.co.uk, so each PR this opens
  # needs a deliberate, individually reviewed merge rather than the batched
  # minor/patch auto-merge every other ecosystem entry in this org groups
  # towards. No `groups:` here on purpose.
  - package-ecosystem: 'docker-compose'
    directory: '/hetzner/edge/stack'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    allow:
      - dependency-name: 'crowdsecurity/crowdsec'
    labels:
      - 'dependencies'

  # The Ansible toolchain lock (ANS-4): ansible/requirements.txt pins every
  # package with its hashes, the `ansible` package among them, which carries the
  # collections the roles use. A new `ansible` release is how a collection
  # update or fix reaches this repository. One group, so the packages that must
  # move together (ansible, ansible-core) arrive in one pull request that the
  # Ansible workflow tests; ansible/checks/check_pins.py fails if this entry goes.
  - package-ecosystem: 'pip'
    directory: '/ansible'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      ansible-toolchain:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  # GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
      - 'github-actions'
