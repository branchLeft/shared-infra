version: 2

updates:
  # Root: lint/format tooling and shared scripts.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      npm-all:
        applies-to: version-updates
        patterns:
          - '*'
    labels:
      - 'dependencies'

  # Hetzner edge provisioning scripts and tooling.
  - package-ecosystem: 'npm'
    directory: '/hetzner'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      npm-all:
        applies-to: version-updates
        patterns:
          - '*'
    labels:
      - 'dependencies'

  # Hetzner host provisioning and deploy helpers.
  - package-ecosystem: 'npm'
    directory: '/hetzner-host'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      npm-all:
        applies-to: version-updates
        patterns:
          - '*'
    labels:
      - 'dependencies'

  # Mail stack tooling and dependencies.
  - package-ecosystem: 'npm'
    directory: '/mail'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      npm-all:
        applies-to: version-updates
        patterns:
          - '*'
    labels:
      - 'dependencies'

  # Watches only hetzner/edge/stack/compose.yml's pinned crowdsec image.
  # A bump here is also what makes crowdsec/config.yaml.local's
  # `cscli.hub_branch: master` pin correct again once upstream ships past
  # the pinned release -- but merging restarts the edge container and
  # briefly interrupts TLS for branchleft.co.uk, so each PR this opens
  # needs a deliberate, individually reviewed merge rather than the batched
  # minor/patch auto-merge every other ecosystem entry in this org groups
  # towards. No `groups:` here on purpose.
  - package-ecosystem: 'docker-compose'
    directory: '/hetzner/edge/stack'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    allow:
      - dependency-name: 'crowdsecurity/crowdsec'
    labels:
      - 'dependencies'

  # The Ansible toolchain lock (ANS-4): ansible/requirements.txt is `uv pip
  # compile` output of ansible/requirements.in, with every package's hashes. The
  # `uv` ecosystem reruns that command from the header the file keeps, so a bump
  # re-resolves the whole lock; `pip` would run pip-compile, which cannot write a
  # universal lock. The `ansible` package carries the collections the roles use,
  # so a new release is how a collection update reaches this repository.
  # ansible/checks/check_pins.py fails if this entry goes.
  - package-ecosystem: 'uv'
    directory: '/ansible'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      ansible-toolchain:
        applies-to: version-updates
        patterns:
          - '*'
    labels:
      - 'dependencies'

  # The one pip the lock-reader parity test asks (ansible/checks/pip-requirements.txt:
  # a single hashed pin, installed before the lock in the CI tool environments).
  # A bump is its own pull request on purpose: the parity table is re-checked
  # against the new pip's req_file before it merges (ansible/checks/README.md).
  # ansible/checks/check_pins.py fails if this entry goes.
  - package-ecosystem: 'pip'
    directory: '/ansible/checks'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'

  # GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'github-actions'
