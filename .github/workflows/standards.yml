name: Standards

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue reports checks only from this event.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# One run per pull request. A push or merge_group run is its own group and is
# never cancelled (pinned by scripts/test_workflow_concurrency.py).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a push to main, the gate is skipped when the merge queue already ran it green on this
  # exact commit (scripts/queue_proof.py). Pull requests and the queue always run it.
  queue-proof:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.judge.outputs.tested }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the merge queue runs of this workflow for the pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: gh api "repos/$REPO/actions/workflows/standards.yml/runs?head_sha=$SHA&per_page=100" > "$RUNNER_TEMP/runs.json" || echo '{}' > "$RUNNER_TEMP/runs.json"

      - name: Judge the proof
        id: judge
        env:
          SHA: ${{ github.sha }}
        run: python3 scripts/queue_proof.py --runs "$RUNNER_TEMP/runs.json" --sha "$SHA" --workflow .github/workflows/standards.yml >> "$GITHUB_OUTPUT"

  standards:
    needs: queue-proof
    # Fail open: a skipped or unreadable proof leaves tested unset, so the gate runs in full.
    # !cancelled(), not always(): a cancelled run does not start the gate job.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.queue-proof.outputs.tested != 'true') }}
    uses: branchLeft/standards/.github/workflows/standards.yml@v0.8.8
