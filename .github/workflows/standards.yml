name: Standards

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue reports checks only from this event.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# One run per pull request. A push or merge_group run is its own group and is
# never cancelled (pinned by scripts/test_workflow_concurrency.py).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standards:
    uses: branchLeft/standards/.github/workflows/standards.yml@v0.8.4
