name: docs-lint

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue reports checks only from this event.
  merge_group:
    types: [checks_requested]

# One run per pull request. A push or merge_group run is its own group and is
# never cancelled (pinned by scripts/test_workflow_concurrency.py).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the diff touches a file docs-lint classifies: markdown, HTML,
  # the code extensions it scans for comments, and its own mode and ignore files.
  # It runs on every event, so the gate below always has a result to read.
  changes:
    name: Decide whether docs-lint has input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scan: ${{ steps.changes.outputs.scan }}
    steps:
      # Full history, so the base commit of the diff below exists on the runner.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A base the runner cannot resolve (a new branch, a forced push) counts as
      # changed, so the lint runs rather than being skipped. A merge queue entry
      # is diffed from its own base and head, the tree the queue will merge.
      - name: Diff the event's commits
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          scan=true
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null && git cat-file -e "${HEAD}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${BASE}...${HEAD}")
            if ! printf '%s\n' "$changed" | grep -Eq '(\.(md|mdx|html|ts|tsx|js|jsx|mjs|cjs|py|sh|bash|ya?ml|tf)$)|(^\.docs-lint)'; then
              scan=false
            fi
          fi
          echo "scan=${scan}" >> "$GITHUB_OUTPUT"
          echo "docs-lint has input to scan: ${scan}"

  docs-lint-run:
    needs: changes
    if: needs.changes.outputs.scan == 'true'
    permissions:
      contents: read
    uses: branchLeft/github-workflows/.github/workflows/docs-lint.yml@v1.2.2

  # The check the ruleset requires, and the one the merge queue reports. It always
  # runs, so a change with nothing to scan still reports. It fails unless the lint
  # succeeded whenever the decision above found input to scan.
  docs-lint:
    needs: [changes, docs-lint-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the lint when it had input
        env:
          CHANGES: ${{ needs.changes.result }}
          SCAN: ${{ needs.changes.outputs.scan }}
          LINT: ${{ needs.docs-lint-run.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != "success" ]; then
            echo "The change decision reported: $CHANGES"
            exit 1
          fi
          if [ "$SCAN" = "false" ]; then
            echo "No file docs-lint classifies changed, so there was nothing to scan. This is a pass."
            exit 0
          fi
          if [ "$SCAN" != "true" ]; then
            echo "The change decision did not report whether there was input: '$SCAN'"
            exit 1
          fi
          if [ "$LINT" != "success" ]; then
            echo "The docs-lint run reported: $LINT"
            exit 1
          fi
