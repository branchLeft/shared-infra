name: Ansible delivery

# Delivers the Ansible roles to the hosts by the gated pull (ANS-17). It calls the
# reusable workflow of branchLeft/github-workflows, which lints, runs Molecule over
# every role and pattern, asks each host in check mode what this commit would change,
# and then waits on the deployment environment below before the apply. The merge queue runs
# the lint and the unit tests only, and the container shards ran on the pull request, so this
# is the run that tests the merged tree in containers before any host is asked. It tests the
# roles and patterns the changes since the last tested delivery call for (the select job,
# ansible/checks/delivery_select.py, with the rules of the pull request gate), and every role and
# pattern whenever it cannot say which: a failed selection never runs fewer.
#
# It runs on a push to main and on nothing else. A pull request is gated by
# ansible.yml, whose required check keeps its name. No pull request, schedule or
# manual run may reach a host, and no `paths:` filter may skip a delivery.
#
# The environment is its own, not `production` or `production-mail`: those release the
# Pulumi applies in ci.yml, and one approval must not release both. The owner creates
# it before the first run, with all of these set:
#   - required reviewer: one user, the single owner account the probe accepts, alone, no team and no other user;
#   - Prevent self-review: ticked, so the person who merged a change cannot approve its deploy;
#   - Allow administrators to bypass configured protection rules: ticked, so the owner is never blocked from an administrator bypass to take an apply (owner ruling, 1 Nov 2026);
#   - deployment branches: main only;
#   - environment secrets: ssh_apply_key and ssh_host_apply_keys (the per-host apply keys, one JSON
#     object; optional for the workflow, and check_delivery.py reports it missing).
# ansible/checks/check_delivery.py fails on every line of this file that would weaken
# that. Its `environment` command reads the environment's protection when given the
# answers of three read-only GitHub calls (the environment, its deployment branch
# policies and its secrets); run it by hand after any change to the environment:
#   python3 ansible/checks/check_delivery.py environment --environment environment.json \
#     --policies policies.json --secrets secrets.json
# where the three files are the output of `gh api` on repos/<owner>/<repo>/environments/
# ansible-hosts, on its /deployment-branch-policies and on its /secrets.
#
# The apply key and the per-host apply keys are environment secrets, named here like the others:
# only the job in the environment reads them, after approval. The per-host check keys,
# ANSIBLE_HOST_CHECK_KEYS, are a repository secret that the drift caller passes too. The ten
# repository secrets (the jump pair and the second hop's three: each set is both or neither, all
# three or none; the push list: optional, and empty means every host is pulled) are named one by
# one; `secrets: inherit` passes all. The second hop, edge-t behind edge1, reaches only the hosts
# listed in ANSIBLE_JUMP2_HOSTS; the other hosts keep the one hop.
# The push list, ANSIBLE_PUSH_HOSTS, is one user@host per line, a subset of ANSIBLE_HOSTS: the
# hosts that never open a connection, reached through the jump host with push-playbook. The
# owner creates it; its value is never written in this repository.

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  # Finds whether the merge queue ran the Ansible workflow, to a green result, on exactly this
  # commit (ansible/checks/merge_group_proof.py holds the rule). A queue run passes on the lint
  # alone, so it proves nothing about the containers: the delivery below skips its re-test only
  # when this answer is true and the select job found that no shard is called for. The job fails
  # toward "false": an unreadable answer is "false".
  queue-proof:
    name: Find the merge queue run of this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tested: ${{ steps.proof.outputs.tested }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Ansible runs of this commit and judge them
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs="$RUNNER_TEMP/ansible-runs.json"
          gh api -X GET "repos/$REPO/actions/workflows/ansible.yml/runs" -f head_sha="$SHA" -f per_page=100 > "$runs" || echo '{}' > "$runs"
          python3 ansible/checks/merge_group_proof.py --runs "$runs" --sha "$SHA" | tee -a "$GITHUB_OUTPUT"

  # Chooses the Molecule shards of this push. The base of the diff is the nearest commit whose
  # delivery finished its lint and shards green, not the commit before the push, because the next
  # push cancels a delivery that has not reached a host (ansible/checks/delivery_select.py).
  # Whatever fails here, the step answers every role and pattern, so a failed selection runs
  # more and never less. Its two answers feed the call below and nothing else.
  select:
    name: Choose the Molecule shards of this push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.select.outputs.shards }}
      directories: ${{ steps.select.outputs.directories }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Choose the shards the changes call for
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          answer="$RUNNER_TEMP/delivery-select.txt"
          if ! python3 ansible/checks/delivery_select.py --before "$BEFORE" --sha "$SHA" > "$answer" \
            || ! grep -qE '^shards=(true|false)$' "$answer" \
            || ! grep -qE '^(roles|patterns)/' "$answer"; then
            echo "::warning::The shard selection failed or printed no answer, so every shard runs."
            printf '%s\n' 'shards=true' 'directories<<DIRECTORIES_END' 'roles/*' 'patterns/*' 'DIRECTORIES_END' > "$answer"
          fi
          cat "$answer" >> "$GITHUB_OUTPUT"

  delivery:
    needs: [queue-proof, select]
    uses: branchLeft/github-workflows/.github/workflows/ansible-gated-apply.yml@v1.1.0
    with:
      environment: ansible-hosts
      push-playbook: ansible/playbooks/demo1.yml
      role-directories: ${{ needs.select.outputs.directories }}
      python-paths: harness checks
      role-test-command: harness/run_harness.py
      skip-rerun-after-merge-group: ${{ needs.select.outputs.shards == 'false' && needs.queue-proof.outputs.tested == 'true' }}
      merge-group-check-name: Lint and test the Ansible roles
      shard-timeout-minutes: 45 # the edge_stack Molecule shard takes up to 39 minutes
    secrets:
      ssh_hosts: ${{ secrets.ANSIBLE_HOSTS }}
      ssh_known_hosts: ${{ secrets.ANSIBLE_KNOWN_HOSTS }}
      ssh_check_key: ${{ secrets.ANSIBLE_CHECK_KEY }}
      ssh_apply_key: ${{ secrets.SSH_APPLY_KEY }}
      ssh_host_check_keys: ${{ secrets.ANSIBLE_HOST_CHECK_KEYS }}
      ssh_host_apply_keys: ${{ secrets.SSH_HOST_APPLY_KEYS }}
      ssh_push_hosts: ${{ secrets.ANSIBLE_PUSH_HOSTS }}
      ssh_jump_host: ${{ secrets.SSH_JUMP_HOST }}
      ssh_jump_key: ${{ secrets.SSH_JUMP_KEY }}
      ssh_jump2_host: ${{ secrets.SSH_JUMP2_HOST }}
      ssh_jump2_key: ${{ secrets.SSH_JUMP2_KEY }}
      ssh_jump2_hosts: ${{ secrets.ANSIBLE_JUMP2_HOSTS }}
