name: Ansible

# Runs the role test harness (ansible/harness) on a runner that holds no
# credentials and reaches no host: the roles are applied to containers on the
# runner's own Docker daemon, and nothing else.
#
# It is a gate on pull requests and on push to `main` (CI-3). The workflow has
# no `paths:` filter, so the job reports on every pull request and can be a
# required check (CI-14); the first step decides whether the Ansible inputs
# changed, and the rest run only when they did. Where nothing changed the job
# passes after a checkout and one diff.
#
# The tools install from ansible/requirements.txt at exact versions and the
# collections from ansible/requirements.yml at exact versions (ANS-4).
# DOCKER_HOST is deliberately left unset (ANS-15).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  roles:
    name: Lint and test the Ansible roles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history, so the base commit of the diff below exists on the runner.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A base commit the runner cannot resolve (a new branch, a forced push)
      # counts as changed, so the gate runs rather than being skipped.
      - name: Decide whether the Ansible inputs changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PUSH_BEFORE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PULL_REQUEST_BASE"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "The base commit is unknown, so every check runs."
            echo "ansible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD -- ansible .ansible-lint .yamllint .github/workflows/ansible.yml)
          if [ -n "$files" ]; then
            echo "The Ansible inputs changed:"
            echo "$files"
            echo "ansible=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Ansible input changed, so there is nothing to run."
            echo "ansible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diagnostic (temporary) systemd container variants on the runner
        if: steps.changes.outputs.ansible == 'true'
        run: |
          set -uo pipefail
          image='geerlingguy/docker-debian13-ansible:latest@sha256:979c0d5e12b0035fff1c46bd4dfd00d67cd82fa48035194f14f32e01c8c02372'
          echo "== runner"
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-}"
          grep PRETTY_NAME /etc/os-release
          uname -r
          echo "cgroup filesystem type: $(stat -fc %T /sys/fs/cgroup)"
          docker version
          docker info --format 'cgroup={{.CgroupVersion}} driver={{.CgroupDriver}} security={{.SecurityOptions}} runtimes={{.Runtimes}}'
          docker pull --quiet "$image"
          try() {
            name="$1"
            shift
            echo "::group::variant $name: $*"
            docker rm -f -v "diag-$name" >/dev/null 2>&1
            docker run -d --name "diag-$name" --label branchleft.agent=ci2392diag "$@" "$image" /lib/systemd/systemd
            sleep 8
            docker ps -a --filter "name=diag-$name" --format '{{.Names}} {{.Status}}'
            docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} cgroupns={{.HostConfig.CgroupnsMode}} privileged={{.HostConfig.Privileged}}' "diag-$name"
            echo "-- docker logs"
            docker logs --tail 25 "diag-$name" 2>&1
            echo "-- exec mkdir (what the Ansible connection does first)"
            docker exec "diag-$name" sh -c 'mkdir -p ~/.ansible/tmp && echo MKDIR_OK'
            echo "-- exec systemctl is-system-running"
            docker exec "diag-$name" systemctl is-system-running
            docker rm -f -v "diag-$name" >/dev/null 2>&1
            echo "::endgroup::"
          }
          mounts=(-v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock)
          try a-as-scenario "${mounts[@]}"
          try b-cgroupns-host "${mounts[@]}" --cgroupns=host
          try c-privileged "${mounts[@]}" --privileged
          try d-host-seccomp-unconfined "${mounts[@]}" --cgroupns=host --security-opt seccomp=unconfined
          try e-sys-admin "${mounts[@]}" --cap-add SYS_ADMIN
          try f-host-sys-admin "${mounts[@]}" --cgroupns=host --cap-add SYS_ADMIN
          try g-host-ro-mount -v /sys/fs/cgroup:/sys/fs/cgroup:ro --tmpfs /run --tmpfs /run/lock --cgroupns=host
          try h-private-no-cgroup-mount --tmpfs /run --tmpfs /run/lock
          exit 1

      - name: Create the tool environment
        if: steps.changes.outputs.ansible == 'true'
        run: python3 -m venv "$RUNNER_TEMP/ansible-venv"

      - name: Install the pinned tools
        if: steps.changes.outputs.ansible == 'true'
        run: '"$RUNNER_TEMP/ansible-venv/bin/pip" install --require-virtualenv -r ansible/requirements.txt'

      - name: yamllint every YAML file under ansible/
        if: steps.changes.outputs.ansible == 'true'
        run: '"$RUNNER_TEMP/ansible-venv/bin/yamllint" --strict -c .yamllint ansible'

      - name: ansible-lint at the production profile
        if: steps.changes.outputs.ansible == 'true'
        run: '"$RUNNER_TEMP/ansible-venv/bin/ansible-lint" --strict ansible'

      - name: Type-check the harness
        if: steps.changes.outputs.ansible == 'true'
        working-directory: ansible
        run: '"$RUNNER_TEMP/ansible-venv/bin/mypy" harness'

      - name: Lint the harness
        if: steps.changes.outputs.ansible == 'true'
        working-directory: ansible
        run: '"$RUNNER_TEMP/ansible-venv/bin/ruff" check harness'

      - name: Check the harness formatting
        if: steps.changes.outputs.ansible == 'true'
        working-directory: ansible
        run: '"$RUNNER_TEMP/ansible-venv/bin/ruff" format --check harness'

      - name: Test the harness
        if: steps.changes.outputs.ansible == 'true'
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" -m unittest discover -b -s ansible/harness -p "test_*.py"'

      # Roles and patterns are both roles. A directory with no entries expands
      # to nothing (nullglob) rather than to a literal pattern, and a total of
      # zero fails the step, so the job cannot pass having tested nothing.
      - name: Run the harness over every role and pattern
        if: steps.changes.outputs.ansible == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          roles=(ansible/roles/*/ ansible/patterns/*/)
          if [ "${#roles[@]}" -eq 0 ]; then
            echo "No role or pattern was found under ansible/roles or ansible/patterns, so nothing would be tested."
            exit 1
          fi
          roles=("${roles[@]%/}")
          echo "The harness runs over ${#roles[@]} role(s):"
          printf '  %s\n' "${roles[@]}"
          "$RUNNER_TEMP/ansible-venv/bin/python" ansible/harness/run_harness.py "${roles[@]}"

      - name: Create a role from the skeleton
        if: steps.changes.outputs.ansible == 'true'
        run: >-
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" role init
          --role-skeleton ansible/role_skeleton
          --init-path "$RUNNER_TEMP/skeleton-probe" skeleton_probe

      - name: Run the harness over the new role with no edits
        if: steps.changes.outputs.ansible == 'true'
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" ansible/harness/run_harness.py "$RUNNER_TEMP/skeleton-probe/skeleton_probe"'
