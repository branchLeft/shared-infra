name: Ansible

# Runs the role test harness (ansible/harness) on a runner that holds no
# credentials and reaches no host: the roles are applied to containers on the
# runner's own Docker daemon, and nothing else.
#
# It is a gate on pull requests, on the merge queue and on push to `main`
# (CI-3). The workflow has
# no `paths:` filter, so the job reports on every pull request and can be a
# required check (CI-14); the first step decides whether the Ansible inputs
# changed, and the rest run only when they did. Where nothing changed the job
# passes after a checkout and one diff.
#
# Three kinds of job. `discover` lists the roles and patterns, each with every
# Molecule scenario it has, and the fresh role skeleton from the repository tree,
# and then narrows that list to what this run needs (ansible/checks/ci_select.py).
# `lint` runs the static checks once. `shard` runs the harness once per entry
# `discover` kept, and only after `lint` has passed, so a lint error is red in
# minutes and costs no container time. A new pattern or a new scenario needs no
# edit here. The gate job, named `Lint and test the Ansible roles`,
# is the one check the ruleset requires; it needs every other job and fails
# unless each of them succeeded.
#
# What runs, by event:
#   - a pull request: lint, and the shards of the roles and patterns it changed (and of
#     those that name them, and of those that read a changed file outside ansible/). A
#     change to the harness, the lock, the lint config or this file runs every shard, and so
#     does a change to one of the three checks files the shards read (ci_select.py,
#     check_pins.py, pip-requirements.txt). Any other file under ansible/checks/ runs the
#     lint job only;
#   - the merge queue: the same choice, made from the queue entry's own diff
#     (base_sha..head_sha of the merge_group event), by the same rules. The entry is
#     tested on the tree it will merge into, so this is the last check before `main`;
#   - the weekly schedule (and a manual run): lint and every shard, whatever changed. It
#     is what catches drift in the external images and collections that no diff shows,
#     and it saves the tool environment's cache on `main`, where every other run can
#     restore it;
#   - a push to `main`: nothing. The pushed tree is the tree the merge queue tested, so
#     a lint here would repeat the one that just passed. Delivery still runs its own.
#
# The tools and the `ansible` package, which carries the collections, install
# from ansible/requirements.txt at exact versions, each file checked against its
# recorded hash (ANS-4). The installed environment is cached by the hash of the
# two lock files, the runner and the Python, so a run restores what the lock already
# built and installs only when the lock changed; the pip check and the collection
# list run on a restore too.
# DOCKER_HOST is deliberately left unset (ANS-15).

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue tests a queued pull request on a gh-readonly-queue/main/...
  # ref, and only this event reports checks there. No `paths:` filter (merge_group
  # supports none, and this workflow has none). Under it the first job diffs the
  # entry's base_sha against its head_sha, and ci_select.py keeps the shards that diff
  # calls for, by the rules a pull request has: a shared file runs every shard. A
  # base or head the runner cannot resolve runs everything.
  merge_group:
    types: [checks_requested]
  # The full sweep. Nothing in a diff shows an external image or a collection that
  # moved, so once a week every shard runs on `main` as it stands. Only the default
  # branch is scheduled, so this is also the run whose cache every other run can read.
  # The minute is off the hour so it does not queue with every other job that starts
  # on it.
  schedule:
    - cron: '23 3 * * 1'
  # The same sweep by hand, to seed the cache or to check a drift report.
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request. A push or merge_group run is its own group and is
# never cancelled (pinned by scripts/test_workflow_concurrency.py).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: Discover the Ansible shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ansible: ${{ steps.changes.outputs.ansible }}
      shards: ${{ steps.shards.outputs.shards }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      # Full history, so the base commit of the diff below exists on the runner.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A base commit the runner cannot resolve (a new branch, a forced push)
      # counts as changed, so the gate runs rather than being skipped.
      #
      # Some role tests read files outside ansible/. The deploy_tooling role links
      # four programs in hetzner/provision, its checks read the two hand scripts
      # that install the same files and the cloud-init source that writes its
      # sudoers drop-in, and its program's address literals are checked against
      # the address plan. The other roles' molecule verify files copy the files
      # they compare against from hetzner/provision, hetzner/monitoring and
      # hetzner/nextcloud1, and the egress_nat and tunnel_account roles read their
      # own unit files there. A change to one of those files must still run the
      # tests that read it, and a file named one by one is a file the next edit
      # forgets, so ansible/ and hetzner/ are watched whole. Watching decides only
      # whether the lint runs; which shards run is ci_select.py's choice, from the
      # files the roles read. ansible/checks/test_ci_watched_paths.py fails when a
      # role reads a path outside ansible/ that this list does not cover. The
      # delivery caller is named too: ansible/checks/test_check_delivery.py reads
      # it, so an edit to that file alone must run the checks and not pass unread.
      # The two hetzner-host files are the ones the tools' tests read.
      #
      # The full list of changed files is kept for ci_select.py, NUL-separated and with
      # renames shown as a delete and an add, so a moved role names both places.
      - name: Decide whether the Ansible inputs changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # Which two commits to compare. A push to main has none: main takes only what the
          # merge queue tested, so the lint that passed there is not repeated here. Anything
          # that is not a pull request or a queue entry (the weekly sweep, a manual run, an
          # event nobody planned for) runs every check and diffs nothing.
          case "$EVENT_NAME" in
            push)
              echo "A push to main is the tree the merge queue already tested, so there is nothing to run."
              echo "ansible=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            pull_request)
              base="$PULL_REQUEST_BASE"
              head=HEAD
              ;;
            merge_group)
              base="$MERGE_GROUP_BASE"
              head="$MERGE_GROUP_HEAD"
              ;;
            *)
              echo "A $EVENT_NAME run always runs every check, so nothing is diffed."
              echo "ansible=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "The base or head commit is unknown, so every check runs."
            echo "ansible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          watched=(
            ansible/
            hetzner/
            .ansible-lint
            .yamllint
            .github/workflows/ansible.yml
            .github/workflows/ansible-delivery.yml
            hetzner-host/cloudInit.ts
            hetzner-host/pullBootstrapFixed.json
          )
          git diff --name-only -z --no-renames "$base" "$head" > "$RUNNER_TEMP/changed-files.z"
          echo "changed=$RUNNER_TEMP/changed-files.z" >> "$GITHUB_OUTPUT"
          files=$(git diff --name-only --no-renames "$base" "$head" -- "${watched[@]}")
          if [ -n "$files" ]; then
            echo "The Ansible inputs changed:"
            echo "$files"
            echo "ansible=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Ansible input changed, so there is nothing to run."
            echo "ansible=false" >> "$GITHUB_OUTPUT"
          fi

      # Every directory directly under ansible/roles or ansible/patterns is a
      # shard for its default scenario, whether or not it holds a molecule/
      # directory: a directory with no scenario fails its own shard at the
      # scenario-limits step, so it cannot pass untested. Every other directory
      # under its molecule/ is one more shard, so each scenario has its own time
      # limit. The fresh-role skeleton is one more shard. The list comes from the
      # tree, by ansible/harness/list_shards.py, which fails on an empty list: an
      # empty matrix would make the shard job skip silently, and the gate must
      # catch that rather than pass.
      #
      # ansible/checks/ci_select.py then keeps the shards this run needs, from the event and
      # the changed files (its rules are in ansible/checks/README.md). It prints `shards=false` and a
      # one-entry matrix that the shard job refuses when nothing is needed, because GitHub
      # rejects an empty matrix. A pull request with no changed-files list, because the base
      # commit was unknown, keeps every shard.
      - name: List the shards from the repository tree
        id: shards
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.changes.outputs.changed }}
        run: |
          set -euo pipefail
          python3 ansible/harness/list_shards.py > "$RUNNER_TEMP/all-shards.json"
          args=(--event "$EVENT_NAME" --matrix-file "$RUNNER_TEMP/all-shards.json")
          if [ -n "$CHANGED_FILES" ]; then
            args+=(--changed-file "$CHANGED_FILES")
          fi
          python3 ansible/checks/ci_select.py "${args[@]}" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint the Ansible inputs
    needs: [discover]
    if: needs.discover.outputs.ansible == 'true'
    # Pinned until the harness is verified on the next Ubuntu LTS image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The environment below is the same for the lint and for every shard, and it
      # costs a minute or more to install, 36 times in a full run. It is restored from the
      # cache, keyed on the hash of the two lock files, the runner and the exact Python the
      # image holds (a venv links to the image's interpreter, so a new Python must not
      # restore an old environment). The install steps run only on a miss; every file in
      # the lock was checked against its recorded hash when the entry was made, and a
      # changed lock changes the key. A pull request's cache is read from its own ref and
      # from `main`'s, and written to its own ref only; the weekly sweep writes `main`'s.
      - name: Name the Python the tool environment is built with
        id: python
        run: echo "version=$(python3 --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore the tool environment
        id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ansible-venv
          key: ansible-venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.version }}-${{ hashFiles('ansible/requirements.txt', 'ansible/checks/pip-requirements.txt') }}

      - name: Create the tool environment
        if: steps.venv.outputs.cache-hit != 'true'
        run: python3 -m venv "$RUNNER_TEMP/ansible-venv"

      # The pip the parity oracle reads is pinned by hash before the lock, so the oracle
      # does not depend on the runner image's ensurepip (ansible/checks/README.md).
      - name: Install the pinned pip
        if: steps.venv.outputs.cache-hit != 'true'
        run: '"$RUNNER_TEMP/ansible-venv/bin/pip" install --require-virtualenv --require-hashes --only-binary=:all: -r ansible/checks/pip-requirements.txt'

      - name: Install the pinned tools
        if: steps.venv.outputs.cache-hit != 'true'
        run: '"$RUNNER_TEMP/ansible-venv/bin/pip" install --require-virtualenv --require-hashes --only-binary=:all: -r ansible/requirements.txt'

      # --require-hashes makes pip refuse any package without a recorded hash, so
      # the lock must name every package. --only-binary=:all: is what makes it cover
      # every file pip runs: an entry with no wheel for this Python would otherwise be
      # built from its source archive, with a build backend fetched with no hash, so
      # such an entry fails the install instead. The collections the roles use come with
      # the `ansible` package and are found by ansible-lint and Ansible with no
      # setting (ANS-4); this lists the versions in the job log.
      - name: Check the installed set and list the collections
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ansible-venv/bin/pip" check
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection list

      # Every requirements line is an exact, hashed pin, nothing is fetched or
      # copied in outside the lock, Dependabot watches the lock, and the
      # pre-commit hook for ansible-lint runs the pinned version (ANS-4).
      - name: Check the pins and the update route
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" ansible/checks/check_pins.py'

      - name: yamllint every YAML file under ansible/
        run: '"$RUNNER_TEMP/ansible-venv/bin/yamllint" --strict -c .yamllint ansible'

      - name: ansible-lint at the production profile
        run: '"$RUNNER_TEMP/ansible-venv/bin/ansible-lint" --strict ansible'

      - name: Type-check the harness, the checks and the tools
        working-directory: ansible
        run: '"$RUNNER_TEMP/ansible-venv/bin/mypy" harness checks tools'

      - name: Lint the harness, the checks and the tools
        working-directory: ansible
        run: '"$RUNNER_TEMP/ansible-venv/bin/ruff" check harness checks tools'

      - name: Check the harness, checks and tools formatting
        working-directory: ansible
        run: '"$RUNNER_TEMP/ansible-venv/bin/ruff" format --check harness checks tools'

      - name: Test the harness
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" -m unittest discover -b -s ansible/harness -p "test_*.py"'

      - name: Test the checks
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" -m unittest discover -b -s ansible/checks -p "test_*.py"'

      # The tools build the record a new host's first-boot document is made from. Their
      # tests run the role's own configuration task with this job's ansible-playbook and
      # compare bytes, and read hetzner-host/cloudInit.ts and the fixed values it shares with
      # the tool, hetzner-host/pullBootstrapFixed.json; the filter above names both.
      # The interpreter is the venv's, so ansible-playbook is found beside it.
      - name: Test the tools
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" -m unittest discover -b -s ansible/tools -p "test_*.py"'

      # A role that ships a program in files/ names that directory as the mypy_path of its
      # own pyproject.toml, and keeps tests of the program in tests/unit/. It is checked from
      # the role's directory, so that pyproject.toml is the one the tools read. The program
      # is the code a host runs as root, so such a role with no files/ fails here: tests
      # with nothing under them would pass in silence. The step covers every such role and
      # has no list to edit. The tests of these programs are run by the step "Run every role's
      # unit tests" below, from the same directory with files/ on the path, so this step runs
      # only the type check and the lint. A role with a library/ is checked by the step below; a
      # role whose pyproject.toml names no files/ path is covered by neither.
      - name: Check each role's own program in files/
        run: |
          set -euo pipefail
          shopt -s nullglob
          bin="$RUNNER_TEMP/ansible-venv/bin"
          checked=0
          for tests in ansible/roles/*/tests/unit; do
            role="$(dirname "$(dirname "$tests")")"
            if [ -d "$role/library" ] || ! grep -qs '^mypy_path = .*/files"' "$role/pyproject.toml"; then
              continue
            fi
            echo "::group::$role"
            if [ ! -d "$role/files" ]; then
              echo "$role has a tests/unit/ and no files/, so the tests test nothing."
              exit 1
            fi
            (
              cd "$role"
              "$bin/mypy" --strict files tests/unit
              "$bin/ruff" check files tests
              "$bin/ruff" format --check files tests
            )
            echo "::endgroup::"
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "No role program with tests found, so there is nothing to check."
            exit 1
          fi
          echo "Checked the program of $checked role(s)."

      # A role that ships a typed module of its own in library/ (ANS-2) is checked
      # from the role's directory, so the role's pyproject.toml, with its mypy_path
      # and its ruff settings, is the one the tools read; the step runs once from
      # ansible/ for everything else. It covers every role and has no list to edit.
      # A tree with no library reports that and passes: it does not fail, and it
      # does not pass in silence. A library with no tests/unit fails, because a
      # module with no test is not checked (TEST-1). ansible/patterns/*/library is
      # not covered: the typed_module pattern keeps its tests where they are, and
      # moving them into CI is a separate change.
      - name: Check each role's own library modules
        run: |
          set -euo pipefail
          shopt -s nullglob
          bin="$RUNNER_TEMP/ansible-venv/bin"
          checked=0
          for library in ansible/roles/*/library; do
            role="$(dirname "$library")"
            echo "::group::$role"
            if [ ! -d "$role/tests/unit" ]; then
              echo "$role has a library/ and no tests/unit/, so its module is not tested."
              exit 1
            fi
            (
              cd "$role"
              "$bin/mypy" --strict library tests/unit
              "$bin/ruff" check library tests
              "$bin/ruff" format --check library tests
            )
            echo "::endgroup::"
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "No role library found, so there is no module to check."
          else
            echo "Checked the library of $checked role(s)."
          fi

      # Every role's unit tests, through one script: the single home for the glob
      # and the run. A new role is picked up with no edit here, and the script fails
      # when no role has tests, when a tests/unit holds no test_*.py, when a suite
      # runs zero tests, and when any test fails. Its own checks, and the pin that
      # keeps this the only copy, run in the "Test the checks" step above and in
      # scripts/test_merge_group_triggers.py.
      - name: Run every role's unit tests
        run: 'PYTHON="$RUNNER_TEMP/ansible-venv/bin/python" ansible/checks/run_role_unit_tests.sh ansible'

  shard:
    name: 'Harness: ${{ matrix.name }}'
    # Only after the lint has passed: a lint error ends the run in minutes and starts no
    # container. A failed or skipped lint skips every shard, and the gate job fails on the
    # lint result.
    needs: [discover, lint]
    if: needs.discover.outputs.ansible == 'true' && needs.discover.outputs.shards == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # Pinned until the harness is verified on the next Ubuntu LTS image.
    runs-on: ubuntu-24.04
    # The longest shard, ansible/roles/db1_grants, runs about 3,000 tasks, each a docker
    # exec, and its four passing runs took 17 to 24.5 minutes, so a limit of 25 left it
    # a margin of seconds and a fifth run was cancelled at the limit. 45 leaves it
    # nearly double its slowest passing run; a shard that hangs is still ended at 45.
    timeout-minutes: 45
    steps:
      # The matrix has one entry that stands for "no shard", because GitHub refuses an empty
      # one. It is never run: the job's condition is false then. If it ever is, this step
      # fails the shard, so an empty selection cannot pass by running nothing.
      - name: Refuse the entry that stands for no shard
        if: matrix.kind != 'role' && matrix.kind != 'skeleton'
        env:
          SHARD_NAME: ${{ matrix.name }}
        run: |
          echo "The matrix entry '$SHARD_NAME' is not a role, a pattern or the skeleton."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The environment below is the same for the lint and for every shard, and it
      # costs a minute or more to install, 36 times in a full run. It is restored from the
      # cache, keyed on the hash of the two lock files, the runner and the exact Python the
      # image holds (a venv links to the image's interpreter, so a new Python must not
      # restore an old environment). The install steps run only on a miss; every file in
      # the lock was checked against its recorded hash when the entry was made, and a
      # changed lock changes the key. A pull request's cache is read from its own ref and
      # from `main`'s, and written to its own ref only; the weekly sweep writes `main`'s.
      - name: Name the Python the tool environment is built with
        id: python
        run: echo "version=$(python3 --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore the tool environment
        id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ansible-venv
          key: ansible-venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.version }}-${{ hashFiles('ansible/requirements.txt', 'ansible/checks/pip-requirements.txt') }}

      - name: Create the tool environment
        if: steps.venv.outputs.cache-hit != 'true'
        run: python3 -m venv "$RUNNER_TEMP/ansible-venv"

      # The pip the parity oracle reads is pinned by hash before the lock, so the oracle
      # does not depend on the runner image's ensurepip (ansible/checks/README.md).
      - name: Install the pinned pip
        if: steps.venv.outputs.cache-hit != 'true'
        run: '"$RUNNER_TEMP/ansible-venv/bin/pip" install --require-virtualenv --require-hashes --only-binary=:all: -r ansible/checks/pip-requirements.txt'

      - name: Install the pinned tools
        if: steps.venv.outputs.cache-hit != 'true'
        run: '"$RUNNER_TEMP/ansible-venv/bin/pip" install --require-virtualenv --require-hashes --only-binary=:all: -r ansible/requirements.txt'

      # --require-hashes makes pip refuse any package without a recorded hash, so
      # the lock must name every package. --only-binary=:all: is what makes it cover
      # every file pip runs: an entry with no wheel for this Python would otherwise be
      # built from its source archive, with a build backend fetched with no hash, so
      # such an entry fails the install instead. The collections the roles use come with
      # the `ansible` package and are found by ansible-lint and Ansible with no
      # setting (ANS-4); this lists the versions in the job log.
      - name: Check the installed set and list the collections
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ansible-venv/bin/pip" check
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection list

      - name: Run the harness over this role or pattern, for this scenario
        if: matrix.kind == 'role'
        env:
          SHARD_PATH: ${{ matrix.path }}
          SHARD_SCENARIO: ${{ matrix.scenario }}
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" ansible/harness/run_harness.py "$SHARD_PATH" --scenario "$SHARD_SCENARIO"'

      - name: Create a role from the skeleton
        if: matrix.kind == 'skeleton'
        run: >-
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" role init
          --role-skeleton ansible/role_skeleton
          --init-path "$RUNNER_TEMP/skeleton-probe" skeleton_probe

      - name: Run the harness over the new role with no edits
        if: matrix.kind == 'skeleton'
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" ansible/harness/run_harness.py "$RUNNER_TEMP/skeleton-probe/skeleton_probe"'

  # The required check. Its name is fixed by ruleset 20952655, which requires
  # exactly `Lint and test the Ansible roles`; a matrix job would rename its
  # checks, so this one job stays. It runs even when a needed job failed or was
  # skipped, and it fails unless each needed job succeeded. When discover found
  # no Ansible input change (or a push to main), the other two jobs are skipped on purpose and the
  # gate passes. When it found inputs but no shard to run (a
  # pull request or queue entry that changed only files no shard reads), the lint must pass and the
  # shard job is skipped on purpose. A shard job that is skipped when discover
  # chose shards, because the lint failed or for any other reason, fails the gate.
  roles:
    name: Lint and test the Ansible roles
    needs: [discover, lint, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          DISCOVER: ${{ needs.discover.result }}
          ANSIBLE: ${{ needs.discover.outputs.ansible }}
          SHARDS: ${{ needs.discover.outputs.shards }}
          LINT: ${{ needs.lint.result }}
          SHARD: ${{ needs.shard.result }}
        run: |
          set -euo pipefail
          if [ "$DISCOVER" != "success" ]; then
            echo "The discover job reported: $DISCOVER"
            exit 1
          fi
          if [ "$ANSIBLE" = "false" ]; then
            echo "No Ansible input changed, or this is a push to main that the merge queue tested, so the lint and shard jobs were not needed."
            exit 0
          fi
