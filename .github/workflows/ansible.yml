name: Ansible

# Runs the role test harness (ansible/harness) on a runner that holds no
# credentials and reaches no host: the roles are applied to containers on the
# runner's own Docker daemon, and nothing else.
#
# It is a gate on pull requests, on the merge queue and on push to `main`
# (CI-3). The workflow has
# no `paths:` filter, so the job reports on every pull request and can be a
# required check (CI-14); the first step decides whether the Ansible inputs
# changed, and the rest run only when they did. Where nothing changed the job
# passes after a checkout and one diff.
#
# Three kinds of job. `discover` lists the roles and patterns and the fresh
# role skeleton from the repository tree. `lint` runs the static checks once.
# `shard` runs the harness once per entry `discover` listed, so a new pattern
# needs no edit here. The gate job, named `Lint and test the Ansible roles`,
# is the one check the ruleset requires; it needs every other job and fails
# unless each of them succeeded.
#
# The tools and the `ansible` package, which carries the collections, install
# from ansible/requirements.txt at exact versions, each file checked against its
# recorded hash (ANS-4).
# DOCKER_HOST is deliberately left unset (ANS-15).

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue tests a queued pull request on a gh-readonly-queue/main/...
  # ref, and only this event reports checks there. No `paths:` filter (merge_group
  # supports none, and this workflow has none). Under it the first job decides
  # the Ansible inputs changed without diffing anything, so the lint and every
  # shard run in full: a queued entry is the last check before main, and a diff
  # base wrong in either direction would pass the gate without running it.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  discover:
    name: Discover the Ansible shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ansible: ${{ steps.changes.outputs.ansible }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      # Full history, so the base commit of the diff below exists on the runner.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A base commit the runner cannot resolve (a new branch, a forced push)
      # counts as changed, so the gate runs rather than being skipped.
      #
      # Some role tests read files outside ansible/. The deploy_tooling role links
      # four programs in hetzner/provision, its checks read the two hand scripts
      # that install the same files and the cloud-init source that writes its
      # sudoers drop-in, and its program's address literals are checked against
      # the address plan. The other roles' molecule verify files copy the files
      # they compare against from hetzner/provision, hetzner/monitoring and
      # hetzner/nextcloud1, and the egress_nat and tunnel_account roles read their
      # own unit files there. A change to one of those files alone must still run
      # the tests that read it. A directory is named only where a verify step copies
      # the whole directory (monitoring_stack, nextcloud_stack); everywhere else the
      # list names the files, so a change to any other file under hetzner/ does not
      # run every shard. ansible/checks/test_ci_watched_paths.py fails when a role
      # reads a path outside ansible/ that this list does not name. The delivery
      # caller is named too: ansible/checks/test_check_delivery.py reads it, so an
      # edit to that file alone must run the checks and not pass unread.
      - name: Decide whether the Ansible inputs changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "A merge-queue run always runs every check, so nothing is diffed."
            echo "ansible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$PUSH_BEFORE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PULL_REQUEST_BASE"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "The base commit is unknown, so every check runs."
            echo "ansible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          watched=(
            ansible
            .ansible-lint
            .yamllint
            .github/workflows/ansible.yml
            .github/workflows/ansible-delivery.yml
            hetzner/provision/branchleft_deploy.py
            hetzner/provision/branchleft_docker_user_policy.sh
            hetzner/provision/branchleft-compose@.service
            hetzner/provision/branchleft-docker-user-policy.service
            hetzner/provision/30-install-deploy-tooling.sh
            hetzner/provision/app-host-isolation.sh
            hetzner-host/cloudInit.ts
            hetzner/scripts/check-address-plan-drift.py
            hetzner/provision/branchleft_host_egress.sh
            hetzner/provision/branchleft-host-egress.service
            hetzner/provision/branchleft_nat.sh
            hetzner/provision/branchleft-nat.service
            hetzner/provision/branchleft-db-tunnel.service
            hetzner/provision/node-exporter.service
            hetzner/provision/fixtures/docker-apt-key.asc
            hetzner/provision/test_compose_unit_contract.py
            hetzner/monitoring/stack/
            hetzner/monitoring/systemd/monitoring.override.conf
            hetzner/monitoring/systemd/snds-collector.service
            hetzner/monitoring/systemd/snds-collector.timer
            hetzner/nextcloud1/stack/
            hetzner/nextcloud1/systemd/nextcloud1.override.conf
            hetzner/control-plane/stack/
          )
          files=$(git diff --name-only "$base" HEAD -- "${watched[@]}")
          if [ -n "$files" ]; then
            echo "The Ansible inputs changed:"
            echo "$files"
            echo "ansible=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Ansible input changed, so there is nothing to run."
            echo "ansible=false" >> "$GITHUB_OUTPUT"
          fi

      # Every directory directly under ansible/roles or ansible/patterns is one
      # shard, whether or not it holds a molecule/ directory: a directory with no
      # scenario fails its own shard at the scenario-limits step, so it cannot
      # pass untested. The fresh-role skeleton is one more shard. An empty list
      # fails the step: an empty matrix would make the shard job skip silently,
      # and the gate must catch that rather than pass.
      - name: List the shards from the repository tree
        id: shards
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=()
          for dir in ansible/roles/*/ ansible/patterns/*/; do
            found+=("${dir%/}")
          done
          if [ "${#found[@]}" -eq 0 ]; then
            echo "No role or pattern with a molecule/ directory was found, so nothing would be tested."
            exit 1
          fi
          echo "The harness runs over ${#found[@]} role(s) and pattern(s), and the fresh-role skeleton:"
          printf '  %s\n' "${found[@]}"
          matrix=$(printf '%s\n' "${found[@]}" | jq -R -s -c '
            split("\n") | map(select(length > 0))
            | map({name: ., path: ., kind: "role"})
            + [{name: "fresh role from the skeleton", path: "ansible/role_skeleton", kind: "skeleton"}]
            | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint the Ansible inputs
    needs: [discover]
    if: needs.discover.outputs.ansible == 'true'
    # Pinned until the harness is verified on the next Ubuntu LTS image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the tool environment
        run: python3 -m venv "$RUNNER_TEMP/ansible-venv"

      - name: Install the pinned tools
        run: '"$RUNNER_TEMP/ansible-venv/bin/pip" install --require-virtualenv --require-hashes -r ansible/requirements.txt'

      # --require-hashes makes pip refuse any package without a recorded hash, so
      # the lock must name every package. The collections the roles use come with
      # the `ansible` package and are found by ansible-lint and Ansible with no
      # setting (ANS-4); this lists the versions in the job log.
      - name: Check the installed set and list the collections
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ansible-venv/bin/pip" check
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection list

      # Every requirements line is an exact, hashed pin, nothing is fetched or
      # copied in outside the lock, Dependabot watches the lock, and the
      # pre-commit hook for ansible-lint runs the pinned version (ANS-4).
      - name: Check the pins and the update route
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" ansible/checks/check_pins.py'

      - name: yamllint every YAML file under ansible/
        run: '"$RUNNER_TEMP/ansible-venv/bin/yamllint" --strict -c .yamllint ansible'

      - name: ansible-lint at the production profile
        run: '"$RUNNER_TEMP/ansible-venv/bin/ansible-lint" --strict ansible'

      - name: Type-check the harness and the checks
        working-directory: ansible
        run: '"$RUNNER_TEMP/ansible-venv/bin/mypy" harness checks'

      - name: Lint the harness and the checks
        working-directory: ansible
        run: '"$RUNNER_TEMP/ansible-venv/bin/ruff" check harness checks'

      - name: Check the harness and checks formatting
        working-directory: ansible
        run: '"$RUNNER_TEMP/ansible-venv/bin/ruff" format --check harness checks'

      - name: Test the harness
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" -m unittest discover -b -s ansible/harness -p "test_*.py"'

      - name: Test the checks
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" -m unittest discover -b -s ansible/checks -p "test_*.py"'

      # A role that ships a typed module of its own in library/ (ANS-2) is checked
      # from the role's directory, so the role's pyproject.toml, with its mypy_path
      # and its ruff settings, is the one the tools read; the step runs once from
      # ansible/ for everything else. It covers every role and has no list to edit.
      # A tree with no library reports that and passes: it does not fail, and it
      # does not pass in silence. A library with no tests/unit fails, because a
      # module with no test is not checked (TEST-1). ansible/patterns/*/library is
      # not covered: the typed_module pattern keeps its tests where they are, and
      # moving them into CI is a separate change.
      - name: Check each role's own library modules
        run: |
          set -euo pipefail
          shopt -s nullglob
          bin="$RUNNER_TEMP/ansible-venv/bin"
          checked=0
          for library in ansible/roles/*/library; do
            role="$(dirname "$library")"
            echo "::group::$role"
            if [ ! -d "$role/tests/unit" ]; then
              echo "$role has a library/ and no tests/unit/, so its module is not tested."
              exit 1
            fi
            (
              cd "$role"
              "$bin/mypy" --strict library tests/unit
              "$bin/ruff" check library tests
              "$bin/ruff" format --check library tests
              PYTHONPATH=library "$bin/python" -m unittest discover -b -s tests/unit -p "test_*.py"
            )
            echo "::endgroup::"
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "No role library found, so there is no module to check."
          else
            echo "Checked the library of $checked role(s)."
          fi

  shard:
    name: 'Harness: ${{ matrix.name }}'
    needs: [discover]
    if: needs.discover.outputs.ansible == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # Pinned until the harness is verified on the next Ubuntu LTS image.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the tool environment
        run: python3 -m venv "$RUNNER_TEMP/ansible-venv"

      - name: Install the pinned tools
        run: '"$RUNNER_TEMP/ansible-venv/bin/pip" install --require-virtualenv --require-hashes -r ansible/requirements.txt'

      # --require-hashes makes pip refuse any package without a recorded hash, so
      # the lock must name every package. The collections the roles use come with
      # the `ansible` package and are found by ansible-lint and Ansible with no
      # setting (ANS-4); this lists the versions in the job log.
      - name: Check the installed set and list the collections
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ansible-venv/bin/pip" check
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection list

      - name: Run the harness over this role or pattern
        if: matrix.kind == 'role'
        env:
          SHARD_PATH: ${{ matrix.path }}
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" ansible/harness/run_harness.py "$SHARD_PATH"'

      - name: Create a role from the skeleton
        if: matrix.kind == 'skeleton'
        run: >-
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" role init
          --role-skeleton ansible/role_skeleton
          --init-path "$RUNNER_TEMP/skeleton-probe" skeleton_probe

      - name: Run the harness over the new role with no edits
        if: matrix.kind == 'skeleton'
        run: '"$RUNNER_TEMP/ansible-venv/bin/python" ansible/harness/run_harness.py "$RUNNER_TEMP/skeleton-probe/skeleton_probe"'

  # The required check. Its name is fixed by ruleset 20952655, which requires
  # exactly `Lint and test the Ansible roles`; a matrix job would rename its
  # checks, so this one job stays. It runs even when a needed job failed or was
  # skipped, and it fails unless each needed job succeeded. When discover found
  # no Ansible input change, the other two jobs are skipped on purpose and the
  # gate passes.
  roles:
    name: Lint and test the Ansible roles
    needs: [discover, lint, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          DISCOVER: ${{ needs.discover.result }}
          ANSIBLE: ${{ needs.discover.outputs.ansible }}
          LINT: ${{ needs.lint.result }}
          SHARD: ${{ needs.shard.result }}
        run: |
          set -euo pipefail
          if [ "$DISCOVER" != "success" ]; then
            echo "The discover job reported: $DISCOVER"
            exit 1
          fi
          if [ "$ANSIBLE" = "false" ]; then
            echo "No Ansible input changed, so the lint and shard jobs were not needed."
            exit 0
          fi
          if [ "$ANSIBLE" != "true" ]; then
            echo "The discover job did not report whether the Ansible inputs changed: '$ANSIBLE'"
            exit 1
          fi
          if [ "$LINT" != "success" ] || [ "$SHARD" != "success" ]; then
            echo "The lint job reported: $LINT"
            echo "The shard job reported: $SHARD"
            echo "Every job must report success."
            exit 1
          fi
          echo "Every job succeeded: discover, lint and every shard."
