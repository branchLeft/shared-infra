# TEMPORARY (workspace#1887): added to read publicpress.co.uk from the IONOS
# authoritative servers on a runner whose port 53 is not intercepted, and
# removed again in the same PR. Read-only public DNS queries; no secrets.
name: publicpress-capture

on:
  push:
    branches: [feat/1887-publicpress-zone]
    paths: [.github/workflows/publicpress-capture.yml]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: dig version
        run: dig -v

      - name: Capture from ns1049.ui-dns.de, with the raw transcript
        run: >
          mkdir out && python3 hetzner/dns/zonecheck.py capture
          --server ns1049.ui-dns.de
          --zone-file hetzner/dns/publicpress.co.uk.json
          --out out/publicpress.co.uk.json
          --transcript out/publicpress.co.uk.ionos-dig.txt
          --dig-time 5 --dig-tries 3

      - name: Capture from the other three IONOS servers, which must agree
        run: |
          for server in ns1094.ui-dns.biz ns1088.ui-dns.org ns1098.ui-dns.com; do
            python3 hetzner/dns/zonecheck.py capture --server "$server" \
              --zone-file hetzner/dns/publicpress.co.uk.json \
              --out "out/other-$server.json" --dig-time 5 --dig-tries 3
            diff out/publicpress.co.uk.json "out/other-$server.json"
          done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publicpress-capture
          path: out/
