name: Secret alert pager

# Every five minutes, reads the open secret-scanning alerts of the organisation's public
# repositories and sends one ntfy page for each alert not paged before. It reads only, with a
# read-only GitHub App token, and writes to no repository, issue or pull request. The owner sets
# three Actions secrets: PAGER_APP_ID, PAGER_APP_PRIVATE_KEY and NTFY_PAGER_PUBLISH_TOKEN.
# With none of them set the run ends green after one step that prints a notice naming them, so
# merging this before the owner has made them does not page red every five minutes. With some
# set and some not, the run goes red, so a half-finished setup is seen. The set of paged alerts
# lives in an actions/cache entry; a failed cache save also goes red.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  page-new-alerts:
    name: Page new secret-scanning alerts
    runs-on: ubuntu-latest
    # Held per job: the repository's concurrency test allows a shared literal group only there,
    # and a run still in progress must finish and save its state before the next reads it.
    concurrency:
      group: secret-alert-pager
      cancel-in-progress: false
    # No run yet to observe: a handful of API reads and at most a few pages. The limit stops a
    # hung connection from holding a runner past the next schedule.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The secrets reach this step only as environment, to be tested for being empty. The step
      # prints names, never values.
      - name: Check the pager's secrets are set
        id: gate
        run: python3 .github/scripts/secret_alert_pager.py --check-secrets-set
        env:
          PAGER_APP_ID: ${{ secrets.PAGER_APP_ID }}
          PAGER_APP_PRIVATE_KEY: ${{ secrets.PAGER_APP_PRIVATE_KEY }}
          NTFY_PAGER_PUBLISH_TOKEN: ${{ secrets.NTFY_PAGER_PUBLISH_TOKEN }}

      - name: Set up Python
        if: ${{ steps.gate.outputs.configured == 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The permission input name is inferred from the App's permission name, not confirmed
      # against a live mint.
      - name: Mint a read-only token for secret-scanning alerts
        id: app-token
        if: ${{ steps.gate.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.PAGER_APP_ID }}
          private-key: ${{ secrets.PAGER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-secret-scanning-alerts: read

      # A cache entry cannot be overwritten, so each run that changes the set saves a new key
      # and this restores the newest key with the prefix.
      - name: Restore the set of paged alerts
        if: ${{ steps.gate.outputs.configured == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .github-state/secret-alert-pager.json
          key: secret-alert-pager-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            secret-alert-pager-state-

      - name: Page each new alert
        id: pager
        if: ${{ steps.gate.outputs.configured == 'true' }}
        run: python3 .github/scripts/secret_alert_pager.py --state-file .github-state/secret-alert-pager.json
        env:
          PAGER_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          NTFY_PAGER_PUBLISH_TOKEN: ${{ secrets.NTFY_PAGER_PUBLISH_TOKEN }}
          NTFY_BASE_URL: https://ntfy.branchleft.co.uk

      # always(): pages already sent are recorded even when a later page failed.
      - name: Save the set of paged alerts
        if: ${{ always() && steps.pager.outputs.state_changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .github-state/secret-alert-pager.json
          key: secret-alert-pager-state-${{ github.run_id }}-${{ github.run_attempt }}

      # A failed cache save is only a warning, and the next run would then page again.
      # Finding the saved key fails the run instead.
      - name: Verify the set was saved
        if: ${{ always() && steps.pager.outputs.state_changed == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .github-state/secret-alert-pager.json
          key: secret-alert-pager-state-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: true
          fail-on-cache-miss: true
