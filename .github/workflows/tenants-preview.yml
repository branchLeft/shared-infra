name: tenants-preview

# Plans the tenants stack on demand, then applies it after the owner's approval. Run by
# hand from main (Actions tab, "Run workflow", or `gh workflow run tenants-preview.yml
# -R branchLeft/shared-infra --ref main`); no schedule, no push, no pull-request trigger.
#
# Why a file of its own: the plan and apply jobs in ci.yml run on a push to main only, and
# the shared no-op gate check (check-apply-gate, wired in ci.yml's scripts-tests job)
# refuses an `||` or a missing push operand in those jobs, so a manual trigger cannot be
# added to them. Nothing here is reachable from a push, a pull request or the merge queue,
# and a dispatch of this file starts none of ci.yml's jobs.
#
# The two jobs below are copies of hetzner-tenants-plan and hetzner-tenants-apply in ci.yml
# (comments that say "see <job>" name jobs in ci.yml), less the change detector, the
# `needs` on the other stacks and the older-run cancel step, none of which has a meaning
# for a dispatch. scripts/test_tenants_preview_workflow.py pins every other step equal to
# its twin in ci.yml, so a change to one that is not made to the other fails CI.
#
# `plan` runs only on main. `apply` waits in `production`, the environment whose required
# reviewer is the owner, and runs only when the plan changes something; it runs only on main.
# `apply` shares the tenants stack's concurrency group with ci.yml's apply, so a dispatch
# never writes the state beside a push's apply. `plan` has none, as in ci.yml: it only reads.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  plan:
    name: Plan (hetzner tenants, pulumi preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A dispatch of any other ref stops here, and `apply` needs this job.
    if: github.ref == 'refs/heads/main'

    # See hetzner-tenants-plan in ci.yml: the apply job is skipped only when this is the
    # string 'false'.
    outputs:
      has_changes: ${{ steps.noop.outputs.has_changes }}

    defaults:
      run:
        working-directory: hetzner/tenants

    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE_HETZNER_TENANTS }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_TENANTS }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: hetzner/.nvmrc
          cache: pnpm
          cache-dependency-path: hetzner/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      # The tenants project shares hetzner/'s node_modules by design, as the
      # estate project does: its program file sits in the package root.
      - name: Install dependencies
        working-directory: hetzner
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

      - name: Verify the deploy secrets are present
        run: |
          fail=0
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::PULUMI_PASSPHRASE_HETZNER_TENANTS is empty or unset" ; fail=1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::HCLOUD_TOKEN_TENANTS is empty or unset" ; fail=1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::HETZNER_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::HETZNER_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          exit "$fail"

      # The salt is not a secret of ours: it is read from the stack's own state
      # at run time (`stack export` needs no passphrase and prints no secret),
      # so a rewrite of the state's secrets provider needs no secret change.
      - name: Restore the stack's encryption salt
        run: |
          set -euo pipefail
          salt=$(pulumi stack export --stack production | jq -r '.deployment.secrets_providers.state.salt // empty')
          case "$salt" in
            v1:*) ;;
            *) echo "::error::the tenants stack's state holds no encryption salt starting with 'v1:'" ; exit 1;;
          esac
          echo "::add-mask::${salt}"
          printf '\nencryptionsalt: %s\n' "$salt" >> Pulumi.production.yaml

      - name: Preview the plan
        id: preview
        run: pulumi preview --stack production --json > preview.json

      # See mail-plan: a second preview saves the update plan, best effort.
      - name: Save the update plan for the no-change check
        continue-on-error: true
        run: pulumi preview --stack production --save-plan preview-plan.json > /dev/null

      - name: Refuse a plan that destroys the tenants estate
        id: deletes
        run: |
          python3 ../../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../../scripts/assert-no-hetzner-deletes.py --verify-coverage ..

          if ! python3 ../../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      # See mail-plan: fails closed, and writes the summary's first line.
      - name: Decide whether the plan changes anything
        id: noop
        if: always()
        uses: branchLeft/github-workflows/.github/actions/plan-has-changes@291ad35742f009d1bdcdb39dcc96f1e2d35c5c7d # v1.2.6
        with:
          preview-json: preview.json
          plan-file: preview-plan.json
          working-directory: hetzner/tenants

      - name: Write the plan to the job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Hetzner tenants plan — read before approving the apply'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (hetzner tenants, pulumi up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan]
    # A no-op plan skips this job before its environment is asked; any other ref never
    # reaches it, because `plan` is skipped there and a skipped `needs` skips this job.
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.plan.outputs.has_changes != 'false'

    # Always `production`, a literal: the owner reads and approves each run.
    environment: production

    concurrency:
      group: pulumi-hetzner-tenants-deploy
      cancel-in-progress: false

    defaults:
      run:
        working-directory: hetzner/tenants

    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE_HETZNER_TENANTS }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_TENANTS }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1

    steps:
      # The environment must pause this job: a required-reviewer rule, or an
      # enabled custom deployment protection rule of the reviewer App
      # (integration id 5090756), either of which holds the job until
      # something answers. The custom rule is not listed in the environment
      # object's `protection_rules`; it has its own endpoint, read below. Any
      # failure to read it counts as no rule, so this stays fail-closed.
      - name: Refuse to apply through an ungated environment
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/${GITHUB_REPOSITORY}/environments/production"
          reviewers=$(gh api "${api}" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          custom=0
          if out=$(gh api "${api}/deployment_protection_rules" \
            --jq '[.custom_deployment_protection_rules[]? | select(.enabled == true and .app.id == 5090756)] | length' 2>/dev/null); then
            custom="${out}"
          fi
          case "${reviewers}" in '' | *[!0-9]*) reviewers=0 ;; esac
          case "${custom}" in '' | *[!0-9]*) custom=0 ;; esac
          if [ "${reviewers}" -eq 0 ] && [ "${custom}" -eq 0 ]; then
            echo "::error::the production environment has neither a required-reviewer rule nor an enabled custom deployment protection rule of the reviewer App -- the plan-approval gate is not real. Configure it in repo settings before any CI apply." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: hetzner/.nvmrc
          cache: pnpm
          cache-dependency-path: hetzner/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        working-directory: hetzner
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

      - name: Verify the deploy secrets are present
        run: |
          fail=0
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::PULUMI_PASSPHRASE_HETZNER_TENANTS is empty or unset" ; fail=1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::HCLOUD_TOKEN_TENANTS is empty or unset" ; fail=1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::HETZNER_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::HETZNER_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          exit "$fail"

      # See hetzner-tenants-plan: the salt comes from the stack's state.
      - name: Restore the stack's encryption salt
        run: |
          set -euo pipefail
          salt=$(pulumi stack export --stack production | jq -r '.deployment.secrets_providers.state.salt // empty')
          case "$salt" in
            v1:*) ;;
            *) echo "::error::the tenants stack's state holds no encryption salt starting with 'v1:'" ; exit 1;;
          esac
          echo "::add-mask::${salt}"
          printf '\nencryptionsalt: %s\n' "$salt" >> Pulumi.production.yaml

      - name: Preview the plan
        run: pulumi preview --stack production --json > preview.json

      - name: Refuse to apply a plan that destroys the tenants estate
        run: |
          python3 ../../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../../scripts/assert-no-hetzner-deletes.py --verify-coverage ..

          if ! python3 ../../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      - name: Apply
        run: pulumi up --stack production --yes

      - name: Write outcome to job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Hetzner tenants deploy'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '### Plan this run applied'
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
