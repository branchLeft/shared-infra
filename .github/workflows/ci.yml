name: CI

# Type-checks the Pulumi program on every PR, and applies it on every push to
# `main`.
#
# **This file used to say the opposite**, and its reasoning was sound as far as
# it went: this stack owns the single load balancer, URL map and certificate map
# fronting every hostname branchLeft serves, so a bad apply is a simultaneous
# outage across every product and every tenant. It concluded that applies belong
# to a human at a workstation.
#
# That does not follow. Blast radius is an argument for guardrails, not for
# laptops — a hand-run `pulumi up` has the same blast radius with an ambient
# owner-level credential, no review, no audit trail beyond shell history, and
# nothing stopping it applying uncommitted local edits. The guardrails the old
# reasoning actually asked for are the five below; the argument for each, and
# the bootstrap that has to happen once before any of it works, are in
# RUNBOOK-ci-bootstrap.md.
#
#   1. The apply runs only on `push` to `main` — a reviewed, merged commit.
#      Pull requests get type-check only, and no credentials of any kind.
#   2. Credentials are short-lived, exchanged via Workload Identity Federation
#      and scoped by `attributeCondition` to this repo *and* `refs/heads/main`.
#      No service-account key exists anywhere.
#   3. The deployer identity cannot grant itself a role, widen its own
#      federation, or delete a certificate — see serviceAccounts.ts.
#   4. A preflight parses the real `pulumi preview` plan for this exact run and
#      aborts before `pulumi up` if it would destroy any part of the edge
#      (scripts/assert-no-edge-deletes.py).
#   5. The deploy job declares an `environment` and a concurrency group.
#
# There is deliberately no `pulumi preview` job on pull requests. It is the
# obvious next step, but it means handing GCP credentials to a job running
# unmerged code, and the provider's branch condition correctly refuses to
# federate a PR head branch. It needs its own read-only identity rather than
# being bolted on here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: read` is what lets `npm ci` fetch @branchleft/* from GitHub
# Packages. The registry rejects anonymous requests even for a public package,
# so the run's own GITHUB_TOKEN is passed as NODE_AUTH_TOKEN below; no
# long-lived credential is involved.
permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npx tsc --noEmit

      # Credential-free, and catches the way the deploy job's guard dies
      # quietly: a resource renamed in edge.ts while the guard's protected set
      # keeps the old id still previews, still applies, and still reports a
      # green preflight — while guarding nothing. Runs here as well as in
      # `deploy` so the PR that introduces the drift fails, rather than the
      # merge that ships it.
      - name: Verify the delete guard still covers every protected resource
        run: |
          python3 scripts/assert-no-edge-deletes.py --self-test
          python3 scripts/assert-no-edge-deletes.py --verify-coverage .

  mail-typecheck:
    name: Type check (mail)
    runs-on: ubuntu-latest
    # Separate project (mail/, own package.json and Pulumi.yaml), separate
    # job: `hcloud` and `gcp` are different providers with independent
    # dependency trees, and a failure or credential need in one must never
    # block or touch the other. Unlike the root project, the mail project has
    # no CI apply path at all — no credentials here, and its stack operations
    # are platform-owner-gated via mail/RUNBOOK-import-mail-host.md.
    defaults:
      run:
        working-directory: mail

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: mail/.nvmrc
          cache: npm
          cache-dependency-path: mail/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npx tsc --noEmit

  mail-provision-checks:
    name: Lint + test (mail/provision)
    runs-on: ubuntu-latest
    # Credential-free, same reasoning as mail-typecheck above: these scripts
    # only ever run by hand against mx1 (mail/RUNBOOK-mx1-provision.md), so
    # there is nothing for this job to apply -- it only proves the shell
    # scripts are shellcheck-clean and configure_stalwart.py's diff logic
    # still does what its unit tests say it does. ubuntu-latest ships
    # shellcheck and python3 already, so neither needs its own setup step
    # or pin.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck mail/provision/*.sh

      - name: Python unit tests
        run: python3 -m unittest discover -s mail/provision -p 'test_*.py' -v

  hetzner-typecheck:
    name: Type check (hetzner)
    runs-on: ubuntu-latest
    # Third project, third job, for the same reason mail has its own: separate
    # package.json, separate provider tree, and no CI apply path. The stack
    # this project declares is created and applied by the platform owner --
    # nothing here holds a Hetzner credential.
    defaults:
      run:
        working-directory: hetzner

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: hetzner/.nvmrc
          cache: npm
          cache-dependency-path: hetzner/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The edge renderer's suite imports the repository root's `sites.ts`,
      # which is the point of it -- the hostname registry has one copy. Vitest
      # transforms that file, and to transform it, it loads the tsconfig
      # nearest to it, which is the root's. That file extends a package, and a
      # package only resolves from a `node_modules` beside it, so the root's
      # install has to exist for a file at the root to be readable at all. It
      # fails as `Tsconfig not found`, which reads like a missing file rather
      # than a missing install.
      - name: Install the repository root's dependencies
        run: npm ci
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npx tsc --noEmit

      # network.ts and estate.ts both construct resources at module scope, so
      # neither is unit-testable here -- `pulumi preview` is what covers them.
      # host.ts, firewalls.ts, cloudInit.ts and addressPlan.ts moved to
      # @branchleft/hetzner-host, whose own CI job below runs their suite.
      # hetznerHost.test.ts is what remains here: it constructs a `Host` from
      # that package under mocks and proves this project can actually resolve
      # and use it -- the `file:` dependency's own build has to have worked
      # for this step to pass, which is exactly the failure mode a version
      # mismatch or a broken package boundary would produce.
      - name: Unit tests
        run: npm test

  hetzner-host-typecheck:
    name: Type check + test (hetzner-host)
    runs-on: ubuntu-latest
    # The published-package half of the split documented in
    # hetzner/README.md: host.ts, firewalls.ts, cloudInit.ts and
    # addressPlan.ts live here, in their own package.json, so that
    # `ghost-platform` can depend on them without duplicating the address
    # plan. This job type-checks and unit-tests the package on every push and
    # PR; publishing it to the registry is a separate, tag-triggered workflow
    # (publish-hetzner-host.yml) that never runs here.
    defaults:
      run:
        working-directory: hetzner-host

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: hetzner-host/.nvmrc
          cache: npm
          cache-dependency-path: hetzner-host/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npx tsc --noEmit

      # cloudInit.ts renders the one document that grants the CI deploy
      # account its sudo rule, from a value that arrives as stack config;
      # host.ts decides from that config whether a host gets public addresses
      # at all. Both are create-time-only and in `ignoreChanges`, so a wrong
      # answer is permanent and appears in no later diff.
      - name: Unit tests
        run: npm test

  hetzner-provision-checks:
    name: Lint + test (hetzner/provision)
    runs-on: ubuntu-latest
    # branchleft_deploy.py is the only command the CI deploy account may run
    # as root on a platform host, so its argument validation is the boundary
    # between a scoped deploy key and a root shell. These tests are the proof
    # that boundary still holds.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck -x hetzner/provision/*.sh

      - name: Python unit tests
        run: python3 -m unittest discover -s hetzner/provision -p 'test_*.py' -v

      # probe-object-storage.py signs its own requests, and a wrong signature
      # is an opaque 403 against this endpoint -- indistinguishable from a
      # wrong key or a wrong region, and debugged in the wrong place.
      - name: Python unit tests (hetzner/scripts)
        run: python3 -m unittest discover -s hetzner/scripts -p 'test_*.py' -v

      # Run the checker itself, not only its tests. Its whole subject is the
      # committed layout, and the failure it exists for -- a Pulumi project in
      # a subdirectory that silently runs the package root's program instead of
      # its own -- previews a plan for the wrong resources and exits 0.
      - name: Verify the Hetzner Pulumi project layout
        run: python3 hetzner/scripts/check-hetzner-projects.py

  scripts-tests:
    name: Test (scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # Self-test first: a matcher that has quietly stopped matching passes
      # every file, so prove it still works before trusting a pass. The scan
      # then walks the tree rather than taking a list of changed files --
      # pre-commit's `files:` pattern lives in another file and could drift,
      # and a salt that arrived on a branch nobody ran the hook on has to fail
      # here rather than at publication.
      - name: Committed-secret guard
        run: |
          python3 scripts/assert-no-committed-pulumi-secrets.py --self-test
          python3 scripts/assert-no-committed-pulumi-secrets.py --scan-tree .

  cloud-armor-baseline-parity:
    name: Audit (Cloud Armor baseline parity)
    runs-on: ubuntu-latest
    # Credential-free by construction: reads only committed edge.ts, sites.ts
    # and the committed Cloud Armor baseline capture, never contacts GCP. What
    # it defends against is the edge-parity gate reading a stale capture as a
    # faithful one -- the first version of CLOUD-ARMOR-BASELINE.md claimed a
    # parity that its own committed JSON already contradicted.
    #
    # It is green despite eight open divergences, because those are enumerated
    # one by one in cloud-armor-baseline/accepted-parity-failures.json. That is
    # what makes this job worth gating `deploy` on: red here means a divergence
    # nobody wrote down. A permanently red job carries no such distinction --
    # the X looks identical whether the cause is the eight recorded problems or
    # a regression landed this morning -- and could not gate anything without
    # blocking every unrelated `mail/` and `hetzner/` deploy until a deployed
    # change nobody in CI can make.
    #
    # Closing a recorded divergence deletes its entry, and this job fails
    # until that deletion lands, so the list cannot rot into a suppression
    # nobody rechecks. Both halves of that -- a fresh capture and the deleted
    # entries -- are edits to committed files, so this job never blocks its
    # own remedy. See CLOUD-ARMOR-BASELINE.md's "Machine-checked parity".
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test
        run: python3 scripts/assert-cloud-armor-baseline-parity.py --self-test

      - name: Parity check
        run: python3 scripts/assert-cloud-armor-baseline-parity.py

  deploy:
    name: Deploy (pulumi up)
    runs-on: ubuntu-latest
    needs:
      [
        typecheck,
        mail-typecheck,
        mail-provision-checks,
        hetzner-typecheck,
        hetzner-host-typecheck,
        hetzner-provision-checks,
        scripts-tests,
        cloud-armor-baseline-parity,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # An environment carrying no protection rule neither pauses a run nor says
    # so, and this key's presence says nothing about whether one is configured.
    # Read `protection_rules` via the API before believing a deploy is gated.
    environment: production

    # Job-level permissions replace the workflow-level block entirely, so
    # `contents: read` and `packages: read` are restated alongside the scope
    # actually being added. `id-token: write` is what lets the runner request
    # the OIDC token WIF exchanges, and it is granted on this job alone.
    permissions:
      contents: read
      packages: read
      id-token: write

    # `cancel-in-progress: false` deliberately: cancelling an apply mid-flight
    # leaves the stack locked and half-applied, which is worse than waiting.
    concurrency:
      group: pulumi-shared-infra-deploy
      cancel-in-progress: false

    # Every pulumi command that reads stack state requires this once the
    # stack is passphrase-wrapped; while the stack is KMS-wrapped it is
    # ignored. Without it the deploy fails closed at the preview step.
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_SALT_EDGE: ${{ secrets.PULUMI_SALT_EDGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Writes an external-account credential file and points
      # GOOGLE_APPLICATION_CREDENTIALS at it, which is what both the Pulumi GCP
      # provider and `pulumi login gs://...` pick up. No setup-gcloud step:
      # this job runs no gcloud commands.
      #
      # Repo variables rather than committed literals — the provider's resource
      # name embeds the GCP project number. Set from `pulumi stack output`
      # after the bootstrap apply (RUNBOOK-ci-bootstrap.md).
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_EMAIL }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # The stack's `encryptionsalt` is not committed: it is an offline
      # verifier for the passphrase above, so a repository that anyone can
      # clone must not carry it. Pulumi still needs it in the file to decrypt,
      # so it is appended here, on the runner, for this job only.
      #
      # Read from the job-level `env:` block above rather than interpolated
      # here: a `${{ }}` inside `run` is substituted before the shell parses
      # the line, so a value containing shell metacharacters would be executed.
      #
      # Fails closed on an empty value. Without the check, Pulumi reads a file
      # whose salt line is blank, reports the stack's secrets as corrupt, and
      # sends whoever debugs it at the passphrase rather than at a repository
      # secret nobody set.
      - name: Restore the stack's encryption salt
        run: |
          if [ -z "$PULUMI_SALT_EDGE" ]; then
            echo "PULUMI_SALT_EDGE is empty or unset -- set the repository secret before deploying" >&2
            exit 1
          fi
          printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_EDGE" >> Pulumi.production.yaml

      # `pulumi login` writes ~/.pulumi/credentials.json for the rest of the
      # job. Stack selection is not relied on the same way: every command below
      # passes `--stack production` explicitly, so no step can operate on
      # whichever stack happened to be selected.
      - name: Log in to the Pulumi state backend
        run: pulumi login gs://branchleft-pulumi-state

      # `--json` rather than parsing rendered text. website/infra's equivalent
      # gate parses human output, and its own docstring records the version of
      # it that matched nothing, exited 0, and would have allowed the
      # destruction it existed to prevent.
      - name: Preview the plan
        run: pulumi preview --stack production --json > preview.json

      - name: Refuse to apply a plan that destroys the edge
        run: |
          # Self-test first. A gate whose matcher has quietly stopped matching
          # passes everything, so prove it still works before trusting a pass.
          python3 scripts/assert-no-edge-deletes.py --self-test
          python3 scripts/assert-no-edge-deletes.py --verify-coverage .

          if ! python3 scripts/assert-no-edge-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      - name: Apply
        run: pulumi up --stack production --yes

      - name: Write outcome to job summary
        if: always()
        # Bound rather than interpolated: a `${{ }}` inside `run` is
        # substituted before the shell parses the script.
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Shared edge deploy'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '### Plan this run applied'
            echo
            echo '```json'
            # Resource URNs, step ops and this stack's non-secret config only.
            # Job summaries are visible to anyone who can read the repo, and
            # URNs here carry site names — which is the same audience sites.ts
            # already has. Revisit if a secret config value is ever added.
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
