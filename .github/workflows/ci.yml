          cache-dependency-path: hetzner/package-lock.json
          registry-url: https://npm.pkg.github.com

      # The estate project shares hetzner/'s node_modules by design — its
      # program file sits in the package root so both projects resolve one
      # @pulumi/hcloud (see estate.ts's header).
      - name: Install dependencies
        working-directory: hetzner
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
