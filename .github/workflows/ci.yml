name: CI

# Type-checks every Pulumi program on every PR, and applies the CI-owned
# stacks on every push to `main`, each through a plan job that a human approves
# before its apply job runs. The guardrails, the deploy pipelines and why there
# is no preview job on pull requests are in .github/workflows/ci.md.
#
# Eight check jobs skip their own steps when a pull request or merge queue entry
# changes nothing they read; the path map and the rules are in scripts/ci_skip.md
# (and scripts/ci_skip.py). Every other check job always runs in full. Four of the
# eight, the stack-config validation jobs, are in ci-config-validate.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests a queued pull request on a gh-readonly-queue/main/...
  # ref, and only this event reports checks there, so every required check
  # below must run on it. It carries no `branches` or `paths` filter: the
  # queue only ever targets main, and the workflow runs in full. It runs the
  # same credential-free type-check and test jobs as a pull request and
  # nothing else: every plan and apply job is gated on
  # `github.event_name == 'push'`, so none of them can start on this event
  # (pinned by scripts/test_merge_group_triggers.py).
  merge_group:
    types: [checks_requested]

# `packages: read` is what lets `pnpm install` fetch @branchleft/* from GitHub
# Packages. The registry rejects anonymous requests even for a public package,
# so the run's own GITHUB_TOKEN is passed as NODE_AUTH_TOKEN below; no
# long-lived credential is involved.
permissions:
  contents: read
  packages: read

# One run per pull request. A push or merge_group run is its own group and is
# never cancelled, so no run queues behind an apply paused for approval
# (pinned by scripts/test_workflow_concurrency.py).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    # Observed 0.25-0.4min over the last 20 successful runs (p95 0.4min).
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Format check
        run: pnpm run format:check

  mail-typecheck:
    name: Type check (mail)
    runs-on: ubuntu-latest
    # Observed 0.2-0.32min over the last 20 successful runs (p95 0.32min).
    timeout-minutes: 10
    # Separate project (mail/, own package.json and Pulumi.yaml), separate
    # job: the mail project and the Hetzner projects have independent
    # dependency trees, and a failure or credential need in one must never
    # block or touch the other. This job stays credential-free; the mail
    # stack's own apply path is the mail-plan/mail-apply pair below.
    defaults:
      run:
        working-directory: mail

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Decides from the changed paths whether the steps below need to run. It
      # only ever reads `false` for a fully mapped diff that misses this job's
      # inputs; the job and its required check still report either way
      # (scripts/ci_skip.md).
      - name: Decide whether this job's inputs changed
        id: skip
        uses: ./.github/actions/ci-skip
        with:
          unit: mail-typecheck

      - name: Setup pnpm
        if: steps.skip.outputs.run != 'false'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        if: steps.skip.outputs.run != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mail/.nvmrc
          cache: pnpm
          cache-dependency-path: mail/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        if: steps.skip.outputs.run != 'false'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        if: steps.skip.outputs.run != 'false'
        run: pnpm exec tsc --noEmit

  mail-provision-checks:
    name: Lint + test (mail/provision)
    runs-on: ubuntu-latest
    # Observed 0.07-0.13min over the last 20 successful runs (p95 0.13min).
    timeout-minutes: 10
    # Credential-free, same reasoning as mail-typecheck above: these scripts
    # only ever run by hand against mx1 (mail/RUNBOOK-mx1-provision.md), so
    # there is nothing for this job to apply -- it only proves the shell
    # scripts are shellcheck-clean and configure_stalwart.py's diff logic
    # still does what its unit tests say it does. ubuntu-latest ships
    # shellcheck and python3 already, so neither needs its own setup step
    # or pin.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Decides from the changed paths whether the steps below need to run. It
      # only ever reads `false` for a fully mapped diff that misses this job's
      # inputs; the job and its required check still report either way
      # (scripts/ci_skip.md).
      - name: Decide whether this job's inputs changed
        id: skip
        uses: ./.github/actions/ci-skip
        with:
          unit: mail-provision-checks

      - name: Shellcheck
        if: steps.skip.outputs.run != 'false'
        run: shellcheck mail/provision/*.sh

      - name: Python unit tests
        if: steps.skip.outputs.run != 'false'
        run: python3 scripts/trace_reads.py --unit mail-provision-checks -- -m unittest discover -s mail/provision -p 'test_*.py' -v

      - name: Python unit tests (mail/mta-sts)
        if: steps.skip.outputs.run != 'false'
        run: python3 -m unittest discover -s mail/mta-sts -p 'test_*.py' -v

  shim-image-starts:
    name: Shim image starts (mail/provision)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Renders the shim's environment file from main exactly as 63 does, then
    # starts the digest shim-compose.yml pins with it and asks the compose
    # healthcheck (main once rendered an environment the pinned image could
    # not start with, and nothing noticed). The container runs
    # with no network and a placeholder credential, on the runner's own docker
    # daemon, and never touches mx1.
    #
    # Deliberately NOT in `mail-plan`'s `needs`. It pulls an image from the
    # registry, and gating a mail plan on a registry outage would couple an
    # unrelated path to a network dependency. It gates review, not the plan, and
    # can be a required pull-request check. The pull retries once.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Decides from the changed paths whether the steps below need to run. The job
      # reads only mail/provision (scripts/ci_skip.py UNITS), so a diff that misses
      # mail/ skips them; the job and its required check still report either way.
      - name: Decide whether this job's inputs changed
        id: skip
        uses: ./.github/actions/ci-skip
        with:
          unit: shim-image-starts

      - name: Start the pinned image with the rendered environment
        if: steps.skip.outputs.run != 'false'
        run: python3 mail/provision/check_shim_image_starts.py

      # The control: the environment main rendered before the fix must still stop this image,
      # and for the missing SMTP_HOST only, never a mount or permission error. A check that
      # cannot fail is not a check.
      - name: Control, the stale drain-only environment stops the same image
        if: always() && steps.skip.outputs.run != 'false'
        run: python3 mail/provision/check_shim_image_starts.py --expect-smtp-host-missing

  hetzner-typecheck:
    name: Type check (hetzner)
    runs-on: ubuntu-latest
    # Observed 0.4-0.6min over the last 20 successful runs (p95 0.6min).
    timeout-minutes: 10
    # Third project, third job, for the same reason mail has its own: separate
    # package.json, separate provider tree. This job stays credential-free;
    # the stacks this directory declares are applied by the
    # hetzner-network-plan/apply and hetzner-estate-plan/apply pairs below.
    defaults:
      run:
        working-directory: hetzner

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: hetzner/.nvmrc
          cache: pnpm
          cache-dependency-path: hetzner/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The edge renderer's suite imports the repository root's `sites.ts`,
      # which is the point of it -- the hostname registry has one copy. Vitest
      # transforms that file, and to transform it, it loads the tsconfig
      # nearest to it, which is the root's. That file extends a package, and a
      # package only resolves from a `node_modules` beside it, so the root's
      # install has to exist for a file at the root to be readable at all. It
      # fails as `Tsconfig not found`, which reads like a missing file rather
      # than a missing install.
      - name: Install the repository root's dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm exec tsc --noEmit

      # estate.ts constructs resources at module scope, so it is not
      # unit-testable here -- `pulumi preview` is what covers it. network.ts
      # does the same, but egress.test.ts imports it under mocks to pin one
      # resolved resource option; that single assertion is not the
      # program-level coverage `pulumi preview` is still relied on for.
      # host.ts, firewalls.ts, cloudInit.ts and addressPlan.ts moved to
      # @branchleft/hetzner-host, whose own CI job below runs their suite.
      # hetznerHost.test.ts is what remains here: it constructs a `Host` from
      # that package under mocks and proves this project can actually resolve
      # and use it -- the `link:` dependency's own build has to have worked
      # for this step to pass, which is exactly the failure mode a version
      # mismatch or a broken package boundary would produce.
      - name: Unit tests
        run: pnpm run test

  hetzner-host-typecheck:
    name: Type check + test (hetzner-host)
    runs-on: ubuntu-latest
    # Observed 0.27-0.37min over the last 20 successful runs (p95 0.37min).
    timeout-minutes: 10
    # The published-package half of the split documented in
    # hetzner/README.md: host.ts, firewalls.ts, cloudInit.ts and
    # addressPlan.ts live here, in their own package.json, so that
    # `ghost-platform` can depend on them without duplicating the address
    # plan. This job type-checks and unit-tests the package on every push and
    # PR; publishing it to the registry is a separate, tag-triggered workflow
    # (publish-hetzner-host.yml) that never runs here.
    defaults:
      run:
        working-directory: hetzner-host

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: hetzner-host/.nvmrc
          cache: pnpm
          cache-dependency-path: hetzner-host/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm exec tsc --noEmit

      # cloudInit.ts renders the one document that grants the CI deploy
      # account its sudo rule, from a value that arrives as stack config;
      # host.ts decides from that config whether a host gets public addresses
      # at all. Both are create-time-only and in `ignoreChanges`, so a wrong
      # answer is permanent and appears in no later diff.
      - name: Unit tests
        run: pnpm run test

  ovh-copy2-checks:
    name: Type check + test (ovh/copy2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The OVHcloud second-copy project: its own package.json and provider tree,
    # so its own job. Credential-free and mock-only; it contacts no OVHcloud
    # API. No plan or apply job exists for it yet.
    defaults:
      run:
        working-directory: ovh/copy2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Decides from the changed paths whether the steps below need to run. The
      # job reads only ovh/copy2/ (scripts/ci_skip.py UNITS); the job and its
      # required check still report either way (scripts/ci_skip.md).
      - name: Decide whether this job's inputs changed
        id: skip
        uses: ./.github/actions/ci-skip
        with:
          unit: ovh-copy2-checks

      - name: Setup pnpm
        if: steps.skip.outputs.run != 'false'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        if: steps.skip.outputs.run != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ovh/copy2/.nvmrc
          cache: pnpm
          cache-dependency-path: ovh/copy2/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        if: steps.skip.outputs.run != 'false'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        if: steps.skip.outputs.run != 'false'
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        if: steps.skip.outputs.run != 'false'
        run: pnpm run test

      # The lock-probe's Python (ovh/copy2/probe), against an in-memory S3 and a
      # fake Pulumi CLI. The tests import no third-party package, so nothing is
      # installed; they are the same ones the probe workflow runs before it
      # creates anything.
      - name: Set up Python (probe tests)
        if: steps.skip.outputs.run != 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Probe unit tests
        if: steps.skip.outputs.run != 'false'
        run: python3 -m unittest discover -s probe -p 'test_*.py' -v

  hetzner-provision-checks:
    name: Lint + test (hetzner/provision)
    runs-on: ubuntu-latest
    # Observed 0.1-0.17min over the last 20 successful runs (p95 0.17min).
    timeout-minutes: 15
    # branchleft_deploy.py is the only command the CI deploy account may run
    # as root on a platform host, so its argument validation is the boundary
    # between a scoped deploy key and a root shell. These tests are the proof
    # that boundary still holds.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck -x hetzner/provision/*.sh

      # A managed Python, so the YAML parser the stack-keys check uses can be
      # installed without touching the system interpreter.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the YAML parser the stack-keys check uses
        run: python3 -m pip install --quiet pyyaml==6.0.3

      # The suite's floor is 3.9 (macOS's system python3), recorded as MIN_PYTHON in
      # hetzner/provision/test_suite_size.py, which also checks this step names the same
      # number. Below it `unittest discover` does not refuse: it turns each module that
      # cannot import into one synthetic failing test and reports a smaller count that
      # reads like an unrelated pre-existing failure. This fails loudly first.
      - name: Python version floor (hetzner/provision needs >= 3.9)
        run: python3 scripts/assert-min-python-version.py 3.9 --suite hetzner/provision

      - name: Python unit tests
        run: python3 -m unittest discover -s hetzner/provision -p 'test_*.py' -v

      # Runs the reconciler against a real dockerd in a privileged
      # Docker-in-Docker stand-in, with a container on a bridge named like the
      # spool's, so the drain-bridge rules are shown to bite, not just to be
      # written.
      - name: Spool bridge egress proof
        run: python3 hetzner/scripts/prove_spool_bridge_egress.py

      # Runs the reconciler against a real dockerd in a privileged
      # Docker-in-Docker stand-in for ops1, with outside containers standing
      # in for edge1 and db1, so the 8301/8302 refusal is shown to bite on a
      # published port, and to stop biting when its rule is removed.
      - name: Control-plane port policy proof
        run: python3 hetzner/scripts/prove_control_plane_port_policy.py

      # probe-object-storage.py signs its own requests, and a wrong signature
      # is an opaque 403 against this endpoint -- indistinguishable from a
      # wrong key or a wrong region, and debugged in the wrong place.
      - name: Python unit tests (hetzner/scripts)
        run: python3 -m unittest discover -s hetzner/scripts -p 'test_*.py' -v

      # test_passphrase_probe_pattern.py lives at hetzner/ root, not under
      # provision/ or scripts/, so neither discover invocation above ever
      # collects it -- an unwired regression test guards nothing.
      - name: Python unit tests (hetzner root)
        run: python3 -m unittest hetzner.test_passphrase_probe_pattern -v

      # zonecheck.py is the gate the DNS cutover runbook stops on: an empty
      # diff from it is what licenses switching the registrar's nameservers.
      # Its tests include the control cases -- an altered record, a server not
      # serving the zone, two sides that are secretly one provider -- each of
      # which must fail the check rather than print an all-clear.
      - name: Python unit tests (hetzner/dns)
        run: python3 -m unittest discover -s hetzner/dns -p 'test_*.py' -v

      # Run the checker itself, not only its tests. Its whole subject is the
      # committed layout, and the failure it exists for -- a Pulumi project in
      # a subdirectory that silently runs the package root's program instead of
      # its own -- previews a plan for the wrong resources and exits 0.
      - name: Verify the Hetzner Pulumi project layout
        run: python3 hetzner/scripts/check-hetzner-projects.py

      # Same reasoning, different failure: addressPlan.ts is the source of
      # truth for the estate's subnet and edge1's address, but the NAT
      # script and the provisioning runbook each carry a copy as a literal,
      # because neither has a repository checkout to import it from. A
      # widened plan that leaves either copy behind previews clean, applies
      # clean, and masquerades the wrong range -- every check that exists
      # otherwise reports the resulting host healthy.
      - name: Verify the address plan against its shell-side literals
        run: python3 hetzner/scripts/check-address-plan-drift.py

  scripts-tests:
    name: Test (scripts)
    runs-on: ubuntu-latest
    # Observed 0.07-0.12min over the last 20 successful runs (p95 0.12min).
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A managed Python, so the YAML parser the workflow-concurrency test reads
      # workflows with can be installed without touching the system interpreter.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the YAML parser the workflow-concurrency test uses
        run: python3 -m pip install --quiet pyyaml==6.0.3

      - name: Python unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Test and type-check .github/scripts
        run: |
          python3 -m pip install --quiet mypy==2.4.1
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 -m mypy --strict .github/scripts/secret_alert_pager.py

      # demo1's roles carry ghost-platform files and hold each to a sha256 in this
      # repository, which a change to a file and its pin together passes. This fetches
      # ghost-platform (public, no credential) at each role's *_source_sha and fails,
      # naming the file, on any vendored byte that differs from that commit's.
      - name: Vendored demo1 files match ghost-platform at their pinned commit
        run: python3 ansible/checks/check_vendored_ghost_platform.py

      # Self-test first: a matcher that has quietly stopped matching passes
      # every file, so prove it still works before trusting a pass. The scan
      # then walks the tree rather than taking a list of changed files --
      # pre-commit's `files:` pattern lives in another file and could drift,
      # and a salt that arrived on a branch nobody ran the hook on has to fail
      # here rather than at publication.
      - name: Committed-secret guard
        run: |
          python3 scripts/assert-no-committed-pulumi-secrets.py --self-test
          python3 scripts/assert-no-committed-pulumi-secrets.py --scan-tree .

      # The no-op gate's contract is checked by the shared action, which reads
      # only this workflow file, so this repo keeps no test of its own for it.
      - name: Check the no-op gate contract
        uses: branchLeft/github-workflows/.github/actions/check-apply-gate@231e592397f4c94668c64646c14160d9d497bdde # v1.2.2
        with:
          workflow: .github/workflows/ci.yml
          pairs: mail-plan:mail-apply hetzner-network-plan:hetzner-network-apply hetzner-estate-plan:hetzner-estate-apply hetzner-dns-plan:hetzner-dns-apply hetzner-tenants-plan:hetzner-tenants-apply
          verdict-step: noop
          summary-step: Write the plan to the job summary
          plan-file: preview-plan.json
          required-operands: |
            github.event_name == 'push'
            github.ref == 'refs/heads/main'

  pulumi-inventory-audit:
    name: Audit (Pulumi secrets + state backends)
    runs-on: ubuntu-latest
    # Observed 0.07-0.12min over the last 20 successful runs (p95 0.12min).
    timeout-minutes: 10
    # Credential-free by construction: the audit reads committed files only and
    # never contacts a backend, so it says nothing about live state and needs
    # nothing to run. What it defends is an ordering with no undo -- a stack
    # whose secrets are wrapped by a key that is later destroyed cannot be
    # decrypted or even torn down afterwards. It also fails on a state-backend reference
    # this repo gained without anyone adding it to the inventory, because the
    # backend is selected per workflow rather than anywhere central.
    #
    # No --require-migrated here: that flag is the manual precondition run
    # before the KMS key is destroyed (hetzner/RUNBOOK-existing-stack-migration.md),
    # not a per-commit gate -- two stacks are still legitimately mid-migration.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts suite imports the YAML parser the workflow-concurrency test
      # reads workflows with, so this job installs it the way scripts-tests does.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the YAML parser the workflow-concurrency test uses
        run: python3 -m pip install --quiet pyyaml==6.0.3

      - name: Python unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Audit
        run: python3 scripts/audit-pulumi-secrets.py

  # ---------------------------------------------------------------------------
  # Deploy pipelines: each stack's plan job writes the real plan for this commit
  # to its job summary, and its apply job runs only after that plan is read and
  # approved. The gates, the skip rules and the approver's duties are in
  # .github/workflows/ci.md, section "Deploy pipelines".
  # ---------------------------------------------------------------------------

  changes:
    name: Detect which stacks' Pulumi inputs changed
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Observed 0.07-0.12min over the last 6 successful runs (p95 0.12min) --
    # small sample, only fires on push to main.
    timeout-minutes: 10
    outputs:
      mail: ${{ steps.filter.outputs.mail }}
      hetzner_network: ${{ steps.filter.outputs.hetzner_network }}
      hetzner_estate: ${{ steps.filter.outputs.hetzner_estate }}
      hetzner_dns: ${{ steps.filter.outputs.hetzner_dns }}
      hetzner_tenants: ${{ steps.filter.outputs.hetzner_tenants }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `base` set explicitly rather than left to the action's own push-event
      # default: that default resolves to "the commit before this push" only
      # because the pushed branch happens to match the repository's default
      # branch setting, a fact this job has no reason to depend on.
      - name: Diff this push against each stack's own inputs
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.before }}
          filters: |
            mail:
              - 'mail/*.ts'
              - 'mail/Pulumi.yaml'
              - 'mail/Pulumi.production.yaml'
              - 'mail/package.json'
              - 'mail/pnpm-lock.yaml'
              - 'mail/.nvmrc'
              - 'mail/tsconfig.json'
              - 'scripts/assert-no-hetzner-deletes.py'
              - '.github/workflows/ci.yml'
            hetzner_network:
              - 'hetzner/index.ts'
              - 'hetzner/network.ts'
              - 'hetzner/egress.ts'
              - 'hetzner/projectGuard.ts'
              - 'hetzner/projects.ts'
              - 'hetzner/Pulumi.yaml'
              - 'hetzner/Pulumi.production.yaml'
              - 'hetzner/package.json'
              - 'hetzner/pnpm-lock.yaml'
              - 'hetzner/.nvmrc'
              - 'hetzner/tsconfig.json'
              - 'hetzner-host/**'
              - 'scripts/assert-no-hetzner-deletes.py'
              - '.github/workflows/ci.yml'
            hetzner_estate:
              - 'hetzner/estate.ts'
              - 'hetzner/projectGuard.ts'
              - 'hetzner/projects.ts'
              - 'hetzner/estate/**'
              - 'hetzner/package.json'
              - 'hetzner/pnpm-lock.yaml'
              - 'hetzner/.nvmrc'
              - 'hetzner/tsconfig.json'
              - 'hetzner-host/**'
              - 'scripts/assert-no-hetzner-deletes.py'
              - '.github/workflows/ci.yml'
            # The DNS program imports only dnsZone.ts, which imports
            # projectGuard.ts and projects.ts; it does not import hetzner-host.
            # `hetzner/dns/**` is the whole directory on purpose (zone files,
            # the checker, the runbooks): a docs-only edit there costs one
            # no-op plan, never an apply. Pinned against the real import graph
            # by scripts/test_ci_apply_environments.py (DnsFilterTests).
            hetzner_dns:
              - 'hetzner/dns/**'
              - 'hetzner/dns.ts'
              - 'hetzner/dnsZone.ts'
              - 'hetzner/projectGuard.ts'
              - 'hetzner/projects.ts'
              - 'hetzner/package.json'
              - 'hetzner/pnpm-lock.yaml'
              - 'hetzner/.nvmrc'
              - 'hetzner/tsconfig.json'
              - 'scripts/assert-no-hetzner-deletes.py'
              - '.github/workflows/ci.yml'
            # The tenants program (tenants.ts, project dir hetzner/tenants/)
            # imports hetzner-host, egress.ts and projectGuard.ts, and reads
            # edge1PublicIpv4 from the estate stack through a StackReference.
            # That read is not an import, so the estate's own inputs are listed
            # as well: an estate change that moves edge1's address must
            # re-plan the tenants stack, whose edge-t SSH allowlist holds it.
            # The tenants runbooks are not inputs: a docs-only edit parks no
            # apply. Pinned against the real import graph by
            # scripts/test_ci_apply_environments.py (TenantsFilterTests).
            hetzner_tenants:
              - 'hetzner/tenants.ts'
              - 'hetzner/tenants/Pulumi.yaml'
              - 'hetzner/tenants/Pulumi.production.yaml'
              - 'hetzner/egress.ts'
              - 'hetzner/projectGuard.ts'
              - 'hetzner/projects.ts'
              - 'hetzner/estate.ts'
              - 'hetzner/estate/Pulumi.yaml'
              - 'hetzner/estate/Pulumi.production.yaml'
              - 'hetzner/package.json'
              - 'hetzner/pnpm-lock.yaml'
              - 'hetzner/.nvmrc'
              - 'hetzner/tsconfig.json'
              - 'hetzner-host/**'
              - 'scripts/assert-no-hetzner-deletes.py'
              - '.github/workflows/ci.yml'

  mail-plan:
    name: Plan (mail, pulumi preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the jobs that actually gate this stack: its own project checks, the
    # delete guard's unit tests, and the backend/secrets inventory audit. The
    # edge validation jobs share nothing with mx1, and
    # coupling them would block a mail fix on an unrelated red.
    needs: [changes, mail-typecheck, mail-provision-checks, scripts-tests, pulumi-inventory-audit]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.mail == 'true'

    # The plan reads the mail credentials, so it has an environment of its own
    # (issue #2195). `mail-plan` carries no reviewer and deploys from `main`
    # only; its secrets live there, not at repository level, so a job without
    # this environment reads them empty.
    environment: mail-plan

    # Whether this plan changes anything, from the `noop` step below. The apply
    # job starts, and so asks its environment for approval, only when this is
    # the string 'true'.
    outputs:
      has_changes: ${{ steps.noop.outputs.has_changes }}

    # `actions: write` is only for the cancel step, which cancels older runs
    # still waiting for approval; contents and packages repeat the workflow
    # default because a job-level block replaces it.
    permissions:
      contents: read
      packages: read
      actions: write

    defaults:
      run:
        working-directory: mail

    # No federation exists for Hetzner (guardrail 2 in the header): the API
    # takes a bearer token, so the token is a long-lived secret scoped to the
    # mail hcloud project alone and named for it. The state backend is pinned
    # in mail/Pulumi.yaml — no `pulumi login` step, per
    # hetzner/RUNBOOK-new-stack.md §7 — and its Object Storage credential pair
    # arrives as the AWS_* variables the S3 backend reads. The bucket's
    # location is `hel1` (not the servers' `nbg1`); a mismatch fails as an
    # opaque 403.
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE_MAIL }}
      PULUMI_SALT_MAIL: ${{ secrets.PULUMI_SALT_MAIL }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_MAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MAIL_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MAIL_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1

    steps:
      # Older runs of this workflow that are still paused for approval have
      # applied nothing. Cancel the ones this run supersedes: never a run with
      # a job in progress or an apply that started, and never a run paused on
      # a stack this push did not plan (that change would then never apply).
      # Hygiene, not a gate: a failure here must not block the plan.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cancel older runs that are still waiting for approval
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PLANS_MAIL: ${{ needs.changes.outputs.mail }}
          PLANS_NETWORK: ${{ needs.changes.outputs.hetzner_network }}
          PLANS_ESTATE: ${{ needs.changes.outputs.hetzner_estate }}
          PLANS_DNS: ${{ needs.changes.outputs.hetzner_dns }}
          PLANS_TENANTS: ${{ needs.changes.outputs.hetzner_tenants }}
        run: |
          api="repos/${GITHUB_REPOSITORY}/actions"
          older=$(gh api "${api}/workflows/ci.yml/runs?branch=main&event=push&status=waiting&per_page=100" |
            jq -r --argjson current "${GITHUB_RUN_NUMBER}" \
              '.workflow_runs[] | select(.status == "waiting" and .head_branch == "main" and .event == "push" and .run_number < $current) | .id')
          for run in ${older}; do
            decision=$(gh api "${api}/runs/${run}/jobs?per_page=100" |
              python3 scripts/cancel-superseded-waiting.py \
                --mail "${PLANS_MAIL}" --network "${PLANS_NETWORK}" --estate "${PLANS_ESTATE}" --dns "${PLANS_DNS}" \
                --tenants "${PLANS_TENANTS}") ||
              decision="keep: the jobs of run ${run} could not be read"
            verdict=${decision%%:*}
            if [ "${verdict}" = "cancel" ]; then
              gh api --method POST "${api}/runs/${run}/cancel" --silent
              echo "cancelled superseded run ${run}: ${decision#*: }"
              echo "- Cancelled run ${run}: ${decision#*: }" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "kept run ${run}: ${decision#*: }"
              echo "- Kept run ${run}: ${decision#*: }" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mail/.nvmrc
          cache: pnpm
          cache-dependency-path: mail/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

      # Fail closed on every secret this job depends on, before any of them is
      # used: each produces its own opaque failure downstream (Pulumi reports
      # corrupt secrets for a blank salt, the S3 backend a 403, the provider a
      # 401), and every one of those debugs toward the wrong thing. The salt
      # must additionally carry Pulumi's `v1:` prefix — a truncated paste
      # passes an emptiness check and still corrupts every decrypt.
      - name: Verify the deploy secrets are present
        run: |
          fail=0
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::PULUMI_PASSPHRASE_MAIL is empty or unset" ; fail=1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::HCLOUD_TOKEN_MAIL is empty or unset" ; fail=1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::MAIL_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::MAIL_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          case "$PULUMI_SALT_MAIL" in
            v1:*) ;;
            *) echo "::error::PULUMI_SALT_MAIL is empty or does not start with 'v1:'" ; fail=1;;
          esac
          exit "$fail"

      # Same reasoning as the edge jobs' salt restore: the committed file must
      # not carry the offline passphrase verifier, so it is appended on the
      # runner, for this job only.
      - name: Restore the stack's encryption salt
        run: |
          printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_MAIL" >> Pulumi.production.yaml

      - name: Preview the plan
        run: pulumi preview --stack production --json > preview.json

      # The update plan is saved by a second preview, apart from the one above,
      # so the preview.json the delete guard reads and the owner reviews is
      # produced exactly as before. Best effort: a failure leaves no plan file,
      # which the `noop` step reads as "changes". Only its stdout goes to
      # /dev/null; stderr is not redirected, and the step above logs the same
      # stderr. The plan file can hold resource inputs and secrets-provider
      # ciphertext, and is never uploaded, printed or summarised.
      - name: Save the update plan for the no-change check
        continue-on-error: true
        run: pulumi preview --stack production --save-plan preview-plan.json > /dev/null

      - name: Refuse a plan that destroys the mail host
        run: |
          python3 ../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../scripts/assert-no-hetzner-deletes.py --verify-coverage .

          if ! python3 ../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      # Fails closed: `has_changes` is `false` only for a plan that parsed and
      # changes nothing, outputs included; the shared plan-has-changes action
      # says what else counts. It also puts the verdict on the first line of
      # the job summary.
      - name: Decide whether the plan changes anything
        id: noop
        if: always()
        uses: branchLeft/github-workflows/.github/actions/plan-has-changes@291ad35742f009d1bdcdb39dcc96f1e2d35c5c7d # v1.2.6
        with:
          preview-json: preview.json
          plan-file: preview-plan.json
          working-directory: mail

      - name: Write the plan to the job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Mail plan — read before approving the apply'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mail-apply:
    name: Apply (mail, pulumi up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [mail-plan]
    # A plan that changes nothing skips this job, so its environment is never
    # asked for an approval. Only the string 'false' skips it: an unset output
    # asks, and a plan the decision step could not understand outputs 'true'.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.mail-plan.outputs.has_changes != 'false'

    # The mail apply has an environment of its own. An approval releases every
    # job waiting in one environment for the run, so sharing `production` with
    # the Hetzner applies would let an approval meant for them release this
    # one. `production-mail` carries the owner's required-reviewer rule and
    # nothing else, and the gate step below refuses to run without it.
    environment: production-mail

    concurrency:
      group: pulumi-mail-deploy
      cancel-in-progress: false

    defaults:
      run:
        working-directory: mail

    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE_MAIL }}
      PULUMI_SALT_MAIL: ${{ secrets.PULUMI_SALT_MAIL }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_MAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MAIL_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MAIL_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1

    steps:
      # If the job is running and no required-reviewer rule exists, nothing
      # paused it — the environment key is silently inert without one. Fail
      # here, before any credential is touched, rather than apply unattended.
      - name: Refuse to apply through an ungated environment
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production-mail" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          if [ "${reviewers:-0}" -eq 0 ]; then
            echo "::error::the production-mail environment has no required-reviewer rule -- the plan-approval gate is not real. Configure it in repo settings before any CI apply." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mail/.nvmrc
          cache: pnpm
          cache-dependency-path: mail/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

      - name: Verify the deploy secrets are present
        run: |
          fail=0
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::PULUMI_PASSPHRASE_MAIL is empty or unset" ; fail=1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::HCLOUD_TOKEN_MAIL is empty or unset" ; fail=1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::MAIL_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::MAIL_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          case "$PULUMI_SALT_MAIL" in
            v1:*) ;;
            *) echo "::error::PULUMI_SALT_MAIL is empty or does not start with 'v1:'" ; fail=1;;
          esac
          exit "$fail"

      - name: Restore the stack's encryption salt
        run: |
          printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_MAIL" >> Pulumi.production.yaml

      # Re-planned and re-gated after approval, not carried over from the plan
      # job: two jobs are two runners, and the guard must see the exact plan
      # this apply acts on.
      - name: Preview the plan
        run: pulumi preview --stack production --json > preview.json

      - name: Refuse to apply a plan that destroys the mail host
        run: |
          python3 ../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../scripts/assert-no-hetzner-deletes.py --verify-coverage .

          if ! python3 ../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      - name: Apply
        run: pulumi up --stack production --yes

      - name: Write outcome to job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Mail deploy'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '### Plan this run applied'
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  hetzner-network-plan:
    name: Plan (hetzner network, pulumi preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the jobs that gate this stack's own surface, same reasoning as
    # mail-plan: coupling the edge's checks here would block a network
    # fix on an unrelated red.
    needs:
      [
        changes,
        hetzner-typecheck,
        hetzner-host-typecheck,
        hetzner-provision-checks,
        scripts-tests,
        pulumi-inventory-audit,
      ]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.hetzner_network == 'true'

    # See mail-plan: the apply job is skipped only when this is the string 'false'.
    outputs:
      has_changes: ${{ steps.noop.outputs.has_changes }}
      # Which environment the paired apply runs in (header guardrail 6). Unset
      # or anything but `production-free` is read as `production`.
      apply_environment: ${{ steps.route.outputs.environment }}

    # See mail-plan: `actions: write` is only for the cancel step.
    permissions:
      contents: read
      packages: read
      actions: write

    defaults:
      run:
        working-directory: hetzner

    # Same posture as the mail jobs (header guardrail 2): no federation
    # exists for Hetzner, so the token is a long-lived secret scoped to the
    # estate hcloud project alone — and projectGuard.ts refuses the program
    # outright if a mail-project token is ever wired in by mistake. The state
    # backend is pinned in hetzner/Pulumi.yaml — no `pulumi login` step.
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE_HETZNER_NETWORK }}
      PULUMI_SALT_HETZNER_NETWORK: ${{ secrets.PULUMI_SALT_HETZNER_NETWORK }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_ESTATE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1

    steps:
      # Older runs of this workflow that are still paused for approval have
      # applied nothing. Cancel the ones this run supersedes: never a run with
      # a job in progress or an apply that started, and never a run paused on
      # a stack this push did not plan (that change would then never apply).
      # Hygiene, not a gate: a failure here must not block the plan.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cancel older runs that are still waiting for approval
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PLANS_MAIL: ${{ needs.changes.outputs.mail }}
          PLANS_NETWORK: ${{ needs.changes.outputs.hetzner_network }}
          PLANS_ESTATE: ${{ needs.changes.outputs.hetzner_estate }}
          PLANS_DNS: ${{ needs.changes.outputs.hetzner_dns }}
          PLANS_TENANTS: ${{ needs.changes.outputs.hetzner_tenants }}
        run: |
          api="repos/${GITHUB_REPOSITORY}/actions"
          older=$(gh api "${api}/workflows/ci.yml/runs?branch=main&event=push&status=waiting&per_page=100" |
            jq -r --argjson current "${GITHUB_RUN_NUMBER}" \
              '.workflow_runs[] | select(.status == "waiting" and .head_branch == "main" and .event == "push" and .run_number < $current) | .id')
          for run in ${older}; do
            decision=$(gh api "${api}/runs/${run}/jobs?per_page=100" |
              python3 scripts/cancel-superseded-waiting.py \
                --mail "${PLANS_MAIL}" --network "${PLANS_NETWORK}" --estate "${PLANS_ESTATE}" --dns "${PLANS_DNS}" \
                --tenants "${PLANS_TENANTS}") ||
              decision="keep: the jobs of run ${run} could not be read"
            verdict=${decision%%:*}
            if [ "${verdict}" = "cancel" ]; then
              gh api --method POST "${api}/runs/${run}/cancel" --silent
              echo "cancelled superseded run ${run}: ${decision#*: }"
              echo "- Cancelled run ${run}: ${decision#*: }" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "kept run ${run}: ${decision#*: }"
              echo "- Kept run ${run}: ${decision#*: }" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: hetzner/.nvmrc
          cache: pnpm
          cache-dependency-path: hetzner/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

      - name: Verify the deploy secrets are present
        run: |
          fail=0
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::PULUMI_PASSPHRASE_HETZNER_NETWORK is empty or unset" ; fail=1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::HCLOUD_TOKEN_ESTATE is empty or unset" ; fail=1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::HETZNER_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::HETZNER_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          case "$PULUMI_SALT_HETZNER_NETWORK" in
            v1:*) ;;
            *) echo "::error::PULUMI_SALT_HETZNER_NETWORK is empty or does not start with 'v1:'" ; fail=1;;
          esac
          exit "$fail"

      - name: Restore the stack's encryption salt
        run: |
          printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_HETZNER_NETWORK" >> Pulumi.production.yaml

      - name: Preview the plan
        id: preview
        run: pulumi preview --stack production --json > preview.json

      # See mail-plan: a second preview saves the update plan, best effort.
      - name: Save the update plan for the no-change check
        continue-on-error: true
        run: pulumi preview --stack production --save-plan preview-plan.json > /dev/null

      - name: Refuse a plan that destroys the network
        id: deletes
        run: |
          python3 ../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../scripts/assert-no-hetzner-deletes.py --verify-coverage .

          if ! python3 ../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      # Routing (header guardrail 6). These three steps pick the environment
      # the paired apply runs in and never fail the plan: any trouble here
      # leaves the output unset, which the apply reads as `production`, where
      # the owner approves. The gate runs only when every step before it
      # succeeded; a preview that failed gives it nothing to read.
      - name: Decide whether the plan could cost money
        id: spend
        continue-on-error: true
        uses: branchLeft/github-workflows/.github/actions/spend-gate@231e592397f4c94668c64646c14160d9d497bdde # v1.2.2
        with:
          preview-json: preview.json
          working-directory: hetzner

      # Without this, a free plan would be routed to an environment that does
      # not exist yet or has lost its rule. Only the reviewer App's enabled
      # rule counts (integration id 5090756); any failure to read it counts as
      # none. The apply job checks again before it touches a credential.
      - name: Check the free apply environment is gated
        id: free_ready
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          custom=0
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production-free/deployment_protection_rules" \
            --jq '[.custom_deployment_protection_rules[]? | select(.enabled == true and .app.id == 5090756)] | length' 2>/dev/null); then
            custom="${out}"
          fi
          case "${custom}" in '' | *[!0-9]*) custom=0 ;; esac
          ready=false
          if [ "${custom}" -gt 0 ]; then ready=true; fi
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Choose the apply environment
        id: route
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          SPEND_VERDICT: ${{ steps.spend.outputs.verdict }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          DELETE_GUARD_OUTCOME: ${{ steps.deletes.outcome }}
          FREE_ENVIRONMENT_READY: ${{ steps.free_ready.outputs.ready }}
        run: |
          python3 -I scripts/choose-apply-environment.py \
            --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"

      # See mail-plan: fails closed, and writes the summary's first line.
      - name: Decide whether the plan changes anything
        id: noop
        if: always()
        uses: branchLeft/github-workflows/.github/actions/plan-has-changes@291ad35742f009d1bdcdb39dcc96f1e2d35c5c7d # v1.2.6
        with:
          preview-json: preview.json
          plan-file: preview-plan.json
          working-directory: hetzner

      - name: Write the plan to the job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Hetzner network plan — read before approving the apply'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  hetzner-network-apply:
    name: Apply (hetzner network, pulumi up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [hetzner-network-plan]
    # See mail-apply: a no-op plan skips this job before its environment is asked.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.hetzner-network-plan.outputs.has_changes != 'false'

    # The Hetzner applies run in `production`, where the owner approves, or in
    # `production-free` when the plan job's spend gate said every change is
    # free (header guardrail 6). Only the exact string `production-free`
    # selects the second; anything else, unset included, is `production`. The
    # mail apply is in `production-mail`, so an approval here cannot release it.
    # The same expression is the job's APPLY_ENVIRONMENT below, which the steps
    # read (pinned equal by scripts/test_ci_apply_environments.py).
    environment: ${{ needs.hetzner-network-plan.outputs.apply_environment == 'production-free' && 'production-free' || 'production' }}

    concurrency:
      group: pulumi-hetzner-network-deploy
      cancel-in-progress: false

    defaults:
      run:
        working-directory: hetzner

    env:
      APPLY_ENVIRONMENT: ${{ needs.hetzner-network-plan.outputs.apply_environment == 'production-free' && 'production-free' || 'production' }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE_HETZNER_NETWORK }}
      PULUMI_SALT_HETZNER_NETWORK: ${{ secrets.PULUMI_SALT_HETZNER_NETWORK }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_ESTATE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1

    steps:
      # If the job is running and nothing paused it — no required-reviewer
      # rule and no enabled custom deployment protection rule of the reviewer
      # App (integration id 5090756) — the environment key is silently
      # inert. Fail here, before any credential is touched, rather than apply
      # unattended. The custom rule is not listed
      # in the environment object's `protection_rules`; it has its own
      # endpoint, read below. Any failure to read it counts as no rule, so
      # this stays fail-closed. It checks the environment this job is actually
      # in (APPLY_ENVIRONMENT), and refuses a name that is neither of the two.
      - name: Refuse to apply through an ungated environment
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${APPLY_ENVIRONMENT}" in
            production | production-free) ;;
            *)
              echo "::error::the apply environment is neither production nor production-free." >&2
              exit 1
              ;;
          esac
          api="repos/${GITHUB_REPOSITORY}/environments/${APPLY_ENVIRONMENT}"
          reviewers=$(gh api "${api}" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          custom=0
          if out=$(gh api "${api}/deployment_protection_rules" \
            --jq '[.custom_deployment_protection_rules[]? | select(.enabled == true and .app.id == 5090756)] | length' 2>/dev/null); then
            custom="${out}"
          fi
          case "${reviewers}" in '' | *[!0-9]*) reviewers=0 ;; esac
          case "${custom}" in '' | *[!0-9]*) custom=0 ;; esac
          if [ "${reviewers}" -eq 0 ] && [ "${custom}" -eq 0 ]; then
            echo "::error::the ${APPLY_ENVIRONMENT} environment has neither a required-reviewer rule nor an enabled custom deployment protection rule of the reviewer App -- the plan-approval gate is not real. Configure it in repo settings before any CI apply." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: hetzner/.nvmrc
          cache: pnpm
          cache-dependency-path: hetzner/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

      - name: Verify the deploy secrets are present
        run: |
          fail=0
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::PULUMI_PASSPHRASE_HETZNER_NETWORK is empty or unset" ; fail=1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::HCLOUD_TOKEN_ESTATE is empty or unset" ; fail=1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::HETZNER_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::HETZNER_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          case "$PULUMI_SALT_HETZNER_NETWORK" in
            v1:*) ;;
            *) echo "::error::PULUMI_SALT_HETZNER_NETWORK is empty or does not start with 'v1:'" ; fail=1;;
          esac
          exit "$fail"

      - name: Restore the stack's encryption salt
        run: |
          printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_HETZNER_NETWORK" >> Pulumi.production.yaml

      # Re-planned and re-gated after approval, not carried over from the plan
      # job: two jobs are two runners, and the guard must see the exact plan
      # this apply acts on.
      - name: Preview the plan
        run: pulumi preview --stack production --json > preview.json

      - name: Refuse to apply a plan that destroys the network
        run: |
          python3 ../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../scripts/assert-no-hetzner-deletes.py --verify-coverage .

          if ! python3 ../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      # The route was chosen from the plan job's preview; this is the preview
      # this apply acts on. On `production-free` nothing but a FREE verdict on
      # it may reach `pulumi up`, so a plan that turned paid between the two
      # fails here. On `production` the owner has read the plan and the verdict
      # is advisory: a gate that could not run never blocks the owner's path.
      - name: Decide whether the plan could cost money
        id: spend
        continue-on-error: true
        uses: branchLeft/github-workflows/.github/actions/spend-gate@231e592397f4c94668c64646c14160d9d497bdde # v1.2.2
        with:
          preview-json: preview.json
          working-directory: hetzner

      - name: Refuse a plan that could cost money on the free environment
        env:
          SPEND_VERDICT: ${{ steps.spend.outputs.verdict }}
        run: |
          case "${APPLY_ENVIRONMENT}" in
            production) exit 0 ;;
            production-free) ;;
            *)
              echo "::error::the apply environment is neither production nor production-free." >&2
              exit 1
              ;;
          esac
          if [ "${SPEND_VERDICT}" != "FREE" ]; then
            echo "::error::this apply is in production-free, which is for free plans only, and the spend gate did not say FREE for the plan it is about to apply. Nothing was applied. Re-run all jobs of the run, not only the failed one: the plan is read again and a paid plan is routed to production, where the owner approves." >&2
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      - name: Apply
        run: pulumi up --stack production --yes

      - name: Write outcome to job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Hetzner network deploy'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '### Plan this run applied'
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  hetzner-estate-plan:
    name: Plan (hetzner estate, pulumi preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialised behind the network apply, not merely the network plan: the
    # estate program resolves a StackReference to the network stack's current
    # outputs, so a plan taken before the network applied would show the
    # approver a state the same merge is about to change.
    needs:
      [
        changes,
        hetzner-typecheck,
        hetzner-host-typecheck,
        hetzner-provision-checks,
        scripts-tests,
        pulumi-inventory-audit,
        hetzner-network-plan,
        hetzner-network-apply,
      ]
    # `!failure() && !cancelled()` replaces the default success()-gated needs
    # deliberately: an estate-only change leaves both network jobs above
    # skipped, not succeeded, and the default gate treats a skipped need the
    # same as a failed one. `failure()` only inspects *direct* needs, not the
    # whole ancestor chain, so `hetzner-network-plan` has to be listed here
    # explicitly alongside `hetzner-network-apply` — depending on the apply
    # alone would miss a network plan that fails outright: apply then never
    # runs (correctly skipped, not failed), and this job would otherwise see
    # only skips among its direct needs and proceed against a StackReference
    # to network outputs this same push's changes never reached.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.hetzner_estate == 'true' &&
      !failure() && !cancelled()

    # See mail-plan: the apply job is skipped only when this is the string 'false'.
    outputs:
      has_changes: ${{ steps.noop.outputs.has_changes }}
      # See hetzner-network-plan: the paired apply's environment.
      apply_environment: ${{ steps.route.outputs.environment }}

    # See mail-plan: `actions: write` is only for the cancel step.
    permissions:
      contents: read
      packages: read
      actions: write

    defaults:
      run:
        working-directory: hetzner/estate

    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE_HETZNER_ESTATE }}
      PULUMI_SALT_HETZNER_ESTATE: ${{ secrets.PULUMI_SALT_HETZNER_ESTATE }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_ESTATE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: hel1

    steps:
      # Older runs of this workflow that are still paused for approval have
      # applied nothing. Cancel the ones this run supersedes: never a run with
      # a job in progress or an apply that started, and never a run paused on
      # a stack this push did not plan (that change would then never apply).
      # Hygiene, not a gate: a failure here must not block the plan.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cancel older runs that are still waiting for approval
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PLANS_MAIL: ${{ needs.changes.outputs.mail }}
          PLANS_NETWORK: ${{ needs.changes.outputs.hetzner_network }}
          PLANS_ESTATE: ${{ needs.changes.outputs.hetzner_estate }}
          PLANS_DNS: ${{ needs.changes.outputs.hetzner_dns }}
          PLANS_TENANTS: ${{ needs.changes.outputs.hetzner_tenants }}
        run: |
          api="repos/${GITHUB_REPOSITORY}/actions"
          older=$(gh api "${api}/workflows/ci.yml/runs?branch=main&event=push&status=waiting&per_page=100" |
            jq -r --argjson current "${GITHUB_RUN_NUMBER}" \
              '.workflow_runs[] | select(.status == "waiting" and .head_branch == "main" and .event == "push" and .run_number < $current) | .id')
          for run in ${older}; do
            decision=$(gh api "${api}/runs/${run}/jobs?per_page=100" |
              python3 scripts/cancel-superseded-waiting.py \
                --mail "${PLANS_MAIL}" --network "${PLANS_NETWORK}" --estate "${PLANS_ESTATE}" --dns "${PLANS_DNS}" \
                --tenants "${PLANS_TENANTS}") ||
              decision="keep: the jobs of run ${run} could not be read"
            verdict=${decision%%:*}
            if [ "${verdict}" = "cancel" ]; then
              gh api --method POST "${api}/runs/${run}/cancel" --silent
              echo "cancelled superseded run ${run}: ${decision#*: }"
              echo "- Cancelled run ${run}: ${decision#*: }" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "kept run ${run}: ${decision#*: }"
              echo "- Kept run ${run}: ${decision#*: }" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: hetzner/.nvmrc
          cache: pnpm
          cache-dependency-path: hetzner/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      # The estate project shares hetzner/'s node_modules by design — its
      # program file sits in the package root so both projects resolve one
      # @pulumi/hcloud (see estate.ts's header).
      - name: Install dependencies
        working-directory: hetzner
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

      - name: Verify the deploy secrets are present
        run: |
          fail=0
          [ -n "$PULUMI_CONFIG_PASSPHRASE" ] || { echo "::error::PULUMI_PASSPHRASE_HETZNER_ESTATE is empty or unset" ; fail=1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::HCLOUD_TOKEN_ESTATE is empty or unset" ; fail=1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::HETZNER_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::HETZNER_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          case "$PULUMI_SALT_HETZNER_ESTATE" in
            v1:*) ;;
            *) echo "::error::PULUMI_SALT_HETZNER_ESTATE is empty or does not start with 'v1:'" ; fail=1;;
          esac
          exit "$fail"

      - name: Restore the stack's encryption salt
        run: |
          printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_HETZNER_ESTATE" >> Pulumi.production.yaml

      - name: Preview the plan
        id: preview
        run: pulumi preview --stack production --json > preview.json

      # See mail-plan: a second preview saves the update plan, best effort.
      - name: Save the update plan for the no-change check
        continue-on-error: true
        run: pulumi preview --stack production --save-plan preview-plan.json > /dev/null

      - name: Refuse a plan that destroys the estate
        id: deletes
        run: |
          python3 ../../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../../scripts/assert-no-hetzner-deletes.py --verify-coverage ..

          if ! python3 ../../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      # See hetzner-network-plan: these three steps choose the paired apply's
      # environment and never fail the plan.
      - name: Decide whether the plan could cost money
        id: spend
        continue-on-error: true
        uses: branchLeft/github-workflows/.github/actions/spend-gate@231e592397f4c94668c64646c14160d9d497bdde # v1.2.2
        with:
          preview-json: preview.json
          working-directory: hetzner/estate

      - name: Check the free apply environment is gated
        id: free_ready
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          custom=0
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production-free/deployment_protection_rules" \
            --jq '[.custom_deployment_protection_rules[]? | select(.enabled == true and .app.id == 5090756)] | length' 2>/dev/null); then
            custom="${out}"
          fi
          case "${custom}" in '' | *[!0-9]*) custom=0 ;; esac
          ready=false
          if [ "${custom}" -gt 0 ]; then ready=true; fi
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Choose the apply environment
        id: route
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          SPEND_VERDICT: ${{ steps.spend.outputs.verdict }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          DELETE_GUARD_OUTCOME: ${{ steps.deletes.outcome }}
          FREE_ENVIRONMENT_READY: ${{ steps.free_ready.outputs.ready }}
        run: |
          python3 -I scripts/choose-apply-environment.py \
            --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"

      # See mail-plan: fails closed, and writes the summary's first line.
      - name: Decide whether the plan changes anything
        id: noop
        if: always()
        uses: branchLeft/github-workflows/.github/actions/plan-has-changes@291ad35742f009d1bdcdb39dcc96f1e2d35c5c7d # v1.2.6
        with:
          preview-json: preview.json
          plan-file: preview-plan.json
          working-directory: hetzner/estate

      - name: Write the plan to the job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Hetzner estate plan — read before approving the apply'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

