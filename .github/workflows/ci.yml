          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::HETZNER_S3_ACCESS_KEY_ID is empty or unset" ; fail=1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::HETZNER_S3_SECRET_ACCESS_KEY is empty or unset" ; fail=1; }
          case "$PULUMI_SALT_HETZNER_ESTATE" in
            v1:*) ;;
            *) echo "::error::PULUMI_SALT_HETZNER_ESTATE is empty or does not start with 'v1:'" ; fail=1;;
          esac
          exit "$fail"

      - name: Restore the stack's encryption salt
        run: |
          printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_HETZNER_ESTATE" >> Pulumi.production.yaml

      - name: Preview the plan
        run: pulumi preview --stack production --json > preview.json

      - name: Refuse a plan that destroys the estate
        run: |
          python3 ../../scripts/assert-no-hetzner-deletes.py --self-test
          python3 ../../scripts/assert-no-hetzner-deletes.py --verify-coverage ..

          if ! python3 ../../scripts/assert-no-hetzner-deletes.py preview.json; then
            echo "--- full plan follows ---"
            python3 -m json.tool preview.json
            exit 1
          fi

      - name: Write the plan to the job summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Hetzner estate plan — read before approving the apply'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo
            echo '```json'
            python3 -m json.tool preview.json 2>/dev/null \
              || echo '(no plan captured — the run failed before preview)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

