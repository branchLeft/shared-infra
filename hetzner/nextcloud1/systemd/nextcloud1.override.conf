# Installed at /etc/systemd/system/branchleft-compose@nextcloud1.service.d/override.conf
# -- an instance override, not a change to the shared
# hetzner/provision/branchleft-compose@.service template.
#
# Same shape as hetzner/monitoring/systemd/monitoring.override.conf, for the
# same underlying reason: all three images in
# hetzner/nextcloud1/stack/compose.yml are pinned inline (tag-plus-digest),
# not via `image: ${IMAGE}`, so this instance needs neither the mandatory
# image-pin assert nor the mandatory pin file the template requires for an
# `${IMAGE}` stack like `edge`.

[Unit]
# The template asserts the pin file exists, checked before ExecStartPre and
# before any EnvironmentFile is read -- so the [Service] reset below cannot
# reach it. Without this line the unit cannot start at all: `systemctl
# restart` fails with "Assertion failed" and leaves the unit inactive rather
# than failed. See monitoring.override.conf's own comment (branchLeft/shared-infra,
# found live 2026-09-17) for how quietly that failure mode presents on a
# reboot. Scoped to this instance only -- `edge` and every future `${IMAGE}`
# stack keep the mandatory assert.
AssertPathExists=

[Service]
# The template loads /etc/branchleft/%i.image.env with no leading dash, so a
# missing pin file fails the unit start -- right for an `${IMAGE}` stack,
# impossible for this one: nothing in compose.yml resolves `${IMAGE}`, and
# branchleft-deploy refuses to write a pin a compose file never reads.
EnvironmentFile=
# Re-added with the template's leading dash: still required in practice, but
# compose.yml's own `${NEXTCLOUD_DB_PASSWORD:?...}` and its siblings refuse
# to proceed and name the missing variable, which is a clearer failure than
# systemd's "Failed to load environment files" would be at this line.
EnvironmentFile=-/etc/branchleft/nextcloud1.env
# Reset-then-append, matching monitoring: the base ExecStart must be cleared
# before the replacement is set, or systemd appends the drop-in's ExecStart
# alongside the template's rather than replacing it, running `docker compose
# up` twice. `--force-recreate` for the same reason monitoring carries it and
# `edge` deliberately does not: this host runs one stack, so a full recreate
# on every restart has no second tenant to take down, and a bind-mount-only
# content change (compose.yml, an env value) would otherwise be a silent
# no-op the way it was on monitoring and on edge before this was understood
# (branchLeft/workspace#666).
ExecStart=
ExecStart=/usr/bin/docker compose up -d --remove-orphans --wait --force-recreate
# Bounds the systemd-managed process tree only -- the `docker compose` CLI,
# nothing else runs in this unit's own cgroup -- not the three containers
# themselves, which is what `mem_limit`/`cpu_shares` in stack/compose.yml is
# for. Generous rather than tight: nothing else runs on this host to protect
# from the CLI process, unlike edge1's shared cgroup budget.
MemoryMax=512M
CPUWeight=100
