# The tenant edge's Compose stack, deployed as `edge` under /opt/branchleft/edge on
# edge-t. The estate's is hetzner/edge/stack/compose.yml and the reasoning behind every
# setting that is the same here is on it, not repeated: this file differs by this
# host's private address, its CrowdSec hostname, and the CrowdSec mounts for the files
# this edge does not carry (the verified-session and Nextcloud parsers).
# hetzner/edge-t/render.test.ts holds the CrowdSec image line to the estate's.
#
# `${IMAGE}` is written by /usr/local/sbin/branchleft-deploy and is always a digest.
name: edge

services:
  caddy:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - '80:80'
      # No `443/udp`: the Caddy configuration disables HTTP/3 to match the host firewall.
      - '443:443'
      # Loopback only; the posture probe (hetzner/edge/render.md, "PROBE_HOSTNAME").
      - '127.0.0.1:8080:8080'
      # Caddy's Prometheus metrics, on edge-t's private address (TENANTS_HOST_IPS.edgeT) only.
      - '10.20.1.210:9091:9091'
    environment:
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:?set CROWDSEC_BOUNCER_KEY in /etc/branchleft/edge.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in /etc/branchleft/edge.env}
    volumes:
      # The directory, not the file (see the estate's compose.yml).
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
      # What the tenant register decides about media, written by the host and read here:
      # the media address's site block and its folder map (render.md, "The media address").
      # Empty until the register holds a tenant.
      - /etc/branchleft/edge-media:/etc/caddy-media:ro
    depends_on:
      crowdsec:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    cpu_shares: 768

  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    restart: unless-stopped
    environment:
      BOUNCER_KEY_caddy: ${CROWDSEC_BOUNCER_KEY:?set CROWDSEC_BOUNCER_KEY in /etc/branchleft/edge.env}
      CUSTOM_HOSTNAME: edge-t
      TZ: Etc/UTC
      # Signal sharing is a sub-processor and personal-data decision (the estate's compose.yml).
      DISABLE_ONLINE_API: 'true'
      PROMETHEUS_LISTEN_ADDR: '0.0.0.0'
      COLLECTIONS: >-
        crowdsecurity/caddy
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
        crowdsecurity/appsec-crs
      APPSEC_CONFIGS: >-
        crowdsecurity/appsec-default
        crowdsecurity/crs
    ports:
      # CrowdSec's metrics, on edge-t's private address only.
      - '10.20.1.210:6060:6060'
    volumes:
      - crowdsec-config:/etc/crowdsec
      # Each rendered directory is mounted where the estate's compose.yml mounts it, for
      # the reasons given there. This edge has no `parsers` mount and no Nextcloud file.
      - ./crowdsec/acquis.d:/etc/crowdsec-acquis.d:ro
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - ./crowdsec/appsec-configs:/etc/crowdsec/appsec-configs/branchleft:ro
      - ./crowdsec/postoverflows:/etc/crowdsec/postoverflows/s01-whitelist/branchleft:ro
      - ./crowdsec/scenarios:/etc/crowdsec/scenarios/branchleft:ro
      - ./crowdsec/remediation:/etc/crowdsec-remediation:ro
      - crowdsec-data:/var/lib/crowdsec/data
      - caddy-logs:/var/log/caddy:ro
    healthcheck:
      test: ['CMD', 'cscli', 'lapi', 'status']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 1024m
    cpu_shares: 256

  # The media cache. Every object read from a shared bucket passes through it, because the
  # provider allows 750 requests a second per source address and per bucket and this edge
  # is one source. Caddy decides what may be read and which bucket holds it; this service
  # only remembers the answers (render.md, "The media address").
  media-cache:
    image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    restart: unless-stopped
    # Not `read_only`: Compose writes an inline config into the container's own layer.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    configs:
      - source: media_cache_conf
        target: /etc/nginx/nginx.conf
    volumes:
      - media-cache:/var/cache/nginx
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/stub_status']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpu_shares: 512

configs:
  media_cache_conf:
    content: |
      pid /tmp/nginx.pid;
      worker_processes auto;
      error_log /dev/stderr warn;

      events {
          worker_connections 1024;
      }

      http {
          access_log off;
          server_tokens off;
          client_body_temp_path /tmp/client_temp;
          proxy_temp_path /tmp/proxy_temp;
          fastcgi_temp_path /tmp/fastcgi_temp;
          uwsgi_temp_path /tmp/uwsgi_temp;
          scgi_temp_path /tmp/scgi_temp;

          resolver 127.0.0.11 valid=10s ipv6=off;
          proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:64m max_size=4g inactive=30d use_temp_path=off;

          server {
              listen 8081;
              location = /stub_status {
                  stub_status;
              }
          }

          server {
              listen 8080 default_server;

              location / {
                  limit_except GET HEAD {
                      deny all;
                  }
                  set $$shard_upstream caddy:18080;
                  proxy_pass http://$$shard_upstream;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $$host;
                  proxy_set_header Range "";
                  proxy_set_header If-Range "";
                  proxy_set_header Cookie "";
                  proxy_set_header Authorization "";
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 20s;
                  proxy_cache media;
                  proxy_cache_key $$host$$request_uri;
                  proxy_cache_lock on;
                  proxy_cache_lock_timeout 10s;
                  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                  proxy_cache_background_update on;
                  proxy_force_ranges on;
                  add_header X-Cache-Status $$upstream_cache_status always;
              }
          }
      }

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  crowdsec-config:
  crowdsec-data:
  media-cache:
