# Generated from sites.ts and hetzner/status/render.ts.
# Regenerate with `npm run render` in hetzner/. Hand edits are overwritten.
web:
  port: 8080
storage:
  type: sqlite
  path: /data/data.db
endpoints:
  - name: branchleft.co.uk
    group: sites
    url: https://branchleft.co.uk
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - '[STATUS] < 300'
