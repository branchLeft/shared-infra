# Stack configuration for this repository's Hetzner hosts.
#
# `encryptionsalt` and the `hcloud:token` ciphertext never belong in this
# file. The salt is an offline verifier for the stack passphrase and the
# ciphertext is only as safe as that passphrase, so both are written into the
# working copy only, never committed. CI appends the salt from the
# PULUMI_SALT_HETZNER_ESTATE repository secret at deploy and supplies the
# token as the HCLOUD_TOKEN environment variable (`.github/workflows/ci.yml`);
# an operator running a hand-gated stack operation supplies both themselves
# (`pulumi config set --secret hcloud:token` prompts for the token). Either
# way it must be the **estate** project's token, which
# `projectGuard.ts` checks rather than assumes; the salt needs no vault; it is
# recoverable from the state bucket with read access alone —
# `pulumi stack export` returns it uninterpreted as
# `deployment.secrets_providers.state.salt`. **Never run `pulumi stack init`
# to recover it**: against a stack that already exists, `stack init` mints a
# **new** salt, which derives a different key from the same passphrase, and
# every piece of ciphertext this stack has ever encrypted stops decrypting
# under it, silently, until something next reads a secret.
# `hetzner/Pulumi.production.yaml`'s own comment carries the full recovery
# commands; the mechanism is identical here. `ownerSshKeyNames` and
# `edge1DeployPublicKey` below are the only entries that belong in git:
# neither is a secret, and the component `require`s both, so committing them
# is what makes a preview from a fresh checkout fail on a real problem rather
# than on a value nobody copied over.
#
# `edge1DeployPublicKey` is documentation more than mechanism: the value
# reaches the host through cloud-init, and `userData` is in the component's
# `ignoreChanges`, so the value that landed at creation is the one the host
# keeps — changing it here is a clean preview, a successful apply, and no
# effect on the host. RUNBOOK-provision-host.md carries the rotation path
# that does take effect.
#
# `location` is deliberately not a key here. It is `ESTATE_LOCATION` in
# addressPlan.ts, because more than one stack in more than one repository
# creates hosts on this network and a per-stack config value lets the second
# apply land somewhere the first did not — permanently, and with a clean
# preview.
#
# Two things about editing this file. Pulumi rewrites it in place on every
# `stack init` and `config set`, so the layout below is the one Pulumi itself
# produces and an edit that reflows it will be reflowed back. And a comment
# survives that rewrite only while the file carries at least one populated
# config entry — emptying the block below silently deletes everything above it.
config:
  # Matches the mail host. Ignored by the component after creation, because
  # Hetzner reuses an image name across point releases and the value the API
  # reports drifts on a server that was never rebuilt.
  branchleft-hetzner-estate:image: debian-13
  # The smallest current shared-x86 type. The scale-out trigger is a memory
  # alert rather than a judgement made here, and cx33 has not been reliably
  # orderable. Check `Available:` and never `Recommended:` immediately before
  # an apply: `Recommended` reads `hel1` across the whole cx line whatever the
  # stock is, and reading it produces a confident and entirely false shortage.
  #
  # One key per host rather than one shared key: a resize is a per-host
  # decision, and a shared key would make one host's change read as every
  # host's.
  branchleft-hetzner-estate:edge1ServerType: cx23
  # The *name* the key is registered under in the hcloud project, not key
  # material. `hcloud ssh-key list` is the only place the current names can be
  # read, and the name is per-project — a project that does not carry this one
  # fails the apply, because `sshKeys` is create-time-only. The key behind it
  # is `id_ed25519_hetzner`, SHA256:UZLm2m1fvggsRn3wQ7Y/oJ66dqiAhexsgkKkvTshRzk.
  branchleft-hetzner-estate:ownerSshKeyNames:
    - rob@branchleft.co.uk
  branchleft-hetzner-estate:edge1DeployPublicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPRwF0ZN5JU3j235hE9gBswGUkbEcriGlR5dBa4PEyMY deploy@edge1
