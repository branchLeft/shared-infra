# The edge Compose stack, deployed as `edge` under /opt/branchleft/edge.
#
# `${IMAGE}` is written by /usr/local/sbin/branchleft-deploy and is always a
# digest, never a tag — see hetzner/provision/branchleft_deploy.py. The other
# image is pinned by digest here because nothing writes it for us.
name: edge

services:
  caddy:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - '80:80'
      # No `443/udp`. The Caddy configuration disables HTTP/3 to match the host
      # firewall, which opens tcp/22, tcp/80, tcp/443 and ICMP and no UDP port
      # at all. Publishing the UDP port here while the firewall drops it is the
      # half-configured state that produces stalled first connections.
      - '443:443'
      # Loopback only, and the Hetzner firewall does not open this port either.
      # The probe listener is how the runbook observes the enforcement posture
      # before any hostname resolves to this host.
      - '127.0.0.1:8080:8080'
      # Caddy's own Prometheus metrics, bound to edge1's private address only
      # -- reachable from the monitoring stack's own Compose project on this
      # same host, never from the public interface.
      - '10.20.1.10:9091:9091'
    environment:
      # Registered on the CrowdSec side by BOUNCER_KEY_caddy below, so the two
      # read the same value from /etc/branchleft/edge.env and nothing generates
      # a key at runtime.
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:?set CROWDSEC_BOUNCER_KEY in /etc/branchleft/edge.env}
      # The ACME account address. Without one there is no stable account and no
      # certificate-expiry notification; the stack refuses to start rather than
      # issuing under an anonymous account nobody can be told about.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in /etc/branchleft/edge.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ACME account keys and every issued certificate. Losing this volume means
      # re-issuing every certificate against Let's Encrypt's rate limits.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      # `service_started`, not `service_healthy`: the bouncer serves IP decisions
      # from its own cache and AppSec is configured to fail open, so Caddy must
      # be able to come up while CrowdSec is still loading its hub items.
      crowdsec:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Real containment, not the systemd drop-in beside this file: `branchleft-compose@edge`
    # is `Type=oneshot` running `docker compose up -d`, which detaches and
    # exits -- dockerd then creates this container in its own sibling scope
    # under system.slice, not nested inside that unit's cgroup, so a
    # `MemoryMax`/`CPUWeight` set there does not reach it. `mem_limit` and
    # `cpu_shares` here are Docker's own per-container HostConfig, applied at
    # creation regardless of that ancestry -- see RUNBOOK-monitoring.md's
    # "Colocation cgroup bounds" section for the full reasoning and the
    # combined edge+monitoring memory budget this number is one line of.
    mem_limit: 256m
    # Caddy over CrowdSec's AppSec component within the edge stack's own
    # share of the host: CrowdSec's bouncer is `appsec_fail_open`, so under
    # CPU pressure it is CrowdSec's WAF check that is designed to be skipped,
    # not Caddy's TLS termination and reverse-proxying.
    cpu_shares: 768

  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:v1.7.8@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    restart: unless-stopped
    environment:
      BOUNCER_KEY_caddy: ${CROWDSEC_BOUNCER_KEY:?set CROWDSEC_BOUNCER_KEY in /etc/branchleft/edge.env}
      CUSTOM_HOSTNAME: edge1
      TZ: Etc/UTC
      # Signal sharing sends observed client addresses to a third party. That is
      # a sub-processor and a personal-data decision, not a configuration
      # default, so it stays off until it has been taken deliberately.
      DISABLE_ONLINE_API: 'true'
      # Default is 127.0.0.1, invisible to any container that is not this
      # one. The `ports:` mapping below is what actually restricts exposure
      # to edge1's private address -- this only makes the metrics endpoint
      # reachable at all.
      PROMETHEUS_LISTEN_ADDR: '0.0.0.0'
      COLLECTIONS: >-
        crowdsecurity/caddy
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
        crowdsecurity/appsec-crs
      # Installed in every posture, including detect-only, so that enabling
      # enforcement is a change to the acquisition file alone and never depends
      # on the hub being reachable at the moment of the flip.
      APPSEC_CONFIGS: >-
        crowdsecurity/appsec-default
        crowdsecurity/crs
    ports:
      # Bound to edge1's private address only, same reasoning as Caddy's
      # metrics port above.
      - '10.20.1.10:6060:6060'
    volumes:
      - crowdsec-config:/etc/crowdsec
      # Mounted inside the volume above: the acquisition files are generated
      # from the registry and the posture, so the container must not be able to
      # accumulate its own copy.
      - ./crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      # Pins the hub branch, which is what stops a start depending on the
      # CrowdSec hub being reachable -- the reasoning is in the file itself.
      # An overlay rather than a mounted config.yaml: the entrypoint only
      # populates /etc/crowdsec when config.yaml is absent, so supplying that
      # file directly would leave the rest of the directory unwritten.
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - crowdsec-data:/var/lib/crowdsec/data
      - caddy-logs:/var/log/caddy:ro
    # Without one, `--wait` waits only for *running*, which a crash-looping
    # container transiently is -- so the unit start succeeds in front of the
    # loop and branchleft-deploy never rolls the image back. `cscli lapi status`
    # authenticates against the Local API over loopback with the container's own
    # machine credentials: it proves the entrypoint got past its unconditional
    # hub installs and that the interface Caddy's bouncer reads decisions from
    # is answering. It reaches no network beyond loopback, so it does not
    # reintroduce the hub dependency config.yaml.local removes. It does not
    # prove Caddy logs are being parsed -- acquisition starts about a second
    # after the API listens, and watching that is the monitoring stack's job.
    healthcheck:
      test: ['CMD', 'cscli', 'lapi', 'status']
      interval: 30s
      timeout: 5s
      retries: 3
      # Grace, not delay: probes run from the start and a passing one ends the
      # window early. Sized for a cold `crowdsec-config` volume, where the hub
      # is genuinely downloaded and the entrypoint's populate rsync costs one
      # automatic restart before the start that sticks.
      start_period: 60s
    # Same reasoning as Caddy's limit above -- this is the actual containment,
    # the systemd unit's MemoryMax does not reach this container. Sized for
    # the agent plus AppSec plus CRS combined (doc 14 §3.1's 150+400 MB
    # worst case), with headroom for rule-set growth during a real attack.
    mem_limit: 1024m
    cpu_shares: 256

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  crowdsec-config:
  crowdsec-data:
