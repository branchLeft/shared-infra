@keyframes ga-press{0%,100%{transform:scale(1)}45%{transform:scale(.9)}}
@keyframes ga-drop{from{transform:translateY(-164px)}to{transform:translateY(0)}}
@keyframes ga-in{from{opacity:0}to{opacity:1}}

<script>
(function(){
  var f=document.currentScript.parentNode;
  if(!('IntersectionObserver' in window))return;
  f.classList.add('js');
  new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.intersectionRatio>=.4){f.classList.add('is-playing');}
    else if(!e.isIntersecting){
      f.classList.remove('js','is-playing');void f.offsetWidth;f.classList.add('js');
    }
  });},{threshold:[0,.4]}).observe(f);
})();
</script>
