# Stack configuration for the tenants project's network and db-t1.
#
# No `encryptionsalt` is committed here. CI appends it from its own repository
# secret, or an operator appends it from their own copy for a hand-gated
# operation, and never commits the result. See `estate/Pulumi.production.yaml`.
#
# `dbt1DeployPublicKey` is deliberately absent. It is the public half of a key
# generated for db-t1 at the time of the first apply, and no value for it exists
# in the repository yet. A preview without it fails on the missing key, which is
# the intended result: it is set with `pulumi config set` by the operator who
# generates the key, and the public half is then committed in a follow-up.
#
# `location` is not a key here, for the reason `estate/Pulumi.production.yaml`
# gives: it is `ESTATE_LOCATION` in the address plan.
config:
  # Matches the estate's hosts. Ignored by the component after creation.
  branchleft-hetzner-tenants:image: debian-13
  # The smallest current shared-x86 type, the same type as the other hosts in
  # this estate. Check `Available:` and never `Recommended:` immediately before
  # an apply, as the estate stack's own comment describes. The owner's ruling of
  # 7 Nov 2026: edge-t, db-t1 and app-t1 are CX23, made by hand in the console and
  # adopted by this stack. See `RUNBOOK-adopt-console-servers.md`.
  branchleft-hetzner-tenants:dbt1ServerType: cx23
  # The name the key is registered under in the tenants project. A key that is
  # registered only in the estate project fails the apply.
  branchleft-hetzner-tenants:ownerSshKeyNames:
    - rob@branchleft.co.uk
  # edge-t, the project's public host (web edge, SSH entry, NAT gateway). CX23 is
  # the owner's ruling of 7 Nov 2026 (it replaces the 2 Nov choice of CPX22), for
  # edge-t, db-t1 and app-t1. Check `Available:` and never `Recommended:`
  # immediately before an apply, and never substitute a type.
  # `edgetDeployPublicKey` is absent for the reason `dbt1DeployPublicKey` is: it is
  # the public half of a key generated for edge-t, and a preview without it fails on
  # the missing key.
  # `edgetAdopt` and `dbt1Adopt` are absent for the same reason: they hold the live
  # ids of the servers made by hand, which exist nowhere until the owner reads them
  # from the console (`RUNBOOK-adopt-console-servers.md`). Absent, the host is
  # created, which is not what is wanted for these three.
  # `dbt1Enabled` is absent too, and the program reads absent as false: db-t1 is
  # declared only after edge-t's route and NAT are live and proven.
  # app-t1 is declared by the app host stack, not by this one.
  branchleft-hetzner-tenants:edgetServerType: cx23
