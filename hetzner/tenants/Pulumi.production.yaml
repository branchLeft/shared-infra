# Stack configuration for the tenants project's network, edge-t and db-t1.
#
# No `encryptionsalt` is committed here. CI appends it from its own repository
# secret, or an operator appends it from their own copy for a hand-gated
# operation, and never commits the result. See `estate/Pulumi.production.yaml`.
#
# `dbt1DeployPublicKey` is the public half of the key generated for db-t1 at
# adoption (`RUNBOOK-adopt-console-servers.md`, step 8). Only the public half is
# committed; the private half is never in the repository.
#
# `location` is not a key here, for the reason `estate/Pulumi.production.yaml`
# gives: it is `ESTATE_LOCATION` in the address plan.
config:
  # Matches the estate's hosts. Ignored by the component after creation.
  branchleft-hetzner-tenants:image: debian-13
  # The smallest current shared-x86 type, the same type as the other hosts in
  # this estate. Check `Available:` and never `Recommended:` immediately before
  # an apply, as the estate stack's own comment describes. The owner's ruling of
  # 7 Nov 2026: edge-t, db-t1 and app-t1 are CX23, made by hand in the console and
  # adopted by this stack. See `RUNBOOK-adopt-console-servers.md`.
  branchleft-hetzner-tenants:dbt1ServerType: cx23
  # The name the key is registered under in the tenants project. A key that is
  # registered only in the estate project fails the apply.
  branchleft-hetzner-tenants:ownerSshKeyNames:
    - rob@branchleft.co.uk
  # edge-t, the project's public host (web edge, SSH entry, NAT gateway). CX23 is
  # the owner's ruling of 7 Nov 2026 (it replaces the 2 Nov choice of CPX22), for
  # edge-t, db-t1 and app-t1. Check `Available:` and never `Recommended:`
  # immediately before an apply, and never substitute a type.
  # edge-t is adopted at stage `converge`: its server and primary IPs are the ones
  # made by hand in the console, imported by id (`edgetAdopt`). Leave the adopt
  # config in place for the life of the host.
  branchleft-hetzner-tenants:edgetServerType: cx23
  # The public half of the key generated for edge-t at adoption.
  branchleft-hetzner-tenants:edgetDeployPublicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGuJFaVwqz3vf32Pl5yrivf//LjBKA/BJArtQEN5ysrL deploy@edge-t
  branchleft-hetzner-tenants:edgetAdopt:
    serverId: 174988976
    ipv4Id: 160981933
    ipv6Id: 160981934
    stage: converge
  # db-t1 is declared, private-only, and adopted at stage `converge` (`dbt1Adopt`).
  # It has no public address; see the runbook's step 9.
  branchleft-hetzner-tenants:dbt1Enabled: "true"
  branchleft-hetzner-tenants:dbt1DeployPublicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH/5+g7frwSwWZZgX6y2VMV0p8Y5K3zViFR5aExFW3Nj deploy@db-t1
  branchleft-hetzner-tenants:dbt1Adopt:
    serverId: 174988939
    stage: converge
  # app-t1 is declared in the program behind `appt1Enabled`, which is absent here, so
  # the stack plans nothing for it. CX23 is the owner's ruling of 7 Nov 2026, as for the
  # two hosts above. The owner sets `appt1Enabled`, `appt1DeployPublicKey` and `appt1Adopt`
  # (`serverId`, `stage: converge`) in the change that brings the hand-made server under
  # the stack: see the runbook's app-t1 section. The deploy key is generated at adoption and
  # does not exist yet, so none is committed.
  branchleft-hetzner-tenants:appt1ServerType: cx23
