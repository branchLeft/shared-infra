# Client authentication for the control-plane PostgreSQL, mounted read-only and
# selected with `-c hba_file=` so it governs the very first start, before any
# role or database exists. Rules are matched top to bottom; the first match
# decides, and the last two rules of each kind refuse everything else.
#
# Every method is scram-sha-256. There is no `trust` and no `peer` here.
# `samenet` is the stack's own Compose network: the database publishes no port,
# so nothing else can reach it.
#
# TYPE   DATABASE            USER                 ADDRESS   METHOD

# Local socket: the administrator only, for provisioning and maintenance.
local    all                 postgres                       scram-sha-256

# The sign-in service's own login, on its own database only.
host     zitadel             zitadel              samenet   scram-sha-256

# The four portal logins, on the portal database only. The provisioner login is
# the third: the provisioning program connects as it after the transaction that
# creates the roles, to prove the boundary, so a file without this rule leaves the
# first provisioning committed and then refused. The migrator login is the fourth:
# the full provision's last step and every migrate-only run connect as it, and it is
# not a superuser, so a file without this rule refuses them.
host     portal              portal_tenant_login       samenet   scram-sha-256
host     portal              portal_owner_login        samenet   scram-sha-256
host     portal              portal_provisioner_login  samenet   scram-sha-256
host     portal              portal_migrator_login     samenet   scram-sha-256

# The administrator over the stack network: the sign-in service's first-start
# initialisation (creates its database and login) and the portal provisioning.
host     postgres,zitadel,portal   postgres        samenet   scram-sha-256

# Everything else is refused.
local    all                 all                            reject
host     all                 all                  all       reject
