# Installed at /etc/systemd/system/branchleft-compose@edge.service.d/override.conf
# -- an instance override, not a change to the shared
# hetzner/provision/branchleft-compose@.service template, so it binds the edge
# stack alone and leaves every other Compose stack on this host unaffected.
#
# **This bounds the systemd-managed process tree only -- the `docker compose`
# CLI invocation and any `ExecStartPre`/`ExecStartPost` script -- not the
# containers themselves.** `branchleft-compose@edge` is `Type=oneshot`
# running `docker compose up -d`, which detaches and exits once the containers
# are created; dockerd then runs Caddy and CrowdSec in their own sibling
# scopes under system.slice, not nested inside this unit's cgroup, so nothing
# here reaches them. The real per-container containment is `mem_limit` and
# `cpu_shares` in `hetzner/edge/stack/compose.yml` -- Docker's own
# per-container HostConfig, applied at container creation regardless of
# process ancestry. Kept here anyway as a narrow backstop on whatever *is* a
# child of this unit, and because `systemctl show` on it is part of the
# amendment's literal acceptance text -- but it is not, by itself, what makes
# the mitigation real. See RUNBOOK-monitoring.md's "Colocation cgroup bounds"
# for the full arithmetic and reasoning, and its verification section for
# the container-level checks that actually prove this.
[Service]
MemoryMax=1536M
CPUWeight=100
