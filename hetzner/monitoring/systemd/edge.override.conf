# Installed at /etc/systemd/system/branchleft-compose@edge.service.d/override.conf.
# An instance override: it binds the edge stack alone, not the shared template.
# It bounds the systemd-managed process tree only; the containers are bounded by
# mem_limit and cpu_shares in hetzner/edge/stack/compose.yml. The reasoning is in
# hetzner/RUNBOOK-monitoring.md, "Colocation cgroup bounds".
[Service]
MemoryMax=1536M
CPUWeight=100
