# Installed at /etc/systemd/system/branchleft-compose@monitoring.service.d/override.conf
# -- an instance override, not a change to the shared
# hetzner/provision/branchleft-compose@.service template.
#
# The ExecStartPre below is additive: systemd appends a drop-in's ExecStartPre
# after the template's own `docker compose pull`, it does not replace it.
# Alertmanager's real config does not exist until this has run at least once
# -- see stack/render_alertmanager_config.py's docstring for why the
# substitution cannot happen inside alertmanager.yml itself.
#
# **`MemoryMax`/`CPUWeight` below bound the systemd-managed process tree
# only** -- the `docker compose` CLI and the `ExecStartPre` script above --
# not the six containers themselves. Same reasoning as
# `edge.override.conf`: `Type=oneshot` plus `docker compose up -d` detaches,
# and dockerd creates each container as a sibling scope under system.slice,
# not nested here. The real per-container containment is `mem_limit` and
# `cpu_shares` in `hetzner/monitoring/stack/compose.yml`. See
# RUNBOOK-monitoring.md's "Colocation cgroup bounds" for the arithmetic and
# its verification section for the container-level checks.
[Service]
# The template loads /etc/branchleft/%i.image.env with no leading dash, so a
# missing pin file fails the unit start. That is right for a stack resolving
# `image: ${IMAGE}` and impossible for this one: all six images are pinned
# inline, so nothing reads IMAGE, and branchleft-deploy refuses to write a pin
# a compose file never reads. Without this reset the stack has no writer for a
# file it cannot start without. Scoped to this instance, so `edge` and every
# future ${IMAGE} stack keep the mandatory pin.
EnvironmentFile=
# Re-added with the template's leading dash, so a missing file is not an error
# *here*. It is still required, but compose's GRAFANA_ADMIN_PASSWORD:? and
# render_alertmanager_config.py both refuse to proceed without it and both name
# the variable. Making it mandatory at this line would pre-empt them with
# systemd's "Failed to load environment files", which names nothing and reads
# like the pin-file failure above.
EnvironmentFile=-/etc/branchleft/monitoring.env
ExecStartPre=/usr/bin/python3 /opt/branchleft/monitoring/render_alertmanager_config.py
# The template's own ExecStart relies on Compose's per-service config hash to
# decide what to recreate, which is right for `edge`: it is restarted by
# every per-tenant image bump (branchLeft/shared-infra#171), and a full
# stack-wide recreate on each one would take every tenant offline to change
# one. Compose's hash covers the resolved service definition -- image,
# environment, the `${IMAGE}` substitution branchleft-deploy writes -- and
# not the *contents* of a bind-mounted file, so a change confined to
# `prometheus.yml`, `alerts.yml` or the Alertmanager template is invisible to
# it: `systemctl restart` reruns ExecStart, Compose sees no service whose
# resolved definition changed, and it recreates nothing.
#
# `monitoring` has none of `edge`'s reason to stay selective. It restarts
# only for this stack's own manual runbook procedure (RUNBOOK-monitoring.md
# step 7b), not for automated per-tenant deploys, and it has no second tenant
# to protect from the other's change -- there is one thing running here. The
# runbook already prices a restart of the whole stack as an acceptable cost
# for a config change (a few seconds with no scraping; `prometheus-data` is a
# named volume, so the TSDB persists across it) -- see
# RUNBOOK-monitoring.md's rejected `--web.enable-lifecycle` alternative. This
# reset-then-append is the same pattern as the `EnvironmentFile=` reset
# above: the base value must be cleared before the replacement is set, or
# systemd appends the drop-in's ExecStart alongside the template's rather
# than replacing it, running `docker compose up` twice.
ExecStart=
ExecStart=/usr/bin/docker compose up -d --remove-orphans --wait --force-recreate
MemoryMax=2048M
CPUWeight=200
