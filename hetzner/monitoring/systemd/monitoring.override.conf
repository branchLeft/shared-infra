# Installed at /etc/systemd/system/branchleft-compose@monitoring.service.d/override.conf
# -- an instance override, not a change to the shared
# hetzner/provision/branchleft-compose@.service template.
#
# The ExecStartPre below is additive: systemd appends a drop-in's ExecStartPre
# after the template's own `docker compose pull`, it does not replace it.
# Alertmanager's real config does not exist until this has run at least once
# -- see stack/render_alertmanager_config.py's docstring for why the
# substitution cannot happen inside alertmanager.yml itself.
#
# Sizing and the CPUWeight direction are explained in RUNBOOK-monitoring.md's
# "Colocation cgroup bounds" section, which is the amendment's acceptance
# criterion for this file.
[Service]
ExecStartPre=/usr/bin/python3 /opt/branchleft/monitoring/render_alertmanager_config.py
MemoryMax=2048M
CPUWeight=200
