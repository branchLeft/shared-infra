# Installed at /etc/systemd/system/branchleft-compose@monitoring.service.d/override.conf
# -- an instance override, not a change to the shared
# hetzner/provision/branchleft-compose@.service template.
#
# The ExecStartPre below is additive: systemd appends a drop-in's ExecStartPre
# after the template's own `docker compose pull`, it does not replace it.
# Alertmanager's real config does not exist until this has run at least once
# -- see stack/render_alertmanager_config.py's docstring for why the
# substitution cannot happen inside alertmanager.yml itself.
#
# **`MemoryMax`/`CPUWeight` below bound the systemd-managed process tree
# only** -- the `docker compose` CLI and the `ExecStartPre` script above --
# not the six containers themselves. Same reasoning as
# `edge.override.conf`: `Type=oneshot` plus `docker compose up -d` detaches,
# and dockerd creates each container as a sibling scope under system.slice,
# not nested here. The real per-container containment is `mem_limit` and
# `cpu_shares` in `hetzner/monitoring/stack/compose.yml`. See
# RUNBOOK-monitoring.md's "Colocation cgroup bounds" for the arithmetic and
# its verification section for the container-level checks.
[Service]
# The template loads /etc/branchleft/%i.image.env with no leading dash, so a
# missing pin file fails the unit start. That is right for a stack resolving
# `image: ${IMAGE}` and impossible for this one: all six images are pinned
# inline, so nothing reads IMAGE, and branchleft-deploy refuses to write a pin
# a compose file never reads. Without this reset the stack has no writer for a
# file it cannot start without. Scoped to this instance, so `edge` and every
# future ${IMAGE} stack keep the mandatory pin.
EnvironmentFile=
# Re-added without the template's leading dash: this stack's secrets are not
# optional. render_alertmanager_config.py needs four of them and Grafana's
# GRAFANA_ADMIN_PASSWORD:? fails compose without the fifth.
EnvironmentFile=/etc/branchleft/monitoring.env
ExecStartPre=/usr/bin/python3 /opt/branchleft/monitoring/render_alertmanager_config.py
MemoryMax=2048M
CPUWeight=200
