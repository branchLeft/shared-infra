# Hand-written, unlike the rest of stack/: a probe module is a fixed check
# definition, not a hostname, so there is nothing here for sites.ts to derive.
# Prometheus's own scrape config (prometheus.yml, generated) is what supplies
# the per-hostname target list this module gets applied to.
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [] # defaults to 2xx
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: true
      tls_config:
        insecure_skip_verify: false

  # A scan-banned or dead-backend connection still completes the TCP
  # handshake and then EOFs, so a plain tcp_connect check reads as healthy
  # through exactly the outage it exists to catch. This module reads the
  # SMTP greeting instead: `expect` is matched against the first line the
  # server sends unprompted, then `send` writes the reply.
  smtp_banner:
    prober: tcp
    timeout: 10s
    tcp:
      # The tcp prober defaults to ip6, and mx1 publishes an AAAA record that
      # the monitoring network has no route to -- without this every probe
      # fails on dial and the alert pages permanently.
      preferred_ip_protocol: ip4
      query_response:
        - expect: '^220'
        # Double-quoted deliberately: YAML single quotes keep a backslash
        # literal, so 'QUIT\r\n' sends the six characters rather than a
        # CRLF-terminated command -- a malformed command on a mail port, which
        # is the event class that bans a source.
        - send: "QUIT\r\n"
        # Reading the goodbye line is not politeness: closing with the
        # server's reply still inbound makes the kernel answer it with an RST,
        # and an abnormally terminated session on a mail port is the shape a
        # ban heuristic keys on.
        - expect: '^221'

  # Implicit-TLS submission/IMAP ports negotiate TLS immediately on connect,
  # with no plaintext banner to read -- a completed handshake is the
  # equivalent liveness signal query_response gives the plaintext ports above.
  tls_connect:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: ip4
      tls: true
      tls_config:
        insecure_skip_verify: false
