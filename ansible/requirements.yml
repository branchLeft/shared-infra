# Intentionally empty (ANS-4). The collections the roles use arrive with the
# `ansible` package, which requirements.txt pins by version and hash, so the one
# lock records them for Dependabot and for an SBOM. A collection listed here
# would be fetched from Galaxy outside that lock, so ansible/checks/check_pins.py
# fails if this file names one. The harness still runs `ansible-galaxy collection
# install -r requirements.yml`; with this list empty it installs nothing.
collections: []
