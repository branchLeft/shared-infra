---
# The owner's values for the roles edge1 applies. check_enrolment.py (R10) allows these six
# keys and no others. With a flag false the role leaves its account's keys alone.
ci_login_manage_keys: false
ci_login_keys: []
# The jump account's key file and sshd Match block (the ci_jump role). With the flag false the
# role only reports, read only and without naming an account, which accounts hold forwarding
# options. The destinations are host names or IPv4 addresses with no port, and the role adds
# port 22; they are the one list behind every key line and the Match block. The keys are public
# keys, one per entry. The host's own address is a private IPv4 address and is left empty here.
# The account's name is not a key of this file and never appears in this repository (the owner
# ruled it stays secret): it is the input ci_jump_user of the host's private inputs file, which
# the host_inputs role sets before this role runs.
ci_jump_manage_keys: false
ci_jump_own_address: ''
ci_jump_destinations: []
ci_jump_keys: []
