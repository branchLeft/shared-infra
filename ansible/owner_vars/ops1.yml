---
# The owner's values for the roles ops1 applies. check_enrolment.py (R10) requires these keys
# and allows one more, control_plane_app_image, and no others: the step allow-list, the applications
# image, the step account's key and source addresses, two ring controller inputs, the
# provisioning controller's eight inputs (the last group), then the optional control plane pin.
#
# pull_trigger_steps is the gated pull's step allow-list: the routine control_plane_db steps
# ops1 may be asked to run. The program holds the closed list of ids and fixes each tag to
# control_plane_db_ plus the id, and refuses a file that breaks either (the role's README,
# "Step requests"). Strike an entry to stop that step being requested.
#
# The words are typing guards in a public file, not secrets. What stops a step is the protected
# environment whose only reviewer is the owner. The person dispatching reads the word here and
# types it in; one that does not match the entry for that step is refused.
#
# control_plane_db_apps_image is the applications image every step runs, pinned by digest as
# NAME@sha256: and 64 lower-case hex digits (the role's control_plane_db_image_pattern; a tag is
# not a pin). The migrate marker is keyed by this digest, so the migrations of a digest run once.
#
# control_plane_app_image is the image the running control plane uses, pinned the same way: the
# control_plane role runs /usr/local/sbin/branchleft-deploy control-plane with it, so the portal and
# console are recreated on it, and the role refuses a value that is not NAME@sha256: and 64 lower-case
# hex digits before it writes anything. It is the pin: a digest moved by hand on the host is put
# back to this one at the next apply, so move it here.
#
# Both are the one signed portal-apps image, published by portal-apps-image.yml from ghost-platform main, so
# the deploy wrapper verifies its attestation. While the two are equal, a plain apply migrates that image's
# database before the wrapper moves the stack onto it, with the migration login the control_plane_db role
# makes itself (the owner's ruling of 27 Nov 2026; the role's README, "The delivery's migration"). Move
# them together: a control_plane_app_image that is not the migration image migrates nothing.
#
# control_plane_db_identity_hostnames is not set here. With it unset the identity step refuses
# by name.
pull_trigger_steps:
  - id: migrate
    tag: control_plane_db_migrate
    word: MIGRATE-OPS1
  - id: identity
    tag: control_plane_db_identity
    word: IDENTITY-OPS1
  - id: provision
    tag: control_plane_db_provision
    word: PROVISION-OPS1
control_plane_db_apps_image: 'ghcr.io/branchleft/portal-apps@sha256:0dc42156834552c12ba94527605c1baff4c0cd56511cfb36c5fe88acaeadb222'
control_plane_app_image: 'ghcr.io/branchleft/portal-apps@sha256:0dc42156834552c12ba94527605c1baff4c0cd56511cfb36c5fe88acaeadb222'
#
# The step account's route (the ci_step_login role). ci_step_login_key is the public half of the
# step key the owner's deployment environment holds the private half of; the host keeps it as the
# one key of the step account, restricted to the trigger program in step mode. ci_step_login_from
# is where that key may connect from: ops1 has no public address and the step is sent through
# the edge1 jump host, so ops1's sshd sees edge1's private address. A wrong address refuses the
# key, so no step runs; it never widens it. Both are public values.
ci_step_login_key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF7LL0AnUqZIbGs312C8/jx7NR92q+Zs3LbSinLUh6JO control-plane-step'
ci_step_login_from:
  - '10.20.1.10'
#
# The two ring_controller_host_ keys are the public inputs of the ring controller's host role.
# Both are empty text until the owner sets them, and an empty bundle digest keeps the controller's
# timer disabled and stopped, so the role installs its units and makes its record-signing key and
# starts nothing (the role's README, "Inert until a digest is set"). The role holds the shapes and
# refuses a malformed value or a digest set with another input empty, naming the input and never
# its value. The bundle digest and URL are set only when a bundle exists. No repository name is built
# into the role.
ring_controller_host_bundle_sha256: ''
ring_controller_host_bundle_url: ''
#
# The eight provisioning_controller_host_ keys are the public inputs of that role. All are empty text
# until the owner sets them. An empty bundle digest keeps the controller's trigger held off, and the
# role installs its units and makes its ssh key but starts nothing (the role's README, "The units are
# inert until the bundle digest input is set"). The digest and URL are set when a bundle exists; the
# six route inputs are set all together or not at all. Jump account names are the owner's to set.
provisioning_controller_host_bundle_sha256: ''
provisioning_controller_host_bundle_url: ''
provisioning_controller_host_edge1_jump_user: ''
provisioning_controller_host_edget_jump_user: ''
provisioning_controller_host_edge1_host_key: ''
provisioning_controller_host_edget_host_key: ''
provisioning_controller_host_app_t1_host_key: ''
provisioning_controller_host_db_t1_host_key: ''
