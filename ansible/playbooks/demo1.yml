---
# demo1: the demo host's build. Two roles, in order: the slots, and the host's
# egress policy with the mail spool. The broker's own install (the broker_deploy
# role) comes first on the host and is not applied from here: its inputs are the
# owner's built bundle and public key, which have no home in a pulled commit yet,
# and applying it from this playbook would repoint a broker the owner installed
# by hand. demo1_build checks, read-only, that broker_deploy has run, and refuses
# the host when it has not.

# host_baseline is not applied here. The egress role needs Docker's DOCKER-USER
# chain and refuses the host, by name, when Docker is not running; the host's
# baseline is its own step, under its own enrolment decision. egress_nat is not
# applied here either: this host's containers must not reach the network, and a
# NAT rule would give them a way.

# The roles have no secret and no required input, so this playbook loads no
# variables file. The inventory entry for the host, the trigger that pulls this
# playbook and the nightly drift check are the host's enrolment, which is not in
# this file.
- name: Build demo1
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Refuse any host but demo1
      ansible.builtin.assert:
        that:
          - inventory_hostname in ['demo1', 'localhost']
        fail_msg: This playbook is demo1's. Limit the run to demo1.
        quiet: true
  # The roles live in ansible/roles/ (ANS-13), one level above this directory, and a
  # playbook finds roles only beside itself unless a path is given. One suppression per line.
  roles:
    - role: ../roles/demo1_build # noqa: role-name[path]
    - role: ../roles/demo1_egress_spool # noqa: role-name[path]
