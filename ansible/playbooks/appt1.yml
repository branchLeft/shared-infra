---
# appt1: the logical name of the tenant app host app-t1 (HOST_NAME allows [a-z][a-z0-9]*; the
# server and its hostname keep the hyphen). Under the gated pull. Six roles, in order: the
# Ansible toolchain the host runs this playbook with, the trigger that runs it, the host
# baseline (sshd drop-in, unattended upgrades, fail2ban, Docker CE), the host egress
# reconciler (egress_nat, with the gateway switch left at its default, off: this host is no
# NAT gateway), the deploy verifier (deploy_verifier), and the deploy wrapper and compose unit
# (deploy_tooling, class internal: no policy program, set in HOST_PLAY_VARS). The tenant
# stack itself, the two colours and the drain sidecar, is a later role: this playbook brings
# the host to the point where one can be delivered. The host has no private inputs, so
# host_inputs is not applied and its row is absent from checks/host_roles.yml. The gateway
# switch is not set here, so checks/test_egress_nat_single_gateway.py holds that this host
# stays off the gateway list.
#
# The host's trigger runs this file on a signed checkout with the inventory `localhost,`,
# which loads no group variables, so every value the roles read comes from vars_files: the
# shared includes and appt1's own trust file. There is no owner_vars file for this host.
- name: Bring appt1 under the pull
  hosts: all
  gather_facts: false
  vars:
    enrolled_host: appt1
    deploy_tooling_host_class: internal
  vars_files:
    - '{{ playbook_dir }}/includes/pull_trigger_common.yml'
    - '{{ playbook_dir }}/../trust/appt1.yml'
  pre_tasks:
    - name: Refuse a run that is not appt1's
      ansible.builtin.include_tasks: includes/refuse_other_hosts.yml
    - name: Refuse an empty signer list
      ansible.builtin.include_tasks: includes/require_signers.yml
  # The roles live in ansible/roles/ (ANS-13), one level above this directory. A
  # path works from any directory, which the host trigger and the lint do not share.
  roles:
    - role: ../roles/ansible_runtime # noqa: role-name[path]
      vars:
        ansible_runtime_requirements_src: '{{ playbook_dir }}/../requirements.txt'
    - role: ../roles/pull_trigger # noqa: role-name[path]
    - role: ../roles/host_baseline # noqa: role-name[path]
    - role: ../roles/egress_nat # noqa: role-name[path]
    - role: ../roles/deploy_verifier # noqa: role-name[path]
    - role: ../roles/deploy_tooling # noqa: role-name[path]
