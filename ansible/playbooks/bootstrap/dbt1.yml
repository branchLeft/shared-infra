---
# dbt1 bootstrap: the owner's one hand step on db-t1, the database host.
# It installs the pull and nothing else: the Ansible toolchain and the trigger, the two roles the
# CI route needs to reach the host. The first apply of every other role of playbooks/dbt1.yml then
# goes through the gated ansible-hosts approval, not through this run. checks/check_enrolment.py
# (R12) pins the roles to those two, so a service role added here is refused. It is never pulled:
# the trigger it installs is limited to playbooks/dbt1.yml (R3).
#
# Run it with the inline one-host inventory the enrolment runbook uses, `-i "dbt1,"` and
# `-e ansible_host=ADDRESS`; the refusal below ends a run that has any other host.
- name: Bootstrap the pull on dbt1
  hosts: all
  gather_facts: false
  vars:
    enrolled_host: dbt1
  vars_files:
    - '{{ playbook_dir }}/../includes/pull_trigger_common.yml'
    - '{{ playbook_dir }}/../../trust/dbt1.yml'
  pre_tasks:
    - name: Refuse a run that is not dbt1's
      ansible.builtin.include_tasks: ../includes/refuse_other_hosts.yml
    - name: Refuse an empty signer list
      ansible.builtin.include_tasks: ../includes/require_signers.yml
  # The roles live in ansible/roles/ (ANS-13), two levels above this directory.
  roles:
    - role: ../../roles/ansible_runtime # noqa: role-name[path]
      vars:
        ansible_runtime_requirements_src: '{{ playbook_dir }}/../../requirements.txt'
    - role: ../../roles/pull_trigger # noqa: role-name[path]
