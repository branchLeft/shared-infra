---
# app1: the gated pull. Four roles, in order: the Ansible toolchain this playbook
# runs with, the trigger that runs it, the loader of the host's private inputs
# (host_inputs), then the website stack (website_app1). The loader reads the one
# root-only file the owner places on the host and sets the four SMTP values the
# website role requires; it stops the run if that file is missing or unsafe. The
# website role is given no image here, so it writes the stack's files and enables
# its unit but deploys and restarts nothing; the website's own CI deploy remains
# the route that delivers an image. Only this host's name is set here; the remote,
# the playbook allowlist and the signer list come from the shared includes and the
# one trust file, all loaded through vars_files.
#
# The refusal is not a host control: under the trigger inventory_hostname is
# localhost. The root-owned pull config is the host control.
- name: Bring app1 under the pull
  hosts: all
  gather_facts: false
  vars:
    enrolled_host: app1
  vars_files:
    - '{{ playbook_dir }}/includes/pull_trigger_common.yml'
    - '{{ playbook_dir }}/../trust/app1.yml'
  pre_tasks:
    - name: Refuse a run that is not app1's
      ansible.builtin.include_tasks: includes/refuse_other_hosts.yml
    - name: Refuse an empty signer list
      ansible.builtin.include_tasks: includes/require_signers.yml
  # The roles live in ansible/roles/ (ANS-13), one level above this directory. A
  # path works from any directory, which the host trigger and the lint do not share.
  roles:
    - role: ../roles/ansible_runtime # noqa: role-name[path]
      vars:
        ansible_runtime_requirements_src: '{{ playbook_dir }}/../requirements.txt'
    - role: ../roles/pull_trigger # noqa: role-name[path]
    - role: ../roles/host_inputs # noqa: role-name[path]
    - role: ../roles/website_app1 # noqa: role-name[path]
