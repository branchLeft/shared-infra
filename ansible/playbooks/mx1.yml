---
# mx1: the mail host, enrolled under the pull. Three roles, in order:
# the Ansible toolchain the host runs this playbook with, the host baseline
# (sshd, unattended upgrades, fail2ban and Docker, as the three scripts under
# mail/provision/ set them up), then the trigger that runs this file.
#
# The host's trigger runs this file with the inventory `localhost,`, which loads
# no group variables, and a playbook must target `all` or `localhost` for that
# (pull_trigger README, limit f). So the values the roles read are loaded here
# from the production group variables. The one-time bootstrap, which does use
# the inventory, loads the same files, with the same content.
#
# The bootstrap runs this whole file, not a subset, because the gated pull
# applies the whole file on every apply. Its first run is a check-mode run,
# and only the second, real run follows (the bootstrap runbook lives in the docs
# repository, not here). Run against
# more than one host this playbook would apply mx1's values to every one, so the
# first play refuses any host but mx1 (or the localhost the trigger names).
- name: Bring mx1 under the pull
  hosts: all
  gather_facts: false
  vars_files:
    - '{{ playbook_dir }}/../inventories/production/group_vars/all/pull_trigger.yml'
    - '{{ playbook_dir }}/../inventories/production/group_vars/mx/pull_trigger.yml'
  pre_tasks:
    - name: Refuse any host but mx1
      ansible.builtin.assert:
        that:
          - inventory_hostname in ['mx1', 'localhost']
        fail_msg: This playbook is mx1's. Limit the run to mx1.
        quiet: true
  # The roles live in ansible/roles/ (ANS-13), one level above this directory, and a
  # playbook finds roles only beside itself unless a path is given. A path works
  # from any directory, which the host trigger (started in ansible/) and the lint
  # (started at the repository root) do not share. One suppression per line.
  roles:
    - role: ../roles/ansible_runtime # noqa: role-name[path]
      vars:
        ansible_runtime_requirements_src: '{{ playbook_dir }}/../requirements.txt'
    - role: ../roles/host_baseline # noqa: role-name[path]
    - role: ../roles/pull_trigger # noqa: role-name[path]
