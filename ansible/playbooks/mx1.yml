---
# mx1: the logical name of the self-hosted mail host (HOST_NAME allows [a-z][a-z0-9]* only).
# Under the gated pull. Three roles, in order: the Ansible toolchain the host runs this playbook
# with, the trigger that runs it, then the host baseline (key-only sshd drop-in, unattended
# upgrades, fail2ban and Docker CE). The baseline is the one the mail host's provisioning
# scripts wrote by hand; the role writes the same bytes. The mail stack (mx1_stack and the
# reconcilers) is not applied here: it stays hand-run until its own change enrols it.
#
# The opt-out host_baseline_fail2ban_ignoreip_none is true for this host alone. Its play var is
# pinned in HOST_PLAY_VARS in checks/check_enrolment.py, which R2 holds this play to exactly: the
# jail the scripts wrote has no ignoreip line, and the opt-out makes the role write that jail. The
# sshd drop-in is written under the role's own name (01-), so the host keeps an identical
# 99- duplicate from the scripts; that duplicate is a known, accepted one.
#
# The host has no private inputs, so host_inputs is not applied and its row is absent from
# checks/host_roles.yml beyond the baseline.
#
# The host's trigger runs this file on a signed checkout with the inventory `localhost,`,
# which loads no group variables, so every value the roles read comes from vars_files and
# this play. There is no owner_vars file for this host.
- name: Bring mx1 under the pull
  hosts: all
  gather_facts: false
  vars:
    enrolled_host: mx1
    host_baseline_fail2ban_ignoreip_none: true
  vars_files:
    - '{{ playbook_dir }}/includes/pull_trigger_common.yml'
    - '{{ playbook_dir }}/../trust/mx1.yml'
  pre_tasks:
    - name: Refuse a run that is not mx1's
      ansible.builtin.include_tasks: includes/refuse_other_hosts.yml
    - name: Refuse an empty signer list
      ansible.builtin.include_tasks: includes/require_signers.yml
  # The roles live in ansible/roles/ (ANS-13), one level above this directory. A
  # path works from any directory, which the host trigger and the lint do not share.
  roles:
    - role: ../roles/ansible_runtime # noqa: role-name[path]
      vars:
        ansible_runtime_requirements_src: '{{ playbook_dir }}/../requirements.txt'
    - role: ../roles/pull_trigger # noqa: role-name[path]
    - role: ../roles/host_baseline # noqa: role-name[path]
