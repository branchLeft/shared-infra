---
# dbt1: the logical name of the database host db-t1 (HOST_NAME allows [a-z][a-z0-9]*; the
# server and its hostname keep the hyphen). Under the gated pull. Ten roles, in order: the
# Ansible toolchain the host runs this playbook with, the trigger that runs it, the loader of the
# host's private inputs (host_inputs: the controller's key and address for the tenant database
# entry point), the host baseline (sshd drop-in, unattended upgrades, fail2ban, Docker CE), the
# host egress reconciler (egress_nat, with the gateway switch left at its default, off: this host
# is no NAT gateway), the deploy verifier (deploy_verifier), the deploy wrapper and compose unit
# (deploy_tooling, class internal: no policy program, set in HOST_PLAY_VARS), the host's metrics
# exporter (node_exporter), the tenant database stack (db_t1), and the tenant database entry point
# (db_t1_tenant_entry), last, so a refusal in either holds nothing else back, the exporter included.
# The entry point reads the database stack, so it follows db_t1. Its private inputs are the two
# keys of checks/host_roles.yml's loader row for dbt1, seeded by the owner before the first apply.
# The gateway switch is not set here, so checks/test_egress_nat_single_gateway.py holds that this
# host stays off the gateway list.
#
# The host's trigger runs this file on a signed checkout with the inventory `localhost,`,
# which loads no group variables, so every value the roles read comes from vars_files: the
# shared includes and dbt1's own trust file. There is no owner_vars file for this host.
- name: Bring dbt1 under the pull
  hosts: all
  gather_facts: false
  vars:
    enrolled_host: dbt1
    deploy_tooling_host_class: internal
    # The host's journal keeps an entry for at most 30 days, inside the 90 days the
    # website's privacy notice states for server logs. Pinned by checks/test_tenant_host_monitoring.py.
    host_baseline_journal_retention_days: 30
  vars_files:
    - '{{ playbook_dir }}/includes/pull_trigger_common.yml'
    - '{{ playbook_dir }}/../trust/dbt1.yml'
  pre_tasks:
    - name: Refuse a run that is not dbt1's
      ansible.builtin.include_tasks: includes/refuse_other_hosts.yml
    - name: Refuse an empty signer list
      ansible.builtin.include_tasks: includes/require_signers.yml
  # The roles live in ansible/roles/ (ANS-13), one level above this directory. A
  # path works from any directory, which the host trigger and the lint do not share.
  roles:
    - role: ../roles/ansible_runtime # noqa: role-name[path]
      vars:
        ansible_runtime_requirements_src: '{{ playbook_dir }}/../requirements.txt'
    - role: ../roles/pull_trigger # noqa: role-name[path]
    - role: ../roles/host_inputs # noqa: role-name[path]
    - role: ../roles/host_baseline # noqa: role-name[path]
    - role: ../roles/egress_nat # noqa: role-name[path]
    - role: ../roles/deploy_verifier # noqa: role-name[path]
    - role: ../roles/deploy_tooling # noqa: role-name[path]
    - role: ../roles/node_exporter # noqa: role-name[path]
    - role: ../roles/db_t1 # noqa: role-name[path]
    - role: ../roles/db_t1_tenant_entry # noqa: role-name[path]
