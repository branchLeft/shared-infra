---
# The role's container-only test (ANS-15). The harness in ansible/harness
# sets ROLE_TEST_RUN_ID, so the instance name is unique to one run and a
# destroy can only ever remove this run's container.
dependency:
  name: galaxy
  # The harness installs the pinned collections before it starts Molecule.
  enabled: false
driver:
  name: docker
platforms:
  - name: 'role-test-${ROLE_TEST_RUN_ID:-unset/use-the-harness}'
    # Third-party test base with the same Debian release as the production
    # hosts, trusted by digest (see the role README). The digest is the pin; the
    # tag is informational and may since have moved on. It has Python, the
    # account tools and runuser in it. The scenario does not need systemd, so it
    # sets none of the settings that run systemd: no cgroup mount, no cgroup
    # namespace mode and no tmpfs. No privileged mode and no added capabilities.
    image: geerlingguy/docker-debian13-ansible:latest@sha256:979c0d5e12b0035fff1c46bd4dfd00d67cd82fa48035194f14f32e01c8c02372
    # Pre-built, so that the reference can carry a digest.
    pre_build_image: true
    # The image's own command starts systemd as the first process, and systemd
    # needs a cgroup mount and a cgroup namespace mode that this scenario does
    # not grant; on a host with cgroup v2 the container can exit at once. A
    # plain sleep keeps the container alive so Ansible can run in it. Molecule
    # overrides the image command with a sleep loop when none is set; naming it
    # here keeps the scenario from depending on that default.
    command: sleep infinity
    # The image declares /sys/fs/cgroup as a volume and this scenario does not
    # bind-mount it, so Docker makes an anonymous volume for every container
    # started from the image. Molecule's destroy keeps a container's volumes
    # unless told otherwise, and an anonymous volume carries no label to find it
    # by, so each run would leave one behind.
    keep_volumes: false
    labels:
      branchleft.role-test-run: '${ROLE_TEST_RUN_ID}'
provisioner:
  name: ansible
  env:
    # Every Ansible run of this scenario appends its output to one log on the
    # controller, and verify reads it. Verbosity 3 prints each task's result
    # with the arguments it was given, so a task that handles a secret and
    # lacks no_log shows it in the log, and verify fails (ANS-16).
    ANSIBLE_LOG_PATH: '${MOLECULE_EPHEMERAL_DIRECTORY}/ansible.log'
    ANSIBLE_VERBOSITY: '3'
  inventory:
    # The values the role runs with, read by the prepare, converge and verify
    # plays as well. Placeholders only. Every secret value is a throwaway
    # SENTINEL made for this run by prepare.yml on the controller, in a file
    # under scenario_sentinel_dir, and read back here. Prepare seeds the
    # generator with the label, so the same label gives the same value and a
    # run's output can be searched for the values afterwards (see the role
    # README); the values are not in this file.
    group_vars:
      all:
        scenario_sentinel_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/throwaway-secrets"
        scenario_log_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/ansible.log"
        scenario_sentinel_labels:
          - file_secret
          - env_secret
          - host_secret
          - file_secret_rotated
          - host_secret_rotated
          - earlier_secret
          - blocked_secret
          - window_secret
          - probe_role
          - probe_echoed
        # The account and group the files belong to. They are not root, so the
        # test shows that the role's owner and group parameters produce the
        # result: on a root-owned default the same assertion would pass without
        # them. Prepare creates both.
        scenario_owner: example_user
        scenario_group: example_group
        scenario_directory: /etc/example-service/secrets
        scenario_env_name: service.env
        scenario_source_dir: /root/example-sources
        scenario_host_source: /root/example-sources/EXAMPLE_HOST_SECRET
        scenario_secrets:
          - name: EXAMPLE_FILE_SECRET
            value: "{{ lookup('ansible.builtin.file', scenario_sentinel_dir ~ '/file_secret') }}"
          - name: EXAMPLE_ENV_SECRET
            value: "{{ lookup('ansible.builtin.file', scenario_sentinel_dir ~ '/env_secret') }}"
          - name: EXAMPLE_HOST_SECRET
            source_file: /root/example-sources/EXAMPLE_HOST_SECRET
verifier:
  name: ansible
