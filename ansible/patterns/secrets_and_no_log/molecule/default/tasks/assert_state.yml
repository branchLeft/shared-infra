---
# Requires state_file_value, state_env_value and state_host_value: the values
# the three secrets must hold on the host. Nothing here prints a value: the
# files are compared by checksum, and a comparison that fails names the file.
# The environment file is exactly one line for each secret given as a value. A
# backslash-n in a folded YAML scalar is not a line break, so the line break is
# built from its code point.
- name: Work out the text the environment file must hold
  ansible.builtin.set_fact:
    state_env_text: >-
      {{ 'EXAMPLE_FILE_SECRET=' ~ state_file_value ~ ('%c' | format(10))
      ~ 'EXAMPLE_ENV_SECRET=' ~ state_env_value ~ ('%c' | format(10)) }}
  no_log: true

# A key of a mapping written in YAML is not templated, so the environment file's
# name goes in through a Jinja mapping.
- name: Work out the checksum each file must have
  ansible.builtin.set_fact:
    state_checksums: >-
      {{ {'EXAMPLE_FILE_SECRET': state_file_value | hash('sha1'),
      'EXAMPLE_ENV_SECRET': state_env_value | hash('sha1'),
      'EXAMPLE_HOST_SECRET': state_host_value | hash('sha1'),
      scenario_env_name: state_env_text | hash('sha1')} }}
  no_log: true

- name: Read the secrets directory
  ansible.builtin.stat:
    path: '{{ scenario_directory }}'
  register: state_directory

# An earlier release left this directory open to everyone, so the mode proves
# the role closed it. The owner and group are not root.
- name: Assert the directory is closed to everyone but its owner
  ansible.builtin.assert:
    that:
      - state_directory.stat.exists
      - state_directory.stat.isdir
      - state_directory.stat.mode == '0700'
      - state_directory.stat.pw_name == scenario_owner
      - state_directory.stat.gr_name == scenario_group
    quiet: true

# The listing includes hidden files and every kind of entry, so a backup copy,
# a temporary file Ansible left, or a file the earlier release left would show.
- name: List everything in the secrets directory
  ansible.builtin.find:
    paths: '{{ scenario_directory }}'
    file_type: any
    hidden: true
    patterns: '*'
  register: state_listing

- name: Assert the directory holds the declared files and nothing else
  ansible.builtin.assert:
    that:
      - state_listing.files | map(attribute='path') | map('basename') | sort == state_checksums.keys() | sort
    fail_msg: 'The secrets directory holds {{ state_listing.files | map(attribute="path") | map("basename") | sort }}.'
    quiet: true

- name: Read each secret file
  ansible.builtin.stat:
    path: '{{ scenario_directory }}/{{ item }}'
  loop: '{{ state_checksums.keys() | sort }}'
  register: state_files
  # The results hold the SHA-1 of each secret file, so the task that reads them is
# hidden from the log (ANS-16: a digest is a leak too). It keeps only the names of
# the files that break each attribute, as JSON, so the assertions below can name
# the attribute and the files without a digest reaching the log.
- name: Work out which secret files break each attribute
  ansible.builtin.set_fact:
    state_broken: >-
      {%- set bad = {'kind': [], 'mode': [], 'owner': [], 'group': [], 'links': [], 'checksum': []} -%}
      {%- for r in state_files.results -%}
        {%- if not (r.stat.exists | default(false)) or not (r.stat.isreg | default(false)) -%}
          {%- set _ = bad['kind'].append(r.item) -%}
        {%- endif -%}
        {%- if r.stat.mode | default('') != '0600' -%}
          {%- set _ = bad['mode'].append(r.item) -%}
        {%- endif -%}
        {%- if r.stat.pw_name | default('') != scenario_owner -%}
          {%- set _ = bad['owner'].append(r.item) -%}
        {%- endif -%}
        {%- if r.stat.gr_name | default('') != scenario_group -%}
          {%- set _ = bad['group'].append(r.item) -%}
        {%- endif -%}
        {%- if r.stat.nlink | default(0) != 1 -%}
          {%- set _ = bad['links'].append(r.item) -%}
        {%- endif -%}
        {%- if r.stat.checksum | default('') != state_checksums[r.item] -%}
          {%- set _ = bad['checksum'].append(r.item) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ bad | to_json }}
  no_log: true

# Mode 0600 and an owner that is not root: an earlier file that anyone could
# read and root owned stays that way unless the role sets both. One link, so
# no second name for the file exists. The checksum is of exactly the value (the
# environment file: exactly its lines), so a trailing line break would fail.
- name: Assert each secret file is a plain file that exists
  ansible.builtin.assert:
    that:
      - (state_broken | from_json)['kind'] | length == 0
    fail_msg: 'Not an existing plain file: {{ (state_broken | from_json)["kind"] | join(", ") }}.'
    quiet: true

- name: Assert each secret file has mode 0600
  ansible.builtin.assert:
    that:
      - (state_broken | from_json)['mode'] | length == 0
    fail_msg: 'Not mode 0600: {{ (state_broken | from_json)["mode"] | join(", ") }}.'
    quiet: true

- name: Assert each secret file is owned by the scenario owner
  ansible.builtin.assert:
    that:
      - (state_broken | from_json)['owner'] | length == 0
    fail_msg: 'Not owned by the scenario owner: {{ (state_broken | from_json)["owner"] | join(", ") }}.'
    quiet: true

- name: Assert each secret file is in the scenario group
  ansible.builtin.assert:
    that:
      - (state_broken | from_json)['group'] | length == 0
    fail_msg: 'Not in the scenario group: {{ (state_broken | from_json)["group"] | join(", ") }}.'
    quiet: true

- name: Assert each secret file has one link
  ansible.builtin.assert:
    that:
      - (state_broken | from_json)['links'] | length == 0
    fail_msg: 'Not one link: {{ (state_broken | from_json)["links"] | join(", ") }}.'
    quiet: true

- name: Assert each secret file holds exactly its value
  ansible.builtin.assert:
    that:
      - (state_broken | from_json)['checksum'] | length == 0
    fail_msg: 'Does not hold exactly its value: {{ (state_broken | from_json)["checksum"] | join(", ") }}.'
    quiet: true

- name: Read the source file of the host-file secret
  ansible.builtin.stat:
    path: '{{ scenario_host_source }}'
  register: state_source
  no_log: true

- name: Assert the source file is untouched and still root-only
  ansible.builtin.assert:
    that:
      - state_source.stat.exists
      - state_source.stat.mode == '0600'
      - state_source.stat.uid == 0
      - state_source.stat.checksum == state_checksums['EXAMPLE_HOST_SECRET']
    quiet: true
  no_log: true
