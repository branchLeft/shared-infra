---
# Handlers run in the order written here. Each action and its record are two
# handlers that share one listen topic, so one notify runs both. The reload comes
# first, so a restart that follows it sees the new unit file.
- name: Reload systemd manager
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: unit files changed

- name: Record the daemon reload
  ansible.builtin.file:
    path: '{{ program_and_timer_event_dir }}/reload-{{ now(utc=true, fmt="%Y%m%d%H%M%S%f") }}'
    state: touch
    owner: root
    group: root
    mode: '0644'
  listen: unit files changed

# Check mode would ask systemd to restart a timer that no file defines yet, so
# the restart and its record are skipped in check mode only. The skip is stated
# here (ANS-10); a real run never skips them.
- name: Restart the program timer
  ansible.builtin.systemd_service:
    name: program_and_timer_tick.timer
    state: restarted
  when: not ansible_check_mode
  listen: program changed

- name: Record the program timer restart
  ansible.builtin.file:
    path: '{{ program_and_timer_event_dir }}/restart-{{ now(utc=true, fmt="%Y%m%d%H%M%S%f") }}'
    state: touch
    owner: root
    group: root
    mode: '0644'
  when: not ansible_check_mode
  listen: program changed
