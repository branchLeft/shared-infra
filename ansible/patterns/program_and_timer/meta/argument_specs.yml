---
argument_specs:
  main:
    short_description: Install an existing program after its check, then enable its timer
    description: >-
      Delivers one program file that the role never edits, runs the program's own
      install-time check before the file replaces the installed one, delivers the
      timer and its oneshot service, enables and starts the timer, and restarts the
      timer once when the program file changes. The program is owned by root and the
      unit runs it as root, unless a service user is declared: then the program, its
      directory and the unit belong to that user.
    author: AUTHOR_NAME
    options:
      program_and_timer_program_src:
        type: str
        description: Source of the program, not empty. A name under the role's files directory, or an absolute path on the controller.
        default: example_program.sh
      program_and_timer_program_dir:
        type: str
        description: >-
          The directory the role creates for the program and takes over (owner, group,
          mode 0755). It must be used for nothing else. An absolute path of plain
          characters with no .. and no trailing slash, at least two components deep, and
          not a system directory (the list is in vars/main.yml).
        default: /usr/local/lib/program_and_timer
      program_and_timer_program_name:
        type: str
        description: File name of the program inside its directory. One name, no path separator.
        default: program.sh
      program_and_timer_service_user:
        type: str
        description: >-
          The user the program and its directory belong to, and the user the unit runs
          the program as. Empty means root. It must exist before the role runs. None of
          the variables is a secret.
        default: ''
      program_and_timer_service_group:
        type: str
        description: >-
          The group of the program and its directory, and the group the unit runs the
          program as. Declared together with the user, or both empty. It must exist
          before the role runs.
        default: ''
      program_and_timer_unit_description:
        type: str
        description: Description written into both unit files. A change to it edits both unit files and triggers one daemon reload.
        default: EXAMPLE_UNIT_DESCRIPTION
      program_and_timer_tick_calendar:
        type: str
        description: OnCalendar value of the timer.
        default: hourly
