---
# Internal to the role, not part of its interface: role variables outrank every
# value a caller passes, so a caller cannot change either of them.

# The installed program. Both parts are checked at the start of the role.
program_and_timer_program_path: '{{ program_and_timer_program_dir }}/{{ program_and_timer_program_name }}'

# Directories the role never takes over. It changes the owner, group and mode of
# the program directory, so the directory must be one nothing else uses. A path
# with fewer than two components is refused as well, which covers every
# top-level directory.
program_and_timer_shared_dirs:
  - /bin
  - /boot
  - /dev
  - /etc
  - /etc/systemd
  - /etc/systemd/system
  - /home
  - /lib
  - /lib64
  - /opt
  - /proc
  - /root
  - /run
  - /sbin
  - /srv
  - /sys
  - /tmp
  - /usr
  - /usr/bin
  - /usr/lib
  - /usr/lib/systemd
  - /usr/lib/systemd/system
  - /usr/local
  - /usr/local/bin
  - /usr/local/etc
  - /usr/local/lib
  - /usr/local/sbin
  - /usr/local/share
  - /usr/sbin
  - /usr/share
  - /var
  - /var/cache
  - /var/lib
  - /var/log
  - /var/run
  - /var/spool
  - /var/tmp
