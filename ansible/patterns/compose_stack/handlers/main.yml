---
# Runs once, at the flush in tasks/main.yml, and only when a delivery changed.
# Nothing here removes data: no orphan removal, no renewed anonymous volumes,
# and state is present, never absent (which would run `down`).
- name: Bring up the compose stack
  community.docker.docker_compose_v2:
    project_src: '{{ compose_stack_project_dir }}'
    project_name: '{{ compose_stack_project_name }}'
    state: present
    # A changed file that a container only bind-mounts does not change the
    # container's configuration, so a plain `up` would leave the old file in
    # use. Recreating keeps named volumes.
    recreate: always
    build: never
    wait: true
    wait_timeout: '{{ compose_stack_wait_timeout }}'
    remove_orphans: false
    renew_anon_volumes: false
  # No compose file on disk means check mode on a fresh host: nothing to dry run.
  when: compose_stack_compose_file_stat.stat.exists
