---
# The compose file is rendered once, from the template the caller names, and
# parsed, not searched, so a tag in quotes, in a flow mapping, behind an anchor
# or in a comment is judged by what YAML says it is. Every later check reads this
# one rendering. Nothing is written to the host by this task.
- name: Render the compose file the caller names
  ansible.builtin.set_fact:
    compose_stack_compose_text: "{{ lookup('ansible.builtin.template', compose_stack_compose_template) }}"

- name: Parse the rendered compose file
  ansible.builtin.set_fact:
    compose_stack_rendered: '{{ compose_stack_compose_text | ansible.builtin.from_yaml }}'

# A service that builds its own image has no digest to pin, so it is refused
# too. This runs before anything is written to the host.
- name: Refuse a compose file whose images are not all pinned by digest
  ansible.builtin.assert:
    that:
      - compose_stack_rendered.services is ansible.builtin.mapping
      - compose_stack_rendered.services | ansible.builtin.length > 0
      - compose_stack_rendered.include is ansible.builtin.undefined
      - compose_stack_service_list | ansible.builtin.selectattr('build', 'ansible.builtin.defined') | ansible.builtin.list | ansible.builtin.length == 0
      - compose_stack_service_list | ansible.builtin.selectattr('extends', 'ansible.builtin.defined') | ansible.builtin.list | ansible.builtin.length == 0
      - compose_stack_service_list | ansible.builtin.rejectattr('image', 'ansible.builtin.defined') | ansible.builtin.list | ansible.builtin.length == 0
      - compose_stack_images | ansible.builtin.reject('ansible.builtin.match', compose_stack_image_pattern) | ansible.builtin.list | ansible.builtin.length == 0
    quiet: true
    fail_msg: >-
      Every service needs an image reference ending in @sha256: and 64 lower-case
      hex digits. No service may build an image or extend another, and the file may
      not include another. A tag alone can move.
  vars:
    compose_stack_service_list: '{{ compose_stack_rendered.services.values() | ansible.builtin.list }}'
    compose_stack_images: "{{ compose_stack_service_list | ansible.builtin.map(attribute='image') | ansible.builtin.list }}"
    compose_stack_image_pattern: '^[^\s@]+@sha256:[0-9a-f]{64}\Z'

# A configuration file is named relative to the project directory, with at most
# one directory level, and may not climb out of it. A name that starts with a dot
# is refused too, so no configuration file can take the stamp's name.
- name: List the configuration file names
  ansible.builtin.set_fact:
    compose_stack_names: "{{ compose_stack_config_files | ansible.builtin.map(attribute='name') | ansible.builtin.list }}"

- name: Refuse a configuration file name that is not a plain relative path
  ansible.builtin.assert:
    that:
      - compose_stack_names | ansible.builtin.reject('ansible.builtin.match', compose_stack_name_pattern) | ansible.builtin.list | ansible.builtin.length == 0
    quiet: true
    fail_msg: >-
      A configuration file name is a relative path of at most one directory, each part
      starting with a letter or digit. Found {{ compose_stack_config_files | ansible.builtin.map(attribute='name') | ansible.builtin.list }}.
  vars:
    compose_stack_name_pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*(/[A-Za-z0-9][A-Za-z0-9_.-]*)?\Z'

# Compose merges a compose.override.yaml that sits next to the compose file,
# unless the files are named on the command line. Every call below names the
# compose file, so an override is never read; this refuses one anyway, because
# an image added there would not have been through the digest check above.
# Reading only, so it runs in check mode too.
- name: Look at the project directory before looking in it
  ansible.builtin.stat:
    path: '{{ compose_stack_project_dir }}'
  register: compose_stack_project_dir_stat

- name: Look for a compose override file in the project directory
  ansible.builtin.find:
    paths: '{{ compose_stack_project_dir }}'
    patterns:
      - compose.override.y*ml
      - docker-compose.override.y*ml
    file_type: any
  register: compose_stack_overrides
  when: compose_stack_project_dir_stat.stat.isdir | ansible.builtin.default(false)

- name: Refuse a project directory that holds a compose override file
  ansible.builtin.assert:
    that:
      - compose_stack_overrides.files | ansible.builtin.default([]) | ansible.builtin.length == 0
    quiet: true
    fail_msg: >-
      The project directory holds a compose override file, which Compose would
      merge into the stack without the digest check. Remove it:
      {{ compose_stack_overrides.files | ansible.builtin.default([]) | ansible.builtin.map(attribute='path') | ansible.builtin.list }}.

# One digest of everything the stack is made of: the compose file as rendered,
# the configuration files' names, modes and content, and the secret files' names
# and content. It is a function of the inputs, not of the host, so it can be
# worked out in check mode, before anything is written. It is one-way and never
# printed.
- name: Work out the stamp of the content this run delivers
  ansible.builtin.set_fact:
    compose_stack_stamp: >-
      {{ {'compose': compose_stack_compose_text, 'config': compose_stack_config_files, 'secrets': compose_stack_secret_files}
      | ansible.builtin.to_json(sort_keys=True) | ansible.builtin.hash('sha256') }}
  no_log: true

- name: Create the project directory
  ansible.builtin.file:
    path: '{{ compose_stack_project_dir }}'
    state: directory
    owner: root
    group: '{{ compose_stack_group }}'
    mode: '{{ compose_stack_project_mode }}'

# A configuration file in a directory of its own needs that directory first. The
# directories are the parents of the names, not the names themselves, and a name
# at the top of the project directory has none.
- name: Create the directories of the configuration files
  ansible.builtin.file:
    path: '{{ compose_stack_project_dir }}/{{ item }}'
    state: directory
    owner: root
    group: '{{ compose_stack_group }}'
    mode: '{{ compose_stack_project_mode }}'
  loop: >-
    {{ compose_stack_names | ansible.builtin.map("ansible.builtin.dirname")
    | ansible.builtin.reject("equalto", ".") | ansible.builtin.unique | ansible.builtin.list }}

# No delivery task notifies a handler. A notification is lost if a later task
# fails, and the next run would find every file already delivered; the stamp
# below is what remembers that the stack was never brought up.
- name: Deliver the configuration files
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '{{ compose_stack_project_dir }}/{{ item.name }}'
    owner: '{{ compose_stack_owner }}'
    group: '{{ compose_stack_group }}'
    mode: "{{ item.mode | ansible.builtin.default('0640') }}"
  loop: '{{ compose_stack_config_files }}'
  register: compose_stack_config_delivery

# The item is not labelled: with no_log off, the loop prints the whole item, so
# the test can see a missing no_log. With it on, the output says "censored".
- name: Deliver the secret files
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '{{ compose_stack_project_dir }}/{{ item.name }}'
    owner: '{{ compose_stack_owner }}'
    group: '{{ compose_stack_group }}'
    mode: '0600'
  loop: '{{ compose_stack_secret_files }}'
  register: compose_stack_secret_delivery
  no_log: true
  diff: false

# Last of the deliveries, so the files it points at are already on disk when
# the validator reads them. The validator runs on a temporary copy before the
# file replaces the old one.
- name: Deliver the compose file
  ansible.builtin.copy:
    content: '{{ compose_stack_compose_text }}'
    dest: '{{ compose_stack_project_dir }}/{{ compose_stack_compose_file }}'
    owner: root
    group: root
    mode: '0644'
    validate: docker compose --project-directory {{ compose_stack_project_dir }} --file %s config --quiet
  register: compose_stack_compose_delivery

# Check mode writes no compose file, so on a fresh host there is nothing for a
# dry run of the stack, or a look at its containers, to read. The tasks below that
# need it run whenever the file is really on disk, and the skip on a fresh host is
# stated here (ANS-10). stat runs in check mode as it does in a real run.
- name: Read back the compose file
  ansible.builtin.stat:
    path: '{{ compose_stack_project_dir }}/{{ compose_stack_compose_file }}'
  register: compose_stack_compose_file_stat

# The stamp file holds the digest of the content the stack was last brought up
# with and found healthy. Its checksum is read, not its content, so the file
# needs no decoding and the comparison reports no change.
- name: Read the checksum of the recorded stamp
  ansible.builtin.stat:
    path: '{{ compose_stack_project_dir }}/.compose_stack_stamp'
    checksum_algorithm: sha256
  register: compose_stack_recorded_stamp

# Bring the stack up when its content is not the content last recorded as good,
# which covers a first run, an edit, and a run that follows one that failed
# before the stamp was written. Also when a delivery task changed a file in this
# run, which covers a file that was edited by hand and put back: a container that
# bind-mounts one file keeps the inode it started with.
- name: Work out whether the stack must be brought up
  ansible.builtin.set_fact:
    compose_stack_up_needed: >-
      {{ compose_stack_config_delivery is ansible.builtin.changed
      or compose_stack_secret_delivery is ansible.builtin.changed
      or compose_stack_compose_delivery is ansible.builtin.changed
      or not (compose_stack_recorded_stamp.stat.exists
      and compose_stack_recorded_stamp.stat.checksum == (compose_stack_stamp | ansible.builtin.hash('sha256'))) }}

# Nothing here removes data: no orphan removal, no renewed anonymous volumes,
# and state is present, never absent (which would run `down`). The compose file
# is named, so an override file is never merged. Services scoped by
# compose_stack_services are the only ones recreated.
- name: Bring up the stack
  community.docker.docker_compose_v2:
    project_src: '{{ compose_stack_project_dir }}'
    project_name: '{{ compose_stack_project_name }}'
    files:
      - '{{ compose_stack_compose_file }}'
    services: '{{ compose_stack_services }}'
    state: present
    # A changed file that a container only bind-mounts does not change the
    # container's configuration, so a plain `up` would leave the old file in
    # use. Recreating is what puts the new file in front of the container.
    recreate: always
    build: never
    wait: true
    wait_timeout: '{{ compose_stack_wait_timeout }}'
    remove_orphans: false
    renew_anon_volumes: false
  when:
    - compose_stack_compose_file_stat.stat.exists
    - compose_stack_up_needed | ansible.builtin.bool

# The same module in check mode, which runs `up --dry-run` and then lists the
# project's containers, and changes nothing, so it is also run in check mode. It
# reads the whole project, not only the scoped services. The module checks the
# Compose version itself (see the README).
- name: Read the state of the stack's containers without changing it
  community.docker.docker_compose_v2:
    project_src: '{{ compose_stack_project_dir }}'
    project_name: '{{ compose_stack_project_name }}'
    files:
      - '{{ compose_stack_compose_file }}'
    state: present
    build: never
    wait: false
    remove_orphans: false
    renew_anon_volumes: false
  register: compose_stack_health
  check_mode: true
  changed_when: false
  when: compose_stack_compose_file_stat.stat.exists

# Every service of the compose file must have a container that runs and, where
# the image declares a healthcheck, is healthy. This always runs: a stack the
# caller did not give a healthcheck is judged on running, and a stack that has
# one on healthy.
- name: Refuse a stack with a service that is missing, not running or not healthy
  ansible.builtin.assert:
    that:
      - compose_stack_missing | ansible.builtin.length == 0
      - compose_stack_not_running | ansible.builtin.length == 0
      - compose_stack_unhealthy | ansible.builtin.length == 0
    quiet: true
    fail_msg: >-
      The compose stack is not healthy. Services with no container:
      {{ compose_stack_missing }}. Not running: {{ compose_stack_not_running }}.
      Unhealthy or still starting: {{ compose_stack_unhealthy }}.
  vars:
    compose_stack_containers: '{{ compose_stack_health.containers }}'
    compose_stack_declared: '{{ compose_stack_rendered.services.keys() | ansible.builtin.list }}'
    compose_stack_missing: >-
      {{ compose_stack_declared | ansible.builtin.difference(compose_stack_containers
      | ansible.builtin.map(attribute='Service') | ansible.builtin.list) }}
    compose_stack_not_running: >-
      {{ compose_stack_containers | ansible.builtin.rejectattr('State', 'ansible.builtin.equalto', 'running')
      | ansible.builtin.map(attribute='Service') | ansible.builtin.list }}
    compose_stack_unhealthy: >-
      {{ compose_stack_containers | ansible.builtin.selectattr('Health', 'ansible.builtin.defined')
      | ansible.builtin.selectattr('Health', 'ansible.builtin.in', ['unhealthy', 'starting'])
      | ansible.builtin.map(attribute='Service') | ansible.builtin.list }}
  when: compose_stack_compose_file_stat.stat.exists

# Optional: a page or API the caller names, asked from the host, for an image that
# cannot carry its own healthcheck. Empty means no such check. A failed request is
# kept as a result and judged by the assert below, which names the problem.
- name: Ask the stack's endpoint whether it is healthy
  ansible.builtin.uri:
    url: '{{ compose_stack_http_check_url }}'
    method: GET
    status_code: 200
    timeout: 5
  register: compose_stack_http
  until: compose_stack_http.status | ansible.builtin.default(-1) == 200
  retries: '{{ [1, (compose_stack_wait_timeout | ansible.builtin.int) // (compose_stack_http_check_delay | ansible.builtin.int)] | ansible.builtin.max }}'
  delay: '{{ compose_stack_http_check_delay }}'
  failed_when: false
  changed_when: false
  check_mode: false
  when:
    - compose_stack_compose_file_stat.stat.exists
    - compose_stack_http_check_url | ansible.builtin.length > 0

- name: Refuse an endpoint that does not answer 200
  ansible.builtin.assert:
    that:
      - compose_stack_http.status | ansible.builtin.default(-1) == 200
    quiet: true
    fail_msg: >-
      The stack's endpoint did not answer 200 on {{ compose_stack_http_check_url }}
      (status {{ compose_stack_http.status | ansible.builtin.default(-1) }}). Nothing is recorded
      as healthy, so the next run brings the stack up again.
  when:
    - compose_stack_compose_file_stat.stat.exists
    - compose_stack_http_check_url | ansible.builtin.length > 0

# Last, and only reached if the stack came up, every service is healthy and the
# optional endpoint answered: a run that fails anywhere above leaves the old
# stamp, so the next run brings the stack up again.
- name: Record the content as brought up and healthy
  ansible.builtin.copy:
    content: '{{ compose_stack_stamp }}'
    dest: '{{ compose_stack_project_dir }}/.compose_stack_stamp'
    owner: root
    group: root
    mode: '0600'
  diff: false
  no_log: true
  when: compose_stack_compose_file_stat.stat.exists
