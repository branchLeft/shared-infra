---
# Verbatim mode (ws#2350 PR A): compose_stack_compose_source names a compose file
# that is delivered byte for byte. Its ${IMAGE} is read from the one IMAGE= line
# of compose_stack_image_env_file, and that value is judged by the digest check
# below exactly as a template's image would be. The template path is unchanged.
- name: Work out whether the compose file is verbatim
  ansible.builtin.set_fact:
    compose_stack_verbatim: '{{ compose_stack_compose_source | length > 0 }}'

- name: Refuse an image variable name that is not a plain name
  ansible.builtin.assert:
    that:
      - compose_stack_image_var is match('^[A-Za-z_][A-Za-z0-9_]*\Z')
    quiet: true
    fail_msg: compose_stack_image_var must be a plain variable name such as IMAGE.
  when: compose_stack_verbatim | bool

- name: Read the image env file, which holds the image value and nothing else this role uses
  ansible.builtin.slurp:
    src: '{{ compose_stack_image_env_file }}'
  register: compose_stack_image_env
  when: compose_stack_verbatim | bool and compose_stack_image_env_file | length > 0
  no_log: true

- name: Read the image value from the image env file
  ansible.builtin.set_fact:
    compose_stack_image_lines: >-
      {{ compose_stack_image_env.content | b64decode
      | ansible.builtin.regex_findall('^' ~ compose_stack_image_var ~ '=(.*)$', multiline=true) }}
    # Every line that assigns the variable in any dotenv spelling (IMAGE=, export IMAGE=,
    # spaces around the equals sign). Compose takes the last of them, so the count of
    # these lines must be the count of the one line the value is read from.
    compose_stack_image_assignments: >-
      {{ compose_stack_image_env.content | b64decode
      | ansible.builtin.regex_findall('^[ \t]*(?:export[ \t]+)?' ~ compose_stack_image_var ~ '[ \t]*=', multiline=true) }}
  when: compose_stack_verbatim | bool and compose_stack_image_env_file | length > 0
  no_log: true

- name: Refuse an image env file that does not hold exactly one image line
  ansible.builtin.assert:
    that:
      - compose_stack_image_lines | ansible.builtin.length == 1
      - compose_stack_image_assignments | ansible.builtin.length == 1
      # The value goes on the validator's command line, so only plain characters pass
      # here. Whether it is pinned by digest is the digest check's question, below.
      - compose_stack_image_lines[0] is match('^[A-Za-z0-9._/:@-]+\Z')
    quiet: true
    fail_msg: >-
      The image env file must hold exactly one {{ compose_stack_image_var }}= line, with plain
      characters and no other line that assigns {{ compose_stack_image_var }}.
  when: compose_stack_verbatim | bool and compose_stack_image_env_file | length > 0

- name: Work out the compose text, its image and its rendered form
  ansible.builtin.set_fact:
    compose_stack_compose_text: >-
      {{ lookup('ansible.builtin.file', compose_stack_compose_source) if compose_stack_verbatim | bool
      else lookup('ansible.builtin.template', 'compose.yaml.j2') }}
    compose_stack_image_value: >-
      {{ compose_stack_image_lines[0] if compose_stack_verbatim | bool and compose_stack_image_env_file | length > 0
      else '' }}
  no_log: true

# The image the digest check judges is the one Compose is given: the value is passed
# as the variable itself, which beats the process environment and every env file, and
# the image env file is listed last, so it also wins over a file that names the variable
# too. Without an image env file in verbatim mode the value is empty, and the digest
# check refuses it. The project directory's .env is never read in verbatim mode,
# because COMPOSE_ENV_FILES is always set there.
- name: Work out the env files Compose is given
  ansible.builtin.set_fact:
    compose_stack_env_files_effective: >-
      {{ compose_stack_env_files + ([compose_stack_image_env_file]
      if compose_stack_verbatim | bool and compose_stack_image_env_file | length > 0 else []) }}
  no_log: true

- name: Work out the environment Compose is given
  ansible.builtin.set_fact:
    compose_stack_compose_environment: >-
      {{ ({'COMPOSE_ENV_FILES': compose_stack_env_files_effective | ansible.builtin.join(',')}
      if compose_stack_env_files_effective | length > 0 else {})
      | ansible.builtin.combine({compose_stack_image_var: compose_stack_image_value}
      if compose_stack_verbatim | bool else {}) }}
  no_log: true

- name: Work out the compose text the digest check reads
  ansible.builtin.set_fact:
    compose_stack_text_subst: >-
      {{ compose_stack_compose_text
      | ansible.builtin.regex_replace('\$\{' ~ compose_stack_image_var ~ '\}', compose_stack_image_value) }}
  no_log: true

- name: Work out the rendered compose file
  ansible.builtin.set_fact:
    compose_stack_rendered: '{{ compose_stack_text_subst | ansible.builtin.from_yaml }}'
  no_log: true

# The rendered compose file is parsed, not searched, so a tag in quotes, in a
# flow mapping, behind an anchor or in a comment is judged by what YAML says it
# is. A service that builds its own image has no digest to pin, so it is
# refused too. This runs before anything is written to the host.
- name: Refuse a compose file whose images are not all pinned by digest
  ansible.builtin.assert:
    that:
      - compose_stack_rendered.services is ansible.builtin.mapping
      - compose_stack_rendered.services | ansible.builtin.length > 0
      - compose_stack_rendered.include is ansible.builtin.undefined
      - compose_stack_images | ansible.builtin.reject('ansible.builtin.match', compose_stack_image_pattern) | ansible.builtin.list | ansible.builtin.length == 0
      - compose_stack_service_list | ansible.builtin.selectattr('build', 'ansible.builtin.defined') | ansible.builtin.list | ansible.builtin.length == 0
      - compose_stack_service_list | ansible.builtin.selectattr('extends', 'ansible.builtin.defined') | ansible.builtin.list | ansible.builtin.length == 0
      - compose_stack_service_list | ansible.builtin.rejectattr('image', 'ansible.builtin.defined') | ansible.builtin.list | ansible.builtin.length == 0
    quiet: true
    fail_msg: >-
      Every service needs an image reference ending in @sha256: and 64 lower-case
      hex digits. No service may build an image or extend another, and the file may
      not include another. A tag alone can move.
  vars:
    compose_stack_service_list: '{{ compose_stack_rendered.services.values() | ansible.builtin.list }}'
    compose_stack_images: "{{ compose_stack_service_list | ansible.builtin.map(attribute='image') | ansible.builtin.list }}"
    compose_stack_image_pattern: '^[^\s@]+@sha256:[0-9a-f]{64}\Z'

# Compose merges a compose.override.yaml that sits next to the compose file,
# unless the files are named on the command line. Every call below names the
# compose file, so an override is never read; this refuses one anyway, because
# an image added there would not have been through the digest check above.
# Reading only, so it runs in check mode too.
- name: Look at the project directory before looking in it
  ansible.builtin.stat:
    path: '{{ compose_stack_project_dir }}'
  register: compose_stack_project_dir_stat

- name: Look for a compose override file in the project directory
  ansible.builtin.find:
    paths: '{{ compose_stack_project_dir }}'
    patterns:
      - compose.override.y*ml
      - docker-compose.override.y*ml
    file_type: any
  register: compose_stack_overrides
  when: compose_stack_project_dir_stat.stat.isdir | ansible.builtin.default(false)

- name: Refuse a project directory that holds a compose override file
  ansible.builtin.assert:
    that:
      - compose_stack_overrides.files | ansible.builtin.default([]) | ansible.builtin.length == 0
    quiet: true
    fail_msg: >-
      The project directory holds a compose override file, which Compose would
      merge into the stack without the digest check. Remove it:
      {{ compose_stack_overrides.files | ansible.builtin.default([]) | ansible.builtin.map(attribute='path') | ansible.builtin.list }}.

# One digest of everything the stack is made of: the compose file as delivered,
# the configuration file as rendered, the secret files' names and content, and
# the image value. The env files' paths are in it, not their content, which this
# role never reads. It is a function of the inputs, not of the host, so it can be
# worked out in check mode, before anything is written. It is one-way and never
# printed.
- name: Work out the stamp of the content this run delivers
  ansible.builtin.set_fact:
    compose_stack_stamp: >-
      {{ {'compose': compose_stack_compose_text, 'config': compose_stack_config_text,
      'secrets': compose_stack_secret_files, 'image': compose_stack_image_value,
      'env_files': compose_stack_env_files} | ansible.builtin.to_json(sort_keys=True) | ansible.builtin.hash('sha256') }}
  vars:
    compose_stack_config_text: "{{ lookup('ansible.builtin.template', 'app.conf.j2') }}"
  no_log: true

- name: Create the project directory
  ansible.builtin.file:
    path: '{{ compose_stack_project_dir }}'
    state: directory
    owner: root
    group: '{{ compose_stack_group }}'
    mode: '0750'

# No delivery task notifies a handler. A notification is lost if a later task
# fails, and the next run would find every file already delivered; the stamp
# below is what remembers that the stack was never brought up.
- name: Deliver the configuration file
  ansible.builtin.template:
    src: app.conf.j2
    dest: '{{ compose_stack_project_dir }}/app.conf'
    owner: '{{ compose_stack_owner }}'
    group: '{{ compose_stack_group }}'
    mode: '0640'
  register: compose_stack_config_delivery
  when: not compose_stack_verbatim | bool

# The item is not labelled: with no_log off, the loop prints the whole item, so
# the test can see a missing no_log. With it on, the output says "censored".
- name: Deliver the secret files
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '{{ compose_stack_project_dir }}/{{ item.name }}'
    owner: '{{ compose_stack_owner }}'
    group: '{{ compose_stack_group }}'
    mode: '0600'
  loop: '{{ compose_stack_secret_files }}'
  register: compose_stack_secret_delivery
  no_log: true
  diff: false

# Last of the deliveries, so the files it points at are already on disk when
# the validator reads them. The validator runs on a temporary copy before the
# file replaces the old one. In verbatim mode the env files are handed to
# Compose on the validator's command line, so ${...} resolves as it will live.
- name: Deliver the compose file
  ansible.builtin.copy:
    content: '{{ compose_stack_compose_text }}'
    dest: '{{ compose_stack_project_dir }}/{{ compose_stack_compose_name }}'
    owner: root
    group: root
    mode: '0644'
    # `env` sets the image variable for this one command, the same value and the same
    # env files the stack is brought up with. The validator runs without a shell, so
    # `env NAME=value` is the only way to set it here.
    validate: >-
      env {% if compose_stack_verbatim | bool %}{{ compose_stack_image_var }}={{ compose_stack_image_value }} {% endif %}docker compose
      --project-directory {{ compose_stack_project_dir }}
      {% for f in compose_stack_env_files_effective %}--env-file {{ f }} {% endfor %}
      --file %s config --quiet
  register: compose_stack_compose_delivery
  no_log: true
  diff: false

# Check mode writes no compose file, so on a fresh host there is nothing for a
# dry run of the stack, or a look at its containers, to read. The three tasks
# below that need it run whenever the file is really on disk, and the skip on a
# fresh host is stated here (ANS-10). stat runs in check mode as it does in a
# real run.
- name: Read back the compose file
  ansible.builtin.stat:
    path: '{{ compose_stack_project_dir }}/{{ compose_stack_compose_name }}'
  register: compose_stack_compose_file_stat

# The stamp file holds the digest of the content the stack was last brought up
# with and found healthy. Its checksum is read, not its content, so the file
# needs no decoding and the comparison reports no change.
- name: Read the checksum of the recorded stamp
  ansible.builtin.stat:
    path: '{{ compose_stack_project_dir }}/.compose_stack_stamp'
    checksum_algorithm: sha256
  register: compose_stack_recorded_stamp

# Bring the stack up when its content is not the content last recorded as good,
# which covers a first run, an edit, and a run that follows one that failed
# before the stamp was written. Also when a delivery task changed a file in this
# run, which covers a file that was edited by hand and put back: a container
# that bind-mounts one file keeps the inode it started with.
- name: Work out whether the stack must be brought up
  ansible.builtin.set_fact:
    compose_stack_up_needed: >-
      {{ compose_stack_config_delivery is ansible.builtin.changed
      or compose_stack_secret_delivery is ansible.builtin.changed
      or compose_stack_compose_delivery is ansible.builtin.changed
      or not (compose_stack_recorded_stamp.stat.exists
      and compose_stack_recorded_stamp.stat.checksum == (compose_stack_stamp | ansible.builtin.hash('sha256'))) }}

# Nothing here removes data: no orphan removal, no renewed anonymous volumes,
# and state is present, never absent (which would run `down`). The compose file
# is named, so an override file is never merged. Services scoped by
# compose_stack_services are the only ones recreated.
- name: Bring up the stack
  community.docker.docker_compose_v2:
    project_src: '{{ compose_stack_project_dir }}'
    project_name: '{{ compose_stack_project_name }}'
    files:
      - '{{ compose_stack_compose_name }}'
    services: '{{ compose_stack_services }}'
    state: present
    # A changed file that a container only bind-mounts does not change the
    # container's configuration, so a plain `up` would leave the old file in
    # use. Recreating is what puts the new file in front of the container.
    recreate: always
    build: never
    wait: true
    wait_timeout: '{{ compose_stack_wait_timeout }}'
    remove_orphans: false
    renew_anon_volumes: false
  environment: '{{ compose_stack_compose_environment }}'
  when:
    - compose_stack_compose_file_stat.stat.exists
    - compose_stack_up_needed | ansible.builtin.bool

# The same module in check mode, which runs `up --dry-run` and then lists the
# project's containers, and changes nothing, so it is also run in check mode.
# It reads the whole project, not only the scoped services. The module checks
# the Compose version itself (see the README).
- name: Read the state of the stack's containers without changing it
  community.docker.docker_compose_v2:
    project_src: '{{ compose_stack_project_dir }}'
    project_name: '{{ compose_stack_project_name }}'
    files:
      - '{{ compose_stack_compose_name }}'
    state: present
    build: never
    wait: false
    remove_orphans: false
    renew_anon_volumes: false
  environment: '{{ compose_stack_compose_environment }}'
  register: compose_stack_health
  check_mode: true
  changed_when: false
  when: compose_stack_compose_file_stat.stat.exists

- name: Refuse a stack with a service that is missing, not running or not healthy
  ansible.builtin.assert:
    that:
      - compose_stack_missing | ansible.builtin.length == 0
      - compose_stack_not_running | ansible.builtin.length == 0
      - compose_stack_unhealthy | ansible.builtin.length == 0
    quiet: true
    fail_msg: >-
      The compose stack is not healthy. Services with no container:
      {{ compose_stack_missing }}. Not running: {{ compose_stack_not_running }}.
      Unhealthy or still starting: {{ compose_stack_unhealthy }}.
  vars:
    compose_stack_containers: '{{ compose_stack_health.containers }}'
    compose_stack_declared: >-
      {{ compose_stack_rendered.services.keys() | ansible.builtin.list }}
    compose_stack_missing: >-
      {{ compose_stack_declared | ansible.builtin.difference(compose_stack_containers
      | ansible.builtin.map(attribute='Service') | ansible.builtin.list) }}
    compose_stack_not_running: >-
      {{ compose_stack_containers | ansible.builtin.rejectattr('State', 'ansible.builtin.equalto', 'running')
      | ansible.builtin.map(attribute='Service') | ansible.builtin.list }}
    compose_stack_unhealthy: >-
      {{ compose_stack_containers | ansible.builtin.selectattr('Health', 'ansible.builtin.defined')
      | ansible.builtin.selectattr('Health', 'ansible.builtin.in', ['unhealthy', 'starting'])
      | ansible.builtin.map(attribute='Service') | ansible.builtin.list }}
  when: compose_stack_compose_file_stat.stat.exists

# Last, and only reached if the stack came up and every service is healthy: a
# run that fails anywhere above leaves the old stamp, so the next run brings
# the stack up again.
- name: Record the content as brought up and healthy
  ansible.builtin.copy:
    content: '{{ compose_stack_stamp }}'
    dest: '{{ compose_stack_project_dir }}/.compose_stack_stamp'
    owner: root
    group: root
    mode: '0600'
  diff: false
  no_log: true
  when: compose_stack_compose_file_stat.stat.exists
