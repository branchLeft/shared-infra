---
# Test scaffolding, not role tasks: what the role expects to find on a host
# (the service user and group), and the stand-in for the docker CLI that the
# instance has instead of an engine. The stand-in's files are in
# /var/lib/compose_stack_standin: argv.log holds the arguments of every call
# the test makes for real, dryrun.log those made with --dry-run, and ps.json is
# what `compose ps` prints, which the verify play changes to test the health
# check.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Create the placeholder service group
      ansible.builtin.group:
        name: '{{ compose_stack_group }}'
        system: true

    - name: Create the placeholder service user
      ansible.builtin.user:
        name: '{{ compose_stack_owner }}'
        group: '{{ compose_stack_group }}'
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create the stand-in's state directory
      ansible.builtin.file:
        path: /var/lib/compose_stack_standin
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the stand-in as the docker command
      ansible.builtin.copy:
        src: docker_standin.sh
        dest: /usr/local/bin/docker
        owner: root
        group: root
        mode: '0755'

    - name: Start the stand-in's call logs empty
      ansible.builtin.copy:
        content: ''
        dest: '/var/lib/compose_stack_standin/{{ item }}'
        owner: root
        group: root
        mode: '0644'
        force: true
      loop:
        - argv.log
        - dryrun.log

    - name: Report one healthy running container for the app service
      ansible.builtin.copy:
        content: |
          {"Name":"stand-in-app-1","Service":"app","State":"running","Health":"healthy","Labels":"","Networks":"default","Publishers":null}
        dest: /var/lib/compose_stack_standin/ps.json
        owner: root
        group: root
        mode: '0644'

    # One-line image env files for verbatim mode (ws#2350 PR A). The tag file is
    # refused by the digest check; the digest file is accepted. Both are read only
    # in check mode by the verify play, so nothing else changes.
    - name: Write an image env file that names a tag
      ansible.builtin.copy:
        content: "IMAGE=example.invalid/example-app:1.2.3\n"
        dest: /var/lib/compose_stack_standin/image-tag.env
        owner: root
        group: root
        mode: '0644'

    - name: Write an image env file that names a digest
      ansible.builtin.copy:
        content: "IMAGE=example.invalid/example-app@sha256:{{ '2' * 64 }}\n"
        dest: /var/lib/compose_stack_standin/image-digest.env
        owner: root
        group: root
        mode: '0644'

    # A digest on the IMAGE= line and a later export line that names a tag. The
    # one-line check reads the digest; Compose would take the tag, so the count of
    # assignments refuses it.
    - name: Write an image env file that assigns the variable twice
      ansible.builtin.copy:
        content: "IMAGE=example.invalid/example-app@sha256:{{ '2' * 64 }}\nexport IMAGE=example.invalid/example-app:1.2.3\n"
        dest: /var/lib/compose_stack_standin/image-export.env
        owner: root
        group: root
        mode: '0644'
