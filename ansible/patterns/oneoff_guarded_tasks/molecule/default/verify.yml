---
# The outcome, asserted in the order the claims are made. Each request is an
# ansible-playbook run of request.yml on the controller, against the same
# container, so each run is the one a maintainer would make. Every check that
# follows a run looks at the container, not at the run's own output, and every
# assertion names the claim it tests.

# 1. A plain apply skipped both guarded steps and wrote no marker.
- name: Check the plain apply left both guarded steps alone
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the effects and markers of both steps
      ansible.builtin.stat:
        path: '{{ item }}'
      register: oneoff_guarded_tasks_before
      loop:
        - /var/tmp/EXAMPLE_STEP_ONE.effect
        - '{{ scenario_state_dir }}/EXAMPLE_STEP_ONE'
        - '{{ scenario_state_dir }}/EXAMPLE_STEP_TWO'

    - name: Assert no effect and no marker exists after a plain apply
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_before.results | map(attribute='stat') | selectattr('exists') | list | length == 0
        quiet: true
        fail_msg: A plain apply ran a guarded step or wrote a marker (the tag guard or the never tag is not doing its job).

    - name: Read the state directory
      ansible.builtin.stat:
        path: '{{ scenario_state_dir }}'
      register: oneoff_guarded_tasks_dir

    - name: Assert the state directory is root-owned and mode 0755
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_dir.stat.pw_name == 'root'
          - oneoff_guarded_tasks_dir.stat.gr_name == 'root'
          - oneoff_guarded_tasks_dir.stat.mode == '0755'
        quiet: true
        fail_msg: The state directory was not made root-owned and mode 0755 by the role, though it was owned by the account.

# 2. The tag alone, and a confirmation with a line break, are refused by name.
- name: Request EXAMPLE_STEP_ONE by its tag alone, and with a confirmation holding a line break
  hosts: localhost
  gather_facts: false
  vars:
    oneoff_guarded_tasks_request:
      - ansible-playbook
      - -i
      - '{{ lookup("ansible.builtin.env", "MOLECULE_INVENTORY_FILE") }}'
      - '{{ playbook_dir }}/request.yml'
    # The YAML double-quoted "\n" is a real line break; to_json writes it as the
    # two characters the extra-vars parser reads back as one.
    oneoff_guarded_tasks_line_break_extra:
      oneoff_guarded_tasks_confirm: "EXAMPLE_STEP_ONE\n"
    oneoff_guarded_tasks_wrong_confirmations:
      - tag: oneoff_guarded_tasks_step_one
        confirm: EXAMPLE_STEP_TWO
        message: 'REFUSED: EXAMPLE_STEP_ONE was requested by its tag without'
      - tag: oneoff_guarded_tasks_step_one
        confirm: EXAMPLE_STEP
        message: 'REFUSED: EXAMPLE_STEP_ONE was requested by its tag without'
      - tag: oneoff_guarded_tasks_step_one
        confirm: ['EXAMPLE_STEP_ONE']
        message: 'REFUSED: oneoff_guarded_tasks_confirm is not a step id'
      - tag: oneoff_guarded_tasks_step_one
        confirm: null
        message: 'REFUSED: EXAMPLE_STEP_ONE was requested by its tag without'
      - tag: oneoff_guarded_tasks_step_two
        confirm: EXAMPLE_STEP_ONE
        message: 'REFUSED: EXAMPLE_STEP_TWO was requested by its tag without'
  tasks:
    - name: Request the step with its tag and no confirmation
      ansible.builtin.command:
        argv: "{{ oneoff_guarded_tasks_request + ['--tags', 'oneoff_guarded_tasks_step_one'] }}"
      register: oneoff_guarded_tasks_tag_alone
      failed_when: false
      changed_when: false

    - name: Request the step with a confirmation that holds a line break
      ansible.builtin.command:
        argv: "{{ oneoff_guarded_tasks_request + ['--tags', 'oneoff_guarded_tasks_step_one',
          '-e', oneoff_guarded_tasks_line_break_extra | to_json] }}"
      register: oneoff_guarded_tasks_line_break
      failed_when: false
      changed_when: false

    - name: Assert the tag alone is refused by the named message
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_tag_alone.rc != 0
          - "'REFUSED: EXAMPLE_STEP_ONE was requested by its tag' in (oneoff_guarded_tasks_tag_alone.stdout ~ oneoff_guarded_tasks_tag_alone.stderr)"
        quiet: true
        fail_msg: The tag alone did not refuse EXAMPLE_STEP_ONE with its named message; a copied tag can run the step.

    - name: Assert a confirmation with a line break is refused by the step id message
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_line_break.rc != 0
          - "'REFUSED: oneoff_guarded_tasks_confirm is not a step id' in (oneoff_guarded_tasks_line_break.stdout ~ oneoff_guarded_tasks_line_break.stderr)"
        quiet: true
        fail_msg: A confirmation with a line break was not refused by the step id check.

    # A wrong confirmation: another step's id, a prefix, a list, and a null. Each
    # is requested with a real step tag, and each must be refused by its message.
    # The step-two case asks the other step's tag with the first step's id.
    - name: Request each step with a wrong confirmation
      ansible.builtin.command:
        argv: "{{ oneoff_guarded_tasks_request + ['--tags', item.tag, '-e', {'oneoff_guarded_tasks_confirm': item.confirm} | to_json] }}"
      loop: '{{ oneoff_guarded_tasks_wrong_confirmations }}'
      loop_control:
        label: '{{ item.tag }} with {{ item.confirm | to_json }}'
      register: oneoff_guarded_tasks_wrong_runs
      failed_when: false
      changed_when: false

    - name: Assert each wrong confirmation is refused by its named message
      ansible.builtin.assert:
        that:
          - item.rc != 0
          - item.item.message in (item.stdout ~ item.stderr)
        quiet: true
        fail_msg: A wrong confirmation was not refused by its named message, so a request with it could run the step.
      loop: '{{ oneoff_guarded_tasks_wrong_runs.results }}'
      loop_control:
        label: '{{ item.item.tag }} with {{ item.item.confirm | to_json }}'

# 3. The refusals ran nothing.
- name: Check the refusals left no effect and no marker
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the effect and markers of both steps
      ansible.builtin.stat:
        path: '{{ item }}'
      register: oneoff_guarded_tasks_after_refusal
      loop:
        - /var/tmp/EXAMPLE_STEP_ONE.effect
        - '{{ scenario_state_dir }}/EXAMPLE_STEP_ONE'
        - '{{ scenario_state_dir }}/EXAMPLE_STEP_TWO'

    - name: Assert the refused requests changed nothing
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_after_refusal.results | map(attribute='stat') | selectattr('exists') | list | length == 0
        quiet: true
        fail_msg: A refused request ran a step or wrote a marker.

# 4. A check-mode run reports the change it would make, and writes nothing.
- name: Request EXAMPLE_STEP_ONE in check mode
  hosts: localhost
  gather_facts: false
  vars:
    oneoff_guarded_tasks_request:
      - ansible-playbook
      - -i
      - '{{ lookup("ansible.builtin.env", "MOLECULE_INVENTORY_FILE") }}'
      - '{{ playbook_dir }}/request.yml'
  tasks:
    # The json callback prints one document with each task's own result, so the
    # check reads the effect and the marker task by name, not the recap.
    - name: Request the step in check mode with its tag and confirmation
      ansible.builtin.command:
        argv:
          "{{ oneoff_guarded_tasks_request + ['--check', '--tags', 'oneoff_guarded_tasks_step_one',
          '-e', 'oneoff_guarded_tasks_confirm=EXAMPLE_STEP_ONE'] }}"
      environment:
        ANSIBLE_STDOUT_CALLBACK: json
      register: oneoff_guarded_tasks_check_run
      failed_when: false
      changed_when: false

    - name: Assert the check run reports the effect and the marker as changes
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_check_run.rc == 0
          - oneoff_guarded_tasks_effect_tasks | length == 1
          - (oneoff_guarded_tasks_effect_tasks[0].hosts.values() | first).get('changed', false)
          - oneoff_guarded_tasks_marker_tasks | length == 1
          - (oneoff_guarded_tasks_marker_tasks[0].hosts.values() | first).get('changed', false)
        quiet: true
        fail_msg: The check-mode request did not report the effect and the marker of EXAMPLE_STEP_ONE as changes; a skipped effect would pass silently.
      vars:
        oneoff_guarded_tasks_check_tasks: '{{ (oneoff_guarded_tasks_check_run.stdout | from_json).plays[0].tasks }}'
        oneoff_guarded_tasks_effect_tasks: >-
          {{ oneoff_guarded_tasks_check_tasks
          | selectattr('task.name', 'search', 'Run the placeholder effect of EXAMPLE_STEP_ONE') | list }}
        oneoff_guarded_tasks_marker_tasks: >-
          {{ oneoff_guarded_tasks_check_tasks
          | selectattr('task.name', 'search', 'Write the marker of EXAMPLE_STEP_ONE') | list }}

- name: Check the check-mode run wrote nothing
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the effect and marker of EXAMPLE_STEP_ONE
      ansible.builtin.stat:
        path: '{{ item }}'
      register: oneoff_guarded_tasks_after_check
      loop:
        - /var/tmp/EXAMPLE_STEP_ONE.effect
        - '{{ scenario_state_dir }}/EXAMPLE_STEP_ONE'

    - name: Assert the check run left no effect and no marker
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_after_check.results | map(attribute='stat') | selectattr('exists') | list | length == 0
        quiet: true
        fail_msg: A check-mode run wrote a marker or ran the effect.

# 5. The requested run does the step, writes the marker, and the effect has the
# mode the step sets.
- name: Request EXAMPLE_STEP_ONE for real
  hosts: localhost
  gather_facts: false
  vars:
    oneoff_guarded_tasks_request:
      - ansible-playbook
      - -i
      - '{{ lookup("ansible.builtin.env", "MOLECULE_INVENTORY_FILE") }}'
      - '{{ playbook_dir }}/request.yml'
  tasks:
    - name: Request the step with its tag and confirmation
      ansible.builtin.command:
        argv: "{{ oneoff_guarded_tasks_request + ['--tags', 'oneoff_guarded_tasks_step_one', '-e', 'oneoff_guarded_tasks_confirm=EXAMPLE_STEP_ONE'] }}"
      register: oneoff_guarded_tasks_run_one
      failed_when: false
      changed_when: false

    - name: Assert the requested run succeeded
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_run_one.rc == 0
        quiet: true
        fail_msg: The requested run of EXAMPLE_STEP_ONE, with its tag and confirmation, did not succeed.

- name: Check the requested run did the step and recorded it
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the effect, the marker and the state directory
      ansible.builtin.stat:
        path: '{{ item }}'
      register: oneoff_guarded_tasks_after_run
      loop:
        - /var/tmp/EXAMPLE_STEP_ONE.effect
        - '{{ scenario_state_dir }}/EXAMPLE_STEP_ONE'

    - name: Read the marker, which must hold the step id only
      ansible.builtin.command:
        argv:
          - cat
          - '{{ scenario_state_dir }}/EXAMPLE_STEP_ONE'
      register: oneoff_guarded_tasks_marker_text
      changed_when: false

    - name: Assert the effect has its mode, the marker its owner, mode and text
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_after_run.results[0].stat.exists
          - oneoff_guarded_tasks_after_run.results[0].stat.mode == '0640'
          - oneoff_guarded_tasks_after_run.results[1].stat.exists
          - oneoff_guarded_tasks_after_run.results[1].stat.pw_name == 'root'
          - oneoff_guarded_tasks_after_run.results[1].stat.gr_name == 'root'
          - oneoff_guarded_tasks_after_run.results[1].stat.mode == '0644'
          - oneoff_guarded_tasks_marker_text.stdout == 'EXAMPLE_STEP_ONE'
        quiet: true
        fail_msg: After the requested run the effect, the marker or its owner, mode or text is not as the step sets it.

# 6. Asking again with the marker present changes nothing (idempotence of a
# requested step).
- name: Request EXAMPLE_STEP_ONE a second time
  hosts: localhost
  gather_facts: false
  vars:
    oneoff_guarded_tasks_request:
      - ansible-playbook
      - -i
      - '{{ lookup("ansible.builtin.env", "MOLECULE_INVENTORY_FILE") }}'
      - '{{ playbook_dir }}/request.yml'
  tasks:
    # The JSON callback reports each task as skipped or not. A recap cannot show
    # a skipped gate, so the effect and the marker are each read by name.
    - name: Request the step again with its tag and confirmation
      ansible.builtin.command:
        argv: "{{ oneoff_guarded_tasks_request + ['--tags', 'oneoff_guarded_tasks_step_one', '-e', 'oneoff_guarded_tasks_confirm=EXAMPLE_STEP_ONE'] }}"
      environment:
        ANSIBLE_STDOUT_CALLBACK: json
      register: oneoff_guarded_tasks_run_again
      failed_when: false
      changed_when: false

    - name: Assert the second request succeeded, changed nothing, and skipped the effect and the marker
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_run_again.rc == 0
          - oneoff_guarded_tasks_again_changed == 0
          - oneoff_guarded_tasks_again_effect | length == 1
          - (oneoff_guarded_tasks_again_effect[0].hosts.values() | first).get('skipped', false)
          - oneoff_guarded_tasks_again_marker | length == 1
          - (oneoff_guarded_tasks_again_marker[0].hosts.values() | first).get('skipped', false)
        quiet: true
        fail_msg: A second request of EXAMPLE_STEP_ONE with its marker present changed something, failed, or ran a task it should skip.
      vars:
        oneoff_guarded_tasks_again_plays: '{{ oneoff_guarded_tasks_run_again.stdout | from_json }}'
        oneoff_guarded_tasks_again_tasks: '{{ oneoff_guarded_tasks_again_plays.plays[0].tasks }}'
        oneoff_guarded_tasks_again_changed: '{{ oneoff_guarded_tasks_again_plays.stats.values() | map(attribute="changed") | sum }}'
        oneoff_guarded_tasks_again_effect: >-
          {{ oneoff_guarded_tasks_again_tasks
          | selectattr('task.name', 'search', 'Run the placeholder effect of EXAMPLE_STEP_ONE') | list }}
        oneoff_guarded_tasks_again_marker: >-
          {{ oneoff_guarded_tasks_again_tasks
          | selectattr('task.name', 'search', 'Write the marker of EXAMPLE_STEP_ONE') | list }}

# 7. A step whose effect fails writes no marker, and the next request tries again.
- name: Request EXAMPLE_STEP_TWO, whose effect fails, twice
  hosts: localhost
  gather_facts: false
  vars:
    oneoff_guarded_tasks_request:
      - ansible-playbook
      - -i
      - '{{ lookup("ansible.builtin.env", "MOLECULE_INVENTORY_FILE") }}'
      - '{{ playbook_dir }}/request.yml'
  tasks:
    - name: Request the failing step the first time
      ansible.builtin.command:
        argv: "{{ oneoff_guarded_tasks_request + ['--tags', 'oneoff_guarded_tasks_step_two', '-e', 'oneoff_guarded_tasks_confirm=EXAMPLE_STEP_TWO'] }}"
      register: oneoff_guarded_tasks_fail_first
      failed_when: false
      changed_when: false

    - name: Request the failing step the second time
      ansible.builtin.command:
        argv: "{{ oneoff_guarded_tasks_request + ['--tags', 'oneoff_guarded_tasks_step_two', '-e', 'oneoff_guarded_tasks_confirm=EXAMPLE_STEP_TWO'] }}"
      register: oneoff_guarded_tasks_fail_second
      failed_when: false
      changed_when: false

    - name: Assert both requests failed, and the second one ran the failing effect again
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_fail_first.rc != 0
          - oneoff_guarded_tasks_fail_second.rc != 0
          - "'non-zero return code' in (oneoff_guarded_tasks_fail_second.stdout ~ oneoff_guarded_tasks_fail_second.stderr)"
        quiet: true
        fail_msg: The failing step did not fail both times, or the second request did not try its effect again.

- name: Check the failing step wrote no marker
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the marker of EXAMPLE_STEP_TWO
      ansible.builtin.stat:
        path: '{{ scenario_state_dir }}/EXAMPLE_STEP_TWO'
      register: oneoff_guarded_tasks_marker_two

    - name: Assert the failing step left no marker
      ansible.builtin.assert:
        that:
          - not oneoff_guarded_tasks_marker_two.stat.exists
        quiet: true
        fail_msg: A step whose effect failed wrote its marker, so the next request would skip it.

# 8. The first request on a host with no state directory, where no plain apply
# has run, creates the directory and writes the marker in it.
- name: Request EXAMPLE_STEP_ONE on a state directory that no plain apply made
  hosts: localhost
  gather_facts: false
  vars:
    oneoff_guarded_tasks_fresh_dir: /var/lib/oneoff_guarded_tasks_fresh
    oneoff_guarded_tasks_request:
      - ansible-playbook
      - -i
      - '{{ lookup("ansible.builtin.env", "MOLECULE_INVENTORY_FILE") }}'
      - '{{ playbook_dir }}/request.yml'
  tasks:
    - name: Request the step with its tag and confirmation, into the fresh directory
      ansible.builtin.command:
        argv: "{{ oneoff_guarded_tasks_request + ['--tags', 'oneoff_guarded_tasks_step_one',
          '-e', 'oneoff_guarded_tasks_confirm=EXAMPLE_STEP_ONE',
          '-e', 'scenario_state_dir=' ~ oneoff_guarded_tasks_fresh_dir] }}"
      register: oneoff_guarded_tasks_fresh_run
      failed_when: false
      changed_when: false

    - name: Assert the first request on the fresh directory succeeded
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_fresh_run.rc == 0
        quiet: true
        fail_msg: >-
          The first request on a state directory that no plain apply made did not
          succeed, so the role does not create that directory itself under a tag.

- name: Check the first request made the directory and wrote the marker in it
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the fresh directory and the marker in it
      ansible.builtin.stat:
        path: '{{ item }}'
      register: oneoff_guarded_tasks_fresh_stat
      loop:
        - /var/lib/oneoff_guarded_tasks_fresh
        - /var/lib/oneoff_guarded_tasks_fresh/EXAMPLE_STEP_ONE

    - name: Assert the directory is root-owned, mode 0755, and holds the marker
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_fresh_stat.results[0].stat.exists
          - oneoff_guarded_tasks_fresh_stat.results[0].stat.pw_name == 'root'
          - oneoff_guarded_tasks_fresh_stat.results[0].stat.mode == '0755'
          - oneoff_guarded_tasks_fresh_stat.results[1].stat.exists
        quiet: true
        fail_msg: The first request on a fresh state directory did not leave a root-owned 0755 directory holding the marker.

# 9. A check-mode request for step two reports its marker as a change, with the
# destination and text the step sets, and skips its effect (a command is not run
# in check mode). Nothing is written. Step two's marker is reached only when its
# effect succeeds, which it never does here, so this check is the only one that
# reads that marker task.
- name: Request EXAMPLE_STEP_TWO in check mode with the diff
  hosts: localhost
  gather_facts: false
  vars:
    oneoff_guarded_tasks_request:
      - ansible-playbook
      - -i
      - '{{ lookup("ansible.builtin.env", "MOLECULE_INVENTORY_FILE") }}'
      - '{{ playbook_dir }}/request.yml'
  tasks:
    - name: Request the step in check mode with its tag, confirmation and diff
      ansible.builtin.command:
        argv:
          "{{ oneoff_guarded_tasks_request + ['--check', '--diff', '--tags', 'oneoff_guarded_tasks_step_two',
          '-e', 'oneoff_guarded_tasks_confirm=EXAMPLE_STEP_TWO'] }}"
      environment:
        ANSIBLE_STDOUT_CALLBACK: json
      register: oneoff_guarded_tasks_step_two_check
      failed_when: false
      changed_when: false

    - name: Assert the marker of step two is a change with its destination and text, and its effect is skipped
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_step_two_check.rc == 0
          - oneoff_guarded_tasks_two_effect | length == 1
          - (oneoff_guarded_tasks_two_effect[0].hosts.values() | first).get('skipped', false)
          - oneoff_guarded_tasks_two_marker | length == 1
          - (oneoff_guarded_tasks_two_marker[0].hosts.values() | first).get('changed', false)
          - oneoff_guarded_tasks_two_diff.after | trim == 'EXAMPLE_STEP_TWO'
          - oneoff_guarded_tasks_two_diff | to_json is search('/EXAMPLE_STEP_TWO')
        quiet: true
        fail_msg: In check mode step two did not report its marker as a change with the step-two destination and text, or its effect was not skipped.
      vars:
        oneoff_guarded_tasks_two_tasks: '{{ (oneoff_guarded_tasks_step_two_check.stdout | from_json).plays[0].tasks }}'
        oneoff_guarded_tasks_two_result: '{{ oneoff_guarded_tasks_two_marker[0].hosts.values() | first }}'
        oneoff_guarded_tasks_two_diff: >-
          {{ oneoff_guarded_tasks_two_result.diff
          if oneoff_guarded_tasks_two_result.diff is mapping
          else oneoff_guarded_tasks_two_result.diff | first }}
        oneoff_guarded_tasks_two_effect: >-
          {{ oneoff_guarded_tasks_two_tasks
          | selectattr('task.name', 'search', 'Run the failing placeholder command of EXAMPLE_STEP_TWO') | list }}
        oneoff_guarded_tasks_two_marker: >-
          {{ oneoff_guarded_tasks_two_tasks
          | selectattr('task.name', 'search', 'Write the marker of EXAMPLE_STEP_TWO') | list }}

- name: Check the step-two check-mode run wrote no marker
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the marker of EXAMPLE_STEP_TWO
      ansible.builtin.stat:
        path: '{{ scenario_state_dir }}/EXAMPLE_STEP_TWO'
      register: oneoff_guarded_tasks_two_after_check

    - name: Assert the check run wrote no marker of step two
      ansible.builtin.assert:
        that:
          - not oneoff_guarded_tasks_two_after_check.stat.exists
        quiet: true
        fail_msg: A check-mode request of EXAMPLE_STEP_TWO wrote its marker.

# 10. A marker that already holds other text is not overwritten, and the effect
# is not run, when step two is requested: the gate on the effect and the gate on
# the marker both hold. The marker is planted here, because step two's own effect
# never succeeds to write one.
- name: Plant a step-two marker that holds other text
  hosts: all
  gather_facts: false
  tasks:
    - name: Write a step-two marker with other text
      ansible.builtin.copy:
        content: "OLD_EXAMPLE_STEP_TWO\n"
        dest: '{{ scenario_state_dir }}/EXAMPLE_STEP_TWO'
        owner: root
        group: root
        mode: '0644'

- name: Request EXAMPLE_STEP_TWO with its marker present
  hosts: localhost
  gather_facts: false
  vars:
    oneoff_guarded_tasks_request:
      - ansible-playbook
      - -i
      - '{{ lookup("ansible.builtin.env", "MOLECULE_INVENTORY_FILE") }}'
      - '{{ playbook_dir }}/request.yml'
  tasks:
    - name: Request the step with its tag and confirmation while its marker exists
      ansible.builtin.command:
        argv: "{{ oneoff_guarded_tasks_request + ['--tags', 'oneoff_guarded_tasks_step_two', '-e', 'oneoff_guarded_tasks_confirm=EXAMPLE_STEP_TWO'] }}"
      environment:
        ANSIBLE_STDOUT_CALLBACK: json
      register: oneoff_guarded_tasks_two_present
      failed_when: false
      changed_when: false

    - name: Assert the request succeeded and skipped the effect and the marker of step two
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_two_present.rc == 0
          - oneoff_guarded_tasks_two_present_effect | length == 1
          - (oneoff_guarded_tasks_two_present_effect[0].hosts.values() | first).get('skipped', false)
          - oneoff_guarded_tasks_two_present_marker | length == 1
          - (oneoff_guarded_tasks_two_present_marker[0].hosts.values() | first).get('skipped', false)
        quiet: true
        fail_msg: A request of EXAMPLE_STEP_TWO with its marker present ran the effect or the marker of step two, so the gates of step two do not hold.
      vars:
        oneoff_guarded_tasks_two_present_tasks: '{{ (oneoff_guarded_tasks_two_present.stdout | from_json).plays[0].tasks }}'
        oneoff_guarded_tasks_two_present_effect: >-
          {{ oneoff_guarded_tasks_two_present_tasks
          | selectattr('task.name', 'search', 'Run the failing placeholder command of EXAMPLE_STEP_TWO') | list }}
        oneoff_guarded_tasks_two_present_marker: >-
          {{ oneoff_guarded_tasks_two_present_tasks
          | selectattr('task.name', 'search', 'Write the marker of EXAMPLE_STEP_TWO') | list }}

- name: Check the marker of step two still holds the text it was given
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the marker of EXAMPLE_STEP_TWO
      ansible.builtin.command:
        argv:
          - cat
          - '{{ scenario_state_dir }}/EXAMPLE_STEP_TWO'
      register: oneoff_guarded_tasks_two_text
      changed_when: false

    - name: Assert the marker of step two was not overwritten
      ansible.builtin.assert:
        that:
          - oneoff_guarded_tasks_two_text.stdout == 'OLD_EXAMPLE_STEP_TWO'
        quiet: true
        fail_msg: The marker of step two was overwritten by a request that should have skipped it.
