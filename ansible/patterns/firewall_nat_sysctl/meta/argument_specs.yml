---
argument_specs:
  main:
    short_description: Set IPv4 forwarding, then apply a firewall and NAT ruleset that rolls back if the control port stops answering
    description: >-
      Persists net.ipv4.ip_forward, renders one nftables ruleset, and loads it
      when the loaded tables, the active rules file or the boot rules file
      differ from it, after a syntax check. After the load, the control port is
      connected to. If that check fails, the previous ruleset is restored and
      the role fails. When it passes, the rules are also persisted in the boot
      rules file and the nftables unit that loads that file is enabled.
    author: AUTHOR_NAME
    options:
      firewall_nat_sysctl_control_port:
        type: int
        description: >-
          TCP port on this host that the connectivity check connects to after the
          load. It must also be in the allowed list, or the check fails and the
          ruleset is rolled back.
        default: 2222
      firewall_nat_sysctl_allowed_tcp_ports:
        type: list
        elements: int
        description: TCP ports the input chain accepts from any source. Everything else on input is dropped.
        default:
          - 2222
      firewall_nat_sysctl_nat_source:
        type: str
        description: >-
          IPv4 address or CIDR whose traffic leaving through the uplink is
          masqueraded. Anything else, including a newline, is refused before
          anything is loaded.
        default: 192.0.2.0/24
      firewall_nat_sysctl_uplink_interface:
        type: str
        description: >-
          Name of the interface the NAT rule masquerades out of, letters, digits,
          underscore, dot and hyphen only. A placeholder must be replaced by the
          host's real uplink name.
        default: UPLINK_INTERFACE
      firewall_nat_sysctl_table:
        type: str
        description: >-
          Name of the nftables tables the role owns, a letter or underscore then
          letters, digits and underscores. Other tables are not read or changed.
        default: pattern_firewall
      firewall_nat_sysctl_rules_dir:
        type: str
        description: Absolute path of the directory holding the active and previous rules files and the recorded listing.
        default: /etc/firewall-nat-sysctl
      firewall_nat_sysctl_sysctl_file:
        type: str
        description: Absolute path of the sysctl drop-in that persists the forwarding setting.
        default: /etc/sysctl.d/99-firewall-nat-sysctl.conf
