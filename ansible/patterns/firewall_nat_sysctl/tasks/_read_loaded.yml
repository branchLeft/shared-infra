---
# Reads the kernel's own listing of the two tables the role owns and keeps it as
# firewall_nat_sysctl_listing, or as an empty string when either table is not
# loaded. Other tables on the host are not read. check_mode is false because the
# read changes nothing and later tasks need its result (ANS-10).
- name: Read the loaded tables the role owns
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [nft, list, table, inet, '{{ firewall_nat_sysctl_table }}']
    - [nft, list, table, ip, '{{ firewall_nat_sysctl_table }}_nat']
  register: firewall_nat_sysctl_listing_result
  changed_when: false
  failed_when: false
  check_mode: false

- name: Keep the listing, or an empty one when a table is not loaded
  ansible.builtin.set_fact:
    firewall_nat_sysctl_listing: >-
      {{
        firewall_nat_sysctl_listing_result.results | map(attribute='stdout') | join(firewall_nat_sysctl_newline)
        if (firewall_nat_sysctl_listing_result.results | map(attribute='rc') | select('ne', 0) | list | length) == 0
        else ''
      }}
