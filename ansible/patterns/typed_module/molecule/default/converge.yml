---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    # Molecule links the role under its namespace and name, the namespace from
    # galaxy_info in meta/main.yml. The role's own task sets no_log: true, so
    # the throwaway token from the scenario's group variables stays out of the
    # output.
    - name: Apply the role
      ansible.builtin.include_role:
        name: branchleft.typed_module
