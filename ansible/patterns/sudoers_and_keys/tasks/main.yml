---
# Every input is checked before the first change, so a bad input leaves the
# host as it was. The assertions use no loop: a failed loop prints its item,
# which here would be a key.
- name: Refuse a sudoers fragment name that sudo would skip
  ansible.builtin.assert:
    that:
      - sudoers_and_keys_sudoers_name is match(sudoers_and_keys_name_pattern)
    quiet: true
    fail_msg: The fragment name may hold letters, digits, underscore and hyphen only.

# The argument check turns a mapping into text without complaint, and YAML reads
# an unquoted line that holds a colon and a space as a mapping.
- name: Refuse a sudoers line that is not text
  ansible.builtin.assert:
    that:
      - sudoers_and_keys_sudoers_lines | select('mapping') | list | length == 0
    quiet: true
    fail_msg: Each sudoers line must be a quoted string. A line with a colon and a space needs quotes.

- name: Refuse a sudoers line that holds a line break
  ansible.builtin.assert:
    that:
      - sudoers_and_keys_sudoers_lines | select('search', sudoers_and_keys_newline_pattern) | list | length == 0
    quiet: true
    fail_msg: Each sudoers line must be one line.

- name: Refuse a key entry that is not one public key on one line
  ansible.builtin.assert:
    that:
      - sudoers_and_keys_keys | rejectattr('key', 'match', sudoers_and_keys_key_pattern) | list | length == 0
    quiet: true
    fail_msg: Each key must be one public key on one line, with no options in front.

- name: Refuse a forced command that would break its own quoting
  ansible.builtin.assert:
    that:
      - sudoers_and_keys_keys | map(attribute='command', default='') | select('search', sudoers_and_keys_command_forbidden_pattern) | list | length == 0
    quiet: true
    fail_msg: A forced command may hold no double quote and no line break.

- name: Refuse a forced command with no source address
  ansible.builtin.assert:
    that:
      - >-
        sudoers_and_keys_keys | selectattr('command', 'defined') | selectattr('command')
        | selectattr('from_addresses', 'defined') | selectattr('from_addresses') | list | length
        == sudoers_and_keys_keys | selectattr('command', 'defined') | selectattr('command') | list | length
    quiet: true
    fail_msg: A key with a forced command must say which addresses it may connect from.

# The fragment is written to a temporary file, checked by visudo, and only then
# moved over the old one. A fragment visudo refuses never replaces a good one.
# /etc/sudoers itself is never edited: the fragment directory is what the
# distribution's sudoers already includes.
- name: Install the sudoers fragment
  ansible.builtin.copy:
    content: "{{ sudoers_and_keys_sudoers_lines | join('\n') }}\n"
    dest: '/etc/sudoers.d/{{ sudoers_and_keys_sudoers_name }}'
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  no_log: true
  diff: false
  when: sudoers_and_keys_sudoers_lines | length > 0

# exclusive: true makes the account's file exactly this list, so a key left out
# of it is removed. An empty list is skipped, never applied, so a variable that
# came through empty cannot remove every key. The module writes the new file to
# a temporary file and then moves it over the old one.
- name: Make the authorised keys of the account exactly the declared keys
  ansible.posix.authorized_key:
    user: '{{ sudoers_and_keys_user }}'
    key: "{{ lookup('ansible.builtin.template', 'authorized_keys.j2') }}"
    exclusive: true
    manage_dir: true
  no_log: true
  diff: false
  when: sudoers_and_keys_keys | length > 0
