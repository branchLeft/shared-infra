---
argument_specs:
  main:
    short_description: Install apt packages and deliver pinned, checksummed downloads
    description: >-
      Fetches each listed artefact with a sha256 checksum, installs named apt
      packages and local package files, and delivers a repository key and
      source signed by that key file.
    author: AUTHOR_NAME
    options:
      packages_and_downloads_apt_packages:
        type: list
        elements: str
        description: Package names installed with state present from the apt index.
        default: []
      packages_and_downloads_debs:
        type: list
        elements: str
        description: Paths of local package files installed with apt. Each should be an entry of packages_and_downloads_downloads.
        default: []
      packages_and_downloads_downloads:
        type: list
        elements: dict
        description: Artefacts fetched with get_url. Every entry must carry a sha256 checksum; the download refuses a mismatch.
        default: []
        options:
          url:
            type: str
            required: true
            description: Where the artefact is fetched from.
          dest:
            type: str
            required: true
            description: Absolute path the artefact is written to.
          checksum:
            type: str
            required: true
            description: Lowercase hex sha256 of the artefact, without a prefix.
          owner:
            type: str
            default: root
            description: Owner of the written file.
          group:
            type: str
            default: root
            description: Group of the written file.
          mode:
            type: str
            default: '0644'
            description: Mode of the written file, as a quoted octal string.
      packages_and_downloads_repository_present:
        type: bool
        description: Whether the repository key file and source entry are delivered.
        default: false
      packages_and_downloads_repository_uri:
        type: str
        description: URI of the repository the source entry names.
        default: ''
      packages_and_downloads_repository_suite:
        type: str
        description: Suite of the repository the source entry names.
        default: ''
