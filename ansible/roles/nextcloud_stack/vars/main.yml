---
# Constants of the stack, not inputs: a caller cannot override them. The paths
# are relative to the stack directory in the repository (files/stack, a link to
# it). The instance name is the Compose project name as well, because Compose
# derives the volume names from it (RUNBOOK-nextcloud.md, the first section).
nextcloud_stack_name: nextcloud1

nextcloud_stack_files:
  - compose.yml

nextcloud_stack_services:
  - app
  - db
  - redis

nextcloud_stack_env_dir: /etc/branchleft
nextcloud_stack_env_file: /etc/branchleft/nextcloud1.env

# The three secrets the runbook generates, in the order it writes them.
nextcloud_stack_secret_names:
  - NEXTCLOUD_DB_PASSWORD
  - NEXTCLOUD_REDIS_PASSWORD
  - NEXTCLOUD_ADMIN_PASSWORD

# The shared Compose unit template names a stack's drop-in directory after the
# instance, and the instance of this stack is "nextcloud1".
nextcloud_stack_dropin_dir: /etc/systemd/system/branchleft-compose@nextcloud1.service.d
nextcloud_stack_unit: branchleft-compose@nextcloud1.service
