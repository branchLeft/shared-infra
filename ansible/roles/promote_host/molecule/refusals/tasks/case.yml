---
# One case, included by verify.yml with promote_host_refusals_case set. It puts the host in one bad
# state, lists the role's paths, runs the role, and requires the exact message (or acceptance, for
# a control), no change to those paths and no input value in the message. The host is put back in
# every outcome.
- name: Reset what an earlier case left behind
  ansible.builtin.set_fact:
    promote_host_refusals_outcome: ''

- name: Make the bad state, run the role against it and judge what happened
  block:
    - name: Run the commands that make the bad state
      ansible.builtin.command:
        argv: '{{ item }}'
      loop: '{{ promote_host_refusals_case.commands | default([]) }}'
      loop_control:
        label: '{{ item | join(" ") }}'
      changed_when: true

    # Names, types, modes, owners, inodes, times and sizes, never a content. Sorted so that the
    # order the host returns them in does not matter.
    - name: List the role's paths before the role runs
      ansible.builtin.command:
        argv: "{{ ['find'] + scenario_snapshot_roots + ['-printf', '%p %y %m %u %g %i %T@ %s\\n'] }}"
      register: promote_host_refusals_before
      changed_when: false

    - name: Apply the role and note whether it accepted
      block:
        - name: Apply the role
          ansible.builtin.include_role:
            name: branchleft.promote_host
          vars:
            promote_host_ledger_url: "{{ promote_host_refusals_case.url | default('') }}"
            promote_host_signer_key: "{{ promote_host_refusals_case.key | default('') }}"

        - name: Note that the role accepted
          ansible.builtin.set_fact:
            promote_host_refusals_outcome: accepted
      rescue:
        # A refusal inside a loop reports "One or more items failed" at the top and the message in
        # the failed item, so the message is taken from the item when there is one.
        - name: Note the message the role stopped with
          ansible.builtin.set_fact:
            promote_host_refusals_outcome: >-
              {{ (ansible_failed_result.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | first
              if ansible_failed_result.results is defined else ansible_failed_result.msg | default('no message')) }}

    - name: List the role's paths after the role has run
      ansible.builtin.command:
        argv: "{{ ['find'] + scenario_snapshot_roots + ['-printf', '%p %y %m %u %g %i %T@ %s\\n'] }}"
      register: promote_host_refusals_after
      changed_when: false

    - name: Require the message to be the expected one, and to hold no input value
      ansible.builtin.assert:
        that:
          - promote_host_refusals_outcome == (promote_host_refusals_case.expect | default('accepted'))
          - promote_host_refusals_case.forbidden | default([]) | select('in', promote_host_refusals_outcome) | list | length == 0
        fail_msg: 'Case "{{ promote_host_refusals_case.name }}" gave "{{ promote_host_refusals_outcome }}".'
        quiet: true

    - name: Require the role to have changed none of its paths, whether it accepted or refused
      ansible.builtin.assert:
        that:
          - promote_host_refusals_before.stdout_lines | sort == promote_host_refusals_after.stdout_lines | sort
        fail_msg: 'Case "{{ promote_host_refusals_case.name }}" changed the host.'
        quiet: true
  always:
    - name: Put the host back
      ansible.builtin.command:
        argv: '{{ item }}'
      loop: '{{ promote_host_refusals_case.restore | default([]) }}'
      loop_control:
        label: '{{ item | join(" ") }}'
      changed_when: true
