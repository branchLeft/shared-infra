---
# The order is the README's "Order": read and refuse first, work out what is due,
# validate every candidate, place every file, then act, then record. Nothing in
# the files below notifies a handler: the restart shape is the fingerprint and the
# stamp (README, "Restart shape").
# The profile is chosen before anything reads the stack. The tenant profile hands the stack
# directory and the two lists that name its files and directories to _run.yml as task vars of
# that include, so they last for that include only: a set_fact would stay on the host and
# reach the next run of the role in the same play (README, "Profiles"). The estate profile
# sets nothing, so a caller's edge_stack_source_dir still reaches it.
- name: Run the role with the tenant profile's stack directory, CrowdSec files and directories
  ansible.builtin.include_tasks: _run.yml
  vars:
    edge_stack_source_dir: '{{ edge_stack_tenant_source_dir }}'
    edge_stack_crowdsec_files: '{{ edge_stack_tenant_crowdsec_files }}'
    edge_stack_dirs: '{{ edge_stack_tenant_dirs }}'
  when: edge_stack_profile == 'tenant'

- name: Run the role with the estate profile
  ansible.builtin.include_tasks: _run.yml
  when: edge_stack_profile != 'tenant'
