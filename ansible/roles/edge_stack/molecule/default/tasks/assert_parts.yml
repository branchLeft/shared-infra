---
# The cases are shared out between scenarios (edge_stack_verify_homes in verify.yml). A case
# whose home is no scenario would be a case nobody runs, and it would pass silently, so this
# fails first: the run is itself a home, and each home is a scenario directory beside this
# one that has a molecule.yml and a verify.yml and does not leave the verify step out. The
# files are read on the controller.
- name: Assert this run is the home of some case
  ansible.builtin.assert:
    that:
      - edge_stack_verify_part in edge_stack_verify_homes.values()
    fail_msg: >-
      This scenario ({{ edge_stack_verify_part }}) is the home of no case. The homes are
      {{ edge_stack_verify_homes.values() | unique | list }}, so it would run no case.
    quiet: true

- name: Assert each home is a scenario that runs verify
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.fileglob', edge_stack_verify_scenarios_dir ~ '/' ~ item ~ '/molecule.yml', wantlist=true) | length == 1
      - lookup('ansible.builtin.fileglob', edge_stack_verify_scenarios_dir ~ '/' ~ item ~ '/verify.yml', wantlist=true) | length == 1
      - >-
        not (lookup('ansible.builtin.file', edge_stack_verify_scenarios_dir ~ '/' ~ item ~ '/skip-steps.txt', errors='ignore')
        | default('', true) | string | regex_search(edge_stack_verify_skip_pattern))
    fail_msg: 'The home {{ item }} has no molecule/{{ item }}/molecule.yml or verify.yml, or that scenario leaves the verify step out.'
    quiet: true
  loop: '{{ edge_stack_verify_homes.values() | unique | list }}'
  vars:
    edge_stack_verify_scenarios_dir: '{{ playbook_dir }}/..'
    # The one guard every role copies (checks/test_verify_guard_copies.py holds the copies equal). It reads
    # the file as the harness does, with str.splitlines(): a verify line may be padded, and may follow any
    # break that splits a line besides LF (CR, VT, FF, FS, GS, RS, NEL, LS, PS), which ^ and $ cannot see.
    edge_stack_verify_skip_pattern: '(?:\A|(?<=[\x0a\x0d\x0b\x0c\x1c-\x1e\x85\u2028\u2029]))\s*verify\s*(?=[\x0a\x0d\x0b\x0c\x1c-\x1e\x85\u2028\u2029]|\Z)'
