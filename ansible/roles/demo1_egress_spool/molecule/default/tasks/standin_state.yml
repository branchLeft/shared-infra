---
# Test scaffolding, not role tasks. Writes what the stand-in docker reports and how the
# stand-in drain endpoint listens. With no standin_override it writes the healthy spool
# the golden Compose file describes; a refusal case passes a dict whose keys replace one
# value each:
#   health    the container's health status (default healthy)
#   readonly  whether its root filesystem is read-only (default true)
#   networks  the networks it is joined to (default: the drain network and the seven slots)
#   extra_networks  networks it is joined to as well
#   image     the image the container reports (default: the one it was started with)
#   port      the line docker port prints (default 8081/tcp -> 127.0.0.1:8095)
#   bind      the address the endpoint listens on (default 127.0.0.1)
#   open      whether the endpoint answers the drain path with no token (default false)
#   images    the images that are on the host, as the role's image check finds them (default:
#             the golden Compose file's image and the bumped pin the converge step writes)
- name: Write the images the stand-in docker holds
  ansible.builtin.copy:
    content: |
      {% for image in standin_images %}
      {{ image }}
      {% endfor %}
    dest: /var/lib/standin-docker/images
    owner: root
    group: root
    mode: '0644'
  vars:
    standin_golden_compose: '{{ playbook_dir }}/../../files/ghost-platform/render-core/test/golden/mail-spool-compose.demo1.yml'
    standin_golden_image: >-
      {{ lookup('ansible.builtin.file', standin_golden_compose) | regex_findall("image: '([^']+)'") | first }}
    standin_images: '{{ (standin_override | default({})).images | default([standin_golden_image, standin_bumped_pin]) }}'

- name: Write what the stand-in docker inspect reports
  ansible.builtin.copy:
    content: |
      [{"Name": "/mail-spool-mail-spool-1",
        "State": {"Status": "running", "Health": {"Status": "{{ standin_health }}"}},
        "Config": {"Image": "{{ standin_image }}"},
        "HostConfig": {"ReadonlyRootfs": {{ standin_readonly | bool | to_json }}},
        "NetworkSettings": {"Networks": { {% for network in standin_networks %}"{{ network }}": {}{{ "," if not loop.last else "" }}{% endfor %} }}}]
    dest: /var/lib/standin-docker/inspect.json
    owner: root
    group: root
    mode: '0644'
  vars:
    standin_health: "{{ (standin_override | default({})).health | default('healthy') }}"
    standin_image: "{{ (standin_override | default({})).image | default('@@IMAGE@@') }}"
    standin_readonly: '{{ (standin_override | default({})).readonly | default(true) }}'
    standin_default_networks:
      - branchleft-mail-spool-drain
      - branchleft-mail-30001
      - branchleft-mail-30002
      - branchleft-mail-30003
      - branchleft-mail-30004
      - branchleft-mail-30005
      - branchleft-mail-30006
      - branchleft-mail-30007
    standin_networks: >-
      {{ ((standin_override | default({})).networks | default(standin_default_networks))
      + ((standin_override | default({})).extra_networks | default([])) }}

- name: Write what the stand-in docker port prints
  ansible.builtin.copy:
    content: "{{ (standin_override | default({})).port | default('8081/tcp -> 127.0.0.1:8095') }}\n"
    dest: /var/lib/standin-docker/port.txt
    owner: root
    group: root
    mode: '0644'

- name: Write how the stand-in drain endpoint listens
  ansible.builtin.copy:
    content: |
      STUB_BIND={{ (standin_override | default({})).bind | default('127.0.0.1') }}
      STUB_OPEN={{ 1 if ((standin_override | default({})).open | default(false) | bool) else 0 }}
    dest: /etc/standin-drain-stub.env
    owner: root
    group: root
    mode: '0644'

# Only restarts the endpoint if it is running: before the spool is delivered there is
# nothing to restart, and the stand-in docker starts it with this file already in place.
- name: Restart the stand-in drain endpoint if it is running
  ansible.builtin.command:
    argv: [systemctl, try-restart, standin-drain-stub.service]
  changed_when: true
