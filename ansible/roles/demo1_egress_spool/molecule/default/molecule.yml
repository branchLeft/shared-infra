---
# The role's container-only test (ANS-15). The harness in ansible/harness
# sets ROLE_TEST_RUN_ID, so the instance name is unique to one run and a
# destroy can only ever remove this run's container. Molecule's interpolation
# has no "required variable" form, so when the variable is unset the name
# falls back to one the Docker daemon rejects: the run fails at create, loudly,
# instead of sharing a container name with another run.
#
# The refusals scenario's molecule.yml is a link to this file, so the platform
# and its pin have this one home. The harness reads the link as it reads any
# scenario file.
dependency:
  name: galaxy
  # The harness installs the pinned collections before it starts Molecule.
  enabled: false
driver:
  name: docker
platforms:
  - name: 'role-test-${ROLE_TEST_RUN_ID:-unset/use-the-harness}'
    # Third-party systemd test base on Debian 13, the release every production
    # host runs, trusted by digest, the same platform the monitoring_stack role
    # uses. The digest is the pin; the tag is informational. The role reloads
    # systemd and reads a unit's loaded state, so the platform runs systemd as
    # PID 1, a platform the author justifies here, per ANS-15.
    image: geerlingguy/docker-debian13-ansible:latest@sha256:979c0d5e12b0035fff1c46bd4dfd00d67cd82fa48035194f14f32e01c8c02372
    # Pre-built, so that the reference can carry a digest.
    pre_build_image: true
    # The egress program refuses to run on any host not named demo1, and the
    # role reads the host's own name, so the container carries that name. The
    # container is the only host this name is given to.
    hostname: demo1
    # Destroy removes the container's anonymous volumes. This scenario's cgroup
    # bind mount means none is created; the key guards against one if the mount
    # is ever dropped.
    keep_volumes: false
    # No privileged mode. The host cgroup namespace is a stated exception
    # (ANS-15), the same one the monitoring_stack role states: a private
    # namespace over the read-write cgroup mount makes systemd exit at once on a
    # cgroup v2 host. The test image is trusted by digest and the job holds no
    # credentials.
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    # NET_ADMIN is the one added capability. The egress program loads rules into
    # the container's own network namespace with iptables-restore, which is a
    # netlink write, and the scenario reads them back. It reaches no host
    # network: the container has its own. Not privileged.
    capabilities:
      - NET_ADMIN
    labels:
      branchleft.role-test-run: '${ROLE_TEST_RUN_ID}'
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # The image pin the deploy wrapper writes for an image bump, which the converge
        # step puts in place after the first apply and the verify step expects to find
        # still there. A digest unlike the golden's.
        standin_bumped_pin: ghcr.io/branchleft/mailgun-shim@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
verifier:
  name: ansible
