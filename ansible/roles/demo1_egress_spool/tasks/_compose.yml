---
# Internal to the role. Places the rendered Compose file for the spool and
# holds what it says to the posture the host depends on. The file is the
# committed golden of the renderer in ghost-platform, fetched at the pinned
# commit and held to its sha256: this role neither renders nor edits it, and
# the image digest is in that file and nowhere else here.
- name: Create the spool's project directory
  ansible.builtin.file:
    path: '{{ demo1_egress_spool_project_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

# In check mode the directory does not exist yet on a host that has not had
# the spool, and get_url refuses a destination whose directory is missing, so
# the download is skipped there and the plan shows the directory alone (ANS-10).
- name: Look at the spool's project directory
  ansible.builtin.stat:
    path: '{{ demo1_egress_spool_project_dir }}'
    follow: false
  register: demo1_egress_spool_project_stat

- name: Download the rendered Compose file, held to its pinned sha256
  ansible.builtin.get_url:
    url: '{{ demo1_egress_spool_source_base_url }}/{{ demo1_egress_spool_compose_src }}'
    dest: '{{ demo1_egress_spool_compose_dest }}'
    checksum: 'sha256:{{ demo1_egress_spool_compose_sha }}'
    owner: root
    group: root
    mode: '0644'
  register: demo1_egress_spool_compose
  when: demo1_egress_spool_project_stat.stat.exists

- name: Look at the Compose file on the host
  ansible.builtin.stat:
    path: '{{ demo1_egress_spool_compose_dest }}'
    follow: false
  register: demo1_egress_spool_compose_now

# Skipped in a plan on a host that has no Compose file yet: there is nothing to
# read (ANS-10). An apply always has the file.
- name: Hold the Compose file to the posture the host depends on
  ansible.builtin.include_tasks: _compose_assert.yml
  when: demo1_egress_spool_compose_now.stat.exists
