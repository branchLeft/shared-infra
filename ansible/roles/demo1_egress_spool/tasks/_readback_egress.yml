---
# Internal to the role. Reads the loaded policy back from the kernel, in both
# families, and asserts it. Everything here only reads, so it runs in check mode
# as well as an apply (ANS-10), except on a plan that would still change the
# egress files or the unit: a host that has not been given the program has no
# policy to read, and the plan says so in a visible line, so a skip does not
# read as a pass.
- name: Say the egress policy is not verified in a plan that would still install it
  ansible.builtin.debug:
    msg: >-
      Egress policy NOT verified: this plan would still install or restart the egress program,
      so the policy chains and the DOCKER-USER jump are read only by a run that applies.
  when: ansible_check_mode and (demo1_egress_spool_egress_pending | bool)

- name: Read the policy in each family
  ansible.builtin.include_tasks: _readback_family.yml
  loop: '{{ demo1_egress_spool_firewall_tools }}'
  loop_control:
    loop_var: demo1_egress_spool_tool
  when: not ansible_check_mode or not (demo1_egress_spool_egress_pending | bool)

- name: Ask systemd for the egress unit
  ansible.builtin.systemd_service:
    name: '{{ demo1_egress_spool_egress_unit_name }}'
  register: demo1_egress_spool_egress_state
  when: not ansible_check_mode or not (demo1_egress_spool_egress_pending | bool)

- name: Refuse an egress unit that is not active now and enabled for boot
  ansible.builtin.assert:
    that:
      - demo1_egress_spool_egress_state.status.ActiveState == 'active'
      - demo1_egress_spool_egress_state.status.UnitFileState == 'enabled'
    quiet: true
    fail_msg: >-
      The egress unit {{ demo1_egress_spool_egress_unit_name }} is not active, or is not enabled for boot.
      Without it the policy is gone at the next boot or Docker restart.
  when: not ansible_check_mode or not (demo1_egress_spool_egress_pending | bool)
