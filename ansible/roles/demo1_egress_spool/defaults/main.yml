---
# Nothing here is private. The role has no secret input and no required input:
# every value below has a default, and the pinned files are public.

# The one home of the egress program, its unit and the rendered Compose file is
# branchLeft/ghost-platform. They are downloaded from this commit, never copied
# into this repository, and each file is held to the sha256 below. Bump the
# commit and every checksum in one change: a checksum that does not match the
# file at the commit fails the download. This role is the only pin of the
# egress program and its unit in this repository.
demo1_egress_spool_source_sha: 19622ee9c88bf918949f675a85897cfb64c65a24
demo1_egress_spool_source_base_url: 'https://raw.githubusercontent.com/branchLeft/ghost-platform/{{ demo1_egress_spool_source_sha }}'

# The three files, one path from the repository root and one sha256 each. The
# Compose file is the committed golden of the renderer: the image digest, the
# networks and the one published port are in it, and nowhere else.
demo1_egress_spool_files:
  - path: demo-host/provision/branchleft_demo_egress.sh
    sha256: 6a03d476d2bdc9978f4772e9b6b14f96c1ba4e57215f2abefd974b404ad2235f
  - path: demo-host/provision/branchleft-demo-egress.service
    sha256: 7b25d4d7ce17ee65149260368e1271370c00a3860cd1de2f99178467c6185ded
  - path: render-core/test/golden/mail-spool-compose.demo1.yml
    sha256: a08170c428eb9ce3cef5fe1a514bfd36053d8f8e3bc1c92ef7ee11b96f5cce4b

# The host port the spool's drain endpoint is published on, on 127.0.0.1 only.
# The pinned Compose file publishes this port; the role refuses a file that
# publishes any other.
demo1_egress_spool_drain_port: 8095
