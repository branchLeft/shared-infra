---
argument_specs:
  main:
    short_description: Own the options on the CI jump account's key lines
    description: >-
      Always describes, read only, which accounts on the host carry forwarding options in their
      key files. Only when ci_jump_manage_keys is true does it make the jump account's
      authorized_keys exactly one line per declared key, each with the options restrict,
      port-forwarding, one permitopen per declared destination on port 22, and nothing else.
      It never creates or edits an account.
    author: branchLeft
    options:
      ci_jump_manage_keys:
        type: bool
        default: false
        description: >-
          When false the role only reports and changes nothing, whatever the other variables hold.
          When true the role checks every input and the host, then makes the key file exactly the
          declared lines.
      ci_jump_user:
        type: str
        default: ''
        description: >-
          The jump account, which must already exist with a shell of nologin or false. Read only
          when ci_jump_manage_keys is true. The role refuses root and the accounts the ci_login and
          tunnel_account roles own.
      ci_jump_destinations:
        type: list
        elements: str
        default: []
        description: >-
          The hosts the jump key may reach, each a host name or an IPv4 address with no port, the
          exact text the client sends to the jump host. The role adds port 22 itself. An empty list
          is refused and never read as allow-all; a wildcard, a port, a quote, a comma, a space, an
          IPv6 form and a repeat are each refused. Read only when ci_jump_manage_keys is true.
      ci_jump_keys:
        type: list
        elements: dict
        default: []
        description: >-
          The public keys that use the jump account, and no others. An empty list is refused and
          never read as remove-all. Public keys, but treated as sensitive: no task prints them and
          the plan shows fingerprints only. Read only when ci_jump_manage_keys is true.
        options:
          key:
            type: str
            required: true
            no_log: true
            description: >-
              One public key on one line as ssh-keygen writes it, with no options in front. The
              role decodes it, refuses an unknown type or a blob that is not that type, and writes
              the type and the body without the comment.
