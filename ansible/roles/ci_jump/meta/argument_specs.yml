---
argument_specs:
  main:
    short_description: Own the jump account's root-owned key file and sshd Match block
    description: >-
      Always describes, read only and without naming an account, which accounts on the host
      carry forwarding options in their key files. Only when ci_jump_manage_keys is true does it
      make the jump account's root-owned key file exactly one line per declared key, each with
      the options restrict, port-forwarding, one permitopen per declared destination on port 22
      and a forced nologin command, and write the sshd drop-in whose Match block for the account
      allows local forwarding to the same destinations and nothing else. It then reads both
      back, and sshd's own answer for the account, and refuses unless remote forwarding is off.
      Only after that read-back does it remove the files of the earlier hand-made layout, and it
      puts everything back if anything fails. It never creates or edits an account.
    author: branchLeft
    options:
      ci_jump_manage_keys:
        type: bool
        default: false
        description: >-
          When false the role only reports and changes nothing, whatever the other variables hold.
          When true the role checks every input and the host, then writes the two files.
      ci_jump_user:
        type: str
        required: true
        no_log: true
        description: >-
          The jump account, which must already exist with a shell of nologin or false. Required
          and with no default, because it comes from the host's private inputs file (the
          host_inputs role), but read only when ci_jump_manage_keys is true. The role refuses root and the accounts the ci_login
          and tunnel_account roles own. The name is held out of the repository and of every log:
          it comes from the host's private inputs file (the host_inputs role sets it), no path
          the role writes is made from it, and the role never prints it.
      ci_jump_own_address:
        type: str
        default: ''
        description: >-
          The jump host's own private IPv4 address (10/8, 172.16/12 or 192.168/16; loopback is
          accepted for a test host). It must be one of the destinations, because
          the runner reaches the jump host itself through the jump, and sshd is asked about the
          account for a connection from this address. Read only when ci_jump_manage_keys is true
          (the report uses it when it is set).
      ci_jump_destinations:
        type: list
        elements: str
        default: []
        description: >-
          The hosts the jump key may reach, each a host name or an IPv4 address with no port, the
          exact text the client sends to the jump host. The role adds port 22 itself, and writes
          this one list to every key line's permitopen and to the Match block's PermitOpen. An
          empty list is refused and never read as allow-all; a wildcard, a port, a quote, a comma,
          a space, an IPv6 form and a repeat are each refused. The list must hold
          ci_jump_own_address. Read only when ci_jump_manage_keys is true.
      ci_jump_keys:
        type: list
        elements: dict
        default: []
        description: >-
          The public keys that use the jump account, and no others. An empty list is refused and
          never read as remove-all. Public keys, but treated as sensitive: no task prints them and
          the plan shows fingerprints only. Read only when ci_jump_manage_keys is true.
        options:
          key:
            type: str
            required: true
            no_log: true
            description: >-
              One public key on one line as ssh-keygen writes it, with no options in front. The
              role decodes it, refuses an unknown type or a blob that is not that type, and writes
              the type and the body without the comment.
