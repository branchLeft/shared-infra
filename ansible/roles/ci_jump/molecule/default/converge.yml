---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the role with the scenario's values
      ansible.builtin.include_tasks: tasks/apply_role.yml

    # The control case for the log check in verify.yml: a task with no no_log that is given a
    # known value. If the log did not show it, an empty result of the scan would mean nothing.
    - name: Run a harmless command that is given a canary argument
      ansible.builtin.command:
        argv:
          - /bin/true
          - SCENARIO_LOG_CANARY
      changed_when: false
      check_mode: false
