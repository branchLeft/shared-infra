---
# Test setup only, never part of the role. It makes the instance look as edge1 does before the
# role is enabled: the jump account with a nologin shell and a locked-out password, a hand-made
# key file whose one line allows a host the new list will not (so a converge must replace it),
# and a real sshd of its own. The sshd listens on 127.0.0.1:2222, where the jump connections
# arrive, and also on port 22 of two more loopback addresses, which stand for the hosts behind
# the jump: one will be on the list, one will not. It also carries a Match block for another
# user with forwarding off, which the role's sshd read must evaluate. The key pairs are made
# here, inside the container, for this run only: no key leaves it except the public halves the
# converge reads.
- name: Prepare the instance
  hosts: all
  gather_facts: false
  tasks:
    - name: Install the SSH server and its client
      ansible.builtin.apt:
        name:
          - openssh-server
          - openssh-client
        state: present
        update_cache: true
        cache_valid_time: 3600

    # nologin, the shell the role requires, and a password field that is not locked, so sshd's own
    # account check passes it and a password still cannot be used.
    - name: Make the jump account
      ansible.builtin.user:
        name: '{{ scenario_jump_user }}'
        comment: CI jump account
        shell: /usr/sbin/nologin
        create_home: true
        password: '*'
      no_log: true

    - name: Make the directory the scenario records into
      ansible.builtin.file:
        path: '{{ scenario_record_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Make the directory the key pairs are made in
      ansible.builtin.file:
        path: '{{ scenario_key_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0700'

    # No module in the pinned collections makes an SSH key pair, so the command is used
    # (ANS-9). The creates argument makes it report truthfully. old stands for the key on the
    # hand-made line, intruder for a key that is in no file.
    - name: Make one throwaway key pair for each key the scenario uses
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ''
          - -C
          - 'PLACEHOLDER_{{ item }}'
          - -f
          - '{{ scenario_key_dir }}/{{ item }}'
        creates: '{{ scenario_key_dir }}/{{ item }}.pub'
      loop:
        - jump
        - second
        - old
        - intruder
      no_log: true

    - name: Read the public key of the old line
      ansible.builtin.slurp:
        src: '{{ scenario_key_dir }}/old.pub'
      register: ci_jump_scenario_prepare_old
      no_log: true

    - name: Make the account's .ssh directory as the host has it
      ansible.builtin.file:
        path: '/home/{{ scenario_jump_user }}/.ssh'
        state: directory
        owner: '{{ scenario_jump_user }}'
        group: '{{ scenario_jump_user }}'
        mode: '0700'

    # The state before the role: a line that allows the unlisted address and an old key. The
    # converge must replace it with exactly the declared lines.
    - name: Put the hand-made key file in place
      ansible.builtin.copy:
        content: >-
          restrict,port-forwarding,permitopen="{{ scenario_unlisted }}:22"
          {{ ci_jump_scenario_prepare_old.content | b64decode | trim }}
        dest: '/home/{{ scenario_jump_user }}/.ssh/authorized_keys'
        owner: '{{ scenario_jump_user }}'
        group: '{{ scenario_jump_user }}'
        mode: '0600'
      no_log: true
      diff: false

    - name: Make the directory sshd separates privileges in
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Make the SSH server's host keys
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -A
        creates: /etc/ssh/ssh_host_ed25519_key

    # Close to the Debian defaults: key authentication only, StrictModes on, the default
    # AuthorizedKeysFile. Only the listeners and the pid file are the test's, and PAM is off
    # because a container has no login session for it to open. A drop-in beats the main file
    # because the main file includes the directory first. The role reads this configuration
    # through sshd -T, so no reload is needed after a case changes it. The Match block is
    # for a user that is not the jump account; the scenario observes that sshd -T -C
    # evaluates it for that user and not for the jump account.
    - name: Put the test SSH server's configuration in place
      ansible.builtin.copy:
        content: |
          ListenAddress 127.0.0.1:{{ scenario_ssh_port }}
          ListenAddress {{ scenario_listed }}:22
          ListenAddress {{ scenario_unlisted }}:22
          PidFile /run/sshd-ci-jump-test.pid
          UsePAM no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          StrictModes yes
          Match User {{ scenario_other_user }}
            AllowTcpForwarding no
        dest: /etc/ssh/sshd_config.d/10-ci-jump-test.conf
        owner: root
        group: root
        mode: '0644'

    - name: Check the whole SSH server configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false

    - name: Start the test SSH server
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -E
          - '{{ scenario_record_dir }}/sshd.log'
        creates: /run/sshd-ci-jump-test.pid

    - name: Wait for the test SSH server to listen on each address
      ansible.builtin.wait_for:
        host: '{{ item.host }}'
        port: '{{ item.port }}'
        timeout: 30
      loop:
        - { host: 127.0.0.1, port: '{{ scenario_ssh_port }}' }
        - { host: '{{ scenario_listed }}', port: 22 }
        - { host: '{{ scenario_unlisted }}', port: 22 }
