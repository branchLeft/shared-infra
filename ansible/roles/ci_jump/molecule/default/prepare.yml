---
# Test setup only, never part of the role. It makes the instance look as edge1 does before the
# role is enabled, following the ci-jump runbook's hand-made layout: the jump account with a
# nologin shell and no home directory, a root-owned key file outside any home whose one line
# allows a host the new list will not (so a converge must replace it), and a drop-in with a Match
# block for the account that carries the same old destination. The real OpenSSH server runs as
# ssh.service. It listens on 127.0.0.1:2222, where the jump connections arrive, and on port 22 of
# three more loopback addresses, which stand for the hosts behind the jump: one will be on the
# list, one will not, and one is the jump host's own address. A Match block for another user,
# with forwarding off, is the test's own. The key pairs are made here, inside the container, for
# this run only: no key leaves it except the public halves the converge reads.
- name: Prepare the instance
  hosts: all
  gather_facts: false
  tasks:
    - name: Install the SSH server and its client
      ansible.builtin.apt:
        name:
          - openssh-server
          - openssh-client
        state: present
        update_cache: true
        cache_valid_time: 3600

    # As the runbook makes it: a system account with no home directory (the home is
    # /nonexistent) and a nologin shell. The password field is not locked, so sshd's own account
    # check passes it in a container that has no PAM, and a password still cannot be used.
    - name: Make the jump account as the runbook does
      ansible.builtin.user:
        name: '{{ scenario_jump_user }}'
        comment: CI jump account
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false
        password: '*'
      no_log: true

    - name: Make the account other users' Match block is for
      ansible.builtin.user:
        name: '{{ scenario_other_user }}'
        shell: /usr/sbin/nologin
        create_home: false
        password: '*'
      no_log: true

    - name: Make the directory the scenario records into
      ansible.builtin.file:
        path: '{{ scenario_record_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Make the directory the key pairs are made in
      ansible.builtin.file:
        path: '{{ scenario_key_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0700'

    # No module in the pinned collections makes an SSH key pair, so the command is used
    # (ANS-9). The creates argument makes it report truthfully. old stands for the key on the
    # hand-made line, intruder for a key that is in no file.
    - name: Make one throwaway key pair for each key the scenario uses
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ''
          - -C
          - 'PLACEHOLDER_{{ item }}'
          - -f
          - '{{ scenario_key_dir }}/{{ item }}'
        creates: '{{ scenario_key_dir }}/{{ item }}.pub'
      loop:
        - jump
        - second
        - old
        - intruder
      no_log: true

    - name: Read the public key of the old line
      ansible.builtin.slurp:
        src: '{{ scenario_key_dir }}/old.pub'
      register: ci_jump_scenario_prepare_old
      no_log: true

    - name: Make the directory of the hand-made key file as the runbook does
      ansible.builtin.file:
        path: /etc/ssh/ci-jump
        state: directory
        owner: root
        group: root
        mode: '0755'

    # The state before the role: a line that allows the unlisted address, an old key and the
    # forced command, as the runbook's step writes it. The converge must replace it with exactly
    # the declared lines.
    - name: Put the hand-made key file in place
      ansible.builtin.copy:
        content: >-
          restrict,port-forwarding,permitopen="{{ scenario_unlisted }}:22",command="/usr/sbin/nologin"
          {{ ci_jump_scenario_prepare_old.content | b64decode | trim }}
        dest: /etc/ssh/ci-jump/authorized_keys
        owner: root
        group: root
        mode: '0644'
      no_log: true
      diff: false

    - name: Make the SSH server's host keys
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -A
        creates: /etc/ssh/ssh_host_ed25519_key

    # Close to the Debian defaults: key authentication only, StrictModes on. Only the listeners
    # are the test's, and PAM is off because a container has no login session for it to open. The
    # Match block ends with Match all so that it covers nothing the drop-ins after it hold.
    - name: Put the test SSH server's configuration in place
      ansible.builtin.copy:
        content: |
          ListenAddress 127.0.0.1:{{ scenario_ssh_port }}
          ListenAddress {{ scenario_listed }}:22
          ListenAddress {{ scenario_unlisted }}:22
          ListenAddress {{ scenario_own }}:22
          UsePAM no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          StrictModes yes
          Match User {{ scenario_other_user }}
            AllowTcpForwarding no
          Match all
        dest: /etc/ssh/sshd_config.d/10-ci-jump-test.conf
        owner: root
        group: root
        mode: '0644'

    # The drop-in the runbook's step writes by hand, with the old destination.
    - name: Put the hand-made sshd drop-in in place
      ansible.builtin.copy:
        content: |
          Match User {{ scenario_jump_user }}
              AuthorizedKeysFile /etc/ssh/ci-jump/authorized_keys
              AuthenticationMethods publickey
              AllowTcpForwarding local
              PermitOpen {{ scenario_unlisted }}:22
              GatewayPorts no
              AllowAgentForwarding no
              AllowStreamLocalForwarding no
              X11Forwarding no
              PermitTTY no
              PermitTunnel no
              PermitUserRC no
              ForceCommand /usr/sbin/nologin
          Match all
        dest: /etc/ssh/sshd_config.d/50-branchleft-ci-jump.conf
        owner: root
        group: root
        mode: '0644'
      no_log: true
      diff: false

    - name: Check the whole SSH server configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false

    - name: Start the SSH server as the service the role reloads
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted

    - name: Wait for the SSH server to listen on each address
      ansible.builtin.wait_for:
        host: '{{ item.host }}'
        port: '{{ item.port }}'
        timeout: 30
      loop:
        - { host: 127.0.0.1, port: '{{ scenario_ssh_port }}' }
        - { host: '{{ scenario_listed }}', port: 22 }
        - { host: '{{ scenario_unlisted }}', port: 22 }
        - { host: '{{ scenario_own }}', port: 22 }
