---
# One connection to the container's own sshd with one key, and what came of it. Inputs:
# attempt_key, the key pair's name; attempt_expect, one of
#   through  the stdio forward to attempt_target was made: the target's own banner came back
#   refused  the jump host refused the forward and logged that it denied it; no banner came
#   denied   the key did not authenticate
#   no_command  a remote command was asked for and nothing ran
#   no_remote_forward  the jump host was asked to open a port of its own on its loopback (ssh -R,
#              to attempt_target) and refused: nothing listened afterwards
# attempt_target, host:port for the forward (a -W request, or the -R destination); attempt_command,
# the remote command (sent after a double dash), for the no_command case. The marker file is what the hostile command
# tries to make. Every other target is a live listener of the same sshd, so a refusal is the key
# line's doing and not an absent listener's.
#
# attempt_route: direct (the default) is every connection above, made to the jump host itself.
# proxyjump runs the client the way the pipeline's action runs it for a host behind the jump: an
# ssh -F configuration whose one stanza, jump_hop, holds the hop's own key and strict options
# (IdentitiesOnly, BatchMode, ForwardAgent no, ClearAllForwardings yes), and -o ProxyJump=jump_hop
# to the target as its own account with its own key, reading standard input into a command. The
# meaning of attempt_expect is the same, with two differences: through means the target ran the
# command (cat gave the standard input back, so the bytes crossed the hop), and the target is
# attempt_target as host:port, the port going to the target and not to the hop. The stanza mirrors
# .github/actions/ssh-check-hosts/action.yml at github-workflows v1.0.21; it is a copy across
# repositories, and github-workflows tools/ssh_jump_proof.py is the authority for the client side.
- name: Clear the marker a hostile command would make
  ansible.builtin.file:
    path: /tmp/EXAMPLE_MARKER
    state: absent
  check_mode: false

# The test SSH server runs as ssh.service, so its log is the journal's.
- name: Look at what the test SSH server had logged before the connection
  ansible.builtin.command:
    argv: [journalctl, --unit, ssh, --output, cat, --no-pager]
  register: ci_jump_scenario_attempt_log_before
  changed_when: false
  check_mode: false

# The hop's stanza, with the key under test as its identity. The test server is the only host, so
# the stanza names it by its loopback address and port, and does not check its host key (the
# action pins known_hosts; the pin is the action's, not the role's).
- name: Write the client configuration of the hop
  ansible.builtin.copy:
    content: |
      Host jump_hop
        HostName 127.0.0.1
        Port {{ scenario_ssh_port }}
        User {{ scenario_jump_user }}
        IdentityFile {{ scenario_key_dir }}/{{ attempt_key }}
        IdentitiesOnly yes
        BatchMode yes
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null
        GlobalKnownHostsFile /dev/null
        LogLevel ERROR
        ConnectTimeout 30
        ServerAliveInterval 30
        ForwardAgent no
        ClearAllForwardings yes
    dest: '{{ scenario_key_dir }}/jump_config'
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  check_mode: false
  when: (attempt_route | default('direct')) == 'proxyjump'

- name: Connect with the key
  ansible.builtin.command:
    argv: >-
      {{ attempt_proxyjump if (attempt_route | default('direct')) == 'proxyjump'
      else attempt_base + attempt_tail }}
    stdin: "EXAMPLE\n"
    stdin_add_newline: false
  vars:
    # The far end of the hop is the target account, which the jump host does not know, reading
    # the standard input into cat. The -p is the target's port; the hop's is in its stanza.
    attempt_proxyjump:
      - timeout
      - --kill-after=5
      - '60'
      - ssh
      - -T
      - -F
      - '{{ scenario_key_dir }}/jump_config'
      - -o
      - ProxyJump=jump_hop
      - -i
      - '{{ scenario_key_dir }}/target'
      - -o
      - IdentitiesOnly=yes
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - GlobalKnownHostsFile=/dev/null
      - -o
      - ConnectTimeout=10
      - -o
      - ForwardAgent=no
      - -o
      - ClearAllForwardings=yes
      - -o
      - LogLevel=ERROR
      - -p
      - '{{ (attempt_target | default(":")).split(":")[1] }}'
      - '{{ scenario_target_user }}@{{ (attempt_target | default(":")).split(":")[0] }}'
      - --
      - cat
    # timeout turns a client left waiting into a failure (124, or 137 once killed) that the
    # assertion below names.
    attempt_base:
      - timeout
      - --kill-after=5
      - '{{ "20" if attempt_expect == "no_remote_forward" else "60" }}'
      - ssh
      - -o
      - ConnectTimeout=10
      - -i
      - '{{ scenario_key_dir }}/{{ attempt_key }}'
      - -p
      - '{{ scenario_ssh_port }}'
      - -o
      - IdentitiesOnly=yes
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - LogLevel=ERROR
    attempt_forward:
      ['-W', '{{ attempt_target | default("") }}', '{{ scenario_jump_user }}@127.0.0.1']
    # ssh -R asks the jump host to listen on its own loopback and send what arrives to the
    # target; ExitOnForwardFailure turns a refusal into a failed command, and -N runs no command.
    attempt_reverse:
      - -o
      - ExitOnForwardFailure=yes
      - -N
      - -R
      - '127.0.0.1:{{ scenario_remote_port }}:{{ attempt_target | default("") }}'
      - '{{ scenario_jump_user }}@127.0.0.1'
    attempt_remote:
      ['{{ scenario_jump_user }}@127.0.0.1', '--', '{{ attempt_command | default("") }}']
    attempt_tail: >-
      {{ attempt_reverse if attempt_expect == 'no_remote_forward'
      else (attempt_forward if attempt_target is defined else attempt_remote) }}
  register: ci_jump_scenario_attempt
  changed_when: false
  failed_when: false
  check_mode: false

- name: Look for the marker a hostile command would make
  ansible.builtin.stat:
    path: /tmp/EXAMPLE_MARKER
  register: ci_jump_scenario_attempt_marker
  check_mode: false

- name: Look at what the test SSH server has logged since
  ansible.builtin.command:
    argv: [journalctl, --unit, ssh, --output, cat, --no-pager]
  register: ci_jump_scenario_attempt_log_after
  changed_when: false
  check_mode: false

- name: Assert the client was not left waiting and nothing the client asked for ran
  ansible.builtin.assert:
    that:
      - ci_jump_scenario_attempt.rc not in [124, 137]
      - not ci_jump_scenario_attempt_marker.stat.exists
    fail_msg: 'The client hung, or a command it asked for ran: {{ attempt_key }}'
    quiet: true
  when: attempt_expect != 'no_remote_forward'

# A target's banner is the proof that the forward reached it.
- name: Assert the forward was made and the target answered
  ansible.builtin.assert:
    that:
      - ci_jump_scenario_attempt.rc == 0
      - "'SSH-2.0-' in ci_jump_scenario_attempt.stdout"
    fail_msg: >-
      The forward to {{ attempt_target }} was not made for {{ attempt_key }}: it ended with
      {{ ci_jump_scenario_attempt.rc }} and said {{ ci_jump_scenario_attempt.stderr }}
    quiet: true
  when: attempt_expect == 'through' and (attempt_route | default('direct')) == 'direct'

# Behind a ProxyJump the banner is read by the client itself, so the proof that the forward
# reached the target is that the target's account ran the command: cat gave back what the client
# sent on standard input.
- name: Assert the target behind the hop ran the command and the standard input crossed the hop
  ansible.builtin.assert:
    that:
      - ci_jump_scenario_attempt.rc == 0
      - ci_jump_scenario_attempt.stdout | trim == 'EXAMPLE'
    fail_msg: >-
      The command did not run on {{ attempt_target }} through the hop for {{ attempt_key }}: it
      ended with {{ ci_jump_scenario_attempt.rc }} and said {{ ci_jump_scenario_attempt.stderr }}
    quiet: true
  when: attempt_expect == 'through' and (attempt_route | default('direct')) == 'proxyjump'

- name: Assert the forward was refused by the key line
  ansible.builtin.assert:
    that:
      - ci_jump_scenario_attempt.rc == 255
      - "'SSH-2.0-' not in ci_jump_scenario_attempt.stdout"
      - "'stdio forwarding failed' in ci_jump_scenario_attempt.stderr"
      - ci_jump_scenario_attempt_denied_after > ci_jump_scenario_attempt_denied_before
    fail_msg: >-
      The forward to {{ attempt_target }} was not refused for {{ attempt_key }}: it ended with
      {{ ci_jump_scenario_attempt.rc }} and said {{ ci_jump_scenario_attempt.stderr }}
    quiet: true
  vars:
    # split leaves one more piece than the line occurs, so more pieces after than before means
    # sshd logged that it denied a forward during this connection: the key line refused it, and
    # not an absent listener.
    ci_jump_scenario_attempt_denied_before: >-
      {{ ci_jump_scenario_attempt_log_before.stdout.split('but the request was denied') | length }}
    ci_jump_scenario_attempt_denied_after: >-
      {{ ci_jump_scenario_attempt_log_after.stdout.split('but the request was denied') | length }}
  when: attempt_expect == 'refused'

- name: Assert the key was turned away
  ansible.builtin.assert:
    that:
      - ci_jump_scenario_attempt.rc == 255
      - "'Permission denied' in ci_jump_scenario_attempt.stderr"
    fail_msg: 'The key {{ attempt_key }} was not turned away: {{ ci_jump_scenario_attempt.stderr }}'
    quiet: true
  when: attempt_expect == 'denied'

- name: Assert a remote command was not run
  ansible.builtin.assert:
    that:
      - ci_jump_scenario_attempt.rc != 0
      - "'SSH-2.0-' not in ci_jump_scenario_attempt.stdout"
    fail_msg: 'A remote command was served to {{ attempt_key }}.'
    quiet: true
  when: attempt_expect == 'no_command'

# A remote forward that was made keeps the client waiting (-N), so the timeout kills it and it
# ends 124 or 137; a refusal ends 255 with the client's own words.
- name: Assert the jump host refused to open a port of its own
  ansible.builtin.assert:
    that:
      - ci_jump_scenario_attempt.rc == 255
      - "'remote port forwarding failed' in ci_jump_scenario_attempt.stderr"
    fail_msg: >-
      The jump host did not refuse the remote forward for {{ attempt_key }}: the client ended
      with {{ ci_jump_scenario_attempt.rc }} and said {{ ci_jump_scenario_attempt.stderr }}
    quiet: true
  when: attempt_expect == 'no_remote_forward'
