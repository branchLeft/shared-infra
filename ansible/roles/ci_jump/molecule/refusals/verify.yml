---
# What the refusal cases must leave behind: the host as the first play delivered it. The expected
# values are written out here, not read from the role, so a case that left the host changed is a
# failure and not a test that agrees with it.
- name: Verify the instance
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the public keys the scenario made
      ansible.builtin.slurp:
        src: '{{ scenario_key_dir }}/{{ item }}.pub'
      loop:
        - jump
        - second
      register: ci_jump_scenario_verify_pubs
      no_log: true

    - name: Read the key file and look at the files the cases changed or made
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop:
        - '/home/{{ scenario_jump_user }}/.ssh/authorized_keys'
        - '/home/{{ scenario_jump_user }}/.ssh/authorized_keys2'
        - /etc/ssh/sshd_config.d/99-ci-jump-case.conf
      register: ci_jump_scenario_verify_stat

    - name: Read the key file
      ansible.builtin.slurp:
        src: '/home/{{ scenario_jump_user }}/.ssh/authorized_keys'
      register: ci_jump_scenario_verify_file
      no_log: true

    - name: Assert the key file is as delivered and the case files are gone
      ansible.builtin.assert:
        that:
          - ci_jump_scenario_verify_stat.results[0].stat.mode == '0600'
          - ci_jump_scenario_verify_stat.results[0].stat.pw_name == scenario_jump_user
          - not ci_jump_scenario_verify_stat.results[1].stat.exists
          - not ci_jump_scenario_verify_stat.results[2].stat.exists
          - (ci_jump_scenario_verify_file.content | b64decode).splitlines() | map('trim') | sort == expected | sort
        quiet: true
        fail_msg: A refusal case left the key file or a file of its own changed.
      vars:
        verify_options: 'restrict,port-forwarding,permitopen="{{ scenario_listed }}:22"'
        verify_jump: "{{ (ci_jump_scenario_verify_pubs.results[0].content | b64decode).split(' ')[0:2] | join(' ') }}"
        verify_second: "{{ (ci_jump_scenario_verify_pubs.results[1].content | b64decode).split(' ')[0:2] | join(' ') }}"
        expected:
          - '{{ verify_options }} {{ verify_jump }}'
          - '{{ verify_options }} {{ verify_second }}'

    - name: Look at the jump account's shell
      ansible.builtin.getent:
        database: passwd
        key: '{{ scenario_jump_user }}'

    - name: Assert the shell is nologin again
      ansible.builtin.assert:
        that:
          - getent_passwd[scenario_jump_user][5] == '/usr/sbin/nologin'
        quiet: true
        fail_msg: A refusal case left the shell of the jump account changed.

    - name: Ask sshd what it evaluates for the jump account
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - 'user={{ scenario_jump_user }},host=ci-jump-check.invalid,addr=192.0.2.1'
      register: ci_jump_scenario_verify_sshd
      changed_when: false
      check_mode: false

    - name: Assert sshd is as prepared
      ansible.builtin.assert:
        that:
          - "'allowtcpforwarding yes' in ci_jump_scenario_verify_sshd.stdout_lines"
          - "'authorizedkeyscommand none' in ci_jump_scenario_verify_sshd.stdout_lines"
          - "'permitopen any' in ci_jump_scenario_verify_sshd.stdout_lines"
        quiet: true
        fail_msg: A refusal case left the sshd configuration changed.
