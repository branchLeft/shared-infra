---
# What the refusal cases must leave behind: the host as the first play delivered it. The expected
# values are written out here, not read from the role, so a case that left the host changed, or a
# write step that did not put the previous files back, is a failure and not a test that agrees
# with it.
- name: Verify the instance
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the public keys the scenario made
      ansible.builtin.slurp:
        src: '{{ scenario_key_dir }}/{{ item }}.pub'
      loop:
        - jump
        - second
      register: ci_jump_scenario_verify_pubs
      no_log: true

    - name: Look at the files and the directory the cases changed or made
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop:
        - /etc/ssh/ci-jump
        - /etc/ssh/ci-jump/authorized_keys
        - /etc/ssh/ci-jump/authorized_keys.real
        - /etc/ssh/sshd_config.d/50-branchleft-ci-jump.conf
        - /etc/ssh/sshd_config.d/05-ci-jump-case.conf
        - /etc/ssh/sshd_config.d/99-ci-jump-case.conf
      register: ci_jump_scenario_verify_stat

    - name: Read the key file and the drop-in
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - /etc/ssh/ci-jump/authorized_keys
        - /etc/ssh/sshd_config.d/50-branchleft-ci-jump.conf
      register: ci_jump_scenario_verify_files
      no_log: true

    - name: Assert the files are as delivered and the case files are gone
      ansible.builtin.assert:
        that:
          - ci_jump_scenario_verify_stat.results[0].stat.mode == '0755'
          - ci_jump_scenario_verify_stat.results[0].stat.pw_name == 'root'
          - ci_jump_scenario_verify_stat.results[1].stat.mode == '0644'
          - ci_jump_scenario_verify_stat.results[1].stat.pw_name == 'root'
          - ci_jump_scenario_verify_stat.results[1].stat.isreg
          - not ci_jump_scenario_verify_stat.results[2].stat.exists
          - ci_jump_scenario_verify_stat.results[3].stat.mode == '0644'
          - ci_jump_scenario_verify_stat.results[3].stat.pw_name == 'root'
          - not ci_jump_scenario_verify_stat.results[4].stat.exists
          - not ci_jump_scenario_verify_stat.results[5].stat.exists
          - (ci_jump_scenario_verify_files.results[0].content | b64decode).splitlines() | map('trim') | sort == expected | sort
          - (ci_jump_scenario_verify_files.results[1].content | b64decode) == expected_dropin
        quiet: true
        fail_msg: A refusal case left the key file, the drop-in or a file of its own changed.
      vars:
        verify_options: 'restrict,port-forwarding,permitopen="{{ scenario_listed }}:22",permitopen="{{ scenario_own }}:22",command="/usr/sbin/nologin"'
        verify_jump: "{{ (ci_jump_scenario_verify_pubs.results[0].content | b64decode).split(' ')[0:2] | join(' ') }}"
        verify_second: "{{ (ci_jump_scenario_verify_pubs.results[1].content | b64decode).split(' ')[0:2] | join(' ') }}"
        expected:
          - '{{ verify_options }} {{ verify_jump }}'
          - '{{ verify_options }} {{ verify_second }}'
        expected_dropin: |
          # Written by the ci_jump role. Change the owner's variables, not this file.
          Match User {{ scenario_jump_user }}
              AuthorizedKeysFile /etc/ssh/ci-jump/authorized_keys
              AuthenticationMethods publickey
              AllowTcpForwarding local
              PermitOpen {{ scenario_listed }}:22 {{ scenario_own }}:22
              GatewayPorts no
              AllowAgentForwarding no
              AllowStreamLocalForwarding no
              X11Forwarding no
              PermitTTY no
              PermitTunnel no
              PermitUserRC no
              ForceCommand /usr/sbin/nologin
          Match all

    - name: Look at the jump account's shell
      ansible.builtin.getent:
        database: passwd
        key: '{{ scenario_jump_user }}'
      no_log: true

    - name: Assert the shell is nologin again
      ansible.builtin.assert:
        that:
          - getent_passwd[scenario_jump_user][5] == '/usr/sbin/nologin'
        quiet: true
        fail_msg: A refusal case left the shell of the jump account changed.

    - name: Ask sshd what it evaluates for the jump account
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - 'user={{ scenario_jump_user }},host=x,addr={{ scenario_own }}'
      register: ci_jump_scenario_verify_sshd
      changed_when: false
      check_mode: false
      no_log: true

    - name: Assert sshd applies what the role wrote
      ansible.builtin.assert:
        that:
          - "'allowtcpforwarding local' in ci_jump_scenario_verify_sshd.stdout_lines"
          - "'authorizedkeyscommand none' in ci_jump_scenario_verify_sshd.stdout_lines"
          - "('permitopen ' ~ scenario_listed ~ ':22 ' ~ scenario_own ~ ':22') in ci_jump_scenario_verify_sshd.stdout_lines"
        quiet: true
        fail_msg: A refusal case left the sshd configuration changed.
