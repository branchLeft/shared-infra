---
# Test scaffolding, not role tasks. Included from a rescue section with expect_phrase set:
# asserts the step failed for the reason the case is for. The whole failed result is searched,
# not its msg alone, because the refusal code is in the message of the assertion that stopped the
# run, and the module's own result is hidden.
- name: Assert the refusal was the one this case is for
  ansible.builtin.assert:
    that:
      - expect_phrase in (ansible_failed_result | to_json)
    quiet: true
    fail_msg: >-
      The step failed for a reason other than the one this case is for. Expected
      '{{ expect_phrase }}'; the failed result was: {{ ansible_failed_result | to_json }}
