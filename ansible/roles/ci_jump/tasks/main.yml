---
# Order matters. The report always runs and only reads, so the plan of a host shows what its key
# files hold before anything is enabled. With the flag false that is all the role does: it writes
# nothing, and every task reports no change. With the flag true the inputs and the host are
# judged first (_guards.yml), then the root-owned key file and the sshd drop-in are written,
# checked, reloaded and read back (_write.yml, which includes _readback.yml). Both files are
# made from the one destination list, ci_jump_destinations.
#
# The module (library/ci_jump_authorized_keys.py) is the one home of every rule about the key
# lines and the Match block. Its results carry fingerprints and option names only, never a key
# body or the account's name, and its refusals carry a code and an entry number, never a value.

- name: Report which accounts carry forwarding options, read only
  ansible.builtin.import_tasks: _report.yml

- name: Judge the inputs and the host before anything is written
  ansible.builtin.import_tasks: _guards.yml
  when: ci_jump_manage_keys | bool

- name: Write the key file and the sshd drop-in, check them, reload sshd and read them back
  ansible.builtin.import_tasks: _write.yml
  when: ci_jump_manage_keys | bool
