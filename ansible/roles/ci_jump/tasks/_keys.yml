---
# exclusive: true makes the account's file exactly these lines, so a line left out is removed. The
# guards before this step have refused an empty list, so an empty list never removes every line.
# The lines carry the account's public keys, which are not secret but are treated as sensitive
# (ANS-16): the task hides its result and its diff, and the plan above it shows fingerprints.
- name: Make the authorised keys of the jump account exactly the declared lines
  ansible.posix.authorized_key:
    user: '{{ ci_jump_user }}'
    key: "{{ lookup('ansible.builtin.template', 'authorized_keys.j2') }}"
    exclusive: true
    manage_dir: true
  no_log: true
  diff: false
