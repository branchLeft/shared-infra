---
# The target host's half. It always prints the host's own SSH host public key, which the operator's
# data commit hands to the scraper host's pin. It makes nothing until the scraper host's public key
# is filled in (tenant_scrape_tunnel_is_target_enabled). Then the sshd configuration is checked as
# a whole before it is reloaded, and a failed check, or a failed read-back, puts the previous files
# back and fails the run. If the key is emptied after the half was installed, it is removed again
# the same way (_edget_teardown.yml). Runs under --check: nothing changes there, and a host that has
# none of the directories the role writes into does not fail it.
- name: Look for the host's own ed25519 public host key
  ansible.builtin.stat:
    path: '{{ tenant_scrape_tunnel_host_key_pub_file }}'
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: tenant_scrape_tunnel_host_key_stat
  check_mode: false

- name: Read the host's own public host key
  ansible.builtin.slurp:
    src: '{{ tenant_scrape_tunnel_host_key_pub_file }}'
  register: tenant_scrape_tunnel_host_key_file
  when: tenant_scrape_tunnel_host_key_stat.stat.exists
  no_log: true
  check_mode: false

# This is public data, so it is the one task here that shows a value. Its prefix is what the
# operator's agent searches the apply log for (README, "Turning the tunnel on").
- name: Show the target host's public host key for the scraper host's pin
  ansible.builtin.debug:
    msg: 'tenant_scrape_tunnel target_host_key: {{ tenant_scrape_tunnel_host_key_file.content | b64decode | trim }}'
  when: tenant_scrape_tunnel_host_key_file is defined and tenant_scrape_tunnel_host_key_file.content is defined

- name: Look up the tunnel account on the target host
  ansible.builtin.include_tasks: _account_lookup.yml

- name: Look for the current sshd drop-in and authorized keys
  ansible.builtin.stat:
    path: '{{ item }}'
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - '{{ tenant_scrape_tunnel_sshd_dropin }}'
    - '{{ tenant_scrape_tunnel_authorized_keys_file }}'
  register: tenant_scrape_tunnel_before
  check_mode: false

- name: Look for the directory of the authorized keys
  ansible.builtin.stat:
    path: '{{ tenant_scrape_tunnel_authorized_keys_dir }}'
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: tenant_scrape_tunnel_authorized_keys_dir_stat
  check_mode: false

# Kept in memory, not on disk: a rollback writes these back byte for byte.
- name: Keep the current sshd drop-in and authorized keys for a rollback
  ansible.builtin.slurp:
    src: '{{ item.item }}'
  loop: '{{ tenant_scrape_tunnel_before.results }}'
  loop_control:
    label: '{{ item.item }}'
  when: item.stat.exists
  register: tenant_scrape_tunnel_prev
  no_log: true
  check_mode: false

# Any of the account, the files and the directory is the sign that this half was installed.
- name: Note whether this half is installed
  ansible.builtin.set_fact:
    tenant_scrape_tunnel_is_target_installed: >-
      {{ tenant_scrape_tunnel_passwd.rc == 0
         or tenant_scrape_tunnel_authorized_keys_dir_stat.stat.exists
         or (tenant_scrape_tunnel_before.results | selectattr('stat.exists') | list | length > 0) }}

- name: Report that the tunnel waits for the scraper host's key
  ansible.builtin.debug:
    msg: >-
      tenant_scrape_tunnel waiting: tenant_scrape_tunnel_scraper_public_key is not set, so no tunnel
      account, key or sshd drop-in is installed.
  when: not (tenant_scrape_tunnel_is_target_enabled | bool)

- name: Remove the tunnel account, its authorized key and its sshd drop-in
  ansible.builtin.include_tasks: _edget_teardown.yml
  when: tenant_scrape_tunnel_is_target_teardown | bool

- name: Install the tunnel account, its authorized key and its sshd drop-in
  when: tenant_scrape_tunnel_is_target_enabled | bool
  block:
    - name: Refuse a scraper public key that is not one ed25519 line
      ansible.builtin.assert:
        that:
          - tenant_scrape_tunnel_scraper_public_key is match(tenant_scrape_tunnel_ed25519_pattern)
        quiet: true
        fail_msg: >-
          TENANT_SCRAPE_TUNNEL_BAD_PUBLIC_KEY: the scraper public key must be one line, 'ssh-ed25519 <base64>'
          with an optional comment, as the scraper host printed it.

    - name: Create the tunnel account on the target host
      ansible.builtin.include_tasks: _account.yml

    - name: Create the directory of the authorized keys
      ansible.builtin.file:
        path: '{{ tenant_scrape_tunnel_authorized_keys_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0755'

    # The role writes one drop-in into the directory the OpenSSH package ships. A host without it
    # has no sshd to configure, and the role stops rather than make a directory sshd does not read.
    - name: Look at the directory of the sshd drop-ins
      ansible.builtin.stat:
        path: '{{ tenant_scrape_tunnel_sshd_config_dir }}'
      register: tenant_scrape_tunnel_dropin_dir_stat
      check_mode: false

    - name: Refuse a host without the sshd drop-in directory
      ansible.builtin.assert:
        that:
          - tenant_scrape_tunnel_dropin_dir_stat.stat.exists
          - tenant_scrape_tunnel_dropin_dir_stat.stat.isdir
        quiet: true
        fail_msg: The sshd drop-in directory is missing. Is OpenSSH installed on this host?

    - name: Write the sshd drop-in and the authorized key, then check and reload sshd
      block:
        - name: Write the authorized key with the restrictions and the three destinations
          ansible.builtin.template:
            src: authorized_keys.j2
            dest: '{{ tenant_scrape_tunnel_authorized_keys_file }}'
            owner: root
            group: root
            mode: '0644'
          no_log: true
          diff: false
          register: tenant_scrape_tunnel_keys

        - name: Write the sshd drop-in for the tunnel account
          ansible.builtin.template:
            src: sshd-drop-in.conf.j2
            dest: '{{ tenant_scrape_tunnel_sshd_dropin }}'
            owner: root
            group: root
            mode: '0644'
          register: tenant_scrape_tunnel_dropin

        # Checked as a whole, because sshd -t on a single drop-in cannot see the main
        # configuration. Not run in check mode: nothing was written there.
        - name: Check the whole sshd configuration before it is reloaded
          ansible.builtin.command:
            argv: [sshd, -t]
          changed_when: false
          when: not ansible_check_mode

        - name: Reload sshd when the tunnel's files changed
          ansible.builtin.systemd_service:
            name: '{{ tenant_scrape_tunnel_sshd_service }}'
            state: reloaded
          when: not ansible_check_mode and (tenant_scrape_tunnel_keys.changed or tenant_scrape_tunnel_dropin.changed)

        # The settings sshd actually applies to the tunnel account, read back from sshd -T. Each
        # is the one value the role wrote, so a second forward, a command or a wider
        # authentication method fails the read-back. No Ansible module reports sshd's effective
        # settings, so this reads them with the command module: argv form, read only, never
        # reported as changed. The asserts below are the narrow comparison that stands in for a
        # module. The connection asked about is the loopback address: a Match Address block ahead
        # of the drop-in that loosens a setting for another address is not seen.
        - name: Read the effective sshd settings for the tunnel account
          ansible.builtin.command:
            argv:
              [sshd, -T, -C, 'user={{ tenant_scrape_tunnel_user }},host=localhost,addr=127.0.0.1']
          register: tenant_scrape_tunnel_effective
          changed_when: false
          when: not ansible_check_mode
          no_log: true

        - name: Assert sshd applies the settings the role wrote
          ansible.builtin.assert:
            that:
              - >-
                (tenant_scrape_tunnel_effective.stdout_lines | select('match', '^' ~ item.key ~ ' ') | list | first | default(''))
                == (item.key ~ ' ' ~ item.value)
            quiet: true
            fail_msg: 'The effective sshd setting {{ item.key }} for the tunnel account is not the one the role wrote.'
          loop: '{{ tenant_scrape_tunnel_expected_effective | dict2items }}'
          loop_control:
            label: '{{ item.key }}'
          when: not ansible_check_mode

        # sshd prints the permitted destinations on one line, in the order written; they are held
        # to the destinations as a set, so no other address or port is allowed.
        - name: Assert sshd permits exactly the three destinations
          ansible.builtin.assert:
            that:
              - >-
                (tenant_scrape_tunnel_effective.stdout_lines | select('match', '^permitopen ') | list | first | default('permitopen')).split(' ')[1:] | sort
                == tenant_scrape_tunnel_expected_permitopen | sort
            quiet: true
            fail_msg: The effective sshd permitopen list for the tunnel account is not the destinations the role wrote.
          when: not ansible_check_mode
          vars:
            tenant_scrape_tunnel_expected_permitopen: >-
              {{ tenant_scrape_tunnel_destinations | map(attribute='address') | map('regex_replace', '$', ':' ~ tenant_scrape_tunnel_target_port) | list }}

        # The key file is read back from disk, not from the template's input: one line of options,
        # the key type and the key, and nothing else.
        - name: Read the authorized key back
          ansible.builtin.slurp:
            src: '{{ tenant_scrape_tunnel_authorized_keys_file }}'
          register: tenant_scrape_tunnel_keys_on_disk
          when: not ansible_check_mode
          no_log: true

        - name: Assert the authorized key on disk is one restricted line for the destinations
          ansible.builtin.assert:
            that:
              - tenant_scrape_tunnel_key_lines | length == 1
              - tenant_scrape_tunnel_key_lines[0].split(' ') | length == 3
              - tenant_scrape_tunnel_key_lines[0].split(' ')[0] == tenant_scrape_tunnel_expected_options
              - tenant_scrape_tunnel_key_lines[0].split(' ')[1] == 'ssh-ed25519'
            quiet: true
            fail_msg: The authorized key on disk is not one restricted line for the three destinations.
          when: not ansible_check_mode
          vars:
            tenant_scrape_tunnel_key_lines: '{{ (tenant_scrape_tunnel_keys_on_disk.content | b64decode).splitlines() }}'
            tenant_scrape_tunnel_expected_options: >-
              {{ (['restrict', 'port-forwarding']
                  + (tenant_scrape_tunnel_destinations | map(attribute='address')
                     | map('regex_replace', '^(.*)$', 'permitopen="\1:' ~ tenant_scrape_tunnel_target_port ~ '"') | list)
                  + ['command="' ~ tenant_scrape_tunnel_nologin ~ '"']) | join(',') }}

      rescue:
        - name: Put the previous files back and reload sshd
          ansible.builtin.include_tasks: _edget_rollback.yml

        - name: Fail with the cause, after the previous files are back
          ansible.builtin.fail:
            msg: >-
              TENANT_SCRAPE_TUNNEL_SSHD_REFUSED: the tunnel's sshd configuration did not pass its check or
              read-back. The previous sshd drop-in and authorized key are back in place.
