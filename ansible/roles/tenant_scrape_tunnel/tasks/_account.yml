---
# The tunnel account, shared by both halves: one home for making the account and checking its
# shell. It runs after _account_lookup.yml, which refused an account that has a login shell.
- name: Create the tunnel account with no login shell
  ansible.builtin.user:
    name: '{{ tenant_scrape_tunnel_user }}'
    system: true
    create_home: false
    home: /nonexistent
    shell: '{{ tenant_scrape_tunnel_nologin }}'

# Read back from the passwd database, not from the module's own result.
- name: Read the tunnel account's shell back
  ansible.builtin.command:
    argv: [getent, passwd, '{{ tenant_scrape_tunnel_user }}']
  register: tenant_scrape_tunnel_passwd_after
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Assert the tunnel account has no login shell
  ansible.builtin.assert:
    that:
      - (tenant_scrape_tunnel_passwd_after.stdout.split(':') | last) == tenant_scrape_tunnel_nologin
    quiet: true
    fail_msg: The tunnel account does not have the no-login shell.
  when: not ansible_check_mode
