---
# The target host's tunnel removed, because the scraper host's key was emptied after this half
# was installed. The drop-in and the authorized key go first, then sshd is checked as a whole and
# reloaded, and its effective settings for the account are read back; a failure of any of those
# puts the previous files back and fails the run, as the install does. Only then is any
# connection the account still holds ended, the directory of the keys removed and the account
# removed. Under --check nothing is removed.
- name: Report that the tunnel is being removed
  ansible.builtin.debug:
    msg: >-
      tenant_scrape_tunnel teardown: tenant_scrape_tunnel_scraper_public_key is empty and this half
      is installed, so the tunnel account, its authorized key and its sshd drop-in are removed.

- name: Remove the sshd drop-in and the authorized key, then check and reload sshd
  block:
    - name: Remove the sshd drop-in for the tunnel account
      ansible.builtin.file:
        path: '{{ tenant_scrape_tunnel_sshd_dropin }}'
        state: absent
      register: tenant_scrape_tunnel_dropin

    - name: Remove the authorized key
      ansible.builtin.file:
        path: '{{ tenant_scrape_tunnel_authorized_keys_file }}'
        state: absent
      register: tenant_scrape_tunnel_keys

    # Checked as a whole, as the install does. Not run in check mode: nothing was removed there.
    - name: Check the whole sshd configuration before it is reloaded
      ansible.builtin.command:
        argv: [sshd, -t]
      changed_when: false
      when: not ansible_check_mode

    - name: Reload sshd when the tunnel's files were removed
      ansible.builtin.systemd_service:
        name: '{{ tenant_scrape_tunnel_sshd_service }}'
        state: reloaded
      when: not ansible_check_mode and (tenant_scrape_tunnel_keys.changed or tenant_scrape_tunnel_dropin.changed)

    # The settings sshd applies to the account now, read back from sshd -T (the same read-only
    # command call as the install's, for the same reason): none of the role's must remain.
    - name: Read the effective sshd settings for the tunnel account
      ansible.builtin.command:
        argv: [sshd, -T, -C, 'user={{ tenant_scrape_tunnel_user }},host=localhost,addr=127.0.0.1']
      register: tenant_scrape_tunnel_effective
      changed_when: false
      when: not ansible_check_mode
      no_log: true

    - name: Assert sshd no longer applies the tunnel's settings to the account
      ansible.builtin.assert:
        that:
          - tenant_scrape_tunnel_effective.stdout_lines | select('search', tenant_scrape_tunnel_authorized_keys_dir) | list | length == 0
          - ('forcecommand ' ~ tenant_scrape_tunnel_nologin) not in tenant_scrape_tunnel_effective.stdout_lines
          - >-
            tenant_scrape_tunnel_effective.stdout_lines | select('match', '^permitopen ')
            | select('search', tenant_scrape_tunnel_destinations | map(attribute='address') | map('regex_escape') | join('|'))
            | list | length == 0
        quiet: true
        fail_msg: The effective sshd settings for the tunnel account still hold the tunnel's after its files were removed.
      when: not ansible_check_mode

  rescue:
    - name: Put the previous files back and reload sshd
      ansible.builtin.include_tasks: _edget_rollback.yml

    - name: Fail with the cause, after the previous files are back
      ansible.builtin.fail:
        msg: >-
          TENANT_SCRAPE_TUNNEL_SSHD_REFUSED: the sshd configuration did not pass its check or
          read-back after the tunnel's files were removed. The previous sshd drop-in and authorized
          key are back in place.

# The account may hold a connection that the reload did not end: sshd keeps a session open across
# a reload, and the scraper host's unit holds one open for as long as it runs.
- name: End any connection the tunnel account still holds open
  ansible.builtin.command:
    argv: [pkill, -KILL, -u, '{{ tenant_scrape_tunnel_user }}']
  register: tenant_scrape_tunnel_ended
  changed_when: tenant_scrape_tunnel_ended.rc == 0
  failed_when: tenant_scrape_tunnel_ended.rc not in [0, 1]
  when: tenant_scrape_tunnel_passwd.rc == 0 and not ansible_check_mode

- name: Remove the directory of the authorized keys
  ansible.builtin.file:
    path: '{{ tenant_scrape_tunnel_authorized_keys_dir }}'
    state: absent

- name: Remove the tunnel account
  ansible.builtin.include_tasks: _account_remove.yml
  when: tenant_scrape_tunnel_passwd.rc == 0
