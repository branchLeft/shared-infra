---
# One tenant password the role must refuse before it starts a container. Takes case_name
# and item (value). The administrator URL file is taken off the disk; the passwords stay.
- name: 'Place the inputs with a bad tenant password: {{ case_name }}'
  ansible.builtin.import_tasks: place_inputs.yml
  vars:
    place_tenant_password: '{{ item.value }}'

- name: 'Refuse a bad tenant password: {{ case_name }}'
  ansible.builtin.include_tasks: refuse.yml
  vars:
    ask_name: 'a tenant password with {{ case_name }}'
    ask_tags: control_plane_db_provision
    ask_extra: {control_plane_db_step: provision}
    refused_text: 'REFUSED: a password file does not hold 24 or more of letters'

- name: 'Look at the administrator URL file after the refusal: {{ case_name }}'
  ansible.builtin.stat:
    path: '{{ verify_input_dir }}/admin-url'
  register: control_plane_db_verify_password_case

- name: 'Assert the administrator URL file is gone after the refusal: {{ case_name }}'
  ansible.builtin.assert:
    that:
      - not control_plane_db_verify_password_case.stat.exists
    quiet: true
    fail_msg: A refusal left the administrator URL file on the disk.
