[project]
name = "control-plane-db-role"
version = "0.0.0"
# The oldest interpreter any target host provides (PY-3): Debian 13 ships Python 3.13.
requires-python = ">=3.13"

[tool.mypy]
strict = true
python_version = "3.13"
# The module is a single file in library/, imported by the tests by its own name. The tests also
# read the role's tasks with the shared helper in ansible/tests/support.
mypy_path = "$MYPY_CONFIG_FILE_DIR/library:$MYPY_CONFIG_FILE_DIR/../../tests/support"
# Matches ansible/pyproject.toml.
disallow_any_explicit = true

# ANS-2: Ansible's own imports are untyped, so the override names the ansible.*
# modules and nothing else. A blanket ignore_missing_imports is not the override.
[[tool.mypy.overrides]]
module = ["ansible.*"]
ignore_missing_imports = true

[tool.ruff]
# The repository's ruff policy (ansible/pyproject.toml), with this role's Python floor.
extend = "../../pyproject.toml"
target-version = "py313"

# The server test starts docker and runs its own fixed SQL on a throwaway container; none of it is
# input from outside, which is what these three rules guard against.
[tool.ruff.lint.per-file-ignores]
"tests/unit/test_control_plane_db_login_server.py" = [
  "start-process-with-partial-path",
  "subprocess-without-shell-equals-true",
  "hardcoded-sql-expression",
]
