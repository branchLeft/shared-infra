---
# What the role expects to find on a host before it runs. /etc/branchleft is made by the
# host_inputs role on a real host (it goes first, R11), so this role does not make it and the
# test stands in for that role here. The second account is where the adopt case sends the key.
- name: Prepare the instance
  hosts: all
  gather_facts: false
  tasks:
    - name: Make the parent directory, as host_inputs does on a real host
      ansible.builtin.file:
        path: /etc/branchleft
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create the group the adopt case sends the key to
      ansible.builtin.group:
        name: '{{ scenario_other_group }}'

    - name: Create the account the adopt case sends the key to
      ansible.builtin.user:
        name: '{{ scenario_other_owner }}'
        group: '{{ scenario_other_group }}'
        shell: /usr/sbin/nologin
        create_home: false
