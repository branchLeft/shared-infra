---
argument_specs:
  main:
    short_description: Baseline every container host needs - key-only sshd, unattended upgrades, fail2ban and Docker CE
    description: >-
      Writes the key-only sshd drop-in, checks the whole sshd configuration and
      reloads sshd only after that check passes, then reads the resolved
      settings back. Installs unattended-upgrades, apt-listchanges and
      fail2ban, writes their configuration and enables both services. Delivers
      Docker's apt signing key and source and installs Docker CE. The one input
      is the fail2ban ignore list, whose default is in defaults/main.yml; the
      role handles no secret.
    author: branchLeft
    options:
      host_baseline_fail2ban_ignoreip:
        type: str
        description: >-
          The addresses and ranges the sshd jail never bans, one line of
          space-separated IP addresses and CIDR ranges. The default exempts
          loopback and edge1's private address. Changing it changes only the
          ignoreip line of the jail.
      host_baseline_fail2ban_ignoreip_none:
        type: bool
        default: false
        description: >-
          Set true, on one host, to write the jail with no ignoreip line at all.
          Unset (false) keeps the ignore list. The input is still checked, so
          an empty host_baseline_fail2ban_ignoreip refuses either way.
