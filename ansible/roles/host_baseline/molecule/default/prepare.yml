---
# Test scaffolding, not role tasks. The test image has none of what the role
# installs and the test has no network, so this play puts stand-ins in place
# of the packages, the services and sshd, all of them named PLACEHOLDER:
#
#   - a package of each name the role installs, built here with dpkg-deb and
#     installed from the local file, so that the role finds every package
#     installed, as it does on a host that has been set up, and makes no apt call
#   - a unit for ssh, unattended-upgrades, fail2ban and docker, so that the role
#     can enable and start them; ssh and fail2ban count their reloads in a file
#   - sshd, a script that models what the role depends on (files/sshd_standin),
#     with a Debian-style sshd_config that includes sshd_config.d, and a
#     50-cloud-init.conf that allows passwords, as cloud-init writes it
#
# The path through apt that installs a missing package is therefore not run by
# this test. The README names that limit.
- name: Prepare
  hosts: all
  gather_facts: false
  vars:
    prepare_base_packages:
      - unattended-upgrades
      - apt-listchanges
      - fail2ban
    prepare_docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    prepare_base_units:
      - ssh
      - unattended-upgrades
      - fail2ban
    # The check-fresh scenario's host has no Docker yet: the Docker packages and
    # unit are left out there, and only there. It is the state a first plan on a
    # new host meets (molecule/check-fresh/converge.yml says why it is a plan).
    # The check-fresh host also has no unattended-upgrades and no fail2ban: a new host has none
    # of the role's packages before the first apply, so a handler that reloads fail2ban has no
    # unit to reload in check mode.
    prepare_fresh_host: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME', default='default') == 'check-fresh' }}"
    # Every placeholder the role's packages need, built as a .deb. On the fresh host the
    # unattended-upgrades and fail2ban placeholders are built but not installed: they are
    # indexed as a local apt source instead (below), so the role's check-mode apt call finds
    # candidates to simulate, as a real host's index does.
    prepare_fresh_absent:
      - unattended-upgrades
      - fail2ban
    prepare_repo_packages: '{{ prepare_base_packages + ([] if prepare_fresh_host | bool else prepare_docker_packages) }}'
    prepare_packages: '{{ (prepare_repo_packages | difference(prepare_fresh_absent)) if prepare_fresh_host | bool else prepare_repo_packages }}'
    prepare_units: "{{ (prepare_base_units | difference(prepare_fresh_absent)) if prepare_fresh_host | bool else (prepare_base_units + ['docker']) }}"
  tasks:
    - name: Create a package directory for each placeholder package
      ansible.builtin.file:
        path: '/usr/local/share/host_baseline_test/{{ item }}/DEBIAN'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: '{{ prepare_repo_packages }}'

    - name: Describe each placeholder package
      ansible.builtin.copy:
        content: |
          Package: {{ item }}
          Version: 0.0.0+placeholder
          Architecture: all
          Maintainer: PLACEHOLDER <placeholder@example.invalid>
          Description: PLACEHOLDER package for the host_baseline test
        dest: '/usr/local/share/host_baseline_test/{{ item }}/DEBIAN/control'
        owner: root
        group: root
        mode: '0644'
      loop: '{{ prepare_repo_packages }}'

    - name: Build each placeholder package
      ansible.builtin.command:
        argv:
          - dpkg-deb
          - --build
          - '/usr/local/share/host_baseline_test/{{ item }}'
          - '/usr/local/share/host_baseline_test/{{ item }}.deb'
        creates: '/usr/local/share/host_baseline_test/{{ item }}.deb'
      loop: '{{ prepare_repo_packages }}'

    - name: Install each placeholder package from its local file
      ansible.builtin.apt:
        deb: '/usr/local/share/host_baseline_test/{{ item }}.deb'
        state: present
      loop: '{{ prepare_packages }}'

    # check-fresh only. The packages the fresh host lacks are indexed as a local, offline apt source
    # (only that file path, no network), so the role's check-mode apt call sees candidates as on a
    # real host. Nothing is installed here: the apt task simulates, and no unit exists for them.
    - name: Index the placeholder packages the fresh host lacks as a local apt source
      when: prepare_fresh_host | bool
      block:
        - name: Create the local apt repository directory
          ansible.builtin.file:
            path: /usr/local/share/host_baseline_test/repo
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Copy each missing placeholder package into the repository
          ansible.builtin.copy:
            src: '/usr/local/share/host_baseline_test/{{ item }}.deb'
            dest: '/usr/local/share/host_baseline_test/repo/{{ item }}.deb'
            remote_src: true
            owner: root
            group: root
            mode: '0644'
          loop: '{{ prepare_fresh_absent }}'

        - name: Read the size and digest of each repository package
          ansible.builtin.stat:
            path: '/usr/local/share/host_baseline_test/repo/{{ item }}.deb'
            checksum_algorithm: sha256
          loop: '{{ prepare_fresh_absent }}'
          register: host_baseline_repo_debs

        - name: Write the repository index
          ansible.builtin.copy:
            content: |
              {% for r in host_baseline_repo_debs.results %}
              Package: {{ r.item }}
              Version: 0.0.0+placeholder
              Architecture: all
              Maintainer: PLACEHOLDER <placeholder@example.invalid>
              Description: PLACEHOLDER package for the host_baseline test
              Filename: ./{{ r.item }}.deb
              Size: {{ r.stat.size }}
              SHA256: {{ r.stat.checksum }}

              {% endfor %}
            dest: /usr/local/share/host_baseline_test/repo/Packages
            owner: root
            group: root
            mode: '0644'
          register: host_baseline_repo_index

        - name: Read the size and digest of the repository index
          ansible.builtin.stat:
            path: /usr/local/share/host_baseline_test/repo/Packages
            checksum_algorithm: sha256
          register: host_baseline_repo_stat

        - name: Write the repository release file that names the index
          ansible.builtin.copy:
            content: |
              Origin: PLACEHOLDER
              Label: PLACEHOLDER
              Suite: placeholder
              Codename: placeholder
              Architectures: all
              SHA256:
               {{ host_baseline_repo_stat.stat.checksum }} {{ host_baseline_repo_stat.stat.size }} Packages
            dest: /usr/local/share/host_baseline_test/repo/Release
            owner: root
            group: root
            mode: '0644'

        - name: Point apt at the repository alone, with no network source
          ansible.builtin.copy:
            content: |
              deb [trusted=yes] file:/usr/local/share/host_baseline_test/repo ./
            dest: /etc/apt/sources.test.list
            owner: root
            group: root
            mode: '0644'

        - name: Make apt read that source list and no other
          ansible.builtin.copy:
            content: |
              Dir::Etc::SourceList "/etc/apt/sources.test.list";
              Dir::Etc::SourceParts "-";
            dest: /etc/apt/apt.conf.d/99host-baseline-test
            owner: root
            group: root
            mode: '0644'

        - name: Refresh the apt index from the local repository
          ansible.builtin.command:
            argv: [apt-get, update]
          changed_when: false

    - name: Create the directory that holds the reload counters
      ansible.builtin.file:
        path: /var/lib/host_baseline_test
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Start each reload counter at zero
      ansible.builtin.copy:
        content: ''
        dest: '/var/lib/host_baseline_test/{{ item }}-reloads'
        owner: root
        group: root
        mode: '0644'
      loop: [ssh, fail2ban]

    - name: Start the sshd call log at empty
      ansible.builtin.copy:
        content: ''
        dest: /var/lib/host_baseline_test/sshd-dumps
        owner: root
        group: root
        mode: '0644'

    - name: Install a placeholder unit for each service the role manages
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=PLACEHOLDER {{ item }}
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true
          # A reload fails while its fail flag exists, and then counts nothing. The flag is a
          # test switch for the case that a failed reload must stop the role.
          ExecReload=/bin/sh -c "test ! -e /var/lib/host_baseline_test/fail-{{ item }} && echo reloaded >> /var/lib/host_baseline_test/{{ item }}-reloads"
          [Install]
          WantedBy=multi-user.target
        dest: '/usr/lib/systemd/system/{{ item }}.service'
        owner: root
        group: root
        mode: '0644'
      loop: '{{ prepare_units }}'

    - name: Make systemd read the placeholder units
      ansible.builtin.systemd_service:
        daemon_reload: true

    # The role reloads sshd and expects it to be running, as it is on a host.
    - name: Start the placeholder sshd service
      ansible.builtin.systemd_service:
        name: ssh
        state: started

    - name: Install the sshd stand-in
      ansible.builtin.copy:
        src: sshd_standin
        dest: /usr/sbin/sshd
        owner: root
        group: root
        mode: '0755'

    - name: Create the directory the drop-ins go in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Write a Debian-style sshd_config
      ansible.builtin.copy:
        content: |
          Include /etc/ssh/sshd_config.d/*.conf
          PermitRootLogin prohibit-password
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '0644'

    # The file cloud-init writes when ssh_pwauth is set. It sorts after the
    # role's 01- drop-in, so the drop-in must win; a drop-in named 99- would not.
    - name: Write the drop-in that cloud-init writes
      ansible.builtin.copy:
        content: |
          PasswordAuthentication yes
        dest: /etc/ssh/sshd_config.d/50-cloud-init.conf
        owner: root
        group: root
        mode: '0644'

    - name: Create the fail2ban configuration directory
      ansible.builtin.file:
        path: /etc/fail2ban
        state: directory
        owner: root
        group: root
        mode: '0755'
