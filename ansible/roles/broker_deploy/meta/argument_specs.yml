---
argument_specs:
  main:
    short_description: Install the broker's Node, pinned CI release, state, key, environment file and unit, and run the broker
    description: >-
      Pins the Node runtime the broker runs on, delivers one pinned release of
      the broker's bundle (built and attested by the broker's release workflow,
      its files carried in the role) and points the current link at it, creates the
      broker account and its state directories, installs the public half of the
      request-signing key and the environment file, installs the broker's
      systemd unit, enables and starts it, restarts it when the release, the
      key, the environment file or the unit changed, and waits for the broker's
      status answer. It also installs the sudoers boundary that lets the broker
      run the slot wrapper as root for a fixed list of invocations. The slot
      wrapper itself is not installed here.
    author: branchLeft
    options:
      broker_deploy_release_version:
        type: str
        description: >-
          The broker release to run, as MAJOR.MINOR.PATCH. It names the release
          directory under the releases directory and the directory of the
          release's files under the release directory of the role. Empty until a
          release is carried; while it and the pins are both empty the role waits and
          changes nothing, and pins with an empty version are refused.
        default: '0.2.1'
      broker_deploy_release_pins:
        type: dict
        description: >-
          The release files by version: for each version a mapping from the path
          of each file, relative to the release and including broker.mjs, to its
          sha256 as 64 lower-case hex digits. The role refuses, before it writes
          anything, a release whose files are not exactly those pinned, byte for
          byte, or that holds a link. A digest is not a secret.
        default:
          '0.2.1':
            'broker.mjs': 'd8abd1d90b63f071ad34ae4b89bd5527ef10c61606831fdde1e83b16892fc292'
            'plugins/dockerImageLoader.mjs': '310a1b306e35eeae5947c50ef9102ccee197ab3ff73186a24fef896b311e6fc9'
            'plugins/ghostAdminApi.mjs': 'e84850497a089049bcc8d5cdf4f5156ba979483ba80f2f2f095578bc7b80b6b3'
            'plugins/refusingDrainSource.mjs': '72ef8b00a6f25bdf3e53353d91fef29d545856923b080230e4ad33ea439d776c'
            'plugins/renderCorePlugin.mjs': '99c11b3d6d2c727f8590de7b47c0c809dcab34270f20ef0b92076d52ea1aad33'
          '0.2.0':
            'broker.mjs': '39a94363d7f064e6b57e2c311ff71744065d7f98f14b8e47a59096eed6fcd49b'
            'plugins/dockerImageLoader.mjs': '310a1b306e35eeae5947c50ef9102ccee197ab3ff73186a24fef896b311e6fc9'
            'plugins/ghostAdminApi.mjs': 'e84850497a089049bcc8d5cdf4f5156ba979483ba80f2f2f095578bc7b80b6b3'
            'plugins/refusingDrainSource.mjs': '72ef8b00a6f25bdf3e53353d91fef29d545856923b080230e4ad33ea439d776c'
            'plugins/renderCorePlugin.mjs': '99c11b3d6d2c727f8590de7b47c0c809dcab34270f20ef0b92076d52ea1aad33'
      broker_deploy_release_dir:
        type: path
        description: >-
          Directory on the machine that runs the role that holds one directory
          of files per release version. Nothing is fetched from the network.
        default: '{{ role_path }}/files/releases'
      broker_deploy_verify_key_src:
        type: path
        description: >-
          Path on the machine that runs the role of the text file that holds the 64
          lower-case hex digits of the 32-byte public half of the broker's
          request-signing key, with at most one line feed after them. The role
          writes the 32 raw bytes to the host. The private half never leaves the
          owner's workstation and is not an input to this role.
        default: '{{ role_path }}/files/broker-verify-key.hex'
      broker_deploy_verify_key_sha256:
        type: str
        description: >-
          The sha256 of the 32 raw bytes the key file spells, as 64 lower-case hex
          digits. The role refuses, before it writes anything, a key file that is
          not exactly 64 hex digits or whose 32 bytes do not have this digest, and
          refuses an empty value. A digest is not a secret.
        default: '9647c37c09ae127cc30d175210245706b87fdb23df606c2fa2bf64deb3d48c22'
      broker_deploy_node_version:
        type: str
        description: The Node version the broker runs, as it appears in the download path.
        default: v26.5.0
      broker_deploy_node_arch:
        type: str
        choices: [x64, arm64]
        description: The Node architecture of the target host.
        default: x64
      broker_deploy_slot_names:
        type: list
        elements: str
        description: >-
          The demo slots the broker may drive, each a string of digits and
          nothing else. The sudoers boundary grants the broker, for each slot,
          exactly one reset, and a start, a stop and an email-batches check for
          each of the two colours, as literal lines. Must match the slot table
          of the wrapper on the host.
        default: ['0', '1', '2', '3', '4', '5', '6']
      broker_deploy_wrapper_path:
        type: path
        description: Absolute path of the slot wrapper the broker may run as root.
        default: /usr/local/sbin/branchleft-slot
      broker_deploy_image_stage_dir:
        type: path
        description: >-
          Directory the broker stages a demo image in, as image.tar. It is
          the one file the load grant names, and the broker's image temporary
          directory setting.
        default: /var/lib/branchleft-broker/image-tmp
      broker_deploy_owner_due_diligence_email:
        type: str
        no_log: true
        description: >-
          The owner's address, which the broker adds to every demo as a reader and
          which the broker refuses to start without (OWNER_DUE_DILIGENCE_EMAIL in the
          broker's environment file). It is an input the owner places on the host, never
          a value in this repository. Empty until it is placed; while a release is
          carried, an empty value, or one that is not a plain address, refuses the run
          before anything is written. The value is never printed. It is not required and has
          no default: the host inputs loader sets it, and an absent value is refused here.
      broker_deploy_sudoers_path:
        type: path
        description: Where the sudoers grant is installed, a file under /etc/sudoers.d.
        default: /etc/sudoers.d/branchleft-slot
