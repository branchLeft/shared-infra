---
argument_specs:
  main:
    short_description: Install the broker's Node, pinned CI release, state, key, environment file and unit, and run the broker
    description: >-
      Pins the Node runtime the broker runs on, unpacks one pinned release of
      the broker's bundle (built and attested by the broker's release workflow,
      carried in the role) and points the current link at it, creates the
      broker account and its state directories, installs the public half of the
      request-signing key and the environment file, installs the broker's
      systemd unit, enables and starts it, restarts it when the release, the
      key, the environment file or the unit changed, and waits for the broker's
      status answer. It also installs the sudoers boundary that lets the broker
      run the slot wrapper as root for a fixed list of invocations. The slot
      wrapper itself is not installed here.
    author: branchLeft
    options:
      broker_deploy_release_version:
        type: str
        description: >-
          The broker release to run, as MAJOR.MINOR.PATCH. It names the release
          directory under the releases directory and the tarball
          broker-bundle-VERSION.tar.gz in the release directory of the role. A
          release directory that already holds its entry point is not unpacked
          again.
        default: '0.1.0'
      broker_deploy_release_pins:
        type: dict
        description: >-
          The sha256 of each release tarball, as 64 lower-case hex digits, by
          version. The role refuses, before it writes anything, a tarball that
          is not the one pinned for its version. A digest is not a secret.
        default:
          '0.1.0': '6410ecb830f6dd01ff46a459aa3e352e613b241378a4dc24f17f4bd50c4fc864'
      broker_deploy_release_dir:
        type: path
        description: >-
          Directory on the machine that runs the role that holds the release
          tarballs. Nothing is fetched from the network.
        default: '{{ role_path }}/files/releases'
      broker_deploy_verify_key_src:
        type: path
        required: true
        description: >-
          Path on the controller of the 32-byte public half of the broker's
          request-signing key. The private half never leaves the owner's
          workstation and is not an input to this role.
      broker_deploy_node_version:
        type: str
        description: The Node version the broker runs, as it appears in the download path.
        default: v26.5.0
      broker_deploy_node_arch:
        type: str
        choices: [x64, arm64]
        description: The Node architecture of the target host.
        default: x64
      broker_deploy_slot_names:
        type: list
        elements: str
        description: >-
          The demo slots the broker may drive, each a string of digits and
          nothing else. The sudoers boundary grants the broker, for each slot,
          exactly one reset, and a start, a stop and an email-batches check for
          each of the two colours, as literal lines. Must match the slot table
          of the wrapper on the host.
        default: ['0', '1', '2', '3', '4', '5', '6']
      broker_deploy_wrapper_path:
        type: path
        description: Absolute path of the slot wrapper the broker may run as root.
        default: /usr/local/sbin/branchleft-slot
      broker_deploy_image_stage_dir:
        type: path
        description: >-
          Directory the broker stages a demo image in, as image.tar. It is
          the one file the load grant names, and the broker's image temporary
          directory setting.
        default: /var/lib/branchleft-broker/image-tmp
      broker_deploy_sudoers_path:
        type: path
        description: Where the sudoers grant is installed, a file under /etc/sudoers.d.
        default: /etc/sudoers.d/branchleft-slot
