---
broker_deploy_node_version: v26.5.0
broker_deploy_node_arch: x64
# The published SHA-256 of each Node tarball, from the SHASUMS256.txt that
# nodejs.org publishes for v26.5.0. A download is refused by get_url unless it
# matches; the pattern's own check refuses an entry that is not pinned.
broker_deploy_node_checksums:
  x64: 'sha256:9f619528f1db5ddc41dccf54211066fb42228d69a156733c69cb9d6cc92e358c'
  arm64: 'sha256:036df0b49662ebb350eb56f1cac603699b1e9ed1e2603ee129fefda473479030'
broker_deploy_node_base_url: https://nodejs.org/dist
broker_deploy_base_dir: /opt/branchleft/broker
broker_deploy_releases_dir: /opt/branchleft/broker/releases
broker_deploy_current_link: /opt/branchleft/broker/current
broker_deploy_node_dir: /opt/branchleft/broker/node
broker_deploy_state_dir: /var/lib/branchleft
broker_deploy_slots_dir: /var/lib/branchleft/broker-slots
broker_deploy_admin_keys_dir: /var/lib/branchleft/broker-slots/admin-keys
broker_deploy_slots_file: /var/lib/branchleft/broker-slots/slots.json
broker_deploy_config_dir: /etc/branchleft
broker_deploy_env_file: /etc/branchleft/broker.env
broker_deploy_verify_key: /etc/branchleft/broker-verify-key.bin
broker_deploy_unit_path: /etc/systemd/system/branchleft-broker.service
broker_deploy_user: broker
broker_deploy_user_home: /var/lib/branchleft-broker
# The sudoers boundary: the broker may run the slot wrapper as root for exactly
# the invocations the template lists, one per slot name below, and no other.
# The slot names are a host-build parameter and must match the wrapper's slot
# table. Each is a bare digit string, written out as a literal grant.
broker_deploy_slot_names: ['0', '1', '2', '3', '4', '5', '6']
broker_deploy_wrapper_path: /usr/local/sbin/branchleft-slot
broker_deploy_image_stage_dir: /var/lib/branchleft-broker/image-tmp
broker_deploy_sudoers_path: /etc/sudoers.d/branchleft-slot
