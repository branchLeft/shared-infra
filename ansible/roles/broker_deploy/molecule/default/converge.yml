---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    broker_deploy_release: test-release-1
    # Stand-ins for the owner-built bundle and the owner's public key, both
    # in this scenario's files directory. Neither is a real broker artefact.
    broker_deploy_bundle_src: '{{ playbook_dir }}/files/bundle'
    broker_deploy_verify_key_src: '{{ playbook_dir }}/files/verify-key-stand-in.bin'
  tasks:
    - name: Apply the role
      ansible.builtin.include_role:
        # Molecule links the role under its namespace and name, the namespace
        # from galaxy_info in meta/main.yml.
        name: branchleft.broker_deploy
