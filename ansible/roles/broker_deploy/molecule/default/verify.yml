---
# What the role must leave on the host, read back from the instance. The unit
# and the bundle sources are read from the role's own files, on the machine
# that runs the test, so a copy in the role that differs from its source is a
# failure. Nothing here starts the broker: the unit must be loaded and disabled.
- name: Verify the instance
  hosts: all
  gather_facts: false
  vars:
    verify_unit_source: '{{ playbook_dir }}/../../files/branchleft-broker.service'
    verify_key_source: '{{ playbook_dir }}/files/verify-key-stand-in.bin'
    verify_node: /opt/branchleft/broker/node/bin/node
    verify_release: /opt/branchleft/broker/releases/test-release-1
    # The seven legal invocations of a slot in 0 to 6, and the one load.
    verify_grant_line_pattern: >-
      ^broker ALL=\(root\) NOPASSWD: /usr/local/sbin/branchleft-slot
      ([0-6] (reset|[ab] (start|stop|email-batches))|load
      /var/lib/branchleft-broker/image-tmp/image\.tar)\Z
    verify_sudoers_dir_allowed:
      - /etc/sudoers.d/README
      - /etc/sudoers.d/branchleft-slot
  tasks:
    - name: Read the Node binary
      ansible.builtin.stat:
        path: '{{ verify_node }}'
      register: broker_deploy_verify_node

    - name: Ask the Node binary its version
      ansible.builtin.command:
        argv:
          - '{{ verify_node }}'
          - --version
      register: broker_deploy_verify_node_version
      changed_when: false

    - name: Assert the pinned Node version is installed and executable
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_node.stat.exists
          - broker_deploy_verify_node.stat.mode == '0755'
          - broker_deploy_verify_node_version.stdout == 'v26.5.0'
        quiet: true
        fail_msg: The Node binary is missing, not 0755, or is not v26.5.0.

    - name: Read the broker account
      ansible.builtin.getent:
        database: passwd
        key: broker
      register: broker_deploy_verify_user

    - name: Assert the broker account is a system account with no login shell
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_user.ansible_facts.getent_passwd['broker'][5] == '/usr/sbin/nologin'
          - broker_deploy_verify_user.ansible_facts.getent_passwd['broker'][0] == 'x'
        quiet: true
        fail_msg: The broker account is missing or has a login shell.

    - name: Read the directories the runbook creates
      ansible.builtin.stat:
        path: '{{ item.path }}'
      loop:
        - { path: /etc/branchleft, owner: root, mode: '0755' }
        - { path: /var/lib/branchleft, owner: root, mode: '0755' }
        - { path: /var/lib/branchleft/broker-slots, owner: broker, mode: '0755' }
        - { path: /var/lib/branchleft/broker-slots/admin-keys, owner: broker, mode: '0700' }
      register: broker_deploy_verify_dirs
      loop_control:
        label: '{{ item.path }}'

    - name: Assert each directory is a directory with the runbook's owner and mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.pw_name == item.item.owner
          - item.stat.mode == item.item.mode
        quiet: true
        fail_msg: '{{ item.item.path }} is not a directory owned by {{ item.item.owner }} with mode {{ item.item.mode }}.'
      loop: '{{ broker_deploy_verify_dirs.results }}'
      loop_control:
        label: '{{ item.item.path }}'

    - name: Read the release and the current link
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '{{ verify_release }}/broker.mjs'
        - /opt/branchleft/broker/current
      register: broker_deploy_verify_release

    - name: Assert the current link points at the release, and the bundle is in it
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_release.results[0].stat.exists
          - broker_deploy_verify_release.results[0].stat.isreg
          - broker_deploy_verify_release.results[0].stat.pw_name == 'root'
          - broker_deploy_verify_release.results[1].stat.islnk
          - broker_deploy_verify_release.results[1].stat.lnk_source == verify_release
        quiet: true
        fail_msg: The current link does not point at the release, or the bundle is not in it.

    - name: Read the verify key on the instance
      ansible.builtin.stat:
        path: /etc/branchleft/broker-verify-key.bin
        checksum_algorithm: sha256
      register: broker_deploy_verify_key_installed

    - name: Read the verify key's source on the machine that runs the test
      ansible.builtin.stat:
        path: '{{ verify_key_source }}'
        checksum_algorithm: sha256
      register: broker_deploy_verify_key_source
      delegate_to: localhost

    - name: Assert the verify key is owned root:broker, mode 0640, and is the source byte for byte
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_key_installed.stat.exists
          - broker_deploy_verify_key_installed.stat.pw_name == 'root'
          - broker_deploy_verify_key_installed.stat.gr_name == 'broker'
          - broker_deploy_verify_key_installed.stat.mode == '0640'
          - broker_deploy_verify_key_installed.stat.checksum == broker_deploy_verify_key_source.stat.checksum
        quiet: true
        fail_msg: The verify key is not root:broker 0640 or differs from its source.

    - name: Read the environment file on the instance
      ansible.builtin.slurp:
        src: /etc/branchleft/broker.env
      register: broker_deploy_verify_env
      no_log: true

    - name: Read the environment file's mode and owner
      ansible.builtin.stat:
        path: /etc/branchleft/broker.env
      register: broker_deploy_verify_env_stat

    # The file holds the shipped template and no secret, so a failure may name
    # the line. Only the slots file line and the absence of LISTEN_HOST are
    # checked, not the whole text: the template's other lines are the source's.
    - name: Assert the environment file is root:root 0600, names the slots file, and leaves LISTEN_HOST unset
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_env_stat.stat.pw_name == 'root'
          - broker_deploy_verify_env_stat.stat.gr_name == 'root'
          - broker_deploy_verify_env_stat.stat.mode == '0600'
          - "'BROKER_SLOTS_FILE=/var/lib/branchleft/broker-slots/slots.json' in (broker_deploy_verify_env.content | b64decode).splitlines()"
          - "(broker_deploy_verify_env.content | b64decode).splitlines() | select('match', '^\\s*LISTEN_HOST\\s*=') | list | length == 0"
        quiet: true
        fail_msg: The environment file is not root:root 0600, does not name the slots file, or sets LISTEN_HOST.
      no_log: true

    - name: Read the unit on the instance, and its source in the role's files
      ansible.builtin.stat:
        path: /etc/systemd/system/branchleft-broker.service
        checksum_algorithm: sha256
      register: broker_deploy_verify_unit

    - name: Read the unit's source on the machine that runs the test
      ansible.builtin.stat:
        path: '{{ verify_unit_source }}'
        checksum_algorithm: sha256
      register: broker_deploy_verify_unit_source
      delegate_to: localhost

    - name: Assert the unit is root:root 0644 and is its source byte for byte
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_unit.stat.exists
          - broker_deploy_verify_unit.stat.pw_name == 'root'
          - broker_deploy_verify_unit.stat.mode == '0644'
          - broker_deploy_verify_unit.stat.checksum == broker_deploy_verify_unit_source.stat.checksum
        quiet: true
        fail_msg: The unit is not root:root 0644 or differs from its source.

    # Installed and loaded, not started, not enabled: the owner's ruling starts it.
    - name: Ask systemd for the broker unit
      ansible.builtin.systemd_service:
        name: branchleft-broker.service
      register: broker_deploy_verify_service

    - name: Assert systemd loads the broker unit and holds it stopped and disabled
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_service.status.LoadState == 'loaded'
          - broker_deploy_verify_service.status.UnitFileState == 'disabled'
          - broker_deploy_verify_service.status.ActiveState == 'inactive'
        quiet: true
        fail_msg: >-
          systemd does not hold the unit as loaded, disabled and inactive:
          LoadState {{ broker_deploy_verify_service.status.LoadState }},
          UnitFileState {{ broker_deploy_verify_service.status.UnitFileState }},
          ActiveState {{ broker_deploy_verify_service.status.ActiveState }}.

    # The sudoers boundary. The grant is exactly the 50 literal lines the slot
    # table gives (7 slots x 7 invocations, and one load), root-owned 0440, and
    # visudo accepts the file as it stands.
    - name: Read the sudoers grant on the instance
      ansible.builtin.stat:
        path: /etc/sudoers.d/branchleft-slot
        checksum_algorithm: sha256
      register: broker_deploy_verify_sudoers

    - name: Read the sudoers grant's text
      ansible.builtin.slurp:
        src: /etc/sudoers.d/branchleft-slot
      register: broker_deploy_verify_sudoers_text

    - name: Check the sudoers grant with visudo, strictly
      ansible.builtin.command:
        argv:
          - /usr/sbin/visudo
          - -csf
          - /etc/sudoers.d/branchleft-slot
      register: broker_deploy_verify_visudo
      changed_when: false
      failed_when: false

    - name: Ask sudo what the broker account may run
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - -l
          - -U
          - broker
      register: broker_deploy_verify_sudo_list
      changed_when: false
      failed_when: false

    - name: Assert the grant is root:root 0440 and visudo accepts it
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_sudoers.stat.exists
          - broker_deploy_verify_sudoers.stat.pw_name == 'root'
          - broker_deploy_verify_sudoers.stat.gr_name == 'root'
          - broker_deploy_verify_sudoers.stat.mode == '0440'
          - broker_deploy_verify_visudo.rc == 0
        quiet: true
        fail_msg: The sudoers grant is missing, is not root:root 0440, or visudo refuses it.

    # Distinct lines of the seven legal forms, a slot in 0 to 6, and nothing
    # else: with 50 of them all different, every legal line is there once.
    - name: Assert the grant is exactly the literal lines of the slot table, with no wildcard
      ansible.builtin.assert:
        that:
          - >-
            (broker_deploy_verify_sudoers_text.content | b64decode).splitlines()
            | select('match', '^[^#\s]') | list | length == 50
          - >-
            (broker_deploy_verify_sudoers_text.content | b64decode).splitlines()
            | select('match', '^[^#\s]') | unique | list | length == 50
          - >-
            (broker_deploy_verify_sudoers_text.content | b64decode).splitlines()
            | select('match', '^[^#\s]')
            | reject('match', verify_grant_line_pattern)
            | list | length == 0
        quiet: true
        fail_msg: The sudoers grant is not exactly the 50 literal invocation lines.

    - name: Assert sudo reports the broker may run one slot command and the one load, and not ALL
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_sudo_list.rc == 0
          - "'(root) NOPASSWD: /usr/local/sbin/branchleft-slot 3 b stop' in broker_deploy_verify_sudo_list.stdout"
          - "'/usr/local/sbin/branchleft-slot load /var/lib/branchleft-broker/image-tmp/image.tar' in broker_deploy_verify_sudo_list.stdout"
          - "'NOPASSWD: ALL' not in broker_deploy_verify_sudo_list.stdout"
        quiet: true
        fail_msg: sudo does not list the broker's slot commands, or lists an unrestricted grant.

    # The refusal. The role's own install task is run with a slot name that holds
    # a line break and a line that is not sudoers syntax, past the input check
    # that main.yml makes (so only the validate stands in the way). visudo must
    # refuse it, the install must stop there, and the grant on the instance must
    # be the one it was, with no temporary file left in the directory.
    - name: Try to install a grant that visudo refuses
      block:
        - name: Run the role's sudoers install with a slot name that breaks the file
          ansible.builtin.include_role:
            name: branchleft.broker_deploy
            tasks_from: _sudoers.yml
          vars:
            broker_deploy_slot_names:
              - "0\nthis line is not sudoers syntax"
        - name: Note that the install was not refused
          ansible.builtin.set_fact:
            broker_deploy_verify_refused: false
      rescue:
        - name: Note which task the install stopped at
          ansible.builtin.set_fact:
            broker_deploy_verify_refused: true
            broker_deploy_verify_refused_at: '{{ ansible_failed_task.name }}'
            broker_deploy_verify_refused_msg: '{{ ansible_failed_result.msg | default("") }}'

    - name: Read the grant again, and the sudoers directory
      ansible.builtin.stat:
        path: /etc/sudoers.d/branchleft-slot
        checksum_algorithm: sha256
      register: broker_deploy_verify_sudoers_after

    - name: List the files in the sudoers directory
      ansible.builtin.find:
        paths: /etc/sudoers.d
        file_type: any
        hidden: true
      register: broker_deploy_verify_sudoers_dir

    - name: Assert the broken grant was refused at the install, and the good one is untouched
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_refused
          - broker_deploy_verify_refused_at == 'Install the sudoers grant for the slot wrapper'
          - "'failed to validate' in broker_deploy_verify_refused_msg"
          - broker_deploy_verify_sudoers_after.stat.checksum == broker_deploy_verify_sudoers.stat.checksum
          - broker_deploy_verify_sudoers_dir.files | map(attribute='path') | difference(verify_sudoers_dir_allowed) | list | length == 0
        quiet: true
        fail_msg: >-
          Expected the role to stop at the sudoers install with visudo's refusal and leave the
          grant as it was. Refused: {{ broker_deploy_verify_refused }}, at
          {{ broker_deploy_verify_refused_at | default('nothing') }}.

    # The link control. The broker owns the slots directory above the admin keys
    # directory, so it can replace that directory with a link, and a file task that
    # followed the link would apply the broker's owner and mode 0700 to whatever it
    # points at, as root. The directory step is run alone. First against the real
    # directory, which it must accept (so a step that refused everything fails
    # here), then against a link to a root directory of mode 0711 that no step of
    # the role creates: it must refuse, and leave the target as it found it. The
    # directory is put back in every outcome, as the role leaves it.
    - name: Run the directory step against the real directory, which it must accept
      ansible.builtin.include_role:
        name: branchleft.broker_deploy
        tasks_from: _admin_keys_dir.yml

    - name: Prove a link in place of the admin keys directory is refused and its target left alone
      block:
        - name: Make the directory the link will point at, with a mode the role never gives a directory
          ansible.builtin.file:
            path: /var/tmp/broker-link-target
            state: directory
            owner: root
            group: root
            mode: '0711'
          changed_when: false

        - name: Take the real directory away and plant the link in its place
          ansible.builtin.file:
            path: /var/lib/branchleft/broker-slots/admin-keys
            state: absent
          changed_when: false

        - name: Plant the link
          ansible.builtin.file:
            src: /var/tmp/broker-link-target
            dest: /var/lib/branchleft/broker-slots/admin-keys
            state: link
          changed_when: false

        - name: Run the directory step against the link
          ansible.builtin.include_role:
            name: branchleft.broker_deploy
            tasks_from: _admin_keys_dir.yml

        - name: Note that the link was accepted
          ansible.builtin.set_fact:
            broker_deploy_verify_link_refused: false
      rescue:
        - name: Note that the link was refused, and by what
          ansible.builtin.set_fact:
            broker_deploy_verify_link_refused: true
            broker_deploy_verify_link_msg: '{{ ansible_failed_result.msg | default("") }}'
      always:
        - name: Look at the link's target after the step
          ansible.builtin.stat:
            path: /var/tmp/broker-link-target
            follow: false
          register: broker_deploy_verify_link_target

        - name: Take the link away
          ansible.builtin.file:
            path: /var/lib/branchleft/broker-slots/admin-keys
            state: absent
          changed_when: false

        - name: Put the real directory back, as the role leaves it
          ansible.builtin.file:
            path: /var/lib/branchleft/broker-slots/admin-keys
            state: directory
            owner: broker
            group: broker
            mode: '0700'
          changed_when: false

        - name: Remove the target of the link
          ansible.builtin.file:
            path: /var/tmp/broker-link-target
            state: absent
          changed_when: false

    - name: Assert the link was refused by the role's own check, and its target is still root's mode 0711
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_link_refused
          - "'is a link or is not a directory' in broker_deploy_verify_link_msg"
          - "'/var/lib/branchleft/broker-slots/admin-keys' in broker_deploy_verify_link_msg"
          - broker_deploy_verify_link_target.stat.pw_name == 'root'
          - broker_deploy_verify_link_target.stat.gr_name == 'root'
          - broker_deploy_verify_link_target.stat.mode == '0711'
        quiet: true
        fail_msg: >-
          Expected the directory step to refuse a link in place of the admin keys directory with its
          own message and to leave the link's target as it found it. Refused:
          {{ broker_deploy_verify_link_refused | default('not recorded') }}, message
          {{ broker_deploy_verify_link_msg | default('none') }}.

    # The other half of the same refusal: something that is not a directory and not a
    # link. A regular file is the case the link test alone would let through to the
    # file module, which refuses it too, with a message of its own ("already exists as
    # a file"), so the case matches the role's own words and the path. The directory
    # is taken away, the file put in its place, and in every outcome the file is
    # removed before the directory is put back, as the role leaves it.
    - name: Prove a regular file in place of the admin keys directory is refused by the role's own check
      block:
        - name: Take the real directory away
          ansible.builtin.file:
            path: /var/lib/branchleft/broker-slots/admin-keys
            state: absent
          changed_when: false

        - name: Put a regular file in its place
          ansible.builtin.copy:
            content: ''
            dest: /var/lib/branchleft/broker-slots/admin-keys
            owner: root
            group: root
            mode: '0644'
          changed_when: false

        - name: Run the directory step against the file
          ansible.builtin.include_role:
            name: branchleft.broker_deploy
            tasks_from: _admin_keys_dir.yml

        - name: Note that the file was accepted
          ansible.builtin.set_fact:
            broker_deploy_verify_file_refused: false
      rescue:
        - name: Note that the file was refused, and by what
          ansible.builtin.set_fact:
            broker_deploy_verify_file_refused: true
            broker_deploy_verify_file_msg: '{{ ansible_failed_result.msg | default("") }}'
      always:
        - name: Look at the file after the step
          ansible.builtin.stat:
            path: /var/lib/branchleft/broker-slots/admin-keys
            follow: false
          register: broker_deploy_verify_file_after

        - name: Take the file away
          ansible.builtin.file:
            path: /var/lib/branchleft/broker-slots/admin-keys
            state: absent
          changed_when: false

        - name: Put the real directory back, as the role leaves it
          ansible.builtin.file:
            path: /var/lib/branchleft/broker-slots/admin-keys
            state: directory
            owner: broker
            group: broker
            mode: '0700'
          changed_when: false

    - name: Assert the file was refused by the role's own check, and is still the file it was
      ansible.builtin.assert:
        that:
          - broker_deploy_verify_file_refused
          - "'is a link or is not a directory' in broker_deploy_verify_file_msg"
          - "'/var/lib/branchleft/broker-slots/admin-keys' in broker_deploy_verify_file_msg"
          - broker_deploy_verify_file_after.stat.isreg
          - broker_deploy_verify_file_after.stat.pw_name == 'root'
          - broker_deploy_verify_file_after.stat.mode == '0644'
        quiet: true
        fail_msg: >-
          Expected the directory step to refuse a regular file in place of the admin keys directory with
          its own message and to leave the file as it found it. Refused:
          {{ broker_deploy_verify_file_refused | default('not recorded') }}, message
          {{ broker_deploy_verify_file_msg | default('none') }}.
