---
# Internal to the role: the pinned release goes into a directory of its own under releases/
# and the current link is swapped to it, never a write into the directory the link points
# at. The files were held to their pins by _release_pin.yml before the role wrote anything.
# Root-owned, directories 0755 and files 0644.
- name: Create the directory of this release
  ansible.builtin.file:
    path: '{{ broker_deploy_releases_dir }}/{{ broker_deploy_release_version }}'
    state: directory
    owner: '{{ broker_deploy_release_owner }}'
    group: '{{ broker_deploy_release_group }}'
    mode: '0755'

# Each pinned file is copied by name, so a byte that changed on the host is put back and a file
# on the host that is not in the release is left alone. The plan's diff is hidden (ANS-16) for
# the files the plan-diff scan matches, and shown for the rest: the lists below are held to the
# pins by a contract test, so a file added to a release is named in one of them. The pinned
# digests, not the diff, say what is delivered.
- name: Create the plugins directory of this release
  ansible.builtin.file:
    path: '{{ broker_deploy_releases_dir }}/{{ broker_deploy_release_version }}/plugins'
    state: directory
    owner: '{{ broker_deploy_release_owner }}'
    group: '{{ broker_deploy_release_group }}'
    mode: '0755'

- name: Deliver the pinned release files that hold a secret-like line
  ansible.builtin.copy:
    src: '{{ broker_deploy_release_dir }}/{{ broker_deploy_release_version }}/{{ item }}'
    dest: '{{ broker_deploy_releases_dir }}/{{ broker_deploy_release_version }}/{{ item }}'
    owner: '{{ broker_deploy_release_owner }}'
    group: '{{ broker_deploy_release_group }}'
    mode: '0644'
  loop:
    - broker.mjs
    - plugins/dockerImageLoader.mjs
    - plugins/ghostAdminApi.mjs
    - plugins/renderCorePlugin.mjs
  diff: false
  register: broker_deploy_release_copy

- name: Deliver the pinned release files with no secret-like line
  ansible.builtin.copy:
    src: '{{ broker_deploy_release_dir }}/{{ broker_deploy_release_version }}/{{ item }}'
    dest: '{{ broker_deploy_releases_dir }}/{{ broker_deploy_release_version }}/{{ item }}'
    owner: '{{ broker_deploy_release_owner }}'
    group: '{{ broker_deploy_release_group }}'
    mode: '0644'
  loop:
    - plugins/refusingDrainSource.mjs
  register: broker_deploy_release_copy_visible

- name: Point the current link at the release
  ansible.builtin.file:
    src: '{{ broker_deploy_releases_dir }}/{{ broker_deploy_release_version }}'
    dest: '{{ broker_deploy_current_link }}'
    state: link
    force: true
  register: broker_deploy_link_result
