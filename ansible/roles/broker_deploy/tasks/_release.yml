---
# Internal to the role: the pinned release goes into a new directory under releases/ and
# the current link is swapped to it, never an unpack over the link's target. The tarball
# was held to its pin by _release_pin.yml before the role wrote anything. The members are
# the bundle's files with no leading directory, root-owned, directories 0755 and files 0644.
- name: Create the directory of this release
  ansible.builtin.file:
    path: '{{ broker_deploy_releases_dir }}/{{ broker_deploy_release_version }}'
    state: directory
    owner: '{{ broker_deploy_release_owner }}'
    group: '{{ broker_deploy_release_group }}'
    mode: '0755'

- name: Look for the entry point of this release
  ansible.builtin.stat:
    path: '{{ broker_deploy_releases_dir }}/{{ broker_deploy_release_version }}/broker.mjs'
    follow: false
  register: broker_deploy_release_entry

# A release directory that already holds its entry point is not unpacked again: a release
# is never replaced, and the unpack reports a change only the one time it happens. Skipped
# in check mode (ANS-10), for a reason of the module and not of the role: unarchive needs
# its destination to exist even under --check, and on a fresh host the directory above is
# only reported as to be made. The report task below shows the unpack in a plan instead.
- name: Unpack the pinned release tarball into its directory
  ansible.builtin.unarchive:
    src: '{{ broker_deploy_release_dir }}/broker-bundle-{{ broker_deploy_release_version }}.tar.gz'
    dest: '{{ broker_deploy_releases_dir }}/{{ broker_deploy_release_version }}'
    owner: '{{ broker_deploy_release_owner }}'
    group: '{{ broker_deploy_release_group }}'
    extra_opts:
      - --no-same-owner
    creates: '{{ broker_deploy_releases_dir }}/{{ broker_deploy_release_version }}/broker.mjs'
  register: broker_deploy_unpacked
  when: not ansible_check_mode

# In check mode nothing is unpacked, so a plan reports it here when the entry point is not
# yet on the host. The task runs true, which changes nothing.
- name: Report in check mode that the pinned release would be unpacked
  ansible.builtin.command:
    argv:
      - 'true'
  register: broker_deploy_unpack_report
  changed_when: true
  check_mode: false
  when: ansible_check_mode and not broker_deploy_release_entry.stat.exists

- name: Point the current link at the release
  ansible.builtin.file:
    src: '{{ broker_deploy_releases_dir }}/{{ broker_deploy_release_version }}'
    dest: '{{ broker_deploy_current_link }}'
    state: link
    force: true
  register: broker_deploy_link_result
