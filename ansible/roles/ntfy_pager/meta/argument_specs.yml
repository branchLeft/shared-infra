---
argument_specs:
  main:
    short_description: Write the ntfy pager credentials and deliver the Alertmanager renderer
    description: >-
      Creates the monitoring secrets file closed to root when it is absent, writes
      the four NTFY_ credential lines into it, each under its own key and the
      others left in place, and copies the Alertmanager renderer into the project
      directory. The four credentials arrive as values from the caller; the role
      never reads or generates one. It restarts nothing, delivers none of the
      stack's eight other files and removes nothing from the host: the
      monitoring_stack role, which runs after this one, restarts the monitoring
      unit when this role's file or credentials changed.
    author: branchLeft
    options:
      ntfy_pager_project_dir:
        type: str
        description: >-
          Absolute path of the stack's project directory. It must equal the
          WorkingDirectory the shared Compose unit template derives from the
          instance name, which is /opt/branchleft/monitoring.
        default: /opt/branchleft/monitoring
      ntfy_pager_env_file:
        type: str
        description: >-
          Absolute path of the monitoring secrets file. The role creates it, closed
          to root:root 0600, when it is absent, and adds or replaces the NTFY_ lines
          in it. monitoring_stack creates the same file the same way.
        default: /etc/branchleft/monitoring.env
      ntfy_pager_pager_token:
        type: str
        required: true
        no_log: true
        description: The access token of the pager topic, the value of NTFY_PAGER_TOKEN. Supplied by the caller; no default.
      ntfy_pager_watcher_token:
        type: str
        required: true
        no_log: true
        description: The access token of the release watcher, the value of NTFY_WATCHER_TOKEN. Supplied by the caller; no default.
      ntfy_pager_owner_password_hash:
        type: str
        required: true
        no_log: true
        description: The password hash of the ntfy owner account, the value of NTFY_OWNER_PASSWORD_HASH. Supplied by the caller; no default.
      ntfy_pager_machine_password_hash:
        type: str
        required: true
        no_log: true
        description: The password hash of the ntfy machine account, the value of NTFY_MACHINE_PASSWORD_HASH. Supplied by the caller; no default.
