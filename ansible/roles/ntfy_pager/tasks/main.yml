---
# Section 2 of the runbook: the four NTFY_ lines go into the monitoring secrets
# file. The runbook wrote them with grep -v and a mv of a temporary file; here
# each key is one lineinfile, so the other keys in the file are left in place.
# The file is closed to root before any value is written, so the write never
# happens in a wider mode.
#
# This role runs before monitoring_stack (see the README, "Order"), so on a fresh
# host it is the one that creates the directory and the file. monitoring_stack
# creates them with the same owner, group and mode, so the second role to run
# finds them and changes nothing.
- name: Create the directory of the monitoring secrets file
  ansible.builtin.file:
    path: '{{ ntfy_pager_env_file | dirname }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Look at the monitoring secrets file
  ansible.builtin.stat:
    path: '{{ ntfy_pager_env_file }}'
  register: ntfy_pager_env_stat

# The file's owner and mode are set in the same task that creates it (ANS-16),
# and the times are preserved, so a second run changes nothing.
- name: Create the monitoring secrets file closed to root before any value is written
  ansible.builtin.file:
    path: '{{ ntfy_pager_env_file }}'
    state: touch
    owner: root
    group: root
    mode: '0600'
    access_time: preserve
    modification_time: preserve

# One lineinfile per key. The regexp matches the key at the start of a line, so
# a second run finds the line it wrote and changes nothing. The line is built
# from the key and the caller's value, and both are secrets, so no_log hides the
# task from the log, and diff is off so no value is shown. Nothing here notifies
# a restart: monitoring_stack decides that, from a fingerprint that covers this
# file, on its next run.
#
# In check mode the file is not created, so the task runs only when it exists.
- name: Write the four NTFY_ lines into the monitoring secrets file
  ansible.builtin.lineinfile:
    path: '{{ ntfy_pager_env_file }}'
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    create: false
  loop:
    - key: '{{ ntfy_pager_env_names.pager_token }}'
      value: '{{ ntfy_pager_pager_token }}'
    - key: '{{ ntfy_pager_env_names.watcher_token }}'
      value: '{{ ntfy_pager_watcher_token }}'
    - key: '{{ ntfy_pager_env_names.owner_password_hash }}'
      value: '{{ ntfy_pager_owner_password_hash }}'
    - key: '{{ ntfy_pager_env_names.machine_password_hash }}'
      value: '{{ ntfy_pager_machine_password_hash }}'
  loop_control:
    label: '{{ item.key }}'
  no_log: true
  diff: false
  when: not ansible_check_mode or ntfy_pager_env_stat.stat.exists

# Section 3 of the runbook, reduced to the one file this role owns. The project
# directory is also created by monitoring_stack, with the same owner, group and
# mode. The stack's subdirectories and its eight other files are
# monitoring_stack's alone.
- name: Create the project directory
  ansible.builtin.file:
    path: '{{ ntfy_pager_project_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

# Copied, not templated. The renderer is read by the unit's ExecStartPre, so a
# changed renderer reaches the unit when monitoring_stack next restarts it: the
# renderer is part of that role's fingerprint.
- name: Deliver the renderer
  ansible.builtin.copy:
    src: 'stack/{{ item }}'
    dest: '{{ ntfy_pager_project_dir }}/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ ntfy_pager_files }}'
