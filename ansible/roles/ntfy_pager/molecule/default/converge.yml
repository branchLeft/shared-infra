---
# The four values are fixed test sentinels, not credentials. They are literals so
# that a second converge produces the same lines and reports no change.
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    ntfy_pager_pager_token: test-sentinel-pager-token-0001
    ntfy_pager_watcher_token: test-sentinel-watcher-token-0002
    ntfy_pager_owner_password_hash: test-sentinel-owner-hash-0003
    ntfy_pager_machine_password_hash: test-sentinel-machine-hash-0004
  tasks:
    - name: Apply the role
      ansible.builtin.include_role:
        # Molecule links the role under its namespace and name, the namespace
        # from galaxy_info in meta/main.yml.
        name: branchleft.ntfy_pager
