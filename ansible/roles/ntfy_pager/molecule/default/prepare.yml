---
# Test scaffolding, not role tasks. Three things the host has before the role
# runs: the shared Compose unit template (a placeholder here, the real one is
# part of the host baseline), the monitoring secrets file with an earlier NTFY_
# line and a key the role must leave alone, and the directory that holds it.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install a placeholder for the shared Compose unit template
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=PLACEHOLDER Compose stack %i
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true
        dest: /etc/systemd/system/branchleft-compose@.service
        owner: root
        group: root
        mode: '0644'

    - name: Make systemd read the placeholder
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Create the directory of the monitoring secrets file
      ansible.builtin.file:
        path: /etc/branchleft
        state: directory
        owner: root
        group: root
        mode: '0755'

    # An earlier release of the file: an old pager token, a key the role does
    # not own, and a mode wider than the role sets. The values are fixed test
    # strings, not credentials.
    - name: Write the earlier monitoring secrets file
      ansible.builtin.copy:
        content: |
          GRAFANA_ADMIN_PASSWORD=test-keep-me
          NTFY_PAGER_TOKEN=test-earlier-value
        dest: /etc/branchleft/monitoring.env
        owner: root
        group: root
        mode: '0644'

    - name: Create the project directory the stack is delivered to
      ansible.builtin.file:
        path: /opt/branchleft/monitoring
        state: directory
        owner: root
        group: root
        mode: '0755'
