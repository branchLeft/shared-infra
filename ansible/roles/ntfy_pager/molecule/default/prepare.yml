---
# Test scaffolding, not role tasks. The host has, before the role runs, the
# pager secrets file with an earlier NTFY_ line and a key the role must leave
# alone, the monitoring secrets file that monitoring_stack writes (which this
# role must never touch), and the directory that holds both. The role touches no
# unit any more, so no unit template is installed here.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Create the directory of the secrets files
      ansible.builtin.file:
        path: /etc/branchleft
        state: directory
        owner: root
        group: root
        mode: '0755'

    # An earlier release of the file: an old pager token, a key the role does
    # not own, and a mode wider than the role sets. The values are fixed test
    # strings, not credentials. The branch of the role that creates the file on
    # a fresh host is therefore reviewed and not run here (README, "Named limits").
    - name: Write the earlier pager secrets file
      ansible.builtin.copy:
        content: |
          UNOWNED_KEY=test-keep-me
          NTFY_PAGER_TOKEN=test-earlier-value
        dest: /etc/branchleft/ntfy-pager.env
        owner: root
        group: root
        mode: '0644'

    # The other role's file, in a mode the role would change if it touched the
    # file at all (it sets 0600). It holds an old NTFY_ line on purpose: the
    # file of the pager is the only one the role writes NTFY_ lines into, so this
    # one must come out byte for byte as it went in.
    - name: Write the monitoring secrets file that monitoring_stack owns
      ansible.builtin.copy:
        content: |
          GRAFANA_ADMIN_PASSWORD=test-keep-me
          NTFY_PAGER_TOKEN=test-earlier-value-in-the-other-file
        dest: /etc/branchleft/monitoring.env
        owner: root
        group: root
        mode: '0644'
