---
# Test scaffolding, not role tasks. The host has, before the role runs, the
# monitoring secrets file with an earlier NTFY_ line and a key the role must
# leave alone, and the directory that holds it. The role touches no unit any
# more, so no unit template is installed here.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Create the directory of the monitoring secrets file
      ansible.builtin.file:
        path: /etc/branchleft
        state: directory
        owner: root
        group: root
        mode: '0755'

    # An earlier release of the file: an old pager token, a key the role does
    # not own, and a mode wider than the role sets. The values are fixed test
    # strings, not credentials. The branch of the role that creates the file on
    # a fresh host is therefore reviewed and not run here (README, "Named limits").
    - name: Write the earlier monitoring secrets file
      ansible.builtin.copy:
        content: |
          GRAFANA_ADMIN_PASSWORD=test-keep-me
          NTFY_PAGER_TOKEN=test-earlier-value
        dest: /etc/branchleft/monitoring.env
        owner: root
        group: root
        mode: '0644'
