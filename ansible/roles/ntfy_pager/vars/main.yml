---
# What the role carries. Constants of the stack, not inputs, so a caller cannot
# override them. The path is relative to the stack directory in the repository
# (files/stack, a link to hetzner/monitoring/stack).
#
# The renderer is the only stack file this role delivers: the unit's
# ExecStartPre runs it, and this role is its single delivery owner. The eight
# other files of the stack belong to monitoring_stack alone, and
# ansible/checks/test_monitoring_single_home.py fails if this list names one.
ntfy_pager_files:
  - render_alertmanager_config.py

# The four names the runbook writes into the monitoring secrets file. They are
# fixed here, so an input cannot rename a key the stack reads.
ntfy_pager_env_names:
  pager_token: NTFY_PAGER_TOKEN
  watcher_token: NTFY_WATCHER_TOKEN
  owner_password_hash: NTFY_OWNER_PASSWORD_HASH
  machine_password_hash: NTFY_MACHINE_PASSWORD_HASH
