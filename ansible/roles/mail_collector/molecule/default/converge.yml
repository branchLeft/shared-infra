---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Look at the files of other roles, and at the files the role did not write, before the role runs
      ansible.builtin.stat:
        path: '{{ item }}'
      loop: '{{ scenario_canaries + [scenario_foreign_file, scenario_stale_descriptor_file] }}'
      register: mail_collector_untouched_before

    # The owner's file is looked at without a checksum: a digest of a credential is a credential's
    # fingerprint in a log (ANS-16).
    - name: Look at the owner's credentials file before the role runs
      ansible.builtin.stat:
        path: '{{ scenario_credentials_file }}'
        get_checksum: false
      register: mail_collector_credentials_before

    - name: Apply the role with its inputs set
      ansible.builtin.include_role:
        name: branchleft.mail_collector
      vars:
        mail_collector_image: '{{ scenario_image }}'
        mail_collector_smtp_host: '{{ scenario_smtp_host }}'
        mail_collector_smtp_port: 465
        mail_collector_smtp_secure: true
        mail_collector_demo_mail_domain: demo.example
        mail_collector_hosts:
          - slug: host-one
            kind: tenant
            app_host_ip: 10.20.1.101
          - slug: host-two
            kind: demo
            app_host_ip: 10.20.1.100

    - name: Look at the same files after the role has run
      ansible.builtin.stat:
        path: '{{ item }}'
      loop: '{{ scenario_canaries + [scenario_foreign_file, scenario_stale_descriptor_file] }}'
      register: mail_collector_untouched_after

    - name: Look at the owner's credentials file after the role has run
      ansible.builtin.stat:
        path: '{{ scenario_credentials_file }}'
        get_checksum: false
      register: mail_collector_credentials_after

    # The role touches nothing outside its own paths, and neither the owner's file nor a file that is
    # a descriptor it did not write is its own. Each keeps its inode, mtime, mode, owner and checksum across the role's run; the
    # idempotence step runs this play again, so both runs are held to it.
    - name: Require the files the role does not own to be exactly as they were
      ansible.builtin.assert:
        that:
          - item.0.stat.exists
          - item.1.stat.inode == item.0.stat.inode
          - item.1.stat.mtime == item.0.stat.mtime
          - item.1.stat.mode == item.0.stat.mode
          - item.1.stat.pw_name == item.0.stat.pw_name
          - item.1.stat.checksum == item.0.stat.checksum
        quiet: true
        fail_msg: A file the role does not own was changed.
      loop: '{{ mail_collector_untouched_before.results | zip(mail_collector_untouched_after.results) | list }}'
      loop_control:
        label: '{{ item.0.item }}'

    - name: Require the owner's credentials file to be exactly as it was, still root's and 0600
      ansible.builtin.assert:
        that:
          - mail_collector_credentials_before.stat.exists
          - mail_collector_credentials_after.stat.inode == mail_collector_credentials_before.stat.inode
          - mail_collector_credentials_after.stat.mtime == mail_collector_credentials_before.stat.mtime
          - mail_collector_credentials_after.stat.mode == '0600'
          - mail_collector_credentials_after.stat.pw_name == 'root'
        quiet: true
        fail_msg: The owner's credentials file was changed.
