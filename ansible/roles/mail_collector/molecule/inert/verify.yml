---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Look at the files the role made, and the one it must not have
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop:
        - '{{ scenario_env_file }}'
        - '{{ scenario_unit }}'
        - '{{ scenario_unit_env_file }}'
        - '{{ scenario_state_dir }}'
        - '{{ scenario_descriptor_dir }}'
        - '{{ scenario_docker_args_file }}'
        - '{{ scenario_descriptor_file }}'
        - '{{ scenario_stale_descriptor_file }}'
        - '{{ scenario_foreign_file }}'
      register: mail_collector_v_stats

    - name: Require the unit to be installed, no settings to exist, docker never to have run and the hand-placed descriptors left
      ansible.builtin.assert:
        that:
          - not mail_collector_v_stats.results[0].stat.exists
          - mail_collector_v_stats.results[1].stat.exists
          - mail_collector_v_stats.results[2].stat.exists
          - mail_collector_v_stats.results[3].stat.isdir
          - mail_collector_v_stats.results[4].stat.isdir
          - not mail_collector_v_stats.results[5].stat.exists
          - mail_collector_v_stats.results[6].stat.exists
          - mail_collector_v_stats.results[7].stat.exists
          - mail_collector_v_stats.results[8].stat.exists
        quiet: true

    - name: Look at the unit's state
      ansible.builtin.systemd_service:
        name: mail-collector.service
      register: mail_collector_v_unit

    - name: Require the unit to be disabled and not running, though the credentials file is in place
      ansible.builtin.assert:
        that:
          - mail_collector_v_unit.status.UnitFileState != 'enabled'
          - mail_collector_v_unit.status.ActiveState != 'active'
        quiet: true
