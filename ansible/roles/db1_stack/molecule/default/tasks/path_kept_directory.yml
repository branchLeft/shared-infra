---
# A directory that holds anything is somebody's data, not Docker's stub. The
# role must refuse to remove it, and must leave what is in it alone. Requires
# kept_name (the entry inside the directory, relative to it) and kept_kind: file
# or directory. A dotfile and a subdirectory are the two entries a listing that
# skips hidden files, or lists only files, would miss.
- name: Remove the exporter file
  ansible.builtin.file:
    path: '{{ scenario_cnf_path }}'
    state: absent

- name: Create a directory in its place
  ansible.builtin.file:
    path: '{{ scenario_cnf_path }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Put a file inside the directory
  ansible.builtin.copy:
    content: PLACEHOLDER_SOMEBODYS_DATA
    dest: '{{ scenario_cnf_path }}/{{ kept_name }}'
    owner: root
    group: root
    mode: '0644'
  when: kept_kind == 'file'

- name: Put a directory inside the directory
  ansible.builtin.file:
    path: '{{ scenario_cnf_path }}/{{ kept_name }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: kept_kind == 'directory'

- name: Apply the role while the directory holds an entry
  ansible.builtin.include_tasks: refused.yml
  vars:
    refused_task: Refuse to remove a directory at the exporter file path that holds anything

- name: Look at the entry inside the directory
  ansible.builtin.stat:
    path: '{{ scenario_cnf_path }}/{{ kept_name }}'
  register: db1_stack_path_kept

- name: Assert the entry inside the directory is untouched
  ansible.builtin.assert:
    that:
      - db1_stack_path_kept.stat.exists
      - kept_kind == 'directory' or db1_stack_path_kept.stat.checksum == ('PLACEHOLDER_SOMEBODYS_DATA' | hash('sha1'))
      - kept_kind == 'file' or db1_stack_path_kept.stat.isdir
    quiet: true

- name: Remove the directory, as the message tells a person to
  ansible.builtin.file:
    path: '{{ scenario_cnf_path }}'
    state: absent

- name: Apply the role
  ansible.builtin.include_tasks: apply.yml

- name: Assert the exporter file is written
  ansible.builtin.include_tasks: assert_state.yml
  vars:
    state_password: '{{ verify_password }}'
