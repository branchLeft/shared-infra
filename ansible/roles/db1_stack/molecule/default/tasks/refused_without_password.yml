---
# Applies the role with no password at all and requires that Ansible's argument
# check stops it, before any task of the role runs. The expected task name is the
# check's own, built from the role's short description.
- name: Apply the role without a password
  block:
    - name: Apply the role
      ansible.builtin.include_role:
        name: branchleft.db1_stack
      vars:
        db1_stack_downloads: '{{ verify_downloads }}'
        db1_stack_debs: '{{ verify_debs }}'

    - name: Record that the role accepted the input
      ansible.builtin.set_fact:
        db1_stack_refused_by: 'NOTHING: the role accepted the input'
  rescue:
    - name: Record which task refused the input
      ansible.builtin.set_fact:
        db1_stack_refused_by: '{{ ansible_failed_task.name }}'
        db1_stack_refused_message: '{{ ansible_failed_result.msg | default("") }}'

- name: Assert the argument check stopped the role and named the password option
  ansible.builtin.assert:
    that:
      - db1_stack_refused_by == "Validating arguments against arg spec 'main' - " ~ verify_spec_short_description
      - "'db1_stack_exporter_password' in db1_stack_refused_message"
    fail_msg: 'Expected the argument check to stop the role; it stopped at "{{ db1_stack_refused_by }}".'
    quiet: true
