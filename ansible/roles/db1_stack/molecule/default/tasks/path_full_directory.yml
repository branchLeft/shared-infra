---
# A directory that holds anything is somebody's data, not Docker's stub. The
# role must refuse to remove it, and must leave what is in it alone.
- name: Remove the exporter file
  ansible.builtin.file:
    path: '{{ scenario_cnf_path }}'
    state: absent

- name: Create a directory in its place that holds a file
  ansible.builtin.file:
    path: '{{ scenario_cnf_path }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Put a file inside the directory
  ansible.builtin.copy:
    content: PLACEHOLDER_SOMEBODYS_DATA
    dest: '{{ scenario_cnf_path }}/PLACEHOLDER_KEEP'
    owner: root
    group: root
    mode: '0644'

- name: Apply the role while the directory holds a file
  ansible.builtin.include_tasks: refused.yml
  vars:
    refused_task: Refuse to remove a directory at the exporter file path that holds anything

- name: Look at the file inside the directory
  ansible.builtin.stat:
    path: '{{ scenario_cnf_path }}/PLACEHOLDER_KEEP'
  register: db1_stack_path_inner

- name: Assert the file inside the directory is untouched
  ansible.builtin.assert:
    that:
      - db1_stack_path_inner.stat.exists
      - db1_stack_path_inner.stat.checksum == ('PLACEHOLDER_SOMEBODYS_DATA' | hash('sha1'))
    quiet: true

- name: Remove the directory, as the message tells a person to
  ansible.builtin.file:
    path: '{{ scenario_cnf_path }}'
    state: absent

- name: Apply the role
  ansible.builtin.include_tasks: apply.yml

- name: Assert the exporter file is written
  ansible.builtin.include_tasks: assert_state.yml
  vars:
    state_password: '{{ verify_password }}'
