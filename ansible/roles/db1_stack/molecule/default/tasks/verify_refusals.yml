---
# Part two's refusals, imported by verify.yml after the source checks. Each one
# applies the role with a bad input and requires it to stop at the named task. They
# run the role several times, which is most of part two's run time, so they sit in
# their own file: the content, order and source checks can then be run without
# them.

# ----- The refusals -----

# Each form of the pin file the deploy program never writes is refused at the named
# task. The pin is checked in tasks/_compose.yml, after the packages, the drop-in
# removal, the exporter file and the compose file have been written, so a bad-pin run
# has changed the host before it stops. The case file restores a good pin after each
# case.
- name: Make the forms of the database image pin the role must refuse
  ansible.builtin.set_fact:
    db1_stack_verify_pin_cases:
      - name: absent
        absent: true
        task: Refuse a database image pin that is absent
      - name: empty
        content: ''
        task: Refuse a database image pin that is not one line of the form the deploy program writes
      - name: no IMAGE key
        content: "DATABASE=mysql:8.0.43@sha256:{{ scenario_image_digest }}\n"
        task: Refuse a database image pin that is not one line of the form the deploy program writes
      - name: two lines
        content: "IMAGE=mysql:8.0.43@sha256:{{ scenario_image_digest }}\nIMAGE=mysql:8.0.43@sha256:{{ scenario_image_digest }}\n"
        task: Refuse a database image pin that is not one line of the form the deploy program writes
      - name: tag only
        content: "IMAGE=mysql:8.0.43\n"
        task: Refuse a database image pin that is not one line of the form the deploy program writes
      - name: upper-case hex
        content: "IMAGE=mysql:8.0.43@sha256:{{ scenario_image_digest | upper }}\n"
        task: Refuse a database image pin that is not one line of the form the deploy program writes

- name: Refuse each form of the database image pin the deploy program does not write
  ansible.builtin.include_tasks: verify_pin_case.yml
  loop: '{{ db1_stack_verify_pin_cases }}'
  loop_control:
    loop_var: db1_stack_verify_case
    label: '{{ db1_stack_verify_case.name }}'

# The second compose file cases are in verify_compose_names.yml, the part
# refusals_compose, so that this part's shard runs only the image pin forms.

- name: Assert the database image pin is the good one after the refusals
  ansible.builtin.include_tasks: assert_pin_after_refusals.yml
