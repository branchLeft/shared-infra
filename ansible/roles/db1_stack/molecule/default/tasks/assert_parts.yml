---
# The cases are shared out between scenarios (verify_parts in verify.yml). A part that
# no scenario runs would be a set of cases nobody checks, and it would pass silently,
# so this fails first: the run is itself a listed part, and each listed part is a
# scenario directory beside this one that has a molecule.yml and a verify.yml and does
# not leave the verify step out. The files are read on the controller.
- name: Assert this run is a listed part
  ansible.builtin.assert:
    that:
      - verify_part in verify_parts
    fail_msg: >-
      This scenario ({{ verify_part }}) is not one of the listed parts: {{ verify_parts }}.
      Its cases would not run in any scenario.
    quiet: true

- name: Assert each listed part is a scenario that runs verify
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.fileglob', verify_scenarios_dir ~ '/' ~ item ~ '/molecule.yml', wantlist=true) | length == 1
      - lookup('ansible.builtin.fileglob', verify_scenarios_dir ~ '/' ~ item ~ '/verify.yml', wantlist=true) | length == 1
      - >-
        not (lookup('ansible.builtin.file', verify_scenarios_dir ~ '/' ~ item ~ '/skip-steps.txt', errors='ignore')
        | default('', true) | string | regex_search(verify_skip_pattern))
    fail_msg: 'The part {{ item }} has no molecule/{{ item }}/molecule.yml or verify.yml, or that scenario leaves the verify step out.'
    quiet: true
  loop: '{{ verify_parts }}'
  vars:
    verify_scenarios_dir: '{{ playbook_dir }}/..'
    # The one guard every role copies (checks/test_verify_guard_copies.py holds the copies equal). It reads
    # the file as the harness does, with str.splitlines(): a verify line may be padded, and may follow any
    # break that splits a line besides LF (CR, VT, FF, FS, GS, RS, NEL, LS, PS), which ^ and $ cannot see.
    verify_skip_pattern: '(?:\A|(?<=[\x0a\x0d\x0b\x0c\x1c-\x1e\x85\u2028\u2029]))\s*verify\s*(?=[\x0a\x0d\x0b\x0c\x1c-\x1e\x85\u2028\u2029]|\Z)'
