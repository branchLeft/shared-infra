---
# One verify.yml for every scenario of the role. The cases are shared out between
# scenarios so that no shard takes more than a few minutes (README, "Timing
# a run"). Each scenario applies the role in its converge, then runs this file, which
# runs the part of the cases that carries the scenario's own name:
#
#   default      no case of its own: the checks on what the converge left, the source
#                checks and the log scan, with the plan, idempotence and check-mode steps
#                that only this scenario runs
#   refusals     the inputs, the downloads, the pins, the second compose files and the
#                apt source files the role does not manage that it must refuse
#   paths        the paths Docker or an earlier release left in the way
#   rotation     the wide file an earlier release left, and the rotation
#   repository   the changes to a repository file that make the role refresh the index
#
# The other scenarios' verify.yml import this file, and the part is read from the name
# Molecule gives the scenario it runs. The checks that read what the converge left,
# the sentinel scan of the log and of the files on the controller, and the source checks
# run in every scenario, each over that scenario's own run. tasks/assert_parts.yml fails
# the run when a part has no scenario that runs it, so a case cannot be dropped by
# deleting a scenario.
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    # The part this run is: the scenario's name. Every part is a scenario directory
    # beside this one (tasks/assert_parts.yml checks that it is, and runs verify).
    verify_part: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_NAME') }}"
    verify_parts:
      - default
      - refusals
      - paths
      - rotation
      - repository
    # The sentinels, read from the files prepare.yml made. A task that prints one
    # of these variables prints a sentinel, so every task below that handles one
    # has no_log.
    verify_password: "{{ lookup('ansible.builtin.file', scenario_sentinel_dir ~ '/password') }}"
    verify_earlier: "{{ lookup('ansible.builtin.file', scenario_sentinel_dir ~ '/earlier_password') }}"
    verify_probe: "{{ lookup('ansible.builtin.file', scenario_sentinel_dir ~ '/probe_role') }}"
    verify_digest_control: "{{ lookup('ansible.builtin.file', scenario_sentinel_dir ~ '/digest_control') }}"
    # The rotated password is exactly the shortest length the role accepts and
    # holds all four punctuation characters it allows, so one rotation shows that
    # both the boundary and the set are accepted.
    verify_password_full_rotated: "{{ lookup('ansible.builtin.file', scenario_sentinel_dir ~ '/password_rotated') }}"
    verify_password_rotated: "{{ verify_password_full_rotated[:12] ~ '.a_b~c-d' }}"
    # Every text the log must not hold, as one pattern. Sentinels are letters and
    # digits, so they need no escaping. The probe is the prefix of every refused
    # password, so a refusal that echoed its input would hold it.
    verify_sentinels:
      password: '{{ verify_password }}'
      password_full_rotated: '{{ verify_password_full_rotated }}'
      password_rotated: '{{ verify_password_rotated }}'
      earlier_password: '{{ verify_earlier }}'
      probe: '{{ verify_probe }}'
    verify_sentinel_pattern: "{{ verify_sentinels.values() | join('|') }}"
    # The exporter file's exact text for the two passwords it holds. The result of
    # the task that writes it carries a SHA-1 and an MD5 of the whole file, which
    # are not a sentinel's, so the scan also looks for the digests of these texts.
    verify_cnf_text: >-
      {{ '[client]' ~ ('%c' | format(10)) ~ 'user = exporter' ~ ('%c' | format(10)) ~ 'password = ' ~ verify_password
      ~ ('%c' | format(10)) ~ 'socket = /var/run/mysqld/mysqld.sock' ~ ('%c' | format(10)) }}
    verify_cnf_text_rotated: >-
      {{ '[client]' ~ ('%c' | format(10)) ~ 'user = exporter' ~ ('%c' | format(10)) ~ 'password = ' ~ verify_password_rotated
      ~ ('%c' | format(10)) ~ 'socket = /var/run/mysqld/mysqld.sock' ~ ('%c' | format(10)) }}
    # What the log scan looks for: each sentinel, the two file texts, and the
    # digest control.
    verify_scan_items: >-
      {{ verify_sentinels | dict2items + [{'key': 'cnf_file', 'value': verify_cnf_text},
      {'key': 'cnf_file_rotated', 'value': verify_cnf_text_rotated},
      {'key': 'digest_control', 'value': verify_digest_control}] }}
    verify_role_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY', default='') }}"
    # The paths part two writes, written out here as the checks expect them. The
    # role's vars file is not loaded in this play, so these are not read from it;
    # a path changed in the role fails the checks in tasks/verify_part_two.yml.
    db1_stack_compose_path: /opt/branchleft/db/compose.yml
    db1_stack_db_directory: /opt/branchleft/db
    db1_stack_cnf_directory: /opt/branchleft/db/conf.d
    db1_stack_socket_directory: /opt/branchleft/db/run/mysqld
    db1_stack_image_env_path: /etc/branchleft/db.image.env
    db1_stack_legacy_drop_in: /etc/systemd/system/branchleft-compose@db.service.d/override.conf
    db1_stack_reload_marker: /var/cache/db1-stack/legacy-drop-in-reloaded
    # The downloads and package files the scenario applies the role with.
    verify_downloads:
      - url: file://{{ scenario_package_dir }}/{{ scenario_libaio_name }}
        dest: '{{ scenario_libaio_path }}'
        checksum: 'sha256:{{ db1_stack_verify_libaio_stat.stat.checksum | default("MISSING") }}'
    verify_debs:
      - '{{ scenario_libaio_path }}'
    # The pins the role carries in vars/main.yml, as the test expects them. A
    # bump of a pin changes the file and these together.
    verify_key_sha256: 5c35d3f5f79ef8755693f7458f4eeaad23974bcbf3a56a906e76eaa68a915d05
    verify_checked_packages:
      - mysql-community-client
      - mysql-community-server-core
    verify_legacy_files:
      - /etc/apt/sources.list.d/mysql-community.list
      - /etc/apt/sources.list.d/mysql.list
      - /usr/share/keyrings/mysql.gpg
    verify_spec_short_description: Install the database host prerequisites and render the exporter credentials file
    verify_apt_texts:
      /etc/apt/sources.list.d/mysql-community.sources: |
        # Managed by Ansible. Changes made here by hand are overwritten.
        Types: deb
        URIs: http://repo.mysql.com/apt/debian
        Suites: bookworm
        Components: mysql-8.0
        Signed-By: /etc/apt/keyrings/mysql-community.asc
      /etc/apt/preferences.d/mysql-community-8.0: |
        # Managed by Ansible. Changes made here by hand are overwritten.
        # Holds the MySQL client toolchain to the 8.0 line, so unattended upgrades cannot
        # pick a newer candidate from the repository's component.
        Package: mysql-community-client mysql-community-client-core mysql-community-client-plugins mysql-community-server-core mysql-common
        Pin: version 8.0.*
        Pin-Priority: 1001
    # Code points that must not be in the password: dollar, double quote, number
    # sign, semicolon, backslash, line feed, carriage return, space, tab, vertical
    # tab, form feed, braces, single quote, backtick, equals, ampersand, percent,
    # brackets, comma, slash, colon, question mark, at, caret, exclamation, one
    # letter outside ASCII, and the line separator.
    # The role is also given the characters the first version of this list never
    # tried that a person could plausibly add to the set: vertical bar, asterisk,
    # plus, less-than, greater-than and delete.
    verify_allowed_codes: '{{ [45, 46, 95, 126] + (range(48, 58) | list) + (range(65, 91) | list) + (range(97, 123) | list) }}'
    verify_unsafe_codes:
      [
        124,
        42,
        43,
        60,
        62,
        127,
        36,
        34,
        35,
        59,
        92,
        10,
        13,
        32,
        9,
        11,
        12,
        123,
        125,
        39,
        96,
        61,
        38,
        37,
        40,
        41,
        44,
        47,
        58,
        63,
        64,
        91,
        93,
        94,
        33,
        233,
        8232,
      ]
  tasks:
    # ----- That every part has a scenario that runs it -----
    - name: Assert this run is a listed part, and that every part is a scenario that runs verify
      ansible.builtin.include_tasks: tasks/assert_parts.yml

    - name: Read the placeholder package file the download names
      ansible.builtin.stat:
        path: '{{ scenario_package_dir }}/{{ scenario_libaio_name }}'
        checksum_algorithm: sha256
      register: db1_stack_verify_libaio_stat

    # ----- The state the converge left -----
    - name: Assert the host is configured
      ansible.builtin.include_tasks: tasks/assert_state.yml
      vars:
        state_password: '{{ verify_password }}'

    # ----- The role holds no secret of its own -----
    # ANS-16: a secret is never a default. The files are read from the role's own
    # directory, not from the copy Molecule links.
    - name: Read the role's defaults, argument spec and fixed values
      ansible.builtin.set_fact:
        db1_stack_verify_defaults_text: "{{ lookup('ansible.builtin.file', verify_role_dir ~ '/defaults/main.yml') }}"
        db1_stack_verify_defaults: "{{ lookup('ansible.builtin.file', verify_role_dir ~ '/defaults/main.yml') | from_yaml }}"
        db1_stack_verify_spec_text: "{{ lookup('ansible.builtin.file', verify_role_dir ~ '/meta/argument_specs.yml') }}"
        db1_stack_verify_spec: "{{ lookup('ansible.builtin.file', verify_role_dir ~ '/meta/argument_specs.yml') | from_yaml }}"
        db1_stack_verify_vars_text: "{{ lookup('ansible.builtin.file', verify_role_dir ~ '/vars/main.yml') }}"
        db1_stack_verify_vars: "{{ lookup('ansible.builtin.file', verify_role_dir ~ '/vars/main.yml') | from_yaml }}"
      no_log: true

    - name: Assert the defaults hold no secret and declare only the inputs
      ansible.builtin.assert:
        that:
          - db1_stack_verify_defaults.keys() | sort == ['db1_stack_apt_packages', 'db1_stack_debs', 'db1_stack_downloads']
          - db1_stack_verify_defaults_text | regex_search(verify_sentinel_pattern) is none
          - "'password' not in (db1_stack_verify_defaults.keys() | join(' '))"
        fail_msg: The role's defaults/main.yml holds a variable the role does not declare, a password, or a sentinel.
        quiet: true

    - name: Assert the argument spec marks the password as a secret and gives it no default
      ansible.builtin.assert:
        that:
          - verify_spec_options['db1_stack_exporter_password']['required']
          - verify_spec_options['db1_stack_exporter_password']['no_log'] | default(false)
          - "'default' not in verify_spec_options['db1_stack_exporter_password']"
          - db1_stack_verify_spec_text | regex_search(verify_sentinel_pattern) is none
        fail_msg: The password option is not required and no_log, or has a default, or the spec holds a sentinel.
        quiet: true
      vars:
        verify_spec_options: "{{ db1_stack_verify_spec['argument_specs']['main']['options'] }}"

    - name: Assert the spec describes every input the defaults declare
      ansible.builtin.assert:
        that:
          - verify_spec_options.keys() | sort == (db1_stack_verify_defaults.keys() | list + ['db1_stack_exporter_password']) | sort
          - verify_spec_options[item]['default'] == db1_stack_verify_defaults[item]
        quiet: true
      loop: '{{ db1_stack_verify_defaults.keys() | sort }}'
      vars:
        verify_spec_options: "{{ db1_stack_verify_spec['argument_specs']['main']['options'] }}"

    # The pins the role carries are the ones the test expects, and the pinned
    # download is the real package file, not the placeholder the scenario swaps in.
    - name: Assert the pins in the role are the ones the test expects
      ansible.builtin.assert:
        that:
          - db1_stack_verify_vars.db1_stack_mysql_key_sha256 == verify_key_sha256
          - db1_stack_verify_vars.db1_stack_mysql_version_line == '8.0'
          - db1_stack_verify_vars.db1_stack_mysql_repository_uri == 'http://repo.mysql.com/apt/debian'
          - db1_stack_verify_vars.db1_stack_mysql_repository_suite == 'bookworm'
          - db1_stack_verify_vars.db1_stack_mysql_repository_component == 'mysql-8.0'
          - db1_stack_verify_vars.db1_stack_mysql_checked_packages == verify_checked_packages
          - db1_stack_verify_vars.db1_stack_legacy_files == verify_legacy_files
          - db1_stack_verify_vars.db1_stack_exporter_uid == 65534
          - db1_stack_verify_vars.db1_stack_exporter_gid == 65534
          - db1_stack_verify_vars.db1_stack_exporter_cnf_mode == '0400'
          - db1_stack_verify_defaults.db1_stack_downloads | length == 1
          - db1_stack_verify_defaults.db1_stack_downloads[0].url == 'https://deb.debian.org/debian/pool/main/liba/libaio/libaio1_0.3.113-4_amd64.deb'
          - db1_stack_verify_defaults.db1_stack_downloads[0].dest == '/var/cache/db1-stack/libaio1_0.3.113-4_amd64.deb'
          - db1_stack_verify_defaults.db1_stack_downloads[0].checksum == 'sha256:d1476e4beab3d85f8a7d31de94c27472711ed3ef399ce70708e24b259426125b'
          - db1_stack_verify_defaults.db1_stack_debs == ['/var/cache/db1-stack/libaio1_0.3.113-4_amd64.deb']
          - db1_stack_verify_defaults.db1_stack_apt_packages == ['age', 'mysql-community-client', 'mysql-community-server-core']
        fail_msg: A pin in the role differs from the one the test expects. Change both in one change.
        quiet: true

    # ----- Every download must be pinned: the scan of the role's source -----
    # The scan is the one in the packages_and_downloads pattern, read from there
    # and not copied. It lists the role's task and handler files on the controller
    # and fails for any get_url without a checksum, a uri that writes a file, an
    # apt install of a URL, and the other spellings its header lists.
    - name: Assert Molecule names the role directory
      ansible.builtin.assert:
        that:
          - verify_role_dir | length > 0
        fail_msg: MOLECULE_PROJECT_DIRECTORY is not set, so the task files cannot be read.
        quiet: true

    - name: List every file in the role directory
      ansible.builtin.find:
        paths:
          - '{{ verify_role_dir }}'
        file_type: any
        recurse: true
        hidden: true
      delegate_to: localhost
      run_once: true
      register: db1_stack_verify_role_files

    - name: Scan every file under tasks and handlers for download tasks
      ansible.builtin.set_fact:
        db1_stack_verify_scan: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~ '/../../../../patterns/packages_and_downloads/molecule/default/scan-downloads.j2',
          template_vars={'scan_files': db1_stack_verify_role_files.files, 'role_dir': verify_role_dir, 'prefix': 'db1_stack'}) | from_json }}

    - name: Assert the scan read the role's main tasks file and saw a download
      ansible.builtin.assert:
        that:
          - db1_stack_verify_scan.files | select('search', '/tasks/main[.]yml$') | list | length == 1
          - db1_stack_verify_scan.seen > 0
        fail_msg: The scan did not read tasks/main.yml or saw no get_url task, so it proves nothing.
        quiet: true

    - name: Assert no download task in the role lacks a pin
      ansible.builtin.assert:
        that:
          - db1_stack_verify_scan.failures | length == 0
        fail_msg: "Unpinned download in the role: {{ db1_stack_verify_scan.failures | join('; ') }}"
        quiet: true

    # ----- The cases this scenario runs -----
    # Each case applies the role to the converged host and puts the host back as the
    # converge left it, so the scenarios are independent of each other and each runs
    # on its own instance. The part is the scenario's name (see the top of this file).
    - name: Refuse the inputs the role must refuse, before it changes anything
      ansible.builtin.include_tasks: tasks/verify_input_refusals.yml
      when: verify_part == 'refusals'

    # Another file names the repository. The role stops before it changes the host,
    # in a plan and in an apply.
    - name: Leave a file the role does not manage that names the repository
      ansible.builtin.include_tasks: tasks/unmanaged_source.yml
      when: verify_part == 'refusals'

    - name: Meet a path that Docker or an earlier release left in the way
      ansible.builtin.include_tasks: tasks/verify_paths.yml
      when: verify_part == 'paths'

    - name: Close the wide file an earlier release left, and rotate the password
      ansible.builtin.include_tasks: tasks/verify_wide_file_and_rotation.yml
      when: verify_part == 'rotation'

    - name: Refresh the index when a repository file changed
      ansible.builtin.include_tasks: tasks/verify_repository_files.yml
      when: verify_part == 'repository'

    # ----- The host is as the converge left it -----
    - name: Assert the host ends as the converge left it
      ansible.builtin.include_tasks: tasks/assert_state.yml
      vars:
        state_password: '{{ verify_password }}'

    # ----- ANS-16: no sentinel in any log -----
    # The scenario sets verbosity 3 and a log path (molecule.yml), so a task that
    # handles the password without no_log prints it into this log, in its result,
    # its arguments, its diff or the message of a failure. The scan runs last, so
    # it covers every run above: the converge, the second converge, the
    # check-mode runs with diff, the rotations, the refusals and the failures. The
    # controls show the scan reads the output: the canary of the converge, two
    # task names of the role, and the digest control.
    - name: Print the SHA-1, SHA-256 and base64 of the digest control, the scan's control for those forms
      ansible.builtin.debug:
        msg: >-
          SCENARIO_DIGEST_CONTROL {{ verify_digest_control | hash("sha1") }}
          {{ verify_digest_control | hash("sha256") }} {{ verify_digest_control | b64encode }}

    - name: Read the log of this scenario's Ansible runs
      ansible.builtin.set_fact:
        db1_stack_verify_log: "{{ lookup('ansible.builtin.file', scenario_log_path) }}"
      no_log: true

    - name: Assert the log holds the output the scan is meant to read
      ansible.builtin.assert:
        that:
          - "'SCENARIO_LOG_CANARY' in db1_stack_verify_log"
          - "' : Write the exporter credentials file' in db1_stack_verify_log"
          - "' : Create the exporter file empty and closed' in db1_stack_verify_log"
        fail_msg: The log lacks the canary or a role task name, so an empty scan would prove nothing.
        quiet: true
      no_log: true

    - name: Start the list of the sentinels the log holds
      ansible.builtin.set_fact:
        db1_stack_verify_found: []
      no_log: true

    # A sentinel counts as held when its text, its SHA-1, MD5 or SHA-256, or its
    # base64 form is in the log. A fingerprint of a secret is a leak too: a digest
    # of a human-chosen password can be checked offline. The base64 form is
    # looked for whole, and as the stable middle of the encoding at the three
    # alignments the text can have inside a longer encoded blob (a file read and
    # encoded whole puts the password at any of them). The digest control is
    # printed in each digest form and the base64 form, and found by them only.
    - name: Look in the log for each sentinel in each form, and for the digest control
      ansible.builtin.set_fact:
        db1_stack_verify_found: '{{ db1_stack_verify_found + [item.key] }}'
      loop: '{{ verify_scan_items }}'
      vars:
        verify_forms: >-
          {{ [item.value, item.value | hash('sha1'), item.value | hash('md5'), item.value | hash('sha256'),
          item.value | b64encode, (item.value | b64encode)[4:-4], (('x' ~ item.value) | b64encode)[4:-4],
          (('xy' ~ item.value) | b64encode)[4:-4]] }}
      when: db1_stack_verify_log is search(verify_forms | map('regex_escape') | join('|'))
      no_log: true

    - name: Work out which sentinels the log holds
      ansible.builtin.set_fact:
        db1_stack_verify_leaked: "{{ db1_stack_verify_found | reject('equalto', 'digest_control') | list }}"
      no_log: true

    - name: Assert the scan finds the digest control in the log
      ansible.builtin.assert:
        that:
          - "'digest_control' in db1_stack_verify_found"
        fail_msg: The scan did not find the digest control in the log, so an empty scan of digests would prove nothing.
        quiet: true

    # The scan builds each form with the same filter used here, so the control
    # being in the log in each form shows that form can be found.
    - name: Assert the log holds the control in the SHA-256 form and the base64 form
      ansible.builtin.assert:
        that:
          - (verify_digest_control | hash('sha256')) in db1_stack_verify_log
          - (verify_digest_control | b64encode) in db1_stack_verify_log
        fail_msg: The log lacks the SHA-256 or base64 form of the digest control, so a scan for those forms would prove nothing.
        quiet: true
      no_log: true

    - name: Assert no sentinel reached the log
      ansible.builtin.assert:
        that:
          - db1_stack_verify_leaked == []
        fail_msg: 'The log holds the sentinels: {{ db1_stack_verify_leaked }}.'
        quiet: true

    # The file is created closed before the password is written (see the role).
    # The log lists the tasks in the order they ran.
    - name: Assert the closed file is created before the password is written
      ansible.builtin.assert:
        that:
          - "db1_stack_verify_log.find(' : Create the exporter file empty and closed') >= 0"
          - "db1_stack_verify_log.find(' : Write the exporter credentials file') >= 0"
          - "db1_stack_verify_log.find(' : Create the exporter file empty and closed') < db1_stack_verify_log.find(' : Write the exporter credentials file')"
          - "db1_stack_verify_log.find(' : Close an exporter file that already exists') >= 0"
          - >-
            db1_stack_verify_log.find(' : Create the exporter file empty and closed')
            < db1_stack_verify_log.find(' : Close an exporter file that already exists')
          - >-
            db1_stack_verify_log.find(' : Close an exporter file that already exists')
            < db1_stack_verify_log.find(' : Write the exporter credentials file')
        quiet: true
      no_log: true

    # Part two: the database stack's files and the order of the legacy drop-in and
    # the exporter file (verify_part_two.yml), the source of the role's task files
    # (verify_role_source.yml), and the refusals of the image pin and of a second
    # compose or an override file (verify_refusals.yml, in the `refusals` scenario
    # only). The source checks read the file list registered above.
    - name: Check the database stack's files and the order of its tasks
      ansible.builtin.import_tasks: tasks/verify_part_two.yml

    - name: Check the source of the role's task files, templates and metadata
      ansible.builtin.import_tasks: tasks/verify_role_source.yml

    - name: Check the refusals of the image pin and of a second compose or an override file
      ansible.builtin.include_tasks: tasks/verify_refusals.yml
      when: verify_part == 'refusals'

# The other files this run leaves on the controller: Molecule's own copy of the
# configuration, the inventory it built, its state, and the log. The sentinel
# files themselves are the one place the values are meant to be.
- name: Scan the files the run leaves on the controller
  hosts: localhost
  gather_facts: false
  vars:
    scan_files: "{{ scenario_sentinel_labels | map('regex_replace', '^', scenario_sentinel_dir ~ '/') | list }}"
    scan_pattern: "{{ lookup('ansible.builtin.file', *scan_files, wantlist=True) | join('|') }}"
  tasks:
    - name: Search the scenario's directory for every sentinel but the sentinel files
      ansible.builtin.find:
        paths: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
        recurse: true
        hidden: true
        file_type: file
        excludes: '{{ scenario_sentinel_labels }}'
        contains: '{{ scan_pattern }}'
      register: db1_stack_scan_found
      no_log: true

    - name: Assert no other file the run left holds a sentinel
      ansible.builtin.assert:
        that:
          - db1_stack_scan_found.files | length == 0
        fail_msg: 'A sentinel is in: {{ db1_stack_scan_found.files | map(attribute="path") | list }}'
        quiet: true
