---
# What must be on the host is read from the repository, not from the role: the
# stack's files and the two isolation files are compared byte for byte with
# their sources (read by the controller, not through the role's links), so a
# copy in the role that differs from its source fails here.
- name: Verify the instance
  hosts: all
  gather_facts: false
  vars:
    verify_repo: '{{ playbook_dir }}/../../../../../'
    verify_stack_source: '{{ verify_repo }}hetzner/control-plane/stack'
    verify_provision_source: '{{ verify_repo }}hetzner/provision'
    verify_project_dir: /opt/branchleft/control-plane
    verify_env_file: /etc/branchleft/control-plane.env
    verify_masterkey_file: /etc/branchleft/control-plane/zitadel-masterkey
    # The image the stand-in for docker reports as running; the scenario's pin ends in 2s.
    verify_running_image: example.invalid/example-app@sha256:1111111111111111111111111111111111111111111111111111111111111111
    # The digest in the deploy wrapper's record in the record cases.
    verify_recorded_image: example.invalid/example-app@sha256:4444444444444444444444444444444444444444444444444444444444444444
    verify_stack_files:
      - compose.yml
      - compose.init.yml
      - pg_hba.conf
  tasks:
    # rstrip=False: the lookup strips trailing whitespace by default, and slurp on
    # the instance keeps the final newline, so the byte comparison needs it kept.
    - name: Read each stack file and each isolation file from the repository
      ansible.builtin.set_fact:
        control_plane_verify_sources: >-
          {{ control_plane_verify_sources | default({})
          | combine({item.key: lookup('ansible.builtin.file', item.value, rstrip=False)}) }}
      loop:
        - key: compose.yml
          value: '{{ verify_stack_source }}/compose.yml'
        - key: compose.init.yml
          value: '{{ verify_stack_source }}/compose.init.yml'
        - key: pg_hba.conf
          value: '{{ verify_stack_source }}/pg_hba.conf'
        - key: branchleft_docker_user_policy.sh
          value: '{{ verify_provision_source }}/branchleft_docker_user_policy.sh'
        - key: branchleft-docker-user-policy.service
          value: '{{ verify_provision_source }}/branchleft-docker-user-policy.service'
      loop_control:
        label: '{{ item.key }}'
      no_log: true

    - name: Read the stack's files on the instance
      ansible.builtin.slurp:
        src: '{{ verify_project_dir }}/{{ item }}'
      loop: '{{ verify_stack_files }}'
      register: control_plane_verify_stack_slurp
      loop_control:
        label: '{{ item }}'
      no_log: true

    - name: Assert each stack file is on the instance, root-owned, mode 0644 and byte-equal to its source
      ansible.builtin.assert:
        that:
          - item.item in control_plane_verify_sources
          - (item.content | ansible.builtin.b64decode) == control_plane_verify_sources[item.item]
        quiet: true
        fail_msg: '{{ item.item }} differs from its source in the repository.'
      loop: '{{ control_plane_verify_stack_slurp.results }}'
      loop_control:
        label: '{{ item.item }}'
      no_log: true

    - name: Read the mode and owner of the project directory and each stack file
      ansible.builtin.stat:
        path: '{{ verify_project_dir }}/{{ item }}'
      loop: '{{ ["."] + verify_stack_files }}'
      register: control_plane_verify_stats
      loop_control:
        label: '{{ item }}'

    - name: Assert the project directory and each stack file have the owner and mode of the role
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - item.stat.mode == ('0755' if item.item == '.' else '0644')
        quiet: true
        fail_msg: '{{ item.item }} is not root:root with the mode the role sets.'
      loop: '{{ control_plane_verify_stats.results }}'
      loop_control:
        label: '{{ item.item }}'

    - name: Read the environment file and the master key
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '{{ verify_env_file }}'
        - '{{ verify_masterkey_file }}'
      register: control_plane_verify_secret_stats
      loop_control:
        label: '{{ item }}'

    - name: Assert the environment file is 0600 root and the master key is 0400 uid and gid 1000
      ansible.builtin.assert:
        that:
          - control_plane_verify_secret_stats.results[0].stat.mode == '0600'
          - control_plane_verify_secret_stats.results[0].stat.pw_name == 'root'
          - control_plane_verify_secret_stats.results[1].stat.mode == '0400'
          - control_plane_verify_secret_stats.results[1].stat.uid == 1000
          - control_plane_verify_secret_stats.results[1].stat.gid == 1000
        quiet: true
        fail_msg: The environment file or the master key does not have the mode and owner the runbook sets.

    # The secret values are written on the instance, and must not appear in the
    # run's log, which the controller keeps. The log is read at the end, after the
    # role has been applied again below.
    - name: Read the secrets on the instance after the first apply
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ verify_env_file }}'
        - '{{ verify_masterkey_file }}'
      register: control_plane_verify_first
      loop_control:
        label: '{{ item }}'
      no_log: true

    - name: Assert the secrets hold exactly the values of the first apply
      ansible.builtin.assert:
        that:
          - (control_plane_verify_first.results[0].content | ansible.builtin.b64decode) == control_plane_env_content
          - (control_plane_verify_first.results[1].content | ansible.builtin.b64decode) == control_plane_masterkey
        quiet: true
        fail_msg: The environment file or the master key does not hold the value the first apply was given.
      no_log: true

    # The write-once rule. The role is applied again with DIFFERENT values for both
    # secrets, and both files must still hold the first values.
    - name: Apply the role again with different secret values
      ansible.builtin.include_role:
        name: branchleft.control_plane
      vars:
        control_plane_env_content: 'CONTROL_PLANE_DB_ADMIN_PASSWORD=SECOND-{{ scenario_secret }}'
        control_plane_masterkey: 'MASTERKEY-SECOND-{{ scenario_secret }}'

    - name: Read the secrets on the instance after the second apply
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ verify_env_file }}'
        - '{{ verify_masterkey_file }}'
      register: control_plane_verify_second
      loop_control:
        label: '{{ item }}'
      no_log: true

    - name: Assert the second apply, with different values, changed neither secret
      ansible.builtin.assert:
        that:
          - (control_plane_verify_second.results[0].content | ansible.builtin.b64decode) == control_plane_env_content
          - (control_plane_verify_second.results[1].content | ansible.builtin.b64decode) == control_plane_masterkey
          - "'SECOND' not in (control_plane_verify_second.results[0].content | ansible.builtin.b64decode)"
          - "'SECOND' not in (control_plane_verify_second.results[1].content | ansible.builtin.b64decode)"
        quiet: true
        fail_msg: A second apply with different values replaced the environment file or the master key.
      no_log: true

    # A secret file widened by hand is put back to its declared owner, group and mode
    # by the next run, and its content is not changed. Both files are widened: the
    # environment file to nobody:nogroup 0644, the master key to nobody:nogroup 0644.
    - name: Widen both secret files by hand, as an operator might
      ansible.builtin.file:
        path: '{{ item.path }}'
        owner: nobody
        group: nogroup
        mode: '0644'
      loop:
        - path: '{{ verify_env_file }}'
        - path: '{{ verify_masterkey_file }}'
      loop_control:
        label: '{{ item.path }}'

    - name: Apply the role again over the widened files, with different secret values
      ansible.builtin.include_role:
        name: branchleft.control_plane
      vars:
        control_plane_env_content: 'CONTROL_PLANE_DB_ADMIN_PASSWORD=SECOND-{{ scenario_secret }}'
        control_plane_masterkey: 'MASTERKEY-SECOND-{{ scenario_secret }}'

    - name: Read the mode and owner of both secret files after the run that widened them
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '{{ verify_env_file }}'
        - '{{ verify_masterkey_file }}'
      register: control_plane_verify_restored_stats
      loop_control:
        label: '{{ item }}'

    - name: Assert the environment file's owner is root again
      ansible.builtin.assert:
        that:
          - control_plane_verify_restored_stats.results[0].stat.pw_name == 'root'
        quiet: true
        fail_msg: The environment file's owner was not restored to root.

    - name: Assert the environment file's group is root again
      ansible.builtin.assert:
        that:
          - control_plane_verify_restored_stats.results[0].stat.gr_name == 'root'
        quiet: true
        fail_msg: The environment file's group was not restored to root.

    - name: Assert the environment file's mode is 0600 again
      ansible.builtin.assert:
        that:
          - control_plane_verify_restored_stats.results[0].stat.mode == '0600'
        quiet: true
        fail_msg: The environment file's mode was not restored to 0600.

    - name: Assert the master key's owner is uid 1000 again
      ansible.builtin.assert:
        that:
          - control_plane_verify_restored_stats.results[1].stat.uid == 1000
        quiet: true
        fail_msg: The master key's owner was not restored to uid 1000.

    - name: Assert the master key's group is gid 1000 again
      ansible.builtin.assert:
        that:
          - control_plane_verify_restored_stats.results[1].stat.gid == 1000
        quiet: true
        fail_msg: The master key's group was not restored to gid 1000.

    - name: Assert the master key's mode is 0400 again
      ansible.builtin.assert:
        that:
          - control_plane_verify_restored_stats.results[1].stat.mode == '0400'
        quiet: true
        fail_msg: The master key's mode was not restored to 0400.

    - name: Read the secrets after the widened files were restored
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ verify_env_file }}'
        - '{{ verify_masterkey_file }}'
      register: control_plane_verify_restored_content
      loop_control:
        label: '{{ item }}'
      no_log: true

    - name: Assert the widened files kept their first values
      ansible.builtin.assert:
        that:
          - (control_plane_verify_restored_content.results[0].content | ansible.builtin.b64decode) == control_plane_env_content
          - (control_plane_verify_restored_content.results[1].content | ansible.builtin.b64decode) == control_plane_masterkey
        quiet: true
        fail_msg: Restoring the owner and mode of a widened secret file changed its content.
      no_log: true

    # A run that stopped between creating a file empty and writing its content
    # leaves an empty file. The next apply must fill it, and only then.
    # A run that stopped between the two steps leaves an empty file, and an operator may
    # have widened it. Both files are emptied AND widened here, so the next apply must
    # restore their owner and mode and fill them with the new values.
    - name: Empty both secret files and widen them, as a stopped run and an operator leave them
      ansible.builtin.copy:
        content: ''
        dest: '{{ item }}'
        owner: nobody
        group: nogroup
        mode: '0644'
        force: true
      loop:
        - '{{ verify_env_file }}'
        - '{{ verify_masterkey_file }}'
      loop_control:
        label: '{{ item }}'

    - name: Apply the role again over the empty files, with different secret values
      ansible.builtin.include_role:
        name: branchleft.control_plane
      vars:
        control_plane_env_content: 'CONTROL_PLANE_DB_ADMIN_PASSWORD=SECOND-{{ scenario_secret }}'
        control_plane_masterkey: 'MASTERKEY-SECOND-{{ scenario_secret }}'

    - name: Read the secrets on the instance after the empty files were filled
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ verify_env_file }}'
        - '{{ verify_masterkey_file }}'
      register: control_plane_verify_filled
      loop_control:
        label: '{{ item }}'
      no_log: true

    - name: Read the mode and owner of both files after they were filled
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '{{ verify_env_file }}'
        - '{{ verify_masterkey_file }}'
      register: control_plane_verify_filled_stats
      loop_control:
        label: '{{ item }}'

    - name: Assert the empty files were filled with the new values at the same owner and mode
      ansible.builtin.assert:
        that:
          - (control_plane_verify_filled.results[0].content | ansible.builtin.b64decode) == ('CONTROL_PLANE_DB_ADMIN_PASSWORD=SECOND-' ~ scenario_secret)
          - (control_plane_verify_filled.results[1].content | ansible.builtin.b64decode) == ('MASTERKEY-SECOND-' ~ scenario_secret)
          - control_plane_verify_filled_stats.results[0].stat.mode == '0600'
          - control_plane_verify_filled_stats.results[0].stat.pw_name == 'root'
          - control_plane_verify_filled_stats.results[0].stat.gr_name == 'root'
          - control_plane_verify_filled_stats.results[1].stat.mode == '0400'
          - control_plane_verify_filled_stats.results[1].stat.uid == 1000
          - control_plane_verify_filled_stats.results[1].stat.gid == 1000
        quiet: true
        fail_msg: An empty secret file was not filled, or it was filled at the wrong owner or mode.
      no_log: true

    # ---- Inputs the role needs only where a file or a running stack is missing ----
    # A file that holds a value needs no content given. Both contents are given as empty
    # strings, which count as not given, and both files must keep the values they hold.
    - name: Apply the role again with no secret content given
      ansible.builtin.include_role:
        name: branchleft.control_plane
      vars:
        control_plane_env_content: ''
        control_plane_masterkey: ''

    - name: Read the secrets after the run that was given no content
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ verify_env_file }}'
        - '{{ verify_masterkey_file }}'
      register: control_plane_verify_ungiven
      loop_control:
        label: '{{ item }}'
      no_log: true

    - name: Assert the run that was given no content left both files as they were
      ansible.builtin.assert:
        that:
          - (control_plane_verify_ungiven.results[0].content | ansible.builtin.b64decode) == ('CONTROL_PLANE_DB_ADMIN_PASSWORD=SECOND-' ~ scenario_secret)
          - (control_plane_verify_ungiven.results[1].content | ansible.builtin.b64decode) == ('MASTERKEY-SECOND-' ~ scenario_secret)
        quiet: true
        fail_msg: A run given no secret content changed a file that held a value.
      no_log: true

    # A file that is absent, with no content given, stops the run before anything is
    # written. A stack file is removed too: a run that got as far as the delivery would
    # put it back, so its absence afterwards shows that nothing was written.
    - name: Remove the environment file and a stack file
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - '{{ verify_env_file }}'
        - '{{ verify_project_dir }}/compose.yml'

    - name: Run the role with no environment content, where the file is absent
      block:
        - name: Apply the role with an empty environment content
          ansible.builtin.include_role:
            name: branchleft.control_plane
          vars:
            control_plane_env_content: ''
        - name: Fail if the role went on
          ansible.builtin.fail:
            msg: The role went on without the environment content.
      rescue:
        - name: Record the message the run stopped with
          ansible.builtin.set_fact:
            control_plane_verify_message: '{{ ansible_failed_result.msg | default("") }}'

    - name: Assert the run stopped with its own code and named the input
      ansible.builtin.assert:
        that:
          - "control_plane_verify_message.startswith('control_plane[env-missing]: ')"
          - "'control_plane_env_content' in control_plane_verify_message"
          - "'THROWAWAY-' not in control_plane_verify_message"
        quiet: true
        fail_msg: 'The refusal was not the missing-environment refusal: {{ control_plane_verify_message | truncate(200) }}'

    - name: Look at the two files the refused run must not have written
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '{{ verify_env_file }}'
        - '{{ verify_project_dir }}/compose.yml'
      register: control_plane_verify_refused_env
      loop_control:
        label: '{{ item }}'

    - name: Assert the refused run wrote nothing
      ansible.builtin.assert:
        that:
          - not control_plane_verify_refused_env.results[0].stat.exists
          - not control_plane_verify_refused_env.results[1].stat.exists
        quiet: true
        fail_msg: A run that was refused for want of the environment content still wrote a file.

    - name: Put the environment file and the stack file back
      ansible.builtin.include_role:
        name: branchleft.control_plane

    - name: Remove the master key and a stack file
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - '{{ verify_masterkey_file }}'
        - '{{ verify_project_dir }}/compose.yml'

    - name: Run the role with no master key, where the file is absent
      block:
        - name: Apply the role with an empty master key
          ansible.builtin.include_role:
            name: branchleft.control_plane
          vars:
            control_plane_masterkey: ''
        - name: Fail if the role went on
          ansible.builtin.fail:
            msg: The role went on without the master key.
      rescue:
        - name: Record the message the run stopped with
          ansible.builtin.set_fact:
            control_plane_verify_message: '{{ ansible_failed_result.msg | default("") }}'

    - name: Assert the run stopped with its own code and named the input
      ansible.builtin.assert:
        that:
          - "control_plane_verify_message.startswith('control_plane[masterkey-missing]: ')"
          - "'control_plane_masterkey' in control_plane_verify_message"
          - "'THROWAWAY-' not in control_plane_verify_message"
        quiet: true
        fail_msg: 'The refusal was not the missing-master-key refusal: {{ control_plane_verify_message | truncate(200) }}'

    - name: Look at the two files the refused run must not have written
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '{{ verify_masterkey_file }}'
        - '{{ verify_project_dir }}/compose.yml'
      register: control_plane_verify_refused_key
      loop_control:
        label: '{{ item }}'

    - name: Assert the refused run wrote nothing
      ansible.builtin.assert:
        that:
          - not control_plane_verify_refused_key.results[0].stat.exists
          - not control_plane_verify_refused_key.results[1].stat.exists
        quiet: true
        fail_msg: A run that was refused for want of the master key still wrote a file.

    - name: Put the master key and the stack file back
      ansible.builtin.include_role:
        name: branchleft.control_plane

    # The image. The instance has no Docker, so a stand-in for the docker command answers
    # the two reads the role makes (the portal container's id, then the image it was
    # created from) from files and records every call it gets. It is removed at the end.
    - name: Run the image cases with a stand-in for the docker command
      block:
        - name: Create the stand-in's directory
          ansible.builtin.file:
            path: /var/lib/docker-stub
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Install the stand-in for the docker command
          ansible.builtin.copy:
            content: |
              #!/bin/sh
              printf '%s\n' "$*" >> /var/lib/docker-stub/calls
              case "$1" in
                ps) cat /var/lib/docker-stub/ps ;;
                inspect) cat /var/lib/docker-stub/inspect ;;
                *) echo "unexpected docker call: $*" >&2; exit 1 ;;
              esac
            dest: /usr/local/bin/docker
            owner: root
            group: root
            mode: '0755'

        - name: Say what the running stack looks like
          ansible.builtin.copy:
            content: '{{ item.content }}'
            dest: '/var/lib/docker-stub/{{ item.name }}'
            owner: root
            group: root
            mode: '0644'
          loop:
            - name: ps
              content: "0123456789ab\n"
            - name: inspect
              content: "{{ verify_running_image }}\n"
            - name: calls
              content: ''
          loop_control:
            label: '{{ item.name }}'

        # A pin given, and nothing that uses Docker switched on: the role asks the stand-in
        # nothing and uses the pin as given.
        - name: Apply the role with the pin given
          ansible.builtin.include_role:
            name: branchleft.control_plane

        - name: Read what the stand-in was asked
          ansible.builtin.slurp:
            src: /var/lib/docker-stub/calls
          register: control_plane_verify_calls_pinned

        - name: Assert a given pin was used as given and docker was not called
          ansible.builtin.assert:
            that:
              - control_plane_effective_image == control_plane_app_image
              - (control_plane_verify_calls_pinned.content | ansible.builtin.b64decode) == ''
            quiet: true
            fail_msg: A given pin was not used as given, or the role called docker although nothing needed it.

        # No pin, and the deploy wrapper's record holds a digest: that digest is used, ahead
        # of the running container, and docker is not called.
        - name: Put a digest in the deploy wrapper's record
          ansible.builtin.copy:
            content: "IMAGE={{ verify_recorded_image }}\n"
            dest: /etc/branchleft/control-plane.image.env
            owner: root
            group: root
            mode: '0600'

        - name: Apply the role with no image given and a record
          ansible.builtin.include_role:
            name: branchleft.control_plane
          vars:
            control_plane_app_image: ''

        - name: Read what the stand-in was asked after the run with a record
          ansible.builtin.slurp:
            src: /var/lib/docker-stub/calls
          register: control_plane_verify_calls_record

        - name: Assert the recorded digest was used and docker was not called
          ansible.builtin.assert:
            that:
              - control_plane_effective_image == verify_recorded_image
              - (control_plane_verify_calls_record.content | ansible.builtin.b64decode) == ''
            quiet: true
            fail_msg: The role did not take the digest in the wrapper's record, or it called docker although the record held one.

        # A record that is not a digest is not used: the running container decides.
        - name: Put a tag in the deploy wrapper's record
          ansible.builtin.copy:
            content: "IMAGE=example.invalid/example-app:latest\n"
            dest: /etc/branchleft/control-plane.image.env
            owner: root
            group: root
            mode: '0600'

        - name: Apply the role with no image given and a record that is a tag
          ansible.builtin.include_role:
            name: branchleft.control_plane
          vars:
            control_plane_app_image: ''

        - name: Assert the record that is a tag was passed over for the running image
          ansible.builtin.assert:
            that:
              - control_plane_effective_image == verify_running_image
            quiet: true
            fail_msg: A record that is not a digest was used, or the running image was not.

        - name: Remove the deploy wrapper's record and empty the stand-in's call log
          ansible.builtin.copy:
            content: ''
            dest: /var/lib/docker-stub/calls
            owner: root
            group: root
            mode: '0644'

        - name: Remove the deploy wrapper's record
          ansible.builtin.file:
            path: /etc/branchleft/control-plane.image.env
            state: absent

        # No pin: the image is the one the running portal container was created from.
        - name: Apply the role with no image given
          ansible.builtin.include_role:
            name: branchleft.control_plane
          vars:
            control_plane_app_image: ''

        - name: Read what the stand-in was asked after the run with no image
          ansible.builtin.slurp:
            src: /var/lib/docker-stub/calls
          register: control_plane_verify_calls_read

        - name: Assert the running image was used and it was read from the stack's portal container
          ansible.builtin.assert:
            that:
              - control_plane_effective_image == verify_running_image
              - control_plane_deployed | ansible.builtin.bool
              - "'label=com.docker.compose.project=control-plane' in verify_calls"
              - "'label=com.docker.compose.service=portal' in verify_calls"
              - "'label=com.docker.compose.oneoff=False' in verify_calls"
              - "'inspect ' in verify_calls"
              - "'0123456789ab' in verify_calls"
            quiet: true
            fail_msg: The role did not take the image of the stack's running portal container.
          vars:
            verify_calls: '{{ control_plane_verify_calls_read.content | ansible.builtin.b64decode }}'

        # No pin and no running portal container: the run stops.
        - name: Say that no portal container exists
          ansible.builtin.copy:
            content: ''
            dest: /var/lib/docker-stub/ps
            owner: root
            group: root
            mode: '0644'

        - name: Run the role with no image, where no portal container exists
          block:
            - name: Apply the role with no image given
              ansible.builtin.include_role:
                name: branchleft.control_plane
              vars:
                control_plane_app_image: ''
            - name: Fail if the role went on
              ansible.builtin.fail:
                msg: The role went on with no image.
          rescue:
            - name: Record the message the run stopped with
              ansible.builtin.set_fact:
                control_plane_verify_message: '{{ ansible_failed_result.msg | default("") }}'

        - name: Assert the run stopped with its own code and named the input
          ansible.builtin.assert:
            that:
              - "control_plane_verify_message.startswith('control_plane[image-missing]: ')"
              - "'control_plane_app_image' in control_plane_verify_message"
            quiet: true
            fail_msg: 'The refusal was not the missing-image refusal: {{ control_plane_verify_message | truncate(200) }}'

        # The running image is a tag, not a digest: the wrapper would refuse it, and so does the role.
        - name: Say that the running portal container was created from a tag
          ansible.builtin.copy:
            content: '{{ item.content }}'
            dest: '/var/lib/docker-stub/{{ item.name }}'
            owner: root
            group: root
            mode: '0644'
          loop:
            - name: ps
              content: "0123456789ab\n"
            - name: inspect
              content: "example.invalid/example-app:latest\n"
          loop_control:
            label: '{{ item.name }}'

        - name: Run the role with no image, where the running image is a tag
          block:
            - name: Apply the role with no image given
              ansible.builtin.include_role:
                name: branchleft.control_plane
              vars:
                control_plane_app_image: ''
            - name: Fail if the role went on
              ansible.builtin.fail:
                msg: The role went on with an image that is not pinned.
          rescue:
            - name: Record the message the run stopped with
              ansible.builtin.set_fact:
                control_plane_verify_message: '{{ ansible_failed_result.msg | default("") }}'

        - name: Assert the run stopped with its own code
          ansible.builtin.assert:
            that:
              - "control_plane_verify_message.startswith('control_plane[image-not-pinned]: ')"
            quiet: true
            fail_msg: 'The refusal was not the not-pinned refusal: {{ control_plane_verify_message | truncate(200) }}'
      always:
        - name: Remove the stand-in for the docker command
          ansible.builtin.file:
            path: '{{ item }}'
            state: absent
          loop:
            - /usr/local/bin/docker
            - /var/lib/docker-stub
            - /etc/branchleft/control-plane.image.env
          loop_control:
            label: '{{ item }}'

    - name: Read the isolation reconciler and its unit on the instance
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - /usr/local/sbin/branchleft-docker-user-policy
        - /etc/systemd/system/branchleft-docker-user-policy.service
      register: control_plane_verify_isolation
      loop_control:
        label: '{{ item }}'

    - name: Assert the isolation reconciler and its unit are byte-equal to their sources
      ansible.builtin.assert:
        that:
          - verify_reconciler_content == control_plane_verify_sources['branchleft_docker_user_policy.sh']
          - verify_unit_content == control_plane_verify_sources['branchleft-docker-user-policy.service']
        quiet: true
        fail_msg: The isolation reconciler or its unit differs from its source.
      vars:
        verify_reconciler_content: '{{ control_plane_verify_isolation.results[0].content | ansible.builtin.b64decode }}'
        verify_unit_content: '{{ control_plane_verify_isolation.results[1].content | ansible.builtin.b64decode }}'
      no_log: true

    - name: Read the reconciler's mode
      ansible.builtin.stat:
        path: /usr/local/sbin/branchleft-docker-user-policy
      register: control_plane_verify_reconciler_stat

    - name: Assert the reconciler is root-owned and mode 0755
      ansible.builtin.assert:
        that:
          - control_plane_verify_reconciler_stat.stat.mode == '0755'
          - control_plane_verify_reconciler_stat.stat.pw_name == 'root'
        quiet: true
        fail_msg: The reconciler is not root-owned with mode 0755; systemd runs it as root at every boot.

    # Last, so the log holds every apply above, the two with different values too.
    # Both marker prefixes contain THROWAWAY-.
    - name: Read the run's log on the controller
      ansible.builtin.slurp:
        src: '{{ lookup("ansible.builtin.env", "ANSIBLE_LOG_PATH") }}'
      register: control_plane_verify_log
      delegate_to: localhost
      no_log: true

    - name: Assert the secrets are absent from the run's log
      ansible.builtin.assert:
        that:
          - "'THROWAWAY-' not in (control_plane_verify_log.content | ansible.builtin.b64decode)"
        quiet: true
        fail_msg: A secret appears in the run's log.
      no_log: true

# The owner, group and mode a secret file is created and corrected with come from the
# entry the lookup finds BY PATH, never by position in the list. This play runs on the
# controller only. It loads the role's own variables, then reverses the list, so a
# lookup by position (entry 0 or 1) would hand each file the other file's values and
# fail here. Its set_fact sets facts on localhost alone and never reaches the instance.
- name: Check the lookups find each secret file's entry by its path
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    verify_repo: '{{ playbook_dir }}/../../../../../'
  vars_files:
    - '{{ verify_repo }}ansible/roles/control_plane/vars/main.yml'
  tasks:
    - name: Reverse the secret file list, so that position and path give different entries
      ansible.builtin.set_fact:
        control_plane_secret_files: '{{ control_plane_secret_files | reverse | list }}'

    - name: Assert the lookups find each file's entry by path in the reversed list
      ansible.builtin.assert:
        that:
          - control_plane_env_secret.path == control_plane_env_file
          - control_plane_env_secret.owner == 'root'
          - control_plane_env_secret.group == 'root'
          - control_plane_env_secret.mode == '0600'
          - control_plane_masterkey_secret.path == control_plane_masterkey_file
          - control_plane_masterkey_secret.owner == '1000'
          - control_plane_masterkey_secret.group == '1000'
          - control_plane_masterkey_secret.mode == '0400'
        quiet: true
        fail_msg: A lookup took the owner, group or mode of the other secret file.

    - name: Leave only the master key's entry in the list
      ansible.builtin.set_fact:
        control_plane_secret_files: '{{ control_plane_secret_files | selectattr("path", "equalto", control_plane_masterkey_file) | list }}'

    - name: Look up the environment file's entry in a list that has none
      ansible.builtin.set_fact:
        control_plane_verify_probe: '{{ control_plane_env_secret.owner }}'
      ignore_errors: true
      register: control_plane_verify_missing

    - name: Assert a list without the environment file's entry fails the lookup
      ansible.builtin.assert:
        that:
          - control_plane_verify_missing is failed
        quiet: true
        fail_msg: A lookup for a file with no entry in the list did not fail.
