---
# The role's container-only test (ANS-15). The harness in ansible/harness
# sets ROLE_TEST_RUN_ID, so the instance name is unique to one run and a
# destroy can only ever remove this run's container. Molecule's interpolation
# has no "required variable" form, so when the variable is unset the name
# falls back to one the Docker daemon rejects: the run fails at create, loudly,
# instead of sharing a container name with another run.
dependency:
  name: galaxy
  # The harness installs the pinned collections before it starts Molecule.
  enabled: false
driver:
  name: docker
platforms:
  - name: 'role-test-${ROLE_TEST_RUN_ID:-unset/use-the-harness}'
    # Third-party systemd test base on Debian 13, the same base and the same
    # settings as the monitoring_stack scenario, which the role is copied from.
    # The digest is the pin; the tag is informational and moves weekly. The role
    # installs a unit and reloads systemd, so the platform runs systemd as PID 1.
    image: geerlingguy/docker-debian13-ansible:latest@sha256:979c0d5e12b0035fff1c46bd4dfd00d67cd82fa48035194f14f32e01c8c02372
    # Pre-built, so that the reference can carry a digest.
    pre_build_image: true
    keep_volumes: false
    # No privileged mode and no added capabilities. The host cgroup namespace is
    # the stated exception (ANS-15) the monitoring_stack scenario records.
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    labels:
      branchleft.role-test-run: '${ROLE_TEST_RUN_ID}'
provisioner:
  name: ansible
  env:
    # Every step of one run appends to this file, so the verify play can look
    # through all of the run's output for a secret. It lives in the scenario's
    # ephemeral directory, which destroy removes.
    ANSIBLE_LOG_PATH: '${MOLECULE_EPHEMERAL_DIRECTORY}/ansible.log'
  inventory:
    group_vars:
      all:
        # The Docker and systemd bring-up is off in the container: the test has
        # no Docker daemon and no DOCKER-USER chain. Files, modes and the
        # write-once secrets are what this scenario proves.
        control_plane_bring_up: false
        control_plane_start_units: false
        # A made-up digest; nothing pulls it, because nothing runs Compose here.
        control_plane_app_image: example.invalid/example-app@sha256:2222222222222222222222222222222222222222222222222222222222222222
        # Throwaways made from the harness's run id: never committed, and the
        # verify play looks for them in the run's log.
        scenario_secret: "THROWAWAY-{{ lookup('ansible.builtin.env', 'ROLE_TEST_RUN_ID') }}"
        control_plane_env_content: 'CONTROL_PLANE_DB_ADMIN_PASSWORD={{ scenario_secret }}'
        control_plane_masterkey: 'MASTERKEY-{{ scenario_secret }}'
verifier:
  name: ansible
