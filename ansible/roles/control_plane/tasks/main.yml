---
# The runbook's order, step for step: what the run needs, settled before anything is
# written; host directories, the environment file and the master key (each written
# only when absent), the stack's files, the bring-up of the database and then the
# sign-in service (only on a host where the stack is not yet deployed), the stack's
# unit and the deploy wrapper, and last the DOCKER-USER isolation policy.

# ----- What the run needs, settled before anything is written -----
# The two secrets are write-once, so a file that already holds a value never needs its
# content given. A file that is absent or empty does, and without it the run stops here,
# before a directory, a file or a container is touched. The refusals name an input and a
# path and never a value.
- name: Look at the environment file before anything is written
  ansible.builtin.stat:
    path: '{{ control_plane_env_file }}'
    get_checksum: false
  register: control_plane_env_before

- name: Look at the master key before anything is written
  ansible.builtin.stat:
    path: '{{ control_plane_masterkey_file }}'
    get_checksum: false
  register: control_plane_masterkey_before

- name: Refuse an absent or empty environment file when no content was given
  ansible.builtin.assert:
    that:
      - (control_plane_env_before.stat.size | default(0)) > 0 or (control_plane_env_content | default('', true) | string | length) > 0
    quiet: true
    fail_msg: >-
      control_plane[env-missing]: {{ control_plane_env_file }} is absent or empty on this host and
      control_plane_env_content was not given. Nothing was written. A file that holds a value is
      never rewritten, so the content is needed only for a host that has none.

- name: Refuse an absent or empty master key when no content was given
  ansible.builtin.assert:
    that:
      - (control_plane_masterkey_before.stat.size | default(0)) > 0 or (control_plane_masterkey | default('', true) | string | length) > 0
    quiet: true
    fail_msg: >-
      control_plane[masterkey-missing]: {{ control_plane_masterkey_file }} is absent or empty on this
      host and control_plane_masterkey was not given. Nothing was written. A file that holds a value
      is never rewritten, so the key is needed only for a host that has none.

# The image is not a secret. When none is given, the role reads the one the running
# stack was created from, so a first run keeps it. Both commands only read, so they run
# in check mode too and change nothing.
- name: Look for the portal container of the stack
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
      - --quiet
      - --filter
      - 'label=com.docker.compose.project={{ control_plane_project_name }}'
      - --filter
      - 'label=com.docker.compose.service=portal'
      - --filter
      - 'label=com.docker.compose.oneoff=False'
  register: control_plane_portal_ids
  changed_when: false
  check_mode: false
  when: control_plane_reads_docker | ansible.builtin.bool

- name: Read the image the portal container was created from
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - '{% raw %}{{.Config.Image}}{% endraw %}'
      - '{{ control_plane_portal_ids.stdout_lines | first }}'
  register: control_plane_portal_image
  changed_when: false
  check_mode: false
  when:
    - control_plane_reads_docker | ansible.builtin.bool
    - control_plane_portal_ids.stdout_lines | length > 0

# A stack is deployed when its portal container exists. The image used is the one given,
# or else the one that container runs.
- name: Work out whether the stack is deployed and which image this run uses
  ansible.builtin.set_fact:
    control_plane_deployed: '{{ (control_plane_portal_ids.stdout_lines | default([])) | length > 0 }}'
    control_plane_effective_image: >-
      {{ control_plane_app_image if (control_plane_image_given | ansible.builtin.bool)
      else ((control_plane_portal_image.stdout | default('')) | trim) }}

- name: Refuse a run with no image to deploy
  ansible.builtin.assert:
    that:
      - control_plane_effective_image | length > 0
    quiet: true
    fail_msg: >-
      control_plane[image-missing]: control_plane_app_image was not given and no portal container of
      the stack {{ control_plane_project_name }} exists to read the running image from. Nothing was written.
      Give the digest-pinned image for a host that has no running stack.

- name: Refuse an image that is not pinned by digest
  ansible.builtin.assert:
    that:
      - control_plane_effective_image is ansible.builtin.match(control_plane_image_pattern)
    quiet: true
    fail_msg: >-
      control_plane[image-not-pinned]: the image '{{ control_plane_effective_image }}' is not NAME@sha256:
      followed by 64 lower-case hex digits, which the deploy wrapper requires. Nothing was written.

- name: Create the host configuration directories of the control plane
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
  loop: '{{ control_plane_host_dirs }}'
  loop_control:
    label: '{{ item.path }}'

# Each secret is written once, in two steps, so that no file holding a value is
# ever readable by anyone but its owner. Ansible puts a new file in place at the
# mode 0666 minus the umask and sets the role's mode only afterwards, so a file
# created with its content is briefly 0644 in /etc/branchleft (0755). So the file
# is created EMPTY first, at its final owner and mode: a wider mode for a moment
# shows nothing. The content then goes into the existing file, and Ansible keeps
# an existing destination's mode and owner when it moves new content over it.
- name: Create the environment file empty, if it is absent
  ansible.builtin.copy:
    content: ''
    dest: '{{ control_plane_env_file }}'
    owner: '{{ control_plane_env_secret.owner }}'
    group: '{{ control_plane_env_secret.group }}'
    mode: '{{ control_plane_env_secret.mode }}'
    force: false

# The master key is written the same way, and never overwritten once it holds a value.
- name: Create the master key empty, if it is absent
  ansible.builtin.copy:
    content: ''
    dest: '{{ control_plane_masterkey_file }}'
    owner: '{{ control_plane_masterkey_secret.owner }}'
    group: '{{ control_plane_masterkey_secret.group }}'
    mode: '{{ control_plane_masterkey_secret.mode }}'
    force: false

# Every run sets the owner, group and mode of both secret files, so a file widened
# by hand is put back at the next run. The task changes attributes only, never content.
# It runs after BOTH create-empty tasks and before EVERY fill task: a fill writes
# through the existing file, which keeps its owner and mode while the content moves,
# so an attribute left wide until after the fill would expose the content.
# The stat comes first because check mode creates nothing: the create-empty tasks
# above leave a file absent in check mode, so there a file still absent is skipped.
# In a real run the create-empty tasks have made both files, and an absent file
# fails here. The file diff holds owner, group and mode only, never content (ANS-16).
- name: Look at each secret file before its owner, group and mode are set
  ansible.builtin.stat:
    path: '{{ item.path }}'
    get_checksum: false
  loop: '{{ control_plane_secret_files }}'
  register: control_plane_secret_file_stats
  loop_control:
    label: '{{ item.path }}'

- name: Set the owner, group and mode of each secret file on every run
  ansible.builtin.file:
    path: '{{ item.item.path }}'
    state: file
    owner: '{{ item.item.owner }}'
    group: '{{ item.item.group }}'
    mode: '{{ item.item.mode }}'
  loop: '{{ control_plane_secret_file_stats.results }}'
  loop_control:
    label: '{{ item.item.path }}'
  when: not ansible_check_mode or item.stat.exists

- name: Look at the environment file
  ansible.builtin.stat:
    path: '{{ control_plane_env_file }}'
    get_checksum: false
  register: control_plane_env_stat

# The condition is the write-once rule: the content is written only while the file
# is empty, so a file that holds a value is never changed. A run that stopped
# between the two steps left an empty file, and the next run fills it.
- name: Write the environment file's content while the file is empty
  ansible.builtin.copy:
    content: '{{ control_plane_env_content }}'
    dest: '{{ control_plane_env_file }}'
    owner: '{{ control_plane_env_secret.owner }}'
    group: '{{ control_plane_env_secret.group }}'
    mode: '{{ control_plane_env_secret.mode }}'
    force: true
  no_log: true
  diff: false
  when: not control_plane_env_stat.stat.exists or control_plane_env_stat.stat.size == 0

- name: Look at the master key
  ansible.builtin.stat:
    path: '{{ control_plane_masterkey_file }}'
    get_checksum: false
  register: control_plane_masterkey_stat

- name: Write the master key's content while the file is empty
  ansible.builtin.copy:
    content: '{{ control_plane_masterkey }}'
    dest: '{{ control_plane_masterkey_file }}'
    owner: '{{ control_plane_masterkey_secret.owner }}'
    group: '{{ control_plane_masterkey_secret.group }}'
    mode: '{{ control_plane_masterkey_secret.mode }}'
    force: true
  no_log: true
  diff: false
  when: not control_plane_masterkey_stat.stat.exists or control_plane_masterkey_stat.stat.size == 0

- name: Create the project directory of the control-plane stack
  ansible.builtin.file:
    path: '{{ control_plane_project_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

# Copied with explicit modes, not rsync. The runbook's rsync used --delete, so a
# file removed from the repository was removed from the host; this does not
# delete, and a file dropped from the list stays on the host until removed by hand.
- name: Deliver the stack's files
  ansible.builtin.copy:
    src: 'stack/{{ item }}'
    dest: '{{ control_plane_project_dir }}/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ control_plane_stack_files }}'

# The next four tasks (the database start, the init phase and its stamp, the sign-in
# service start) are for a host where the stack is not yet deployed: they start the database
# and the sign-in service before the unit can start the applications. Where the stack
# already runs they are skipped, and the deploy wrapper below is the only thing that touches
# the containers. The wrapper restarts the unit, and the unit reads the project with its own
# environment: the EnvironmentFile pair of branchleft-compose@.service, read by systemd, the
# project name in compose.yml and the project directory. A direct `docker compose --env-file`
# here reads the same env file with Compose's own parser, and a value it parses differently
# (a $, a # or a quote in a password) is a changed config, which Compose answers by recreating
# the container. On a running stack that would be a database restart for nothing.
- name: Start the database and wait until it is healthy
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - '{{ control_plane_env_file }}'
      - up
      - -d
      - --wait
      - db
    chdir: '{{ control_plane_project_dir }}'
  environment:
    IMAGE: '{{ control_plane_effective_image }}'
  # Compose itself reports the containers it started or left alone, and --wait
  # fails the task when the database is not healthy. The task reports no change
  # so that a second apply of the same commit reports zero changes. no_log: Compose
  # quotes a line of the environment file when it cannot parse it, and a line can
  # hold a value.
  changed_when: false
  no_log: true
  when:
    - control_plane_bring_up | ansible.builtin.bool
    - not (control_plane_deployed | ansible.builtin.bool)

- name: Read whether the sign-in service's init phase has run
  ansible.builtin.stat:
    path: '{{ control_plane_init_stamp }}'
  register: control_plane_init_stat

# The init phase creates the sign-in service's own login and database. It needs
# the database administrator's credential, which only compose.init.yml carries,
# so it runs once here and never from the unit. The stamp records that it ran.
- name: Run the sign-in service's init phase once, on a fresh database
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - '{{ control_plane_env_file }}'
      - -f
      - compose.yml
      - -f
      - compose.init.yml
      - run
      - --rm
      - zitadel
    chdir: '{{ control_plane_project_dir }}'
  environment:
    IMAGE: '{{ control_plane_effective_image }}'
  changed_when: true
  no_log: true
  when:
    - control_plane_bring_up | ansible.builtin.bool
    - not (control_plane_deployed | ansible.builtin.bool)
    - not control_plane_init_stat.stat.exists

- name: Record that the init phase has completed
  ansible.builtin.file:
    path: '{{ control_plane_init_stamp }}'
    state: touch
    owner: root
    group: root
    mode: '0600'
  when:
    - control_plane_bring_up | ansible.builtin.bool
    - not (control_plane_deployed | ansible.builtin.bool)
    - not control_plane_init_stat.stat.exists

- name: Start the sign-in service and wait until it is healthy
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - '{{ control_plane_env_file }}'
      - up
      - -d
      - --wait
      - zitadel
    chdir: '{{ control_plane_project_dir }}'
  environment:
    IMAGE: '{{ control_plane_effective_image }}'
  # As for the database: --wait fails the task when the service is not healthy,
  # and the task reports no change so a second apply reports zero changes.
  changed_when: false
  no_log: true
  when:
    - control_plane_bring_up | ansible.builtin.bool
    - not (control_plane_deployed | ansible.builtin.bool)

- name: Enable the stack's unit
  ansible.builtin.systemd_service:
    name: '{{ control_plane_stack_unit }}'
    enabled: true
  when: control_plane_start_units | ansible.builtin.bool

# The wrapper writes the digest pin, starts the four services, waits for each to
# be healthy and restores the previous pin if the start fails. It reports its own
# outcome in its exit status, so a failure stops the run here.
- name: Start the stack through the deploy wrapper with the pinned image
  ansible.builtin.command:
    argv:
      - '{{ control_plane_deploy_wrapper }}'
      - control-plane
      - '{{ control_plane_effective_image }}'
  changed_when: false
  when: control_plane_start_units | ansible.builtin.bool

- name: Read the stack's unit as systemd holds it
  ansible.builtin.systemd_service:
    name: '{{ control_plane_stack_unit }}'
  register: control_plane_stack_unit_state
  when: control_plane_start_units | ansible.builtin.bool

- name: Refuse a stack unit that is not active after the deploy
  ansible.builtin.assert:
    that:
      - control_plane_stack_unit_state.status.ActiveState == 'active'
    quiet: true
    fail_msg: 'The stack unit is {{ control_plane_stack_unit_state.status.ActiveState }}, not active, after the deploy wrapper ran.'
  when: control_plane_start_units | ansible.builtin.bool

# The reconciler and its unit are stay-as-code programs: the role installs them
# byte for byte from the repository and does not rewrite them. The installer the
# runbook ran restarted the unit on every run; here the restart happens only
# when the reconciler or its unit changed. The unit runs at every boot and is
# PartOf docker.service, so it is reasserted after a Docker restart either way.
- name: Install the DOCKER-USER isolation reconciler
  ansible.builtin.copy:
    src: branchleft_docker_user_policy.sh
    dest: '{{ control_plane_isolation_reconciler }}'
    owner: root
    group: root
    mode: '0755'
  register: control_plane_reconciler

- name: Install the isolation policy's unit
  ansible.builtin.copy:
    src: branchleft-docker-user-policy.service
    dest: '{{ control_plane_isolation_unit }}'
    owner: root
    group: root
    mode: '0644'
  register: control_plane_isolation_unit_file
  notify: Reload systemd manager

- name: Load the isolation policy's unit before the role goes on
  ansible.builtin.meta: flush_handlers

- name: Enable the isolation policy's unit
  ansible.builtin.systemd_service:
    name: '{{ control_plane_isolation_unit_name }}'
    enabled: true
  when: control_plane_start_units | ansible.builtin.bool

- name: Apply the isolation policy when its reconciler or its unit changed
  ansible.builtin.systemd_service:
    name: '{{ control_plane_isolation_unit_name }}'
    state: restarted
  when:
    - control_plane_start_units | ansible.builtin.bool
    - control_plane_reconciler is ansible.builtin.changed or control_plane_isolation_unit_file is ansible.builtin.changed
