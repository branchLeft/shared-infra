# Written by the tunnel_account role. The tunnel account may hold the one forward
# in each direction the unit asks for, with a key, and run no command.
Match User dbtunnel
    AuthorizedKeysFile /etc/ssh/branchleft-db-tunnel/authorized_keys
    AuthenticationMethods publickey
    AllowTcpForwarding yes
    PermitListen 127.0.0.1:13306
    PermitOpen 127.0.0.1:9104
    GatewayPorts no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/sbin/nologin
# Ends the Match block, so the lines after this drop-in are not read as part of it.
Match all
