---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    # No variable is set: the role runs with its defaults, which is how the
    # ops1 playbook applies it.
    - name: Apply the role
      ansible.builtin.include_role:
        # Molecule links the role under its namespace and name, the namespace
        # from galaxy_info in meta/main.yml.
        name: branchleft.status_page
