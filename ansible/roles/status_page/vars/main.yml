---
# Constants of the page, not inputs, so they live here and not in defaults/. The
# image is Gatus v5.37.0 (released 2026-09-24) pinned by its index digest: the tag
# is for a reader, the digest is what is pulled. It is a scratch image with no
# shell, so no in-container healthcheck is possible; the role checks the page from
# the host instead. Both services of the compose file use this one image.
status_page_image: ghcr.io/twin/gatus:v5.37.0@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e

# The registry read key's docker config directory, for the pull. A copy of
# deploy_verifier_registry_docker_dir (a role imports no role): test_registry_key_callers.py holds it.
status_page_registry_docker_config: /etc/branchleft/registry/docker

# The host port the page is published on, on status_page_listen_address.
status_page_port: 8303

# The only addresses the page may be published on: loopback, and ops1's private
# address (hetzner-host/addressPlan.ts HOST_IPS.ops1), which the edge proxies to over
# the private network. The DOCKER-USER policy refuses every source but edge1 on that
# address and this port. Restated here because a role may not read the address plan.
status_page_allowed_listen_addresses:
  - 127.0.0.1
  - 10.20.1.50

# What the guard on the private bind reads: the DOCKER-USER rule that drops every source
# but the gateway on the page's port. The gateway address is the isolation policy's default
# gateway; tests/unit pins the rule as a literal, and the program that loads it must insert
# exactly that rule. The wait is in seconds, for the xtables lock that Docker holds while it edits its
# own rules.
status_page_iptables: /usr/sbin/iptables
status_page_gateway_address: 10.20.1.10
status_page_firewall_wait: 10

status_page_project_dir: /opt/branchleft/status
status_page_project_name: status

# The two configuration files, relative to files/stack (a link to
# hetzner/status/stack, where hetzner/status/render.ts writes them).
status_page_stack_files:
  - config.yaml
  - target.yaml

status_page_stamp_file: '{{ status_page_project_dir }}/.status_page_stamp'

# The health check polls this many seconds apart.
status_page_health_delay: 2

# The 90-day uptime collector (files/branchleft_status_uptime.py). Gatus keeps its own history
# for 32 days at most, so this program records the probe samples itself, from the page's API,
# and works out each component's 90-day uptime from them. Constants, not inputs.
status_page_uptime_program_dir: /opt/branchleft/status-uptime
status_page_uptime_program: branchleft_status_uptime.py
status_page_uptime_python: /usr/bin/python3
# The state directory holds the samples (a directory of its own, root only) and the report
# the timer's service writes after every collection: the one file that carries the figure.
status_page_uptime_state_dir: /var/lib/branchleft/status-uptime
status_page_uptime_samples_dir: '{{ status_page_uptime_state_dir }}/samples'
status_page_uptime_report_file: '{{ status_page_uptime_state_dir }}/report.json'
status_page_uptime_unit_dir: /etc/systemd/system
status_page_uptime_service: branchleft-status-uptime-collect.service
status_page_uptime_timer: branchleft-status-uptime-collect.timer
# The page keeps the last 100 results per endpoint, one a minute, so a collection must run at
# least every 100 minutes to miss none; the timer runs it every 30.
status_page_uptime_every_minutes: 30
