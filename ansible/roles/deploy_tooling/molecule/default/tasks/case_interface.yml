---
# What the role is told. A host's class is never guessed, and an app host names
# its variant.
- name: Run the role with no class
  ansible.builtin.include_tasks: expect_role_failure.yml
  vars:
    expect_label: no host class
    expect_msg: 'deploy_tooling_host_class'
    expect_task: '^Validating arguments'
    run_tasks: run_role_no_class.yml

- name: Run the role with a class it does not know
  ansible.builtin.include_tasks: expect_role_failure.yml
  vars:
    expect_label: unknown host class
    expect_msg: 'deploy_tooling_host_class'
    expect_task: '^Validating arguments'
    run_class: edge

- name: Run the role for an app host with no variant
  ansible.builtin.include_tasks: expect_role_failure.yml
  vars:
    expect_label: app host with no variant
    expect_msg: 'must name its policy variant'
    expect_task: '^Refuse a host class the role cannot act on'
    run_class: app

- name: Run the role for an app host whose variant is not applicable
  ansible.builtin.include_tasks: expect_role_failure.yml
  vars:
    expect_label: app host with the not-applicable variant
    expect_msg: 'must name its policy variant'
    expect_task: '^Refuse a host class the role cannot act on'
    run_class: app
    run_variant: not_applicable
