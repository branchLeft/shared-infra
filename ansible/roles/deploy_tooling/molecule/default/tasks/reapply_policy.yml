---
# Puts the chains back to what Docker leaves and runs the policy program through
# its unit, so a case that damaged the chains leaves them as the policy builds.
- name: Reset the chains to what Docker leaves
  ansible.builtin.include_tasks: reset_chains.yml
  vars:
    deploy_tooling_scenario_ipv6_docker_user: true

- name: Run the policy program through its unit
  ansible.builtin.systemd_service:
    name: '{{ deploy_tooling_policy_unit_name }}'
    state: restarted
