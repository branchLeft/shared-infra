---
# Constants of the role, not inputs: role variables outrank every value a caller
# passes, so a caller cannot change them.

# The shapes the inputs must have. A pin is a full lower-case hex digest.
export_bundler_sha_pattern: '^[0-9a-f]{40}$'
export_bundler_checksum_pattern: '^[0-9a-f]{64}$'
# The only files the bundler is made of: its package.json, which says the output is a
# module, and the flat directory of compiled files tsc writes.
export_bundler_release_path_pattern: '^(package\.json|dist/[A-Za-z0-9]+\.js)$'
# An absolute path of letters, digits, dot, underscore, hyphen and slash.
export_bundler_path_pattern: '^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
export_bundler_path_dots_pattern: '(^|/)\.{1,2}(/|$)'

# Where the role's copy of the bundler is, on the machine that runs the role. A constant,
# not an input: a caller's play or inventory variables cannot change it. Only the role's
# refusals scenario overrides it, with a task variable on its include_role, to point at a
# copy it has altered. Nothing is read from the network.
export_bundler_vendored_root: '{{ role_path }}/files/ghost-platform/services/export-bundler'

# The directories under the host's bundler directory and state directory.
export_bundler_dist_dir: '{{ export_bundler_dir }}/dist'
export_bundler_commit_file: '{{ export_bundler_dir }}/COMMIT'
export_bundler_state_subdirs:
  - '{{ export_bundler_state_dir }}/flags'
  - '{{ export_bundler_state_dir }}/out'

# The files the host's dist directory may hold, as host paths: the release files under
# dist/ and nothing else.
export_bundler_dist_paths: >-
  {{ export_bundler_release_files
     | map(attribute='path')
     | select('match', '^dist/')
     | map('regex_replace', '^', export_bundler_dir ~ '/')
     | list }}

# The pinned files whose copy shows no diff (ANS-16). Each one has a line the plan's secret scan
# matches, a variable name or a prose word and no secret, so a diff of it would withhold the
# whole plan of the host. Their copy task sets diff: false; every other pinned file keeps its
# diff. The rule is to hide only the files that match, with no exemption list.
# ansible/checks/test_plan_diff_scan.py fails for a file listed here that does not match, and
# for a matching file that is not.
export_bundler_release_files_hidden:
  - dist/cli.js
  - dist/colourIsolation.js
  - dist/ghostExportClient.js
  - dist/operatorToken.js
  - dist/scratchDatabase.js

# ----- The restricted export account (tasks/_entry.yml) -----
# Constants, not inputs: a caller's variables cannot move any of them. The only input is the
# controller's public key, export_bundler_controller_key, from host_inputs.

# The account the controller's key logs in as. It has a shell because sshd runs a forced command
# through the account's shell (a nologin shell would ignore the command), no password, and no home:
# its key file is root's, in a directory of its own, so the account cannot add a key or loosen its
# own restrictions.
export_bundler_entry_account: promoexport
export_bundler_entry_shell: /bin/sh
export_bundler_entry_home: /nonexistent

# The forced-command program, installed from this role's files/ directory.
export_bundler_entry_program_source: export_entry.py
export_bundler_entry_program_path: /usr/local/sbin/branchleft-export-entry

# sudo is named by its full path and `-n` makes it fail rather than ask for a password.
export_bundler_entry_sudo_path: /usr/bin/sudo
export_bundler_entry_sudoers_path: /etc/sudoers.d/61-branchleft-export-entry

# The key file sshd reads for the account, and the sshd settings that confine it. Both are root's.
export_bundler_entry_keys_dir: /etc/ssh/branchleft-export-entry
export_bundler_entry_authorized_keys_path: /etc/ssh/branchleft-export-entry/authorized_keys
export_bundler_entry_sshd_config_dir: /etc/ssh/sshd_config.d
export_bundler_entry_sshd_dropin: /etc/ssh/sshd_config.d/43-branchleft-export-entry.conf
export_bundler_entry_sshd: /usr/sbin/sshd
export_bundler_entry_sshd_service: ssh

# What the export needs on the host. The Node runtime is the one broker_deploy installs (a test holds
# the path equal to that role's); Docker must be 28 or newer, as the bundler itself requires.
export_bundler_entry_node: /opt/branchleft/broker/node/bin/node
export_bundler_entry_docker: /usr/bin/docker
export_bundler_entry_docker_min_major: 28
# Docker's own template, escaped so Ansible does not evaluate it.
export_bundler_entry_docker_version_format: '{% raw %}{{.Server.Version}}{% endraw %}'

# The shape of the one key line: ed25519 only, the whole line, no comment, no option. 68 characters
# of base64 follow the key type: the 25 every ed25519 key starts with, then 43 more. \Z, not $,
# because $ also matches before a trailing line break.
export_bundler_entry_key_pattern: '^ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI[A-Za-z0-9+/]{43}\Z'
