# Where the role's copy of the bundler is, on the machine that runs the role. Only the
# role's tests change it, to point at a copy they have altered; no host's variables do.
export_bundler_vendored_root: '{{ role_path }}/files/ghost-platform/services/export-bundler'

# Where the bundler goes on the host (the export runbook's Deliver step 4), and the
# directory the export runs keep their flags, output, audit log and descriptors in (Run
# step 2). Both are root's and closed to everyone else.
export_bundler_dir: /root/export-bundler
export_bundler_state_dir: /root/export-bundler-state
