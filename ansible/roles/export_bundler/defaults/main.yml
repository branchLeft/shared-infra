---
# Nothing here is private. The role has no secret input and no required input:
# every value below has a default, and the pinned bundler is public.

# The one home of the export bundler's source is branchLeft/ghost-platform, at
# services/export-bundler. This role carries a built copy of it under
# files/ghost-platform, at the same paths, and the host takes it from the signed
# commit CI pushes to it; the host never fetches it from anywhere. Each file is held
# to the sha256 below, on the machine that runs the role, before the role writes
# anything to the host. The commit below is the last ghost-platform commit that
# changed the bundler's build inputs (its source, lock file, tsconfig files and
# package.json): it is the record of where the bytes came from, and the role writes
# it to the host's COMMIT file. A bump rebuilds at the new commit and changes the
# files under files/ghost-platform, this commit and every checksum in one change
# (README, "Vendored files"): a copy that does not match its pin stops the role before
# it writes.
export_bundler_source_sha: 5fb63577cb5850b351c964caa49c93a382516367

# Every file the role carries, one path and one sha256 each, relative to the bundler's
# own directory (services/export-bundler). The role writes exactly these files to the
# host, and removes anything else under the host's dist directory.
