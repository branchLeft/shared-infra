[project]
name = "export-bundler-role"
version = "0.0.0"
# The oldest interpreter any target host provides (PY-3): Debian 13 ships Python 3.13.
requires-python = ">=3.13"

[tool.mypy]
strict = true
disallow_any_explicit = true
python_version = "3.13"
# The forced command is a single file in files/, imported by the tests by its own name.
mypy_path = "$MYPY_CONFIG_FILE_DIR/files"

# PyYAML ships no type information. This names the one module; it is not a blanket ignore.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.ruff]
# The repository's ruff policy (ansible/pyproject.toml), with this role's Python floor.
extend = "../../pyproject.toml"
target-version = "py313"

# The tests raise AssertionError from their own helpers to fail a test, as unittest expects, and
# build the process stand-ins the program is run against.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TRY003", "TRY004", "DOC501", "S101", "S603", "S607", "S108"]
