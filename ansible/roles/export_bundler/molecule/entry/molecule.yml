---
# The role's restricted export account, served by a real sshd (ANS-15). The harness in
# ansible/harness sets ROLE_TEST_RUN_ID, so the instance name is unique to one run and a destroy can
# only ever remove this run's container. Molecule's interpolation has no "required variable" form,
# so when the variable is unset the name falls back to one the Docker daemon rejects: the run fails
# at create, loudly, instead of sharing a container name with another run.
#
# The default, plan and refusals scenarios run on a plain Python image and never start a service.
# This one starts the SSH server the forced command depends on, so it needs systemd as PID 1.
dependency:
  name: galaxy
  # The harness installs the pinned collections before it starts Molecule.
  enabled: false
driver:
  name: docker
platforms:
  - name: 'role-test-${ROLE_TEST_RUN_ID:-unset/use-the-harness}'
    # Third-party systemd test base on Debian 13, the release every production host runs, trusted
    # by digest. The digest is the pin; the tag is informational and moves weekly. The role reloads
    # the ssh service, so the platform runs systemd as PID 1, a platform the author justifies here,
    # per ANS-15.
    image: geerlingguy/docker-debian13-ansible:latest@sha256:979c0d5e12b0035fff1c46bd4dfd00d67cd82fa48035194f14f32e01c8c02372
    # Pre-built, so that the reference can carry a digest.
    pre_build_image: true
    # Destroy removes the container's anonymous volumes. This scenario's cgroup bind mount means
    # none is created; the key guards against one if the mount is ever dropped.
    keep_volumes: false
    # No privileged mode and no added capabilities. The mounts, the cgroup namespace and the
    # command below are the whole set this image needs to run systemd (measured by the
    # files_and_units pattern, which this block copies). The host cgroup namespace is a stated
    # exception (ANS-15): on a cgroup v2 host a private namespace over the read-write cgroup mount
    # makes systemd exit at once, and the host namespace is the least privilege that works. The test
    # image is trusted by digest and the job holds no credentials.
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    # Start systemd as the init process, the image's own CMD.
    command: /lib/systemd/systemd
    labels:
      branchleft.role-test-run: '${ROLE_TEST_RUN_ID}'
provisioner:
  name: ansible
  env:
    # Every Ansible run of this scenario appends its output to one log on the controller, and
    # verify reads it. Verbosity 3 prints each task's result with the arguments it was given, so a
    # task that handles a key and lacks no_log shows it in the log, and verify fails (ANS-16).
    ANSIBLE_LOG_PATH: '${MOLECULE_EPHEMERAL_DIRECTORY}/ansible.log'
    ANSIBLE_VERBOSITY: '3'
  inventory:
    group_vars:
      all:
        scenario_log_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/ansible.log"
        # The role's own constants, spelled out here so that a change of a constant fails the
        # scenario instead of being followed by it.
        scenario_account: promoexport
        scenario_program: /usr/local/sbin/branchleft-export-entry
        scenario_keys_dir: /etc/ssh/branchleft-export-entry
        scenario_key_file: /etc/ssh/branchleft-export-entry/authorized_keys
        scenario_dropin: /etc/ssh/sshd_config.d/43-branchleft-export-entry.conf
        scenario_sudoers: /etc/sudoers.d/61-branchleft-export-entry
        scenario_state_dir: /root/export-bundler-state
        scenario_lock: /run/lock/branchleft-export-entry.lock
        scenario_node: /opt/branchleft/broker/node/bin/node
        scenario_bundler_cli: /root/export-bundler/dist/cli.js
        # The scenario's own: the test server's port, the keys it makes, and where its stand-ins
        # (the Node runtime and Docker) keep what they were asked.
        scenario_ssh_port: 2222
        scenario_key_dir: /root/entry-test-keys
        scenario_record_dir: /var/lib/entry-test
        scenario_calls: /var/lib/entry-test/calls
        scenario_docker_version_file: /var/lib/entry-test/docker-version
        # The made-up request. The recipient is `age1` and 58 characters of the bech32 alphabet,
        # and belongs to no key. The sign-in value is the line the stand-in bundler reads from its
        # standard input: a canary, so the log scan can tell that nothing printed it.
        scenario_slot: demo-3
        scenario_recipient: age1qpzry9x8gf2tvdw0s3jn54khce6mua7lqpzry9x8gf2tvdw0s3jn54khce
        scenario_date: '2027-03-01'
        scenario_port: 20123
        scenario_reference: grant-ok
        scenario_signin: SCENARIO-SIGNIN-CANARY
verifier:
  name: ansible
