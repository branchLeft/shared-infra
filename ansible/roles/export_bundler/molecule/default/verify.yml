---
# What the role must leave behind, with the expected values written out here and not read
# from the role, so a role that left something else is a failure and not a test that agrees
# with it. The checksums are those of a clean build of the pinned ghost-platform commit.
- name: Verify the instance
  hosts: all
  gather_facts: false
  vars:
    export_bundler_verify_pins:
      - path: package.json
        sha256: 1a29600ba3984910e8d1ee34d7310e63ae0525898723cca6a24812ea71755711
      - path: dist/ageEncryption.js
        sha256: 5d3d46c656b0a42814126f2c9e4ad8773d4d4147b0351db66d0c3a137fa91a5d
      - path: dist/archive.js
        sha256: 7f01cc5071cb96e1f4a2a47d1ffbcf4ffcd03bc51e0acff75aa291dc9b052dc0
      - path: dist/auditLog.js
        sha256: 29e000b93d239152a1aaded73947bd9b933a68caa88c4fc8639cab3616eed466
      - path: dist/cleanup.js
        sha256: 643d3ba13c3acabcb42da0548e06f4b37229351edc9acf2a20092aee68ab5424
      - path: dist/cli.js
        sha256: 9699e83d55d2acd5f0cf10a96afbca0720324e76c7968f0efa39e3089a6c4472
      - path: dist/colourIsolation.js
        sha256: 1078eb0e9f39f279cfe472471505e42649525d496d4efd902f4634c878273869
      - path: dist/containerRunner.js
        sha256: 14254363faf0992efbc57889d65d8ebf79f8d8d947e5dc64e84f8584c18f43c9
      - path: dist/drainFlag.js
        sha256: eeb30a75701f3125dd1a71cf57735d6a505e386570472b3533e1c6a6b41afc1b
      - path: dist/drainFlagStore.js
        sha256: 91cce7c93980dbfa4e2ceddf7cbb33011e30d67f98d0bc9dadce25adccf07320
      - path: dist/drainGate.js
        sha256: 4d53bc33d89b8a16d6343186cdf606c16b8c654b0528778c40b49dfd61df5468
      - path: dist/envFile.js
        sha256: bee446b59aee072d24d8eb990cd2bead2d047427798e150c0777b334d7132a4e
      - path: dist/exportRunner.js
        sha256: 05d5062bdd414ea0891bf3a38a014d0421de5e8ae5c6709f0c051169712ed778
      - path: dist/extensions.js
        sha256: e5670683a2fd8f121ffd05e8425d2375b95bab40dc9adca54505cc7e42950a18
      - path: dist/ghostExportClient.js
        sha256: b15d44c61228791c628ed90e3e96308799eafff00250bd2cb120df2241b0acc7
      - path: dist/ghostProbe.js
        sha256: 4838a3dd9700df5fbc229da4c8f74e76e0c1a38f1a92d8ed86bb5f39a5fabb94
      - path: dist/manifest.js
        sha256: a2af8159955845f7ee433aee773991518f882697d888168f48f2052b704c9fc0
      - path: dist/mediaManifest.js
        sha256: bbd32f13818422b524a712be6a12b91424ef617819832d166f5be98c6e8ce609
      - path: dist/operatorToken.js
        sha256: aa78b11e0965a09dff081d67530f781930c47356ca38c32a656f16de9fdbfb7d
      - path: dist/scratchDatabase.js
        sha256: 5ce49340994b4dd632bfc9cf5248091cd272bff292935433863e660c6185b0bb
      - path: dist/supportAccountProbe.js
        sha256: 8ca8bef4c8518e11c5b489449850a48d51ebb3f790000a1988a72aa65e163632
      - path: dist/supportGrant.js
        sha256: ab3f578b8ec4ad385120d04736c75b0f55656bf275859d509c5f1917c56af0de
      - path: dist/tenantConfig.js
        sha256: 1b025d1eb93cd46558a1e0ffd6c98d918c079e0e175a3c53ae22da786e500c63
  tasks:
    - name: Look at the directories
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop:
        - /root/export-bundler
        - /root/export-bundler/dist
        - /root/export-bundler-state
        - /root/export-bundler-state/flags
        - /root/export-bundler-state/out
      register: export_bundler_verify_dirs

    - name: Assert every directory is a plain directory, root:root, mode 0700
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - not item.stat.islnk
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - item.stat.mode == '0700'
        quiet: true
        fail_msg: '{{ item.item }} is not a root:root 0700 directory.'
      loop: '{{ export_bundler_verify_dirs.results }}'
      loop_control:
        label: '{{ item.item }}'

    - name: Look at each file the release carries, as it is on the host
      ansible.builtin.stat:
        path: '/root/export-bundler/{{ item.path }}'
        follow: false
        checksum_algorithm: sha256
      loop: '{{ export_bundler_verify_pins }}'
      loop_control:
        label: '{{ item.path }}'
      register: export_bundler_verify_files

    - name: Assert each is a plain file, root:root, mode 0600, with its pinned sha256
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - item.stat.mode == '0600'
          - item.stat.checksum == item.item.sha256
        quiet: true
        fail_msg: /root/export-bundler/{{ item.item.path }} is not the pinned file with mode 0600 and owner root.
      loop: '{{ export_bundler_verify_files.results }}'
      loop_control:
        label: '{{ item.item.path }}'

    - name: List everything under the host's dist directory
      ansible.builtin.find:
        paths: /root/export-bundler/dist
        file_type: any
        hidden: true
        recurse: true
        follow: false
      register: export_bundler_verify_dist

    - name: Assert dist holds the 22 pinned files and nothing else
      ansible.builtin.assert:
        that:
          - export_bundler_verify_dist.files | length == 22
          - >-
            export_bundler_verify_dist.files | map(attribute='path') | map('regex_replace', '^/root/export-bundler/', '') | sort | list
            == export_bundler_verify_pins | map(attribute='path') | reject('equalto', 'package.json') | sort | list
        quiet: true
        fail_msg: >-
          The host's dist directory does not hold exactly the pinned files:
          {{ export_bundler_verify_dist.files | map(attribute='path') | sort | join(', ') }}.

    - name: List everything directly under the bundler directory
      ansible.builtin.find:
        paths: /root/export-bundler
        file_type: any
        hidden: true
        recurse: false
        follow: false
      register: export_bundler_verify_top

    - name: Assert the bundler directory holds dist, package.json and COMMIT and nothing else
      ansible.builtin.assert:
        that:
          - >-
            export_bundler_verify_top.files | map(attribute='path') | sort | list
            == ['/root/export-bundler/COMMIT', '/root/export-bundler/dist', '/root/export-bundler/package.json']
        quiet: true

    - name: Read the COMMIT file
      ansible.builtin.slurp:
        src: /root/export-bundler/COMMIT
      register: export_bundler_verify_commit

    - name: Look at the COMMIT file
      ansible.builtin.stat:
        path: /root/export-bundler/COMMIT
        follow: false
      register: export_bundler_verify_commit_stat

    - name: Assert COMMIT is the pinned commit and a newline, root:root 0600
      ansible.builtin.assert:
        that:
          - (export_bundler_verify_commit.content | b64decode).splitlines() == ['5fb63577cb5850b351c964caa49c93a382516367']
          - (export_bundler_verify_commit.content | b64decode) | length == 41
          - export_bundler_verify_commit_stat.stat.isreg
          - export_bundler_verify_commit_stat.stat.pw_name == 'root'
          - export_bundler_verify_commit_stat.stat.mode == '0600'
        quiet: true

    # What the earlier export left. The role does not list, change or remove anything in the
    # state directory, so the contents and their modes are exactly as prepare.yml put them.
    - name: Look at what the earlier export left in the state directory
      ansible.builtin.stat:
        path: '/root/export-bundler-state/{{ item.path }}'
        follow: false
        checksum_algorithm: sha256
      loop:
        - path: audit.jsonl
          mode: '0640'
        - path: earlier.descriptor.json
          mode: '0644'
        - path: flags/earlier.flag
          mode: '0644'
        - path: out/earlier.tar.age
          mode: '0600'
      loop_control:
        label: '{{ item.path }}'
      register: export_bundler_verify_state

    - name: Assert each of them has the mode it had and is a plain file
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.mode == item.item.mode
        quiet: true
        fail_msg: The role changed /root/export-bundler-state/{{ item.item.path }}.
      loop: '{{ export_bundler_verify_state.results }}'
      loop_control:
        label: '{{ item.item.path }}'

    - name: Read the audit line back
      ansible.builtin.slurp:
        src: /root/export-bundler-state/audit.jsonl
      register: export_bundler_verify_audit

    - name: Assert the audit line is the one that was there
      ansible.builtin.assert:
        that:
          - (export_bundler_verify_audit.content | b64decode).splitlines() == ['{"event":"earlier export"}']
          - (export_bundler_verify_audit.content | b64decode) | length == 27
        quiet: true
        fail_msg: The role changed the audit log.

    - name: List the state directory itself
      ansible.builtin.find:
        paths: /root/export-bundler-state
        file_type: any
        hidden: true
        recurse: true
        follow: false
      register: export_bundler_verify_state_all

    - name: Assert nothing was added to the state directory
      ansible.builtin.assert:
        that:
          - export_bundler_verify_state_all.files | map(attribute='path') | sort | list == [
            '/root/export-bundler-state/audit.jsonl',
            '/root/export-bundler-state/earlier.descriptor.json',
            '/root/export-bundler-state/flags',
            '/root/export-bundler-state/flags/earlier.flag',
            '/root/export-bundler-state/out',
            '/root/export-bundler-state/out/earlier.tar.age']
        quiet: true
        fail_msg: >-
          The state directory holds something other than what the earlier export left:
          {{ export_bundler_verify_state_all.files | map(attribute='path') | sort | join(', ') }}.
