---
argument_specs:
  main:
    short_description: Deliver the pinned tenant export bundler to the host and make the export's state directories, without running it
    description: >-
      Copies the export bundler's package.json and its compiled dist files, each
      held to a pinned sha256 on the machine that runs the role, into a root-only
      directory on the host, removes anything else from the host's dist
      directory, writes the ghost-platform commit the files were built from to a
      COMMIT file, and makes the export's state directory with its flags and out
      directories, all root-only. It never runs node, the bundler, docker or age,
      never reads or writes a descriptor, a token or the audit log, and never
      touches anything inside the state directory.
    author: branchLeft
    options:
      export_bundler_source_sha:
        type: str
        description: >-
          The full 40-character ghost-platform commit the role's copy of the
          bundler was built from. It is written to the host's COMMIT file. Bump
          it together with the files under files/ghost-platform and every
          checksum in export_bundler_release_files.
        default: 5fb63577cb5850b351c964caa49c93a382516367
      export_bundler_release_files:
        type: list
        elements: dict
        description: >-
          Every file the role carries, each with its path relative to the
          bundler's directory (services/export-bundler) and its sha256. The role
          stops before it writes anything unless each file under
          files/ghost-platform/services/export-bundler has that sha256, and
          unless no file under its dist directory is missing from this list. The
          list must hold package.json and dist/cli.js, and nothing but
          package.json and files directly under dist/.
        options:
          path:
            type: str
            required: true
            description: The file's path relative to the bundler's directory, package.json or dist/NAME.js.
          sha256:
            type: str
            required: true
            description: The 64-character lower-case sha256 of the file under files/ghost-platform, which is the file built at the pinned commit.
        default:
          - path: package.json
            sha256: 1a29600ba3984910e8d1ee34d7310e63ae0525898723cca6a24812ea71755711
          - path: dist/ageEncryption.js
            sha256: 5d3d46c656b0a42814126f2c9e4ad8773d4d4147b0351db66d0c3a137fa91a5d
          - path: dist/archive.js
            sha256: 7f01cc5071cb96e1f4a2a47d1ffbcf4ffcd03bc51e0acff75aa291dc9b052dc0
          - path: dist/auditLog.js
            sha256: 29e000b93d239152a1aaded73947bd9b933a68caa88c4fc8639cab3616eed466
          - path: dist/cleanup.js
            sha256: 643d3ba13c3acabcb42da0548e06f4b37229351edc9acf2a20092aee68ab5424
          - path: dist/cli.js
            sha256: 9699e83d55d2acd5f0cf10a96afbca0720324e76c7968f0efa39e3089a6c4472
          - path: dist/colourIsolation.js
            sha256: 1078eb0e9f39f279cfe472471505e42649525d496d4efd902f4634c878273869
          - path: dist/containerRunner.js
            sha256: 14254363faf0992efbc57889d65d8ebf79f8d8d947e5dc64e84f8584c18f43c9
          - path: dist/drainFlag.js
            sha256: eeb30a75701f3125dd1a71cf57735d6a505e386570472b3533e1c6a6b41afc1b
          - path: dist/drainFlagStore.js
            sha256: 91cce7c93980dbfa4e2ceddf7cbb33011e30d67f98d0bc9dadce25adccf07320
          - path: dist/drainGate.js
            sha256: 4d53bc33d89b8a16d6343186cdf606c16b8c654b0528778c40b49dfd61df5468
          - path: dist/envFile.js
            sha256: bee446b59aee072d24d8eb990cd2bead2d047427798e150c0777b334d7132a4e
          - path: dist/exportRunner.js
            sha256: 05d5062bdd414ea0891bf3a38a014d0421de5e8ae5c6709f0c051169712ed778
          - path: dist/extensions.js
            sha256: e5670683a2fd8f121ffd05e8425d2375b95bab40dc9adca54505cc7e42950a18
          - path: dist/ghostExportClient.js
            sha256: b15d44c61228791c628ed90e3e96308799eafff00250bd2cb120df2241b0acc7
          - path: dist/ghostProbe.js
            sha256: 4838a3dd9700df5fbc229da4c8f74e76e0c1a38f1a92d8ed86bb5f39a5fabb94
          - path: dist/manifest.js
            sha256: a2af8159955845f7ee433aee773991518f882697d888168f48f2052b704c9fc0
          - path: dist/mediaManifest.js
            sha256: bbd32f13818422b524a712be6a12b91424ef617819832d166f5be98c6e8ce609
          - path: dist/operatorToken.js
            sha256: aa78b11e0965a09dff081d67530f781930c47356ca38c32a656f16de9fdbfb7d
          - path: dist/scratchDatabase.js
            sha256: 5ce49340994b4dd632bfc9cf5248091cd272bff292935433863e660c6185b0bb
          - path: dist/supportAccountProbe.js
            sha256: 8ca8bef4c8518e11c5b489449850a48d51ebb3f790000a1988a72aa65e163632
          - path: dist/supportGrant.js
            sha256: ab3f578b8ec4ad385120d04736c75b0f55656bf275859d509c5f1917c56af0de
          - path: dist/tenantConfig.js
            sha256: 1b025d1eb93cd46558a1e0ffd6c98d918c079e0e175a3c53ae22da786e500c63
      export_bundler_vendored_root:
        type: path
        description: >-
          Absolute path, on the machine that runs the role, of the directory
          that holds package.json and dist/. Only the role's tests change it,
          to point at a copy they have altered; no host's variables do, because
          the enrolment check pins each host's play variables.
        default: '{{ role_path }}/files/ghost-platform/services/export-bundler'
      export_bundler_dir:
        type: path
        description: >-
          Absolute path of the bundler's directory on the host (the runbook's
          /root/export-bundler). Made root:root 0700. A link or a file at this
          path, or at its dist directory, is refused. It must not overlap
          export_bundler_state_dir.
        default: /root/export-bundler
      export_bundler_state_dir:
        type: path
        description: >-
          Absolute path of the export's state directory on the host (the
          runbook's /root/export-bundler-state). It and its flags and out
          directories are made root:root 0700. Nothing inside them is touched.
          A link or a file at any of the three is refused. It must not overlap
          export_bundler_dir.
        default: /root/export-bundler-state
