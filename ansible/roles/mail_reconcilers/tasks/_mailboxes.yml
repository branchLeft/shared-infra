---
# Guarded step mailboxes: create the mailboxes through Stalwart's API. The program
# records what it creates in the mailbox credential file.

- name: Check the install directory and the credential files before mailboxes
  ansible.builtin.import_tasks: _preconditions.yml

# No check-mode run: the program writes accounts and has no preview.
- name: Run mailboxes
  ansible.builtin.command:
    argv:
      - '{{ mail_reconcilers_install_dir }}/{{ mail_reconcilers_wrappers.mailboxes }}'
  environment: '{{ mail_reconcilers_program_environment }}'
  register: mail_reconcilers_run
  changed_when: true
  failed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Refuse a mailboxes run that did not end clean
  ansible.builtin.assert:
    that:
      - mail_reconcilers_run.rc == 0
    quiet: true
    fail_msg: >-
      REFUSED: mailboxes did not end clean (exit {{ mail_reconcilers_run.rc }}). The
      program's output is withheld; its refusal lines: {{ mail_reconcilers_shown_lines }}
  when: not ansible_check_mode
