---
# A request for one or more steps, as the gated pull would make it: this playbook with
# the tags named on the command line and mail_reconcilers_step set with -e. verify.yml
# runs it with ansible-playbook for each case. Molecule's default sequence does not.
- name: Request a step
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the role with the tags named on the command line
      ansible.builtin.include_role:
        name: branchleft.mail_reconcilers
      # always: the include itself must run under --tags, so the role's own tasks
      # are the ones the named tags select.
      tags:
        - always
