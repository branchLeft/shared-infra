---
# Internal to the role. The signing secret, its optional previous copy and the drain token
# are root-owned files the owner places, and the role only asserts them: they are never an
# input, never read into a variable and never written. The file is looked at with stat and no
# checksum (a digest of a secret is a secret, ANS-16), so no byte of it is opened. Everything
# here only reads, so it runs in check mode as well (ANS-10), and it runs before the role
# writes anything, so a missing file stops the run with the host as it was.
#
# Mode 0440 with group 31100 and not 0400: the container runs as 31100 and a file read
# through a bind mount is read as the container's account, whoever wrote it. Owner root, so
# the account that reads the secret cannot replace it.
#
# The file is named for the owner's files and not for what they hold: when a task here fails,
# Ansible prints the task's file and line, and the plan's credential scan reads a word such as
# "secret" followed by a colon as an assignment and withholds the whole host.
- name: Look at each secret file
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: '{{ sweego_receiver_secret_files }}'
  loop_control:
    label: '{{ item }}'
  register: sweego_receiver_secret_stats

# Until the owner has placed any of the files, the receiver is not set up yet, which is not a
# fault: the role says so and ends here, before the drain-port rule or the receiver is
# written, and the rest of the host's pull goes on. It runs in full on the first pull after the
# owner places them. Once any file is there, every file is held to the checks below, so a
# half-finished or wrong placement is still a refusal.
- name: Say the role waits for the owner's files
  ansible.builtin.debug:
    msg: >-
      The owner has not placed the receiver's files yet ({{ sweego_receiver_secret_files | join(', ') }}).
      The role stops here and changes nothing; it runs in full on the first pull after they are placed.
  when: sweego_receiver_secret_stats.results | selectattr('stat.exists') | list | length == 0

- name: End the role until the owner has placed the files
  ansible.builtin.meta: end_role
  when: sweego_receiver_secret_stats.results | selectattr('stat.exists') | list | length == 0

- name: Refuse a secret file that is missing, not root's, not group 31100, not mode 0440, a link or empty
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.uid == 0
      - item.stat.gid == sweego_receiver_gid
      - item.stat.mode == sweego_receiver_secret_mode
      - item.stat.size > 0
    quiet: true
    fail_msg: >-
      {{ item.item }} is missing, is not a regular file, is a link, is not owned by root with group
      {{ sweego_receiver_gid }}, is not mode {{ sweego_receiver_secret_mode }}, or is empty. The owner places
      this file once, as root; the role never writes or generates it, and never reads it.
  loop: '{{ sweego_receiver_secret_stats.results }}'
  loop_control:
    label: '{{ item.item }}'
