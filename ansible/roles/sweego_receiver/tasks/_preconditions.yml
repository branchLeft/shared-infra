---
# Internal to the role. Everything here only reads, so it runs in check mode as well
# (ANS-10). The role relies on what the host baseline and the deploy tooling leave: Docker
# running with its DOCKER-USER chain, the three root-owned directories, and the shared
# compose template unit. It writes none of them, and it refuses, naming the missing piece,
# when one is not as it expects.
- name: Read the host's own short name
  ansible.builtin.command:
    argv: [hostname, -s]
  register: sweego_receiver_hostname
  changed_when: false
  check_mode: false

- name: Refuse any host but edge1
  ansible.builtin.assert:
    that:
      - sweego_receiver_hostname.stdout == sweego_receiver_expected_host
    quiet: true
    fail_msg: >-
      This host is named '{{ sweego_receiver_hostname.stdout }}', not '{{ sweego_receiver_expected_host }}'.
      The receiver and its rule bind edge1's private address and belong on edge1 only. The
      inventory name is localhost under the pull, so the host's own name is the one read.

- name: Ask systemd about Docker
  ansible.builtin.systemd_service:
    name: docker.service
  register: sweego_receiver_docker_unit

- name: Refuse a host where Docker is not running
  ansible.builtin.assert:
    that:
      - sweego_receiver_docker_unit.status.ActiveState == 'active'
    quiet: true
    fail_msg: Docker is not active. The host baseline installs and starts it; this role installs no Docker.

# DOCKER-USER is the chain Docker evaluates before its own rules, and the only place a host
# rule sees a published port. The program refuses to run without it and has no safe
# substitute, so the role refuses first.
- name: Look for the DOCKER-USER chain
  ansible.builtin.command:
    argv: [iptables, -t, filter, -S, DOCKER-USER]
  register: sweego_receiver_docker_user
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse a host with no DOCKER-USER chain
  ansible.builtin.assert:
    that:
      - sweego_receiver_docker_user.rc | default(1) == 0
    quiet: true
    fail_msg: >-
      There is no DOCKER-USER chain in iptables. Either Docker is not running yet or its nftables
      backend is active, and the drain-port rule has no safe substitute chain.

# Root runs the program from the sbin directory and reads the units and the pin file from the
# others, so whoever can write one of them can run code as root. The role creates none of them.
- name: Look at the directories the role relies on and does not own
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
  loop:
    - '{{ sweego_receiver_config_dir }}'
    - '{{ sweego_receiver_opt_dir }}'
    - '{{ sweego_receiver_sbin_dir }}'
  register: sweego_receiver_parent_stats

- name: Refuse a directory that is missing, a link, not root's or writable by group or others
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - not item.stat.islnk
      - item.stat.pw_name == 'root'
      - not item.stat.wgrp
      - not item.stat.woth
    quiet: true
    fail_msg: >-
      {{ item.item }} is missing, is a link, is not owned by root or is writable by group or others.
      This role creates none of these directories.
  loop: '{{ sweego_receiver_parent_stats.results }}'
  loop_control:
    label: '{{ item.item }}'

# The shared compose template unit is installed by the deploy tooling and has no owner in
# this role, so the role reads it and never writes it. Systemd names the file it loaded the
# instance from; that file is then looked at.
- name: Ask systemd for the receiver's instance of the shared compose template
  ansible.builtin.systemd_service:
    name: '{{ sweego_receiver_compose_unit }}'
  register: sweego_receiver_template_state

- name: Look at the file systemd loaded the compose template from
  ansible.builtin.stat:
    path: '{{ sweego_receiver_template_state.status.FragmentPath | default("") }}'
    follow: false
  register: sweego_receiver_template_stat

- name: Refuse a host with no shared compose template unit, or one that is not root's
  ansible.builtin.assert:
    that:
      - sweego_receiver_template_state.status.LoadState == 'loaded'
      - sweego_receiver_template_state.status.FragmentPath == sweego_receiver_compose_template_path
      - sweego_receiver_template_stat.stat.isreg
      - not sweego_receiver_template_stat.stat.islnk
      - sweego_receiver_template_stat.stat.pw_name == 'root'
      - not sweego_receiver_template_stat.stat.wgrp
      - not sweego_receiver_template_stat.stat.woth
    quiet: true
    fail_msg: >-
      The shared compose template unit, the file the instance {{ sweego_receiver_compose_unit }} is loaded from,
      is missing or is not a regular file owned by root. This role never writes it; the deploy tooling
      installs it before this role runs.
