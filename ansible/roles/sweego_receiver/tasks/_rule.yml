---
# Internal to the role. Installs the drain-port rule program and its boot unit, enables the
# unit and runs the program again when either file changed, then reads the rules back from the
# kernel and asserts they are the first two rules of DOCKER-USER. The program builds the rules;
# this role never writes a firewall rule itself. Nothing here reads from the network.

# Mode 0755 and root ownership are load-bearing: systemd runs this file as root at every
# boot, so a group- or world-writable copy is a root shell for whoever can write it. The
# program is on disk before the unit that names it.
- name: Install the drain-port rule program
  ansible.builtin.copy:
    src: '{{ sweego_receiver_program_src }}'
    dest: '{{ sweego_receiver_program_dest }}'
    owner: root
    group: root
    mode: '0755'
  register: sweego_receiver_program

- name: Install the drain-port rule unit
  ansible.builtin.template:
    src: branchleft-sweego-drain-rule.service.j2
    dest: '{{ sweego_receiver_rule_unit_dest }}'
    owner: root
    group: root
    mode: '0644'
  register: sweego_receiver_rule_unit_file
  notify: Reload systemd manager

- name: Make systemd read the unit before it is enabled
  ansible.builtin.meta: flush_handlers

# Check mode writes no unit file, so on a fresh host systemd cannot know the unit and the
# tasks below would fail. stat runs in check mode as in a real run, so they run whenever the
# unit file is really on disk, and the skip on a fresh host is the stated reason (ANS-10).
- name: Read back the unit file of the drain-port rule
  ansible.builtin.stat:
    path: '{{ sweego_receiver_rule_unit_dest }}'
    follow: false
  register: sweego_receiver_rule_unit_now

- name: Enable the drain-port rule unit for boot
  ansible.builtin.systemd_service:
    name: '{{ sweego_receiver_rule_unit_name }}'
    enabled: true
  register: sweego_receiver_rule_unit_enable
  when: sweego_receiver_rule_unit_now.stat.exists

# restart, not start. The unit is a RemainAfterExit oneshot, so once it has succeeded systemd
# counts it as active and a start does nothing, which would leave a freshly installed program
# unrun until the next boot. Done only when a file changed, so a second run changes nothing.
- name: Run the program again because a file changed
  ansible.builtin.systemd_service:
    name: '{{ sweego_receiver_rule_unit_name }}'
    state: restarted
  when: sweego_receiver_rule_unit_now.stat.exists and (sweego_receiver_program.changed or sweego_receiver_rule_unit_file.changed)

# A unit that failed on an earlier run is not active and nothing above touched it, so this
# starts it, which runs the program again. On an active unit it does nothing.
- name: Start the drain-port rule unit if it is not active
  ansible.builtin.systemd_service:
    name: '{{ sweego_receiver_rule_unit_name }}'
    state: started
  register: sweego_receiver_rule_unit_start
  when: sweego_receiver_rule_unit_now.stat.exists

# What a real run would still change. The read-back asserts the loaded rules, which a plan on a
# host that has not been given the program cannot show.
- name: Work out whether this run changes the drain-port rule
  ansible.builtin.set_fact:
    sweego_receiver_rule_pending: >-
      {{ sweego_receiver_program.changed or sweego_receiver_rule_unit_file.changed
      or not sweego_receiver_rule_unit_now.stat.exists
      or (sweego_receiver_rule_unit_enable.changed | default(false))
      or (sweego_receiver_rule_unit_start.changed | default(false)) }}

# In check mode nothing is run, so the plan says in a changed line that the rule would be
# installed or reasserted. The task runs /bin/true, which changes nothing.
- name: Report in check mode that the drain-port rule would be installed or reasserted
  ansible.builtin.command:
    argv:
      - /bin/true
  changed_when: true
  check_mode: false
  when: ansible_check_mode and (sweego_receiver_rule_pending | bool)

- name: Say the drain-port rule is not verified in a plan that would still install it
  ansible.builtin.debug:
    msg: >-
      Drain-port rule NOT verified: this plan would still install or restart the rule program,
      so the rule in DOCKER-USER is read only by a run that applies.
  when: ansible_check_mode and (sweego_receiver_rule_pending | bool)

# Reads only, so it runs in check mode too, except on a plan that would still change the rule.
- name: Read DOCKER-USER back from the kernel
  ansible.builtin.command:
    argv: [iptables, -t, filter, -S, DOCKER-USER]
  register: sweego_receiver_chain_now
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or not (sweego_receiver_rule_pending | bool)

# The rules are read as the first two rules of the chain: a rule under an earlier accept is
# not a rule. The first drops by the container's address and port (where a packet is after
# Docker's DNAT, and where one routed straight to the container arrives); the second by the
# original destination. The pieces are the ones the program writes, each ended at a space, the
# end of the line or a /32, so a longer number that starts with the same digits is not taken
# for it, and a negated `-d` or `--dport` is not taken for the match.
- name: Refuse a chain whose first two rules are not the drain-port rules
  ansible.builtin.assert:
    that:
      - sweego_receiver_first_rule | length > 0
      - sweego_receiver_first_rule is search('(?<!! )-d ' ~ sweego_receiver_container_address ~ '(/32)?( |$)')
      - sweego_receiver_first_rule is search('(?<!! )--dport ' ~ sweego_receiver_container_drain_port ~ '( |$)')
      - sweego_receiver_first_rule is search('-p tcp( |$)')
      - sweego_receiver_first_rule is search('! -s ' ~ sweego_receiver_drain_peer_address ~ '(/32)?( |$)')
      - sweego_receiver_first_rule is search('-j DROP$')
      - sweego_receiver_second_rule | length > 0
      - sweego_receiver_second_rule is search('--ctorigdst ' ~ sweego_receiver_private_address ~ '(/32)?( |$)')
      - sweego_receiver_second_rule is search('--ctorigdstport ' ~ sweego_receiver_drain_port ~ '( |$)')
      - sweego_receiver_second_rule is search('--ctdir ORIGINAL( |$)')
      - sweego_receiver_second_rule is search('! -s ' ~ sweego_receiver_drain_peer_address ~ '(/32)?( |$)')
      - sweego_receiver_second_rule is search('-j DROP$')
    quiet: true
    fail_msg: >-
      The first two rules of DOCKER-USER are not the drain-port rules: they should drop a
      connection to {{ sweego_receiver_container_address }}:{{ sweego_receiver_container_drain_port }}
      (the container, as a packet is after DNAT or routed straight to it) and a connection to
      {{ sweego_receiver_private_address }}:{{ sweego_receiver_drain_port }} from any source but
      {{ sweego_receiver_drain_peer_address }}. The first rules are: {{ sweego_receiver_first_rule | default('none') }}
      then {{ sweego_receiver_second_rule | default('none') }}.
      Without them the drain port is open to the private network.
  vars:
    sweego_receiver_chain_rules: >-
      {{ sweego_receiver_chain_now.stdout_lines | default([]) | select('match', '^-A DOCKER-USER ') | list }}
    sweego_receiver_first_rule: '{{ sweego_receiver_chain_rules[0] | default("") }}'
    sweego_receiver_second_rule: '{{ sweego_receiver_chain_rules[1] | default("") }}'
  when: not ansible_check_mode or not (sweego_receiver_rule_pending | bool)

- name: Ask systemd for the drain-port rule unit
  ansible.builtin.systemd_service:
    name: '{{ sweego_receiver_rule_unit_name }}'
  register: sweego_receiver_rule_unit_state
  when: not ansible_check_mode or not (sweego_receiver_rule_pending | bool)

- name: Refuse a rule unit that is not active now and enabled for boot
  ansible.builtin.assert:
    that:
      - sweego_receiver_rule_unit_state.status.ActiveState == 'active'
      - sweego_receiver_rule_unit_state.status.UnitFileState == 'enabled'
    quiet: true
    fail_msg: >-
      The unit {{ sweego_receiver_rule_unit_name }} is not active, or is not enabled for boot.
      Without it the rule is gone at the next boot or Docker restart.
  when: not ansible_check_mode or not (sweego_receiver_rule_pending | bool)
