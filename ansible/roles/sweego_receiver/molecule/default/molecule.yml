---
# The role's container-only test (ANS-15). The harness in ansible/harness
# sets ROLE_TEST_RUN_ID, so the instance name is unique to one run and a
# destroy can only ever remove this run's container. Molecule's interpolation
# has no "required variable" form, so when the variable is unset the name
# falls back to one the Docker daemon rejects: the run fails at create, loudly,
# instead of sharing a container name with another run.
#
# The refusals scenario's molecule.yml is a link to this file, so the platform
# and its pin have this one home.
dependency:
  name: galaxy
  # The harness installs the pinned collections before it starts Molecule.
  enabled: false
driver:
  name: docker
platforms:
  - name: 'role-test-${ROLE_TEST_RUN_ID:-unset/use-the-harness}'
    # Third-party systemd test base on Debian 13, the release every production
    # host runs, trusted by digest, the same platform the demo1_egress_spool role
    # uses. The digest is the pin; the tag is informational. The role reloads
    # systemd and reads a unit's state, so the platform runs systemd as PID 1, a
    # platform the author justifies here, per ANS-15.
    image: geerlingguy/docker-debian13-ansible:latest@sha256:979c0d5e12b0035fff1c46bd4dfd00d67cd82fa48035194f14f32e01c8c02372
    # Pre-built, so that the reference can carry a digest.
    pre_build_image: true
    # The role refuses to run on any host not named edge1, and reads the host's
    # own name, so the container carries that name. The container is the only
    # host this name is given to.
    hostname: edge1
    # Destroy removes the container's anonymous volumes. This scenario's cgroup
    # bind mount means none is created; the key guards against one if the mount
    # is ever dropped.
    keep_volumes: false
    # No privileged mode. The host cgroup namespace is a stated exception
    # (ANS-15), the same one the demo1_egress_spool role states: a private
    # namespace over the read-write cgroup mount makes systemd exit at once on a
    # cgroup v2 host. The test image is trusted by digest and the job holds no
    # credentials.
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    # NET_ADMIN is the one added capability. The drain-port rule is loaded into
    # the container's own network namespace through iptables, which is a netlink
    # write, and prepare.yml gives the loopback the private address edge1 has.
    # It reaches no host network: the container has its own. Not privileged.
    capabilities:
      - NET_ADMIN
    labels:
      branchleft.role-test-run: '${ROLE_TEST_RUN_ID}'
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # Ports for the test only. The role takes them as required inputs and
        # has no default; these are not the ones the owner will name.
        standin_port: 18080
        standin_drain_port: 18081
        standin_signing_secret_file: /etc/branchleft/sweego-receiver-signing-secret
        standin_drain_token_file: /etc/branchleft/sweego-receiver-drain-token
        sweego_receiver_port: '{{ standin_port }}'
        sweego_receiver_drain_port: '{{ standin_drain_port }}'
        # The image the deploy wrapper pins. A digest that names nothing real:
        # the stand-in docker never pulls it.
        standin_image: ghcr.io/branchleft/sweego-receiver@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
verifier:
  name: ansible
