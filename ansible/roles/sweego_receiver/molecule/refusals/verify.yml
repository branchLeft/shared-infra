---
# What the refusal cases must leave behind: the host as the first applies delivered it. The
# expected values are written out here, not read from the role, so a case that left the host
# changed is a failure and not a test that agrees with it.
- name: Verify the instance
  hosts: all
  gather_facts: false
  tasks:
    - name: Look at the files the cases edited, replaced or moved
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
        checksum_algorithm: sha256
      loop:
        - /etc/branchleft/sweego-receiver-signing-secret
        - /etc/branchleft/sweego-receiver-drain-token
        - /etc/branchleft/sweego-receiver.image.env
      register: sweego_receiver_refusals_verify_files

    - name: Assert the secrets are as the owner placed them and the pin is as written
      ansible.builtin.assert:
        that:
          - sweego_receiver_refusals_verify_files.results[0].stat.mode == '0440'
          - sweego_receiver_refusals_verify_files.results[0].stat.gid == 31100
          - sweego_receiver_refusals_verify_files.results[0].stat.checksum == ("test-sentinel-signing-secret-0001\n" | hash('sha256'))
          - sweego_receiver_refusals_verify_files.results[1].stat.mode == '0440'
          - sweego_receiver_refusals_verify_files.results[1].stat.gid == 31100
          - sweego_receiver_refusals_verify_files.results[1].stat.pw_name == 'root'
          - sweego_receiver_refusals_verify_files.results[1].stat.checksum == ("test-sentinel-drain-token-0002\n" | hash('sha256'))
          - sweego_receiver_refusals_verify_files.results[2].stat.mode == '0600'
          - sweego_receiver_refusals_verify_files.results[2].stat.checksum == (("IMAGE=" ~ standin_image ~ "\n") | hash('sha256'))
        quiet: true
        fail_msg: A refusal case left a file changed.

    - name: Read the chain
      ansible.builtin.command:
        argv: [iptables, -t, filter, -S, DOCKER-USER]
      register: sweego_receiver_refusals_verify_chain
      changed_when: false

    - name: Assert the drain-port rules are in the chain once each, first and second, after all the cases
      ansible.builtin.assert:
        that:
          - sweego_receiver_refusals_verify_chain.stdout_lines | select('search', '--ctorigdstport 18081') | list | length == 1
          - sweego_receiver_refusals_verify_chain.stdout_lines | select('search', '--dport 8081') | list | length == 1
          - sweego_receiver_refusals_verify_chain.stdout_lines[1] is search('(?<!! )-d 172.29.250.2/32')
          - sweego_receiver_refusals_verify_chain.stdout_lines[2] is search('--ctorigdstport 18081')
        quiet: true
        fail_msg: '{{ sweego_receiver_refusals_verify_chain.stdout_lines }}'
