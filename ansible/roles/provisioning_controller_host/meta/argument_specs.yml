---
argument_specs:
  main:
    short_description: Make the provisioning controller's ssh key and install its units, off until a digest is set
    description: >-
      Makes the provisioning controller's ssh key (root's, mode 0400) the first time and never
      again, writes and prints its public half, installs a digest-pinned bundle when one is named,
      installs the controller's configuration, the register file, the ssh client files, the pass
      program and the service, path and timer units, and holds the path unit and the timer
      disabled until a bundle digest is set. An empty digest means the units are installed and
      inert.
    author: branchLeft
    options:
      provisioning_controller_host_bundle_sha256:
        type: str
        default: ''
        description: >-
          The sha256 of the provisioning controller bundle, 64 lowercase hex digits, or empty.
          Empty means no bundle is fetched, no link is made and the path unit and the timer are
          held disabled and stopped. When set, the bundle URL and the six inputs below must be set
          too.
      provisioning_controller_host_bundle_url:
        type: str
        default: ''
        description: >-
          Where the bundle is fetched from at apply time, an https URL with no credential, user
          name, query or fragment. The download must have the digest above or the role stops.
      provisioning_controller_host_edge1_jump_user:
        type: str
        default: ''
        no_log: true
        description: >-
          The name of the jump account on edge1 the controller's key logs in as. Held out of the
          repository by the owner's ruling, so it arrives through the host inputs loader. Set
          together with the other five inputs of this group, or all empty.
      provisioning_controller_host_edget_jump_user:
        type: str
        default: ''
        no_log: true
        description: >-
          The name of the jump account on edge-t, as above.
      provisioning_controller_host_edge1_host_key:
        type: str
        default: ''
        description: >-
          edge1's ssh host key as 'ssh-ed25519 <base64>', one line, no comment. Pinned for the
          address 10.20.1.10.
      provisioning_controller_host_edget_host_key:
        type: str
        default: ''
        description: >-
          edge-t's ssh host key, as above. Pinned for the address 10.20.1.210.
      provisioning_controller_host_app_t1_host_key:
        type: str
        default: ''
        description: >-
          app-t1's ssh host key, as above. Pinned for the address 10.20.1.201.
      provisioning_controller_host_db_t1_host_key:
        type: str
        default: ''
        description: >-
          db-t1's ssh host key, as above. Pinned for the address 10.20.1.200.
