---
# The bundle scenario: a digest is set, so the role fetches a pinned bundle, links it and turns
# the timer on; a wrong digest and a bundle that is not a root-owned executable are refused with
# the link unmoved. The platform is the default scenario's, for the same reasons.
dependency:
  name: galaxy
  # The harness installs the pinned collections before it starts Molecule.
  enabled: false
driver:
  name: docker
platforms:
  - name: 'role-test-${ROLE_TEST_RUN_ID:-unset/use-the-harness}'
    # Third-party systemd test base on Debian 13, trusted by digest (see the default scenario).
    image: geerlingguy/docker-debian13-ansible:latest@sha256:979c0d5e12b0035fff1c46bd4dfd00d67cd82fa48035194f14f32e01c8c02372
    pre_build_image: true
    keep_volumes: false
    # The host cgroup namespace is the stated ANS-15 exception the default scenario explains.
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    labels:
      branchleft.role-test-run: '${ROLE_TEST_RUN_ID}'
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        scenario_account: provisioning-controller
        scenario_releases: /opt/branchleft/provisioning-controller/releases
        scenario_current: /opt/branchleft/provisioning-controller/current
        scenario_steps_program: /opt/branchleft/provisioning-controller/provisioning-controller-steps
        scenario_escrow_dir: /var/lib/branchleft/provisioning-controller/escrow
        scenario_register: /etc/branchleft/provisioning-controller/register.json
        scenario_pass_program: /opt/branchleft/provisioning-controller/provisioning-controller-pass
        scenario_config_dir: /etc/branchleft/provisioning-controller
        scenario_config_file: /etc/branchleft/provisioning-controller/config.json
        scenario_state_dir: /var/lib/branchleft/provisioning-controller
        scenario_approvals: /var/lib/branchleft/provisioning-controller/approvals.json
        scenario_run_state: /var/lib/branchleft/provisioning-controller/run-state.jsonl
        scenario_invocations: /var/lib/branchleft/provisioning-controller/invocations.log
        scenario_key_runtime_path: /run/credentials/provisioning-controller.service/ssh-key
        scenario_fixture_dir: /srv/provisioning-fixture
        # The test-only URL shape: the role's own pattern admits https only, so the scenario
        # widens it to the fixture directory, through the role parameters of each include.
        scenario_url_pattern: '^file:///srv/provisioning-fixture/[a-z.-]+\Z'
        scenario_good_url: file:///srv/provisioning-fixture/bundle-good.tar.gz
        scenario_noexec_url: file:///srv/provisioning-fixture/bundle-noexec.tar.gz
        # A well-formed digest of nothing that exists: a download with this digest must fail.
        scenario_wrong_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        # Made-up route inputs, belonging to no host: two account names and one well-formed
        # ed25519 host key used for all four hosts.
        scenario_edge1_user: jumpone
        scenario_edget_user: jumptwo
        scenario_host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
verifier:
  name: ansible
