---
# The role's container-only test (ANS-15). The harness in ansible/harness
# sets ROLE_TEST_RUN_ID, so the instance name is unique to one run and a
# destroy can only ever remove this run's container.
dependency:
  name: galaxy
  # The harness installs the pinned collections before it starts Molecule.
  enabled: false
driver:
  name: docker
platforms:
  - name: 'role-test-${ROLE_TEST_RUN_ID:-unset/use-the-harness}'
    # Third-party systemd test base on Debian 13, the release every production host runs,
    # trusted by digest. The digest is the pin; the tag is informational and moves weekly. The
    # role installs a unit and holds its state, so the platform runs systemd as PID 1, a
    # platform the author justifies here, per ANS-15.
    image: geerlingguy/docker-debian13-ansible:latest@sha256:979c0d5e12b0035fff1c46bd4dfd00d67cd82fa48035194f14f32e01c8c02372
    # Pre-built, so that the reference can carry a digest.
    pre_build_image: true
    # Destroy removes the container's anonymous volumes. This scenario's cgroup bind mount means
    # none is created; the key guards against one if the mount is ever dropped.
    keep_volumes: false
    # No privileged mode and no added capabilities. The mounts, the cgroup namespace and the
    # command below are the whole set this image needs to run systemd (measured by the
    # files_and_units pattern, which this block copies). The host cgroup namespace is a stated
    # exception (ANS-15): on a cgroup v2 host a private namespace over the read-write cgroup
    # mount makes systemd exit at once, and the host namespace is the least privilege that works.
    # The test image is trusted by digest and the job holds no credentials.
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    # Start systemd as the init process, the image's own CMD.
    command: /lib/systemd/systemd
    labels:
      branchleft.role-test-run: '${ROLE_TEST_RUN_ID}'
provisioner:
  name: ansible
  env:
    # Every Ansible run of this scenario appends its output to one log on the controller, and
    # verify reads it. Verbosity 3 prints each task's result with the arguments it was given, so
    # a task that handles a key and lacks no_log shows it in the log, and verify fails (ANS-16).
    ANSIBLE_LOG_PATH: '${MOLECULE_EPHEMERAL_DIRECTORY}/ansible.log'
    ANSIBLE_VERBOSITY: '3'
  inventory:
    group_vars:
      all:
        scenario_log_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/ansible.log"
        scenario_ephemeral_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
        # The role's own constants, spelled out here so that a change of a constant fails the
        # scenario instead of being followed by it.
        scenario_account: content-safety
        scenario_config_dir: /etc/branchleft/safety-service
        scenario_config_file: /etc/branchleft/safety-service/config.json
        scenario_env_file: /etc/branchleft/safety-service/service.env
        scenario_state_dir: /var/lib/branchleft/safety-service
        scenario_secrets_dir: /etc/branchleft/content-safety
        scenario_key_file: /etc/branchleft/content-safety/channel-signing.key
        scenario_credential_file: /etc/branchleft/content-safety/arachnid-credential
        scenario_unit: /etc/systemd/system/content-safety.service
        scenario_docker_args_file: /run/standin-docker-args
        # Test values, never real: an origin that resolves nowhere and one host.
        scenario_origin: https://hash-source.example
        scenario_host_id: host-one
        scenario_host_endpoint: https://host-one.example
        # Files of other roles and of the owner's data. The role must not touch them: each keeps
        # its inode, mtime, mode, owner and content across the role's runs.
        scenario_canaries:
          - /etc/branchleft/control-plane/canary
          - /var/lib/nextcloud/data/canary
verifier:
  name: ansible
