---
pull_trigger_ansible_playbook: /usr/local/bin/ansible-playbook
pull_trigger_timeout_seconds: 3600
pull_trigger_keep_runs: 50
pull_trigger_steps: []
# The commit the one-off bootstrap of a host that takes bundles writes as its rollback floor, with
# `-e pull_trigger_floor_seed=<40 hex>`. Empty writes nothing. It is written only when the host has
# no floor, never over one, so it can never move a floor that exists. A host that takes bundles
# with no floor refuses every request.
pull_trigger_floor_seed: ''
