---
# One refusal case: take a snapshot, make the request, take a second snapshot,
# and assert the answer and that nothing changed. Takes the dictionary `case`:
# name, text, rc, reason, and optionally commit (default -), mode, config, state.
- name: 'Snapshot before: {{ case.name }}'
  ansible.builtin.include_tasks: snapshot.yml
  vars:
    snap_state: '{{ case.state | default(verify_state) }}'

- name: 'Keep the snapshot taken before: {{ case.name }}'
  ansible.builtin.set_fact:
    pull_trigger_refuse_before: '{{ pull_trigger_snapshot_result.stdout }}'

- name: 'Request: {{ case.name }}'
  ansible.builtin.include_tasks: request.yml
  vars:
    request_name: '{{ case.name }}'
    request_text: '{{ case.text }}'
    request_mode: '{{ case.mode | default("apply") }}'
    request_config: '{{ case.config | default(verify_installed_config) }}'
    request_program: '{{ case.program | default(verify_program) }}'

- name: 'Snapshot after: {{ case.name }}'
  ansible.builtin.include_tasks: snapshot.yml
  vars:
    snap_state: '{{ case.state | default(verify_state) }}'

- name: 'Refused with the documented exit and reason: {{ case.name }}'
  ansible.builtin.assert:
    that:
      - pull_trigger_request_result.rc == case.rc
      - >-
        ('exit=' ~ case.rc ~ ' reason=' ~ case.reason ~ ' mode=' ~ (case.shown_mode | default(case.mode | default('apply'))) ~
        ' commit=' ~ (case.commit | default('-')) ~ ' ') in pull_trigger_request_result.stdout
    fail_msg: 'wrong answer for {{ case.name }}: rc={{ pull_trigger_request_result.rc }} stdout={{ pull_trigger_request_result.stdout }}'
    success_msg: 'refused as expected: {{ case.name }}'

- name: 'The summary names the step the allow-list found, or none, and never what the caller typed: {{ case.name }}'
  ansible.builtin.assert:
    that:
      - pull_trigger_request_result.stdout is search(' step=' ~ (case.shown_step | default('-')) ~ '$')
    fail_msg: 'the step field is wrong for {{ case.name }}: {{ pull_trigger_request_result.stdout }}'
    success_msg: 'the step field is as expected: {{ case.name }}'
  when: case.mode | default('apply') == 'step' and case.shown_mode is not defined

- name: 'A request that is not a step request has no step field, so its line is what it was before steps: {{ case.name }}'
  ansible.builtin.assert:
    that:
      - "' step=' not in pull_trigger_request_result.stdout"
    fail_msg: 'a line that is not a step request names a step: {{ pull_trigger_request_result.stdout }}'
    success_msg: 'no step field: {{ case.name }}'
  when: case.mode | default('apply') != 'step'

- name: 'Refused by the guard the case names: {{ case.name }}'
  ansible.builtin.assert:
    that:
      - case.detail in pull_trigger_request_result.stderr
    fail_msg: 'the refusal did not come from the expected guard: {{ pull_trigger_request_result.stderr }}'
    success_msg: 'refused by the expected guard: {{ case.name }}'
  when: case.detail is defined

- name: 'The host and the previous checkout are byte for byte unchanged: {{ case.name }}'
  ansible.builtin.assert:
    that:
      - pull_trigger_snapshot_result.stdout == pull_trigger_refuse_before
    fail_msg: 'the refusal changed the host: {{ case.name }}'
    success_msg: 'nothing changed: {{ case.name }}'
