---
# One connection to the container's own sshd with one key, and what the stand-in wrapper
# saw. Inputs: attempt_key, the key pair's name; attempt_expect, one of slot (the key's
# forced command ran, with attempt_slot as its only argument), denied (the key did not
# authenticate) or blocked (it authenticated, and the request was refused); attempt_command,
# the remote command the client asks for (sent after a double dash, so a leading dash is
# not read as a client option), left out when the case asks for none; attempt_options,
# more ssh options; attempt_input, what is sent on standard input; attempt_expect_stdin,
# true unless a case says false, whether the input must arrive. Nothing the client asks
# for may run: the marker file below is what every hostile command tries to make.
- name: Clear what the stand-in wrapper recorded and the marker
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - '{{ scenario_record_dir }}/argc'
    - '{{ scenario_record_dir }}/argv'
    - '{{ scenario_record_dir }}/stdin'
    - /tmp/EXAMPLE_MARKER

- name: Connect with the key
  ansible.builtin.command:
    argv: '{{ attempt_base + (attempt_options | default([])) + ["deploy@127.0.0.1"] + attempt_remote }}'
    stdin: '{{ attempt_input | default("EXAMPLE_IMAGE_REFERENCE") }}'
    stdin_add_newline: false
  vars:
    attempt_base:
      - ssh
      - -i
      - '{{ scenario_key_dir }}/{{ attempt_key }}'
      - -p
      - '{{ scenario_ssh_port }}'
      - -o
      - IdentitiesOnly=yes
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - LogLevel=ERROR
    attempt_remote: '{{ ["--", attempt_command] if attempt_command is defined else [] }}'
  register: deploy_slot_keys_scenario_attempt_result
  changed_when: false
  failed_when: false
  check_mode: false

- name: Look at what the stand-in wrapper recorded
  ansible.builtin.slurp:
    src: '{{ scenario_record_dir }}/{{ item }}'
  loop:
    - argc
    - argv
    - stdin
  register: deploy_slot_keys_scenario_attempt_record
  failed_when: false
  check_mode: false

- name: Look for the marker a hostile command would make
  ansible.builtin.stat:
    path: /tmp/EXAMPLE_MARKER
  register: deploy_slot_keys_scenario_attempt_marker
  check_mode: false

- name: Assert nothing the client asked for ran
  ansible.builtin.assert:
    that:
      - not deploy_slot_keys_scenario_attempt_marker.stat.exists
    fail_msg: 'A command the client asked for ran: {{ attempt_key }} {{ attempt_command | default("") }}'
    quiet: true

- name: Assert the key's forced command ran with its own slot and the image on its input
  ansible.builtin.assert:
    that:
      - deploy_slot_keys_scenario_attempt_record.results | rejectattr('failed') | list | length == 3
      - (deploy_slot_keys_scenario_attempt_record.results[0].content | b64decode | trim) == '2'
      - (deploy_slot_keys_scenario_attempt_record.results[1].content | b64decode).splitlines() == ['--slot', attempt_slot]
      - (not (attempt_expect_stdin | default(true) | bool)) or ((deploy_slot_keys_scenario_attempt_record.results[2].content | b64decode) == (attempt_input | default('EXAMPLE_IMAGE_REFERENCE')))
    fail_msg: >-
      The forced command of {{ attempt_key }} did not run as its slot's alone for
      {{ attempt_command | default('(no command)') }}: it was called with
      {{ deploy_slot_keys_scenario_attempt_record.results[1].content | default('') | b64decode | default('nothing') }}
    quiet: true
  when: attempt_expect == 'slot'

- name: Assert a key that is not authorised was turned away before anything ran
  ansible.builtin.assert:
    that:
      - deploy_slot_keys_scenario_attempt_result.rc != 0
      - deploy_slot_keys_scenario_attempt_record.results | selectattr('failed') | list | length == 3
    fail_msg: 'The key {{ attempt_key }} was not turned away.'
    quiet: true
  when: attempt_expect == 'denied'

- name: Assert a refused request ended the connection without the command running
  ansible.builtin.assert:
    that:
      - deploy_slot_keys_scenario_attempt_result.rc != 0
      - deploy_slot_keys_scenario_attempt_record.results | selectattr('failed') | list | length == 3
    fail_msg: 'The request was not refused for {{ attempt_key }}.'
    quiet: true
  when: attempt_expect == 'blocked'

- name: Assert the client was told what it asked for was refused
  ansible.builtin.assert:
    that:
      - attempt_stderr_contains in deploy_slot_keys_scenario_attempt_result.stderr
    fail_msg: 'The client was not told: {{ attempt_stderr_contains }}. It was told: {{ deploy_slot_keys_scenario_attempt_result.stderr }}'
    quiet: true
  when: attempt_stderr_contains is defined
