---
# Calls the role's module with a list it must refuse, and requires the exact refusal and a
# host that is exactly as it was. refusal_slots is the list, as declare_slots takes it;
# refusal_message is the message the module must give: a place in the list and a rule, and
# nothing else. The call hides its result, so the message is read from the registered
# variable and compared whole.
- name: Look at authorized_keys and the register before the call
  ansible.builtin.stat:
    path: /home/deploy/.ssh/authorized_keys
  register: deploy_slot_keys_scenario_refusal_before

- name: Count the register files before the call
  ansible.builtin.find:
    paths: /etc/branchleft/deploy-slots
    file_type: any
    hidden: true
  register: deploy_slot_keys_scenario_refusal_register_before
  no_log: true

- name: Declare the slots the module must refuse
  ansible.builtin.include_tasks: declare_slots.yml
  vars:
    declare_slots: '{{ refusal_slots }}'

- name: Call the module with the list
  deploy_slot_keys_reconcile:
    program_path: '{{ deploy_slot_keys_program_path }}'
    slots: '{{ deploy_slot_keys_scenario_declared_slots }}'
  register: deploy_slot_keys_scenario_refusal_result
  failed_when: false
  no_log: true

- name: Assert the module refused with the expected message and nothing else
  ansible.builtin.assert:
    that:
      - deploy_slot_keys_scenario_refusal_result.msg is defined
      - deploy_slot_keys_scenario_refusal_result.msg == refusal_message
    fail_msg: 'Expected the refusal "{{ refusal_message }}"; got "{{ deploy_slot_keys_scenario_refusal_result.msg | default("no message") }}".'
    quiet: true

- name: Look at authorized_keys and the register after the call
  ansible.builtin.stat:
    path: /home/deploy/.ssh/authorized_keys
  register: deploy_slot_keys_scenario_refusal_after

- name: Count the register files after the call
  ansible.builtin.find:
    paths: /etc/branchleft/deploy-slots
    file_type: any
    hidden: true
  register: deploy_slot_keys_scenario_refusal_register_after
  no_log: true

- name: Assert the refused call changed nothing
  ansible.builtin.assert:
    that:
      - deploy_slot_keys_scenario_refusal_after.stat.checksum == deploy_slot_keys_scenario_refusal_before.stat.checksum
      - deploy_slot_keys_scenario_refusal_register_after.matched == deploy_slot_keys_scenario_refusal_register_before.matched
    quiet: true
