---
# The token is a fixed test sentinel, not a credential. It is a literal so that a second converge
# writes the same file and reports no change.
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    mx1_abuse_page_token: test-sentinel-mx1-page-token-0001
  tasks:
    - name: Apply the role with a token
      ansible.builtin.include_role:
        name: branchleft.mx1_abuse_page

    # The control case for the log scan in verify.yml: a task with no no_log that is given a known
    # canary. If the log did not show it, an empty result of the scan would mean nothing.
    - name: Run a harmless command that is given a canary argument
      ansible.builtin.command:
        argv:
          - /bin/true
          - MX1_ABUSE_PAGE_LOG_CANARY
      changed_when: false
      check_mode: false
