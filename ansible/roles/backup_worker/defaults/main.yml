---
# No private value is a default: the address, the database account, the
# bucket, the endpoint, the region, the tenants and the three credentials are
# required inputs (meta/argument_specs.yml), and they come from the private
# inventory. What is here is public and safe to commit.

# The timer stays off. Turning it on is a production apply (README).
backup_worker_timer_enabled: false

# False leaves the timer as it is on the host. Set true, together with
# backup_worker_timer_enabled false, to stop a running timer (README).
backup_worker_timer_may_disable: false

# Install the mysqldump 8.0 client and age with the pinned installer (runbook
# section 2) when either is missing. Off for a host that has them by other means.
backup_worker_install_prereqs: true

# The one home of the programs and units is branchLeft/ghost-platform. They are
# downloaded from this commit, never copied here, and each file is held to the
# checksum below. Bump the commit and every checksum together: a checksum that
# does not match the file at the commit fails the download.
backup_worker_source_sha: 5e52f78427cab104438057164e4baa16b329875c
backup_worker_source_base_url: 'https://raw.githubusercontent.com/branchLeft/ghost-platform/{{ backup_worker_source_sha }}'

# Every file of the release, relative to the release root: what the loop
# imports or loads at run time (the installer's REQUIRED_RELEASE_FILES), the two
# unit files, the installer, and the pinned prerequisite installer.
