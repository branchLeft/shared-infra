---
# The generic form: after one run with the key half off on a host with no account, the account,
# its locked password and its sudoers file exist as the default scenario checks them, and no key
# file has been written. A second run changes nothing. Keys must never reach the log (ANS-16).
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    verify_apply_body: "{{ scenario_apply_public.split(' ')[1] }}"
    verify_check_body: "{{ scenario_check_public.split(' ')[1] }}"
  tasks:
    - name: Read the pipeline account
      ansible.builtin.getent:
        database: passwd
        key: '{{ scenario_user }}'
      register: ci_login_no_keys_passwd

    - name: Read the password field of the pipeline account
      ansible.builtin.getent:
        database: shadow
        key: '{{ scenario_user }}'
      register: ci_login_no_keys_shadow
      no_log: true

    - name: Keep only the first character of the password field
      ansible.builtin.set_fact:
        ci_login_no_keys_lock: '{{ ci_login_no_keys_shadow.ansible_facts.getent_shadow[scenario_user][0][:1] }}'
      no_log: true

    - name: Assert the account is a system account with a home, a real shell and a locked password
      ansible.builtin.assert:
        that:
          - ci_login_no_keys_passwd.ansible_facts.getent_passwd[scenario_user][1] | int < 1000
          - ci_login_no_keys_passwd.ansible_facts.getent_passwd[scenario_user][4] == scenario_home
          - ci_login_no_keys_passwd.ansible_facts.getent_passwd[scenario_user][5] == '/bin/bash'
          - ci_login_no_keys_lock == '!'
        quiet: true

    - name: Read the sudoers file
      ansible.builtin.stat:
        path: '{{ scenario_sudoers_path }}'
      register: ci_login_no_keys_sudoers

    - name: Assert the sudoers file is owned by root and readable only as sudo wants
      ansible.builtin.assert:
        that:
          - ci_login_no_keys_sudoers.stat.exists
          - ci_login_no_keys_sudoers.stat.pw_name == 'root'
          - ci_login_no_keys_sudoers.stat.mode == '0440'
        quiet: true

    - name: Read the lines of the sudoers file
      ansible.builtin.command:
        argv:
          - cat
          - '{{ scenario_sudoers_path }}'
      register: ci_login_no_keys_lines
      changed_when: false
      check_mode: false
      no_log: true

    - name: Assert the sudoers file holds exactly the two commands and nothing else
      ansible.builtin.assert:
        that:
          - ci_login_no_keys_lines.stdout_lines == scenario_sudoers_lines
        quiet: true

    - name: Read the key file of the pipeline account
      ansible.builtin.stat:
        path: '{{ scenario_home }}/.ssh/authorized_keys'
      register: ci_login_no_keys_key_file

    - name: Assert no key file was written, because the key half is off
      ansible.builtin.assert:
        that:
          - not ci_login_no_keys_key_file.stat.exists
        quiet: true

    - name: Apply the role again with the key half off, which must change nothing
      ansible.builtin.include_role:
        name: branchleft.ci_login
      vars:
        ci_login_manage_keys: false
        ci_login_keys: '{{ scenario_keys }}'

    - name: Assert the second run left no key file either
      ansible.builtin.stat:
        path: '{{ scenario_home }}/.ssh/authorized_keys'
      register: ci_login_no_keys_key_file_again

    - name: Assert the key file is still absent after the second run
      ansible.builtin.assert:
        that:
          - not ci_login_no_keys_key_file_again.stat.exists
        quiet: true

    # ANS-16: the key bodies must not reach the Ansible log of this run.
    - name: Read the Ansible log of this run
      ansible.builtin.slurp:
        src: '{{ scenario_log_path }}'
      register: ci_login_no_keys_log
      delegate_to: localhost
      become: false

    - name: Assert no key body reached the log
      ansible.builtin.assert:
        that:
          - verify_apply_body not in (ci_login_no_keys_log.content | b64decode)
          - verify_check_body not in (ci_login_no_keys_log.content | b64decode)
        quiet: true
      no_log: true
