---
# The refusal cases of the role, one for each guard. Each is one bad state or bad input on the
# host the role has already delivered, and the role must stop with its own message, leave what it
# found as it found it, and never print a key. A case has: name; expect, the exact message the
# role must stop with (absent for a control that must be accepted); commands, argv lists that make
# the bad state; files, to put in place after the commands (path, content, mode); restore, argv
# lists that put the host back; changes, true for the one accepted case that may change a path;
# the five inputs (digest, url, ledger, remote, hosts), each empty
# unless the case sets it; forbidden, texts the message must not hold; absent, paths that must not
# exist afterwards; modes, paths and the mode each must still have.
#
# The first case is a control: the same role on the host as delivered must accept. Without it, a
# role that refused everything would pass every case.
- name: Run every case
  hosts: all
  gather_facts: false
  vars:
    ring_controller_host_refusals_wrong_hex: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    ring_controller_host_refusals_cases:
      - name: control, the host as delivered

      # --- The keys: states the role must refuse to make good by itself.
      - name: a private key that has gone while its public half is still there
        commands:
          - [mv, '{{ scenario_ledger_key }}', /root/lost-key]
        restore:
          - [mv, /root/lost-key, '{{ scenario_ledger_key }}']
        expect: 'E-KEY-LOST: {{ scenario_ledger_key }}'
        absent:
          - '{{ scenario_ledger_key }}'
      - name: a ledger key readable by its group
        commands:
          - [chmod, '0640', '{{ scenario_ledger_key }}']
        restore:
          - [chmod, '0600', '{{ scenario_ledger_key }}']
        expect: 'E-KEY-MODE-WIDE: {{ scenario_ledger_key }}'
        modes:
          - path: '{{ scenario_ledger_key }}'
            mode: '0640'
      - name: a push key readable by others
        commands:
          - [chmod, '0604', '{{ scenario_push_key }}']
        restore:
          - [chmod, '0600', '{{ scenario_push_key }}']
        expect: 'E-KEY-MODE-WIDE: {{ scenario_push_key }}'
        modes:
          - path: '{{ scenario_push_key }}'
            mode: '0604'
      - name: a link in the key's place
        commands:
          - [mv, '{{ scenario_push_key }}', /root/real-key]
          - [ln, -s, /root/real-key, '{{ scenario_push_key }}']
        restore:
          - [rm, -f, '{{ scenario_push_key }}']
          - [mv, /root/real-key, '{{ scenario_push_key }}']
        expect: 'E-KEY-OPEN: {{ scenario_push_key }}'
      - name: a key with a second hard link
        commands:
          - [ln, '{{ scenario_push_key }}', /root/push-link]
        restore:
          - [rm, -f, /root/push-link]
        expect: 'E-KEY-LINKED: {{ scenario_push_key }}'
      - name: a key file that is not a key
        commands:
          - [mv, '{{ scenario_push_key }}', /root/real-key]
        files:
          - path: '{{ scenario_push_key }}'
            content: "not an OpenSSH key\n"
            mode: '0600'
        restore:
          - [rm, -f, '{{ scenario_push_key }}']
          - [mv, /root/real-key, '{{ scenario_push_key }}']
        expect: 'E-KEY-FORM: {{ scenario_push_key }}'
      - name: a file of someone else's in the key directory
        commands:
          - [touch, '{{ scenario_keys_dir }}/notes.txt']
        restore:
          - [rm, -f, '{{ scenario_keys_dir }}/notes.txt']
        expect: 'E-DIR-FOREIGN: {{ scenario_keys_dir }}/notes.txt'

      # --- What the role stands on.
      - name: a parent directory that others can write
        commands:
          - [chmod, '0777', /etc/branchleft]
        restore:
          - [chmod, '0755', /etc/branchleft]
        expect: "A parent directory of the role is missing, is a link, is not root's or can be changed by others. The role does not make or change it."
      - name: an ssh-keygen that others can write
        commands:
          - [chmod, 'g+w', /usr/bin/ssh-keygen]
        restore:
          - [chmod, 'g-w', /usr/bin/ssh-keygen]
        expect: "ssh-keygen is missing, is not a regular file, is not root's or can be changed by others. The role does not install it."

      # --- The inputs, each refused before anything is changed, with no value in the message.
      - name: a digest in capitals
        digest: '{{ ring_controller_host_refusals_wrong_hex }}'
        url: '{{ scenario_bundle_url }}'
        ledger: '{{ scenario_ledger_url }}'
        remote: '{{ scenario_push_remote }}'
        hosts: '{{ scenario_known_hosts_line }}'
        expect: ring_controller_host_bundle_sha256 must be empty or 64 lowercase hex digits.
        forbidden:
          - '{{ ring_controller_host_refusals_wrong_hex }}'
      - name: a bundle URL with plain http
        digest: '{{ scenario_digest }}'
        url: http://bundle.example.test/ring-controller.tar.gz
        ledger: '{{ scenario_ledger_url }}'
        remote: '{{ scenario_push_remote }}'
        hosts: '{{ scenario_known_hosts_line }}'
        expect: ring_controller_host_bundle_url must be empty or an https URL with no user name, password, query or fragment.
        forbidden:
          - http://bundle.example.test
        absent:
          - /opt/branchleft/ring-controller/releases/{{ scenario_digest }}
      - name: a bundle URL that carries a credential
        digest: '{{ scenario_digest }}'
        url: https://u:p@bundle.example.test/ring-controller.tar.gz
        ledger: '{{ scenario_ledger_url }}'
        remote: '{{ scenario_push_remote }}'
        hosts: '{{ scenario_known_hosts_line }}'
        expect: ring_controller_host_bundle_url must be empty or an https URL with no user name, password, query or fragment.
        forbidden:
          - u:p@
      - name: a ledger URL with a query
        ledger: https://ledger.example.test/ledger?token=x
        expect: ring_controller_host_ledger_url must be empty or an https URL with no user name, password, query or fragment.
        forbidden:
          - token=x
      - name: a push remote that is not ssh
        remote: https://git.example.test/example-org/example-ledger.git
        expect: ring_controller_host_ledger_push_remote must be empty or ssh://git@HOST/ORG/REPO.git.
        forbidden:
          - git.example.test
      - name: a known-hosts line with a key type the role does not accept
        hosts: git.example.test ssh-dss AAAAB3NzaC1kc3M=
        expect: ring_controller_host_push_known_hosts must be empty or one known_hosts line with a host, a key type and a key.
        forbidden:
          - ssh-dss
      - name: a digest with no bundle URL
        digest: '{{ scenario_digest }}'
        ledger: '{{ scenario_ledger_url }}'
        remote: '{{ scenario_push_remote }}'
        hosts: '{{ scenario_known_hosts_line }}'
        expect: ring_controller_host_bundle_url is empty while ring_controller_host_bundle_sha256 is set.
        absent:
          - /opt/branchleft/ring-controller/releases/{{ scenario_digest }}
      - name: a digest with no ledger URL
        digest: '{{ scenario_digest }}'
        url: '{{ scenario_bundle_url }}'
        remote: '{{ scenario_push_remote }}'
        hosts: '{{ scenario_known_hosts_line }}'
        expect: ring_controller_host_ledger_url is empty while ring_controller_host_bundle_sha256 is set.
      - name: a digest with no push remote
        digest: '{{ scenario_digest }}'
        url: '{{ scenario_bundle_url }}'
        ledger: '{{ scenario_ledger_url }}'
        hosts: '{{ scenario_known_hosts_line }}'
        expect: ring_controller_host_ledger_push_remote is empty while ring_controller_host_bundle_sha256 is set.
      - name: a digest with no known-hosts line
        digest: '{{ scenario_digest }}'
        url: '{{ scenario_bundle_url }}'
        ledger: '{{ scenario_ledger_url }}'
        remote: '{{ scenario_push_remote }}'
        expect: ring_controller_host_push_known_hosts is empty while ring_controller_host_bundle_sha256 is set.

      # The last control: well-formed inputs and no digest are accepted, and this one changes the
      # environment file and the known-hosts file, so it is the one case that may change a path.
      - name: control, every input set and no digest
        ledger: '{{ scenario_ledger_url }}'
        remote: '{{ scenario_push_remote }}'
        hosts: '{{ scenario_known_hosts_line }}'
        changes: true
  tasks:
    - name: Run each case
      ansible.builtin.include_tasks: tasks/case.yml
      loop: '{{ ring_controller_host_refusals_cases }}'
      loop_control:
        loop_var: ring_controller_host_refusals_case
        label: '{{ ring_controller_host_refusals_case.name }}'
