---
# The refusal cases of the role, one for each guard. Each is one bad state or bad input on the
# host the role has already delivered, and the role must stop with its own message, leave what it
# found as it found it, and never print a key. A case has: name; expect, the exact message the
# role must stop with (absent for a control that must be accepted); commands, argv lists that make
# the bad state; files, to put in place after the commands (path, content, mode); restore, argv
# lists that put the host back; changes, true for the one accepted case that may change a path;
# the two inputs (digest, url), each empty unless the case sets it; retired_ledger, the text to
# give the retired ledger URL input, which the role must refuse even when it is empty; forbidden, texts the message must not hold; absent, paths that must not
# exist afterwards; modes, paths and the mode each must still have.
#
# The first case is a control: the same role on the host as delivered must accept. Without it, a
# role that refused everything would pass every case.
- name: Run every case
  hosts: all
  gather_facts: false
  vars:
    ring_controller_host_refusals_wrong_hex: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    ring_controller_host_refusals_cases:
      - name: control, the host as delivered

      # --- The key: states the role must refuse to make good by itself.
      - name: a key that has gone while its public half is still there
        commands:
          - [mv, '{{ scenario_key }}', /root/lost-key]
        restore:
          - [mv, /root/lost-key, '{{ scenario_key }}']
        expect: 'E-KEY-LOST: {{ scenario_public }}'
        absent:
          - '{{ scenario_key }}'
      - name: a key readable by its group
        commands:
          - [chmod, '0440', '{{ scenario_key }}']
        restore:
          - [chmod, '0400', '{{ scenario_key }}']
        expect: 'E-KEY-MODE-WIDE: {{ scenario_key }}'
        modes:
          - path: '{{ scenario_key }}'
            mode: '0440'
      - name: a key readable by others
        commands:
          - [chmod, '0404', '{{ scenario_key }}']
        restore:
          - [chmod, '0400', '{{ scenario_key }}']
        expect: 'E-KEY-MODE-WIDE: {{ scenario_key }}'
        modes:
          - path: '{{ scenario_key }}'
            mode: '0404'
      - name: a key that the service account owns
        commands:
          - [chown, 'ring-controller', '{{ scenario_key }}']
        restore:
          - [chown, 'root', '{{ scenario_key }}']
        expect: 'E-KEY-OWNER: {{ scenario_key }}'
      - name: a link in the key's place
        commands:
          - [mv, '{{ scenario_key }}', /root/real-key]
          - [ln, -s, /root/real-key, '{{ scenario_key }}']
        restore:
          - [rm, -f, '{{ scenario_key }}']
          - [mv, /root/real-key, '{{ scenario_key }}']
        expect: 'E-KEY-OPEN: {{ scenario_key }}'
      - name: a key with a second hard link
        commands:
          - [ln, '{{ scenario_key }}', /root/key-link]
        restore:
          - [rm, -f, /root/key-link]
        expect: 'E-KEY-LINKED: {{ scenario_key }}'
      - name: a key file that is not a key
        commands:
          - [mv, '{{ scenario_key }}', /root/real-key]
        files:
          - path: '{{ scenario_key }}'
            content: "not a key\n"
            mode: '0400'
        restore:
          - [rm, -f, '{{ scenario_key }}']
          - [mv, /root/real-key, '{{ scenario_key }}']
        expect: 'E-KEY-FORM: {{ scenario_key }}'
      - name: a file of someone else's in the key directory
        commands:
          - [touch, '{{ scenario_key_dir }}/notes.txt']
        restore:
          - [rm, -f, '{{ scenario_key_dir }}/notes.txt']
        expect: 'E-DIR-FOREIGN: {{ scenario_key_dir }}/notes.txt'

      # --- What the role stands on.
      - name: a parent directory that others can write
        commands:
          - [chmod, '0777', /etc/branchleft]
        restore:
          - [chmod, '0755', /etc/branchleft]
        expect: "A parent directory of the role is missing, is a link, is not root's or can be changed by others. The role does not make or change it."

      # --- The inputs, each refused before anything is changed, with no value in the message.
      - name: a digest in capitals
        digest: '{{ ring_controller_host_refusals_wrong_hex }}'
        url: '{{ scenario_bundle_url }}'
        expect: ring_controller_host_bundle_sha256 must be empty or 64 lowercase hex digits.
        forbidden:
          - '{{ ring_controller_host_refusals_wrong_hex }}'
      - name: a bundle URL with plain http
        digest: '{{ scenario_digest }}'
        url: http://bundle.example.test/ring-controller.tar.gz
        expect: ring_controller_host_bundle_url must be empty or an https URL with no user name, password, query or fragment.
        forbidden:
          - http://bundle.example.test
        absent:
          - /opt/branchleft/ring-controller/releases/{{ scenario_digest }}
      - name: a bundle URL that carries a credential
        digest: '{{ scenario_digest }}'
        url: https://u:p@bundle.example.test/ring-controller.tar.gz
        expect: ring_controller_host_bundle_url must be empty or an https URL with no user name, password, query or fragment.
        forbidden:
          - u:p@
      - name: the retired ledger URL input, with a value
        retired_ledger: https://ledger.example.test/ledger?token=x
        expect: ring_controller_host_ledger_url is retired and nothing reads it. Remove it from the owner's values.
        forbidden:
          - ledger.example.test
          - token=x
      - name: the retired ledger URL input, empty, which an old owner file may still set
        retired_ledger: ''
        expect: ring_controller_host_ledger_url is retired and nothing reads it. Remove it from the owner's values.
      - name: a digest with no bundle URL
        digest: '{{ scenario_digest }}'
        expect: ring_controller_host_bundle_url is empty while ring_controller_host_bundle_sha256 is set.
        absent:
          - /opt/branchleft/ring-controller/releases/{{ scenario_digest }}

      # The last control: well-formed inputs and no digest are accepted, and this one changes the
      # environment file, so it is the one case that may change a path.
      - name: control, every input set and no digest
        url: '{{ scenario_bundle_url }}'
        changes: true
  tasks:
    - name: Run each case
      ansible.builtin.include_tasks: tasks/case.yml
      loop: '{{ ring_controller_host_refusals_cases }}'
      loop_control:
        loop_var: ring_controller_host_refusals_case
        label: '{{ ring_controller_host_refusals_case.name }}'
