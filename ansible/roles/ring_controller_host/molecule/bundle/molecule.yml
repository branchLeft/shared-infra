---
# The bundle scenario: a digest is set, so the role fetches a pinned bundle, links it and turns
# the timer on; a wrong digest and a bundle that is not a root-owned executable are refused with
# the link unmoved. The platform is the default scenario's, for the same reasons.
dependency:
  name: galaxy
  # The harness installs the pinned collections before it starts Molecule.
  enabled: false
driver:
  name: docker
platforms:
  - name: 'role-test-${ROLE_TEST_RUN_ID:-unset/use-the-harness}'
    # Third-party systemd test base on Debian 13, trusted by digest (see the default scenario).
    image: geerlingguy/docker-debian13-ansible:latest@sha256:979c0d5e12b0035fff1c46bd4dfd00d67cd82fa48035194f14f32e01c8c02372
    pre_build_image: true
    keep_volumes: false
    # The host cgroup namespace is the stated ANS-15 exception the default scenario explains.
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    labels:
      branchleft.role-test-run: '${ROLE_TEST_RUN_ID}'
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        scenario_releases: /opt/branchleft/ring-controller/releases
        scenario_current: /opt/branchleft/ring-controller/current
        scenario_env_file: /etc/branchleft/ring-controller/ring-controller.env
        scenario_known_hosts: /etc/branchleft/ring-controller/known_hosts
        scenario_fixture_dir: /srv/ring-fixture
        # The test-only URL shape: the role's own pattern admits https only, so the scenario
        # widens it to the fixture directory, through the role parameters of each include.
        scenario_url_pattern: '^file:///srv/ring-fixture/[a-z.-]+\Z'
        scenario_good_url: file:///srv/ring-fixture/bundle-good.tar.gz
        scenario_noexec_url: file:///srv/ring-fixture/bundle-noexec.tar.gz
        scenario_ledger_url: https://ledger.example.test/ledger
        scenario_push_remote: ssh://git@git.example.test/example-org/example-ledger.git
        scenario_known_hosts_line: git.example.test ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA==
        # A well-formed digest of nothing that exists: a download with this digest must fail.
        scenario_wrong_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
verifier:
  name: ansible
