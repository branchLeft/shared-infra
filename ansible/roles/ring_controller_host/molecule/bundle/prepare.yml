---
# Test setup only. The parents stand in for the roles that run earlier on ops1, and two bundles
# are built here for a file:// URL (the role's own fetch has no network to reach in the test). Both hold only a
# stand-in program. The first is a root-owned executable, as a bundle must be. The second holds the
# program without its execute bit, so the role must refuse it.
- name: Prepare the instance
  hosts: all
  gather_facts: false
  tasks:
    - name: Make the parent directories, as the roles that run before this one do
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/branchleft
        - /opt/branchleft
        - /var/lib/branchleft
        - '{{ scenario_fixture_dir }}'
        - '{{ scenario_fixture_dir }}/good/bin'
        - '{{ scenario_fixture_dir }}/noexec/bin'

    - name: Put the stand-in program in each bundle's tree
      ansible.builtin.copy:
        content: "#!/bin/sh\nexit 0\n"
        dest: '{{ item.dest }}'
        owner: root
        group: root
        mode: '{{ item.mode }}'
      loop:
        - dest: '{{ scenario_fixture_dir }}/good/bin/ring-controller'
          mode: '0755'
        - dest: '{{ scenario_fixture_dir }}/noexec/bin/ring-controller'
          mode: '0644'

    - name: Build each bundle
      ansible.builtin.command:
        argv:
          [
            tar,
            -czf,
            '{{ scenario_fixture_dir }}/bundle-{{ item }}.tar.gz',
            -C,
            '{{ scenario_fixture_dir }}/{{ item }}',
            bin,
          ]
        creates: '{{ scenario_fixture_dir }}/bundle-{{ item }}.tar.gz'
      loop:
        - good
        - noexec
