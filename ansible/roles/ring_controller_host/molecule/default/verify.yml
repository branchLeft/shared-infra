---
# Every task that handles the private key's text has no_log and diff: false: the scan at the end
# reads the log of this play too. The key is read only from the throwaway container of this run.
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # --- The files the role made, with the owner and mode each must have.
    - name: Look at the files the role made
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop:
        - '{{ scenario_config_dir }}'
        - '{{ scenario_key_dir }}'
        - '{{ scenario_key }}'
        - '{{ scenario_public }}'
        - '{{ scenario_state_dir }}'
        - '{{ scenario_env_file }}'
        - '{{ scenario_service }}'
        - '{{ scenario_timer }}'
      register: ring_controller_host_v_stats

    - name: Name each file's facts by its path
      ansible.builtin.set_fact:
        ring_controller_host_v_by_path: >-
          {{ dict(ring_controller_host_v_stats.results | map(attribute='item')
          | zip(ring_controller_host_v_stats.results | map(attribute='stat'))) }}

    # The private key is root's with mode 0400, alone in a 0700 root directory, with one link. The
    # public half is root's and world-readable. Nothing about the key belongs to the service account.
    - name: Require the key and the directories to have the owner and mode the role means
      ansible.builtin.assert:
        that:
          - ring_controller_host_v_by_path[scenario_key_dir].isdir
          - ring_controller_host_v_by_path[scenario_key_dir].mode == '0700'
          - ring_controller_host_v_by_path[scenario_key_dir].pw_name == 'root'
          - ring_controller_host_v_by_path[scenario_key].isreg
          - ring_controller_host_v_by_path[scenario_key].mode == '0400'
          - ring_controller_host_v_by_path[scenario_key].pw_name == 'root'
          - ring_controller_host_v_by_path[scenario_key].gr_name == 'root'
          - ring_controller_host_v_by_path[scenario_key].nlink == 1
          - ring_controller_host_v_by_path[scenario_public].isreg
          - ring_controller_host_v_by_path[scenario_public].mode == '0444'
          - ring_controller_host_v_by_path[scenario_public].pw_name == 'root'
          - ring_controller_host_v_by_path[scenario_state_dir].isdir
          - ring_controller_host_v_by_path[scenario_state_dir].mode == '0700'
          - ring_controller_host_v_by_path[scenario_state_dir].pw_name == scenario_account
          - ring_controller_host_v_by_path[scenario_config_dir].mode == '0755'
          - ring_controller_host_v_by_path[scenario_config_dir].pw_name == 'root'
          - ring_controller_host_v_by_path[scenario_env_file].mode == '0644'
          - ring_controller_host_v_by_path[scenario_env_file].pw_name == 'root'
          - ring_controller_host_v_by_path[scenario_service].pw_name == 'root'
          - ring_controller_host_v_by_path[scenario_timer].pw_name == 'root'
        quiet: true

    - name: List the key directory, to require that nothing else is in it
      ansible.builtin.find:
        paths: '{{ scenario_key_dir }}'
        hidden: true
        file_type: any
      register: ring_controller_host_v_listing

    - name: Require exactly the key and no temporary file
      ansible.builtin.assert:
        that:
          - ring_controller_host_v_listing.files | map(attribute='path') | list == [scenario_key]
        quiet: true

    # The service account cannot read the key on disk. The control comes with it: root can, so a
    # probe that fails for the account is a probe that looked at a file that is there.
    - name: Try to read the key as the service account
      ansible.builtin.command:
        argv: [runuser, -u, '{{ scenario_account }}', --, test, -r, '{{ scenario_key }}']
      register: ring_controller_host_v_account_reads
      changed_when: false
      failed_when: false

    - name: Try to read the key as root, as the control
      ansible.builtin.command:
        argv: [test, -r, '{{ scenario_key }}']
      register: ring_controller_host_v_root_reads
      changed_when: false
      failed_when: false

    - name: Require the account to be unable to read the key and root to be able to
      ansible.builtin.assert:
        that:
          - ring_controller_host_v_account_reads.rc != 0
          - ring_controller_host_v_root_reads.rc == 0
        quiet: true
        fail_msg: The service account can read the record-signing key on disk, or the probe cannot tell.

    # --- Inert: no digest means no link, no release, a disabled and stopped timer.
    - name: Look for the current link and any release
      ansible.builtin.find:
        paths: /opt/branchleft/ring-controller
        recurse: true
        hidden: true
        file_type: any
      register: ring_controller_host_v_opt

    - name: Require no bundle, no release and no link while no digest is set
      ansible.builtin.assert:
        that:
          - ring_controller_host_v_opt.files | map(attribute='path') | select('search', 'current|bundle|bin') | list | length == 0
        quiet: true

    - name: Ask systemd for the timer and the service
      ansible.builtin.systemd_service:
        name: '{{ item }}'
      loop:
        - ring-controller.timer
        - ring-controller.service
      register: ring_controller_host_v_systemd

    - name: Require the timer to be installed, disabled and not running, and the service idle
      ansible.builtin.assert:
        that:
          - ring_controller_host_v_systemd.results[0].status.LoadState == 'loaded'
          - ring_controller_host_v_systemd.results[0].status.UnitFileState == 'disabled'
          - ring_controller_host_v_systemd.results[0].status.ActiveState == 'inactive'
          - ring_controller_host_v_systemd.results[1].status.LoadState == 'loaded'
          - ring_controller_host_v_systemd.results[1].status.ActiveState == 'inactive'
          - scenario_key in (ring_controller_host_v_systemd.results[1].status.LoadCredential | default(''))
        quiet: true
        fail_msg: The timer is not installed and held off, or the service is running with no digest set.

    - name: Read the service unit and the environment file, which are public
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ scenario_service }}'
        - '{{ scenario_env_file }}'
      register: ring_controller_host_v_public_reads

    - name: Hold the unit's text, its PATH and the names its environment file defines
      ansible.builtin.set_fact:
        ring_controller_host_v_unit_text: '{{ ring_controller_host_v_public_reads.results[0].content | b64decode }}'
        ring_controller_host_v_unit_path: >-
          {{ (ring_controller_host_v_public_reads.results[0].content | b64decode)
          | regex_search('(?m)^Environment=PATH=(.+)$', '\1') | first }}
        ring_controller_host_v_env_names: >-
          {{ (ring_controller_host_v_public_reads.results[1].content | b64decode)
          | regex_findall('(?m)^([A-Z0-9_]+)=') | sort }}

    - name: Require the unit to hold its condition, to be a plain unit and to run as the account
      ansible.builtin.assert:
        that:
          - "'ConditionPathExists=' ~ scenario_current ~ '/bin/ring-controller' in ring_controller_host_v_unit_text"
          - "'User=' ~ scenario_account in ring_controller_host_v_unit_text"
          - "('LoadCredential=record-signing:' ~ scenario_key) in ring_controller_host_v_unit_text"
          - ring_controller_host_v_unit_text is not search('(?m)^\s*PrivateNetwork\s*=')
          - "'%i' not in ring_controller_host_v_unit_text"
          - "'@' not in ring_controller_host_v_unit_text"
        quiet: true

    # The unit's environment is the exact allow-list of names, none a model key.
    - name: Require the environment file to hold exactly the allowed names and no model key
      ansible.builtin.assert:
        that:
          - ring_controller_host_v_env_names == scenario_env_names
          - ring_controller_host_v_env_names | select('search', '_API_KEY$|^ANTHROPIC_') | list | length == 0
        quiet: true

    # PATH resolves no claude. The probe runs with an empty environment and only the unit's
    # PATH. The control comes first in effect: with a stand-in claude planted in a directory on
    # that PATH, the same probe must find it, so a probe that finds nothing is a probe that looked.
    - name: Look for claude on the unit's PATH
      ansible.builtin.command:
        argv: [env, -i, 'PATH={{ ring_controller_host_v_unit_path }}', sh, -c, 'command -v claude']
      register: ring_controller_host_v_claude_absent
      changed_when: false
      failed_when: false

    - name: Plant a stand-in claude in a directory of that PATH, as the control
      ansible.builtin.copy:
        content: "#!/bin/sh\nexit 0\n"
        dest: /usr/local/bin/claude
        owner: root
        group: root
        mode: '0755'

    - name: Look for claude on the same PATH with the stand-in planted
      ansible.builtin.command:
        argv: [env, -i, 'PATH={{ ring_controller_host_v_unit_path }}', sh, -c, 'command -v claude']
      register: ring_controller_host_v_claude_planted
      changed_when: false
      failed_when: false

    - name: Take the stand-in away again
      ansible.builtin.file:
        path: /usr/local/bin/claude
        state: absent

    - name: Look for claude on the same PATH with the stand-in gone
      ansible.builtin.command:
        argv: [env, -i, 'PATH={{ ring_controller_host_v_unit_path }}', sh, -c, 'command -v claude']
      register: ring_controller_host_v_claude_gone
      changed_when: false
      failed_when: false

    - name: Require the probe to find nothing, to find the planted stand-in, and to find nothing again
      ansible.builtin.assert:
        that:
          - ring_controller_host_v_claude_absent.rc != 0
          - ring_controller_host_v_claude_planted.rc == 0
          - ring_controller_host_v_claude_planted.stdout == '/usr/local/bin/claude'
          - ring_controller_host_v_claude_gone.rc != 0
        quiet: true
        fail_msg: The PATH of the unit resolves a claude, or the probe cannot tell that it does.

    # --- The public half is the one the apply printed, in the form the controller reads (SPKI).
    - name: Read the public file
      ansible.builtin.slurp:
        src: '{{ scenario_public }}'
      register: ring_controller_host_v_pub

    - name: Read the log of the runs so far
      ansible.builtin.set_fact:
        ring_controller_host_v_log: "{{ lookup('ansible.builtin.file', scenario_log_path) }}"
      no_log: true
      diff: false

    - name: Hold the public lines
      ansible.builtin.set_fact:
        ring_controller_host_v_pub_lines: '{{ (ring_controller_host_v_pub.content | b64decode).splitlines() }}'

    # The 12 fixed bytes of an Ed25519 SubjectPublicKeyInfo come out as the same 16 characters at
    # the start of every such key, then 43 characters and one padding sign for the 32 key bytes.
    - name: Require the printed half to be the file's, and the file to be one SPKI key
      ansible.builtin.assert:
        that:
          - ring_controller_host_v_pub_lines | length == 3
          - ring_controller_host_v_pub_lines[0] == '-----BEGIN PUBLIC KEY-----'
          - ring_controller_host_v_pub_lines[1] is match('^MCowBQYDK2VwAyEA[A-Za-z0-9+/]{43}=$')
          - ring_controller_host_v_pub_lines[2] == '-----END PUBLIC KEY-----'
          - "'Ring controller record-signing public half (SPKI PEM)' in ring_controller_host_v_log"
          - ring_controller_host_v_pub_lines[1] in ring_controller_host_v_log
        quiet: true

    # --- A further apply changes nothing and prints the same half. The inode and the mtime of the
    # private key are the same afterwards, so the file was not rewritten.
    - name: Look at the private key before a rerun
      ansible.builtin.stat:
        path: '{{ scenario_key }}'
        get_checksum: false
      register: ring_controller_host_v_before

    - name: Apply the role again, as a rerun does
      ansible.builtin.include_role:
        name: branchleft.ring_controller_host

    - name: Look at the private key after the rerun
      ansible.builtin.stat:
        path: '{{ scenario_key }}'
        get_checksum: false
      register: ring_controller_host_v_after

    - name: Require the rerun to have changed nothing, made no key and left the file alone
      ansible.builtin.assert:
        that:
          - ring_controller_host_record_key_result is not changed
          - not ring_controller_host_record_key_result.created
          - not ring_controller_host_record_key_result.adopted
          - ring_controller_host_record_key_result.temp_cleaned == 0
          - ring_controller_host_record_key_result.public_key == (ring_controller_host_v_pub.content | b64decode)
          - ring_controller_host_v_after.stat.inode == ring_controller_host_v_before.stat.inode
          - ring_controller_host_v_after.stat.mtime == ring_controller_host_v_before.stat.mtime
        quiet: true
      no_log: true

    # --- The log and every file the run left on the controller hold no part of the private key.
    # They live in hidden facts and are used only by hidden tasks.
    - name: Read the private key
      ansible.builtin.slurp:
        src: '{{ scenario_key }}'
      register: ring_controller_host_v_key_read
      no_log: true

    - name: Hold the key's body line
      ansible.builtin.set_fact:
        ring_controller_host_v_key_body: >-
          {{ (ring_controller_host_v_key_read.content | b64decode).splitlines()[1] }}
      no_log: true
      diff: false

    # The PEM body is one line holding the whole key, and slurp prints the file as base64 of the
    # text, so those two are the forms a leak would take. Each is long enough to be specific.
    - name: Hold the tokens as one list
      ansible.builtin.set_fact:
        ring_controller_host_v_tokens: >-
          {{ [ring_controller_host_v_key_body, ring_controller_host_v_key_read.content] }}
      no_log: true
      diff: false

    - name: Require the tokens to be long enough to be specific to the key
      ansible.builtin.assert:
        that:
          - ring_controller_host_v_tokens | length == 2
          - ring_controller_host_v_tokens | map('length') | min >= 60
        quiet: true
      no_log: true

    - name: Print the scan's control, a key-shaped text that is meant to be in the log
      ansible.builtin.debug:
        msg: 'SCENARIO_SCAN_CONTROL {{ scenario_scan_control }}'

    - name: Read the log again, now that the control is in it
      ansible.builtin.set_fact:
        ring_controller_host_v_log: "{{ lookup('ansible.builtin.file', scenario_log_path) }}"
      no_log: true
      diff: false

    - name: Require the log to hold the output the scan is meant to read
      ansible.builtin.assert:
        that:
          - "'SCENARIO_LOG_CANARY' in ring_controller_host_v_log"
          - "'Make the record-signing key if it is absent' in ring_controller_host_v_log"
          - "('SCENARIO_SCAN_CONTROL ' ~ scenario_scan_control) in ring_controller_host_v_log"
        fail_msg: The log lacks the canary, a role task name or the scan control, so an empty scan would prove nothing.
        quiet: true

    - name: Require the log to hold no token of the key
      ansible.builtin.assert:
        that:
          - ring_controller_host_v_tokens | select('in', ring_controller_host_v_log) | list | length == 0
        fail_msg: The private key, or its slurp form, is in the Ansible log.
        quiet: true
      no_log: true

    - name: Look in every file this run left on the controller for each token
      delegate_to: localhost
      ansible.builtin.find:
        paths: '{{ scenario_ephemeral_dir }}'
        recurse: true
        hidden: true
        # Without this the pattern is matched at the start of each line only, and a token in the
        # middle of a line would not be found.
        read_whole_file: true
        contains: '{{ item | regex_escape }}'
      loop: '{{ ring_controller_host_v_tokens }}'
      register: ring_controller_host_v_tree_tokens
      no_log: true

    # The control is not a secret, so this task is not hidden: a scan that finds nothing is shown
    # with the directory it looked in.
    - name: Look in the same files for the control
      delegate_to: localhost
      ansible.builtin.find:
        paths: '{{ scenario_ephemeral_dir }}'
        recurse: true
        hidden: true
        read_whole_file: true
        contains: '{{ scenario_scan_control | regex_escape }}'
      register: ring_controller_host_v_tree_control

    - name: Require no token in any file on the controller, and the control in some
      ansible.builtin.assert:
        that:
          - ring_controller_host_v_tree_tokens.results | map(attribute='files') | map('length') | sum == 0
          - ring_controller_host_v_tree_control.files | length > 0
        fail_msg: The private key is in a file on the controller, or the control scan found nothing.
        quiet: true
      no_log: true
