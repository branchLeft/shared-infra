---
argument_specs:
  main:
    short_description: Make the ring controller's record-signing key and install its units, off until a digest is set
    description: >-
      Makes the ring controller's record-signing key (root's, mode 0400) the first time and never
      again, writes and prints its public half, installs a digest-pinned bundle when one is named,
      installs the service and timer units and an environment file of public values, and holds the
      timer disabled until a bundle digest is set. Every input is public data and none is a
      secret. An empty digest means the units are installed and inert.
    author: branchLeft
    options:
      ring_controller_host_bundle_sha256:
        type: str
        default: ''
        description: >-
          The sha256 of the ring controller bundle, 64 lowercase hex digits, or empty. Empty means
          no bundle is fetched, no link is made and the timer is held disabled and stopped. When set,
          the bundle URL must be set too.
      ring_controller_host_bundle_url:
        type: str
        default: ''
        description: >-
          Where the bundle is fetched from at apply time, an https URL with no credential, user
          name, query or fragment. The download must have the digest above or the role stops.
