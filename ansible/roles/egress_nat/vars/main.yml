---
# What the role carries. These are constants of the two reconcilers, not
# inputs, so they live here and not in defaults/: a caller cannot override them.
# Each source is read in place by the copy tasks (tasks/_reconciler.yml), so there is one
# copy of every file: the host egress pair is in hetzner/provision, the NAT program and its
# unit are in this role's files/.
egress_nat_host_egress:
  label: the private-host egress reconciler
  reconciler_src: '{{ role_path }}/../../../hetzner/provision/branchleft_host_egress.sh'
  reconciler_dest: /usr/local/sbin/branchleft-host-egress
  unit_src: '{{ role_path }}/../../../hetzner/provision/branchleft-host-egress.service'
  unit_name: branchleft-host-egress.service
  # Re-runs the reconciler about every minute, so a route lost after boot is put back.
  timer_src: '{{ role_path }}/../../../hetzner/provision/branchleft-host-egress.timer'
  timer_name: branchleft-host-egress.timer

egress_nat_nat_gateway:
  label: the NAT gateway reconciler
  reconciler_src: '{{ role_path }}/files/branchleft_nat.py'
  reconciler_dest: /usr/local/sbin/branchleft-nat
  unit_src: '{{ role_path }}/files/branchleft-nat.service'
  unit_name: branchleft-nat.service

# Where systemd looks for a unit an administrator installs.
egress_nat_unit_dir: /etc/systemd/system
