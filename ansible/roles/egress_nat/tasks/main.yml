---
# The order is the order of the shell scripts this replaces: 05-configure-host-egress.sh
# runs on every host, ahead of anything that needs apt, and nat-gateway.sh runs
# on the one gateway host only. Each is the same recipe, in _reconciler.yml,
# given its own constants from vars/main.yml.
- name: Install the private-host egress reconciler and its unit
  ansible.builtin.include_tasks: _reconciler.yml
  vars:
    egress_nat_item: '{{ egress_nat_host_egress }}'

- name: Install the NAT gateway reconciler and its unit
  ansible.builtin.include_tasks: _reconciler.yml
  vars:
    egress_nat_item: '{{ egress_nat_nat_gateway }}'
  when: egress_nat_gateway_enabled | bool
