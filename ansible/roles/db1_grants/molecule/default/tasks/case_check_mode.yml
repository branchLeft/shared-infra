---
# Check mode must read the real database, report what a real run would change, and
# change nothing. The harness's own check steps run against a host that is fresh
# or already configured; this is the one that runs against a host with a single
# difference. A readback that did not run in check mode would see no database at
# all, and the role would fail or report nothing.
- name: Read the configured database
  ansible.builtin.slurp:
    src: '{{ db1_grants_scenario_baseline_path }}'
  register: db1_grants_scenario_baseline_slurp

- name: Give the dump account RELOAD in place of BACKUP_ADMIN
  ansible.builtin.copy:
    content: >-
      {{ (db1_grants_scenario_baseline_slurp.content | b64decode | from_json)
      | combine({'users': (db1_grants_scenario_baseline_slurp.content | b64decode | from_json).users
      | combine({'backup@localhost': {'static': ['SELECT', 'PROCESS', 'LOCK TABLES', 'REPLICATION CLIENT', 'SHOW VIEW', 'EVENT', 'TRIGGER', 'RELOAD'],
      'dynamic': [], 'db': {}, 'auth': 'marker-backup', 'ssl_type': '', 'muc': 0}})})
      | to_nice_json }}
    dest: '{{ db1_grants_scenario_state_path }}'
    owner: root
    group: root
    mode: '0600'

- name: Keep the database and the number of changing statements before the check
  ansible.builtin.include_tasks: read_database.yml

- name: Remember them
  ansible.builtin.set_fact:
    db1_grants_scenario_before_state: '{{ db1_grants_scenario_now }}'
    db1_grants_scenario_before_changing: '{{ db1_grants_scenario_changing }}'

- name: Check the role against the host
  check_mode: true
  block:
    - name: Apply the role in check mode
      ansible.builtin.include_role:
        name: branchleft.db1_grants

- name: Read the database after the check
  ansible.builtin.include_tasks: read_database.yml

- name: Assert the check found the one difference and changed nothing
  ansible.builtin.assert:
    that:
      - db1_grants_any_drift
      - db1_grants_backup_drift
      - db1_grants_drift.backup_missing == ['BACKUP_ADMIN']
      - db1_grants_drift.backup_surplus == ['RELOAD']
      - not db1_grants_drift.ops1_create
      - db1_grants_drift.tenants == []
      - db1_grants_scenario_now == db1_grants_scenario_before_state
      - db1_grants_scenario_changing | int == db1_grants_scenario_before_changing | int
    fail_msg: Check mode did not report exactly the difference, or it changed the database.
    quiet: true

- name: Put the database back
  ansible.builtin.copy:
    src: '{{ db1_grants_scenario_baseline_path }}'
    dest: '{{ db1_grants_scenario_state_path }}'
    remote_src: true
    owner: root
    group: root
    mode: '0600'
