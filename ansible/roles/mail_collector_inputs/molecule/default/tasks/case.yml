---
# One case, included by verify.yml with scenario_case set. It puts the host in one bad state,
# runs the role, requires the expected code in the message (or acceptance, for a control), and
# then puts the host back in the good state, whatever the outcome.
- name: Reset what an earlier case left behind
  ansible.builtin.set_fact:
    mail_collector_inputs_case_outcome: ''

- name: Make the bad state, run the role against it and judge what happened
  block:
    - name: Run the commands that make the bad state
      ansible.builtin.command:
        argv: '{{ item }}'
      loop: '{{ scenario_case.commands | default([]) }}'
      loop_control:
        label: '{{ item | join(" ") }}'
      changed_when: true

    - name: Apply the role and note whether it accepted
      block:
        # The hosts a case lists stand for the owner's list, which the role reads and counts. A case
        # that lists none passes an empty list, so one case's list never reaches the next.
        - name: Apply the role, with the hosts the case lists
          ansible.builtin.include_role:
            name: branchleft.mail_collector_inputs
          vars:
            mail_collector_hosts: '{{ scenario_case.hosts | default([]) }}'

        - name: Note that the role accepted
          ansible.builtin.set_fact:
            mail_collector_inputs_case_outcome: accepted
      rescue:
        - name: Note the message the role stopped with
          ansible.builtin.set_fact:
            mail_collector_inputs_case_outcome: "{{ ansible_failed_result.msg | default('no message') }}"

    - name: Require the expected code, and no value in the message
      ansible.builtin.assert:
        that:
          - >-
            mail_collector_inputs_case_outcome == 'accepted'
            if scenario_case.expect == 'accepted'
            else scenario_case.expect in mail_collector_inputs_case_outcome
          - scenario_value_token not in mail_collector_inputs_case_outcome
          - scenario_value_pass not in mail_collector_inputs_case_outcome
          - scenario_value_url_id not in mail_collector_inputs_case_outcome
        fail_msg: 'Case "{{ scenario_case.name }}" gave "{{ mail_collector_inputs_case_outcome }}".'
        quiet: true
      no_log: true
  always:
    - name: Remove the file a link case moved aside
      ansible.builtin.file:
        path: '{{ scenario_credentials }}.real'
        state: absent

    - name: Put the directory back to what the owner made
      ansible.builtin.file:
        path: '{{ scenario_directory }}'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Put the good state back
      ansible.builtin.copy:
        content: |
          COLLECTOR_DRAIN_TOKEN={{ scenario_value_token }}
          COLLECTOR_HEARTBEAT_URL={{ scenario_value_url }}
          COLLECTOR_SMTP_USER=example-submission-user
          COLLECTOR_SMTP_PASS={{ scenario_value_pass }}
        dest: '{{ scenario_credentials }}'
        owner: root
        group: root
        mode: '0600'
      no_log: true
      diff: false

    - name: Put the descriptor back
      ansible.builtin.copy:
        content: '{}'
        dest: '{{ scenario_descriptor }}'
        owner: root
        group: root
        mode: '0644'
