---
# Fixed by the role, not by the inventory: these are not inputs. A path the check reads must
# not be moved by a play variable (ansible/README.md, variable precedence).
#
# The file the owner places, root-only, holding the collector's drain token, its dead-man's-switch
# URL and its submission user and password. The role never writes it and never returns a line.
mail_collector_inputs_secrets_path: /etc/branchleft/mail-collector/secrets.env

# The directory the collector reads descriptors from (COLLECTOR_DESCRIPTOR_DIR). One plain
# .json file in it names a host. With none, a collector given a real heartbeat URL withholds
# every ping and pages, so the check refuses that pair.
mail_collector_inputs_descriptor_dir: /etc/branchleft/mail-collector/descriptors
