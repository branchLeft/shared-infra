---
# A recorded copy of what the ghost-platform installers and programs require, as
# they are at the commit below. The role copies these lists into its own
# variables, so this file is the second copy that holds the first to account
# (verify.yml, "The role matches the installers it ports"). It was written by
# reading the files at that commit:
#
#   git show <commit>:control/provision/install_restore_drill.py   (ENV_FILE, REQUIRED_RELEASE_FILES)
#   git show <commit>:control/provision/install_state_copy.py      (Paths.env_file, REQUIRED_RELEASE_FILES, REQUIRED_ENV_NAMES)
#   git show <commit>:infra/provisioning/scripts/restore_drill.py  (copies_from_env, images_from_env)
#   git show <commit>:<path> | shasum -a 256                        (each sha256 below)
#
# To move to a new commit, read the files at it again, change this file and the
# role's lists and pins together, and let the scenario compare them. Nothing
# here is fetched at test time, so the scenario cannot see an installer that
# changed after this commit; that is the README's named limit.
installer_contract_commit: 5e52f78427cab104438057164e4baa16b329875c

# The sha256 of each program the role stages and the installers' own files; the
# role's pin for each (backup_worker_release_files) must equal it.
