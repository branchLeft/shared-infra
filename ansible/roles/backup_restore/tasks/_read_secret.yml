---
# One secret file, read and checked. Internal: main.yml includes it once per
# secret, with backup_restore_source holding the name and the path. The name
# and the path are not secret; the value never appears in a message, only in the
# fact backup_restore_secret_values, which main.yml empties when it is done.
- name: Look at the secret file
  ansible.builtin.stat:
    path: '{{ backup_restore_source.path }}'
    follow: false
    get_checksum: false
  register: backup_restore_source_stat

# A file the owner has not placed yet is not an error: the environment file that
# needs it is left as it is, and a timer that needs it is refused (main.yml).
- name: Note a secret file that is not placed yet
  ansible.builtin.set_fact:
    backup_restore_secrets_missing: '{{ backup_restore_secrets_missing + [backup_restore_source.name] }}'
  when: not backup_restore_source_stat.stat.exists

- name: Check and read a secret file that is placed
  when: backup_restore_source_stat.stat.exists
  block:
    # stat does not follow a link, so a link is not a regular file. The
    # directory is root-only, so nobody else can swap the file after this check.
    - name: Refuse a secret file that is not a plain root-only file
      ansible.builtin.assert:
        that:
          - backup_restore_source_stat.stat.isreg
          - not backup_restore_source_stat.stat.islnk
          - backup_restore_source_stat.stat.pw_name == 'root'
          - backup_restore_source_stat.stat.gr_name == 'root'
          - backup_restore_source_stat.stat.mode == '0600'
        quiet: true
        fail_msg: >-
          The secret file {{ backup_restore_source.path }} must be a plain file owned by root,
          group root, mode 0600 (not a link, and not open to anyone else).

    - name: Read the secret file
      ansible.builtin.slurp:
        src: '{{ backup_restore_source.path }}'
      register: backup_restore_source_raw
      no_log: true

    # Only two truth values leave this task, so the assertions below can print a
    # message without a value in it.
    - name: Work out whether the secret is one credential and whether it is a private age identity
      ansible.builtin.set_fact:
        backup_restore_source_wellformed: '{{ (backup_restore_source_raw.content | b64decode) is match(backup_restore_secret_content_pattern) }}'
        backup_restore_source_identity: '{{ backup_restore_age_identity_marker in (backup_restore_source_raw.content | b64decode) }}'
      no_log: true

    - name: Refuse a secret that is not exactly one credential on one line
      ansible.builtin.assert:
        that:
          - backup_restore_source_wellformed | bool
        quiet: true
        fail_msg: >-
          The secret file {{ backup_restore_source.path }} must hold exactly one credential on one line
          (letters, digits and / + = _ . - only). The content is not shown.

    - name: Refuse a secret that is a private age identity
      ansible.builtin.assert:
        that:
          - not (backup_restore_source_identity | bool)
        quiet: true
        fail_msg: >-
          The secret file {{ backup_restore_source.path }} holds a private age identity. A private
          identity never belongs on this host in a file this role reads.

    - name: Keep the secret for the environment file
      ansible.builtin.set_fact:
        backup_restore_secret_values: >-
          {{ backup_restore_secret_values
          | combine({backup_restore_source.name: (backup_restore_source_raw.content | b64decode | trim)}) }}
      no_log: true
  always:
    - name: Forget the raw secret
      ansible.builtin.set_fact:
        backup_restore_source_raw: {}
      no_log: true
