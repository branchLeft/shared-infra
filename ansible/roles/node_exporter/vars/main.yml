---
# Internal to the role, not part of its interface: role variables outrank every
# value a caller passes. These paths are written into the unit file the role
# installs (node-exporter.service runs the binary with the textfile directory and
# the port below), so a caller that changed one would install a unit that disagrees
# with the file it names.

node_exporter_bin_path: /usr/local/bin/node_exporter
node_exporter_unit_path: /etc/systemd/system/node_exporter.service
node_exporter_env_dir: /etc/default
node_exporter_env_file: /etc/default/node-exporter
node_exporter_user: node-exporter
node_exporter_port: 9100
node_exporter_textfile_dir: /var/lib/branchleft/backup-worker-exporter

# Mount types the disk check ignores: none of them is a disk the volume check is
# about.
node_exporter_disk_excluded_fstypes:
  - tmpfs
  - devtmpfs
  - overlay
  - squashfs
  - proc
  - sysfs
  - cgroup
  - cgroup2
  - devpts
  - autofs
  - mqueue
  - fuse.lxcfs
