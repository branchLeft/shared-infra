---
# Internal to the role, not part of its interface. The unit files name these
# paths in their own lines (WorkingDirectory and ExecStart), so a caller that
# could change them would install programs the units never run.
db1_backup_timers_db_dir: /opt/branchleft/db
db1_backup_timers_provision_dir: /opt/branchleft/db/provision
db1_backup_timers_recovery_dir: /opt/branchleft/db/recovery
db1_backup_timers_unit_dir: /etc/systemd/system

# The programs are not copied into this role. Each is fetched at install time from
# ghost-platform at one pinned commit, the full 40-character sha, so a branch or tag
# cannot move under the role. Each fetch is checked against the digest below. Keeping
# one home for a program (ghost-platform) is the reuse rule; the role only names it.
db1_backup_timers_ghost_commit: 5e52f78427cab104438057164e4baa16b329875c
db1_backup_timers_ghost_raw_base: 'https://raw.githubusercontent.com/branchLeft/ghost-platform/{{ db1_backup_timers_ghost_commit }}'

# The programs the units run, and the modules they import from the same
# directory: the closure of dump_nightly, ship_binlogs, prune_backups,
# dump_tenant and promotion_gate. Each is fetched from db/provision at the commit.
db1_backup_timers_provision_files:
  - bounded_snapshot.py
  - dump_nightly.py
  - dump_tenant.py
  - extract_tenant_binlog.py
  - naming.py
  - objectstorage.py
  - prune_backups.py
  - promotion_gate.py
  - ship_binlogs.py

# The restore and recovery programs, fetched from db/recovery at the commit. Nothing
# on the host runs them: a person runs them in a restore, so the role delivers them
# and starts nothing.
db1_backup_timers_recovery_files:
  - check_toolchain_version.py
  - restore_drained.py

# The sha256 of each program at the pinned commit, read from the git blob of the
# file at that commit. A fetch whose bytes differ fails, and verify checks the same.
db1_backup_timers_program_sha256:
  bounded_snapshot.py: b0e99f26baade745ed508dee959b8bd9405aecdc84b4cf77237737bc21cacfe0
  dump_nightly.py: fd0ce0daa21a40dae42f4e2913248f25c9fd6bd1977fad2f754ed1f83c26c88d
  dump_tenant.py: d87c3b5f11b6dd82fbeb84919cdbf486ff8b39b906faece2fdfb027cf1777bc4
  extract_tenant_binlog.py: 63a7615f6d1f01e70a897fed41eea2b9e371779866535cd2863edac49bc7f92e
  naming.py: 288a31eed9758644d6a73928b949bc3607c905adfc2f2f4f563701dc740f6480
  objectstorage.py: 1559ad94f6348c65fc4f3840385c70ab012ca76eb9cd98ba835360594e54589c
  promotion_gate.py: ee81177192b2a762ef9b0d61a630fd5676d94961ecb6773ce884f90b2404bb08
  prune_backups.py: c8cab2f42f8b73a8d7040f7db7db2c083b21a109460761f836daef480d401c56
  ship_binlogs.py: e8cce2f3efe8b2dda28d279854864435aacb13f11066112c85566a458d4f66c3
  check_toolchain_version.py: 9b245e2a801075ef593e4527fc9fad56958a3dbe15f97c7c408ddffc2bf7388a
  restore_drained.py: cfd6a02d990359596056dea785fc4881001c20282ba55a77cbfb0c88be97c1d0

db1_backup_timers_units:
  - branchleft-db-dump.service
  - branchleft-db-dump.timer
  - branchleft-db-prune.service
  - branchleft-db-prune.timer
  - branchleft-db-binlog-ship.service
  - branchleft-db-binlog-ship.timer

db1_backup_timers_timers:
  - branchleft-db-dump.timer
  - branchleft-db-prune.timer
  - branchleft-db-binlog-ship.timer
