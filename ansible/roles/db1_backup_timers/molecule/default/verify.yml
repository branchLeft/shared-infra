---
# What must be on the host is the role's own copies, byte for byte, owned by root
# with mode 0644, in the directories the units name. The file lists are read from
# the role's vars file, so a file dropped from the role's lists is missing on the
# host and fails this play. The sources are read from the role's files directory
# on the machine that runs the test, so a copy that differs from its source fails.
- name: Verify the backup programs, units and timers
  hosts: all
  gather_facts: false
  vars:
    verify_role_dir: '{{ playbook_dir }}/../..'
    verify_role_files: '{{ verify_role_dir }}/files'
    verify_provision_dir: /opt/branchleft/db/provision
    verify_recovery_dir: /opt/branchleft/db/recovery
    verify_unit_dir: /etc/systemd/system
  tasks:
    - name: Read the role's file lists
      ansible.builtin.include_vars:
        file: '{{ verify_role_dir }}/vars/main.yml'

    - name: Assert each listed file is on the instance, its source, root-owned, mode 0644
      ansible.builtin.include_tasks: verify_file.yml
      loop:
        - {
            dir: '{{ verify_provision_dir }}',
            src: 'provision',
            names: '{{ db1_backup_timers_provision_files }}',
          }
        - {
            dir: '{{ verify_recovery_dir }}',
            src: 'recovery',
            names: '{{ db1_backup_timers_recovery_files }}',
          }
        - { dir: '{{ verify_unit_dir }}', src: 'units', names: '{{ db1_backup_timers_units }}' }
      loop_control:
        loop_var: verify_group
        label: '{{ verify_group.src }}'

    - name: Ask systemd for each timer
      ansible.builtin.systemd_service:
        name: '{{ item }}'
      loop: '{{ db1_backup_timers_timers }}'
      register: db1_backup_timers_verify_timers

    - name: Assert each timer is enabled and active
      ansible.builtin.assert:
        that:
          - item.status.UnitFileState == 'enabled'
          - item.status.ActiveState == 'active'
        quiet: true
        fail_msg: '{{ item.item }} is not enabled and active.'
      loop: '{{ db1_backup_timers_verify_timers.results }}'
      loop_control:
        label: '{{ item.item }}'
