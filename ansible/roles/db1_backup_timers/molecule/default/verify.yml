---
# What must be on the host: each program is the file at the pinned ghost-platform
# commit, checked by its digest; each unit is the role's own copy, byte for byte.
# All are owned by root with mode 0644, in the directories the units name. The file
# lists are read from the role's vars file, so a file dropped from the role's lists
# is missing on the host and fails this play.
- name: Verify the backup programs, units and timers
  hosts: all
  gather_facts: false
  vars:
    verify_role_dir: '{{ playbook_dir }}/../..'
    verify_role_files: '{{ verify_role_dir }}/files'
    verify_provision_dir: /opt/branchleft/db/provision
    verify_recovery_dir: /opt/branchleft/db/recovery
    verify_unit_dir: /etc/systemd/system
  tasks:
    - name: Read the role's file lists
      ansible.builtin.include_vars:
        file: '{{ verify_role_dir }}/vars/main.yml'

    - name: Assert each program is the pinned ghost-platform file, root-owned, mode 0644
      ansible.builtin.include_tasks: tasks/verify_program.yml
      loop:
        - dir: '{{ verify_provision_dir }}'
          names: '{{ db1_backup_timers_provision_files }}'
        - dir: '{{ verify_recovery_dir }}'
          names: '{{ db1_backup_timers_recovery_files }}'
      loop_control:
        loop_var: verify_group
        label: '{{ verify_group.dir }}'

    - name: Assert each unit is its source, root-owned, mode 0644
      ansible.builtin.include_tasks: tasks/verify_file.yml
      loop:
        - dir: '{{ verify_unit_dir }}'
          src: 'units'
          names: '{{ db1_backup_timers_units }}'
      loop_control:
        loop_var: verify_group
        label: '{{ verify_group.src }}'

    - name: Ask systemd for each timer
      ansible.builtin.systemd_service:
        name: '{{ item }}'
      loop: '{{ db1_backup_timers_timers }}'
      register: db1_backup_timers_verify_timers

    - name: Assert each timer is enabled and active
      ansible.builtin.assert:
        that:
          - item.status.UnitFileState == 'enabled'
          - item.status.ActiveState == 'active'
        quiet: true
        fail_msg: '{{ item.item }} is not enabled and active.'
      loop: '{{ db1_backup_timers_verify_timers.results }}'
      loop_control:
        label: '{{ item.item }}'
