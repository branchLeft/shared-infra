---
# The file on the host has other bytes, mode 0666 and an owner that is not root.
# The role must replace it with the pinned bytes. The tampered state is read first,
# so the case cannot pass on a file that was never tampered with.
- name: Empty what an earlier case left
  ansible.builtin.set_fact:
    db1_backup_timers_refusals_before: {}
    db1_backup_timers_refusals_after: {}

- name: Put tampered bytes in place
  ansible.builtin.copy:
    content: "tampered\n"
    dest: '{{ verify_program_path }}'
    owner: nobody
    group: nogroup
    mode: '0666'

- name: Read the tampered file
  ansible.builtin.stat:
    path: '{{ verify_program_path }}'
    checksum_algorithm: sha256
  register: db1_backup_timers_refusals_before

- name: Assert the file is tampered
  ansible.builtin.assert:
    that:
      - db1_backup_timers_refusals_before.stat.checksum != db1_backup_timers_program_sha256[verify_program]
      - db1_backup_timers_refusals_before.stat.mode == '0666'
      - db1_backup_timers_refusals_before.stat.pw_name != 'root'
    quiet: true
    fail_msg: The case did not tamper with the file, so it would prove nothing.

- name: Apply the role
  ansible.builtin.include_role:
    name: branchleft.db1_backup_timers

- name: Read the file after the role
  ansible.builtin.stat:
    path: '{{ verify_program_path }}'
    checksum_algorithm: sha256
  register: db1_backup_timers_refusals_after

- name: Assert the pinned bytes are back, root-owned, mode 0644
  ansible.builtin.assert:
    that:
      - db1_backup_timers_refusals_after.stat.exists
      - db1_backup_timers_refusals_after.stat.isreg
      - db1_backup_timers_refusals_after.stat.checksum == db1_backup_timers_program_sha256[verify_program]
      - db1_backup_timers_refusals_after.stat.pw_name == 'root'
      - db1_backup_timers_refusals_after.stat.gr_name == 'root'
      - db1_backup_timers_refusals_after.stat.mode == '0644'
    quiet: true
    fail_msg: A tampered program was not replaced by the pinned bytes as a root-owned file with mode 0644.
