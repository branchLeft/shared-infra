argument_specs:
  main:
    short_description: Install the SNDS reputation collector and its timer
    description: >-
      Installs the SNDS collector program, its service and its timer, creates the directories
      the collector runs from and writes to, and enables and starts the timer. The role takes
      no input. The collector's access URL is read from a file the role never writes. The node
      exporter is a separate role, node_exporter.
