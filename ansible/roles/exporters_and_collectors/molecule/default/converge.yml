---
- name: Converge
  hosts: all
  gather_facts: true
  # The container has an address on the Docker bridge, not on the estate subnet, so the
  # test names the bridge's prefix. The disk stop is set to 100: the mounts the check reads
  # here belong to the test host, and a full one is refused by its own assertion instead.
  vars:
    exporters_and_collectors_node_exporter_subnet_prefix: '172.'
    exporters_and_collectors_disk_stop_percent: 100
  tasks:
    - name: Apply the role
      ansible.builtin.include_role:
        # Molecule links the role under its namespace and name, from meta/main.yml.
        name: branchleft.exporters_and_collectors
