---
# What must be on the host is read from the repository's own files, not from the role,
# so a copy that differs from its source fails here.
- name: Verify the SNDS collector and its timer
  hosts: all
  gather_facts: false
  vars:
    verify_repo: '{{ playbook_dir }}/../../../../..'
    verify_snds_program_src: '{{ verify_repo }}/hetzner/monitoring/stack/snds/collect_snds_metrics.py'
    verify_snds_service_src: '{{ verify_repo }}/hetzner/monitoring/systemd/snds-collector.service'
    verify_snds_timer_src: '{{ verify_repo }}/hetzner/monitoring/systemd/snds-collector.timer'
  tasks:
    - name: Read each installed file on the instance
      ansible.builtin.stat:
        path: '{{ item }}'
        checksum_algorithm: sha256
      loop:
        - /opt/branchleft/monitoring/snds/collect_snds_metrics.py
        - /etc/systemd/system/snds-collector.service
        - /etc/systemd/system/snds-collector.timer
        - /var/lib/branchleft/snds-exporter
      register: exporters_and_collectors_verify_installed

    - name: Read each source file in the repository, on the machine that runs the test
      ansible.builtin.stat:
        path: '{{ item }}'
        checksum_algorithm: sha256
      loop:
        - '{{ verify_snds_program_src }}'
        - '{{ verify_snds_service_src }}'
        - '{{ verify_snds_timer_src }}'
      register: exporters_and_collectors_verify_sources
      delegate_to: localhost

    - name: Assert the program, the service and the timer are byte for byte their sources, mode 0644
      ansible.builtin.assert:
        that:
          - exporters_and_collectors_verify_installed.results[0].stat.checksum == exporters_and_collectors_verify_sources.results[0].stat.checksum
          - exporters_and_collectors_verify_installed.results[1].stat.checksum == exporters_and_collectors_verify_sources.results[1].stat.checksum
          - exporters_and_collectors_verify_installed.results[2].stat.checksum == exporters_and_collectors_verify_sources.results[2].stat.checksum
          - exporters_and_collectors_verify_installed.results[0].stat.mode == '0644'
          - exporters_and_collectors_verify_installed.results[1].stat.mode == '0644'
          - exporters_and_collectors_verify_installed.results[2].stat.mode == '0644'
        quiet: true
        fail_msg: The SNDS program, service or timer is missing, or differs from its source in the repository.

    - name: Ask systemd for the SNDS timer
      ansible.builtin.systemd_service:
        name: snds-collector.timer
      register: exporters_and_collectors_verify_timer

    - name: Assert the SNDS timer is active and enabled
      ansible.builtin.assert:
        that:
          - exporters_and_collectors_verify_timer.status.ActiveState == 'active'
          - exporters_and_collectors_verify_timer.status.UnitFileState == 'enabled'
        quiet: true
        fail_msg: The snds-collector timer is not active and enabled.
