---
argument_specs:
  main:
    short_description: Install the break-glass minter on the control host and check its signing key
    description: >-
      Fetches the minter program from one pinned commit and holds it to its sha256,
      pulls the Node image the role pins (a constant, not an input) by digest only
      when the host lacks it, and then looks at the signing key with stat alone (no
      checksum, no content). It never creates, reads, copies or lists the key, runs
      the minter, or sets a run-time secret. The key is made by hand (runbook Part A
      steps 4 and 5) before the first apply. The one input is not a secret.
    author: branchLeft
    options:
      breakglass_mint_host_source_commit:
        type: str
        default: 5e52f78427cab104438057164e4baa16b329875c
        description: >-
          The full 40-character commit of the ghost-platform repository the minter
          is fetched at. The download is held to the sha256 in the role, so a
          commit whose bytes differ stops the run. Must equal the commit in
          breakglass_grant_host_source_commit; the role's test compares the two.
