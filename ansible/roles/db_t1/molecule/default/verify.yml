---
# What must be on the instance after the converge with an image. The files are compared
# with the role's own templates rendered on the machine that runs the test. The deploy
# program is a stand-in that records its calls, so the single call and the pin it wrote
# are asserted. The sentinel root value must appear in no log (ANS-16).
- name: Verify the instance
  hosts: all
  gather_facts: false
  # The role's own fixed values, so the templates are rendered with the values the
  # role uses and cannot drift from them.
  vars_files:
    - ../../vars/main.yml
  vars:
    db_t1_verify_project: /opt/branchleft/dbt1
    db_t1_verify_unit: branchleft-compose@dbt1.service
  tasks:
    - name: Read the directories and files the role delivers
      ansible.builtin.stat:
        path: '{{ item }}'
        get_checksum: false
      loop:
        - /etc/branchleft
        - /opt/branchleft
        - '{{ db_t1_verify_project }}'
        - '{{ db_t1_verify_project }}/conf.d'
        - '{{ db_t1_verify_project }}/run'
        - '{{ db_t1_verify_project }}/run/mysqld'
        - '{{ db_t1_verify_project }}/compose.yml'
        - '{{ db_t1_verify_project }}/conf.d/branchleft.cnf'
        - /etc/branchleft/dbt1.image.env
        - /etc/branchleft/dbt1.env
        - /etc/branchleft/registry
        - /etc/branchleft/registry/docker
        - /etc/branchleft/registry/docker/config.json
      register: db_t1_verify_paths

    - name: Assert the directories are root-owned 0755 and the socket directory belongs to the container user
      ansible.builtin.assert:
        that:
          - item.stat.isdir
          - item.stat.mode == '0755'
          - item.stat.uid == (1001 if item.item.endswith('/run/mysqld') else 0)
          - item.stat.gid == 0
        quiet: true
        fail_msg: A directory is missing, not mode 0755, or not owned as the role states.
      loop: '{{ db_t1_verify_paths.results[0:6] }}'
      loop_control:
        label: '{{ item.item }}'

    - name: Assert the compose file and the configuration are root 0644 plain files
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - item.stat.mode == '0644'
          - item.stat.uid == 0
          - item.stat.gid == 0
        quiet: true
        fail_msg: The compose file or the configuration is missing or not root 0644.
      loop: '{{ db_t1_verify_paths.results[6:8] }}'
      loop_control:
        label: '{{ item.item }}'

    - name: Assert the pin, written by the stand-in, is root 0600 and the root file is untouched
      ansible.builtin.assert:
        that:
          - db_t1_verify_paths.results[8].stat.isreg
          - db_t1_verify_paths.results[8].stat.mode == '0600'
          - db_t1_verify_paths.results[9].stat.isreg
          - db_t1_verify_paths.results[9].stat.mode == '0600'
          - db_t1_verify_paths.results[9].stat.uid == 0
        quiet: true
        fail_msg: The pin or the owner-placed root file is not a plain root 0600 file.

    # The registry key the converge gave the role: the directory above is root 0755, the key
    # directory root 0700 and the file root 0600, a plain file. The content is compared on the
    # controller with the sentinel and never printed.
    - name: Assert the registry key directory and file are root's and closed
      ansible.builtin.assert:
        that:
          - db_t1_verify_paths.results[10].stat.isdir
          - db_t1_verify_paths.results[10].stat.mode == '0755'
          - db_t1_verify_paths.results[11].stat.isdir
          - db_t1_verify_paths.results[11].stat.mode == '0700'
          - db_t1_verify_paths.results[12].stat.isreg
          - not db_t1_verify_paths.results[12].stat.islnk
          - db_t1_verify_paths.results[12].stat.mode == '0600'
          - db_t1_verify_paths.results[12].stat.pw_name == 'root'
          - db_t1_verify_paths.results[12].stat.gr_name == 'root'
          - db_t1_verify_paths.results[10:13] | map(attribute='stat.uid') | unique | list == [0]
        quiet: true
        fail_msg: The registry key directory or file is missing, not closed, or not root's.

    - name: Read the registry key the role wrote
      ansible.builtin.slurp:
        src: /etc/branchleft/registry/docker/config.json
      register: db_t1_verify_registry
      no_log: true

    - name: Assert the registry key holds one entry for ghcr.io made from the login and the sentinel
      ansible.builtin.assert:
        that:
          - >-
            db_t1_verify_registry_doc ==
            {'auths': {'ghcr.io': {'auth': (('scenario-reader' ~ ':' ~ db_t1_verify_registry_token) | b64encode)}}}
        quiet: true
      vars:
        db_t1_verify_registry_doc: '{{ db_t1_verify_registry.content | b64decode | from_json }}'
        db_t1_verify_registry_token: "{{ lookup('ansible.builtin.file', scenario_sentinel_dir ~ '/registry_token') }}"
      no_log: true

    - name: Read the delivered files
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ db_t1_verify_project }}/compose.yml'
        - '{{ db_t1_verify_project }}/conf.d/branchleft.cnf'
        - /etc/branchleft/dbt1.image.env
        - '{{ scenario_deploy_log }}'
      register: db_t1_verify_files

    - name: Render the role's own templates on the machine that runs the test
      ansible.builtin.set_fact:
        db_t1_verify_compose: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../templates/compose.yml.j2') }}"
        db_t1_verify_cnf: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../templates/branchleft.cnf.j2') }}"

    - name: Assert the files are the rendered templates, the pin is the one line and the deploy was called once
      ansible.builtin.assert:
        that:
          - (db_t1_verify_files.results[0].content | b64decode) == db_t1_verify_compose
          - (db_t1_verify_files.results[1].content | b64decode) == db_t1_verify_cnf
          - (db_t1_verify_files.results[2].content | b64decode) == ('IMAGE=' ~ scenario_image ~ db_t1_line_end)
          - (db_t1_verify_files.results[3].content | b64decode) == ('dbt1 ' ~ scenario_image ~ db_t1_line_end)
        quiet: true
        fail_msg: >-
          A delivered file differs from its template, the pin is not the one line, or the
          deploy program was not called exactly once with the stack and the image.

    - name: Assert the compose file keeps the properties the role exists for
      ansible.builtin.assert:
        that:
          - "'image: ${IMAGE}' in db_t1_verify_compose"
          - "'MYSQL_ROOT_HOST: localhost' in db_t1_verify_compose"
          - "'PERCONA_TELEMETRY_DISABLE' in db_t1_verify_compose"
          - "'network_mode: host' in db_t1_verify_compose"
          - "'ports:' not in db_t1_verify_compose"
          - "('bind-address = ' ~ db_t1_private_address ~ '\\n') in db_t1_verify_cnf"
          - "'bind-address = 0.0.0.0' not in db_t1_verify_cnf"
          - "'bind-address = 127.0.0.1' not in db_t1_verify_cnf"
          - "'mysqlx = OFF' in db_t1_verify_cnf"
          - "'gtid_mode = ON' in db_t1_verify_cnf"
        quiet: true
        fail_msg: The rendered compose file or configuration lost a property the role exists for.

    - name: Ask systemd for the stack's unit
      ansible.builtin.systemd_service:
        name: '{{ db_t1_verify_unit }}'
      register: db_t1_verify_unit_state

    - name: Assert the unit is enabled and the role did not start it
      ansible.builtin.assert:
        that:
          - db_t1_verify_unit_state.status.UnitFileState == 'enabled'
          - db_t1_verify_unit_state.status.ActiveState != 'active'
        quiet: true
        fail_msg: The stack's unit is not enabled, or the role started it (only the deploy program starts it).

    # ----- The database port rule -----

    - name: Read the filter table back from the kernel
      ansible.builtin.command:
        argv: [iptables, -S]
      register: db_t1_verify_filter
      changed_when: false

    # Nothing else of the firewall was written: the table holds this chain, the jump and nothing
    # more, and the policies are the ones the container started with.
    - name: Assert the table holds the chain, its two rules in order and the one jump, and nothing else
      ansible.builtin.assert:
        that:
          - db_t1_verify_filter.stdout_lines | select('match', '^-A ') | list == expected_rules
          - "'-P INPUT ACCEPT' in db_t1_verify_filter.stdout_lines"
          - "'-P FORWARD ACCEPT' in db_t1_verify_filter.stdout_lines"
          - "'-P OUTPUT ACCEPT' in db_t1_verify_filter.stdout_lines"
          - db_t1_verify_filter.stdout_lines | select('match', '^-N ') | list == ['-N ' ~ db_t1_rule_chain]
        quiet: true
        fail_msg: >-
          The filter table is not the chain, its two rules and the one jump of the database port
          rule, or a policy moved. It holds {{ db_t1_verify_filter.stdout_lines }}.
      vars:
        expected_rules:
          - '-A INPUT -j {{ db_t1_rule_chain }}'
          - '-A {{ db_t1_rule_chain }} -s {{ db_t1_client_address }}/32 -p tcp -m tcp --dport {{ db_t1_port }} -j ACCEPT'
          - '-A {{ db_t1_rule_chain }} -p tcp -m tcp --dport {{ db_t1_port }} -j DROP'

    - name: Read the rule unit, the drop-in and Docker's unit back from systemd
      ansible.builtin.systemd_service:
        name: '{{ item }}'
      loop:
        - '{{ db_t1_rule_unit_name }}'
        - '{{ db_t1_rule_docker_unit_name }}'
      register: db_t1_verify_rule_units

    - name: Assert the rule unit is active and enabled and Docker requires it and starts after it
      ansible.builtin.assert:
        that:
          - db_t1_verify_rule_units.results[0].status.ActiveState == 'active'
          - db_t1_verify_rule_units.results[0].status.UnitFileState == 'enabled'
          - db_t1_rule_unit_name in db_t1_verify_rule_units.results[1].status.Requires.split()
          - db_t1_rule_unit_name in db_t1_verify_rule_units.results[1].status.After.split()
          - db_t1_rule_docker_unit_name in db_t1_verify_rule_units.results[0].status.Before.split()
        quiet: true
        fail_msg: The rule unit is not active and enabled, or Docker does not require it and follow it, or the unit is not before Docker.

    # The behavioural proof. Two listeners on the database address, 3306 (the database's) and
    # 3307 (any other port), then a connection to each from the application host's address,
    # from an address that is neither, and from the database host's own address. An accepted
    # connection completes against the listener's backlog; a dropped one times out.
    - name: Place the connection probe
      ansible.builtin.copy:
        content: |
          import json
          import socket

          ADDRESS = "{{ db_t1_private_address }}"


          def listen(port):
              listener = socket.socket()
              listener.bind((ADDRESS, port))
              listener.listen(8)
              return listener


          def attempt(source, port):
              client = socket.socket()
              client.settimeout(3)
              client.bind((source, 0))
              try:
                  client.connect((ADDRESS, port))
              except socket.timeout:
                  return "timeout"
              except OSError as error:
                  return "error " + str(error)
              finally:
                  client.close()
              return "connected"


          listeners = [listen({{ db_t1_port }}), listen({{ db_t1_port + 1 }})]
          print(json.dumps({
              "app_database_port": attempt("{{ db_t1_client_address }}", {{ db_t1_port }}),
              "other_database_port": attempt("10.20.1.99", {{ db_t1_port }}),
              "self_database_port": attempt(ADDRESS, {{ db_t1_port }}),
              "app_other_port": attempt("{{ db_t1_client_address }}", {{ db_t1_port + 1 }}),
              "other_other_port": attempt("10.20.1.99", {{ db_t1_port + 1 }}),
          }))
        dest: /var/tmp/db-t1-connection-probe.py
        owner: root
        group: root
        mode: '0644'

    - name: Connect to the database address from each source
      ansible.builtin.command:
        argv: [/usr/bin/python3, /var/tmp/db-t1-connection-probe.py]
      register: db_t1_verify_probe
      changed_when: false

    - name: Assert only the application host reaches the database port and no other port is limited
      ansible.builtin.assert:
        that:
          - db_t1_verify_probe.stdout | from_json == expected
        quiet: true
        fail_msg: >-
          The connections did not end as the rule says they must: {{ db_t1_verify_probe.stdout }}.
      vars:
        expected:
          app_database_port: connected
          other_database_port: timeout
          self_database_port: timeout
          app_other_port: connected
          other_other_port: connected

- name: Verify that no log shows the root value
  hosts: localhost
  gather_facts: false
  # The log is read on the controller. The control case is the canary the converge
  # prints through a task with no no_log: without it, an empty scan would prove nothing.
  tasks:
    - name: Read the log of the whole scenario and the sentinel
      ansible.builtin.set_fact:
        db_t1_verify_log: "{{ lookup('ansible.builtin.file', scenario_log_path) }}"
        db_t1_verify_sentinel: "{{ lookup('ansible.builtin.file', scenario_sentinel_dir ~ '/root_value') }}"
        db_t1_verify_registry_sentinel: "{{ lookup('ansible.builtin.file', scenario_sentinel_dir ~ '/registry_token') }}"
      no_log: true

    - name: Assert the log shows the control case and the role's tasks
      ansible.builtin.assert:
        that:
          - "'SCENARIO_LOG_CANARY' in db_t1_verify_log"
          - "'Look for the one expected line in the root file' in db_t1_verify_log"
          - "'Write the registry key as a Docker config with one entry' in db_t1_verify_log"
        quiet: true
        fail_msg: The log lacks the canary or a task of the role, so an empty scan would prove nothing.

    - name: Assert the root value is in no log
      ansible.builtin.assert:
        that:
          - db_t1_verify_sentinel not in db_t1_verify_log
          - db_t1_verify_sentinel | length == 40
        quiet: true
        fail_msg: The throwaway root value appears in the log, or the sentinel is not the expected one. The value is not printed.
      no_log: true

    # The token, and the base64 of the login and token the file holds, are in no log. The base64 is
    # made here from the sentinel, so a leak of the encoded value is found as well as of the text.
    - name: Assert the registry token is in no log, as text or as the encoded entry
      ansible.builtin.assert:
        that:
          - db_t1_verify_registry_sentinel not in db_t1_verify_log
          - db_t1_verify_registry_sentinel[4:] not in db_t1_verify_log
          - (('scenario-reader' ~ ':' ~ db_t1_verify_registry_sentinel) | b64encode) not in db_t1_verify_log
          - db_t1_verify_registry_sentinel | length == 40
        quiet: true
        fail_msg: The throwaway registry token appears in the log, or the sentinel is not the expected one. The value is not printed.
      no_log: true
