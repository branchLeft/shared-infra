---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    # Molecule links the role under its namespace and name, the namespace from
    # galaxy_info in meta/main.yml. The include carries no no_log: the role's own
    # tasks must be the ones that keep the root value out of the log, and a keyword
    # here would hide a missing one.
    - name: Apply the role with an image
      ansible.builtin.include_role:
        name: branchleft.db_t1
      vars:
        db_t1_image: '{{ scenario_image }}'
        # What the host's inputs file gives on the real host: the login is a plain name and the
        # token a throwaway made by prepare.yml. No no_log on the include, as for the image: the
        # role's own tasks must keep the token out of the log.
        db_t1_registry_login: scenario-reader
        db_t1_registry_token: "{{ lookup('ansible.builtin.file', scenario_sentinel_dir ~ '/registry_token') }}"

    # The control case for the log check in verify.yml: a task with no no_log that
    # is given a known value. If the log did not show it, an empty result of the
    # sentinel scan would mean nothing.
    - name: Run a harmless command that is given a canary argument
      ansible.builtin.command:
        argv:
          - /bin/true
          - SCENARIO_LOG_CANARY
      changed_when: false
      check_mode: false
