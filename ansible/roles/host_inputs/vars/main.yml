---
# Constants of the loader, not inputs: role variables outrank every value a play
# or an inventory passes, and the pull route has no -e (check_enrolment R2), so a
# caller cannot move the file or loosen what is asked of it.

# The one file. The owner writes it once at bootstrap, by hand, and edits it by
# hand to rotate a value (README, "Bootstrap and rotation"). The role never
# writes it.
host_inputs_path: /etc/branchleft/host-inputs.json

# Every directory above the file, root first. Each must be a real directory owned
# by uid 0 that neither its group nor others can write, or whoever can write one
# could rename the directory below it and put a file of their own in its place.
# Keep this list the path of the file, one entry per parent.
host_inputs_ancestors:
  - /
  - /etc
  - /etc/branchleft

# Who may own the file and the directories above it, and the only mode the file
# may have. The mode is compared as the exact string the stat module returns, not
# as bits, so 0640, 0400 and 0700 are refused as well as 0644.
host_inputs_owner_uid: 0
host_inputs_group_gid: 0
host_inputs_file_mode: '0600'

# The inputs each host's file must hold, by the name of the role argument each one
# feeds, and nothing else: a key outside this host's row is refused, so the file
# cannot set a protected pull key (pull_trigger_signers, enrolled_host). A host
# with no row is refused.

# A new host or name is an edit here, to the literal keys of the "Set each input"
# task in tasks/main.yml, and to checks/host_roles.yml (the owner's merge).
# checks/test_host_inputs_registry.py fails when they disagree.
host_inputs_required_by_host:
  db1:
    - db1_stack_exporter_password
    - db1_grants_tenants
    - db1_grants_ops1_host
  app1:
    - website_app1_smtp_host
    - website_app1_smtp_port
    - website_app1_smtp_user
    - website_app1_smtp_password

# A value that is only white space counts as empty. Matched from the start, so
# \s*\Z holds for the empty string and for blanks and nothing else.
host_inputs_blank_pattern: '\s*\Z'
