---
# What must be on the instance is read from the repository's own files, not from the role, so a
# verifier that differs from its source in hetzner/provision fails here. The gh pin is checked by
# the version the installed binary reports and by the digest the role verified at download (the
# role refuses a download with another digest, so a converge that completed proves it).
- name: Verify the deploy verifier and the pinned gh
  hosts: all
  gather_facts: false
  vars_files:
    # The pin is read from the role's own vars, so this check cannot hold a second copy of it.
    - ../../vars/main.yml
  vars:
    verify_repo: '{{ playbook_dir }}/../../../../..'
    verify_program_src: '{{ verify_repo }}/hetzner/provision/branchleft-verify-image'
  tasks:
    - name: Read the installed verifier, its home and the gh directory
      ansible.builtin.stat:
        path: '{{ item }}'
        checksum_algorithm: sha256
        follow: false
      loop:
        - /usr/local/sbin/branchleft-verify-image
        - /usr/local/libexec/branchleft-verifier/gh
        - /var/lib/branchleft/verifier-home
        - /usr/local/libexec/branchleft-verifier
      register: deploy_verifier_verify_installed

    - name: Read the verifier source in the repository, on the machine that runs the test
      ansible.builtin.stat:
        path: '{{ verify_program_src }}'
        checksum_algorithm: sha256
      register: deploy_verifier_verify_source
      delegate_to: localhost

    - name: Assert the installed files are the ones the role installs
      ansible.builtin.assert:
        that:
          - deploy_verifier_verify_installed.results[0].stat.checksum == deploy_verifier_verify_source.stat.checksum
          - deploy_verifier_verify_installed.results[0].stat.mode == '0755'
          - deploy_verifier_verify_installed.results[0].stat.pw_name == 'root'
          - deploy_verifier_verify_installed.results[1].stat.mode == '0755'
          - deploy_verifier_verify_installed.results[1].stat.pw_name == 'root'
          - deploy_verifier_verify_installed.results[2].stat.mode == '0700'
          - deploy_verifier_verify_installed.results[2].stat.pw_name == 'root'
          - deploy_verifier_verify_installed.results[3].stat.mode == '0755'
          - deploy_verifier_verify_installed.results[3].stat.isdir
        fail_msg: >-
          The verifier, the gh binary, the verifier's home or the gh directory is not the mode, owner or
          content the role installs.
        quiet: true

    - name: Read the version the installed gh reports
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/branchleft-verifier/gh
          - --version
      register: deploy_verifier_verify_gh
      changed_when: false

    - name: Assert the installed gh is the pinned release
      ansible.builtin.assert:
        that:
          - "('gh version ' ~ deploy_verifier_gh_version ~ ' ') in deploy_verifier_verify_gh.stdout"
        fail_msg: The installed gh is not the pinned release.
        quiet: true

    # The registry read key check, case by case. Each case builds the directory in this
    # container, runs the role's own check file and removes the directory again.
    - name: Run each case of the registry read key check
      ansible.builtin.include_tasks: tasks/case_registry_key.yml
      vars:
        case_name: '{{ item.name }}'
        case_dir_mode: '{{ item.dir_mode }}'
        case_file_mode: '{{ item.file_mode }}'
        case_content: '{{ item.content }}'
        case_expect: '{{ item.expect }}'
      loop:
        - name: no key placed
          dir_mode: ''
          file_mode: ''
          content: ''
          expect: pass
        - name: key placed for the one registry
          dir_mode: '0700'
          file_mode: '0600'
          content: '{"auths": {"ghcr.io": {"auth": "SENTINELVALUE"}}}'
          expect: pass
        - name: directory open to others
          dir_mode: '0755'
          file_mode: '0600'
          content: '{"auths": {"ghcr.io": {"auth": "SENTINELVALUE"}}}'
          expect: registry key directory
        - name: file open to others
          dir_mode: '0700'
          file_mode: '0644'
          content: '{"auths": {"ghcr.io": {"auth": "SENTINELVALUE"}}}'
          expect: registry key file
        - name: directory without a file
          dir_mode: '0700'
          file_mode: ''
          content: ''
          expect: registry key file
        - name: a second registry beside the first
          dir_mode: '0700'
          file_mode: '0600'
          content: '{"auths": {"ghcr.io": {"auth": "SENTINELVALUE"}, "docker.io": {"auth": "SENTINELVALUE"}}}'
          expect: registry key content
        - name: another registry only
          dir_mode: '0700'
          file_mode: '0600'
          content: '{"auths": {"docker.io": {"auth": "SENTINELVALUE"}}}'
          expect: registry key content
        - name: an entry with no auth
          dir_mode: '0700'
          file_mode: '0600'
          content: '{"auths": {"ghcr.io": {}}}'
          expect: registry key content
        - name: a credential helper named
          dir_mode: '0700'
          file_mode: '0600'
          content: '{"auths": {"ghcr.io": {"auth": "SENTINELVALUE"}}, "credsStore": "helper"}'
          expect: registry key content
        - name: not JSON
          dir_mode: '0700'
          file_mode: '0600'
          content: 'SENTINELVALUE'
          expect: registry key content
        - name: JSON that is not an object
          dir_mode: '0700'
          file_mode: '0600'
          content: '["SENTINELVALUE"]'
          expect: registry key content
      loop_control:
        label: '{{ item.name }}'
