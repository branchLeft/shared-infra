---
# What must be on the instance is read from the role's own files/, so a verifier that differs from
# its source fails here. The gh pin is checked by
# the version the installed binary reports and by the digest the role verified at download (the
# role refuses a download with another digest, so a converge that completed proves it).
- name: Verify the deploy verifier and the pinned gh
  hosts: all
  gather_facts: false
  vars_files:
    # The pin is read from the role's own vars, so this check cannot hold a second copy of it.
    - ../../vars/main.yml
  vars:
    verify_program_src: '{{ playbook_dir }}/../../files/branchleft-verify-image.py'
  tasks:
    - name: Read the installed verifier, its home and the gh directory
      ansible.builtin.stat:
        path: '{{ item }}'
        checksum_algorithm: sha256
        follow: false
      loop:
        - /usr/local/sbin/branchleft-verify-image
        - /usr/local/libexec/branchleft-verifier/gh
        - /var/lib/branchleft/verifier-home
        - /usr/local/libexec/branchleft-verifier
      register: deploy_verifier_verify_installed

    - name: Read the verifier source in the repository, on the machine that runs the test
      ansible.builtin.stat:
        path: '{{ verify_program_src }}'
        checksum_algorithm: sha256
      register: deploy_verifier_verify_source
      delegate_to: localhost

    - name: Assert the installed files are the ones the role installs
      ansible.builtin.assert:
        that:
          - deploy_verifier_verify_installed.results[0].stat.checksum == deploy_verifier_verify_source.stat.checksum
          - deploy_verifier_verify_installed.results[0].stat.mode == '0755'
          - deploy_verifier_verify_installed.results[0].stat.pw_name == 'root'
          - deploy_verifier_verify_installed.results[1].stat.mode == '0755'
          - deploy_verifier_verify_installed.results[1].stat.pw_name == 'root'
          - deploy_verifier_verify_installed.results[2].stat.mode == '0700'
          - deploy_verifier_verify_installed.results[2].stat.pw_name == 'root'
          - deploy_verifier_verify_installed.results[3].stat.mode == '0755'
          - deploy_verifier_verify_installed.results[3].stat.isdir
        fail_msg: >-
          The verifier, the gh binary, the verifier's home or the gh directory is not the mode, owner or
          content the role installs.
        quiet: true

    - name: Read the version the installed gh reports
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/branchleft-verifier/gh
          - --version
      register: deploy_verifier_verify_gh
      changed_when: false

    - name: Assert the installed gh is the pinned release
      ansible.builtin.assert:
        that:
          - "('gh version ' ~ deploy_verifier_gh_version ~ ' ') in deploy_verifier_verify_gh.stdout"
        fail_msg: The installed gh is not the pinned release.
        quiet: true
