---
# The role as the delivery plan runs it: the verify runs this playbook with ansible-playbook
# --check --diff (tasks/plan_retired_verifier.yml), because a task's check_mode keyword does not
# make the role see ansible_check_mode.
- name: Plan the deploy verifier
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply the role in the plan, as a playbook would
      ansible.builtin.include_role:
        name: branchleft.deploy_verifier
