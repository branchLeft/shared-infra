---
# One case of the grant-content control, imported by converge.yml with
# converge_case.line (the line that replaces the first prepared reset rule, so the
# count of rules is unchanged) and converge_case.expect (the phrase of the
# refusal that must fire). The grant is broker_deploy's file, so the case copies
# it aside, edits it, and moves the copy back, owner, mode and time included; the
# checksum and time are compared at the end. A plan makes no change, so a check
# run skips it.
- name: Refuse a grant line the check must refuse
  hosts: all
  gather_facts: false
  vars:
    converge_grant: /etc/sudoers.d/branchleft-slot
    converge_grant_aside: /root/branchleft-slot.sudoers.aside
  tasks:
    - name: Prove a grant line the check refuses stops the run
      when: not ansible_check_mode
      block:
        - name: Look at the grant before the case edits it
          ansible.builtin.stat:
            path: '{{ converge_grant }}'
            follow: false
            checksum_algorithm: sha256
          register: demo1_build_converge_grant_before

        - name: Copy the grant aside, keeping its owner, mode and time
          ansible.builtin.command:
            argv:
              - /bin/cp
              - -p
              - '{{ converge_grant }}'
              - '{{ converge_grant_aside }}'
            creates: '{{ converge_grant_aside }}'
          changed_when: false

        - name: Replace one prepared rule with the case's line
          ansible.builtin.lineinfile:
            path: '{{ converge_grant }}'
            regexp: '^broker ALL=\(root\) NOPASSWD: /usr/local/sbin/branchleft-slot 0 reset$'
            line: '{{ converge_case.line }}'
            validate: /usr/sbin/visudo -csf %s
          changed_when: false

        - name: Apply the role against the edited grant
          ansible.builtin.include_role:
            name: branchleft.demo1_build

        - name: Fail if the refused grant was accepted
          ansible.builtin.fail:
            msg: The role accepted a sudoers grant with a line it must refuse.
      rescue:
        - name: Assert the refusal was the one this case is for
          ansible.builtin.assert:
            that:
              - converge_case.expect in (ansible_failed_result.msg | default(''))
            quiet: true
            fail_msg: >-
              The role failed on the line {{ converge_case.line }} for a reason other than {{ converge_case.expect }}:
              {{ ansible_failed_result.msg | default('') }}
      always:
        - name: Put the grant back as it was
          ansible.builtin.command:
            argv:
              - /bin/mv
              - '{{ converge_grant_aside }}'
              - '{{ converge_grant }}'
            removes: '{{ converge_grant_aside }}'
          changed_when: false
          when: not ansible_check_mode

        - name: Look at the grant after it was put back
          ansible.builtin.stat:
            path: '{{ converge_grant }}'
            follow: false
            checksum_algorithm: sha256
          register: demo1_build_converge_grant_restored
          when: not ansible_check_mode

        - name: Assert the grant is what it was
          ansible.builtin.assert:
            that:
              - demo1_build_converge_grant_restored.stat.checksum == demo1_build_converge_grant_before.stat.checksum
              - demo1_build_converge_grant_restored.stat.mtime == demo1_build_converge_grant_before.stat.mtime
              - demo1_build_converge_grant_restored.stat.mode == '0440'
            quiet: true
            fail_msg: The case did not put the sudoers grant back as it found it.
          when: not ansible_check_mode
