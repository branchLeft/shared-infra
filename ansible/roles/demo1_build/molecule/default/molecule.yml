---
# The role's container-only test (ANS-15). The harness in ansible/harness
# sets ROLE_TEST_RUN_ID, so the instance name is unique to one run and a
# destroy can only ever remove this run's container. Molecule's interpolation
# has no "required variable" form, so when the variable is unset the name
# falls back to one the Docker daemon rejects: the run fails at create, loudly,
# instead of sharing a container name with another run.
#
# The refusals scenario's molecule.yml is a link to this file, so the platform
# and its pin have this one home. The harness reads the link as it reads any
# scenario file.
dependency:
  name: galaxy
  # The harness installs the pinned collections before it starts Molecule.
  enabled: false
driver:
  name: docker
platforms:
  - name: 'role-test-${ROLE_TEST_RUN_ID:-unset/use-the-harness}'
    # Third-party systemd test base on Debian 13, the release every production
    # host runs, trusted by digest, the same platform the monitoring_stack role
    # uses. The digest is the pin; the tag is informational. The role reloads
    # systemd and reads a unit's loaded state, so the platform runs systemd as
    # PID 1, a platform the author justifies here, per ANS-15.
    image: geerlingguy/docker-debian13-ansible:latest@sha256:979c0d5e12b0035fff1c46bd4dfd00d67cd82fa48035194f14f32e01c8c02372
    # Pre-built, so that the reference can carry a digest.
    pre_build_image: true
    # Destroy removes the container's anonymous volumes. This scenario's cgroup
    # bind mount means none is created; the key guards against one if the mount
    # is ever dropped.
    keep_volumes: false
    # No privileged mode and no added capabilities. The host cgroup namespace
    # is a stated exception (ANS-15), the same one the monitoring_stack role
    # states: a private namespace over the read-write cgroup mount makes systemd
    # exit at once on a cgroup v2 host. The test image is trusted by digest and
    # the job holds no credentials.
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    # The demo host's egress allowlist holds the package mirrors only, so the role
    # must work with GitHub and its container registry unreachable. Both names
    # resolve to the container's own loopback, where nothing listens: a request to
    # either fails at once, and verify.yml asserts that it does, so a role that
    # reached for either would fail here and not pass on a runner that has internet.
    # The plan and refusals scenarios link this file, so they run blocked too.
    etc_hosts:
      raw.githubusercontent.com: 127.0.0.1
      ghcr.io: 127.0.0.1
    labels:
      branchleft.role-test-run: '${ROLE_TEST_RUN_ID}'
provisioner:
  name: ansible
verifier:
  name: ansible
