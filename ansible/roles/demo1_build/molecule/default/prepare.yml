---
# Test scaffolding, not role tasks. It stands in for what the broker_deploy role
# leaves on a host, which is what demo1_build depends on and never writes: the
# broker account, the state directories, the sudoers grant and the environment
# file. The grant and the environment file are rendered from broker_deploy's own
# templates with its own defaults, read from that role's directory, so the test
# runs the role against the real component's output and not against a fixture
# written to match. The packages are what the host build installs (sudo for
# visudo, which checks the grant) and what a real host has.
- name: Prepare
  hosts: all
  gather_facts: false
  vars_files:
    - '{{ playbook_dir }}/../../../broker_deploy/defaults/main.yml'
  vars:
    broker_deploy_templates: '{{ playbook_dir }}/../../../broker_deploy/templates'
  tasks:
    - name: Install sudo, which holds visudo, and the certificates the program download needs
      ansible.builtin.apt:
        name:
          - sudo
          - ca-certificates
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the configuration and state directories, as broker_deploy does
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - '{{ broker_deploy_config_dir }}'
        - '{{ broker_deploy_state_dir }}'

    - name: Create the broker account, as broker_deploy does
      ansible.builtin.user:
        name: '{{ broker_deploy_user }}'
        system: true
        shell: /usr/sbin/nologin
        home: '{{ broker_deploy_user_home }}'
        create_home: false

    - name: Create the broker's slots directory, as broker_deploy does
      ansible.builtin.file:
        path: '{{ broker_deploy_slots_dir }}'
        state: directory
        owner: '{{ broker_deploy_user }}'
        group: '{{ broker_deploy_user }}'
        mode: '0755'

    - name: Install the sudoers grant from broker_deploy's own template
      ansible.builtin.template:
        src: '{{ broker_deploy_templates }}/branchleft-slot.sudoers.j2'
        dest: '{{ broker_deploy_sudoers_path }}'
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -csf %s

    - name: Install the broker's environment file from broker_deploy's own template
      ansible.builtin.template:
        src: '{{ broker_deploy_templates }}/broker.env.j2'
        dest: '{{ broker_deploy_env_file }}'
        owner: root
        group: root
        mode: '0600'
