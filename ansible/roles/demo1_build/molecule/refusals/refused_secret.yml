---
# One case of the secret-holder check, imported by converge.yml. The role's host scan
# (_secret_holders.yml) finds every secret-bearing file under the scanned roots, and in
# the secrets directory, and refuses a file the holder list does not name. The step must
# refuse before anything else is done, name the path and never a value, and leave the
# planted file where it was put.
#
# converge_case.plant is a list of: key (a private key, found by its header), token (a
# KEY=value secret line, found by its name), secret_dir (any file in the secrets
# directory, found by where it sits). converge_case.expect is the text the refusal must
# carry. Without plant the case is a control, converge_case.accepted: true: the host as
# prepared holds nothing the list does not name, so the step accepts it.
#
# The canary value is written only into the planted files, under no_log and diff: false,
# so the refusal can be checked not to print it. Everything the case planted is removed
# in every outcome. The case is skipped by Molecule's idempotence step (the tag below),
# because it plants and removes files each time it runs. A plan makes no change, so a
# check run skips it.
- name: Refuse or accept a secret-bearing file the holder list does not name
  hosts: all
  gather_facts: false
  tags: [molecule-idempotence-notest]
  vars:
    converge_canary: 'STAND-IN-UNLISTED-SECRET-NOT-A-CREDENTIAL'
    converge_key_path: /root/stray/unlisted-key.txt
    converge_token_path: /etc/branchleft/unlisted-token.env
    converge_secret_dir_path: /etc/branchleft/secrets/unlisted-file
    converge_tunnel_dir: /etc/ssh/branchleft-broker-tunnel
    converge_tunnel_path: /etc/ssh/branchleft-broker-tunnel/authorized_keys
  tasks:
    - name: Plant the files the case says and run the role's host scan on its own
      when: not ansible_check_mode
      block:
        - name: Make the directory a stray key goes in
          ansible.builtin.file:
            path: /root/stray
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"key" in converge_case.plant | default([])'

        - name: Plant a private key the holder list does not name
          ansible.builtin.copy:
            content: "-----BEGIN OPENSSH PRIVATE KEY-----\n{{ converge_canary }}\n-----END OPENSSH PRIVATE KEY-----\n"
            dest: '{{ converge_key_path }}'
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"key" in converge_case.plant | default([])'

        - name: Plant a token line the holder list does not name
          ansible.builtin.copy:
            content: "UNLISTED_TEST_TOKEN={{ converge_canary }}\n"
            dest: '{{ converge_token_path }}'
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"token" in converge_case.plant | default([])'

        - name: Plant a file in the secrets directory the holder list does not name
          ansible.builtin.copy:
            content: "{{ converge_canary }}\n"
            dest: '{{ converge_secret_dir_path }}'
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"secret_dir" in converge_case.plant | default([])'

        - name: Make the directory the broker tunnel key goes in, as the tunnel change does
          ansible.builtin.file:
            path: '{{ converge_tunnel_dir }}'
            state: directory
            owner: root
            group: root
            mode: '0755'
          changed_when: false
          when: '"tunnel" in converge_case.plant | default([])'

        # The key the broker tunnel change places. Its row is on the holder list, so this host is
        # accepted; with no row it would be refused. This case proves the row accepts the file.
        - name: Plant the broker tunnel key the holder list names
          ansible.builtin.copy:
            content: "restrict,port-forwarding,permitopen=\"127.0.0.1:8090\" ssh-ed25519 STAND-IN-PUBLIC-KEY-NOT-A-CREDENTIAL\n"
            dest: '{{ converge_tunnel_path }}'
            owner: root
            group: root
            mode: '0644'
          changed_when: false
          no_log: true
          diff: false
          when: '"tunnel" in converge_case.plant | default([])'

        - name: Run the role's host scan on its own
          ansible.builtin.include_role:
            name: branchleft.demo1_build
            tasks_from: _secret_holders.yml

        - name: Fail if a host the case must refuse was accepted
          ansible.builtin.fail:
            msg: The role accepted a host holding a secret-bearing file the holder list does not name.
          when: converge_case.expect is defined

      rescue:
        - name: Fail a control case that the host scan refused
          ansible.builtin.fail:
            msg: 'The control case was refused: {{ ansible_failed_result.msg | default("") }}'
          when: converge_case.expect is not defined

        - name: Assert the refusal was the one this case is for, named the planted paths and printed no value
          ansible.builtin.assert:
            that:
              - converge_case.expect in (ansible_failed_result.msg | default(''))
              - "'key' not in converge_case.plant | default([]) or converge_key_path in (ansible_failed_result.msg | default(''))"
              - "'token' not in converge_case.plant | default([]) or converge_token_path in (ansible_failed_result.msg | default(''))"
              - "'secret_dir' not in converge_case.plant | default([]) or converge_secret_dir_path in (ansible_failed_result.msg | default(''))"
              - 'converge_canary not in (ansible_failed_result | string)'
            quiet: true
            fail_msg: 'The role failed for a reason other than the one this case is for: {{ ansible_failed_result.msg | default("") }}'

      always:
        - name: Remove the planted files and the stray directory
          ansible.builtin.file:
            path: '{{ item }}'
            state: absent
          loop:
            - '{{ converge_key_path }}'
            - '{{ converge_token_path }}'
            - '{{ converge_secret_dir_path }}'
            - /root/stray
            - '{{ converge_tunnel_path }}'
            - '{{ converge_tunnel_dir }}'
          changed_when: false
          when: not ansible_check_mode
