---
# One case of the secret-holder check, imported by converge.yml. The role's host scan
# (_secret_holders.yml) finds every secret-bearing file under the scanned roots and in the
# holder directories, and refuses a file the holder list does not name. The step must refuse
# before anything else is done, name every planted path and never a value, and leave the planted
# files where they were put.
#
# converge_case.plant is a list of cases, each planting one thing:
#   key          a private key under /root (found by its header)
#   token        a KEY=value secret line in /etc (found by its name)
#   secret_dir   any file in the secrets directory (found by where it sits)
#   link         a link named like a key, pointing outside the roots at a key (found by its name)
#   srv          a private key under /srv (found by the widened roots)
#   home_ansible a private key under /home/<user>/.ansible (only /root/.ansible is excluded)
#   forms        six content shapes, each in its own file (spaced key, YAML, JSON, PGP block,
#                export line, GitHub token)
#   ci           the CI key line in /home/ansible-ci/.ssh/authorized_keys (listed: accepted)
#   tunnel       the broker tunnel key line (listed: accepted)
# converge_case.expect is the text the refusal must carry. A case with no plant is the control,
# converge_case.accepted: true: the host as prepared holds nothing the list does not name.
#
# The canary value is written only into the planted files, under no_log and diff: false, so the
# refusal can be checked not to print it. Everything the case planted is removed in every
# outcome. The case is skipped by Molecule's idempotence step (the tag below), because it plants
# and removes files each time it runs. A plan makes no change, so a check run skips it.
- name: Refuse or accept a secret-bearing file the holder list does not name
  hosts: all
  gather_facts: false
  tags: [molecule-idempotence-notest]
  vars:
    converge_canary: 'STAND-IN-UNLISTED-SECRET-NOT-A-CREDENTIAL'
    converge_pem: "-----BEGIN OPENSSH PRIVATE KEY-----\n{{ converge_canary }}\n-----END OPENSSH PRIVATE KEY-----\n"
    converge_plant_paths:
      key: [/root/stray/unlisted-key.txt]
      token: [/etc/unlisted-holder-token.env]
      secret_dir: [/etc/branchleft/secrets/unlisted-file]
      link: [/root/stray/id_link]
      srv: [/srv/stray/unlisted-key.txt]
      home_ansible: [/home/stray/.ansible/unlisted-key.txt]
      forms:
        - /etc/branchleft/forms/spaced.conf
        - /etc/branchleft/forms/config.yml
        - /etc/branchleft/forms/config.json
        - /etc/branchleft/forms/key.asc
        - /etc/branchleft/forms/profile.sh
        - /etc/branchleft/forms/gh.txt
    converge_forms:
      - path: /etc/branchleft/forms/spaced.conf
        content: "  demo_api_token = {{ converge_canary }}\n"
      - path: /etc/branchleft/forms/config.yml
        content: "service:\n  token: {{ converge_canary }}\n"
      - path: /etc/branchleft/forms/config.json
        content: '{"token": "{{ converge_canary }}"}'
      - path: /etc/branchleft/forms/key.asc
        content: "-----BEGIN PGP PRIVATE KEY BLOCK-----\n{{ converge_canary }}\n-----END PGP PRIVATE KEY BLOCK-----\n"
      - path: /etc/branchleft/forms/profile.sh
        content: "export DEMO_TOKEN={{ converge_canary }}\n"
      - path: /etc/branchleft/forms/gh.txt
        content: "github_pat_TESTONLY0000000000000000000000\n"
    converge_expected: "{{ converge_case.plant | default([]) | map('extract', converge_plant_paths) | flatten }}"
    converge_tunnel_dir: /etc/ssh/branchleft-broker-tunnel
    converge_tunnel_path: /etc/ssh/branchleft-broker-tunnel/authorized_keys
    converge_link_target: /var/tmp/outside-link-target.txt
  tasks:
    - name: Plant the files the case says and run the role's host scan on its own
      when: not ansible_check_mode
      block:
        - name: Make the directory the stray key and link go in
          ansible.builtin.file:
            path: /root/stray
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"key" in converge_case.plant | default([]) or "link" in converge_case.plant | default([])'

        - name: Plant a private key the holder list does not name
          ansible.builtin.copy:
            content: '{{ converge_pem }}'
            dest: /root/stray/unlisted-key.txt
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"key" in converge_case.plant | default([])'

        - name: Plant the key a link will point at, outside the scanned roots
          ansible.builtin.copy:
            content: '{{ converge_pem }}'
            dest: '{{ converge_link_target }}'
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"link" in converge_case.plant | default([])'

        - name: Plant a link named like a key, pointing at that key
          ansible.builtin.file:
            src: '{{ converge_link_target }}'
            dest: /root/stray/id_link
            state: link
          changed_when: false
          when: '"link" in converge_case.plant | default([])'

        - name: Plant a token line the holder list does not name
          ansible.builtin.copy:
            content: "UNLISTED_TEST_TOKEN={{ converge_canary }}\n"
            dest: /etc/unlisted-holder-token.env
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"token" in converge_case.plant | default([])'

        - name: Plant a file in the secrets directory the holder list does not name
          ansible.builtin.copy:
            content: "{{ converge_canary }}\n"
            dest: /etc/branchleft/secrets/unlisted-file
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"secret_dir" in converge_case.plant | default([])'

        - name: Make the directory the stray key under /srv goes in
          ansible.builtin.file:
            path: /srv/stray
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"srv" in converge_case.plant | default([])'

        - name: Plant a private key under /srv, which the scan must now read
          ansible.builtin.copy:
            content: '{{ converge_pem }}'
            dest: /srv/stray/unlisted-key.txt
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"srv" in converge_case.plant | default([])'

        - name: Make the .ansible directory of a user other than root
          ansible.builtin.file:
            path: /home/stray/.ansible
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"home_ansible" in converge_case.plant | default([])'

        - name: Plant a private key under a user's .ansible, which only root's .ansible is excluded from
          ansible.builtin.copy:
            content: '{{ converge_pem }}'
            dest: /home/stray/.ansible/unlisted-key.txt
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"home_ansible" in converge_case.plant | default([])'

        - name: Make the directory the content-shape files go in
          ansible.builtin.file:
            path: /etc/branchleft/forms
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"forms" in converge_case.plant | default([])'

        - name: Plant one file per content shape the holder list does not name
          ansible.builtin.copy:
            content: '{{ item.content }}'
            dest: '{{ item.path }}'
            owner: root
            group: root
            mode: '0600'
          loop: '{{ converge_forms }}'
          loop_control:
            label: '{{ item.path }}'
          changed_when: false
          no_log: true
          diff: false
          when: '"forms" in converge_case.plant | default([])'

        - name: Make the directory the CI key goes in, as the enrol runbook puts it (the ansible-ci account)
          ansible.builtin.file:
            path: /home/ansible-ci/.ssh
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"ci" in converge_case.plant | default([])'

        - name: Plant the CI key line in the ansible-ci account's authorized_keys, which the holder list names
          ansible.builtin.copy:
            content: "command=\"/usr/local/sbin/pull-trigger --mode check\" ssh-ed25519 STAND-IN-PUBLIC-KEY-NOT-A-CREDENTIAL\n"
            dest: /home/ansible-ci/.ssh/authorized_keys
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"ci" in converge_case.plant | default([])'

        - name: Make the directory the broker tunnel key goes in, as the tunnel change does
          ansible.builtin.file:
            path: '{{ converge_tunnel_dir }}'
            state: directory
            owner: root
            group: root
            mode: '0755'
          changed_when: false
          when: '"tunnel" in converge_case.plant | default([])'

        # The key the broker tunnel change places. Its row is on the holder list, so this host is
        # accepted; with no row it would be refused. This case proves the row accepts the file.
        - name: Plant the broker tunnel key the holder list names
          ansible.builtin.copy:
            content: "restrict,port-forwarding,permitopen=\"127.0.0.1:8090\" ssh-ed25519 STAND-IN-PUBLIC-KEY-NOT-A-CREDENTIAL\n"
            dest: '{{ converge_tunnel_path }}'
            owner: root
            group: root
            mode: '0644'
          changed_when: false
          no_log: true
          diff: false
          when: '"tunnel" in converge_case.plant | default([])'

        - name: Run the role's host scan on its own
          ansible.builtin.include_role:
            name: branchleft.demo1_build
            tasks_from: _secret_holders.yml

        - name: Fail if a host the case must refuse was accepted
          ansible.builtin.fail:
            msg: The role accepted a host holding a secret-bearing file the holder list does not name.
          when: converge_case.expect is defined

      rescue:
        - name: Fail a control case that the host scan refused
          ansible.builtin.fail:
            msg: 'The control case was refused: {{ ansible_failed_result.msg | default("") }}'
          when: converge_case.expect is not defined

        - name: Assert the refusal was the one this case is for, named every planted path and printed no value
          ansible.builtin.assert:
            that:
              - converge_case.expect in (ansible_failed_result.msg | default(''))
              - converge_expected | reject('in', ansible_failed_result.msg | default('')) | list | length == 0
              - 'converge_canary not in (ansible_failed_result | string)'
            quiet: true
            fail_msg: 'The role failed for a reason other than the one this case is for: {{ ansible_failed_result.msg | default("") }}'

      always:
        - name: Remove the planted files and the directories this case made
          ansible.builtin.file:
            path: '{{ item }}'
            state: absent
          loop:
            - /root/stray
            - /home/ansible-ci
            - /srv/stray
            - /home/stray
            - /etc/branchleft/forms
            - /etc/unlisted-holder-token.env
            - /etc/branchleft/secrets/unlisted-file
            - '{{ converge_link_target }}'
            - '{{ converge_tunnel_path }}'
            - '{{ converge_tunnel_dir }}'
          changed_when: false
          when: not ansible_check_mode
