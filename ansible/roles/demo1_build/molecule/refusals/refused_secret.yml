---
# One case of the secret-holder check, imported by converge.yml. The role's host scan
# (_holder_scan.yml) finds every secret-bearing file under the scanned roots and in the
# holder directories, and refuses a file the holder list does not name. The step must refuse
# before anything else is done, name every planted path and never a value, and leave the planted
# files where they were put.
#
# converge_case.plant is a list of cases, each planting one thing:
#   key          a private key under /root (found by its header)
#   token        a KEY=value secret line in /etc (found by its name)
#   secret_dir   any file in the secrets directory (found by where it sits)
#   link         a link named like a key, pointing outside the roots at a key (found by its name)
#   srv          a private key under /srv (found by the widened roots)
#   home_ansible a private key under /home/<user>/.ansible (only /root/.ansible is excluded)
#   forms        six content shapes, each in its own file (spaced key, YAML, JSON, PGP block,
#                export line, GitHub token)
#   ci           the CI key line in /home/ansible-ci/.ssh/authorized_keys (listed: accepted)
#   tunnel       the broker tunnel key line (listed: accepted)
#   docker       a client key under /etc/docker/certs.d (found: /etc/docker is not pruned by name)
#   binkey       a binary key file named *-key.bin that no row names (found by name)
#   verify       the broker request-signing verify key, /etc/branchleft/broker-verify-key.bin (listed: accepted)
#   bulk         forty files with a KEY=value secret line under /etc/branchleft/bulk, more than the
#                refusal names: it must stay short, count them and name the directory (the plan
#                scan caps one host's output, and a host once held thousands of unlisted files)
#   keys         root's authorized_keys and the ansible-ci account's authorized_keys (both listed: accepted)
#   installed    one file a content test finds under each of the three installed-code roots the scan leaves
#                out (the Ansible toolchain, the pull program's work tree, the broker's Node runtime), and
#                the mail spool's Compose file the holder list names (listed: accepted)
#   stray        a real secret-looking file beside each of those roots (a sibling by a longer name, the rest
#                of /opt/branchleft, another file in the mail spool directory): each is still refused
# converge_case.absent lists plant kinds whose paths the refusal must NOT name (the installed files, when a
# case plants them with the stray ones, so the exclusion is proved in the same refusal that names the strays).
# converge_case.expect is the text the refusal must carry. A case with no plant is the control,
# converge_case.accepted: true: the host as prepared holds nothing the list does not name.
#
# The canary value is written only into the planted files, under no_log and diff: false, so the
# refusal can be checked not to print it. Everything the case planted is removed in every
# outcome. The case is skipped by Molecule's idempotence step (the tag below), because it plants
# and removes files each time it runs. A plan makes no change, so a check run skips it.
- name: Refuse or accept a secret-bearing file the holder list does not name
  hosts: all
  gather_facts: false
  tags: [molecule-idempotence-notest]
  vars:
    converge_canary: 'STAND-IN-UNLISTED-SECRET-NOT-A-CREDENTIAL'
    converge_pem: "-----BEGIN OPENSSH PRIVATE KEY-----\n{{ converge_canary }}\n-----END OPENSSH PRIVATE KEY-----\n"
    converge_plant_paths:
      key: [/root/stray/unlisted-key.txt]
      token: [/etc/unlisted-holder-token.env]
      secret_dir: [/etc/branchleft/secrets/unlisted-file]
      link: [/root/stray/id_link]
      srv: [/srv/stray/unlisted-key.txt]
      home_ansible: [/home/stray/.ansible/unlisted-key.txt]
      docker: [/etc/docker/certs.d/unlisted/client.key]
      binkey: [/etc/branchleft/stray-verify-key.bin]
      verify: [/etc/branchleft/broker-verify-key.bin]
      tls: [/etc/branchleft/node-exporter-tls/server.key]
      tls_other: [/etc/branchleft/node-exporter-tls/other.key]
      keys: [/root/.ssh/authorized_keys, /home/ansible-ci/.ssh/authorized_keys]
      bulk: []
      installed: '{{ converge_installed | map(attribute="path") | list }}'
      stray: '{{ converge_stray }}'
      forms:
        - /etc/branchleft/forms/spaced.conf
        - /etc/branchleft/forms/config.yml
        - /etc/branchleft/forms/config.json
        - /etc/branchleft/forms/key.asc
        - /etc/branchleft/forms/profile.sh
        - /etc/branchleft/forms/gh.txt
    converge_forms:
      - path: /etc/branchleft/forms/spaced.conf
        content: "  demo_api_token = {{ converge_canary }}\n"
      - path: /etc/branchleft/forms/config.yml
        content: "service:\n  token: {{ converge_canary }}\n"
      - path: /etc/branchleft/forms/config.json
        content: '{"token": "{{ converge_canary }}"}'
      - path: /etc/branchleft/forms/key.asc
        content: "-----BEGIN PGP PRIVATE KEY BLOCK-----\n{{ converge_canary }}\n-----END PGP PRIVATE KEY BLOCK-----\n"
      - path: /etc/branchleft/forms/profile.sh
        content: "export DEMO_TOKEN={{ converge_canary }}\n"
      - path: /etc/branchleft/forms/gh.txt
        content: "github_pat_TESTONLY0000000000000000000000\n"
    converge_installed:
      - path: /opt/ansible-runtime/requirements-0123456789abcdef.txt
        content: "pytokens==0.4.1\n"
      - path: /opt/ansible-runtime/venv-0123456789abcdef/lib/python3.13/site-packages/ansible/plugins/filter/password_hash.yml
        content: "DOCUMENTATION:\n  password: {{ converge_canary }}\n"
      - path: /var/lib/pull-trigger/work/0123456789abcdef.stand_in/ansible/roles/stand_in/vars/main.yml
        content: "stand_in_token: {{ converge_canary }}\n"
      - path: /opt/branchleft/broker/node/lib/node_modules/npm/docs/content/using-npm/config.md
        content: "NPM_TEST_TOKEN={{ converge_canary }}\n"
      - path: /opt/branchleft/mail-spool/compose.yml
        content: "services:\n  mail-spool:\n    environment:\n      SHIM_DRAIN_TOKEN: '${SHIM_DRAIN_TOKEN:?set it in the env file}'\n"
    converge_stray:
      - /opt/ansible-runtime-other/stray.env
      - /opt/ansible-runtime.bak/venv/stray.env
      - /var/lib/pull-trigger2/stray.env
      - /opt/branchleft/demo-host/stray.env
      - /opt/branchleft/broker/stray.env
      - /opt/branchleft/broker/nodex/stray.env
      - /opt/branchleft/broker/releases/0.0.1/stray.env
      - /opt/branchleft/mail-spool/other.yml
      - /opt/branchleft/mail-spool/compose.yaml
    converge_expected: >-
      {{ converge_case.plant | default([]) | difference(converge_case.absent | default([]))
         | map('extract', converge_plant_paths) | flatten }}
    converge_absent_paths: "{{ converge_case.absent | default([]) | map('extract', converge_plant_paths) | flatten }}"
    converge_tunnel_dir: /etc/ssh/branchleft-broker-tunnel
    converge_tunnel_path: /etc/ssh/branchleft-broker-tunnel/authorized_keys
    converge_link_target: /var/tmp/outside-link-target.txt
  tasks:
    - name: Plant the files the case says and run the role's host scan on its own
      when: not ansible_check_mode
      block:
        - name: Make the directory the stray key and link go in
          ansible.builtin.file:
            path: /root/stray
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"key" in converge_case.plant | default([]) or "link" in converge_case.plant | default([])'

        - name: Plant a private key the holder list does not name
          ansible.builtin.copy:
            content: '{{ converge_pem }}'
            dest: /root/stray/unlisted-key.txt
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"key" in converge_case.plant | default([])'

        - name: Plant the key a link will point at, outside the scanned roots
          ansible.builtin.copy:
            content: '{{ converge_pem }}'
            dest: '{{ converge_link_target }}'
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"link" in converge_case.plant | default([])'

        - name: Plant a link named like a key, pointing at that key
          ansible.builtin.file:
            src: '{{ converge_link_target }}'
            dest: /root/stray/id_link
            state: link
          changed_when: false
          when: '"link" in converge_case.plant | default([])'

        - name: Plant a token line the holder list does not name
          ansible.builtin.copy:
            content: "UNLISTED_TEST_TOKEN={{ converge_canary }}\n"
            dest: /etc/unlisted-holder-token.env
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"token" in converge_case.plant | default([])'

        - name: Plant a file in the secrets directory the holder list does not name
          ansible.builtin.copy:
            content: "{{ converge_canary }}\n"
            dest: /etc/branchleft/secrets/unlisted-file
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"secret_dir" in converge_case.plant | default([])'

        - name: Make the directory the bulk files go in
          ansible.builtin.file:
            path: /etc/branchleft/bulk
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"bulk" in converge_case.plant | default([])'

        - name: Plant forty files the holder list does not name, each with a token line
          ansible.builtin.copy:
            content: "BULK_TEST_TOKEN={{ converge_canary }}\n"
            dest: '/etc/branchleft/bulk/file-{{ item }}.env'
            owner: root
            group: root
            mode: '0600'
          loop: '{{ range(0, 40) | list }}'
          loop_control:
            label: '{{ item }}'
          changed_when: false
          no_log: true
          diff: false
          when: '"bulk" in converge_case.plant | default([])'

        - name: Make the directory the stray key under /srv goes in
          ansible.builtin.file:
            path: /srv/stray
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"srv" in converge_case.plant | default([])'

        - name: Plant a private key under /srv, which the scan must now read
          ansible.builtin.copy:
            content: '{{ converge_pem }}'
            dest: /srv/stray/unlisted-key.txt
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"srv" in converge_case.plant | default([])'

        - name: Make the .ansible directory of a user other than root
          ansible.builtin.file:
            path: /home/stray/.ansible
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"home_ansible" in converge_case.plant | default([])'

        - name: Plant a private key under a user's .ansible, which only root's .ansible is excluded from
          ansible.builtin.copy:
            content: '{{ converge_pem }}'
            dest: /home/stray/.ansible/unlisted-key.txt
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"home_ansible" in converge_case.plant | default([])'

        - name: Make the directory the content-shape files go in
          ansible.builtin.file:
            path: /etc/branchleft/forms
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"forms" in converge_case.plant | default([])'

        - name: Plant one file per content shape the holder list does not name
          ansible.builtin.copy:
            content: '{{ item.content }}'
            dest: '{{ item.path }}'
            owner: root
            group: root
            mode: '0600'
          loop: '{{ converge_forms }}'
          loop_control:
            label: '{{ item.path }}'
          changed_when: false
          no_log: true
          diff: false
          when: '"forms" in converge_case.plant | default([])'

        - name: Make the directory the CI key goes in, as the enrol runbook puts it (the ansible-ci account)
          ansible.builtin.file:
            path: /home/ansible-ci/.ssh
            state: directory
            owner: root
            group: root
            mode: '0700'
          changed_when: false
          when: '"ci" in converge_case.plant | default([])'

        - name: Plant the CI key line in the ansible-ci account's authorized_keys, which the holder list names
          ansible.builtin.copy:
            content: "command=\"/usr/local/sbin/pull-trigger --mode check\" ssh-ed25519 STAND-IN-PUBLIC-KEY-NOT-A-CREDENTIAL\n"
            dest: /home/ansible-ci/.ssh/authorized_keys
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"ci" in converge_case.plant | default([])'

        - name: Make the directory the broker tunnel key goes in, as the tunnel change does
          ansible.builtin.file:
            path: '{{ converge_tunnel_dir }}'
            state: directory
            owner: root
            group: root
            mode: '0755'
          changed_when: false
          when: '"tunnel" in converge_case.plant | default([])'

        - name: Make the directory a client key under /etc/docker/certs.d goes in
          ansible.builtin.file:
            path: /etc/docker/certs.d/unlisted
            state: directory
            owner: root
            group: root
            mode: '0755'
          changed_when: false
          when: '"docker" in converge_case.plant | default([])'

        - name: Plant a client key under /etc/docker, which the scan must now read
          ansible.builtin.copy:
            content: "{{ converge_canary }}\n"
            dest: /etc/docker/certs.d/unlisted/client.key
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"docker" in converge_case.plant | default([])'

        - name: Plant a binary key file the holder list does not name (found by its name)
          ansible.builtin.copy:
            content: "{{ converge_canary }}\n"
            dest: /etc/branchleft/stray-verify-key.bin
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"binkey" in converge_case.plant | default([])'

        # Both key files the holder list names, in root's and in the ansible-ci account's authorized keys.
        - name: Make the directories the two authorised-keys files go in
          ansible.builtin.file:
            path: '{{ item }}'
            state: directory
            owner: root
            group: root
            mode: '0700'
          loop: [/root/.ssh, /home/ansible-ci/.ssh]
          changed_when: false
          when: '"keys" in converge_case.plant | default([])'

        - name: Plant root's authorised key line, which the holder list names
          ansible.builtin.copy:
            content: "ssh-ed25519 STAND-IN-PUBLIC-KEY-NOT-A-CREDENTIAL root@stand-in\n"
            dest: /root/.ssh/authorized_keys
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"keys" in converge_case.plant | default([])'

        - name: Plant the ansible-ci account's authorised key line, which the holder list names
          ansible.builtin.copy:
            content: "ssh-ed25519 STAND-IN-PUBLIC-KEY-NOT-A-CREDENTIAL ci@stand-in\n"
            dest: /home/ansible-ci/.ssh/authorized_keys
            owner: root
            group: root
            mode: '0600'
          changed_when: false
          no_log: true
          diff: false
          when: '"keys" in converge_case.plant | default([])'

        # The broker verify key, at the path the holder row names. The file is a dummy here.
        - name: Plant the broker verify key the holder list names
          ansible.builtin.copy:
            content: "{{ converge_canary }}\n"
            dest: /etc/branchleft/broker-verify-key.bin
            owner: root
            group: root
            mode: '0640'
          changed_when: false
          no_log: true
          diff: false
          when: '"verify" in converge_case.plant | default([])'

        # The node exporter's TLS key, at the path its row names (accepted), and a different .key in the
        # same directory the row does not name (refused): the row must match the one file, not the directory.
        - name: Make the directory the node exporter's TLS files go in
          ansible.builtin.file:
            path: /etc/branchleft/node-exporter-tls
            state: directory
            owner: root
            group: root
            mode: '0750'
          changed_when: false
          when: '"tls" in converge_case.plant | default([]) or "tls_other" in converge_case.plant | default([])'

        - name: Plant the node exporter's TLS server key the holder list names
          ansible.builtin.copy:
            content: '{{ converge_pem }}'
            dest: /etc/branchleft/node-exporter-tls/server.key
            owner: root
            group: root
            mode: '0640'
          changed_when: false
          no_log: true
          diff: false
          when: '"tls" in converge_case.plant | default([])'

        - name: Plant a different .key in the node exporter's directory, which no row names
          ansible.builtin.copy:
            content: '{{ converge_pem }}'
            dest: /etc/branchleft/node-exporter-tls/other.key
            owner: root
            group: root
            mode: '0640'
          changed_when: false
          no_log: true
          diff: false
          when: '"tls_other" in converge_case.plant | default([])'

        # The key the broker tunnel change places. Its row is on the holder list, so this host is
        # accepted; with no row it would be refused. This case proves the row accepts the file.
        - name: Plant the broker tunnel key the holder list names
          ansible.builtin.copy:
            content: "restrict,port-forwarding,permitopen=\"127.0.0.1:8090\" ssh-ed25519 STAND-IN-PUBLIC-KEY-NOT-A-CREDENTIAL\n"
            dest: '{{ converge_tunnel_path }}'
            owner: root
            group: root
            mode: '0644'
          changed_when: false
          no_log: true
          diff: false
          when: '"tunnel" in converge_case.plant | default([])'

        # The installed-code roots and the files beside them. A file is planted whole in one task, its
        # directory made first, and both loops are hidden: the canary is in every file.
        - name: Make the directories the installed-code files go in
          ansible.builtin.file:
            path: '{{ item | dirname }}'
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop: '{{ converge_installed | map(attribute="path") | list }}'
          changed_when: false
          when: '"installed" in converge_case.plant | default([])'

        - name: Plant a file under each installed-code root, and the mail spool's Compose file the list names
          ansible.builtin.copy:
            content: '{{ item.content }}'
            dest: '{{ item.path }}'
            owner: root
            group: root
            mode: '0644'
          loop: '{{ converge_installed }}'
          loop_control:
            label: '{{ item.path | basename }}'
          changed_when: false
          no_log: true
          diff: false
          when: '"installed" in converge_case.plant | default([])'

        - name: Make the directories the stray files beside the roots go in
          ansible.builtin.file:
            path: '{{ item | dirname }}'
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop: '{{ converge_stray }}'
          changed_when: false
          when: '"stray" in converge_case.plant | default([])'

        - name: Plant a secret-looking file beside each installed-code root, which no row names
          ansible.builtin.copy:
            content: "STRAY_TEST_TOKEN={{ converge_canary }}\n"
            dest: '{{ item }}'
            owner: root
            group: root
            mode: '0600'
          loop: '{{ converge_stray }}'
          loop_control:
            label: '{{ item | basename }}'
          changed_when: false
          no_log: true
          diff: false
          when: '"stray" in converge_case.plant | default([])'

        - name: Run the role's host scan on its own
          ansible.builtin.include_role:
            name: branchleft.demo1_build
            tasks_from: _holder_scan.yml

        - name: Fail if a host the case must refuse was accepted
          ansible.builtin.fail:
            msg: The role accepted a host holding a secret-bearing file the holder list does not name.
          when: converge_case.expect is defined

      rescue:
        - name: Fail a control case that the host scan refused
          ansible.builtin.fail:
            msg: 'The control case was refused: {{ ansible_failed_result.msg | default("") }}'
          when: converge_case.expect is not defined

        - name: Assert the refusal was the one this case is for, named every planted path and printed no value
          ansible.builtin.assert:
            that:
              - converge_case.expect in (ansible_failed_result.msg | default(''))
              - converge_expected | reject('in', ansible_failed_result.msg | default('')) | list | length == 0
              - converge_absent_paths | select('in', ansible_failed_result.msg | default('')) | list | length == 0
              - 'converge_canary not in (ansible_failed_result | string)'
            quiet: true
            fail_msg: 'The role failed for a reason other than the one this case is for: {{ ansible_failed_result.msg | default("") }}'

        - name: Assert a refusal over many files counts them, names the directory and stays short
          ansible.builtin.assert:
            that:
              - "'40 unlisted path(s)' in ansible_failed_result.msg"
              - "'/etc/branchleft/bulk x40' in ansible_failed_result.msg"
              - "'The first 20 in order' in ansible_failed_result.msg"
              - "'file-39.env' not in ansible_failed_result.msg"
              - ansible_failed_result.msg | length < 3000
            quiet: true
            fail_msg: 'The refusal over many files was not bounded: {{ ansible_failed_result.msg | default("") | length }} bytes'
          when: '"bulk" in converge_case.plant | default([])'

      always:
        - name: Remove the planted files and the directories this case made
          ansible.builtin.file:
            path: '{{ item }}'
            state: absent
          loop:
            - /root/stray
            - /home/ansible-ci
            - /srv/stray
            - /home/stray
            - /etc/branchleft/forms
            - /etc/branchleft/bulk
            - /etc/unlisted-holder-token.env
            - /etc/docker/certs.d
            - /root/.ssh/authorized_keys
            - /etc/branchleft/stray-verify-key.bin
            - /etc/branchleft/broker-verify-key.bin
            - /etc/branchleft/node-exporter-tls
            - /etc/branchleft/secrets/unlisted-file
            - /opt/ansible-runtime
            - /opt/ansible-runtime-other
            - /opt/ansible-runtime.bak
            - /var/lib/pull-trigger
            - /var/lib/pull-trigger2
            - /opt/branchleft/broker
            - /opt/branchleft/mail-spool
            - /opt/branchleft/demo-host/stray.env
            - '{{ converge_link_target }}'
            - '{{ converge_tunnel_path }}'
            - '{{ converge_tunnel_dir }}'
          changed_when: false
          when: not ansible_check_mode
