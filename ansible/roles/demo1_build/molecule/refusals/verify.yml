---
# What the refusal cases must leave behind: nothing. The grant is the one
# broker_deploy's template rendered, owner, mode and content, and the role
# installed nothing, because this scenario stages the release and runs the grant
# check and no more. The expected values are written out here, not read from the
# role, so a role that left a different grant is a failure and not a test that
# agrees with it.
- name: Verify the instance
  hosts: all
  gather_facts: false
  tasks:
    - name: Look at the grant after the cases
      ansible.builtin.stat:
        path: /etc/sudoers.d/branchleft-slot
        follow: false
      register: demo1_build_verify_grant

    - name: Read the grant after the cases
      ansible.builtin.slurp:
        src: /etc/sudoers.d/branchleft-slot
      register: demo1_build_verify_grant_text

    - name: Check the grant with visudo, strictly
      ansible.builtin.command:
        argv:
          - /usr/sbin/visudo
          - -csf
          - /etc/sudoers.d/branchleft-slot
      changed_when: false

    - name: Assert the grant is broker_deploy's, root:root mode 0440, with its fifty rules in place
      ansible.builtin.assert:
        that:
          - demo1_build_verify_grant.stat.isreg
          - demo1_build_verify_grant.stat.pw_name == 'root'
          - demo1_build_verify_grant.stat.gr_name == 'root'
          - demo1_build_verify_grant.stat.mode == '0440'
          - (demo1_build_verify_grant_text.content | b64decode).splitlines()[0].startswith('# Installed by the broker_deploy role')
          - (demo1_build_verify_grant_text.content | b64decode).splitlines() | select('match', '^broker ') | list | length == 50
          - (demo1_build_verify_grant_text.content | b64decode).splitlines() | reject('match', '^(broker |#( .*)?$|$)') | list | length == 0
        quiet: true
        fail_msg: A refusal case left the sudoers grant changed.

    - name: Look at the paths the role must not have written
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop:
        - /usr/local/sbin/branchleft-slot
        - /usr/local/sbin/branchleft-slot-refused-probe
        - /usr/local/lib/branchleft
        - /var/lib/branchleft/demo-router
        - /var/lib/branchleft-broker
        - /var/lib/branchleft/demo-drain-flags-staging
        - /run/demo-drain-flags-staging
        - /run/demo-broker-state
        - /var/tmp/demo1-link-target
        - /var/tmp/demo1-site-input-target
        - /var/tmp/demo1-token-target
        - /var/lib/branchleft/demo-candidates/Caddyfile
        - /etc/systemd/system/branchleft-compose@demo-0-a.service.d
        - /etc/branchleft/demo1-drain-flags-preseeded
        - /etc/branchleft/tenant-uids
      register: demo1_build_verify_absent

    - name: Assert none of them exists
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        quiet: true
        fail_msg: A refusal case, or the release step, wrote {{ item.item }}.
      loop: '{{ demo1_build_verify_absent.results }}'
      loop_control:
        label: '{{ item.item }}'

    - name: Look at the staged release
      ansible.builtin.stat:
        path: /opt/branchleft/demo-host/releases/595bcce0ee2bb1c7f8de565cf008060ea43122cf/demo-host/provision/render_slot_sudoers.py
        follow: false
        checksum_algorithm: sha256
      register: demo1_build_verify_generator

    - name: Assert the generator is the pinned file
      ansible.builtin.assert:
        that:
          - demo1_build_verify_generator.stat.isreg
          - demo1_build_verify_generator.stat.checksum == '80bd64fccb1f56260a7dc1824e783548a80a14a691942060cfff1aba9a058319'
        quiet: true
        fail_msg: The staged generator is not the pinned render_slot_sudoers.py.

    # The cases ran with GitHub and its registry unreachable (molecule.yml).
    - name: Assert that GitHub and its registry were unreachable
      ansible.builtin.include_tasks: '{{ playbook_dir }}/../default/tasks/blocked_outbound.yml'

    # The stand-in template is put back by the colour case, in every outcome.
    - name: Look at the stand-in template after the cases
      ansible.builtin.stat:
        path: /etc/systemd/system/branchleft-compose@.service
        follow: false
        get_checksum: false
      register: demo1_build_verify_stand_in

    - name: Assert the stand-in template is back, root's and mode 0644
      ansible.builtin.assert:
        that:
          - demo1_build_verify_stand_in.stat.isreg
          - demo1_build_verify_stand_in.stat.pw_name == 'root'
          - demo1_build_verify_stand_in.stat.mode == '0644'
        quiet: true
        fail_msg: A case left the stand-in template removed or changed.

    # The token cases put back the token file prepare placed, in every outcome.
    - name: Look at the DNS token file after the cases
      ansible.builtin.stat:
        path: /etc/branchleft/secrets/demo-dns-caddy-demo1-wildcard
        follow: false
        get_checksum: false
        get_mime: false
      register: demo1_build_verify_token

    - name: Assert the DNS token file is back, a regular file of root:root mode 0600 with something in it
      ansible.builtin.assert:
        that:
          - demo1_build_verify_token.stat.isreg
          - demo1_build_verify_token.stat.pw_name == 'root'
          - demo1_build_verify_token.stat.gr_name == 'root'
          - demo1_build_verify_token.stat.mode == '0600'
          - demo1_build_verify_token.stat.size > 0
        quiet: true
        fail_msg: A token case left the DNS token file removed, changed or empty.

    # The log scan (ANS-16). Every case of this run wrote its output to the run's Ansible
    # log, in the scenario's scratch directory (molecule.yml). The site cases print a
    # control line that proves the scan reads the log; the leak case's hostname is the
    # canary, and the renderer's message that carries it is hidden, so the canary must
    # not be in the log. The scan counts only because the control is found.
    - name: Read the Ansible log of this scenario's run
      ansible.builtin.set_fact:
        demo1_build_verify_log: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/ansible.log') }}"
      no_log: true

    - name: Assert the log holds the scan control and no canary
      ansible.builtin.assert:
        that:
          - "'Scan control line' in demo1_build_verify_log"
          - "'Canary-Leak-Probe' not in demo1_build_verify_log"
          - "'STAND-IN-DNS-TOKEN' not in demo1_build_verify_log"
        quiet: true
        fail_msg: >-
          The scenario's log does not hold the scan control, or it holds the canary a refused site input carried
          (ANS-16). Either the scan read nothing, or a task printed the input.
      no_log: true
