---
# The refusal cases of the role. Each is one edit of the grant that broker_deploy
# installed, or one bad input, and the role must refuse it with its own message.
# The role is not applied here: the first play stages the pinned programs, and each
# other play runs one task file alone (_sudoers_check.yml, or _dirs.yml via refused_link.yml).
#
# The grant on the host is rendered by broker_deploy's template (prepare.yml), and the
# generator is the real pinned one, so the two headers differ, as on a real host.
- name: Stage the pinned programs and read the grant as prepared
  hosts: all
  gather_facts: false
  vars:
    converge_grant: /etc/sudoers.d/branchleft-slot
  tasks:
    - name: Stage the release, which holds the generator, with the role's own release tasks
      ansible.builtin.include_role:
        name: branchleft.demo1_build
        tasks_from: _release.yml
      when: not ansible_check_mode

    - name: Read the grant as prepared
      ansible.builtin.slurp:
        src: '{{ converge_grant }}'
      register: demo1_build_converge_pristine
      when: not ansible_check_mode

    - name: Keep the grant as prepared, to put back after each case
      ansible.builtin.set_fact:
        demo1_build_converge_pristine_text: '{{ demo1_build_converge_pristine.content | b64decode }}'
      when: not ansible_check_mode

# The control case: the grant as broker_deploy renders it, with its own header,
# is accepted. Without it, a role that refused every grant would pass every case.
- name: Accept the grant as prepared
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: the grant as prepared
      accepted: true

# A comment is "#" alone or "#" and a space. "#1000" is a uid rule and
# "#includedir" an include, whatever follows. Each is placed after the last rule
# and before the first, because the header ends at the first line that is not a
# comment and a refusal that only looks at the end would miss the other.
- name: Refuse a uid rule after the last rule
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: a uid rule after the last rule
      append: '#1000 ALL=(ALL) NOPASSWD: ALL'
      expect: 'is not what render_slot_sudoers.py renders'

- name: Refuse a uid rule before the first rule
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: a uid rule before the first rule
      insert_before: '#1001 ALL=(ALL) NOPASSWD: ALL'
      expect: 'is not what render_slot_sudoers.py renders'

- name: Refuse an include after the last rule
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: an include after the last rule
      append: '#includedir /tmp/x'
      expect: 'is not what render_slot_sudoers.py renders'

- name: Refuse an include before the first rule
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: an include before the first rule
      insert_before: '#includedir /tmp/y'
      expect: 'is not what render_slot_sudoers.py renders'

# Nothing after the first rule is exempt, a comment included.
- name: Refuse a comment after the last rule
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: a comment after the last rule
      append: '# a comment after the last rule'
      expect: 'is not what render_slot_sudoers.py renders'

# A comment that ends in a backslash is not header: sudoers joins it to the next
# line, so it can swallow the rule that follows. It counts as body, and the body
# then differs from the generator's. A split that took it for header would drop it
# and accept this grant.
- name: Refuse a header comment ending in a backslash
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: a comment ending in a backslash before the first rule
      insert_before: '# a comment that continues on the next line \'
      expect: 'is not what render_slot_sudoers.py renders'

# A rule that keeps its prefix and adds a second command.
- name: Refuse a rule with a command list ending in ALL
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: the first rule with ", ALL" added
      first_suffix: ', ALL'
      expect: 'is not what render_slot_sudoers.py renders'

- name: Refuse a rule with a command list ending in a shell
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: the last rule with ", /bin/sh" added
      last_suffix: ', /bin/sh'
      expect: 'is not what render_slot_sudoers.py renders'

- name: Refuse a wildcard rule
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: the first rule replaced by a wildcard rule
      first_replace: 'broker ALL=(root) NOPASSWD: /usr/local/sbin/branchleft-slot *'
      expect: 'is not what render_slot_sudoers.py renders'

# A rule the generator renders and the host lacks. Nothing in the host's file is
# unexpected, so a comparison that only looks for extra lines would pass this.
- name: Refuse a grant with a rule missing
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: the first rule removed
      drop_first: true
      expect: 'is not what render_slot_sudoers.py renders'

# The same rules in another order: the comparison is of ordered lists, and sorting
# both sides would pass this.
- name: Refuse the same rules in another order
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: the first two rules swapped
      swap: true
      expect: 'is not what render_slot_sudoers.py renders'

# The wrapper path. The grant is valid and whole; only the path the role is asked
# to install at differs from the one every rule names. The second case is a system
# binary that exists. This scenario runs the check alone, so it proves the check
# refuses; that nothing is written first is proved in the default scenario.
- name: Refuse a wrapper path the grant does not name, an existing system binary
  ansible.builtin.import_playbook: ../default/refused_wrapper_path.yml
  vars:
    converge_case:
      path: /usr/bin/passwd
      tasks_from: _sudoers_check.yml
      expect: 'does not run /usr/bin/passwd in every rule'

# The wrapper tie on its own, as a plan on a host with no staged release meets it:
# the comparison with the generator is skipped, and the tie is then the one check
# of what a rule says. It is matched to the end of the rule, so a second command
# after a comma is refused, and the grant as prepared passes it and says it was
# NOT verified.
- name: Accept the grant as prepared when no release is staged
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: the grant as prepared, with no staged release
      accepted: true
      unstaged: true

- name: Refuse a rule with a second command when no release is staged
  ansible.builtin.import_playbook: refused_grant.yml
  vars:
    converge_case:
      name: the last rule with ", /bin/sh" added, with no staged release
      last_suffix: ', /bin/sh'
      unstaged: true
      expect: 'does not run /usr/local/sbin/branchleft-slot in every rule'

# Each directory the role declares as a directory is refused when it is a link,
# before anything is created, and the link's target is left as it was.
- name: Accept the directories as real directories
  ansible.builtin.import_playbook: refused_link.yml
  vars:
    converge_case:
      name: the socket tree and the flag directory as real directories
      accepted: true

- name: Refuse the socket root as a link
  ansible.builtin.import_playbook: refused_link.yml
  vars:
    converge_case:
      name: the root of the socket tree
      link_at: /var/lib/branchleft/demo-router
      parents: []

- name: Refuse a slot's socket directory as a link
  ansible.builtin.import_playbook: refused_link.yml
  vars:
    converge_case:
      name: the socket directory of a slot
      link_at: /var/lib/branchleft/demo-router/0
      parents: [/var/lib/branchleft/demo-router]

- name: Refuse a colour's socket directory as a link
  ansible.builtin.import_playbook: refused_link.yml
  vars:
    converge_case:
      name: the socket directory of a colour
      link_at: /var/lib/branchleft/demo-router/0/a
      parents: [/var/lib/branchleft/demo-router, /var/lib/branchleft/demo-router/0]

- name: Refuse the broker's state directory as a link
  ansible.builtin.import_playbook: refused_link.yml
  vars:
    converge_case:
      name: the broker's state directory
      link_at: /var/lib/branchleft-broker
      parents: []

- name: Refuse the drain-flag directory as a link
  ansible.builtin.import_playbook: refused_link.yml
  vars:
    converge_case:
      name: the drain-flag directory
      link_at: /var/lib/branchleft-broker/drain-flags
      parents: [/var/lib/branchleft-broker]

# The same refusal for a regular file, the other thing that is not a directory. The
# file module would refuse it too, with a message of its own, so only the role's
# message passes this case.
- name: Refuse the drain-flag directory as a regular file
  ansible.builtin.import_playbook: refused_link.yml
  vars:
    converge_case:
      name: the drain-flag directory as a regular file
      file_at: /var/lib/branchleft-broker/drain-flags
      parents: [/var/lib/branchleft-broker]

# The staged move is one rename and a rename cannot cross filesystems; GNU mv copies
# instead of failing, and the copy writes each flag through a name the broker owns. So
# the step refuses a staging directory and a flag directory on different filesystems,
# before it creates anything. /run is a tmpfs in the test container, a filesystem none
# of the role's own paths is on. The real paths, on one filesystem, are the control: the
# accepted case of refused_link.yml above.
- name: Refuse a staging directory on another filesystem
  ansible.builtin.import_playbook: refused_device.yml
  vars:
    converge_case:
      name: the staging directory on a tmpfs
      staging_dir: /run/demo-drain-flags-staging

# The broker's state directory does not exist on a first build, so the step reads its
# parent in its place; the case puts both on the tmpfs. (A directory that exists and is
# itself a mount point cannot be made without a mount, which the unprivileged test
# container cannot do: the README names it.)
- name: Refuse a broker state directory, not yet made, whose parent is on another filesystem
  ansible.builtin.import_playbook: refused_device.yml
  vars:
    converge_case:
      name: the broker's state directory on a tmpfs, not yet made
      broker_dir: /run/demo-broker-state

# A flag directory that was already there is never seeded. One that exists, is empty
# and has no marker cannot be told from a host where every colour has gone live, so it
# is refused with both remedies named. The two controls are the same directory in a
# state the role can read: with the marker, and with a flag already in it and no
# marker (a host built before the marker existed). Both are accepted and neither is
# seeded; a directory the run makes itself is seeded, and the accepted case above
# counts the fourteen flags.
- name: Refuse an existing flag directory that is empty and has no marker
  ansible.builtin.import_playbook: refused_unmarked.yml
  vars:
    converge_case:
      name: an existing, empty flag directory with no marker
      flags: []
      marker: false
      expect: 'exists, holds no drain flag and there is no marker'

- name: Accept an existing empty flag directory that has the marker, and seed nothing
  ansible.builtin.import_playbook: refused_unmarked.yml
  vars:
    converge_case:
      name: an existing, empty flag directory with the marker
      flags: []
      marker: true
      accepted: true
      expect_flags: 0

- name: Accept an existing flag directory that holds a flag but has no marker, and seed nothing
  ansible.builtin.import_playbook: refused_unmarked.yml
  vars:
    converge_case:
      name: an existing flag directory holding one flag, with no marker
      flags: ['0-a.drain']
      marker: false
      accepted: true
      expect_flags: 1

# The grant is the generator's and whole; the role's slot table has an eighth
# slot that the grant does not hold.
- name: Refuse a slot table that is not the generator's
  hosts: all
  gather_facts: false
  tasks:
    - name: Prove a slot table the generator does not render is refused
      when: not ansible_check_mode
      block:
        - name: Run the role's grant check with an eighth slot
          ansible.builtin.include_role:
            name: branchleft.demo1_build
            tasks_from: _sudoers_check.yml
          vars:
            demo1_build_slot_names: ['0', '1', '2', '3', '4', '5', '6', '7']

        - name: Fail if the slot table was accepted
          ansible.builtin.fail:
            msg: The role accepted a slot table the pinned generator does not render.
      rescue:
        - name: Assert the refusal was the slot table
          ansible.builtin.assert:
            that:
              - "'are not the slots in demo1_build_slot_names' in (ansible_failed_result.msg | default(''))"
            quiet: true
            fail_msg: >-
              The role failed on the eighth slot for a reason other than the slot table:
              {{ ansible_failed_result.msg | default('') }}

# The programs are the role's own copies, held to their pinned sha256 on the machine
# that runs the role before anything is written to the host. The control comes first:
# the copies as they are, against the pins as they are, are accepted. Without it, a
# check that refused every program would pass the cases after it.
- name: Accept the vendored programs against their pins
  hosts: all
  gather_facts: false
  tasks:
    - name: Run the vendored-program check with the role's own pins
      ansible.builtin.include_role:
        name: branchleft.demo1_build
        tasks_from: _vendored.yml
      when: not ansible_check_mode

# One digit of one pin is changed. The refusal must name the program, so a failure of
# any other kind does not pass for this one.
- name: Refuse a program whose pin is wrong
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the role's own pins
      ansible.builtin.include_vars:
        file: '{{ playbook_dir }}/../../defaults/main.yml'
        name: converge_defaults
      when: not ansible_check_mode

    - name: Prove a wrong pin is refused
      when: not ansible_check_mode
      block:
        - name: Run the vendored-program check with one digit of one pin changed
          ansible.builtin.include_role:
            name: branchleft.demo1_build
            tasks_from: _vendored.yml
          vars:
            demo1_build_release_files: >-
              {{ [{'path': 'demo-host/provision/branchleft_slot.py',
              'sha256': '3e2279f0067d91296e1b309f6cbe71a3d276d7ccdbbd58aa4f99f81ce85ba80b'}]
              + (converge_defaults.demo1_build_release_files | rejectattr('path', 'equalto', 'demo-host/provision/branchleft_slot.py') | list) }}

        - name: Fail if the wrong pin was accepted
          ansible.builtin.fail:
            msg: The role accepted a program whose pinned checksum was wrong.
      rescue:
        - name: Assert the failure named the program and its pin
          ansible.builtin.assert:
            that:
              - "'demo-host/provision/branchleft_slot.py in the role' in (ansible_failed_result | string)"
              - "'does not match its pin' in (ansible_failed_result | string)"
            quiet: true
            fail_msg: The role failed on the wrong pin for a reason other than the pin of that program.

# The whole role, with a release directory this host has never had and the same wrong
# pin. The refusal must come before the role writes anything, so the release directory
# its source commit names must not exist afterwards. The role's other steps would have
# made it first.
- name: Refuse a program whose pin is wrong before anything is written
  hosts: all
  gather_facts: false
  vars:
    converge_fresh_sha: 0123456789abcdef0123456789abcdef01234567
  tasks:
    - name: Read the role's own pins
      ansible.builtin.include_vars:
        file: '{{ playbook_dir }}/../../defaults/main.yml'
        name: converge_defaults
      when: not ansible_check_mode

    - name: Prove a wrong pin stops the whole role before it writes
      when: not ansible_check_mode
      block:
        - name: Apply the role with a new source commit and one digit of one pin changed
          ansible.builtin.include_role:
            name: branchleft.demo1_build
          vars:
            demo1_build_source_sha: '{{ converge_fresh_sha }}'
            demo1_build_release_files: >-
              {{ [{'path': 'demo-host/provision/branchleft_slot.py',
              'sha256': '3e2279f0067d91296e1b309f6cbe71a3d276d7ccdbbd58aa4f99f81ce85ba80b'}]
              + (converge_defaults.demo1_build_release_files | rejectattr('path', 'equalto', 'demo-host/provision/branchleft_slot.py') | list) }}

        - name: Fail if the wrong pin was accepted
          ansible.builtin.fail:
            msg: The role accepted a program whose pinned checksum was wrong.
      rescue:
        - name: Assert the failure named the program and its pin
          ansible.builtin.assert:
            that:
              - "'demo-host/provision/branchleft_slot.py in the role' in (ansible_failed_result | string)"
              - "'does not match its pin' in (ansible_failed_result | string)"
            quiet: true
            fail_msg: The role failed on the wrong pin for a reason other than the pin of that program.

        - name: Look for the release directory the new source commit would have made
          ansible.builtin.stat:
            path: '/opt/branchleft/demo-host/releases/{{ converge_fresh_sha }}'
            follow: false
          register: demo1_build_converge_fresh_release

        - name: Assert that nothing was written
          ansible.builtin.assert:
            that:
              - not demo1_build_converge_fresh_release.stat.exists
            quiet: true
            fail_msg: The role wrote a release directory before it refused the wrong pin.

# The owner's edge input for slot 0, read as root by the pinned site renderer. The
# role refuses a link, an input that is not root's, and an input open to group or
# others, before the renderer reads it; each case names the check that fires. The
# control case is a valid input, which the step must stage. The leak case is a
# hostname the renderer refuses; the step must name the slot without the renderer's
# message, and the canary must not reach the log (verify.yml reads it).
- name: Refuse an owner's edge input that is a link
  ansible.builtin.import_playbook: refused_site_input.yml
  vars:
    converge_case:
      plant: link
      expect: 'is a link or not a regular file'

- name: Refuse an owner's edge input that is not root's
  ansible.builtin.import_playbook: refused_site_input.yml
  vars:
    converge_case:
      plant: owner
      owner: broker
      expect: 'is not root:root'

- name: Refuse an owner's edge input open to others
  ansible.builtin.import_playbook: refused_site_input.yml
  vars:
    converge_case:
      plant: mode
      mode: '0644'
      expect: 'must be 0600 or narrower'

- name: Accept a valid owner's edge input and stage its candidate
  ansible.builtin.import_playbook: refused_site_input.yml
  vars:
    converge_case:
      plant: valid
      expect: ''

- name: Refuse a renderer refusal without its message, the hostname a canary
  ansible.builtin.import_playbook: refused_site_input.yml
  vars:
    converge_case:
      plant: leak
      host: Canary-Leak-Probe.invalid
      expect: 'refused the wildcard base or the edge input of the occupied slot(s) 0, 1'

# The DNS token file Caddy reads as root. The role only looks at it, and refuses a file
# that is a link, a directory, not root's, open to others or empty, each with its own
# message naming the path and never a value. The control is the valid token that prepare
# placed: the valid edge input case above stages a candidate only with it in place, and
# each case here puts it back.
- name: Case refused_token_link, refuse a DNS token file that is a link
  ansible.builtin.import_playbook: refused_token.yml
  vars:
    converge_case:
      plant: link
      expect: 'is a link.'

- name: Case refused_token_directory, refuse a DNS token file that is a directory
  ansible.builtin.import_playbook: refused_token.yml
  vars:
    converge_case:
      plant: directory
      expect: 'is not a regular file.'

- name: Case refused_token_not_root, refuse a DNS token file that is not root's
  ansible.builtin.import_playbook: refused_token.yml
  vars:
    converge_case:
      plant: owner
      owner: broker
      expect: 'is not root:root.'

- name: Case refused_token_mode_0644, refuse a DNS token file open to group and others
  ansible.builtin.import_playbook: refused_token.yml
  vars:
    converge_case:
      plant: mode
      mode: '0644'
      expect: 'is mode 0644.'

- name: Case refused_token_empty, refuse a DNS token file that is empty
  ansible.builtin.import_playbook: refused_token.yml
  vars:
    converge_case:
      plant: empty
      expect: 'is empty.'

# The Caddy image that judges the candidate. docker finds it by the digest in its reference,
# and the role wants exactly one image whose RepoDigests hold the pinned digest. An image that
# is on the host and lists anything else is refused, whatever the reason (README, "How the
# Caddy image gets onto the host"): the classic image store lists a loaded image with no
# digests at all. The control lists the pinned digest and stages the candidate.
- name: Accept the Caddy image that lists the pinned digest, and stage the candidate
  ansible.builtin.import_playbook: refused_image.yml
  vars:
    converge_case:
      accepted: true

- name: Case refused_image_no_digests, refuse an image that lists no digests, as a loaded image does on the classic image store
  ansible.builtin.import_playbook: refused_image.yml
  vars:
    converge_case:
      digests: []
      expect: 'that is not the pinned image'

- name: Case refused_image_other_digest, refuse an image that lists another digest
  ansible.builtin.import_playbook: refused_image.yml
  vars:
    converge_case:
      digests:
        ['demo-edge-test@sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210']
      expect: 'that is not the pinned image'

- name: Case refused_image_two_images, refuse a listing of two images
  ansible.builtin.import_playbook: refused_image.yml
  vars:
    converge_case:
      count: 2
      expect: 'It listed 2 image(s).'

- name: Case refused_image_not_json, refuse a listing that is not JSON
  ansible.builtin.import_playbook: refused_image.yml
  vars:
    converge_case:
      raw: 'this is not json'
      expect: 'The listing was not JSON.'

# The candidate the renderer prints is refused when Caddy would run it with an interim
# certificate, or with a site beside the wildcard one, or served over plain HTTP, whatever
# produced it and however it is spelled. The role asks Caddy; the answers replayed here are
# the ones real Caddy printed (refused_candidate.yml). The control is the text unchanged.
- name: Accept a rendered candidate that is one wildcard site with the DNS-01 tls block
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      accepted: true

- name: Case refused_tls_internal, refuse a candidate whose wildcard site asks for the internal certificate authority
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      tls: tls internal
      adapted: site_tls_internal
      expect: 'REFUSED internal-issuer'

- name: Case refused_tls_internal_indented, refuse the same directive when it is indented and spaced out
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      tls: '      tls    internal'
      adapted: site_tls_internal_indented
      expect: 'REFUSED internal-issuer'

- name: Case refused_global_cert_issuer_internal, refuse an internal issuer set in the global block
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      global_option: cert_issuer internal
      adapted: global_cert_issuer_internal
      expect: 'REFUSED internal-issuer'

- name: Case refused_global_local_certs, refuse local_certs in the global block
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      global_option: local_certs
      adapted: global_local_certs
      expect: 'REFUSED internal-issuer'

- name: Case refused_global_skip_install_trust, refuse skip_install_trust in the global block
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      global_option: skip_install_trust
      adapted: global_skip_install_trust
      expect: 'REFUSED apps'

- name: Case refused_global_auto_https_off, refuse auto_https off in the global block
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      global_option: auto_https off
      adapted: global_auto_https_off
      expect: 'REFUSED server-keys'

# The three spellings of a second site that a test of the text's column-0 lines missed, and
# the plain one it caught. Each is refused because Caddy would serve it.
- name: Case refused_indented_http_site, refuse an indented plain-HTTP site
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      append: "\n\thttp://demo-0.site-fixture.invalid {\n\trespond \"x\"\n}\n"
      adapted: indented_http_site
      expect: 'REFUSED servers'

- name: Case refused_indented_slot_site, refuse an indented second site that would get a certificate of its own
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      append: "\n  demo-0.site-fixture.invalid {\n\treverse_proxy 127.0.0.1:9300\n}\n"
      adapted: indented_slot_site
      expect: 'REFUSED policies'

- name: Case refused_closing_brace_site, refuse a site opened on the closing brace of the wildcard site
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      append: "http://demo-1.site-fixture.invalid {\n\trespond \"x\"\n}\n"
      adapted: closing_brace_site
      expect: 'REFUSED servers'

- name: Case refused_http_only_site, refuse a plain-HTTP site at the start of a line
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      append: "\nhttp://demo-0.site-fixture.invalid {\n\trespond \"x\"\n}\n"
      adapted: http_only_site
      expect: 'REFUSED servers'

# What the adapted config cannot show, refused in the raw text before Caddy adapts it: Caddy
# adapts with an empty environment and an empty filesystem, and the edge runs with its own.
# A {$NAME} or an import of a path can add a site there, and a second {file. placeholder in a
# handler would serve the DNS token. No answer is replayed: the text is refused first.
- name: Case refused_env_substitution, refuse a {$NAME} that the edge's environment could fill with a site
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      append: "\n{$R2_SITE}\n"
      expect: 'REFUSED text-env-var'

- name: Case refused_env_placeholder, refuse an {env. placeholder in a handler
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      append: "\n:8081 {\n\trespond \"{env.R2_SECRET}\"\n}\n"
      expect: 'REFUSED text-env-placeholder'

- name: Case refused_second_file_placeholder, refuse a handler that would serve the DNS token
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      append: "\n:8082 {\n\trespond \"{file./etc/branchleft/secrets/demo-dns-caddy-demo1-wildcard}\"\n}\n"
      expect: 'REFUSED text-file-placeholder'

- name: Case refused_import_of_a_path, refuse an import of files that match a glob
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      append: "\nimport /etc/caddy/extra/*.caddy\n"
      expect: 'REFUSED text-import'

- name: Case refused_import_of_an_undefined_name, refuse an import of a name no snippet in the text defines
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      append: "\nimport not-a-snippet\n"
      expect: 'REFUSED text-import'

# The adapted config holds a placeholder that reads a file or the environment, in a handler
# the text check did not see. The text is the unchanged candidate and the stand-in replays
# what real Caddy printed for the same handler.
- name: Case refused_handler_serves_the_token, refuse an adapted config whose handler answers with the token file
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      adapted: handler_respond_token
      expect: 'REFUSED placeholder'

# Caddy itself cannot adapt the text: the role does not judge a text Caddy rejects, and says
# so without Caddy's message, which can echo a hostname.
- name: Case refused_unadaptable_candidate, refuse a candidate Caddy cannot adapt
  ansible.builtin.import_playbook: refused_candidate.yml
  vars:
    converge_case:
      no_answer: true
      expect: 'The Caddy image could not adapt the candidate'

# The colour units. The role refuses to go on when a colour instance does not load,
# and the message names the missing template, not its path. The control keeps the
# stand-in, and is accepted.
- name: Accept the colour instances with the shared compose template in place
  ansible.builtin.import_playbook: refused_template.yml
  vars:
    converge_case:
      accepted: true

- name: Refuse the colour instances when the shared compose template is missing
  ansible.builtin.import_playbook: refused_template.yml
  vars:
    converge_case: {}
