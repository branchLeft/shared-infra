# The broker tunnel account (ghost-platform demo-host/provision/render_broker_tunnel.md).
# It may hold one -L forward, to the broker, and run nothing. Do not edit by hand.
Match User brokertunnel
    AuthorizedKeysFile /etc/ssh/branchleft-broker-tunnel/authorized_keys
    AuthenticationMethods publickey
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8090
    PermitListen none
    GatewayPorts no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/sbin/nologin
# Ends the Match block, so lines after this drop-in are not read as part of it.
Match all
