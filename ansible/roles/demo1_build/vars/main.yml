---
# Constants of the demo host, not inputs: role variables outrank every value a
# caller passes, so a caller cannot change them. Each is a value the pinned
# programs hard-code (the programs run alone on the host and cannot read this
# file), so the role asserts what it can read back from the programs' output.

# The accounts. The router's uid is the one the uid register claims for it and
# the health router checks the socket directories against.
demo1_build_broker_user: broker
demo1_build_broker_group: broker
demo1_build_router_user: demo-router
demo1_build_router_uid: 30008
demo1_build_router_gid: 30008
demo1_build_slot_uid_base: 30001
demo1_build_colours: [a, b]

# The uid register, the same directory the tenant volume provisioning reads.
demo1_build_uid_register_dir: /etc/branchleft/tenant-uids
demo1_build_config_dir: /etc/branchleft

# State directories. The state root and the broker's own slots directory belong
# to broker_deploy; this role reads them and never writes either.
demo1_build_state_dir: /var/lib/branchleft
demo1_build_broker_slots_dir: /var/lib/branchleft/broker-slots
demo1_build_socket_root: /var/lib/branchleft/demo-router
demo1_build_broker_state_dir: /var/lib/branchleft-broker
demo1_build_flag_dir: /var/lib/branchleft-broker/drain-flags
# Where the flags are written before the drain-flag directory is moved to its place.
# Its parent, the state root, is root's and closed to group and others (the
# preconditions require it), so the broker cannot rename or replace the staging
# directory, which the broker could do to the drain-flag directory in its own tree.
# It must stay on the same filesystem as the broker's state directory: the move is a
# rename, and across filesystems mv copies instead (_dirs.yml refuses that).
demo1_build_flag_staging_dir: /var/lib/branchleft/demo-drain-flags-staging
demo1_build_broker_env_file: /etc/branchleft/broker.env
# Says the drain flags were preseeded once. It lives in root's configuration
# directory, which the preconditions require to be root's and closed to group
# and others, so the broker, which owns the flags, cannot remove it.
demo1_build_preseed_marker: /etc/branchleft/demo1-drain-flags-preseeded
demo1_build_sudoers_path: /etc/sudoers.d/branchleft-slot

# Where the role's copies of the programs are, on the machine that runs the role.
# The paths under it are the paths in the ghost-platform repository, the paths in
# demo1_build_release_files. Nothing is read from the network.
demo1_build_vendored_root: '{{ role_path }}/files/ghost-platform'

# The paths in demo1_build_release_files whose diff the plan does not show: one names a
# system file path and the other a sudoers no-password tag, which the plan's secret scan
# would withhold the whole plan of the host over. The other programs are copied by a task
# that shows its diff. ansible/checks/test_plan_diff_scan.py fails if a path listed here has
# no such line, or if a program left out of it has one.
demo1_build_release_paths_hidden:
  - demo-host/provision/demo_uid_claims.py
  - demo-host/provision/render_slot_sudoers.py

# The staged programs. One release directory per pinned commit, root-owned and
# writable by nobody else; the programs import one another from it.
demo1_build_base_dir: /opt/branchleft/demo-host
demo1_build_releases_dir: /opt/branchleft/demo-host/releases
demo1_build_release_dir: '{{ demo1_build_releases_dir }}/{{ demo1_build_source_sha }}'
demo1_build_current_link: /opt/branchleft/demo-host/current
demo1_build_provision_dir: '{{ demo1_build_release_dir }}/demo-host/provision'

# Where systemd runs the sidecar and the health router from. The pinned
# renderers write these paths into the units, and the role checks that they do.
demo1_build_lib_dir: /usr/local/lib/branchleft
demo1_build_sidecar_path: /usr/local/lib/branchleft/demo_sidecar.py
demo1_build_router_script_path: /usr/local/lib/branchleft/health_router.py
demo1_build_unit_dir: /etc/systemd/system
demo1_build_router_unit: branchleft-health-router@.service
# The loopback port of each slot's router is this base plus the slot number. health_router.py
# hard-codes the same base (HEALTH_PORT_BASE); the role names it so the verify can check the port.
demo1_build_health_port_base: 10100
demo1_build_dropin_name: colour.conf

# The shared compose template unit that the colour drop-ins extend. Its one home is
# hetzner/provision/, which the role reads from the checkout it runs, and the role keeps
# no copy of it (ruled 4 Nov, ws#2364 comment 6630331961). deploy_tooling is the other
# writer of this path; ansible/checks exempts demo1 for this one file only.
demo1_build_compose_template_src: '{{ role_path }}/../../../hetzner/provision/branchleft-compose@.service'
demo1_build_compose_template_dest: /etc/systemd/system/branchleft-compose@.service

# The candidate edge fragment: staged for the owner, never the live edge.
demo1_build_candidate_dir: /var/lib/branchleft/demo-candidates
demo1_build_candidate_edge: /var/lib/branchleft/demo-candidates/edge-upstreams.caddy

# The owner's edge input for each slot. {slot} is the slot number. The input is the
# owner's to place, as root; the role only reads its shape, and the renderer reads its
# content. A slot with no input is not in the production candidate, and the plan and
# apply say so with the notice below.
demo1_build_site_edge_input: '{{ demo1_build_config_dir }}/demo-{slot}.edge.json'
demo1_build_site_not_rendered_text: 'Site candidate for slot {slot} NOT rendered: no owner-placed edge JSON'
demo1_build_site_unstaged_text: >-
  Site candidate for slot {slot} NOT rendered: the pinned site renderer is not staged on this host
  (check mode, first plan)

# The production candidate: the one Caddyfile the pinned site renderer prints for every
# occupied slot, under the single wildcard site. What the renderer prints is what is staged.
demo1_build_candidate_caddyfile: /var/lib/branchleft/demo-candidates/Caddyfile
# The names an earlier version of this role gave its per-slot candidates, removed on
# every run (_candidate.yml).
demo1_build_superseded_candidate_pattern: '^site-[0-9]+\.caddy$'

# The one TLS source the role gives the renderer: Caddy's DNS-01 module reads the token
# from this file when it runs. The role passes the path and never the token.
demo1_build_dns_directive: "{{ 'dns hetzner {file.' ~ demo1_build_dns_token_file ~ '}' }}"

# The renderer's flags for the occupied slots: one --site SLOT=EDGE_JSON each.
demo1_build_site_render_flags: |-
  {%- set out = [] -%}
  {%- for slot in demo1_build_site_occupied -%}
  {%- set _ = out.extend(['--site', slot ~ '=' ~ (demo1_build_site_edge_input | replace('{slot}', slot))]) -%}
  {%- endfor -%}
  {{ out }}

# The stated skips of the production candidate. Each starts with the same words, so a
# plan and an apply say plainly that nothing was staged and why.
demo1_build_wildcard_unset_text: 'Production candidate NOT staged: the wildcard base (demo1_build_wildcard_base) is not set'
demo1_build_token_missing_text: "{{ 'Production candidate NOT staged: no DNS token file is placed at ' ~ demo1_build_dns_token_file }}"
demo1_build_no_occupied_text: 'Production candidate NOT staged: no slot has an owner-placed edge JSON'
demo1_build_candidate_unstaged_text: >-
  Production candidate NOT staged: the pinned site renderer is not staged on this host
  (check mode, first plan)

# The modes a DNS token file may have: no group or other bit and no execute bit.
demo1_build_dns_token_modes: ['0000', '0200', '0400', '0600']

# How the rendered text is judged (_candidate_refusal.yml). The role does not read the
# Caddyfile for its sites or its certificate modes. It has the Caddy image adapt the text
# and judges the JSON that Caddy would run, with files/judge_caddy_config.py, so no
# spelling of the Caddyfile can get past it. The image is loaded on the host by the owner
# and is never pulled (--pull never). The container has no network and no writable
# filesystem, and it reads the candidate on its standard input. NET_BIND_SERVICE is kept
# because the Caddy binary carries that file capability and will not start without it.
demo1_build_docker: /usr/bin/docker
demo1_build_judge_script: judge_caddy_config.py
demo1_build_judge_env: DEMO1_BUILD_ADAPTED_CONFIG
demo1_build_judge_text_env: DEMO1_BUILD_CANDIDATE_TEXT
demo1_build_caddy_adapt_argv: >-
  {{ [demo1_build_docker, 'run', '--rm', '-i', '--pull', 'never', '--network', 'none', '--read-only',
  '--cap-drop', 'ALL', '--cap-add', 'NET_BIND_SERVICE', '--security-opt', 'no-new-privileges',
  '--memory', '512m', '--pids-limit', '128', demo1_build_caddy_image,
  'caddy', 'adapt', '--adapter', 'caddyfile', '--config', '-'] }}
# The image is asked for with `docker image inspect`, which finds it by the digest in its
# reference. `docker images --quiet REF` is not used: its argument is a repository filter,
# so it prints nothing for a digest reference on a real Docker, loaded or not.
demo1_build_caddy_image_inspect_argv: "{{ [demo1_build_docker, 'image', 'inspect', demo1_build_caddy_image] }}"
demo1_build_caddy_unset_text: 'Production candidate NOT staged: no Caddy image (demo1_build_caddy_image) is set to judge the candidate with'
demo1_build_caddy_missing_text: >-
  Production candidate NOT staged: the Caddy image (demo1_build_caddy_image) is not loaded on this host
  under its digest (a Docker on the classic image store never lists a loaded image by digest; README,
  "How the Caddy image gets onto the host")
# A Caddy image is named by its content: a name and a digest, nothing else. A tag alone can be
# re-pointed, an image ID is not found by a digest lookup, and a name with a tag and a digest
# would be two names for one check.
demo1_build_caddy_image_pattern: '^[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}\Z'
# True only when docker listed exactly one image for the reference and its RepoDigests hold
# the digest of the pinned reference. Anything else (none, two, a listing of another shape, a
# digest that is not the pinned one, RepoDigests empty or absent) is false. The tests
# short-circuit, so a shape that is not a list of one mapping is never indexed. It reads
# demo1_build_caddy_image_listed (the parsed JSON, [] when there is none) and
# demo1_build_caddy_image_unreadable. A template, evaluated where it is used; the unit test
# renders this same text against what real Docker prints. The pattern ends in a lookahead
# that holds only at the end of the string, because a backslash in a Jinja string is read one
# way by Ansible and another by plain Jinja, and this text must mean one thing in both.
demo1_build_caddy_image_verified_template: >-
  {{
    not demo1_build_caddy_image_unreadable
    and demo1_build_caddy_image_listed is sequence
    and demo1_build_caddy_image_listed is not string
    and demo1_build_caddy_image_listed is not mapping
    and demo1_build_caddy_image_listed | length == 1
    and demo1_build_caddy_image_listed[0] is mapping
    and demo1_build_caddy_image_listed[0].RepoDigests is defined
    and demo1_build_caddy_image_listed[0].RepoDigests is sequence
    and demo1_build_caddy_image_listed[0].RepoDigests is not string
    and (demo1_build_caddy_image_listed[0].RepoDigests | select('string')
         | select('match', '^[^@]+@' ~ (demo1_build_caddy_image.split('@') | last) ~ '(?!(?s:.))')
         | list | length) > 0
  }}

# The programs placed outside the release directory. The wrapper is the only
# one the sudoers grant names, and the only one run directly as a program.
demo1_build_installed_programs:
  - name: the slot wrapper
    src: branchleft_slot.py
    dest: '{{ demo1_build_wrapper_path }}'
  - name: the drain sidecar
    src: demo_sidecar.py
    dest: '{{ demo1_build_sidecar_path }}'
  - name: the health router
    src: health_router.py
    dest: '{{ demo1_build_router_script_path }}'

# The python the units and the role run the programs with. -E ignores the
# environment's PYTHON variables, -s ignores the user site, and -B writes no
# bytecode: a read-only render must not leave a __pycache__ in the release.
demo1_build_python: /usr/bin/python3
demo1_build_python_flags: ['-E', '-s', '-B']

# The patterns end in \Z, not $, so a trailing line break does not pass.
demo1_build_sha_pattern: '^[0-9a-f]{40}\Z'
demo1_build_checksum_pattern: '^[0-9a-f]{64}\Z'
demo1_build_slot_pattern: '^[0-9]+\Z'
demo1_build_path_pattern: '^/[A-Za-z0-9._/-]+\Z'
demo1_build_release_path_pattern: '^demo-host/provision/[a-z_]+\.py\Z'
demo1_build_instance_pattern: '^branchleft-compose@demo-[0-9]+-[a-z]\Z'
# Lower-case labels of letters, digits and inner hyphens, at least two, no wildcard.
demo1_build_wildcard_base_pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\Z'
demo1_build_dns_token_path_pattern: '^/etc/branchleft/secrets/[A-Za-z0-9][A-Za-z0-9._-]*\Z'

# The slot table as strings, whatever type the host's variables gave. The
# pinned generator's grant is compared with the installed one line for line, so
# no count is derived from this table: it is checked against the generator's.
demo1_build_slots: "{{ demo1_build_slot_names | map('string') | list }}"

# The programs the role needs from the release, by file name.
demo1_build_required_programs:
  - branchleft_slot.py
  - demo_go_live.py
  - demo_sidecar.py
  - demo_uid_claims.py
  - health_router.py
  - render_colour_units.py
  - render_demo_edge.py
  - render_demo_site.py
  - render_router_unit.py
  - render_slot_sudoers.py

# What a comment of the grant's header is: "#" alone, or "#" and a space. It is
# not "#1000" or "#includedir", which sudoers reads as a uid and an include, and
# the split below also refuses a comment ending in a backslash.
demo1_build_grant_header_pattern: '^#( .*)?$'

# The installed grant and the pinned generator's output, each cut into a header and
# a body, as {installed: [...], generated: [...]}. The header (leading blank lines and
# comments) is not compared; the body, from the first other line, is compared in order
# by _sudoers_check.yml. Both texts go through this one template.
demo1_build_grant_bodies: |-
  {%- set texts = {'installed': demo1_build_sudoers_raw.content | b64decode} -%}
  {%- if demo1_build_release_ready | bool -%}
  {%- set _ = texts.update({'generated': demo1_build_generated_sudoers.stdout}) -%}
  {%- endif -%}
  {%- set bodies = {} -%}
  {%- for name, text in texts.items() -%}
  {%- set ns = namespace(in_body=false, lines=[]) -%}
  {%- for line in text.rstrip('\n').split('\n') -%}
  {%- if not (line == '' or (line is match(demo1_build_grant_header_pattern) and not line.endswith('\\'))) -%}
  {%- set ns.in_body = true -%}
  {%- endif -%}
  {%- if ns.in_body -%}
  {%- set _ = ns.lines.append(line) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- set _ = bodies.update({name: ns.lines}) -%}
  {%- endfor -%}
  {{ bodies }}

# The wrapper is installed as root at demo1_build_wrapper_path, so the path the
# grant was checked for is the path the install uses: every rule must run exactly
# that path, followed by its arguments, and by nothing else. The whole rule is
# matched, to its end: one or more arguments, each a run of letters, digits, dot,
# underscore, slash or hyphen, one single space before each. A comma, so a second
# command; a wildcard; a colon; a backslash or a trailing space does not match. The
# arguments are not compared with the generator's here (a host with no staged
# release has nothing to compare with): that is the body comparison, which an apply
# always makes. A path with a dot segment, a doubled slash or a trailing slash is
# not a spelling the grant can name, and is refused.
demo1_build_grant_wrapper_pattern: '^broker ALL=\(root\) NOPASSWD: {{ demo1_build_wrapper_path | regex_escape }}( [A-Za-z0-9._/-]+)+\Z'
demo1_build_path_dots_pattern: '(^|/)\.{1,2}(/|\Z)|//|/\Z'
demo1_build_reset_line_pattern: ' [0-9]+ reset$'
demo1_build_reset_suffix_pattern: ' reset$'

# What the slot table implies, derived once here so no task spells a slot out.
# The claims are the slugs and uids the register holds: one per slot and one for
# the router.
demo1_build_wanted_claims: |-
  {%- set out = [] -%}
  {%- for slot in demo1_build_slots -%}
  {%- set _ = out.append({'slug': 'demo-' ~ slot, 'uid': (demo1_build_slot_uid_base | int) + (slot | int)}) -%}
  {%- endfor -%}
  {%- set _ = out.append({'slug': demo1_build_router_user, 'uid': demo1_build_router_uid | int}) -%}
  {{ out }}

# The router's socket directories, parents first: one per slot and one per colour
# under it.
demo1_build_socket_dirs: |-
  {%- set out = [] -%}
  {%- for slot in demo1_build_slots -%}
  {%- set _ = out.append(demo1_build_socket_root ~ '/' ~ slot) -%}
  {%- for colour in demo1_build_colours -%}
  {%- set _ = out.append(demo1_build_socket_root ~ '/' ~ slot ~ '/' ~ colour) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out }}

# One drain flag per slot and colour, named as the broker and the sidecar name it.
demo1_build_flag_files: |-
  {%- set out = [] -%}
  {%- for slot in demo1_build_slots -%}
  {%- for colour in demo1_build_colours -%}
  {%- set _ = out.append(slot ~ '-' ~ colour ~ '.drain') -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out }}

# The colour units the renderer must produce, one per slot and colour.
demo1_build_colour_instances: |-
  {%- set out = [] -%}
  {%- for slot in demo1_build_slots -%}
  {%- for colour in demo1_build_colours -%}
  {%- set _ = out.append('branchleft-compose@demo-' ~ slot ~ '-' ~ colour) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out }}

# How the colour renderer prints its drop-ins: "## <unit instance>", the drop-in
# text, and a blank line, for each colour. The command module strips the output's
# trailing newlines, so a unit's text ends before the blank lines that precede
# the next header or the end of the output; the writing task adds its newline back.
demo1_build_dropin_pattern: '(?ms)^## (\S+)\n(.*?)\n*(?=^## |\Z)'

# Each installed program with the sha256 its pin names, so the read-back compares
# the file on the host with the pin and not with anything the role computed.
demo1_build_installed_pins: |-
  {%- set out = [] -%}
  {%- for p in demo1_build_installed_programs -%}
  {%- set pin = demo1_build_release_files | selectattr('path', 'equalto', 'demo-host/provision/' ~ p.src) | map(attribute='sha256') | first -%}
  {%- set _ = out.append({'dest': p.dest, 'src': p.src, 'sha256': pin}) -%}
  {%- endfor -%}
  {{ out }}

# One upstream snippet per slot in the edge fragment.
demo1_build_edge_snippet_pattern: '(?m)^\(slot[0-9]+-upstream\) \{$'

# The host scan (tasks/_secret_holders.yml). demo1 holds only the secrets listed here. A row names
# a file, by path_regex (no anchors; the scan adds them), what it reaches, and who holds it. A row
# names where a secret is, never its value. A file the scan finds that no row names is refused.
# The reaches column says what a holder can reach. It does not say the value is worthless off the
# host: a token works from any host that holds it, so the control is that it is on this host only.
demo1_build_secret_holders:
  - name: DNS-01 token for the demo wildcard
    path_regex: '/etc/branchleft/secrets/demo-dns-caddy-demo1-wildcard'
    reaches: "the DNS provider's API for the demo zone only (the demo DNS project)"
    owner: root
    mode: '0600'
  - name: Mail spool drain token
    path_regex: '/etc/branchleft/mail-spool\.env'
    reaches: "the mail spool's drain port, which listens on this host's private address only"
    owner: root
    mode: '0600'
  - name: Per-slot environment file of a colour unit
    path_regex: '/etc/branchleft/demo-[0-9]+-[ab]\.env'
    reaches: 'the EnvironmentFile of one colour unit (its own process); the contents are not read by this role, and the owner confirms them on the host'
    owner: root
    mode: "owner's input"
  - name: Per-slot Ghost staff token (broker admin keys)
    path_regex: '/var/lib/branchleft/broker-slots/admin-keys/.+'
    reaches: "that demo's Ghost Admin API as its owner's staff account; deleted at a slot reset"
    owner: broker
    mode: '0600'
  - name: Spool path account's authorised key
    path_regex: '/etc/ssh/branchleft-spool-path/authorized_keys'
    reaches: "the spool path account's login from ops1; the private half is on ops1 only"
    owner: root
    mode: '0644'
  - name: This host's sshd host key
    path_regex: '/etc/ssh/ssh_host_[a-z0-9]+_key'
    reaches: "this host's own sshd identity; clients trust it through their known_hosts, and it authenticates nothing outward"
    owner: root
    mode: '0600'
  # The broker tunnel change is on main (_broker_tunnel.yml). The row names the file the tunnel
  # installs, so the scan accepts it. A row for a file not yet present is not an error: the scan refuses
  # only a file it finds that no row names, so an absent file is simply not found (the control case
  # of molecule/refusals/refused_secret.yml proves it with this row in place).
  - name: Broker tunnel account's authorised key
    path_regex: '/etc/ssh/branchleft-broker-tunnel/authorized_keys'
    reaches: "the brokertunnel login from ops1, forwarding only to the broker's port here; ops1's public key, private half on ops1 only"
    owner: root
    mode: '0644'

  # The broker's request-signing verify key, written by broker_deploy (its README, the verify key
  # section). The file is binary, so the content scan skips it; it is found by name (the binary key
  # name rule in demo1_build_secret_name_core). It is the public key: it verifies, it cannot sign.
  - name: Broker request-signing verify key
    path_regex: '/etc/branchleft/broker-verify-key\.bin'
    reaches: "the broker's check of request signatures; the public key only (it verifies and cannot sign), written from broker_deploy's carried hex"
    owner: root
    mode: '0640'

  # The CI keys of demo1's ansible-ci account (enrol runbook Part 3; ansible-ci-jump-through-edge1
  # runbook step 8.8, owner ruling demo1-ci-login-r2). Each key runs one forced command only.
  - name: CI keys in the ansible-ci account's authorised keys
    path_regex: '/home/ansible-ci/\.ssh/authorized_keys'
    reaches: 'the forced-command pull trigger: each key runs one mode only (check or apply); the public key only, its private half in the CI secret'
    owner: ansible-ci
    mode: '0600'
  # Root's own authorised keys (an owner-approved row). The file
  # holds public keys only; the scan names it so a root login key is an owner-reviewed entry, not a
  # silent one. Its reaches column is the login it grants root.
  - name: Root's authorised keys
    path_regex: '/root/\.ssh/authorized_keys'
    reaches: "root's SSH login on this host: the public keys that may log in as root"
    owner: root
    mode: '0600'

# The regex the scan's unlisted check reads: a found path that matches none of the rows is refused.
demo1_build_secret_holder_regex: "{{ '^(?:' ~ (demo1_build_secret_holders | map(attribute='path_regex') | join('|')) ~ ')\\Z' }}"

# The roots the scan reads. A root the host does not have is skipped. /root is read by file list
# (see tasks/_secret_holders.yml), not grep, so its own .ansible can be pruned and no other .ansible is.
demo1_build_secret_scan_roots: [/etc, /root, /home, /opt, /srv, /var/backups, /var/lib]

# Directories the scan never enters, matched by full path and never by base name, so /etc/docker
# (the client certificates in certs.d) is scanned. /var/lib/docker and /var/lib/containerd are the
# container runtime's image stores, pinned by digest and not host secrets. /root/.ansible/tmp is
# Ansible's module payload directory for root: the scan's own run writes there. No other path is pruned.
# Every find in tasks/_secret_holders.yml takes this argument list ahead of its tests.
demo1_build_secret_prune_argv:
  [
    '(',
    '-path',
    '/var/lib/docker',
    '-o',
    '-path',
    '/var/lib/containerd',
    '-o',
    '-path',
    '/root/.ansible/tmp',
    ')',
    '-prune',
    '-o',
  ]

# Every file in these directories is a secret, whatever its name or content.
demo1_build_secret_holder_dirs:
  [/etc/branchleft/secrets, /var/lib/branchleft/broker-slots/admin-keys]

# File and link names, matched against the basename: an authorised-keys file, a private key by its
# usual name or extension, a binary key file named *-key.bin (the content scan skips binary files,
# so it can only be found by name), and a netrc.
# .pem is not a name rule: the CA bundle under /etc/ssl/certs is .pem files, most of them links, and a
# PEM private key is caught by its header in the content scan.
demo1_build_secret_name_core:
  [
    'authorized_keys2?',
    'id_[A-Za-z0-9_-]*[A-Za-z0-9]',
    '.*\.(key|p12|pfx|jks)',
    '.*[-_.]key\.bin',
    '\.netrc',
  ]
# The same names as an ERE, for find -regex (which matches the whole path, so the basename follows a slash).
demo1_build_secret_name_find_regex: "{{ '.*/(' ~ (demo1_build_secret_name_core | join('|')) ~ ')' }}"

# A link whose target is a holder directory's file, or a secret-named file anywhere, is a secret link.
demo1_build_secret_link_dir_regex: "{{ '^(?:' ~ (demo1_build_secret_holder_dirs | join('|')) ~ ')/' }}"
demo1_build_secret_link_name_regex: "{{ '(^|/)(?:' ~ (demo1_build_secret_name_core | join('|')) ~ ')$' }}"

# Content, matched case-insensitively and read only for a match, never printed. The strict set
# holds in any file: a PEM and a PGP private key header, a shell export of a secret name, a bare
# KEY=value line whose name holds a secret word, an AWS secret access key, a GitHub, Pulumi or
# registry token shape. The config set holds in config-named files only (see the includes below),
# where a spaced, indented, YAML or JSON key with a secret name is a secret line.
demo1_build_secret_content_strict:
  - '-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----'
  - '-----BEGIN PGP PRIVATE KEY BLOCK-----'
  - '^[[:space:]]*export[[:space:]]+[A-Za-z_][A-Za-z0-9_]*(token|secret|password|api_?key|credential|private_?key)[A-Za-z0-9_]*=[^[:space:]]+'
  - '^[A-Za-z_][A-Za-z0-9_]*(token|secret|password|api_?key|credential|private_?key)[A-Za-z0-9_]*=[^[:space:]]+'
  - 'aws_secret_access_key[[:space:]]*=[[:space:]]*[^[:space:]]+'
  - 'gh[pousr]_[A-Za-z0-9]{36,}'
  - 'github_pat_[A-Za-z0-9_]{22,}'
  - 'pul-[0-9a-f]{40}'
  - '"auth"[[:space:]]*:[[:space:]]*"[A-Za-z0-9+/=]{16,}"'
demo1_build_secret_content_config:
  - '^[[:space:]]*[A-Za-z0-9_]*(token|secret|password|api_?key|credential|private_?key)[A-Za-z0-9_]*[[:space:]]*=[[:space:]]*[^[:space:]]+'
  - '^[[:space:]]*-?[[:space:]]*[A-Za-z0-9_-]*(token|secret|password|api[_-]?key|credential|private[_-]?key)[A-Za-z0-9_-]*[[:space:]]*:[[:space:]]*[^[:space:]]+'
  - '"[A-Za-z0-9_-]*(token|secret|password|api[_-]?key|credential|private[_-]?key)[A-Za-z0-9_-]*"[[:space:]]*:[[:space:]]*"[^"]+"'
demo1_build_secret_content_strict_regex: "{{ demo1_build_secret_content_strict | join('|') }}"
demo1_build_secret_content_config_regex: "{{ demo1_build_secret_content_config | join('|') }}"

# The config-named files the config set reads, as grep globs and as a regex for /root's file list.
demo1_build_secret_config_includes:
  - '--include=*.yml'
  - '--include=*.yaml'
  - '--include=*.json'
  - '--include=*.env'
  - '--include=*.conf'
  - '--include=*.ini'
  - '--include=*.cfg'
  - '--include=*.toml'
demo1_build_secret_config_name_regex: '\.(yml|yaml|json|env|conf|ini|cfg|toml)$'

# The broker tunnel account (_broker_tunnel.yml). ops1 holds one ssh -L forward to
# the broker through it (owner ruling control=a). Constants, not inputs: the grant is
# ghost-platform's demo-host/provision/render_broker_tunnel.py, and the templates
# render byte for byte what that program renders (molecule/broker_tunnel holds the
# golden copies). A caller cannot widen the destination.
demo1_build_tunnel_user: brokertunnel
demo1_build_tunnel_nologin: /usr/sbin/nologin
demo1_build_tunnel_broker_open: 127.0.0.1:8090
demo1_build_tunnel_key_options: 'restrict,port-forwarding,permitopen="{{ demo1_build_tunnel_broker_open }}"'
demo1_build_tunnel_authorized_keys_dir: /etc/ssh/branchleft-broker-tunnel
demo1_build_tunnel_authorized_keys: '{{ demo1_build_tunnel_authorized_keys_dir }}/authorized_keys'
demo1_build_tunnel_sshd_config_dir: /etc/ssh/sshd_config.d
demo1_build_tunnel_sshd_dropin: '{{ demo1_build_tunnel_sshd_config_dir }}/50-branchleft-broker-tunnel.conf'
demo1_build_tunnel_sshd_service: ssh
# The one input: ops1's tunnel public key, placed by the owner. Public data, but a
# file the owner places, so the role never chooses which key is let in. Absent, the
# tunnel is not installed and the run says so (a stated skip, ANS-10).
demo1_build_tunnel_inputs_dir: /etc/branchleft/broker-tunnel
demo1_build_tunnel_key_input: '{{ demo1_build_tunnel_inputs_dir }}/ops1_public_key'
# One ed25519 key line: the type, the 68 base64 characters of an ed25519 key and an
# optional comment of the characters the ghost-platform program accepts. \Z, so a
# second line (a second, unrestricted key) is refused.
demo1_build_tunnel_ed25519_pattern: '^ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI[A-Za-z0-9+/]{43}(?: [A-Za-z0-9@._-]{1,64})?\Z'
# The sshd -T keyword and the one value sshd must apply to the account. The address
# sshd is asked about is a documentation address (RFC 5737): the role does not know
# edge1's, so a Match Address block for edge1 alone is not seen (README, Limits).
demo1_build_tunnel_check_addr: 192.0.2.1
demo1_build_tunnel_expected_effective:
  authorizedkeysfile: '{{ demo1_build_tunnel_authorized_keys }}'
  authenticationmethods: publickey
  allowtcpforwarding: local
  permitopen: '{{ demo1_build_tunnel_broker_open }}'
  permitlisten: none
  gatewayports: 'no'
  allowagentforwarding: 'no'
  allowstreamlocalforwarding: 'no'
  x11forwarding: 'no'
  permittty: 'no'
  permittunnel: 'no'
  permituserrc: 'no'
  forcecommand: '{{ demo1_build_tunnel_nologin }}'

# The drain sidecar's pin file. The wrapper (branchleft_slot.py) believes it only when it is
# a regular file owned by root, writable by no one else, whose one line is exactly
# <variable>=<name>@sha256:<64 lower-case hex>; the colour units read it as an EnvironmentFile
# and the sidecar launcher starts the image it names. The name is the host's own label for the
# image (the broker's repository path without its registry host: demo1 reaches no registry),
# duplicated from the wrapper and held to it by tests/unit/test_sidecar_pin.py. These are
# constants: a caller cannot move the file the wrapper reads or the name it matches.
demo1_build_sidecar_image_env_path: /etc/branchleft/demo-sidecar.image.env
demo1_build_sidecar_image_variable: DEMO_SIDECAR_IMAGE
demo1_build_sidecar_image_name: branchleft/drain-sidecar
demo1_build_sidecar_digest_pattern: '^sha256:[0-9a-f]{64}\Z'
demo1_build_sidecar_image_line: '{{ demo1_build_sidecar_image_variable }}={{ demo1_build_sidecar_image_name }}@{{ demo1_build_sidecar_digest }}'
