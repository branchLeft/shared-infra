---
# Internal to the role, included from main.yml after _units.yml. Enables and starts each
# slot's health router, branchleft-health-router@<slot>. Until this task, enabling them was a
# hand step (ghost-platform demo-host/provision/render_router_unit.md, the Install block).
#
# Idempotent: systemd_service with enabled and state started changes nothing once a router is
# enabled and running, and it never restarts one. A router keeps the code it started with until
# it is restarted, and the handler "Restart the health routers" does that in the apply that
# changed the router program or its unit (#4429); an apply with nothing changed restarts none.
# The routers name no colour unit, so a colour's stop or start never reaches them.
#
# Not checked here: whether a router is active or listening. A container cannot run the unit,
# so those are proved on the host after the gated apply (see the README, "Health routers").

- name: Look at whether the router template unit is installed
  ansible.builtin.stat:
    path: '{{ demo1_build_unit_dir }}/{{ demo1_build_router_unit }}'
    follow: false
  register: demo1_build_router_unit_stat

- name: Say the health routers were NOT enabled, because the template unit is not on this host yet
  ansible.builtin.debug:
    msg: >-
      Health routers NOT enabled: {{ demo1_build_router_unit }} is not on this host yet (check mode, first plan).
      An apply enables and starts one router per slot, on ports {{ demo1_build_health_port_base }} to
      {{ demo1_build_health_port_base | int + (demo1_build_slots | length) - 1 }}.
  when: ansible_check_mode and not demo1_build_router_unit_stat.stat.exists

- name: Enable and start the health router of each slot
  ansible.builtin.systemd_service:
    name: 'branchleft-health-router@{{ item }}.service'
    enabled: true
    state: started
  loop: '{{ demo1_build_slots }}'
  loop_control:
    label: '{{ item }}'
  when: not ansible_check_mode or demo1_build_router_unit_stat.stat.exists
