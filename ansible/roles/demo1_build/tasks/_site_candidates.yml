---
# Internal to the role, included once from _candidate.yml. The pinned site renderer
# turns the owner's edge inputs, one per occupied slot, into one wildcard Caddyfile,
# staged as a root-only candidate. The inputs sit at fixed paths only root can write
# (vars/main.yml); the role never makes them and never reads a value from them.
#
# Every task that handles the renderer's output is hidden (no_log, diff: false, ANS-16),
# and no failure message carries that output, as it can echo a hostname.
#
# A candidate that is not staged is a stated skip (ANS-10), not a pass: a printed line says so.

- name: Look at the candidate directory _candidate.yml declared
  ansible.builtin.stat:
    path: '{{ demo1_build_candidate_dir }}'
    follow: false
  register: demo1_build_site_dir_stat

# get_checksum is off: a checksum of the owner's input would be a digest of a
# sensitive file (ANS-16).
- name: Look at each slot's edge input, without reading it
  ansible.builtin.stat:
    path: "{{ demo1_build_site_edge_input | replace('{slot}', item) }}"
    follow: false
    get_checksum: false
  loop: '{{ demo1_build_slots }}'
  loop_control:
    label: '{{ item }}'
  register: demo1_build_site_inputs

- name: Note the slots that have an edge input
  ansible.builtin.set_fact:
    demo1_build_site_occupied: '{{ demo1_build_site_inputs.results | selectattr("stat.exists") | map(attribute="item") | list }}'

# Each refusal is its own task, in this order, so a case can name the check that
# fired. Each names the path and never a value: the path is the owner's to correct.
- name: Refuse an edge input that is a link or not a regular file
  ansible.builtin.assert:
    that:
      - not item.stat.islnk
      - item.stat.isreg
    quiet: true
    fail_msg: >-
      The edge input {{ demo1_build_site_edge_input | replace('{slot}', item.item) }} is a link or not a
      regular file. Place a plain file there, owned by root, mode 0600.
  loop: '{{ demo1_build_site_inputs.results | selectattr("stat.exists") | list }}'
  loop_control:
    label: '{{ item.item }}'

- name: Refuse an edge input that is not root's
  ansible.builtin.assert:
    that:
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
    quiet: true
    fail_msg: >-
      The edge input {{ demo1_build_site_edge_input | replace('{slot}', item.item) }} is not root:root.
      Only root may own a file the renderer reads as root.
  loop: '{{ demo1_build_site_inputs.results | selectattr("stat.exists") | list }}'
  loop_control:
    label: '{{ item.item }}'

- name: Refuse an edge input open to group or others, or with an execute bit
  ansible.builtin.assert:
    that:
      - item.stat.mode in ['0000', '0200', '0400', '0600']
    quiet: true
    fail_msg: >-
      The edge input {{ demo1_build_site_edge_input | replace('{slot}', item.item) }} is mode {{ item.stat.mode }}.
      It must be 0600 or narrower.
  loop: '{{ demo1_build_site_inputs.results | selectattr("stat.exists") | list }}'
  loop_control:
    label: '{{ item.item }}'

# The notice for each slot with no input. It is registered so the scenarios can read
# that it was printed: a silent skip would read as a configured host.
- name: Say which slots have no edge input, and so no site candidate
  ansible.builtin.debug:
    msg: "{{ demo1_build_site_not_rendered_text | replace('{slot}', item.item) }}"
  loop: '{{ demo1_build_site_inputs.results | rejectattr("stat.exists") | list }}'
  loop_control:
    label: '{{ item.item }}'
  register: demo1_build_site_notices

- name: Say which occupied slots are not rendered where no release is staged
  ansible.builtin.debug:
    msg: "{{ demo1_build_site_unstaged_text | replace('{slot}', item) }}"
  loop: '{{ demo1_build_site_occupied }}'
  loop_control:
    label: '{{ item }}'
  register: demo1_build_site_unstaged_notices
  when: not (demo1_build_release_ready | default(false) | bool)

- name: Look at the DNS token file the wildcard certificate is issued with
  ansible.builtin.include_tasks: _dns_token.yml

# Whether the Caddy image that judges the candidate is on this host, and is the pinned one.
# Reads only: `docker image inspect` lists the image by the digest in its reference and
# never pulls. A host with no docker, or without the image under that reference, answers
# no, which is a stated skip. An image that is there and is not the pinned one is refused
# below, because a different image under the same name would judge the candidate.
- name: Look for the Caddy image that judges the candidate
  ansible.builtin.command:
    argv: '{{ demo1_build_caddy_image_inspect_argv }}'
  register: demo1_build_caddy_image_inspect
  changed_when: false
  check_mode: false
  failed_when: false
  when: demo1_build_caddy_image != ''

# Reset first (a register or fact set earlier in a run outlives its task), so a case or a
# second pass never reads the last one's answer.
- name: Forget what an earlier pass read of the image
  ansible.builtin.set_fact:
    demo1_build_caddy_image_listed: []
    demo1_build_caddy_image_unreadable: false

# docker prints a JSON list, one object per image, with the digests it knows the image by
# in RepoDigests. Output that is not JSON is not guessed at: it counts as unreadable and
# the digest check refuses it.
- name: Read what docker lists for the image
  when: demo1_build_caddy_image != '' and demo1_build_caddy_image_inspect.rc | default(1) == 0
  block:
    - name: Parse the listing
      ansible.builtin.set_fact:
        demo1_build_caddy_image_listed: '{{ demo1_build_caddy_image_inspect.stdout | from_json }}'
  rescue:
    - name: Note that the listing was not JSON
      ansible.builtin.set_fact:
        demo1_build_caddy_image_unreadable: true

- name: Note whether the Caddy image is on the host and is the pinned one
  ansible.builtin.set_fact:
    demo1_build_caddy_image_loaded: "{{ demo1_build_caddy_image != '' and demo1_build_caddy_image_inspect.rc | default(1) == 0 }}"
    demo1_build_caddy_image_verified: '{{ demo1_build_caddy_image_verified_template }}'

# The notice of a candidate that is not staged on this run, and why. It is registered so
# the scenarios can read that it was printed: a silent skip would read as a configured
# host. The checks run in this order, and the first that applies is the one named.
- name: Work out why the production candidate is not staged, if it is not
  ansible.builtin.set_fact:
    demo1_build_candidate_skip_text: >-
      {{ demo1_build_wildcard_unset_text if demo1_build_wildcard_base == ''
      else (demo1_build_token_missing_text if not (demo1_build_dns_token_placed | bool)
      else (demo1_build_caddy_unset_text if demo1_build_caddy_image == ''
      else (demo1_build_caddy_missing_text if not (demo1_build_caddy_image_loaded | bool)
      else (demo1_build_candidate_unstaged_text if not (demo1_build_release_ready | default(false) | bool)
      else (demo1_build_no_occupied_text if demo1_build_site_occupied | length == 0 else ''))))) }}

- name: Say why the production candidate is not staged
  ansible.builtin.debug:
    msg: '{{ demo1_build_candidate_skip_text }}'
  register: demo1_build_candidate_notice
  when: demo1_build_candidate_skip_text != ''

# The renderer prints the whole Caddyfile, hostnames included, so it is run with no
# output flag (a read) and its output is hidden. failed_when is off: a refusal is
# handled below, so its message, which can echo a hostname, is never printed.
- name: Render, check and stage the production candidate
  when: demo1_build_candidate_skip_text == ''
  block:
    # A name can be loaded with the wrong content. docker finds an image by the digest in the
    # reference, but this reads the answer rather than trusting the exit code alone.
    - name: Refuse to judge the candidate with an image that is not the pinned one
      ansible.builtin.assert:
        that:
          - demo1_build_caddy_image_verified | bool
        quiet: true
        fail_msg: >-
          The host holds something under {{ demo1_build_caddy_image }} that is not the pinned image.
          docker must list exactly one image for that reference, and its RepoDigests must hold the
          pinned digest {{ demo1_build_caddy_image.split('@') | last }}. RepoDigests is empty on an image
          that was loaded into a Docker on the classic image store.
          {{ 'The listing was not JSON.' if demo1_build_caddy_image_unreadable
          else 'It listed ' ~ (demo1_build_caddy_image_listed | length) ~ ' image(s).' }}
          The candidate was not judged. Load the image again from the pinned digest (README,
          "How the Caddy image gets onto the host").

    - name: Render the one wildcard Caddyfile of every occupied slot with the pinned renderer, printing it and writing nothing
      ansible.builtin.command:
        argv: >-
          {{ [demo1_build_python] + demo1_build_python_flags
          + [demo1_build_provision_dir ~ '/render_demo_site.py', '--base', demo1_build_wildcard_base]
          + demo1_build_site_render_flags
          + ['--dns-directive', demo1_build_dns_directive] }}
      register: demo1_build_wildcard_render
      changed_when: false
      check_mode: false
      failed_when: false
      no_log: true
      diff: false

    - name: Note whether the renderer refused its inputs, without its message
      ansible.builtin.set_fact:
        demo1_build_wildcard_refused: '{{ demo1_build_wildcard_render.rc != 0 or (demo1_build_wildcard_render.stdout | length) == 0 }}'
      no_log: true

    - name: Refuse when the renderer refused its inputs, without its message
      ansible.builtin.assert:
        that:
          - not (demo1_build_wildcard_refused | bool)
        quiet: true
        fail_msg: >-
          The pinned site renderer refused the wildcard base or the edge input of the occupied
          slot(s) {{ demo1_build_site_occupied | join(', ') }}. Its message is withheld, because it
          can echo a hostname (ANS-16). Check the base and each input against render-core's
          EdgeSiteBlock.

    - name: Refuse a rendered candidate whose config Caddy would run with an interim certificate or any site but the wildcard
      ansible.builtin.include_tasks: _candidate_refusal.yml
      vars:
        demo1_build_candidate_text: '{{ demo1_build_wildcard_render.stdout }}'

    # Root's and mode 0600, in the closed candidate directory. Skipped in check mode
    # where that directory is not there yet, as the edge fragment's copy is.
    - name: Stage the production candidate, root's and mode 0600
      ansible.builtin.copy:
        content: "{{ demo1_build_wildcard_render.stdout }}\n"
        dest: '{{ demo1_build_candidate_caddyfile }}'
        owner: root
        group: root
        mode: '0600'
      when: demo1_build_site_dir_stat.stat.exists
      no_log: true
      diff: false
  always:
    # no_log keeps a result out of the log, but the registered variable keeps the
    # Caddyfile until the play ends. Empty it here (ANS-16).
    - name: Empty the registered render, which holds the Caddyfile
      ansible.builtin.set_fact:
        demo1_build_wildcard_render: {}
      no_log: true

# What a plan or an apply reports as not rendered on this run: every slot that has no
# input, or every slot where no renderer is staged. A configured host with the input
# for slot 0 gives the six others.
- name: Record the slots that have no site candidate on this run
  ansible.builtin.set_fact:
    # difference() returns the slots in no fixed order, so the list is sorted for the
    # scenarios that compare it.
    demo1_build_site_not_rendered: >-
      {{ demo1_build_slots | difference(demo1_build_site_occupied
      if (demo1_build_release_ready | default(false) | bool) else []) | sort }}
