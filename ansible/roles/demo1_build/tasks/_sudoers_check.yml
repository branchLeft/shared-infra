---
# Internal to the role. broker_deploy writes /etc/sudoers.d/branchleft-slot and
# this role never does (ANS-12). It does depend on what the file grants, because
# the grant names the wrapper this role installs, so it reads the file back and
# compares it with the pinned generator's own output. Every task here reads and
# changes nothing, so all of it runs in check mode (ANS-10).
#
# The order of the assertions is part of the design. Each one owns one refusal,
# and the Molecule cases name the assertion they expect, so a case goes red when
# an earlier check does not fire first:
#   1. the file is root's regular file, mode 0440
#   2. visudo accepts it
#   3. the body equals the generator's body, line for line, in order
#   4. the slot table of the role is the generator's
#   5. every rule runs the wrapper path the role installs to
- name: Look at the sudoers grant broker_deploy installed
  ansible.builtin.stat:
    path: '{{ demo1_build_sudoers_path }}'
    follow: false
  register: demo1_build_sudoers_stat

- name: Refuse a sudoers grant that is missing, a link, or not root-owned mode 0440
  ansible.builtin.assert:
    that:
      - demo1_build_sudoers_stat.stat.exists
      - demo1_build_sudoers_stat.stat.isreg
      - not demo1_build_sudoers_stat.stat.islnk
      - demo1_build_sudoers_stat.stat.pw_name == 'root'
      - demo1_build_sudoers_stat.stat.gr_name == 'root'
      - demo1_build_sudoers_stat.stat.mode == '0440'
    quiet: true
    fail_msg: >-
      {{ demo1_build_sudoers_path }} is missing, is not a plain file, or is not root:root mode 0440.
      Apply the broker_deploy role first; this role never writes the sudoers file.

# Strict, and a read: visudo -c changes nothing. A grant sudo cannot parse would
# be silently ignored, and the wrapper would then be reachable by no one.
- name: Check the installed grant with visudo, strictly, changing nothing
  ansible.builtin.command:
    argv:
      - /usr/sbin/visudo
      - -csf
      - '{{ demo1_build_sudoers_path }}'
  register: demo1_build_visudo
  changed_when: false
  check_mode: false

- name: Read the installed grant
  ansible.builtin.slurp:
    src: '{{ demo1_build_sudoers_path }}'
  register: demo1_build_sudoers_raw

# The generator prints to standard output when given no output flag, so running
# it is a read. Its output is the grant the wrapper was written against, and the
# only thing in this repository that can say broker_deploy's template has drifted
# from it. It exists only once the release is staged, so on a host with no release
# (check mode, first plan) it is skipped and the notice below says so.
- name: Render the grant with the pinned generator, printing it and writing nothing
  ansible.builtin.command:
    argv: "{{ [demo1_build_python] + demo1_build_python_flags + [demo1_build_provision_dir ~ '/render_slot_sudoers.py'] }}"
  register: demo1_build_generated_sudoers
  changed_when: false
  check_mode: false
  when: demo1_build_release_ready | bool

# What is compared is the body of each text, demo1_build_grant_bodies in
# vars/main.yml: the installed grant's, and the generator's when it is staged.
# A file is a header and a body, and broker_deploy's template and the generator
# word their headers differently, so the header is the one part not compared.

# Without a staged release there is nothing to compare with. A plan must still
# run to the end (ANS-10), so this is a skip with a stated reason and not a
# failure; it is also not a pass, and it says so where the approver reads the
# plan. The apply cannot reach this branch: _release.yml refuses to go on without
# the whole release, and this file runs after it, before _programs.yml installs
# anything. The Molecule converge reads this notice (a fresh host must show it, a
# configured one must not).
- name: Say the grant was NOT verified, because there is no staged release to compare with
  ansible.builtin.debug:
    msg: >-
      Sudoers grant NOT verified: the pinned render_slot_sudoers.py is not staged on this host
      (check mode, first plan), so {{ demo1_build_sudoers_path }} was not compared with it.
      Only that it is root's regular file, mode 0440, passes visudo and runs the wrapper path
      was checked. An apply compares the whole body and refuses any difference before
      anything is installed.
  register: demo1_build_grant_notice
  when: not (demo1_build_release_ready | bool)

- name: Refuse an installed grant whose body differs from what the pinned generator renders
  ansible.builtin.assert:
    that:
      - demo1_build_grant_bodies.installed == demo1_build_grant_bodies.generated
    quiet: true
    fail_msg: >-
      The installed sudoers grant is not what render_slot_sudoers.py renders. The bodies are compared
      line by line, in order, after the leading comments: the installed body has
      {{ demo1_build_grant_bodies.installed | length }} lines and the rendered one
      {{ demo1_build_grant_bodies.generated | length }}. Only in the installed file:
      {{ demo1_build_grant_bodies.installed | difference(demo1_build_grant_bodies.generated) }}.
      Only in the rendered grant: {{ demo1_build_grant_bodies.generated | difference(demo1_build_grant_bodies.installed) }}.
  when: demo1_build_release_ready | bool

- name: Refuse a role slot table that differs from the generator's
  ansible.builtin.assert:
    that:
      - >-
        demo1_build_grant_bodies.generated | select('search', demo1_build_reset_line_pattern)
        | map('regex_replace', demo1_build_reset_suffix_pattern, '') | map('split', ' ') | map('last') | list | sort
        == demo1_build_slots | sort
    quiet: true
    fail_msg: The slots in the pinned generator's grant are not the slots in demo1_build_slot_names.
  when: demo1_build_release_ready | bool

# The wrapper is installed as root at demo1_build_wrapper_path, so the grant just
# compared must be a grant for that path and no other: every rule runs exactly
# that path. This is the tie between the verified grant and the install, and it
# holds on a host with no release too, where the comparison above is skipped.
# The pinned generator names /usr/local/sbin/branchleft-slot only, so no other
# path can pass the comparison on an apply either.
- name: Refuse a grant that does not run the wrapper path the role installs to
  ansible.builtin.assert:
    that:
      - demo1_build_grant_bodies.installed | length > 0
      - demo1_build_grant_bodies.installed | select('search', demo1_build_grant_wrapper_pattern) | list | length == demo1_build_grant_bodies.installed | length
    quiet: true
    fail_msg: >-
      The installed sudoers grant does not run {{ demo1_build_wrapper_path }} in every rule. The wrapper is
      installed only at the path the grant names, so nothing is written there.
