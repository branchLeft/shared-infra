---
# Internal to the role, included from _site_candidates.yml with the renderer's text in
# demo1_build_candidate_text, before the text is staged anywhere. The demo's one
# certificate is the wildcard Caddy obtains by DNS-01; there is no interim certificate
# mode, so a text that Caddy would serve any other way is refused, whatever produced it.
#
# The role does not read the text. Caddy ignores indentation and line breaks, so any test
# of the text's lines is a test of one spelling. The Caddy image adapts the text, and the
# JSON it prints, which is what Caddy would run, is judged by files/judge_caddy_config.py
# (README, Design notes). Every task that holds the text or the JSON is hidden, and no
# message carries either: both hold the slots' hostnames.
#
# Two things the JSON cannot show are judged on the text first. Caddy adapts with the
# environment and the filesystem of the judging container, both empty, and the edge runs
# with its own: a {$NAME} is replaced by the environment's value as the text is read, and
# an import of a path brings in the files that match it, so either can add a site that the
# judging container never sees. The text may hold neither, no {env. placeholder, and no
# {file. placeholder but the one DNS token reference (a second would serve the token).
# These are the lexer's fixed syntax, not spellings, so a test of the text is sound here.
- name: Judge the candidate text for what its adapted config cannot show
  ansible.builtin.script:
    cmd: >-
      {{ demo1_build_judge_script }} --env {{ demo1_build_judge_text_env }} --what candidate
      --base {{ demo1_build_wildcard_base }} --token-file {{ demo1_build_dns_token_file }}
    executable: /usr/bin/python3 -I
  environment: '{{ {demo1_build_judge_text_env: demo1_build_candidate_text} }}'
  register: demo1_build_text_judged
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true
  diff: false

- name: Note the text verdict, a fixed line that holds no hostname
  ansible.builtin.set_fact:
    demo1_build_text_judged_ok: "{{ demo1_build_text_judged.rc == 0 and (demo1_build_text_judged.stdout | trim) == 'OK' }}"
    demo1_build_text_judged_line: "{{ demo1_build_text_judged.stdout | default('') | trim }}"
  no_log: true

- name: Empty the registered text verdict
  ansible.builtin.set_fact:
    demo1_build_text_judged: {}
  no_log: true

- name: Refuse a candidate text that reads the environment, a file or another path
  ansible.builtin.assert:
    that:
      - demo1_build_text_judged_ok | bool
    quiet: true
    fail_msg: >-
      The candidate text is refused. {{ demo1_build_text_judged_line }}
      It could add a site or serve a file when the edge runs, which the config adapted here cannot show.

- name: Have Caddy adapt the candidate, printing the config it would run and writing nothing
  ansible.builtin.command:
    argv: '{{ demo1_build_caddy_adapt_argv }}'
    stdin: '{{ demo1_build_candidate_text }}'
  register: demo1_build_adapted
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true
  diff: false

- name: Note whether Caddy adapted the candidate, without its message
  ansible.builtin.set_fact:
    demo1_build_adapted_ok: '{{ demo1_build_adapted.rc == 0 and (demo1_build_adapted.stdout | length) > 0 }}'
  no_log: true

# The judge runs as a script because the command module cannot hand it the JSON on a
# file the role would have to write; it is given the JSON in its environment. It is run
# in a check run too: it reads nothing and writes nothing.
- name: Judge the config Caddy would run
  ansible.builtin.script:
    cmd: >-
      {{ demo1_build_judge_script }} --env {{ demo1_build_judge_env }}
      --base {{ demo1_build_wildcard_base }} --token-file {{ demo1_build_dns_token_file }}
    executable: /usr/bin/python3 -I
  environment: '{{ {demo1_build_judge_env: demo1_build_adapted.stdout} }}'
  register: demo1_build_judged
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true
  diff: false
  when: demo1_build_adapted_ok | bool

- name: Note the judge's verdict, a fixed line that holds no hostname
  ansible.builtin.set_fact:
    demo1_build_judged_ok: "{{ (demo1_build_adapted_ok | bool) and demo1_build_judged.rc == 0 and (demo1_build_judged.stdout | trim) == 'OK' }}"
    demo1_build_judged_line: "{{ (demo1_build_judged.stdout | default('') | trim) if (demo1_build_adapted_ok | bool) else '' }}"
  no_log: true

- name: Empty the registered adapt and verdict, which hold the config
  ansible.builtin.set_fact:
    demo1_build_adapted: {}
    demo1_build_judged: {}
  no_log: true

- name: Refuse a candidate that Caddy could not adapt
  ansible.builtin.assert:
    that:
      - demo1_build_adapted_ok | bool
    quiet: true
    fail_msg: >-
      The Caddy image could not adapt the candidate, so it was not judged. Its message is withheld
      because it can echo a hostname. Adapt the staged renderer output with that image by hand.

- name: Refuse a candidate whose config Caddy would run anything but the one wildcard site
  ansible.builtin.assert:
    that:
      - demo1_build_judged_ok | bool
    quiet: true
    fail_msg: >-
      The config Caddy would run for the candidate is refused. {{ demo1_build_judged_line }}
      There is no interim certificate mode and no site beside the wildcard one.
