---
# The host scan. demo1 holds only the secrets its holder list names (vars/main.yml,
# demo1_build_secret_holders). The scan finds every secret-bearing file it can see under the
# scanned roots and in the holder directories, and refuses a file the list does not name. It
# names paths, never values: it reads a file's content only through grep's match, and prints
# the file's name, not the line that matched.
#
# Three kinds of find, each read-only: a file whose name is a key or an authorised-keys file,
# every file in a holder directory, and a file whose content holds a private key header or a
# KEY=value line for a secret-named variable, or a known token shape. The scan is bounded to
# the roots below, and a root the host does not have is skipped and not an error.
#
# The content grep skips every directory named .ansible: that is Ansible's own run directory
# (the root user's /root/.ansible/tmp holds the module payload of the grep itself, which
# holds the patterns). Its own payload is not a host secret, and a scan that read it would
# refuse every run on its own patterns.
#
# Read-only, so it runs in a plan too (check mode): the grep task is marked check_mode: false,
# and changed_when: false, because it changes nothing.
- name: Find which scanned roots exist on this host
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
  loop: '{{ demo1_build_secret_scan_roots }}'
  register: demo1_build_secret_roots_stat
  changed_when: false

- name: Find which holder directories exist on this host
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
  loop: '{{ demo1_build_secret_holder_dirs }}'
  register: demo1_build_secret_dirs_stat
  changed_when: false

- name: Find secret-named files under the scanned roots
  ansible.builtin.find:
    paths: '{{ demo1_build_secret_roots_stat.results | selectattr("stat.exists") | map(attribute="item") | list }}'
    recurse: true
    hidden: true
    file_type: file
    use_regex: true
    patterns: '{{ demo1_build_secret_name_patterns }}'
    follow: false
    get_checksum: false
  register: demo1_build_secret_by_name
  when: demo1_build_secret_roots_stat.results | selectattr("stat.exists") | list | length > 0
  changed_when: false

- name: Find every file in a holder directory
  ansible.builtin.find:
    paths: '{{ demo1_build_secret_dirs_stat.results | selectattr("stat.exists") | map(attribute="item") | list }}'
    recurse: true
    hidden: true
    file_type: file
    follow: false
    get_checksum: false
  register: demo1_build_secret_by_dir
  when: demo1_build_secret_dirs_stat.results | selectattr("stat.exists") | list | length > 0
  changed_when: false

- name: Name the scanned roots this host has
  ansible.builtin.set_fact:
    demo1_build_secret_existing_roots: "{{ demo1_build_secret_roots_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"

- name: Find files whose content holds a private key, a secret assignment or a token shape
  ansible.builtin.command:
    argv: "{{ ['grep', '-rIlEi', '--exclude-dir=.ansible', '-e', demo1_build_secret_content_regex] + demo1_build_secret_existing_roots }}"
  register: demo1_build_secret_by_content
  check_mode: false
  changed_when: false
  failed_when: demo1_build_secret_by_content.rc not in [0, 1]
  when: demo1_build_secret_roots_stat.results | selectattr("stat.exists") | list | length > 0

- name: Collect the paths the scan found
  ansible.builtin.set_fact:
    demo1_build_secret_found: >-
      {{ ((demo1_build_secret_by_name.files | default([]) | map(attribute='path') | list)
          + (demo1_build_secret_by_dir.files | default([]) | map(attribute='path') | list)
          + (demo1_build_secret_by_content.stdout_lines | default([]))) | unique | sort }}

- name: Collect the found paths the holder list does not name
  ansible.builtin.set_fact:
    demo1_build_secret_unlisted: '{{ demo1_build_secret_found | reject("regex", demo1_build_secret_holder_regex) | list }}'

- name: Refuse a host that holds a secret-bearing file the holder list does not name
  ansible.builtin.fail:
    msg: >-
      demo1 holds a secret-bearing file that is not on its holder list (demo1_build_secret_holders
      in vars/main.yml). Remove the file, or add a row naming it for owner review. Paths only; no
      value is read or printed: {{ demo1_build_secret_unlisted | join(', ') }}
  when: demo1_build_secret_unlisted | length > 0

- name: Say what the scan found, so an accepted host is not a silent pass
  ansible.builtin.debug:
    msg: >-
      Secret scan: {{ demo1_build_secret_found | length }} secret-bearing file(s) found, all named
      on the holder list. Holder list has {{ demo1_build_secret_holders | length }} row(s).
