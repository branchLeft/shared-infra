---
# The host scan. demo1 holds only the secrets its holder list names (vars/main.yml,
# demo1_build_secret_holders). The scan finds every secret-bearing file it can see under the
# scanned roots and in the holder directories, and refuses a file the list does not name. It names
# paths, never values: grep reports only the names of files that match, never the matching line.
#
# What it finds:
#   by name     a file (or a link) whose basename is an authorised-keys file or a private key's name
#   by place    every file in a holder directory
#   by content  a private key or PGP block, a secret-named export, a secret-named KEY=value line,
#               and the token shapes (everywhere); a spaced, indented, YAML or JSON secret key in a
#               config-named file
#   by link     a link whose target is a holder directory's file or a secret-named file
#
# The scan prunes the container runtime stores (docker, containerd) everywhere, and Ansible's own
# run directory /root/.ansible only: a user's own .ansible is scanned. /root is read as a file
# list, so that prune is exact.
#
# Read-only, so it runs in a plan too (check mode): every command task is check_mode: false, and
# changed_when: false, because none of them changes anything.
#
# The content grep is the one place a scan can read a secret. It reads a file for a match and prints
# only the file's name: ansible.builtin.command's output is the list of names, and no_log is set on
# every task that could show a value.
- name: Find which scanned roots exist on this host
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
  loop: '{{ demo1_build_secret_scan_roots }}'
  register: demo1_build_secret_roots_stat
  changed_when: false

- name: Find which holder directories exist on this host
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
  loop: '{{ demo1_build_secret_holder_dirs }}'
  register: demo1_build_secret_dirs_stat
  changed_when: false

- name: Name the scanned roots this host has
  ansible.builtin.set_fact:
    demo1_build_secret_existing_roots: "{{ demo1_build_secret_roots_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
    demo1_build_secret_grep_roots: >-
      {{ demo1_build_secret_roots_stat.results | selectattr('stat.exists') | map(attribute='item') | reject('eq', '/root') | list }}

- name: Find secret-named files under the scanned roots
  ansible.builtin.find:
    paths: '{{ demo1_build_secret_existing_roots }}'
    recurse: true
    hidden: true
    file_type: file
    use_regex: true
    patterns: '{{ demo1_build_secret_name_regex }}'
    excludes: '{{ demo1_build_secret_pruned_dirs }}'
    follow: false
    get_checksum: false
  register: demo1_build_secret_by_name
  when: demo1_build_secret_existing_roots | length > 0
  changed_when: false

- name: Find secret-named links under the scanned roots
  ansible.builtin.find:
    paths: '{{ demo1_build_secret_existing_roots }}'
    recurse: true
    hidden: true
    file_type: link
    use_regex: true
    patterns: '{{ demo1_build_secret_name_regex }}'
    excludes: '{{ demo1_build_secret_pruned_dirs }}'
    follow: false
    get_checksum: false
  register: demo1_build_secret_by_name_links
  when: demo1_build_secret_existing_roots | length > 0
  changed_when: false

- name: Find every file in a holder directory
  ansible.builtin.find:
    paths: '{{ demo1_build_secret_dirs_stat.results | selectattr("stat.exists") | map(attribute="item") | list }}'
    recurse: true
    hidden: true
    file_type: file
    follow: false
    get_checksum: false
  register: demo1_build_secret_by_dir
  when: demo1_build_secret_dirs_stat.results | selectattr("stat.exists") | list | length > 0
  changed_when: false

- name: List the files under /root, outside its own .ansible
  ansible.builtin.find:
    paths: ['/root']
    recurse: true
    hidden: true
    file_type: file
    excludes: '{{ demo1_build_secret_pruned_dirs }}'
    follow: false
    get_checksum: false
  register: demo1_build_secret_root_all
  when: '"/root" in demo1_build_secret_existing_roots'
  changed_when: false

- name: Name the files under /root the content scan reads
  ansible.builtin.set_fact:
    demo1_build_secret_root_files: >-
      {{ demo1_build_secret_root_all.files | default([]) | map(attribute='path') | reject('match', '^/root/[.]ansible/') | list }}

- name: Name the config-named files under /root the config scan reads
  ansible.builtin.set_fact:
    demo1_build_secret_root_config_files: "{{ demo1_build_secret_root_files | select('regex', demo1_build_secret_config_name_regex) | list }}"

- name: Find files whose content holds a private key, a secret export or assignment, or a token shape
  ansible.builtin.command:
    argv: >-
      {{ ['grep', '-rIlEi', '--exclude-dir=docker', '--exclude-dir=containerd']
         + ['-e', demo1_build_secret_content_strict_regex] + demo1_build_secret_grep_roots }}
  register: demo1_build_secret_content_strict_roots
  check_mode: false
  changed_when: false
  failed_when: demo1_build_secret_content_strict_roots.rc not in [0, 1]
  when: demo1_build_secret_grep_roots | length > 0
  no_log: true

- name: Find files under /root whose content holds a private key, a secret export or assignment, or a token shape
  ansible.builtin.command:
    argv: "{{ ['grep', '-IlEi', '-e', demo1_build_secret_content_strict_regex] + demo1_build_secret_root_files }}"
  register: demo1_build_secret_content_strict_root
  check_mode: false
  changed_when: false
  failed_when: demo1_build_secret_content_strict_root.rc not in [0, 1]
  when: demo1_build_secret_root_files | length > 0
  no_log: true

- name: Find config-named files whose content holds a spaced, YAML or JSON secret key
  ansible.builtin.command:
    argv: >-
      {{ ['grep', '-rIlEi', '--exclude-dir=docker', '--exclude-dir=containerd']
         + demo1_build_secret_config_includes
         + ['-e', demo1_build_secret_content_config_regex] + demo1_build_secret_grep_roots }}
  register: demo1_build_secret_content_config_roots
  check_mode: false
  changed_when: false
  failed_when: demo1_build_secret_content_config_roots.rc not in [0, 1]
  when: demo1_build_secret_grep_roots | length > 0
  no_log: true

- name: Find config-named files under /root whose content holds a spaced, YAML or JSON secret key
  ansible.builtin.command:
    argv: "{{ ['grep', '-IlEi', '-e', demo1_build_secret_content_config_regex] + demo1_build_secret_root_config_files }}"
  register: demo1_build_secret_content_config_root
  check_mode: false
  changed_when: false
  failed_when: demo1_build_secret_content_config_root.rc not in [0, 1]
  when: demo1_build_secret_root_config_files | length > 0
  no_log: true

- name: Collect the regular files the scan found, by name, by place and by content
  ansible.builtin.set_fact:
    demo1_build_secret_found_regular: >-
      {{ ((demo1_build_secret_by_name.files | default([]) | map(attribute='path') | reject('match', '^/root/[.]ansible/') | list)
          + (demo1_build_secret_by_dir.files | default([]) | map(attribute='path') | list)
          + (demo1_build_secret_content_strict_roots.stdout_lines | default([]))
          + (demo1_build_secret_content_strict_root.stdout_lines | default([]))
          + (demo1_build_secret_content_config_roots.stdout_lines | default([]))
          + (demo1_build_secret_content_config_root.stdout_lines | default([]))) | unique | sort }}

# Where each link points. readlink -m prints one line per path given and never fails on a missing
# target, so the two lists stay aligned. The links are pruned the same way the find above is.
- name: List the links under the scanned roots, pruned as the scan prunes
  ansible.builtin.command:
    argv: >-
      {{ ['find'] + demo1_build_secret_existing_roots
         + ['(', '-name', 'docker', '-o', '-name', 'containerd', '-o', '-path', demo1_build_secret_pruned_root_path, ')']
         + ['-prune', '-o', '-type', 'l', '-print'] }}
  register: demo1_build_secret_link_paths
  check_mode: false
  changed_when: false
  failed_when: demo1_build_secret_link_paths.rc not in [0, 1]
  when: demo1_build_secret_existing_roots | length > 0
  no_log: true

- name: Read where each link under the scanned roots points
  ansible.builtin.command:
    argv: "{{ ['readlink', '-m', '--'] + demo1_build_secret_link_paths.stdout_lines }}"
  register: demo1_build_secret_link_targets
  check_mode: false
  changed_when: false
  failed_when: demo1_build_secret_link_targets.rc != 0
  when: demo1_build_secret_link_paths.stdout_lines | default([]) | length > 0
  no_log: true

- name: Collect the links whose target is a secret the scan can see
  ansible.builtin.set_fact:
    demo1_build_secret_link_refused: '{{ demo1_build_secret_link_refused | default([]) + [item.0] }}'
  loop: '{{ demo1_build_secret_link_paths.stdout_lines | default([]) | zip(demo1_build_secret_link_targets.stdout_lines | default([])) | list }}'
  loop_control:
    label: '{{ item.0 }}'
  when: item.1 in demo1_build_secret_found_regular or item.1 is regex(demo1_build_secret_link_dir_regex) or item.1 is regex(demo1_build_secret_link_name_regex)
  no_log: true

- name: Collect every path the scan found
  ansible.builtin.set_fact:
    demo1_build_secret_found: >-
      {{ (demo1_build_secret_found_regular
          + (demo1_build_secret_link_refused | default([]))
          + (demo1_build_secret_by_name_links.files | default([]) | map(attribute='path') | reject('match', '^/root/[.]ansible/') | list)) | unique | sort }}

- name: Collect the found paths the holder list does not name
  ansible.builtin.set_fact:
    demo1_build_secret_unlisted: '{{ demo1_build_secret_found | reject("regex", demo1_build_secret_holder_regex) | list }}'

- name: Refuse a host that holds a secret-bearing file the holder list does not name
  ansible.builtin.fail:
    msg: >-
      demo1 holds a secret-bearing file that is not on its holder list (demo1_build_secret_holders
      in vars/main.yml). Remove the file, or add a row naming it for owner review. Paths only; no
      value is read or printed: {{ demo1_build_secret_unlisted | join(', ') }}
  when: demo1_build_secret_unlisted | length > 0

- name: Say what the scan found, so an accepted host is not a silent pass
  ansible.builtin.debug:
    msg: >-
      Secret scan: {{ demo1_build_secret_found | length }} secret-bearing file(s) found, all named
      on the holder list. Holder list has {{ demo1_build_secret_holders | length }} row(s).
