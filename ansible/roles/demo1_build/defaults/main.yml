---
# Nothing here is private. The role has no secret input and no required input:
# every value below has a default, and the pinned programs are public.

# The one home of the demo host's programs is branchLeft/ghost-platform, at
# demo-host/provision/. This role carries a copy of each program under
# files/ghost-platform, at the same paths, and the host takes them from the signed
# commit CI pushes to it; the host never fetches them from anywhere. Each file is
# held to the sha256 below, on the machine that runs the role, before the role
# writes anything to the host. The commit below names the ghost-platform commit
# the copies were taken from: it is the name of the release directory and the
# record of where the bytes came from. A bump moves the new files into
# files/ghost-platform and changes this commit and every checksum in one change
# (README, "Vendored files"): a copy that does not match its pin stops the role
# before it writes. The commit must be at or after the ghost-platform commit that
# moved the drain flags to /var/lib/branchleft-broker/drain-flags
# (0a23634b652a37260d77e656ded3c37ff24d62ec); the role also refuses an installed
# sidecar that does not name that directory.
demo1_build_source_sha: 5e52f78427cab104438057164e4baa16b329875c

# Every program the role carries, one path and one sha256 each, relative to the
# repository root. This is the import closure of the programs the role runs
# (render_*, the wrapper's constants) plus the two programs systemd runs and the
# owner's go-live step. provision_socket_dirs.py and drain_flag_dir.py are not
# here: the role declares what they create with modules instead (README).
demo1_build_release_files:
  - path: demo-host/provision/branchleft_slot.py
    sha256: 2e2279f0067d91296e1b309f6cbe71a3d276d7ccdbbd58aa4f99f81ce85ba80b
  - path: demo-host/provision/demo_go_live.py
    sha256: 21da8cc0b1e8fb69cd3f116187fee42cf1fbea8fd3c1466c5fb25ebc3a38bed5
  - path: demo-host/provision/demo_sidecar.py
    sha256: f3d0373bd80d4ef7f58b60d3c555825b39283f272eb71d26dcb91610cfa7ae66
  - path: demo-host/provision/demo_uid_claims.py
    sha256: 2d2536eb516ed5fab1e743cd1fa974ac6339c9334b529db7d94c47cc19152230
  - path: demo-host/provision/health_router.py
    sha256: 5eac21b7ab44ad0b1a308f0ac8b7da0d1d2db9dfb2cd1e4dcd034d5223036a15
  - path: demo-host/provision/render_colour_units.py
    sha256: 64e33649290e3501f291e31921c7ff94e4b4de511b06bea7bf9b7c11335d2a81
  - path: demo-host/provision/render_demo_edge.py
    sha256: 7391e93adda924e863f33610490581da050e73153882cc471945d5b38a848ad8
  - path: demo-host/provision/render_demo_site.py
    sha256: a34c5dec7d174fed868fc5fc73b2ef61773cf5dc4aa708fd57295486e9460cba
  - path: demo-host/provision/render_router_unit.py
    sha256: 3a0f71cc61e45e416f983ef86c02f1b419565a6c34511d1a60f35092454dab3a
  - path: demo-host/provision/render_slot_sudoers.py
    sha256: 80bd64fccb1f56260a7dc1824e783548a80a14a691942060cfff1aba9a058319

# The demo slots, as the broker_deploy role names them. When the host's
# variables set broker_deploy_slot_names, this follows it, so the slot table has
# one home in this repository; the role then compares it with the table inside
# the pinned generator (README). Each is a bare digit string.
demo1_build_slot_names: "{{ broker_deploy_slot_names | default(['0', '1', '2', '3', '4', '5', '6']) }}"

# The slot wrapper's install path, which the sudoers grant names. Follows
# broker_deploy_wrapper_path when the host's variables set it.
demo1_build_wrapper_path: "{{ broker_deploy_wrapper_path | default('/usr/local/sbin/branchleft-slot') }}"
