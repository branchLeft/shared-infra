---
argument_specs:
  main:
    short_description: Install the break-glass grant tool, its wrapper and the expire timer on an app host
    description: >-
      Refuses a host with no working /usr/bin/docker (the binary the expire unit
      runs) or no Docker socket, pulls the Node image the role pins (a constant,
      not an input) by digest only when the host lacks it and reads it back,
      fetches the grant tool, the wrapper and the two units from one pinned commit
      and holds each to its sha256, and then turns the expire timer on. It never
      runs the tool, opens or closes a grant, or sets a run-time secret. The unit
      runs with --pull never, so the image is checked before the timer is enabled.
      The one input is not a secret.
    author: branchLeft
    options:
      breakglass_grant_host_source_commit:
        type: str
        default: 5e52f78427cab104438057164e4baa16b329875c
        description: >-
          The full 40-character commit of the ghost-platform repository the files
          are fetched at. Each download is held to the sha256 in the role, so a
          commit whose bytes differ stops the run. Must equal the commit in
          breakglass_mint_host_source_commit; the role's test compares the two.
