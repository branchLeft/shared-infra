---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    ansible_runtime_verify_lock: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../../../requirements.txt') }}"
    # The expected name is computed here by the expression the role used before the install
    # moved into a program (the file lookup, then the SHA-256 of the text), not by the program.
    # The link below must name this environment, so a program that fingerprinted another way
    # would fail here instead of building a second environment on a live host.
    ansible_runtime_verify_fingerprint: "{{ ansible_runtime_verify_lock | ansible.builtin.hash('sha256') | truncate(16, True, '') }}"
    ansible_runtime_verify_core: "{{ ansible_runtime_verify_lock | ansible.builtin.regex_search('ansible-core==([0-9.]+)', '\\1') | first }}"
    ansible_runtime_verify_role_directory: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  tasks:
    - name: Look at the directory that holds the environments
      ansible.builtin.stat:
        path: /opt/ansible-runtime
      register: ansible_runtime_verify_root

    - name: Assert the directory is root-owned and not writable by others
      ansible.builtin.assert:
        that:
          - ansible_runtime_verify_root.stat.isdir
          - ansible_runtime_verify_root.stat.pw_name == 'root'
          - ansible_runtime_verify_root.stat.mode == '0755'
        success_msg: The environments directory is root-owned with mode 0755.

    - name: Look at the ansible-playbook link
      ansible.builtin.stat:
        path: /usr/local/bin/ansible-playbook
      register: ansible_runtime_verify_link

    - name: Assert the link points into the environment built from this lock
      ansible.builtin.assert:
        that:
          - ansible_runtime_verify_link.stat.islnk
          - ansible_runtime_verify_link.stat.lnk_source == '/opt/ansible-runtime/venv-' ~ ansible_runtime_verify_fingerprint ~ '/bin/ansible-playbook'
        success_msg: The link names the environment of this lock.

    - name: Look at the install program and the marker
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - /opt/ansible-runtime/install_runtime.py
        - /opt/ansible-runtime/venv-{{ ansible_runtime_verify_fingerprint }}/.installed-from-lock
      register: ansible_runtime_verify_files

    - name: Read the marker
      ansible.builtin.slurp:
        src: /opt/ansible-runtime/venv-{{ ansible_runtime_verify_fingerprint }}/.installed-from-lock
      register: ansible_runtime_verify_marker

    - name: Assert the program is root-owned and not writable by others, and the marker names this lock
      ansible.builtin.assert:
        that:
          - ansible_runtime_verify_files.results[0].stat.pw_name == 'root'
          - ansible_runtime_verify_files.results[0].stat.mode == '0755'
          - ansible_runtime_verify_files.results[1].stat.exists
          - (ansible_runtime_verify_marker.content | ansible.builtin.b64decode) == ansible_runtime_verify_fingerprint ~ '\n'
        success_msg: The program is root-owned with mode 0755 and the marker holds the fingerprint of this lock.

    - name: Run ansible-playbook through the link
      ansible.builtin.command:
        argv:
          - /usr/local/bin/ansible-playbook
          - --version
      register: ansible_runtime_verify_version
      changed_when: false

    - name: Assert it is the pinned ansible-core
      ansible.builtin.assert:
        that:
          - "('core ' ~ ansible_runtime_verify_core) in ansible_runtime_verify_version.stdout"
        success_msg: The installed ansible-core is the pinned one.

    - name: Check that the installed packages agree with one another
      ansible.builtin.command:
        argv:
          - /opt/ansible-runtime/venv-{{ ansible_runtime_verify_fingerprint }}/bin/pip
          - check
      register: ansible_runtime_verify_pip_check
      changed_when: false

    - name: Assert pip check is clean
      ansible.builtin.assert:
        that:
          - ansible_runtime_verify_pip_check.rc == 0
        success_msg: The environment has no broken requirement.

    - name: Find anything under the directory that is not root-owned or that others can write
      ansible.builtin.command:
        argv:
          - find
          - /opt/ansible-runtime
          - '!'
          - -type
          - l
          - '('
          - '!'
          - -user
          - root
          - -o
          - -perm
          - /022
          - ')'
      register: ansible_runtime_verify_loose
      changed_when: false

    - name: Assert nothing there lets another account change what runs as root
      ansible.builtin.assert:
        that:
          - ansible_runtime_verify_loose.stdout == ''
        success_msg: Every file under the environments directory is root-owned and not writable by others.
        fail_msg: 'Loose files: {{ ansible_runtime_verify_loose.stdout }}'

    - name: Refuse a lock with a wrong hash, and a lock with no hash
      ansible.builtin.include_tasks: tasks/refuse.yml
      vars:
        ansible_runtime_verify_case: '{{ item }}'
      loop:
        - name: wrong-hash
          file: fixture_wrong_hash.txt
          text: DO NOT MATCH THE HASHES
        - name: no-hash
          file: fixture_no_hash.txt
          text: not a pinned requirement with SHA-256 hashes

    - name: Put the lock back after an earlier one was applied, and after a lock that was never in service
      ansible.builtin.include_tasks: tasks/rollback.yml

    # ------------------------------------------- the unit tests, on Debian
    - name: Make a directory for the unit tests
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /var/tmp/art-unit
        - /var/tmp/art-unit/files
        - /var/tmp/art-unit/tests
        - /var/tmp/art-unit/tests/unit

    - name: Copy the program and its unit tests into the container
      ansible.builtin.copy:
        src: '{{ item.src }}'
        dest: '{{ item.dest }}'
        owner: root
        group: root
        mode: '0644'
      loop:
        - src: '{{ ansible_runtime_verify_role_directory }}/files/install_runtime.py'
          dest: /var/tmp/art-unit/files/install_runtime.py
        - src: '{{ ansible_runtime_verify_role_directory }}/tests/unit/test_install_runtime.py'
          dest: /var/tmp/art-unit/tests/unit/test_install_runtime.py
      loop_control:
        label: '{{ item.dest }}'

    - name: Run the unit tests on the Python of the production release
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -m
          - unittest
          - discover
          - -b
          - -s
          - tests/unit
          - -p
          - test_*.py
        chdir: /var/tmp/art-unit
      environment:
        PYTHONPATH: files:tests/unit
        PYTHONDONTWRITEBYTECODE: '1'
      register: ansible_runtime_verify_unit
      changed_when: false
      failed_when: false

    - name: The unit tests pass on the production Debian release
      ansible.builtin.assert:
        that:
          - ansible_runtime_verify_unit.rc == 0
          - "'OK' in ansible_runtime_verify_unit.stderr"
        fail_msg: 'unit tests failed: {{ ansible_runtime_verify_unit.stderr }}'
        success_msg: the unit tests pass
