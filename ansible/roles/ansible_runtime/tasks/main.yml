---
- name: Install the packages that make a virtual environment
  ansible.builtin.apt:
    name: '{{ ansible_runtime_packages }}'
    state: present
    update_cache: true
    cache_valid_time: 3600

# Root-owned and not writable by others: whoever can write under this directory
# runs code as root on every apply. The mode is the point of the task.
- name: Create the directory that holds the environments
  ansible.builtin.file:
    path: '{{ ansible_runtime_root }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

# The lock is public and reviewed in the pull request that changes it, so its
# diff is left off: it is a thousand lines that the job log would otherwise carry.
- name: Place the hash-locked requirements file on the host
  ansible.builtin.copy:
    src: '{{ ansible_runtime_requirements_src }}'
    dest: '{{ ansible_runtime_lock_copy }}'
    owner: root
    group: root
    mode: '0644'
  diff: false

# The install steps live in one program, which a new host's first-boot document
# runs too (ansible_runtime README, "One program, two callers"). It is a file of
# this role, copied from the role's own files/, so the role never reads it from
# anywhere else.
- name: Place the install program on the host
  ansible.builtin.copy:
    src: install_runtime.py
    dest: '{{ ansible_runtime_program }}'
    owner: root
    group: root
    mode: '0755'

# The program is given the SHA-256 of the lock as it is on the machine that runs
# the role, and refuses a copy on the host that differs. Reading is not a change,
# so this task runs in check mode too.
- name: Hash the lock where the role runs
  ansible.builtin.stat:
    path: '{{ ansible_runtime_requirements_src }}'
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: ansible_runtime_source

# A command task is skipped by check mode on its own, with the creates form
# reporting a change when the marker is missing. That is the stated reason for the
# skip here (ANS-10). The program makes the environment, installs the lock into it
# with hash checking required (pip refuses a file whose hash the lock does not list,
# and a package the lock does not name: the supply-chain control of the role), and
# writes the marker last. It is given no link: the link task below moves it, on every
# apply, so that a lock put back to an earlier one points the link at that one's
# environment too.
- name: Build the environment for this lock and install the locked packages into it
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - '{{ ansible_runtime_program }}'
      - --lock
      - '{{ ansible_runtime_lock_copy }}'
      - --lock-sha256
      - "{{ ansible_runtime_source.stat.checksum | default('') }}"
      - --root
      - '{{ ansible_runtime_root }}'
      - --expect-fingerprint
      - '{{ ansible_runtime_lock_fingerprint }}'
    creates: '{{ ansible_runtime_done_marker }}'

# The link moves to the environment of this lock only after the install finished,
# so a failed install leaves the previous environment in service. It runs on every
# apply and does not depend on the marker, so a link left on another lock's
# environment, or deleted, is put right.
- name: Point the ansible-playbook link at this environment
  ansible.builtin.file:
    src: '{{ ansible_runtime_venv }}/bin/ansible-playbook'
    dest: '{{ ansible_runtime_link }}'
    state: link
    force: true
    owner: root
    group: root
