---
# Every input is a secret or a URL carrying one. Each must be a non-empty single
# line before anything is written. The assert names the key only, never the
# value, and no_log hides the task. A blank value, or one that is only
# whitespace, would make the renderer fail at ExecStartPre, and a value with a
# newline would write a second line.
- name: Check that each secret input is a non-empty single line
  ansible.builtin.assert:
    that:
      - item.value | string | trim | length > 0
      - item.value | string is not search('[\r\n]')
    quiet: true
    fail_msg: '{{ item.key }} must be a non-empty single line.'
  loop: '{{ monitoring_stack_env_keys }}'
  loop_control:
    label: '{{ item.key }}'
  no_log: true

# The renderer is delivered by ntfy_pager, not this role, and the unit's
# ExecStartPre runs it. This role does not refuse a missing renderer here: a
# fresh host has none until ntfy_pager runs, and the role must still converge
# its files and secrets. The check runs in the restart handler instead, and only
# when that handler would restart an active unit (see the README, "Restart").
#
# The directory and the file are created here, because no other role does it.
# The file is touched with its owner, group and mode in the same task, so it
# never exists in a wider mode. The times are preserved, so a second run changes
# nothing.
- name: Create the directory of the monitoring secrets file
  ansible.builtin.file:
    path: '{{ monitoring_stack_env_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Look at the monitoring secrets file
  ansible.builtin.stat:
    path: '{{ monitoring_stack_env_file }}'
  register: monitoring_stack_env_stat

- name: Create the monitoring secrets file closed to root before any value is written
  ansible.builtin.file:
    path: '{{ monitoring_stack_env_file }}'
    state: touch
    owner: root
    group: root
    mode: '0600'
    access_time: preserve
    modification_time: preserve

# One lineinfile per key, the regexp matching the key at the start of a line, so
# a second run finds the line and changes nothing, and other keys are left in
# place. The line is built from the key and a secret value: no_log hides it, and
# diff is off so no value is shown under --diff.
#
# In check mode the file is not created, so these tasks run only when it already
# exists. Then lineinfile reports what a real run would change, which is what
# the plan job and the nightly drift check need to see a pending or drifted
# secret. On a fresh host in check mode they are skipped, because there is no
# file for lineinfile to edit.
- name: Write the stack keys into the monitoring secrets file
  ansible.builtin.lineinfile:
    path: '{{ monitoring_stack_env_file }}'
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    create: false
  loop: '{{ monitoring_stack_env_keys | selectattr("restarts_stack") | list }}'
  loop_control:
    label: '{{ item.key }}'
  no_log: true
  diff: false
  when: not ansible_check_mode or monitoring_stack_env_stat.stat.exists
  notify: Restart the monitoring stack unit when active

- name: Write the SNDS collector key into the monitoring secrets file
  ansible.builtin.lineinfile:
    path: '{{ monitoring_stack_env_file }}'
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    create: false
  loop: '{{ monitoring_stack_env_keys | rejectattr("restarts_stack") | list }}'
  loop_control:
    label: '{{ item.key }}'
  no_log: true
  diff: false
  when: not ansible_check_mode or monitoring_stack_env_stat.stat.exists

# The stack's files go into the project directory, as before.
- name: Create the project directory
  ansible.builtin.file:
    path: '{{ monitoring_stack_project_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the directories of the stack
  ansible.builtin.file:
    path: '{{ monitoring_stack_project_dir }}/{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: '{{ monitoring_stack_dirs }}'

# Copied, not templated: the Compose file holds ${...} and $$ that Compose reads
# and the .tmpl files hold the placeholders a later step fills, so none of them
# may pass through Jinja. The source is the stack directory in the repository,
# reached through the link files/stack, so there is one copy of every file.
- name: Deliver the stack's files
  ansible.builtin.copy:
    src: 'stack/{{ item }}'
    dest: '{{ monitoring_stack_project_dir }}/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ monitoring_stack_files }}'
  notify: Restart the monitoring stack unit when active

- name: Create the drop-in directory of the monitoring instance
  ansible.builtin.file:
    path: '{{ monitoring_stack_dropin_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the drop-in of the monitoring instance
  ansible.builtin.copy:
    src: monitoring.override.conf
    dest: '{{ monitoring_stack_dropin_dir }}/override.conf'
    owner: root
    group: root
    mode: '0644'
  register: monitoring_stack_dropin_copy

# The edge drop-in is installed here because no edge role exists yet (see the
# README). Its unit is restarted by runbook step 6, not by this role.
- name: Create the drop-in directory of the edge instance
  ansible.builtin.file:
    path: '{{ monitoring_stack_edge_dropin_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the drop-in of the edge instance
  ansible.builtin.copy:
    src: edge.override.conf
    dest: '{{ monitoring_stack_edge_dropin_dir }}/override.conf'
    owner: root
    group: root
    mode: '0644'
  register: monitoring_stack_edge_dropin_copy

# Systemd is reloaded here, in the task list and not in a handler, so the role
# returns with systemd holding the drop-ins it just installed. The converge asks
# systemd for the loaded value straight after the role.
- name: Make systemd read the drop-ins the role installed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: monitoring_stack_dropin_copy.changed or monitoring_stack_edge_dropin_copy.changed

# The restart handler runs here, at the end of this role, and not at the end of
# the play. A play that fails after this role's writes would otherwise leave a
# changed secret in the file with the unit still running its old value, and a
# rerun would see no change and never restart (the crash window). Flushing here
# narrows that window to the end of this role. The handler reads the drop-ins'
# reload first, so the restart uses the drop-ins this role installed.
- name: Run the restart now, so the role returns with the stack restarted when it changed
  ansible.builtin.meta: flush_handlers
