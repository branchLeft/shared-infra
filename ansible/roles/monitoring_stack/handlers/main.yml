---
# Restarts the monitoring stack unit when it is already active. A first bring-up
# is runbook step 7a, so a host where the unit is not running is not started
# here. The tasks listen on a topic of their own, not ntfy_pager's handler name
# "Restart the monitoring stack unit": Ansible runs every handler that listens on
# a notified topic, so a shared topic would run both roles' restarts.
#
# The renderer check lives here, and not in the tasks, because a restart is the
# only thing that runs the renderer (the unit's ExecStartPre). It refuses a
# restart of an active unit with a renderer that is missing or writable by
# others, and it does nothing when no restart would happen.
- name: Read the monitoring stack unit before a restart
  ansible.builtin.systemd_service:
    name: '{{ monitoring_stack_unit }}'
  register: monitoring_stack_unit_status
  listen: Restart the monitoring stack unit when active

- name: Look at the renderer before a restart
  ansible.builtin.stat:
    path: '{{ monitoring_stack_renderer }}'
  register: monitoring_stack_renderer_stat
  listen: Restart the monitoring stack unit when active

- name: Refuse to restart an active stack with a renderer that is missing or writable by others
  ansible.builtin.assert:
    that:
      - monitoring_stack_renderer_stat.stat.exists
      - monitoring_stack_renderer_stat.stat.isreg
      - monitoring_stack_renderer_stat.stat.pw_name == 'root'
      - monitoring_stack_renderer_stat.stat.gr_name == 'root'
      - monitoring_stack_renderer_stat.stat.mode[-2] not in ['2', '3', '6', '7']
      - monitoring_stack_renderer_stat.stat.mode[-1] not in ['2', '3', '6', '7']
    quiet: true
    fail_msg: >-
      {{ monitoring_stack_renderer }} must be a root-owned regular file with no
      group or other write bit. It is delivered by the ntfy_pager role, which
      must run before this one on a host where the stack is already running (see
      the README, "Order").
  when: monitoring_stack_unit_status.status.ActiveState == 'active'
  listen: Restart the monitoring stack unit when active

- name: Restart the monitoring stack unit when it is active
  ansible.builtin.systemd_service:
    name: '{{ monitoring_stack_unit }}'
    state: restarted
  when: monitoring_stack_unit_status.status.ActiveState == 'active'
  listen: Restart the monitoring stack unit when active
