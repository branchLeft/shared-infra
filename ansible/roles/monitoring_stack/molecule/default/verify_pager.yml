---
# The pager scenario's cases (molecule/pager/verify.yml imports this file; the default scenario's
# verify.yml holds the other cases and explains the split). The real ntfy_pager role is run here, by
# its path, against the converged host. Each case leaves the host able to run the next.
- name: Exercise the restart decision for a key another role owns and for the renderer
  hosts: all
  gather_facts: false
  vars_files:
    - '{{ playbook_dir }}/../default/vars/restart_decision.yml'
  tasks:
    # ----- A key another role owns is in the fingerprint -----
    # ntfy_pager writes the NTFY_ lines, and this role must restart for them on its
    # next run. The real ntfy_pager role is run here, by its path, so the seam is
    # the role's own tasks and not a line the test writes. The first values come
    # with the real renderer, which is a change of its own and restarts once; they
    # are applied and settled first, so the rotation after them changes one line
    # and nothing else, and a restart for it can only come from the NTFY_ lines.

    # The converged host this scenario starts from, which the first assertion below measures
    # against. The default scenario's cases leave a different host, so the baseline is taken here.
    - name: Snapshot the converged host before ntfy_pager writes its values
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: baseline

    - name: Apply ntfy_pager with its four values, which writes the four NTFY_ lines and the real renderer
      ansible.builtin.include_role:
        name: '{{ monitoring_stack_verify_ntfy_role }}'
      vars:
        ntfy_pager_pager_token: '{{ monitoring_stack_verify_ntfy_pager_1 }}'
        ntfy_pager_watcher_token: '{{ monitoring_stack_verify_ntfy_watcher }}'
        ntfy_pager_owner_password_hash: '{{ monitoring_stack_verify_ntfy_owner }}'
        ntfy_pager_machine_password_hash: '{{ monitoring_stack_verify_ntfy_machine }}'

    - name: Apply the role after ntfy_pager wrote its first values
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_a }}'
        monitoring_stack_snds_data_url: '{{ monitoring_stack_verify_rot_snds }}'

    - name: Snapshot after ntfy_pager's first values were applied
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: ntfy_first

    - name: Assert ntfy_pager's first values restarted the unit once
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.ntfy_first.calls == monitoring_stack_verify_snaps.baseline.calls + 1
          - monitoring_stack_verify_snaps.ntfy_first.stamp != monitoring_stack_verify_snaps.baseline.stamp
        quiet: true
        fail_msg: The values and renderer that ntfy_pager wrote did not restart the unit exactly once on the next run of this role.

    # One writer per file, on the host: the four NTFY_ lines are in the pager's
    # file, a root-only regular file, and in no line of monitoring.env. Both files
    # are read under no_log and the assertions name no value.
    - name: Read the pager's secrets file and the monitoring secrets file
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ monitoring_stack_verify_ntfy_env_file }}'
        - '{{ monitoring_stack_verify_env_file }}'
      register: monitoring_stack_verify_two_files
      no_log: true

    - name: Look at the pager's secrets file
      ansible.builtin.stat:
        path: '{{ monitoring_stack_verify_ntfy_env_file }}'
      register: monitoring_stack_verify_ntfy_stat

    - name: Assert the NTFY_ lines are in the pager's file alone, which is root-only
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_ntfy_stat.stat.isreg
          - monitoring_stack_verify_ntfy_stat.stat.pw_name == 'root'
          - monitoring_stack_verify_ntfy_stat.stat.gr_name == 'root'
          - monitoring_stack_verify_ntfy_stat.stat.mode == '0600'
          - ('NTFY_PAGER_TOKEN=' ~ monitoring_stack_verify_ntfy_pager_1) in monitoring_stack_verify_pager_lines
          - ('NTFY_WATCHER_TOKEN=' ~ monitoring_stack_verify_ntfy_watcher) in monitoring_stack_verify_pager_lines
          - ('NTFY_OWNER_PASSWORD_HASH=' ~ monitoring_stack_verify_ntfy_owner) in monitoring_stack_verify_pager_lines
          - ('NTFY_MACHINE_PASSWORD_HASH=' ~ monitoring_stack_verify_ntfy_machine) in monitoring_stack_verify_pager_lines
          - monitoring_stack_verify_monitoring_lines | select('match', 'NTFY_') | list | length == 0
        quiet: true
        fail_msg: >-
          The four NTFY_ lines are not all in {{ monitoring_stack_verify_ntfy_env_file }} (root:root, 0600), or one of them is in
          {{ monitoring_stack_verify_env_file }}, which is monitoring_stack's alone.
      vars:
        monitoring_stack_verify_pager_lines: '{{ (monitoring_stack_verify_two_files.results[0].content | b64decode).splitlines() }}'
        monitoring_stack_verify_monitoring_lines: '{{ (monitoring_stack_verify_two_files.results[1].content | b64decode).splitlines() }}'
      no_log: true

    - name: Forget the content of both files
      ansible.builtin.set_fact:
        monitoring_stack_verify_two_files: {}
      no_log: true

    - name: Apply ntfy_pager with the pager token rotated and nothing else changed
      ansible.builtin.include_role:
        name: '{{ monitoring_stack_verify_ntfy_role }}'
      vars:
        ntfy_pager_pager_token: '{{ monitoring_stack_verify_ntfy_pager_2 }}'
        ntfy_pager_watcher_token: '{{ monitoring_stack_verify_ntfy_watcher }}'
        ntfy_pager_owner_password_hash: '{{ monitoring_stack_verify_ntfy_owner }}'
        ntfy_pager_machine_password_hash: '{{ monitoring_stack_verify_ntfy_machine }}'

    - name: Apply the role after ntfy_pager rotated one line
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_a }}'
        monitoring_stack_snds_data_url: '{{ monitoring_stack_verify_rot_snds }}'

    - name: Snapshot after the NTFY_ line was rotated
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: ntfy_after

    - name: Apply the role again after the NTFY_ rotation
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_a }}'
        monitoring_stack_snds_data_url: '{{ monitoring_stack_verify_rot_snds }}'

    - name: Snapshot after the rerun of the NTFY_ rotation
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: ntfy_rerun

    - name: Assert the NTFY_ rotation restarted the unit on this role's next run, once
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.ntfy_after.calls == monitoring_stack_verify_snaps.ntfy_first.calls + 1
          - monitoring_stack_verify_snaps.ntfy_after.stamp != monitoring_stack_verify_snaps.ntfy_first.stamp
          - monitoring_stack_verify_snaps.ntfy_rerun.calls == monitoring_stack_verify_snaps.ntfy_after.calls
        quiet: true
        fail_msg: A rotated NTFY_ line did not restart the unit exactly once on the next run of this role.

    # ----- The renderer is in the fingerprint -----
    - name: Change the renderer the way a new ntfy_pager release would
      ansible.builtin.copy:
        content: "# test stand-in: a changed renderer\n"
        dest: '{{ monitoring_stack_verify_renderer_path }}'
        owner: root
        group: root
        mode: '0644'

    - name: Apply the role after the renderer changed
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_a }}'
        monitoring_stack_snds_data_url: '{{ monitoring_stack_verify_rot_snds }}'

    - name: Snapshot after the renderer changed
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: renderer_after

    - name: Assert a changed renderer restarted the unit once
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.renderer_after.calls == monitoring_stack_verify_snaps.ntfy_rerun.calls + 1
          - monitoring_stack_verify_snaps.renderer_after.stamp != monitoring_stack_verify_snaps.ntfy_rerun.stamp
        quiet: true
        fail_msg: A changed renderer did not restart the unit exactly once.

    # ----- Put the inputs back -----
    # With the scenario's own inputs the keys are rotated back, so the host is the converged host
    # the stale-lines play that follows expects.
    - name: Apply the role with the scenario's own inputs, at the end of this scenario's cases
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack

    - name: Snapshot with the inputs put back
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: restored_pager

    - name: Assert the unit is active and enabled with the inputs put back
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.restored_pager.active == 'active'
          - monitoring_stack_verify_snaps.restored_pager.enabled == 'enabled'
        quiet: true
        fail_msg: The host was not put back to the converged state with the scenario's own inputs.

# The pager secrets split: stale NTFY_ lines in monitoring.env and the pager gauge.
# The host here has ntfy-pager.env from the plays above (written by the real
# ntfy_pager role) and monitoring.env without NTFY_ lines. Throwaway values only.
- name: Verify the stale NTFY_ lines are cleared and the pager gauge follows the pager file
  hosts: all
  gather_facts: false
  vars:
    monitoring_stack_verify_env_file: /etc/branchleft/monitoring.env
    monitoring_stack_verify_ntfy_env_file: /etc/branchleft/ntfy-pager.env
    verify_gauge_file: /var/lib/branchleft/snds-exporter/pager.prom
    verify_gauge_name: branchleft_pager_route_configured
    verify_stale_one: test-sentinel-stale-ntfy-0024
    verify_stale_two: test-sentinel-stale-ntfy-0025
    monitoring_stack_verify_ntfy_role: '{{ playbook_dir }}/../../../ntfy_pager'
    verify_ntfy_pager: test-sentinel-ntfy-pager-0018
    monitoring_stack_verify_ntfy_watcher: test-sentinel-ntfy-watcher-0019
    monitoring_stack_verify_ntfy_owner: test-sentinel-ntfy-owner-0020
    monitoring_stack_verify_ntfy_machine: test-sentinel-ntfy-machine-0021
    verify_env_keys:
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - HEALTHCHECKS_PING_URL
      - ALERT_RECIPIENT_EMAIL
      - MAILHOST_PING_URL
      - GRAFANA_ADMIN_PASSWORD
      - SNDS_DATA_URL
  tasks:
    # ----- Stale lines are removed while the pager's file holds all four keys -----
    - name: Put the hand-written NTFY_ lines back into the monitoring secrets file, as an old host has them
      ansible.builtin.lineinfile:
        path: '{{ monitoring_stack_verify_env_file }}'
        line: '{{ item }}'
        create: false
      loop:
        - NTFY_PAGER_TOKEN={{ verify_stale_one }}
        - NTFY_OWNER_PASSWORD_HASH={{ verify_stale_two }}
      loop_control:
        label: seed
      no_log: true
      diff: false

    - name: Snapshot before the stale lines are cleared
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: stale_before

    - name: Apply the role while the pager's file holds all four keys
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack

    - name: Snapshot after the stale lines were cleared
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: stale_after

    - name: Apply the role again
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack

    - name: Snapshot after the rerun
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: stale_rerun

    - name: Read the monitoring secrets file and the pager's secrets file
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ monitoring_stack_verify_env_file }}'
        - '{{ monitoring_stack_verify_ntfy_env_file }}'
      register: monitoring_stack_verify_split_files
      no_log: true

    - name: Look at the monitoring secrets file
      ansible.builtin.stat:
        path: '{{ monitoring_stack_verify_env_file }}'
      register: monitoring_stack_verify_split_stat

    # Counted, never shown. Clearing the lines puts monitoring.env back to the bytes
    # the stamp was written for, so no restart is due here; the rerun changes nothing.
    # On a host whose stamp was written with the lines present, the same removal moves
    # the fingerprint and restarts once, which is the ordinary fingerprint rule.
    - name: Assert the stale lines are gone, the file is still root-only, and the pager's file is as it was
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_split_env | select('match', 'NTFY_') | list | length == 0
          - monitoring_stack_verify_split_env | select('search', verify_stale_one) | list | length == 0
          - monitoring_stack_verify_split_env | select('search', verify_stale_two) | list | length == 0
          - monitoring_stack_verify_split_pager | select('match', 'NTFY_') | list | length == 4
          - ('NTFY_PAGER_TOKEN=' ~ verify_ntfy_pager) in monitoring_stack_verify_split_pager
          - monitoring_stack_verify_split_stat.stat.mode == '0600'
          - monitoring_stack_verify_split_stat.stat.pw_name == 'root'
          - monitoring_stack_verify_snaps.stale_after.calls == monitoring_stack_verify_snaps.stale_before.calls
          - monitoring_stack_verify_snaps.stale_rerun.calls == monitoring_stack_verify_snaps.stale_after.calls
        quiet: true
        fail_msg: >-
          The stale NTFY_ lines are still in {{ monitoring_stack_verify_env_file }}, or the file is no longer root-only, or the pager's
          file changed, or a run restarted the unit that had no reason to.
      vars:
        monitoring_stack_verify_split_env: '{{ (monitoring_stack_verify_split_files.results[0].content | b64decode).splitlines() }}'
        monitoring_stack_verify_split_pager: '{{ (monitoring_stack_verify_split_files.results[1].content | b64decode).splitlines() }}'
      no_log: true

    - name: Assert each key the role writes is still in the monitoring secrets file exactly once
      ansible.builtin.assert:
        that:
          - (monitoring_stack_verify_split_env | select('match', item ~ '=') | list | length) == 1
        quiet: true
        fail_msg: '{{ item }} is missing from {{ monitoring_stack_verify_env_file }}, or is there more than once.'
      loop: '{{ verify_env_keys }}'
      loop_control:
        label: '{{ item }}'
      vars:
        monitoring_stack_verify_split_env: '{{ (monitoring_stack_verify_split_files.results[0].content | b64decode).splitlines() }}'
      no_log: true

    - name: Read the pager gauge
      ansible.builtin.slurp:
        src: '{{ verify_gauge_file }}'
      register: monitoring_stack_verify_gauge_on

    - name: Look at the pager gauge file
      ansible.builtin.stat:
        path: '{{ verify_gauge_file }}'
      register: monitoring_stack_verify_gauge_stat

    - name: Assert the gauge reads 1, is a readable root file, and holds no pager value
      ansible.builtin.assert:
        that:
          - (verify_gauge_name ~ ' 1') in (monitoring_stack_verify_gauge_on.content | b64decode).splitlines()
          - ('# TYPE ' ~ verify_gauge_name ~ ' gauge') in (monitoring_stack_verify_gauge_on.content | b64decode).splitlines()
          - monitoring_stack_verify_gauge_stat.stat.mode == '0644'
          - monitoring_stack_verify_gauge_stat.stat.pw_name == 'root'
          - "'test-sentinel' not in (monitoring_stack_verify_gauge_on.content | b64decode)"
        quiet: true
        fail_msg: The pager gauge does not read 1 with a configured pager, or is not a root-owned 0644 file, or holds a sentinel.

    # ----- A pager file that is gone: the lines are kept and the gauge reads 0 -----
    - name: Take the pager's secrets file away, as a host whose pager was never placed
      ansible.builtin.file:
        path: '{{ monitoring_stack_verify_ntfy_env_file }}'
        state: absent

    - name: Put a hand-written NTFY_ line into the monitoring secrets file
      ansible.builtin.lineinfile:
        path: '{{ monitoring_stack_verify_env_file }}'
        line: NTFY_PAGER_TOKEN={{ verify_stale_one }}
        create: false
      no_log: true
      diff: false

    - name: Apply the role with no pager file
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack

    - name: Read the monitoring secrets file and the pager gauge
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ monitoring_stack_verify_env_file }}'
        - '{{ verify_gauge_file }}'
      register: monitoring_stack_verify_off_files
      no_log: true

    - name: Assert the hand-written line is kept and the gauge reads 0
      ansible.builtin.assert:
        that:
          - ('NTFY_PAGER_TOKEN=' ~ verify_stale_one) in (monitoring_stack_verify_off_files.results[0].content | b64decode).splitlines()
          - (verify_gauge_name ~ ' 0') in (monitoring_stack_verify_off_files.results[1].content | b64decode).splitlines()
          - (verify_gauge_name ~ ' 1') not in (monitoring_stack_verify_off_files.results[1].content | b64decode).splitlines()
        quiet: true
        fail_msg: >-
          With no pager file the role removed the hand-written line the host pages with, or the gauge did not read 0.
      no_log: true

    # ----- A pager file that lacks a key reads as disabled too -----
    - name: Apply ntfy_pager, which places its four lines again
      ansible.builtin.include_role:
        name: '{{ monitoring_stack_verify_ntfy_role }}'
      vars:
        ntfy_pager_pager_token: '{{ verify_ntfy_pager }}'
        ntfy_pager_watcher_token: '{{ monitoring_stack_verify_ntfy_watcher }}'
        ntfy_pager_owner_password_hash: '{{ monitoring_stack_verify_ntfy_owner }}'
        ntfy_pager_machine_password_hash: '{{ monitoring_stack_verify_ntfy_machine }}'

    - name: Take one key out of the pager's secrets file
      ansible.builtin.lineinfile:
        path: '{{ monitoring_stack_verify_ntfy_env_file }}'
        regexp: '^NTFY_WATCHER_TOKEN='
        state: absent
      no_log: true
      diff: false

    - name: Apply the role with a pager file that lacks a key
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack

    - name: Read the monitoring secrets file and the pager gauge again
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ monitoring_stack_verify_env_file }}'
        - '{{ verify_gauge_file }}'
      register: monitoring_stack_verify_short_files
      no_log: true

    - name: Assert a pager file that lacks a key keeps the hand-written line and reads 0
      ansible.builtin.assert:
        that:
          - ('NTFY_PAGER_TOKEN=' ~ verify_stale_one) in (monitoring_stack_verify_short_files.results[0].content | b64decode).splitlines()
          - (verify_gauge_name ~ ' 0') in (monitoring_stack_verify_short_files.results[1].content | b64decode).splitlines()
        quiet: true
        fail_msg: A pager file with a key missing was treated as configured.
      no_log: true

    # ----- Put the pager back: the line goes and the gauge reads 1 -----
    - name: Apply ntfy_pager, which restores the missing line
      ansible.builtin.include_role:
        name: '{{ monitoring_stack_verify_ntfy_role }}'
      vars:
        ntfy_pager_pager_token: '{{ verify_ntfy_pager }}'
        ntfy_pager_watcher_token: '{{ monitoring_stack_verify_ntfy_watcher }}'
        ntfy_pager_owner_password_hash: '{{ monitoring_stack_verify_ntfy_owner }}'
        ntfy_pager_machine_password_hash: '{{ monitoring_stack_verify_ntfy_machine }}'

    - name: Apply the role with the pager's file whole again
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack

    - name: Read the monitoring secrets file and the pager gauge once more
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - '{{ monitoring_stack_verify_env_file }}'
        - '{{ verify_gauge_file }}'
      register: monitoring_stack_verify_back_files
      no_log: true

    - name: Assert the hand-written line is gone and the gauge reads 1 again
      ansible.builtin.assert:
        that:
          - (monitoring_stack_verify_back_files.results[0].content | b64decode).splitlines() | select('match', 'NTFY_') | list | length == 0
          - (verify_gauge_name ~ ' 1') in (monitoring_stack_verify_back_files.results[1].content | b64decode).splitlines()
        quiet: true
        fail_msg: With the pager's file whole again the hand-written line stayed, or the gauge did not read 1.
      no_log: true

    - name: Forget the content of the files
      ansible.builtin.set_fact:
        monitoring_stack_verify_split_files: {}
        monitoring_stack_verify_off_files: {}
        monitoring_stack_verify_short_files: {}
        monitoring_stack_verify_back_files: {}
      no_log: true

- name: Scan the log as every scenario does
  ansible.builtin.import_playbook: verify_log_scan.yml
