---
# The restarts scenario's cases (molecule/restarts/verify.yml imports this file; the default
# scenario's verify.yml holds the other cases and explains the split). The last case puts the
# inputs back, so the host is converged when the run ends.
- name: Exercise the restart decision for a new drop-in, a unit that is stopped, a failing restart and a plan
  hosts: all
  gather_facts: false
  vars_files:
    - '{{ playbook_dir }}/../default/vars/restart_decision.yml'
  tasks:
    # ----- The role from the repository runs first -----
    # Ansible keeps the path it first finds a module at for the rest of the run. The case below
    # applies a copy of the role in a scratch directory and removes it, so if the copy were the
    # first place the role's own modules were found, every later apply would look for them in a
    # directory that is gone. The converged host is the host this applies to, so nothing changes.
    - name: Apply the role from the repository, to the host as the converge left it
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack

    # ----- The monitoring drop-in is in the fingerprint: a new release of its ExecStart restarts the unit -----
    # A release of the repository that changes the drop-in is made on the
    # controller: a copy of this role, links followed, in a scratch directory, with
    # a drop-in that differs from the repository's in its limit and in one argument
    # of its ExecStart. The host is then in the state a release leaves it in: the
    # stamp holds the previous release and the unit runs from it. Applying the copy
    # must install the new drop-in, make systemd read it, and restart the unit under
    # it, once: the stand-in docker is the ExecStart, and it logs the argument, so a
    # restart that ran under the earlier drop-in does not show it. Nothing else
    # changes, so only the drop-in can make a restart due. This is the case that the
    # static assertion on the fingerprint's list cannot make: that the file the list
    # names is the file the unit runs from. Applying this role again puts the
    # repository's drop-in back and restarts once more, which is also the state the
    # cases below expect. The repository is not written: the copy is checked not to
    # be a link before it is changed.
    - name: Make a scratch directory on the controller
      ansible.builtin.tempfile:
        state: directory
        prefix: monitoring_stack_next_release_
      register: monitoring_stack_verify_scratch
      delegate_to: localhost

    - name: Copy this role into it, with its links followed
      ansible.builtin.command:
        argv:
          - cp
          - -RL
          - '{{ playbook_dir }}/../..'
          - '{{ monitoring_stack_verify_scratch.path }}/monitoring_stack'
      changed_when: true
      delegate_to: localhost

    - name: Look at the copy's drop-in without following a link
      ansible.builtin.stat:
        path: '{{ monitoring_stack_verify_scratch.path }}/monitoring_stack/files/monitoring.override.conf'
        follow: false
      register: monitoring_stack_verify_copy_dropin
      delegate_to: localhost

    - name: Assert the copy's drop-in is a file of its own and not a link into the repository
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_copy_dropin.stat.exists
          - monitoring_stack_verify_copy_dropin.stat.isreg
          - not monitoring_stack_verify_copy_dropin.stat.islnk
        quiet: true
        fail_msg: The copy of the role still links its drop-in into the repository, so writing it would change the repository.

    - name: Write the next release of the drop-in into the copy
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.file', monitoring_stack_verify_dropin_repo)
          | ansible.builtin.regex_replace('MemoryMax=2048M', 'MemoryMax=3072M')
          | ansible.builtin.regex_replace('--force-recreate\n', '--force-recreate --test-next-release\n') }}
        dest: '{{ monitoring_stack_verify_scratch.path }}/monitoring_stack/files/monitoring.override.conf'
        mode: '0644'
      delegate_to: localhost

    - name: Snapshot before the next release of the monitoring drop-in
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: dropin_before

    - name: Name the copy of the role by its path
      ansible.builtin.set_fact:
        monitoring_stack_verify_next_role: '{{ monitoring_stack_verify_scratch.path ~ "/monitoring_stack" }}'

    - name: Apply the copy of the role that carries the next release
      ansible.builtin.include_role:
        name: '{{ monitoring_stack_verify_next_role }}'
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_a }}'
        monitoring_stack_snds_data_url: '{{ monitoring_stack_verify_rot_snds }}'

    - name: Snapshot after the next release of the monitoring drop-in
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: dropin_after

    - name: Ask systemd for the monitoring instance after the next release
      ansible.builtin.systemd_service:
        name: '{{ monitoring_stack_verify_unit }}'
      register: monitoring_stack_verify_dropin_unit

    - name: Read the log of the docker stand-in's calls after the next release
      ansible.builtin.slurp:
        src: /var/log/docker-standin.calls
      register: monitoring_stack_verify_dropin_calls

    - name: Assert the next release of the drop-in was read by systemd and restarted the unit once under it
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_dropin_unit.status.MemoryMax == '3221225472'
          - monitoring_stack_verify_snaps.dropin_after.calls == monitoring_stack_verify_snaps.dropin_before.calls + 1
          - monitoring_stack_verify_snaps.dropin_after.stamp != monitoring_stack_verify_snaps.dropin_before.stamp
          - monitoring_stack_verify_snaps.dropin_after.active == 'active'
          - "'--test-next-release' in (monitoring_stack_verify_dropin_calls.content | b64decode).splitlines()[-1]"
        quiet: true
        fail_msg: >-
          A new release of the monitoring drop-in did not restart the unit exactly once under it, or systemd did not
          read it, or the stamp did not move (monitoring MemoryMax
          {{ monitoring_stack_verify_dropin_unit.status.MemoryMax }}, calls
          {{ monitoring_stack_verify_snaps.dropin_before.calls }} before and {{ monitoring_stack_verify_snaps.dropin_after.calls }} after).

    - name: Apply this role, which puts the repository's drop-in back
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_a }}'
        monitoring_stack_snds_data_url: '{{ monitoring_stack_verify_rot_snds }}'

    - name: Snapshot with the repository's drop-in back
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: dropin_restored

    - name: Ask systemd for the monitoring instance with the repository's drop-in back
      ansible.builtin.systemd_service:
        name: '{{ monitoring_stack_verify_unit }}'
      register: monitoring_stack_verify_dropin_back

    - name: Assert the repository's drop-in is loaded again and the unit was restarted once under it
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_dropin_back.status.MemoryMax == '2147483648'
          - monitoring_stack_verify_snaps.dropin_restored.calls == monitoring_stack_verify_snaps.dropin_after.calls + 1
          - monitoring_stack_verify_snaps.dropin_restored.active == 'active'
        quiet: true
        fail_msg: Putting the repository's drop-in back did not restart the unit exactly once under it.

    - name: Remove the scratch directory
      ansible.builtin.file:
        path: '{{ monitoring_stack_verify_scratch.path }}'
        state: absent
      delegate_to: localhost

    # ----- An enabled unit that is inactive is started when a restart is due -----
    - name: Stop the monitoring unit, which stays enabled
      ansible.builtin.systemd_service:
        name: '{{ monitoring_stack_verify_unit }}'
        state: stopped

    - name: Snapshot with the unit stopped
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: inactive_before

    - name: Apply the role with SMTP_PASSWORD rotated, the unit being inactive
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_b }}'

    - name: Snapshot after the inactive unit was handled
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: inactive_after

    - name: Assert the inactive but enabled unit was started once
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.inactive_before.active == 'inactive'
          - monitoring_stack_verify_snaps.inactive_before.enabled == 'enabled'
          - monitoring_stack_verify_snaps.inactive_after.calls == monitoring_stack_verify_snaps.inactive_before.calls + 1
          - monitoring_stack_verify_snaps.inactive_after.active == 'active'
        quiet: true
        fail_msg: An enabled unit that was inactive was not started when a restart was due.

    # ----- A unit that is not enabled is left alone, and nothing is stamped -----
    - name: Stop and disable the monitoring unit, as on a host awaiting runbook step 7a
      ansible.builtin.systemd_service:
        name: '{{ monitoring_stack_verify_unit }}'
        state: stopped
        enabled: false

    - name: Snapshot with the unit disabled
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: disabled_before

    - name: Apply the role with SMTP_PASSWORD rotated, the unit being disabled
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_c }}'

    - name: Snapshot after the disabled unit was handled
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: disabled_after

    - name: Assert the unit that is not enabled was not started and nothing was stamped
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.disabled_before.enabled != 'enabled'
          - monitoring_stack_verify_snaps.disabled_after.enabled != 'enabled'
          - monitoring_stack_verify_snaps.disabled_after.active == 'inactive'
          - monitoring_stack_verify_snaps.disabled_after.calls == monitoring_stack_verify_snaps.disabled_before.calls
          - monitoring_stack_verify_snaps.disabled_after.stamp == monitoring_stack_verify_snaps.disabled_before.stamp
        quiet: true
        fail_msg: A unit that is not enabled was started or stamped by the role, or the test could not disable it.

    - name: Enable and start the monitoring unit again, as the owner does at runbook step 7a
      ansible.builtin.systemd_service:
        name: '{{ monitoring_stack_verify_unit }}'
        state: started
        enabled: true

    - name: Apply the role once the unit is enabled and running
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_c }}'

    - name: Snapshot once the unit is enabled and running again
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: reenabled_after

    - name: Assert the first run on the enabled unit restarted it and stamped
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.reenabled_after.stamp != monitoring_stack_verify_snaps.disabled_after.stamp
          - monitoring_stack_verify_snaps.reenabled_after.active == 'active'
          - monitoring_stack_verify_snaps.reenabled_after.enabled == 'enabled'
        quiet: true
        fail_msg: The first run of the role on a unit that is enabled did not stamp the fingerprint.

    # ----- A restart that fails, then the repair -----
    # The stand-in fails while the flag exists, so the restart fails and the unit
    # is left failed. The key is the same on the rerun: only the stamp, which the
    # failed run did not write, can tell the role that a restart is still due.
    - name: Make the docker stand-in fail
      ansible.builtin.file:
        path: '{{ monitoring_stack_verify_fail_flag }}'
        state: touch
        mode: '0644'

    - name: Snapshot before the restart that fails
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: failed_before

    - name: Apply the role with SMTP_PASSWORD rotated, the restart failing
      block:
        - name: Apply the role with a rotated key while the stand-in fails
          ansible.builtin.include_role:
            name: branchleft.monitoring_stack
          vars:
            monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_d }}'
        - name: Note that the role did not fail
          ansible.builtin.set_fact:
            monitoring_stack_verify_failed_run: false
      rescue:
        - name: Note that the role failed
          ansible.builtin.set_fact:
            monitoring_stack_verify_failed_run: true

    - name: Snapshot after the restart that failed
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: failed_after

    - name: Assert the role failed, the unit is failed, and the stamp was not moved
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_failed_run
          - monitoring_stack_verify_snaps.failed_after.calls == monitoring_stack_verify_snaps.failed_before.calls + 1
          - monitoring_stack_verify_snaps.failed_after.active == 'failed'
          - monitoring_stack_verify_snaps.failed_after.stamp == monitoring_stack_verify_snaps.failed_before.stamp
        quiet: true
        fail_msg: >-
          The restart that fails did not fail the role, or did not leave the unit failed, or moved the stamp
          (unit {{ monitoring_stack_verify_snaps.failed_after.active }}).

    - name: Make the docker stand-in work again
      ansible.builtin.file:
        path: '{{ monitoring_stack_verify_fail_flag }}'
        state: absent

    - name: Apply the role again with the same rotated key
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_d }}'

    - name: Snapshot after the repair
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: repaired_after

    - name: Assert the rerun restarted the failed unit and stamped
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.repaired_after.calls == monitoring_stack_verify_snaps.failed_after.calls + 1
          - monitoring_stack_verify_snaps.repaired_after.active == 'active'
          - monitoring_stack_verify_snaps.repaired_after.stamp != monitoring_stack_verify_snaps.failed_before.stamp
        quiet: true
        fail_msg: The rerun after a failed restart did not restart the failed unit and stamp the fingerprint.

    # ----- A bad change that fails, then a revert to the stamped inputs -----
    # The stamp holds the inputs of the last good restart (monitoring_stack_verify_rot_d, just
    # stamped). A bad change (monitoring_stack_verify_rot_h) is applied and its restart fails, so
    # the unit is failed and the stamp stays. The change is then reverted: the
    # inputs, and so the fingerprint, are exactly what the stamp holds. The
    # fingerprint cannot say the unit is down; only the unit's own state can. The
    # stand-in works again before the revert, so what is under test is the
    # decision and not a repair of the environment.
    - name: Make the docker stand-in fail again
      ansible.builtin.file:
        path: '{{ monitoring_stack_verify_fail_flag }}'
        state: touch
        mode: '0644'

    - name: Snapshot before the bad change
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: revert_before

    - name: Apply the role with a bad change, the restart failing
      block:
        - name: Apply the role with a changed key while the stand-in fails
          ansible.builtin.include_role:
            name: branchleft.monitoring_stack
          vars:
            monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_h }}'
        - name: Note that the role did not fail
          ansible.builtin.set_fact:
            monitoring_stack_verify_failed_run: false
      rescue:
        - name: Note that the role failed
          ansible.builtin.set_fact:
            monitoring_stack_verify_failed_run: true

    - name: Snapshot after the bad change failed
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: revert_bad

    - name: Assert the bad change failed, left the unit failed, and left the stamp at the last good restart
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_failed_run
          - monitoring_stack_verify_snaps.revert_bad.calls == monitoring_stack_verify_snaps.revert_before.calls + 1
          - monitoring_stack_verify_snaps.revert_bad.active == 'failed'
          - monitoring_stack_verify_snaps.revert_bad.stamp == monitoring_stack_verify_snaps.revert_before.stamp
        quiet: true
        fail_msg: >-
          The bad change did not fail the role, or did not leave the unit failed, or moved the stamp
          (unit {{ monitoring_stack_verify_snaps.revert_bad.active }}).

    - name: Make the docker stand-in work again
      ansible.builtin.file:
        path: '{{ monitoring_stack_verify_fail_flag }}'
        state: absent

    - name: Revert to the inputs the stamp holds
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_d }}'

    - name: Snapshot after the revert
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: revert_after

    - name: Assert the revert restarted the failed unit, once, and left the stamp as it was
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.revert_after.calls == monitoring_stack_verify_snaps.revert_bad.calls + 1
          - monitoring_stack_verify_snaps.revert_after.active == 'active'
          - monitoring_stack_verify_snaps.revert_after.stamp == monitoring_stack_verify_snaps.revert_before.stamp
        quiet: true
        fail_msg: >-
          A revert to the stamped inputs did not restart the failed unit
          (unit {{ monitoring_stack_verify_snaps.revert_after.active }}), or moved the stamp.

    - name: Apply the role again with the same inputs
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_d }}'

    - name: Snapshot after the rerun of the revert
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: revert_rerun

    - name: Assert the unit, now active, is not restarted again
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.revert_rerun.calls == monitoring_stack_verify_snaps.revert_after.calls
          - monitoring_stack_verify_snaps.revert_rerun.active == 'active'
        quiet: true
        fail_msg: A unit that is active with the stamped inputs was restarted again.

    # ----- A restart that succeeds and leaves the unit not active is not stamped -----
    # Without RemainAfterExit a oneshot unit is inactive as soon as its command has
    # exited, so the restart returns 0 and the read-back sees the unit not active.
    - name: Put a unit template on the host whose instances do not stay active
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=PLACEHOLDER Compose stack %i
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          [Install]
          WantedBy=multi-user.target
        dest: '{{ monitoring_stack_verify_template_path }}'
        owner: root
        group: root
        mode: '0644'

    - name: Make systemd read the template
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Snapshot before the restart that leaves the unit not active
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: readback_before

    - name: Apply the role with a rotated key, the unit not staying active
      block:
        - name: Apply the role with a rotated key while the unit does not stay active
          ansible.builtin.include_role:
            name: branchleft.monitoring_stack
          vars:
            monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_e }}'
        - name: Note that the role did not fail on the read-back
          ansible.builtin.set_fact:
            monitoring_stack_verify_failed_run: false
      rescue:
        - name: Note that the role failed on the read-back
          ansible.builtin.set_fact:
            monitoring_stack_verify_failed_run: true

    - name: Snapshot after the restart that left the unit not active
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: readback_after

    - name: Assert the role failed on the read-back and did not stamp
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_failed_run
          - monitoring_stack_verify_snaps.readback_after.calls == monitoring_stack_verify_snaps.readback_before.calls + 1
          - monitoring_stack_verify_snaps.readback_after.active != 'active'
          - monitoring_stack_verify_snaps.readback_after.stamp == monitoring_stack_verify_snaps.readback_before.stamp
        quiet: true
        fail_msg: >-
          The restart that left the unit not active did not fail the role, or moved the stamp
          (unit {{ monitoring_stack_verify_snaps.readback_after.active }}).

    - name: Put the unit template back
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=PLACEHOLDER Compose stack %i
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true
          [Install]
          WantedBy=multi-user.target
        dest: '{{ monitoring_stack_verify_template_path }}'
        owner: root
        group: root
        mode: '0644'

    - name: Make systemd read the template again
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Apply the role again with the same key, the unit staying active
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_e }}'

    - name: Snapshot after the read-back passed
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: readback_repaired

    - name: Assert the rerun restarted the unit, which stayed active, and stamped
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.readback_repaired.calls == monitoring_stack_verify_snaps.readback_after.calls + 1
          - monitoring_stack_verify_snaps.readback_repaired.active == 'active'
          - monitoring_stack_verify_snaps.readback_repaired.stamp != monitoring_stack_verify_snaps.readback_before.stamp
        quiet: true
        fail_msg: The rerun after a read-back that failed did not restart the unit and stamp the fingerprint.

    # ----- The value check refuses an empty value, spaces and a second line, before anything is written -----
    # Each value is given to the role in turn, and the secrets file must still
    # hold the value the last good run wrote (monitoring_stack_verify_rot_e).
    - name: Give the role each value that the check must refuse
      ansible.builtin.include_tasks: tasks/refuse_value.yml
      loop:
        - name: an empty value
          value: ''
        - name: only spaces
          value: '   '
        - name: a second line
          value: "{{ monitoring_stack_verify_rot_g }}\nNTFY_PAGER_TOKEN=test-sentinel-newline-0017"
      loop_control:
        loop_var: monitoring_stack_verify_try
        label: '{{ monitoring_stack_verify_try.name }}'

    # ----- The renderer check comes before the restart -----
    # Three ways the renderer is unsafe or missing, each with a restart due. The
    # role must refuse each before restarting, leave the unit running and stamp
    # nothing. The renderer is put back after each.
    - name: Give the role each renderer that the check must refuse
      ansible.builtin.include_tasks: tasks/refuse_renderer.yml
      loop:
        - name: missing
          state: absent
          mode: '0644'
          owner: root
        - name: writable by its group
          state: file
          mode: '0664'
          owner: root
        - name: owned by another user
          state: file
          mode: '0644'
          owner: nobody
      loop_control:
        loop_var: monitoring_stack_verify_renderer
        label: '{{ monitoring_stack_verify_renderer.name }}'

    # ----- A plan or drift run sees a pending restart, and changes nothing -----
    - name: Put a stale stamp on the host, as a half-applied run leaves one
      ansible.builtin.copy:
        content: "stale-stamp\n"
        dest: /var/lib/branchleft/monitoring.applied
        owner: root
        group: root
        mode: '0600'

    - name: Snapshot before the check-mode run
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: check_before

    - name: Apply the role in check mode with SMTP_PASSWORD changed
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
        apply:
          check_mode: true
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_g }}'

    - name: Snapshot after the check-mode run
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: check_after

    - name: Read the monitoring secrets file after the check-mode run
      ansible.builtin.slurp:
        src: /etc/branchleft/monitoring.env
      register: monitoring_stack_verify_check_env
      no_log: true

    - name: Assert check mode found the restart due, restarted nothing, and wrote nothing
      ansible.builtin.assert:
        that:
          - monitoring_stack_restart_due | bool
          - monitoring_stack_verify_snaps.check_after.calls == monitoring_stack_verify_snaps.check_before.calls
          - monitoring_stack_verify_snaps.check_after.stamp == 'stale-stamp'
          - ('SMTP_PASSWORD=' ~ monitoring_stack_verify_rot_f) in (monitoring_stack_verify_check_env.content | b64decode).splitlines()
          - ('SMTP_PASSWORD=' ~ monitoring_stack_verify_rot_g) not in (monitoring_stack_verify_check_env.content | b64decode).splitlines()
        quiet: true
        fail_msg: >-
          A check-mode run did not find the restart due on a stale stamp, or restarted the unit, or rewrote the stamp
          or the secrets file.
      no_log: true

    - name: Apply the role for real, which restarts once and replaces the stale stamp
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_rot_g }}'

    - name: Snapshot after the real run
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: check_real

    - name: Assert the real run restarted once and replaced the stale stamp
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.check_real.calls == monitoring_stack_verify_snaps.check_after.calls + 1
          - monitoring_stack_verify_snaps.check_real.stamp is match('^[0-9a-f]{64}$')
        quiet: true
        fail_msg: The real run after a stale stamp did not restart the unit once and replace the stamp.

    # ----- Put the inputs back -----
    # With the scenario's own inputs the key is rotated back, so the unit restarts
    # once more, and the host is the converged host the check-mode step expects.
    - name: Apply the role with the scenario's own inputs
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack

    - name: Snapshot with the inputs put back
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        monitoring_stack_verify_snap_name: restored

    - name: Assert the unit is active and enabled, and was restarted once to put the key back
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_snaps.restored.calls == monitoring_stack_verify_snaps.check_real.calls + 1
          - monitoring_stack_verify_snaps.restored.active == 'active'
          - monitoring_stack_verify_snaps.restored.enabled == 'enabled'
        quiet: true
        fail_msg: The host was not put back to the converged state with the scenario's own inputs.

- name: Scan the log as every scenario does
  ansible.builtin.import_playbook: verify_log_scan.yml
