---
# What must be on the host is derived from the repository, not from the role:
# every file under the stack directory except the few named in
# verify_not_carried. So a file dropped from the role's list is missing on the
# host and fails this play, a file added to the stack directory must be carried
# or named, and there is no second list to keep in step. The sources are read
# straight from the repository (not through the role's link), so a copy of a
# file in the role that differs from its source is a failure too.
- name: Verify the instance
  hosts: all
  gather_facts: false
  vars:
    verify_repo: '{{ playbook_dir }}/../../../../..'
    verify_stack_source: '{{ verify_repo }}/hetzner/monitoring/stack'
    verify_dropin_source: '{{ verify_repo }}/hetzner/monitoring/systemd/monitoring.override.conf'
    verify_dir: /opt/branchleft/monitoring
    verify_dropin_dir: /etc/systemd/system/branchleft-compose@monitoring.service.d
    # The one list written by hand: files of the stack directory the role leaves
    # out on purpose. Rendering and the program that renders (the second part of
    # the monitoring work) and the SNDS collector (the exporters role).
    verify_not_carried:
      - render_alertmanager_config.md
      - render_alertmanager_config.py
      - snds/collect_snds_metrics.py
  tasks:
    # The role's defaults hold no secret input (README, "Secrets"). A default for
    # one would let a run with no caller value write a fixed value, so the test
    # reads the defaults file and refuses any key that names one of the seven
    # inputs. The inputs are required with no default in meta/argument_specs.yml.
    - name: Read the role's defaults from the repository
      ansible.builtin.set_fact:
        monitoring_stack_verify_defaults: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../defaults/main.yml') | from_yaml }}

    - name: Work out which default names a secret input
      ansible.builtin.set_fact:
        monitoring_stack_verify_secret_defaults: >-
          {{ monitoring_stack_verify_defaults | ansible.builtin.list
          | select('match', 'monitoring_stack_(smtp_|healthchecks_|alert_recipient_|mailhost_|grafana_admin_|snds_)')
          | ansible.builtin.list }}

    - name: Assert the defaults hold no value for a secret input
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_secret_defaults | length == 0
        quiet: true
        fail_msg: The defaults of monitoring_stack name a secret input. Remove the default; the caller supplies it.

    - name: List every file in the stack directory of the repository
      ansible.builtin.find:
        paths: '{{ verify_stack_source }}'
        recurse: true
        file_type: file
        hidden: true
        excludes: ['*.pyc']
      register: monitoring_stack_verify_all
      delegate_to: localhost

    - name: Work out the files that must be on the instance
      ansible.builtin.set_fact:
        monitoring_stack_verify_found: >-
          {{ monitoring_stack_verify_all.files | ansible.builtin.map(attribute='path')
          | ansible.builtin.map('ansible.builtin.relpath', verify_stack_source) | ansible.builtin.list }}

    - name: Work out the directories that must be on the instance
      ansible.builtin.set_fact:
        monitoring_stack_verify_files: '{{ monitoring_stack_verify_found | ansible.builtin.difference(verify_not_carried) | ansible.builtin.sort }}'
        monitoring_stack_verify_dirs: |-
          {%- set ns = namespace(dirs=['']) -%}
          {%- for file in monitoring_stack_verify_found | ansible.builtin.difference(verify_not_carried) -%}
          {%- set parts = file.split('/')[:-1] -%}
          {%- for n in range(1, parts | length + 1) -%}
          {%- set _ = ns.dirs.append(parts[:n] | join('/')) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ ns.dirs | unique | sort | list }}

    - name: Assert every file named as not carried is in the stack directory, and something is carried
      ansible.builtin.assert:
        that:
          - verify_not_carried | ansible.builtin.difference(monitoring_stack_verify_found) | ansible.builtin.length == 0
          - monitoring_stack_verify_files | ansible.builtin.length > 0
        quiet: true
        fail_msg: >-
          A file named as not carried is not in the stack directory any more, or the directory is empty.
          Not found: {{ verify_not_carried | ansible.builtin.difference(monitoring_stack_verify_found) }}.

    - name: Read the project directory and the stack's directories
      ansible.builtin.stat:
        path: '{{ verify_dir }}/{{ item }}'
      loop: '{{ monitoring_stack_verify_dirs }}'
      register: monitoring_stack_verify_dir_stats
      loop_control:
        label: '{{ verify_dir }}/{{ item }}'

    - name: Assert every directory exists, owned by root, mode 0755
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - item.stat.mode == '0755'
        quiet: true
        fail_msg: '{{ verify_dir }}/{{ item.item }} is missing, or is not a root-owned directory with mode 0755.'
      loop: '{{ monitoring_stack_verify_dir_stats.results }}'
      loop_control:
        label: '{{ verify_dir }}/{{ item.item }}'

    - name: Read each delivered file on the instance
      ansible.builtin.stat:
        path: '{{ verify_dir }}/{{ item }}'
        checksum_algorithm: sha256
      loop: '{{ monitoring_stack_verify_files }}'
      register: monitoring_stack_verify_installed
      loop_control:
        label: '{{ item }}'

    - name: Read each file's source in the repository, on the machine that runs the test
      ansible.builtin.stat:
        path: '{{ verify_stack_source }}/{{ item }}'
        checksum_algorithm: sha256
      loop: '{{ monitoring_stack_verify_files }}'
      register: monitoring_stack_verify_sources
      loop_control:
        label: '{{ item }}'
      delegate_to: localhost

    - name: Assert every file is on the instance, owned by root, mode 0644, byte for byte its source
      ansible.builtin.assert:
        that:
          - item.0.stat.exists
          - item.1.stat.exists
          - item.0.stat.isreg
          - item.0.stat.pw_name == 'root'
          - item.0.stat.gr_name == 'root'
          - item.0.stat.mode == '0644'
          - item.0.stat.checksum == item.1.stat.checksum
        quiet: true
        fail_msg: >-
          {{ item.0.item }} is missing on the instance, is not a regular file owned by root with
          mode 0644, or differs from {{ verify_stack_source }}/{{ item.0.item }}.
      loop: '{{ monitoring_stack_verify_installed.results | ansible.builtin.zip(monitoring_stack_verify_sources.results) | ansible.builtin.list }}'
      loop_control:
        label: '{{ item.0.item }}'

    - name: Read the drop-in directory and the drop-in on the instance
      ansible.builtin.stat:
        path: '{{ item }}'
        checksum_algorithm: sha256
      loop:
        - '{{ verify_dropin_dir }}'
        - '{{ verify_dropin_dir }}/override.conf'
      register: monitoring_stack_verify_dropin

    - name: Read the drop-in's source in the repository, on the machine that runs the test
      ansible.builtin.stat:
        path: '{{ verify_dropin_source }}'
        checksum_algorithm: sha256
      register: monitoring_stack_verify_dropin_src
      delegate_to: localhost

    - name: Assert the drop-in is installed where the unit template looks for it, byte for byte its source
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_dropin.results[0].stat.exists
          - monitoring_stack_verify_dropin.results[0].stat.isdir
          - monitoring_stack_verify_dropin.results[0].stat.pw_name == 'root'
          - monitoring_stack_verify_dropin.results[0].stat.gr_name == 'root'
          - monitoring_stack_verify_dropin.results[0].stat.mode == '0755'
          - monitoring_stack_verify_dropin.results[1].stat.exists
          - monitoring_stack_verify_dropin.results[1].stat.isreg
          - monitoring_stack_verify_dropin.results[1].stat.pw_name == 'root'
          - monitoring_stack_verify_dropin.results[1].stat.gr_name == 'root'
          - monitoring_stack_verify_dropin.results[1].stat.mode == '0644'
          - monitoring_stack_verify_dropin_src.stat.exists
          - monitoring_stack_verify_dropin.results[1].stat.checksum == monitoring_stack_verify_dropin_src.stat.checksum
        quiet: true
        fail_msg: >-
          The drop-in is not at {{ verify_dropin_dir }}/override.conf as a root-owned file with mode 0644
          in a directory with mode 0755, or differs from {{ verify_dropin_source }}.

    - name: Ask systemd for the instance
      ansible.builtin.systemd_service:
        name: branchleft-compose@monitoring.service
      register: monitoring_stack_verify_unit

    - name: Assert systemd has the drop-in loaded
      ansible.builtin.assert:
        that:
          - verify_dropin_dir ~ '/override.conf' in monitoring_stack_verify_unit.status.DropInPaths
          - monitoring_stack_verify_unit.status.MemoryMax == '2147483648'
          - monitoring_stack_verify_unit.status.CPUWeight == '200'
        quiet: true
        fail_msg: >-
          systemd does not hold the monitoring drop-in: drop-in paths {{ monitoring_stack_verify_unit.status.DropInPaths }},
          MemoryMax {{ monitoring_stack_verify_unit.status.MemoryMax }}, CPUWeight {{ monitoring_stack_verify_unit.status.CPUWeight }}.

    # The Compose file pins every image by tag and digest, and the unit pulls
    # exactly what the file names. The installed file is byte for byte the
    # source (above), so the source is parsed here.
    - name: Assert every image in the Compose file is pinned by digest
      ansible.builtin.assert:
        that:
          - verify_services | ansible.builtin.length > 0
          - verify_images | ansible.builtin.length == verify_services | ansible.builtin.length
          - verify_images | ansible.builtin.reject('ansible.builtin.match', verify_image_pattern) | ansible.builtin.list | ansible.builtin.length == 0
        quiet: true
        fail_msg: >-
          Every service in the Compose file needs an image ending in @sha256: and 64 lower-case hex digits.
          Seen: {{ verify_images }}
      vars:
        verify_compose: "{{ lookup('ansible.builtin.file', verify_stack_source ~ '/compose.yml') | ansible.builtin.from_yaml }}"
        verify_services: '{{ verify_compose.services.values() | ansible.builtin.list }}'
        verify_images: >-
          {{ verify_services | ansible.builtin.selectattr('image', 'ansible.builtin.defined')
          | ansible.builtin.map(attribute='image') | ansible.builtin.list }}
        verify_image_pattern: '^[^\s@]+@sha256:[0-9a-f]{64}\Z'
      delegate_to: localhost

# The secrets file, the edge drop-in and the renderer path. The secrets file is
# read with no_log, so no value reaches the output: the check counts the keys.
- name: Verify the monitoring secrets file, the edge drop-in and the renderer path
  hosts: all
  gather_facts: false
  vars:
    verify_repo: '{{ playbook_dir }}/../../../../..'
    verify_env_file: /etc/branchleft/monitoring.env
    verify_edge_source: '{{ verify_repo }}/hetzner/monitoring/systemd/edge.override.conf'
    verify_edge_dir: /etc/systemd/system/branchleft-compose@edge.service.d
    verify_renderer: /opt/branchleft/monitoring/render_alertmanager_config.py
    verify_dropin_repo: '{{ verify_repo }}/hetzner/monitoring/systemd/monitoring.override.conf'
    verify_ntfy_vars: '{{ verify_repo }}/ansible/roles/ntfy_pager/vars/main.yml'
    verify_role_vars: '{{ verify_repo }}/ansible/roles/monitoring_stack/vars/main.yml'
    verify_env_keys:
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - HEALTHCHECKS_PING_URL
      - ALERT_RECIPIENT_EMAIL
      - MAILHOST_PING_URL
      - GRAFANA_ADMIN_PASSWORD
      - SNDS_DATA_URL
  tasks:
    - name: Read the monitoring secrets file's owner and mode
      ansible.builtin.stat:
        path: '{{ verify_env_file }}'
      register: monitoring_stack_verify_env

    - name: Assert the secrets file is a root-owned regular file with mode 0600
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_env.stat.exists
          - monitoring_stack_verify_env.stat.isreg
          - monitoring_stack_verify_env.stat.pw_name == 'root'
          - monitoring_stack_verify_env.stat.gr_name == 'root'
          - monitoring_stack_verify_env.stat.mode == '0600'
        quiet: true
        fail_msg: '{{ verify_env_file }} is missing, or is not a root-owned regular file with mode 0600.'

    # Counted, never shown: no_log hides the file's content from the output.
    - name: Read the monitoring secrets file to count its keys
      ansible.builtin.slurp:
        src: '{{ verify_env_file }}'
      register: monitoring_stack_verify_env_content
      no_log: true

    - name: Assert each key the role writes appears exactly once
      ansible.builtin.assert:
        that:
          - (monitoring_stack_verify_env_content.content | b64decode | ansible.builtin.regex_findall('^' ~ item ~ '=', multiline=True) | length) == 1
        quiet: true
        fail_msg: '{{ item }} must appear exactly once in {{ verify_env_file }}.'
      loop: '{{ verify_env_keys }}'
      loop_control:
        label: '{{ item }}'
      no_log: true

    - name: Read the edge drop-in on the instance and its source in the repository
      ansible.builtin.stat:
        path: '{{ verify_edge_dir }}/override.conf'
        checksum_algorithm: sha256
      register: monitoring_stack_verify_edge

    - name: Read the edge drop-in's source on the machine that runs the test
      ansible.builtin.stat:
        path: '{{ verify_edge_source }}'
        checksum_algorithm: sha256
      register: monitoring_stack_verify_edge_src
      delegate_to: localhost

    - name: Assert the edge drop-in is root-owned, mode 0644, byte for byte its source
      ansible.builtin.assert:
        that:
          - monitoring_stack_verify_edge.stat.isreg
          - monitoring_stack_verify_edge.stat.pw_name == 'root'
          - monitoring_stack_verify_edge.stat.gr_name == 'root'
          - monitoring_stack_verify_edge.stat.mode == '0644'
          - monitoring_stack_verify_edge.stat.checksum == monitoring_stack_verify_edge_src.stat.checksum
        quiet: true
        fail_msg: '{{ verify_edge_dir }}/override.conf differs from {{ verify_edge_source }}, or is not a root-owned 0644 file.'

    # The renderer's path is held in three places: the monitoring drop-in's
    # ExecStartPre, ntfy_pager's delivery list, and the role's constant. Each one
    # is asserted against the others here, so a rename in one fails the test.
    - name: Read the three places the renderer's path and name are held
      ansible.builtin.set_fact:
        monitoring_stack_verify_dropin_text: "{{ lookup('ansible.builtin.file', verify_dropin_repo) }}"
        monitoring_stack_verify_ntfy: "{{ lookup('ansible.builtin.file', verify_ntfy_vars) | ansible.builtin.from_yaml }}"
        monitoring_stack_verify_role: "{{ lookup('ansible.builtin.file', verify_role_vars) | ansible.builtin.from_yaml }}"

    - name: Assert the three places agree on the renderer's path
      ansible.builtin.assert:
        that:
          - ('ExecStartPre=/usr/bin/python3 ' ~ verify_renderer) in monitoring_stack_verify_dropin_text
          - "'render_alertmanager_config.py' in monitoring_stack_verify_ntfy.ntfy_pager_files"
          - monitoring_stack_verify_role.monitoring_stack_renderer == verify_renderer
        quiet: true
        fail_msg: The renderer's path differs between the monitoring drop-in, ntfy_pager's file list and the role's constant.
