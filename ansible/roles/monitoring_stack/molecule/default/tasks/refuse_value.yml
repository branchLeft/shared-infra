---
# One value that the role's input check must refuse, given in
# monitoring_stack_verify_try. The role must fail, and the secrets file must still
# hold the value of the last good run (verify_rot_e) with no second line in it.
- name: Apply the role with SMTP_PASSWORD holding the value
  no_log: true
  block:
    - name: Apply the role with the value
      ansible.builtin.include_role:
        name: branchleft.monitoring_stack
      vars:
        monitoring_stack_smtp_password: '{{ monitoring_stack_verify_try.value }}'
    - name: Note that the role did not refuse the value
      ansible.builtin.set_fact:
        monitoring_stack_verify_value_refused: false
  rescue:
    - name: Note that the role refused the value
      ansible.builtin.set_fact:
        monitoring_stack_verify_value_refused: true

- name: Read the secrets file after the value
  ansible.builtin.slurp:
    src: /etc/branchleft/monitoring.env
  register: monitoring_stack_verify_value_env
  no_log: true

- name: Assert the value check refused the value and the file holds the last good value
  ansible.builtin.assert:
    that:
      - monitoring_stack_verify_value_refused
      - ('SMTP_PASSWORD=' ~ verify_rot_e) in (monitoring_stack_verify_value_env.content | b64decode).splitlines()
      - "'test-sentinel-newline-0017' not in (monitoring_stack_verify_value_env.content | b64decode)"
    quiet: true
    fail_msg: >-
      The value check did not refuse {{ monitoring_stack_verify_try.name }}, or the file no longer holds the last
      good value, or a second line reached it.
