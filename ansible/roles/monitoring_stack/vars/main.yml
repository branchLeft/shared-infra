---
# What the role carries. These are constants of the stack, not inputs, so they
# live here and not in defaults/: a caller cannot override them. The paths are
# relative to the stack directory in the repository (files/stack, a link to it).
# Not carried, on purpose: render_alertmanager_config.py and its notes, and
# snds/collect_snds_metrics.py. The README says which work owns each.
#
# monitoring_stack_files is the one list of the eight stack files in the whole
# repository. No other role delivers any of them, and
# ansible/checks/test_monitoring_single_home.py fails if one does.
#
# The project directory is a constant too. The shared Compose unit template fixes
# the unit's WorkingDirectory to /opt/branchleft/<instance> and the monitoring
# drop-in names the renderer under /opt/branchleft/monitoring, so a role that
# delivered the files and hashed them anywhere else would restart the unit onto
# the old files and report every check green. It was an overridable default, and
# inventory and play variables override a default but not a value in vars/.
# ntfy_pager holds the same constant, and the Molecule scenario asserts that both
# equal the template's WorkingDirectory and that a play variable does not move
# either.
monitoring_stack_project_dir: /opt/branchleft/monitoring

monitoring_stack_dirs:
  - alertmanager
  - blackbox
  - grafana
  - grafana/provisioning
  - grafana/provisioning/datasources
  - ntfy
  - prometheus

monitoring_stack_files:
  - compose.yml
  - alertmanager/alertmanager.yml.tmpl
  - alertmanager/email.gotmpl
  - blackbox/blackbox.yml
  - grafana/provisioning/datasources/prometheus.yaml
  - ntfy/server.yml.tmpl
  - prometheus/alerts.yml
  - prometheus/prometheus.yml

# The files above whose diff the plan does not show: they hold placeholder names, a
# password-file path and environment variables named like passwords, which the plan's secret
# scan would withhold the whole plan of the host over. The rest are delivered by a task that
# shows its diff. ansible/checks/test_plan_diff_scan.py fails if a file listed here has no
# such line, or if a file left out of it has one.
monitoring_stack_files_hidden:
  - compose.yml
  - alertmanager/alertmanager.yml.tmpl
  - ntfy/server.yml.tmpl
  - prometheus/prometheus.yml

# The shared Compose unit template names a stack's drop-in directory after the
# instance, and the instance of this stack is "monitoring".
monitoring_stack_dropin_dir: /etc/systemd/system/branchleft-compose@monitoring.service.d
monitoring_stack_dropin_dest: /etc/systemd/system/branchleft-compose@monitoring.service.d/override.conf

# The monitoring secrets file. The role closes it to root 0600 before any value
# is written, creating it first when it is absent (see the README, "Secrets").
monitoring_stack_env_dir: /etc/branchleft
monitoring_stack_env_file: /etc/branchleft/monitoring.env

# The pager's secrets file. ntfy_pager is its only writer (one writer per file,
# ansible/checks/check_role_paths.py); this role only reads it, to put its hash in
# the fingerprint, so a rotated NTFY_ credential restarts the unit. The monitoring
# drop-in loads it after monitoring.env, with a leading dash because the pager
# credentials are optional to the stack. A constant, as ntfy_pager's copy is; the
# Molecule scenario asserts the two and the drop-in agree.
monitoring_stack_ntfy_env_file: /etc/branchleft/ntfy-pager.env

# The four names ntfy_pager writes into its file. The pager is configured when the
# file holds a value for every one. A copy of ntfy_pager's constant (no role imports
# another, ANS-12); the Molecule scenario asserts the two lists are equal.
monitoring_stack_ntfy_env_keys:
  - NTFY_PAGER_TOKEN
  - NTFY_WATCHER_TOKEN
  - NTFY_OWNER_PASSWORD_HASH
  - NTFY_MACHINE_PASSWORD_HASH

# The lines the role removes from monitoring.env: any line that starts with NTFY_
# and a plain name and an equals sign, as the hand-written ones did. Held here so a
# unit test can run the same expression over sample lines.
monitoring_stack_stale_key_regexp: '^NTFY_[A-Z0-9_]*='

# The pager gauge. The directory is the one the stack's node-exporter reads as its
# textfile collector (the stack's compose file mounts it read-only), made by
# exporters_and_collectors for the SNDS collector; this role writes one file in it,
# which no other role writes. The metric name is the one the NtfyPagerDisabled alert
# queries; a unit test asserts the two agree.
monitoring_stack_textfile_dir: /var/lib/branchleft/snds-exporter
monitoring_stack_pager_gauge: branchleft_pager_route_configured
monitoring_stack_pager_gauge_file: /var/lib/branchleft/snds-exporter/pager.prom

# The seven keys this role writes, each mapped to the input that carries its
# value. The key names are fixed here so no caller can rename a key the stack
# reads. Keys written by ntfy_pager (the NTFY_ lines, in its own file) and the
# STALWART line are not in this map: see the README.
monitoring_stack_env_keys:
  - key: SMTP_USERNAME
    value: '{{ monitoring_stack_smtp_username }}'
  - key: SMTP_PASSWORD
    value: '{{ monitoring_stack_smtp_password }}'
  - key: HEALTHCHECKS_PING_URL
    value: '{{ monitoring_stack_healthchecks_ping_url }}'
  - key: ALERT_RECIPIENT_EMAIL
    value: '{{ monitoring_stack_alert_recipient_email }}'
  - key: MAILHOST_PING_URL
    value: '{{ monitoring_stack_mailhost_ping_url }}'
  - key: GRAFANA_ADMIN_PASSWORD
    value: '{{ monitoring_stack_grafana_admin_password }}'
  - key: SNDS_DATA_URL
    value: '{{ monitoring_stack_snds_data_url }}'

# The one key whose line is left out of the fingerprint. Only
# snds-collector.service reads it, not the stack, and it rotates every 30 days:
# a rotation must not recreate the stack (README, "Restart").
monitoring_stack_fingerprint_skipped_key: SNDS_DATA_URL

# The renderer runs as the unit's ExecStartPre and is delivered by ntfy_pager, its
# single delivery owner. This role never writes it. It reads it twice: the
# fingerprint hashes it, so a changed renderer restarts the unit, and the
# restart refuses to run with a renderer that is missing or writable by others.
monitoring_stack_renderer: /opt/branchleft/monitoring/render_alertmanager_config.py

# What the fingerprint hashes, besides the secrets file: the eight stack files,
# the monitoring drop-in, the renderer and the pager's secrets file (all of it:
# unlike monitoring.env it has no key that is left out).
monitoring_stack_fingerprint_files: >-
  {{ monitoring_stack_files | map('regex_replace', '^', monitoring_stack_project_dir ~ '/') | list
  + [monitoring_stack_dropin_dest, monitoring_stack_renderer, monitoring_stack_ntfy_env_file] }}

# The stamp: one sha256 and a newline, written only after a restart was read
# back as active. The directory is shared with broker_deploy, which sets it to
# 0755 root:root, so this role sets the same: a different mode here would flip
# every run of one of the two roles.
monitoring_stack_stamp_dir: /var/lib/branchleft
monitoring_stack_stamp_file: /var/lib/branchleft/monitoring.applied

# The unit of the monitoring stack, the one the restart step restarts.
monitoring_stack_unit: branchleft-compose@monitoring.service

# The ActiveStates that make a restart due even when the fingerprint equals the
# stamp: the unit is down. An unreadable state counts as active, so the
# fingerprint alone decides then.
monitoring_stack_down_states:
  - failed
  - inactive

# The unit file states that count as enabled.
monitoring_stack_enabled_states:
  - enabled
  - enabled-runtime
