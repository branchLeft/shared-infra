---
# Root's, so the account that runs the program through sudo cannot replace it.
# ANS-16: the program prints one status line whose key is the word "secrets", followed by "=", and
# the program's verb table names "secrets". The plan's secret scan reads both as a credential
# assignment. The key is the program's output contract, which the controller reads, so it cannot be
# reworded here. The file holds no secret: its values arrive on stdin or by path, and the
# credential-shaped text is those two lines. The diff of this copy is hidden under the owner's
# ruling of 2 November on the plan-diff scan, choice A: reword prose, and hide a diff only where
# the match cannot be reworded. The other route, a named allowance in the scan (two entries, in two repos,
# needing code-owner approval), was not taken, so an approver cannot read changes to this program
# in the plan; the program runs as root through sudo as a forced command.
- name: Install the tenant entry program
  ansible.builtin.copy:
    src: branchleft_tenant_entry.py
    dest: '{{ tenant_entry_program }}'
    owner: root
    group: root
    mode: '0755'
  diff: false

# The program refuses a register directory that is not a real directory, root's, mode 0700.
# It holds the marker of each tenant the entry point claimed, so only a claimed tenant can be
# set up further.
- name: Make the register directory of claimed tenants
  ansible.builtin.file:
    path: '{{ tenant_entry_register_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0700'

# Where a tenant's ports are published: this host's own private address. The program builds each
# stack from it and refuses a file that is not root's and closed, so it is the host's setting and
# never part of a request.
- name: Check the app host's private address
  ansible.builtin.assert:
    that:
      - tenant_entry_bind_address is match(tenant_entry_private_address_pattern)
    fail_msg: tenant_entry_bind_address must be one private IPv4 address (10/8, 172.16/12 or 192.168/16).
    quiet: true

- name: Keep the app host's private address for the stack verb
  ansible.builtin.copy:
    content: "{{ tenant_entry_bind_address }}\n"
    dest: '{{ tenant_entry_bind_address_file }}'
    owner: root
    group: root
    mode: '0600'
