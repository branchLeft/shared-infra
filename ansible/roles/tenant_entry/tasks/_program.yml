---
# Root's, so the account that runs the program through sudo cannot replace it.
# ANS-16: the program prints one status line whose key is the word "secrets", followed by "=". The
# plan's secret scan reads that as a credential assignment. The key is the program's output
# contract, which the controller reads, so it cannot be reworded here. The file holds no secret,
# so the diff of this copy is hidden (the plan-diff scan's rule for a match that cannot be reworded).
- name: Install the tenant entry program
  ansible.builtin.copy:
    src: branchleft_tenant_entry.py
    dest: '{{ tenant_entry_program }}'
    owner: root
    group: root
    mode: '0755'
  diff: false

# The program refuses a register directory that is not a real directory, root's, mode 0700.
# It holds the marker of each tenant the entry point claimed, so only a claimed tenant can be
# set up further.
- name: Make the register directory of claimed tenants
  ansible.builtin.file:
    path: '{{ tenant_entry_register_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
