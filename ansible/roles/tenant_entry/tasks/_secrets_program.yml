---
# The two programs this one calls are installed by other roles, never by this one: the volume
# program and its register by tenant_onboarding, the slot program by deploy_slot_keys. This
# role only reads that they are there. ANS-10: the checks are skipped in check mode, because
# on a fresh host the role that makes the directory has only reported it by then, so the
# plan cannot see it; the real run checks, and a missing one stops the apply by name.
- name: Look for the volume program the secrets program imports
  ansible.builtin.stat:
    path: '{{ tenant_entry_program_dir }}/provision_tenant_volume.py'
    get_checksum: false
  register: tenant_entry_volume_program
  when: not ansible_check_mode

- name: Refuse a host that has no volume program beside where the secrets program goes
  ansible.builtin.assert:
    that:
      - tenant_entry_volume_program.stat.exists
    quiet: true
    fail_msg: >-
      The tenant volume program is not in the program directory. The tenant_onboarding role
      installs it, and this role needs it there before it fetches the secrets program.
  when: not ansible_check_mode

# Fetched as it is at the pinned ghost-platform commit and checked against its digest, so a
# file whose bytes differ fails the apply. Check mode writes no file; the fetch is skipped
# there and the second run's zero-change report is the evidence it is in place.
- name: Fetch the tenant secrets program from ghost-platform
  ansible.builtin.get_url:
    url: '{{ tenant_entry_ghost_raw_base }}/app/provision/render_tenant_secrets.py'
    dest: '{{ tenant_entry_secrets_program }}'
    checksum: 'sha256:{{ tenant_entry_secrets_program_sha256 }}'
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode
