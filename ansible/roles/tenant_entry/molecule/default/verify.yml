---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - vars/stack.yml
  vars:
    verify_entry_type: "{{ scenario_entry_public.split(' ')[0] }}"
    verify_entry_body: "{{ scenario_entry_public.split(' ')[1] }}"
    # A paste cut short: the mistake the key check exists for.
    verify_truncated_body: '{{ verify_entry_body[:40] }}'
    # Code points: tab, line feed, vertical tab, form feed, carriage return, the three file,
    # group and record separators, next line, line separator and paragraph separator.
    # Python's str.splitlines splits on all of them but the tab, which sits here as the one
    # control character that is not a line break. Each is a way to bring a second line the
    # caller never declared, and none can be typed into this file.
    verify_separators: [9, 10, 11, 12, 13, 28, 29, 30, 133, 8232, 8233]
    verify_key_bodies:
      - '{{ verify_entry_body }}'
      - "{{ scenario_other_public.split(' ')[1] }}"
      - "{{ scenario_stale_public.split(' ')[1] }}"
      - '{{ verify_truncated_body }}'
    # Each of these must be refused by sudo for the entry account: another mode, the one flag
    # with something added or doubled, an option that names another file, and no argument at all.
    verify_refused_argument_lists:
      - [--mode, step]
      - [--from-ssh, EXAMPLE_EXTRA]
      - [--from-ssh, --from-ssh]
      - [--config, /tmp/EXAMPLE_CONFIG]
      - []
    # Request texts a controller key must never get through. Each must be refused by the real
    # program, run as root through sudo, before it reads a file or runs a step.
    verify_hostile_requests:
      - 'bash -c id'
      - 'claim example-tenant;id'
      - 'claim example-tenant && id'
      - 'claim $(id)'
      - 'claim ../etc'
      - 'claim /etc/passwd'
      - 'claim Example'
      - 'revoke example-tenant'
      - 'claim example-tenant extra'
      - "claim example-tenant\nid"
      - ''
  tasks:
    - name: Assert the host is configured
      ansible.builtin.include_tasks: tasks/assert_state.yml

    # sudo reads the written file: the account may run the program with its one flag as root,
    # with the request text kept, and nothing else. The control case is the first run; the
    # refusals then cannot be a broken runuser or a missing program.
    - name: Run a read-only request through sudo as the entry account
      ansible.builtin.command:
        argv:
          [runuser, -u, '{{ scenario_user }}', --, sudo, -n, '{{ scenario_program }}', --from-ssh]
      environment:
        SSH_ORIGINAL_COMMAND: status example-control
      register: tenant_entry_verify_status_run
      changed_when: false
      check_mode: false

    - name: Assert the program ran and knows no tenant of that name
      ansible.builtin.assert:
        that:
          - tenant_entry_verify_status_run.stdout_lines == ['claimed-here=no']
        quiet: true

    - name: Run the program through sudo as the entry account with an argument list it must not have
      ansible.builtin.command:
        argv: "{{ ['runuser', '-u', scenario_user, '--', 'sudo', '-n', scenario_program] + item }}"
      environment:
        SSH_ORIGINAL_COMMAND: status example-control
      register: tenant_entry_verify_refused_runs
      changed_when: false
      failed_when: false
      check_mode: false
      loop: '{{ verify_refused_argument_lists }}'

    - name: Assert sudo refused every one of them and the program did not run
      ansible.builtin.assert:
        that:
          - tenant_entry_verify_refused_runs.results | map(attribute='rc') | select('equalto', 0) | list | length == 0
          - tenant_entry_verify_refused_runs.results | map(attribute='stdout') | select('search', 'claimed-here') | list | length == 0
        quiet: true

    - name: Run another program through sudo as the entry account
      ansible.builtin.command:
        argv: [runuser, -u, '{{ scenario_user }}', --, sudo, -n, /bin/true]
      register: tenant_entry_verify_other_run
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert sudo refused the other program
      ansible.builtin.assert:
        that:
          - tenant_entry_verify_other_run.rc != 0
        quiet: true

    - name: List what the entry account may run through sudo
      ansible.builtin.command:
        argv: [runuser, -u, '{{ scenario_user }}', --, sudo, -n, -l]
      register: tenant_entry_verify_sudo_list
      changed_when: false
      check_mode: false

    - name: Assert the one grant is the only command the account may run
      vars:
        verify_sudo_grants: "{{ tenant_entry_verify_sudo_list.stdout_lines | select('search', '^ +[(]') | map('trim') | list }}"
      ansible.builtin.assert:
        that:
          - "verify_sudo_grants == ['(root) NOPASSWD: /usr/local/sbin/branchleft-tenant-entry --from-ssh']"
        quiet: true

    - name: Run each hostile request through sudo as the entry account
      ansible.builtin.command:
        argv:
          [runuser, -u, '{{ scenario_user }}', --, sudo, -n, '{{ scenario_program }}', --from-ssh]
      environment:
        SSH_ORIGINAL_COMMAND: '{{ item }}'
      register: tenant_entry_verify_hostile_runs
      changed_when: false
      failed_when: false
      check_mode: false
      loop: '{{ verify_hostile_requests }}'

    - name: Assert the program refused every hostile request by word, with nothing on stdout
      ansible.builtin.assert:
        that:
          - tenant_entry_verify_hostile_runs.results | map(attribute='rc') | unique | list == [1]
          - tenant_entry_verify_hostile_runs.results | map(attribute='stdout') | select('ne', '') | list | length == 0
          - >-
            tenant_entry_verify_hostile_runs.results | map(attribute='stderr')
            | reject('match', '^refused: (request-shape|slug-shape|unknown-verb)$') | list | length == 0
        quiet: true

    - name: List the register directory after the hostile requests
      ansible.builtin.find:
        paths: '{{ scenario_register_dir }}'
        file_type: any
        hidden: true
      register: tenant_entry_verify_register_clean

    - name: Assert the hostile requests wrote nothing but the lock file
      ansible.builtin.assert:
        that:
          - tenant_entry_verify_register_clean.files | map(attribute='path') | map('basename') | difference(['.lock']) | length == 0
        quiet: true

    - name: Try to read the register directory as the entry account
      ansible.builtin.command:
        argv: [runuser, -u, '{{ scenario_user }}', --, ls, '{{ scenario_register_dir }}']
      register: tenant_entry_verify_register_read
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert the entry account cannot read the register
      ansible.builtin.assert:
        that:
          - tenant_entry_verify_register_read.rc != 0
        quiet: true

    # The real claim step, through sudo and the stand-in volume program. It takes the first
    # uid and the first four ports, writes the marker, and the stand-in keeps the claim.
    - name: Claim a tenant through sudo as the entry account
      ansible.builtin.command:
        argv:
          [runuser, -u, '{{ scenario_user }}', --, sudo, -n, '{{ scenario_program }}', --from-ssh]
      environment:
        SSH_ORIGINAL_COMMAND: claim example-tenant
      register: tenant_entry_verify_claim_run
      changed_when: false
      check_mode: false

    - name: Read the marker the claim wrote and the claims the stand-in kept
      ansible.builtin.stat:
        path: '{{ scenario_register_dir }}/example-tenant.json'
      register: tenant_entry_verify_marker

    - name: Read the claims the stand-in volume program kept
      ansible.builtin.command:
        argv: [cat, /var/tmp/stand-in-claims]
      register: tenant_entry_verify_claims
      changed_when: false
      check_mode: false

    - name: Assert the claim took the first uid and ports and wrote a closed marker
      ansible.builtin.assert:
        that:
          - tenant_entry_verify_claim_run.stdout_lines == ['claimed uid=30000 port_a=40000 port_b=40001 port_health=40002']
          - tenant_entry_verify_marker.stat.pw_name == 'root'
          - tenant_entry_verify_marker.stat.mode == '0600'
          - tenant_entry_verify_claims.stdout_lines == ['example-tenant=30000']
        quiet: true

    - name: Make each request a claimed tenant must not get through, and one for a tenant never claimed
      ansible.builtin.command:
        argv:
          [runuser, -u, '{{ scenario_user }}', --, sudo, -n, '{{ scenario_program }}', --from-ssh]
      environment:
        SSH_ORIGINAL_COMMAND: '{{ item.request }}'
      args:
        stdin: '{{ item.stdin | default("") }}'
      register: tenant_entry_verify_order_runs
      changed_when: false
      failed_when: false
      check_mode: false
      loop:
        - request: claim example-tenant
          expect: 'refused: slug-in-use'
        - request: enable example-tenant
          expect: 'refused: secrets-first'
        - request: key example-tenant
          expect: 'refused: secrets-first'
        - request: owner example-tenant
          expect: 'refused: secrets-first'
        - request: secrets example-tenant
          stdin: '{nope'
          expect: 'refused: payload-not-json'
        - request: secrets example-tenant
          stdin: '{"template": "", "values": {"A": "b"}, "etc_dir": "/elsewhere"}'
          expect: 'refused: payload-keys'
        - request: secrets example-other
          stdin: '{}'
          expect: 'refused: not-claimed-here'
        - request: enable example-other
          expect: 'refused: not-claimed-here'
      loop_control:
        label: '{{ item.request }}'

    - name: Assert each was refused for the reason named and nothing was written
      ansible.builtin.assert:
        that:
          - item.rc == 1
          - item.stdout == ''
          - item.stderr == (item.item.expect)
        quiet: true
      loop: '{{ tenant_entry_verify_order_runs.results }}'
      loop_control:
        label: '{{ item.item.request }}'

    - name: List the register directory after the claim and the refusals
      ansible.builtin.find:
        paths: '{{ scenario_register_dir }}'
        file_type: any
        hidden: true
      register: tenant_entry_verify_register_after

    - name: Assert the register holds the lock file and the one marker, and no leftover template
      ansible.builtin.assert:
        that:
          - tenant_entry_verify_register_after.files | map(attribute='path') | map('basename') | sort | list == ['.lock', 'example-tenant.json']
        quiet: true

    # A fresh tenant through claim (above), secrets, stack and enable, with status after each,
    # and every way the stack verb must refuse. See tasks/lifecycle.yml.
    - name: Run a fresh tenant through the set-up and refuse every stack that must be refused
      ansible.builtin.include_tasks: tasks/lifecycle.yml

    - name: Refuse an empty key, which is never read as remove every key
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a key that is not one ed25519 public key on one line
        refused_key: ''

    # The key check has the shape of ed25519 only: another key type is refused whole.
    - name: Refuse a key of another type
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a key that is not one ed25519 public key on one line
        refused_key: 'ssh-rsa {{ verify_entry_body }} PLACEHOLDER_comment'

    - name: Refuse a key whose body was cut short
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a key that is not one ed25519 public key on one line
        refused_key: '{{ verify_entry_type }} {{ verify_truncated_body }}'

    - name: Refuse a key whose type has a typo
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a key that is not one ed25519 public key on one line
        refused_key: 'ssh-ed25518 {{ verify_entry_body }} PLACEHOLDER_comment'

    # A key value that brings its own options would give the key more than the role's command.
    - name: Refuse a key value that brings its own options
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a key that is not one ed25519 public key on one line
        refused_key: 'command="/bin/EXAMPLE_COMMAND" {{ scenario_entry_public }}'

    # A valid key, a separator, and behind it the key this host retired, now with an option of
    # its own. The key check must refuse it and the retired key must not come back.
    - name: Refuse a key value that smuggles in a second key behind a separator
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a key that is not one ed25519 public key on one line
        refused_key: '{{ scenario_entry_public }}{{ ''%c'' | format(verify_separator) }}command="/bin/EXAMPLE_COMMAND" {{ scenario_stale_public }}'
      loop: '{{ verify_separators }}'
      loop_control:
        loop_var: verify_separator
        label: code point {{ verify_separator }}

    # The line break after the key and nothing behind it: \Z refuses it, $ does not.
    - name: Refuse a key value that ends in a line break
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a key that is not one ed25519 public key on one line
        refused_key: "{{ scenario_entry_public }}{{ '%c' | format(10) }}"

    - name: Refuse a key value with a comment that is not printable ASCII
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a key that is not one ed25519 public key on one line
        refused_key: "{{ scenario_entry_public }} PLACEHOLDER_comment_{{ '%c' | format(233) }}"

    # A key with a forced command must say where it may come from.
    - name: Refuse an empty list of source addresses
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse an empty list of source addresses
        refused_from: []

    - name: Refuse a wildcard source address
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a source address that is not a dotted IPv4 address or a /24 to /32 range
        refused_message_part: 'address number 2 '
        refused_from:
          - 192.0.2.10
          - '*'

    - name: Refuse a range that covers more than 256 addresses
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a source address that is not a dotted IPv4 address or a /24 to /32 range
        refused_message_part: 'address number 1 '
        refused_from:
          - 0.0.0.0/0

    - name: Refuse a host name as a source address
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a source address that is not a dotted IPv4 address or a /24 to /32 range
        refused_from:
          - example.invalid

    - name: Refuse a negated source address
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a source address that is not a dotted IPv4 address or a /24 to /32 range
        refused_from:
          - '!192.0.2.10'

    # A source address that brings an option of its own through a quote or a comma.
    - name: Refuse a source address that carries a second option
      ansible.builtin.include_tasks: tasks/refused.yml
      vars:
        refused_task: Refuse a source address that is not a dotted IPv4 address or a /24 to /32 range
        refused_from:
          - '192.0.2.10",command="/bin/EXAMPLE_COMMAND'

    # The role owns this account: a password set on it and a shell that cannot run a forced
    # command are put right by the next apply, not judged and left.
    - name: Give the account a password that is not locked and a shell that cannot run a forced command
      ansible.builtin.user:
        name: '{{ scenario_user }}'
        password: '$6$EXAMPLESALT$EXAMPLEHASH'
        shell: /usr/sbin/nologin
      no_log: true

    - name: Apply the role over the damaged account
      ansible.builtin.include_role:
        name: branchleft.tenant_entry
      vars:
        tenant_entry_key: '{{ scenario_entry_public }}'
        tenant_entry_from: '{{ scenario_from }}'

    - name: Assert the refusals left the host as it was and the account is as the role makes it
      ansible.builtin.include_tasks: tasks/assert_state.yml

    # exclusive: a key the host holds that the role was not given is removed.
    - name: Give the account a key the role was not given
      ansible.posix.authorized_key:
        user: '{{ scenario_user }}'
        key: '{{ scenario_stale_public }}'
        manage_dir: true
      no_log: true
      diff: false

    - name: Apply the role again
      ansible.builtin.include_role:
        name: branchleft.tenant_entry
      vars:
        tenant_entry_key: '{{ scenario_entry_public }}'
        tenant_entry_from: '{{ scenario_from }}'

    - name: Assert the key the role was not given is gone
      ansible.builtin.include_tasks: tasks/assert_state.yml

    # ANS-16. The scenario sets verbosity 1 and a log path (molecule.yml), so a task that
    # handles key material without no_log prints it into this log. The sudoers task has no
    # no_log on purpose: the gated plan shows the owner its diff, so the sudoers lines must
    # be in this log through that diff. molecule.yml sets ANSIBLE_DIFF_ALWAYS, so the first
    # run that changes the host prints them whether or not the caller ran a --diff step.
    # The scan runs last, so it covers the refused runs too. The canary and the task names
    # show the scan reads the output of the converge, so "nothing found" cannot mean
    # "nothing read".
    - name: Read the log of this scenario's Ansible runs
      ansible.builtin.set_fact:
        tenant_entry_verify_log: "{{ lookup('ansible.builtin.file', scenario_log_path) }}"
      no_log: true

    - name: Assert the log holds the converge output
      ansible.builtin.assert:
        that:
          - "'SCENARIO_LOG_CANARY' in tenant_entry_verify_log"
          - "'Install the sudoers file of the entry account' in tenant_entry_verify_log"
          - "'Make the authorised keys of the entry account exactly the one declared key' in tenant_entry_verify_log"
        quiet: true

    - name: Assert the sudoers line reached the log through the diff of the sudoers task
      ansible.builtin.assert:
        that:
          - "'NOPASSWD: /usr/local/sbin/branchleft-tenant-entry --from-ssh' in tenant_entry_verify_log"
        quiet: true

    - name: Assert no key body and no password hash reached the log
      ansible.builtin.assert:
        that:
          - verify_key_bodies | select('in', tenant_entry_verify_log) | list | length == 0
          - "'EXAMPLEHASH' not in tenant_entry_verify_log"
          - tenant_entry_stack_secrets_values.values() | select('in', tenant_entry_verify_log) | list | length == 0
        quiet: true
