---
# What a host the role has configured, with the scenario's one key, looks like. Included by
# verify.yml more than once: after the converge, and again after every run that must change
# nothing. The tasks that read a sudoers file or a key file carry no_log: true, so that the
# log check in verify.yml sees only the role's own output.
- name: Read the entry account
  ansible.builtin.getent:
    database: passwd
    key: '{{ scenario_user }}'
  register: tenant_entry_assert_state_passwd

- name: Read the password field of the entry account
  ansible.builtin.getent:
    database: shadow
    key: '{{ scenario_user }}'
  register: tenant_entry_assert_state_shadow
  no_log: true

- name: Keep only the first character of the password field
  ansible.builtin.set_fact:
    tenant_entry_assert_state_lock_character: '{{ tenant_entry_assert_state_shadow.ansible_facts.getent_shadow[scenario_user][0][:1] }}'
  no_log: true

- name: Assert the account is a system account with a home, a real shell and a locked password
  ansible.builtin.assert:
    that:
      - tenant_entry_assert_state_passwd.ansible_facts.getent_passwd[scenario_user][1] | int < 1000
      - tenant_entry_assert_state_passwd.ansible_facts.getent_passwd[scenario_user][4] == scenario_home
      - tenant_entry_assert_state_passwd.ansible_facts.getent_passwd[scenario_user][5] == '/bin/bash'
      - tenant_entry_assert_state_lock_character == '!'
    quiet: true

- name: Read the sudoers file
  ansible.builtin.stat:
    path: '{{ scenario_sudoers_path }}'
  register: tenant_entry_assert_state_file

- name: Assert the sudoers file is owned by root, group root, and readable only as sudo wants
  ansible.builtin.assert:
    that:
      - tenant_entry_assert_state_file.stat.exists
      - tenant_entry_assert_state_file.stat.pw_name == 'root'
      - tenant_entry_assert_state_file.stat.gr_name == 'root'
      - tenant_entry_assert_state_file.stat.mode == '0440'
    quiet: true

- name: Read the lines of the sudoers file
  ansible.builtin.command:
    argv:
      - cat
      - '{{ scenario_sudoers_path }}'
  register: tenant_entry_assert_state_lines
  changed_when: false
  check_mode: false

- name: Assert the sudoers file holds exactly the one command and nothing else
  ansible.builtin.assert:
    that:
      - tenant_entry_assert_state_lines.stdout_lines == scenario_sudoers_lines
    quiet: true

- name: List the sudoers directory
  ansible.builtin.find:
    paths: /etc/sudoers.d
    file_type: any
    hidden: true
  register: tenant_entry_assert_state_directory

# The image ships a README in the directory. Anything else beside the file, a leftover of a
# refused write included, is a file sudo may read.
- name: Assert the sudoers file is the only file in the directory besides the README
  ansible.builtin.assert:
    that:
      - tenant_entry_assert_state_directory.files | map(attribute='path') | map('basename') | difference(['README', 'tenant-entry']) | length == 0
    quiet: true

- name: Read the main sudoers file and the copy prepare.yml kept
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - /etc/sudoers
    - /var/tmp/sudoers.before
  register: tenant_entry_assert_state_main

- name: Assert the main sudoers file is the file the image shipped
  ansible.builtin.assert:
    that:
      - tenant_entry_assert_state_main.results[0].stat.checksum == tenant_entry_assert_state_main.results[1].stat.checksum
    quiet: true

- name: Check the whole sudoers configuration, the file included
  ansible.builtin.command:
    argv:
      - /usr/sbin/visudo
      - -c
  register: tenant_entry_assert_state_visudo
  changed_when: false
  check_mode: false

- name: Assert sudo reads the file
  ansible.builtin.assert:
    that:
      - "'/etc/sudoers.d/tenant-entry: parsed OK' in tenant_entry_assert_state_visudo.stdout_lines"
    quiet: true

- name: Read the account's key directory and key file
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - '{{ scenario_home }}/.ssh'
    - '{{ scenario_home }}/.ssh/authorized_keys'
  register: tenant_entry_assert_state_ssh

- name: Assert the key directory and the key file belong to the account and are private to it
  ansible.builtin.assert:
    that:
      - tenant_entry_assert_state_ssh.results[0].stat.mode == '0700'
      - tenant_entry_assert_state_ssh.results[0].stat.pw_name == scenario_user
      - tenant_entry_assert_state_ssh.results[1].stat.mode == '0600'
      - tenant_entry_assert_state_ssh.results[1].stat.pw_name == scenario_user
    quiet: true

- name: Read the account's authorised keys
  ansible.builtin.command:
    argv:
      - cat
      - '{{ scenario_home }}/.ssh/authorized_keys'
  register: tenant_entry_assert_state_keys
  changed_when: false
  check_mode: false
  no_log: true

# The image has no ssh-keygen, so the file is copied to the controller, which has one.
# ssh-keygen -l -f prints one line for each line it reads and skips a line it cannot read
# without failing, so the count of its lines is compared with the count of lines in the file.
- name: Copy the account's key file to the controller
  ansible.builtin.fetch:
    src: '{{ scenario_home }}/.ssh/authorized_keys'
    dest: '{{ scenario_key_dir }}/written-authorized_keys'
    flat: true
  check_mode: false
  no_log: true

- name: Ask ssh-keygen to read the key file
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -l
      - -f
      - '{{ scenario_key_dir }}/written-authorized_keys'
  delegate_to: localhost
  register: tenant_entry_assert_state_fingerprints
  changed_when: false
  check_mode: false
  no_log: true

- name: Assert ssh-keygen read the one line of the key file as a public key
  ansible.builtin.assert:
    that:
      - tenant_entry_assert_state_keys.stdout_lines | length == 1
      - tenant_entry_assert_state_fingerprints.stdout_lines | length == 1
    quiet: true

# The expected line is written out in molecule.yml and not built by the role's template,
# so dropping an option from the role fails this comparison.
- name: Assert the keys are exactly the one declared line
  ansible.builtin.assert:
    that:
      - tenant_entry_assert_state_keys.stdout_lines == [scenario_key_line]
    quiet: true

# The program, the register directory and the fetched secrets program. The program and the
# directory are root's so the account that runs the program through sudo cannot replace
# either. The fetched program must be the bytes pinned here, written out in molecule.yml and
# not read from the role, so a changed pin in the role fails this comparison.
- name: Read the program, the register directory and the fetched secrets program
  ansible.builtin.stat:
    path: '{{ item }}'
    checksum_algorithm: sha256
  loop:
    - '{{ scenario_program }}'
    - '{{ scenario_register_dir }}'
    - '{{ scenario_secrets_program }}'
  register: tenant_entry_assert_state_program

- name: Assert the three are root's, with the modes the program and the host expect
  ansible.builtin.assert:
    that:
      - tenant_entry_assert_state_program.results | map(attribute='stat') | map(attribute='pw_name') | unique | list == ['root']
      - tenant_entry_assert_state_program.results[0].stat.mode == '0755'
      - tenant_entry_assert_state_program.results[1].stat.mode == '0700'
      - tenant_entry_assert_state_program.results[1].stat.isdir
      - tenant_entry_assert_state_program.results[2].stat.mode == '0755'
      - tenant_entry_assert_state_program.results[2].stat.checksum == scenario_secrets_sha256
    quiet: true

# The owner script and the node it runs under: root's, closed to writes by anyone else, the
# script exactly the pinned bytes (written out in molecule.yml) and node the pinned version.
- name: Read the owner script, the node directory and the node binary
  ansible.builtin.stat:
    path: '{{ item }}'
    checksum_algorithm: sha256
  loop:
    - '{{ scenario_owner_program }}'
    - '{{ scenario_node_dir }}'
    - '{{ scenario_node }}'
  register: tenant_entry_assert_state_owner

- name: Ask the node the host holds its version
  ansible.builtin.command:
    argv: ['{{ scenario_node }}', --version]
  register: tenant_entry_assert_state_node_version
  changed_when: false
  check_mode: false

- name: Assert the owner script is the pinned bytes, and it and node are root's and closed to writes
  ansible.builtin.assert:
    that:
      - tenant_entry_assert_state_owner.results | map(attribute='stat') | map(attribute='pw_name') | unique | list == ['root']
      - tenant_entry_assert_state_owner.results | map(attribute='stat') | map(attribute='gr_name') | unique | list == ['root']
      - tenant_entry_assert_state_owner.results[0].stat.mode == '0644'
      - tenant_entry_assert_state_owner.results[0].stat.checksum == scenario_owner_sha256
      - tenant_entry_assert_state_owner.results[1].stat.isdir
      - tenant_entry_assert_state_owner.results[1].stat.mode == '0755'
      - tenant_entry_assert_state_owner.results[2].stat.mode == '0755'
      - tenant_entry_assert_state_node_version.stdout == scenario_node_version
    quiet: true

# The entry account runs the program through sudo and nothing else. It must not be able to
# change the node that root runs for it, nor read or change the script in root's own directory.
- name: Try to write into the node directory, and to read the owner script, as the entry account
  ansible.builtin.command:
    argv: "{{ ['runuser', '-u', scenario_user, '--'] + item }}"
  loop:
    - [test, -w, '{{ scenario_node_dir }}']
    - [test, -w, '{{ scenario_node }}']
    - [test, -r, '{{ scenario_owner_program }}']
  register: tenant_entry_assert_state_account_access
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert the entry account can write neither, and cannot read the script
  ansible.builtin.assert:
    that:
      - tenant_entry_assert_state_account_access.results | map(attribute='rc') | select('equalto', 0) | list | length == 0
    quiet: true
