---
# The scenario starts from a host that has no entry account: the role must make it. Prepare
# makes the throwaway keys on the controller (the image has no ssh-keygen), keeps a copy of the
# main sudoers file for the verify play to compare against, and stages what other roles leave on
# an app host: the program directory and a stand-in for the volume program.
- name: Make the throwaway keys on the controller
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Make the directory for this run's throwaway keys
      ansible.builtin.file:
        path: '{{ scenario_key_dir }}'
        state: directory
        mode: '0700'

    # No module in the pinned collections makes an SSH key pair, so the command is used (ANS-9).
    - name: Make one throwaway key pair for each key the scenario uses
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ''
          - -C
          - 'PLACEHOLDER_{{ item }}'
          - -f
          - '{{ scenario_key_dir }}/{{ item }}'
        creates: '{{ scenario_key_dir }}/{{ item }}.pub'
      loop:
        - entry
        - other
        - stale

- name: Prepare the instance
  hosts: all
  gather_facts: false
  tasks:
    - name: Keep a copy of the main sudoers file as the image ships it
      ansible.builtin.copy:
        src: /etc/sudoers
        dest: /var/tmp/sudoers.before
        remote_src: true
        mode: preserve

    # What tenant_onboarding leaves on a host: the program directory and the volume program.
    # This one is a stand-in that keeps the claims it is given in a file, so verify can run the
    # entry program's real claim step through sudo. The real program has its own tests and its
    # own role; the entry program only calls it.
    - name: Make the program directory tenant_onboarding makes
      ansible.builtin.file:
        path: '{{ scenario_program_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Put a stand-in for the tenant volume program in its place
      ansible.builtin.copy:
        content: |
          #!/usr/bin/python3 -I
          import re
          import sys

          CLAIMS = "/var/tmp/stand-in-claims"


          # The two names the real secrets program imports from the real volume program.
          class ProvisionError(Exception):
              pass


          def validate_slug(slug):
              if re.fullmatch(r"[a-z][a-z0-9-]{0,24}[a-z0-9]", slug) is None:
                  raise ProvisionError("slug")


          def main(args):
              if args == ["--list-claims"]:
                  try:
                      sys.stdout.write(open(CLAIMS, encoding="utf-8").read())
                  except FileNotFoundError:
                      pass
                  return 0
              if len(args) == 3 and args[0] == "--uid":
                  with open(CLAIMS, "a", encoding="utf-8") as handle:
                      handle.write(args[2] + "=" + args[1] + "\n")
                  return 0
              return 2


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
        dest: '{{ scenario_volume_program }}'
        owner: root
        group: root
        mode: '0755'

    # What deploy_tooling leaves on an app host: the two directories a stack's files go in, and
    # the template unit the `enable` verb enables. `systemctl enable` and `is-enabled` work on
    # the unit files with no systemd running, so the real command is used, not a stand-in. The
    # unit is a placeholder that starts nothing real.
    - name: Make the directories deploy_tooling makes
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/branchleft
        - /opt/branchleft

    - name: Put a placeholder template unit where deploy_tooling puts the compose unit
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Placeholder compose unit for %i

          [Service]
          ExecStart=/bin/true

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/branchleft-compose@.service
        owner: root
        group: root
        mode: '0644'

    # What the host's Docker is to the owner verb: it lists the one running container of the
    # colour and runs the owner script's inner program in it. This stand-in answers the list with
    # one container id, and the exec with the result line a fresh Ghost gives, after writing down
    # what it was asked: the words before the inner program (the program text itself is left out),
    # and the keys of the one JSON object it was given on stdin. The real node runs the real owner
    # script against it, so the scenario shows the script is installed, runs, reads the address
    # from the secrets file and sends it nowhere but stdin. It is not Ghost: the script's own
    # tests are in ghost-platform and the first live request is the evidence for the rest.
    - name: Put a stand-in for Docker where the owner verb looks for it
      ansible.builtin.copy:
        content: |
          #!/usr/bin/python3 -I
          import json
          import sys

          LOG = "/var/tmp/stand-in-docker.log"
          CONTAINER = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

          args = sys.argv[1:]
          if args[:1] == ["ps"]:
              print(CONTAINER)
              sys.exit(0)
          if args[:3] == ["exec", "-i", CONTAINER] and args[3:5] == ["node", "-e"]:
              given = json.loads(sys.stdin.read())
              with open(LOG, "a", encoding="utf-8") as handle:
                  handle.write(json.dumps({"argv": args[:5], "stdin_keys": sorted(given),
                                           "address_given": given.get("email") == "owner@example.invalid"}) + "\n")
              print(json.dumps({"created": True, "alreadySetUp": False, "linkRequested": True}))
              sys.exit(0)
          sys.exit(2)
        dest: /usr/bin/docker
        owner: root
        group: root
        mode: '0755'
      # The stand-in holds the scenario's placeholder owner address, which the leak scan in
      # verify reads as a secret value. Its diff would print that literal into this run's log,
      # so the scan would fail on the stand-in and not on the role. The stand-in is test
      # scaffolding; the address check still runs through its log at /var/tmp/stand-in-docker.log.
      diff: false
