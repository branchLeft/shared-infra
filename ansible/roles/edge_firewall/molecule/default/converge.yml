---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    edge_firewall_scenario_private_address: 10.20.1.5
  tasks:
    # The first converge on an instance runs the attempts below, in this order, and then applies
    # the good set. Later converges see the active file and skip them, so the second converge
    # changes nothing. Check mode loads nothing, so the attempts run only for real; the role's
    # own check-mode skip is the reason (ANS-10).
    - name: Read whether the active rules file is already on the instance
      ansible.builtin.stat:
        path: /etc/branchleft-firewall/active.nft
      register: edge_firewall_converge_active

    - name: Try inputs and hosts the role must refuse, sets the guard must roll back, and monitor mode
      when:
        - not edge_firewall_converge_active.stat.exists
        - not ansible_check_mode
      block:
        - name: Read the interface the default route leaves through
          ansible.builtin.include_tasks: tasks/read_uplink.yml

        - name: Read Docker's stand-in rules before the role has run
          ansible.builtin.include_tasks: tasks/docker_snapshot.yml

        - name: Keep Docker's stand-in rules as they were before the role
          ansible.builtin.set_fact:
            edge_firewall_converge_docker_before: '{{ edge_firewall_docker_now }}'

        - name: Read whether the legacy masquerade rule is on the host, as it is on edge1 today
          ansible.builtin.command:
            argv:
              [
                iptables,
                -t,
                nat,
                -C,
                POSTROUTING,
                -s,
                10.20.1.0/24,
                -o,
                '{{ edge_firewall_scenario_uplink_dev }}',
                -j,
                MASQUERADE,
              ]
          register: edge_firewall_converge_legacy_before
          changed_when: false

        # Inputs that are not plain values. Each must be refused by the input check before
        # anything is loaded; a newline once loaded a second masquerade rule that the connection
        # check passed. One has a newline in the middle, one only at the end (which a pattern
        # ending in $ lets through), one a second token after the address. The package is not
        # installed, the mask is not written and the legacy rule stays: nothing moved.
        - name: Try NAT sources that are not plain subnets
          ansible.builtin.include_tasks: tasks/probe.yml
          loop:
            - name: a newline then a second rule
              expect: refused
              source: "10.20.1.0/24\nip saddr 203.0.113.0/24 oifname \"SCENARIO_OTHER\" masquerade"
              task: Refuse a NAT source that is not a plain dotted /24
            - name: a trailing newline
              expect: refused
              source: "10.20.1.0/24\n"
              task: Refuse a NAT source that is not a plain dotted /24
            - name: a second token after the subnet
              expect: refused
              source: 10.20.1.0/24 counter
              task: Refuse a NAT source that is not a plain dotted /24
          loop_control:
            loop_var: edge_firewall_probe_case
            label: '{{ edge_firewall_probe_case.name }}'

        # The two refusals of the reconciler this role replaces. Each reads the host and
        # refuses before the package, the mask or the load.
        - name: Take the public address off the uplink
          ansible.builtin.command:
            argv: [ip, addr, del, 203.0.113.11/32, dev, '{{ edge_firewall_scenario_uplink_dev }}']
          changed_when: true

        - name: Try a host whose default route leaves through an interface with no public address
          ansible.builtin.include_tasks: tasks/probe.yml
          vars:
            edge_firewall_probe_case:
              name: uplink with no public address
              expect: refused
              task: Refuse a default route that leaves through an interface with no public address

        - name: Put the public address back on the uplink
          ansible.builtin.command:
            argv:
              [ip, addr, replace, 203.0.113.11/32, dev, '{{ edge_firewall_scenario_uplink_dev }}']
          changed_when: true

        - name: Take the estate address off the uplink
          ansible.builtin.command:
            argv: [ip, addr, del, 10.20.1.5/24, dev, '{{ edge_firewall_scenario_uplink_dev }}']
          changed_when: true

        - name: Try a host that holds no address in the estate subnet
          ansible.builtin.include_tasks: tasks/probe.yml
          vars:
            edge_firewall_probe_case:
              name: no address in the estate subnet
              expect: refused
              task: Refuse a host that holds no address in the estate subnet

        - name: Put the estate address back on the uplink
          ansible.builtin.command:
            argv: [ip, addr, replace, 10.20.1.5/24, dev, '{{ edge_firewall_scenario_uplink_dev }}']
          changed_when: true

        # The first-install branch. No ruleset of the role's is on the host, and the package is
        # not installed: this attempt installs it (after the mask) and then loads a set that
        # parses, loads and keeps the loopback accept by address, but does not accept the control
        # port. A connection to 127.0.0.1 would still work under it; a connection to the host's
        # own private address does not. The guard has nothing to restore, so it removes the tables
        # it loaded. Docker's stand-in rules must be unchanged by the package install (the probe
        # asserts it), and the legacy masquerade rule must still be there.
        - name: Try a set that drops the control port on a host with no previous set
          ansible.builtin.include_tasks: tasks/probe.yml
          vars:
            edge_firewall_probe_case:
              name: bad set on first install
              expect: rolled_back
              template: '{{ playbook_dir }}/files/closes_ssh_keeps_loopback.nft.j2'
              task: Connect to the host's own private address on the control port after the load
              marker: scenario bad set

        # Monitor mode, then the good set in enforce mode, so that there is a previous set to
        # roll back to.
        - name: Apply the role in monitor mode and check what monitor mode does
          ansible.builtin.include_tasks: tasks/phase_monitor.yml

        - name: Apply the role with the good set, in enforce mode
          ansible.builtin.include_role:
            name: branchleft.edge_firewall

        - name: Try a set that drops the control port on a host with a previous set
          ansible.builtin.include_tasks: tasks/probe.yml
          vars:
            edge_firewall_probe_case:
              name: bad set over a previous set
              expect: rolled_back
              template: '{{ playbook_dir }}/files/closes_ssh_keeps_loopback.nft.j2'
              task: Connect to the host's own private address on the control port after the load
              marker: scenario bad set

        # The rollback itself failing. The previous file is made unloadable, so the restore
        # fails. What is left is the bad set, loaded: the host fails closed.
        - name: Make the active rules file unloadable, so that a restore from it must fail
          ansible.builtin.copy:
            content: "THIS IS NOT A RULES FILE\n"
            dest: /etc/branchleft-firewall/active.nft
            owner: root
            group: root
            mode: '0600'

        - name: Try a set that drops the control port when the restore must fail
          ansible.builtin.include_tasks: tasks/probe.yml
          vars:
            edge_firewall_probe_case:
              name: bad set with an unloadable previous set
              expect: restore_failed
              template: '{{ playbook_dir }}/files/closes_ssh_keeps_loopback.nft.j2'
              task: Connect to the host's own private address on the control port after the load
              marker: scenario bad set

    - name: Apply the role with the good set
      ansible.builtin.include_role:
        name: branchleft.edge_firewall

    # What the verify play compares Docker's stand-in rules with: the rules as they were before
    # the role, without the legacy masquerade rule the role removes. Written once, on the first
    # converge.
    - name: Read Docker's stand-in rules after the role
      ansible.builtin.include_tasks: tasks/docker_snapshot.yml
      when:
        - not edge_firewall_converge_active.stat.exists
        - not ansible_check_mode

    - name: Record the rules Docker's stand-in must still hold
      ansible.builtin.copy:
        content: >-
          {{
            edge_firewall_converge_docker_before
            | reject('match', '^-A POSTROUTING -s 10.20.1.0/24 -o ' ~ edge_firewall_scenario_uplink_dev ~ ' -j MASQUERADE$')
            | list
            | to_json
          }}
        dest: /run/edge-firewall-docker-expected.json
        owner: root
        group: root
        mode: '0600'
      when:
        - not edge_firewall_converge_active.stat.exists
        - not ansible_check_mode

    - name: Assert the role left Docker's stand-in rules as they were, less the legacy masquerade rule
      ansible.builtin.assert:
        that:
          - >-
            (edge_firewall_docker_now | join('\n'))
            == (edge_firewall_converge_docker_before
            | reject('match', '^-A POSTROUTING -s 10.20.1.0/24 -o ' ~ edge_firewall_scenario_uplink_dev ~ ' -j MASQUERADE$')
            | join('\n'))
        quiet: true
        fail_msg: >-
          Docker's stand-in rules differ from what they were before the role ran (less the legacy
          masquerade rule). The role, the package install or a unit flushed or changed them.
      when:
        - not edge_firewall_converge_active.stat.exists
        - not ansible_check_mode

    # Check mode must write nothing. On a fresh instance the role's run in check mode is the one
    # this checks: no package, no mask, no unit, no rules directory, no drop-in, and forwarding
    # not turned on.
    - name: Read what check mode left on a fresh instance
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - /usr/sbin/nft
        - /etc/systemd/system/nftables.service
        - /etc/systemd/system/branchleft-firewall.service
        - /etc/branchleft-firewall
        - /etc/sysctl.d/99-branchleft-nat.conf
        - /run/edge-firewall-sysctl-state/net.ipv4.ip_forward
      register: edge_firewall_converge_check_written
      when: ansible_check_mode and not edge_firewall_converge_active.stat.exists

    - name: Assert check mode wrote nothing on a fresh instance
      ansible.builtin.assert:
        that:
          - item.stat.exists == false
        quiet: true
        fail_msg: Check mode wrote {{ item.item }}, so a plan changed the host.
      loop: '{{ edge_firewall_converge_check_written.results }}'
      loop_control:
        label: '{{ item.item }}'
      when: ansible_check_mode and not edge_firewall_converge_active.stat.exists
