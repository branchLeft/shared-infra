# The roles each enrolled host's playbook may apply after the two pull roles (R2, R9).
# The owner merges every edit here (/ansible/checks/ in CODEOWNERS), so the reviewer App
# cannot widen what a pulled playbook runs as root. Rules and limits: checks/README.md.

# A role is named by its directory under ansible/roles/. The check does not look at
# that directory, so a name may be listed before its role merges. A host with no
# entry may apply the two pull roles and nothing else. Planned, not listed: control_plane_db.
