---
# Every host-state bash installer under a provision/ directory, and under hetzner/scripts.
# A new one fails the test in test_no_new_hand_installers.py until it is listed here.
# Reasons: stays-as-code (the script is code, not a hand path) or pending-role (it is
# to be replaced by the named role). A role name is read, not checked against
# ansible/roles/, so a role may be listed before its directory merges (as host_roles.yml).
# An entry whose script is gone fails the test too.
# The first is a vendored copy of a ghost-platform file, byte for byte and held to its
# sha256 by the role that installs it (demo1_egress_spool), so it is code the role
# places and not a hand path.
ansible/roles/demo1_egress_spool/files/ghost-platform/demo-host/provision/branchleft_demo_egress.sh:
  reason: stays-as-code
hetzner/provision/00-harden-ssh.sh:
  reason: pending-role
  role: host_baseline
hetzner/provision/05-configure-host-egress.sh:
  reason: pending-role
  role: egress_nat
