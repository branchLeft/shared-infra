# Overrides of the typed dummies, for a variable whose consumer needs a value of a shape the
# type does not give. Each entry declares its type; a unit test checks it against the role's
# argument_specs, and that the name is used by a role. An override sits where a host's own input
# sits, above the role's defaults and the vars files, so an owner's empty value does not replace
# it. The key and address below are throwaways: the key is a public half whose private half was
# deleted when it was made.
overrides:
  host_baseline_docker_arch:
    type: str
    value: amd64
  ci_jump_keys:
    type: list
    value:
      - key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF3xICRFpjKLiQq57/folErnf7oXJM0jK69qF5sHHm10 offline-render-dummy
  ci_jump_destinations:
    type: list
    value:
      - 192.0.2.20
  tunnel_account_in:
    type: dict
    value:
      from_address: 192.0.2.20
      db1_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF3xICRFpjKLiQq57/folErnf7oXJM0jK69qF5sHHm10 offline-render-dummy
      replica_host: 192.0.2.30
      replica_host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF3xICRFpjKLiQq57/folErnf7oXJM0jK69qF5sHHm10 offline-render-dummy
      db1_subnet_prefix: 10.0.0.
  nextcloud_stack_generated:
    type: dict
    value:
      results:
        - stdout: DUMMY_generated_1
        - stdout: DUMMY_generated_2
        - stdout: DUMMY_generated_3
  tunnel_account_db1_source_address:
    type: str
    value: 10.0.0.5
  # The numeric ids of the service account, read from the host's account database while the role
  # runs. Throwaway ids; getent gives them as text.
  safety_service_uid:
    type: str
    value: '990'
  safety_service_gid:
    type: str
    value: '990'
  # The numeric ids of the collector account, read from the host's account database while the
  # role runs. Throwaway ids; getent gives them as text.
  mail_collector_uid:
    type: str
    value: '991'
  mail_collector_gid:
    type: str
    value: '991'
  # The two host ports of the Sweego receiver, which the owner names. Throwaway numbers that
  # differ and are unprivileged, so the compose file validates (a dummy int would publish the
  # same port twice).
  sweego_receiver_port:
    type: int
    value: 18080
  sweego_receiver_drain_port:
    type: int
    value: 18081
