---
# The R1 findings of check_secret_no_log.py that the tree has today, once the taint follows set_fact
# copies and register results. Each entry is one task that names a tainted variable and lacks
# no_log (or diff: false), by file and task name. No line numbers and no variable chain, so an edit
# elsewhere does not churn this list.
# Shrink-only: a finding not listed here fails the check, and an entry that no longer fires fails
# it too (R5), so remove the entry in the change that fixes its task. Adding one is a rejected change.
ansible/roles/ci_jump/tasks/_guards.yml:
  - task: Stop if the module refused
    rule: no_log
  - task: Show the live files against the wanted ones
    rule: no_log
ansible/roles/ci_jump/tasks/_readback.yml:
  - task: Stop if the files or sshd are not what was wanted
    rule: no_log
ansible/roles/deploy_slot_keys/tasks/main.yml:
  - task: Stop if the module refused
    rule: no_log
ansible/roles/host_inputs/tasks/main.yml:
  - task: Refuse a file with a key that is not one of this host's inputs
    rule: no_log
  - task: Refuse a file with an input missing or empty
    rule: no_log
ansible/roles/tenant_compose/tasks/_stack.yml:
  - task: Deliver the image pin
    rule: no_log
  - task: Deliver the image pin
    rule: diff
ansible/roles/tenant_compose/tasks/main.yml:
  - task: Refuse every stack that breaks a rule, before anything is written
    rule: no_log
ansible/patterns/compose_stack/tasks/main.yml:
  - task: Work out whether the stack must be brought up
    rule: no_log
