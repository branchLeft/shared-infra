---
# mx1, the mail host. Three roles after the pull roles, no host_inputs: the host has no private
# inputs file, so the loader has nothing to read (R11 applies only when it is listed).
# host_baseline comes first for the Docker the stack needs. mail_reconcilers is on this list for
# its plain apply, which places programs and runs none; the host has no owner_vars file, so none
# of its steps can be requested through the pull (R10).
- host_baseline
- mx1_stack
- mail_reconcilers
