---
# Values for the pull_trigger role that every pulled host shares: the remote and
# the signer allowlist. Each host's own playbook (and its playbook allowlist) is
# in its group's directory (edge/, mx/). All are public values, and this file is
# the one copy of the trust anchor (group_vars/README.md).
#
# Scope of the signer decision: the owner's ruling on the signer key chose this
# key for edge1 only. Extending it to mx1 puts the same key in this shared file,
# so it applies to every pulled host. The owner's merge of the mx1 enrolment is
# the decision to extend it. The design round on the key itself is still open.
pull_trigger_remote_url: https://github.com/branchLeft/shared-infra.git
# The signer allowlist is the trust anchor of the pull: a commit of main that is
# signed by a key listed here is applied to the host as root. This is GitHub's own
# signing key for commits it makes (a web merge or a squash), OpenPGP fingerprint
# 968479A1AFF927E37D1A566BB5690EEEBB952194, taken from https://github.com/web-flow.gpg
# (the old key in that file, 5DE3E0509C47EA3CF04A42D34AEE18F83AFDEB23, expired in
# January 2024 and is deliberately not listed). Whoever can land a commit on main
# through GitHub gets that commit trusted here, so the protection of main is the
# protection of this host.
pull_trigger_signers:
  - format: openpgp
    key: |
