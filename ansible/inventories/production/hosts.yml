---
# The hosts the estate's Ansible manages, by logical name (inventories/README.md).
# No address appears here: where a name resolves is decided with the delivery
# trigger, and the one-time bootstrap passes the address on its command line.
all:
  children:
    edge:
      hosts:
        edge1: {}
        # edge-t, the tenants project's base host. The logical name has no hyphen
        # (checks/check_enrolment.py HOST_NAME); the server's name is edge-t.
        edget: {}
    db:
      hosts:
        db1: {}
